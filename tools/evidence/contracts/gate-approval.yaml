# Reusable Evidence Contract: Gate Approval
# Use when: A gate has been approved by a human and the run records the approval.
# Inherits: base-run.yaml
# Created: run032 (2026-05-06)

contract_id: gate-approval
current_state_authority: bundle-metadata  # run049: patched per docs/current-state-and-evidence-authority.md Section 6
version: "1.0"
inherits: base-run
description: "Reusable contract for gate approval runs. Ensures registry, taskcards, master plan, and approval evidence are present."

required_top_level_folders:
  - repo
  - bundle-metadata

forbidden_patterns:
  - ".git/**"
  - ".env"
  - ".local/**"
  - "**/ocal/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/text.txt"
  - "**/pages.jsonl"
  - "**/chunks.jsonl"
  - "**/embeddings/**"
  - "**/vector/**"
  - "**/*.faiss"
  - "**/*.sqlite"
  - "**/*.db"
  - "**/*.chroma/**"
  - "**/.DS_Store"
  - "**/*.env"
  - "**/node_modules/**"

min_metadata_count: 8

required_repo_files:
  - README.md
  - AGENTS.md
  - GOVERNANCE.md
  - plans/master-plan.md
  - registry/format-registry.yaml
  - .claude/settings.json

required_metadata_files:
  - run-summary.md
  - registry-check.txt
  - git-status-before-commit.txt
  - git-status-after-commit.txt
  - git-log.txt
  - self-challenge.md
  - verdict.md
