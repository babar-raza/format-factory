contract_id: "POST-FODT-GATE10-CONTROLLED-SWARM-001"
sprint_id: "POST-FODT-GATE10-CONTROLLED-SWARM-001"
description: >
  Controlled multi-lane swarm: Gate 10 approval audit (Lane A),
  ACCEL-003 two-pass auto-proof implementation (Lane B),
  S-F2F-05 ODF-flat family playbook (Lane C),
  DEC-033 and Gate 11 next-main-lane planning (Lane D),
  memory and governance sync (Lane M).

schema_version: "1.0"
created_at: "2026-05-12"
require_clean_git: true
min_metadata_count: 45

required_repo_files:
  # Lane A — Gate 10 audit
  - reports/audit/fodt/gate10-approval-and-faed6da-scope-audit-20260511.md
  - reports/audit/fodt/gate10-approval-and-faed6da-scope-audit-20260511.yaml
  # Lane B — ACCEL-003
  - tools/evidence/build_evidence_bundle.py
  - tests/evidence/test_auto_proof_bundle.py
  - taskcards/ACCEL-003-final-proof-two-pass-automation.md
  - reports/acceleration/evidence-final-proof-automation-implementation-20260511.md
  - reports/acceleration/evidence-final-proof-automation-implementation-20260511.yaml
  # Lane C — S-F2F-05
  - acquisition-packs/_families/odf-flat/playbook.yaml
  - acquisition-packs/_families/odf-flat/reuse-policy.md
  - acquisition-packs/_families/odf-flat/format-overrides.yaml
  - tests/playbook/test_odf_flat_family_playbook.py
  # Lane D — DEC-033 / Gate 11 planning
  - reports/planning/fodt/dec033-and-gate11-next-main-lane-20260512.md
  - reports/planning/fodt/dec033-and-gate11-next-main-lane-20260512.yaml
  - taskcards/DEC-033-resolution-execution-plan.md
  - taskcards/FODT-GATE11-readiness-execution-plan.md
  # Lane M — memory sync
  - memory/16-controlled-swarm-execution-and-acceleration-20260512.md

semantic_checks:
  - id: SC-001
    description: "ODF-flat family playbook has playbook_kind: family_playbook"
    file: acquisition-packs/_families/odf-flat/playbook.yaml
    contains: "playbook_kind: family_playbook"
  - id: SC-002
    description: "Reuse policy prohibits inherited gate approval"
    file: acquisition-packs/_families/odf-flat/reuse-policy.md
    contains: "inherited_gate_approval: false"
  - id: SC-003
    description: "Reuse policy references DEC-034"
    file: acquisition-packs/_families/odf-flat/reuse-policy.md
    contains: "DEC-034"
  - id: SC-004
    description: "build_evidence_bundle.py has auto_proof function"
    file: tools/evidence/build_evidence_bundle.py
    contains: "build_auto_proof_bundle"
  - id: SC-005
    description: "build_evidence_bundle.py has --auto-proof flag"
    file: tools/evidence/build_evidence_bundle.py
    contains: "--auto-proof"
  - id: SC-006
    description: "ACCEL-003 taskcard is completed"
    file: taskcards/ACCEL-003-final-proof-two-pass-automation.md
    contains: "completed"
  - id: SC-007
    description: "Gate 10 audit confirms Gate 10 VALID"
    file: reports/audit/fodt/gate10-approval-and-faed6da-scope-audit-20260511.md
    contains: "GATE10_VALID"
  - id: SC-008
    description: "DEC-033 planning report recommends Option B"
    file: reports/planning/fodt/dec033-and-gate11-next-main-lane-20260512.md
    contains: "Option B"
  - id: SC-009
    description: "Lane C produced format-overrides with all 5 formats"
    file: acquisition-packs/_families/odf-flat/format-overrides.yaml
    contains: "fods:"
  - id: SC-010
    description: "format-overrides has FODP candidate_only"
    file: acquisition-packs/_families/odf-flat/format-overrides.yaml
    contains: "candidate_only"

forbidden_patterns:
  - "src/net/fods"
  - "src/net/fodt"
  - "PENDING"
