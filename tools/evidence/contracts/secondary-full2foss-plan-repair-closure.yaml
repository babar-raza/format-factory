contract_id: secondary-full2foss-plan-repair-closure
description: Closure verification for S-F2F-00 secondary plan-repair sprint. Independently
  verifies the prior bundle, repairs evidence defects, and confirms CLOSED_VERIFIED status.
  Planning documents only. No implementation. No gate changes. No product source.
created_run: secondary-plan-repair-closure-sprint
plan_repair_only: true
require_clean_git: true
emergency_blocker_bundle: false
current_state_authority: bundle-metadata
min_metadata_count: 45

# Note on placeholder source readmes:
# src/python/_readme.md and src/dotnet/_readme.md are pre-existing placeholder files,
# not product source. They are intentionally allowed and not listed as forbidden.
# Only actual product format source directories are forbidden (fods/, fodt/, etc.)

required_repo_files:
  - plans/secondary/full2foss-inspired-plan-repair-review.md
  - plans/secondary/full2foss-inspired-system-strengthening-plan-v2.md
  - plans/master-plan.md
  - taskcards/S-F2F-00-repair-secondary-plan.md
  - taskcards/S-F2F-01-playbook-schema-and-policy.md
  - taskcards/S-F2F-02-playbook-validation-only.md
  - taskcards/S-F2F-03-dry-run-replay-and-review-queue.md
  - taskcards/S-F2F-04-golden-dry-run-tests.md
  - taskcards/S-F2F-05-odf-flat-family-playbook.md
  - taskcards/S-F2F-06-apply-mode-risk-review.md
  - taskcards/S-F2F-07-product-dependency-closure-design.md
  - taskcards/S-F2F-08-product-skeleton-stub-design.md
  - AGENTS.md
  - GOVERNANCE.md
  - docs/acquisition-workflow.md
  - docs/current-state-and-evidence-authority.md
  - tools/evidence/contracts/secondary-full2foss-plan-repair.yaml
  - tools/evidence/contracts/secondary-full2foss-plan-repair-closure.yaml

forbidden_patterns:
  - .git/
  - .env
  - .local/
  - "*.pyc"
  - __pycache__/
  - tools/playbook/
  - schemas/playbook/
  - schemas/product/
  - tools/product/
  - acquisition-packs/_families/
  - tests/playbook/
  - plans/review-queues/
  - docs/playbook-layer.md
  - docs/product-dependency-closure.md
  - docs/python-product-closure-strategy.md
  - docs/dotnet-product-closure-strategy.md
  - docs/product-skeleton-generator.md
  # Forbid actual product format source (NOT placeholder _readme.md files):
  - "src/python/fods/"
  - "src/python/fodt/"
  - "src/dotnet/fods/"
  - "src/dotnet/fodt/"
  - "src/net/"

checks:
  no_gate_status_changed: true
  no_product_source_created: true
  no_parser_created: true
  no_neutral_model_created: true
  no_playbook_tools_created: true
  no_product_tools_created: true
  no_samples_created: true
  no_endpoint_call: true
  no_new_spec_download: true
  no_embedding_vector_db: true
  no_implementation_code_added: true
  no_main_sprint_deviation: true
  no_push: true

required_metadata_files:
