contract_id: FF-PLAN-CONTROL-001
version: "1.0"
description: >-
  Blocker bundle for the independently verified branch-local Plan Control
  implementation. SCM closure and shared activation are blocked by inherited
  repository governance failures and active product integration ownership.
current_state_authority: bundle-metadata
required_top_level_folders:
  - repo
  - bundle-metadata
forbidden_patterns:
  - ".git/**"
  - ".env"
  - ".local/**"
  - "**/ocal/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/*.sqlite"
  - "**/*.db"
  - "**/node_modules/**"
require_clean_git: false
emergency_blocker_bundle: true
normal_pass_min_metadata: 30
min_metadata_count: 30
required_repo_files:
  - .claude/commands/plan-control.md
  - .claude/commands/command-registry.yaml
  - .supervisor/skill-registry.yaml
  - .supervisor/skill-command-registry-sync-report.yaml
  - .supervisor/skill-contract-validation-results.yaml
  - .supervisor/duplicate-skill-report.yaml
  - plans/layers/index.yaml
