# Base Evidence Bundle Contract
# All sprint runs inherit these rules.
# Format: YAML
# Version: 1.3
# Created: run031 (2026-05-06)
# Version: 1.4 (run048: REQUIRED_METADATA_DEPTH check)
# Updated: run041 (2026-05-07) — added current_state_authority field; git metadata auto-generated
# Updated: run042 (2026-05-08) — raised min_metadata_count to 30 (normal PASS depth requirement);
#          added normal_pass_min_metadata field; clarified .env.example policy;
#          emergency_blocker_bundle exception: low metadata only for BLOCKED/FAIL bundles
# Updated: run046 (2026-05-08) — REGRESSION: floor lowered to 4 (INCORRECT — reversed by run047)
# Updated: run047 (2026-05-08) — floor RESTORED to 30; added RUN_CONTRACT_MINIMUM_NOT_BELOW_BASE check;
# Updated: run048 (2026-05-08) — added REQUIRED_METADATA_DEPTH_MINIMUM_NAMED = 10;
#          run contracts MUST set min_metadata_count >= 30 (RUN_CONTRACT_METADATA_FLOOR);
#          contracts with min_metadata_count < 30 FAIL validation unless emergency_blocker_bundle: true

contract_id: base-run
version: "1.4"
description: "Base contract for all format-factory evidence bundles."

# Current-state authority policy (run041+)
# Exact final Git HEAD is recorded in bundle-metadata/git-log.txt and git-status-final.txt.
# Repo files record last_completed_run, last_verified_run, run_commit_set (informational).
# Repo files must not contain "Latest commit: PENDING" in final committed state.
# See docs/governance/current-state-and-evidence-authority.md
current_state_authority: bundle-metadata

# Required top-level folders in the zip (exactly these, no others)
required_top_level_folders:
  - repo
  - bundle-metadata

# Forbidden path patterns (glob-style, matched against zip entry paths)
# Any match causes BUNDLE_VALIDATION: FAIL
#
# .env.example POLICY (run042):
#   .env.example is a safe template file committed to the repo (explicitly un-ignored in .gitignore).
#   It MUST NOT be excluded from evidence bundles.
#   Forbidden pattern ".env" catches ".env.example" only if the validator uses wildcard expansion.
#   The validator (run042+) uses exact matching for patterns without wildcards.
#   So ".env" forbids the file named exactly ".env" but NOT ".env.example".
#   Pattern "**/*.env" similarly forbids files ending in ".env" but NOT ".env.example".
#   This policy is explicit and tested. See tests/evidence/test_env_example_handling.py.
forbidden_patterns:
  - ".git/**"
  - ".env"
  - ".local/**"
  - "**/ocal/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/text.txt"
  - "**/pages.jsonl"
  - "**/chunks.jsonl"
  - "**/embeddings/**"
  - "**/vector/**"
  - "**/*.faiss"
  - "**/*.sqlite"
  - "**/*.db"
  - "**/*.chroma/**"
  - "**/.DS_Store"
  - "**/*.env"
  - "**/node_modules/**"

# Git cleanliness requirement (default: true — all normal runs must have clean working tree)
# Set emergency_blocker_bundle: true ONLY for documented blocker/failed bundles with dirty git.
require_clean_git: true
emergency_blocker_bundle: false

# Minimum metadata files required (run042+)
# normal_pass_min_metadata: absolute floor for BUNDLE_VALIDATION: PASS on normal (non-blocker) runs.
#   Any normal PASS bundle with fewer metadata files than this value fails validation.
#   This prevents thin bundles (like run041's 5-file bundle) from passing.
# min_metadata_count: effective threshold for this contract (may be higher than the floor).
#   For run-specific contracts, set to the actual count for that sprint.
#   Must be >= normal_pass_min_metadata unless emergency_blocker_bundle: true.
normal_pass_min_metadata: 30
min_metadata_count: 30

# Required repo files (paths relative to repo/ in the zip)
required_repo_files: []

# Required metadata files (paths relative to bundle-metadata/ in the zip)
# git-log.txt and git-status-final.txt are auto-generated by build_evidence_bundle.py
# and are the authoritative records of the exact final Git HEAD (run041+).
required_metadata_files:
  - git-log.txt
  - git-status-final.txt
  - bundle-manifest.yaml
