  - taskcards/TC-0030-fodt-gate2-spec-legal-evidence.md
  - acquisition-packs/_candidate-shortlists/fodt-gate1-human-review-packet.md
  - acquisition-packs/fodt/pack.yaml
  - acquisition-packs/fodt/spec-evidence.md
  - acquisition-packs/fodt/legal-notes.md
  - acquisition-packs/fodt/sample-sources.md
  - acquisition-packs/fodt/parser-notes.md
  - acquisition-packs/fodt/gate2-planning.md
  # Updated governance files
