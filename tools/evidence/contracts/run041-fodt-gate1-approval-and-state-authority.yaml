# Evidence Bundle Contract — run041
# Sprint: FODT Gate 1 approval + stable run-state authority model
# Created: 2026-05-07 (run041)

contract_id: run041-fodt-gate1-approval-and-state-authority
version: "1.0"
description: >
  Evidence contract for run041: FODT Gate 1 approval (Babar Raza, 2026-05-07),
  FODT acquisition skeleton, stable run-state authority model (replaces
  self-referential commit-hash model), FODS Gate 6 7th consecutive preflight
  FAIL, FODS Gate 5 neutral model verification.

# Current-state authority: exact final Git HEAD is in bundle-metadata only
current_state_authority: bundle-metadata

# Top-level folders
required_top_level_folders:
  - repo
  - bundle-metadata

# Forbidden patterns (inherits from base-run.yaml)
forbidden_patterns:
  - ".git/**"
  - ".env"
  - ".local/**"
  - "**/ocal/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/text.txt"
  - "**/pages.jsonl"
  - "**/chunks.jsonl"
  - "**/embeddings/**"
  - "**/vector/**"
  - "**/*.faiss"
  - "**/*.sqlite"
  - "**/*.db"
  - "**/.DS_Store"
  - "**/*.env"
  - "**/node_modules/**"

require_clean_git: true
emergency_blocker_bundle: false

min_metadata_count: 5

required_metadata_files:
  - git-log.txt
  - git-status-final.txt

required_repo_files:
  # New/updated run041 files
  - docs/current-state-and-evidence-authority.md
