require_clean_git: false
emergency_blocker_bundle: true
dirty_git_reason: >
  Working tree has LF/CRLF line-ending differences (git autocrlf) in previously
  committed files and untracked files from other sprint streams. No content
  changes in M files. All memory sprint content committed. All three repair
  contracts committed before this IV bundle was built.

memory_sprint: true
independent_verification: true
target_bundle_sprint_id: memory-ai-direction-sync-closure-repair-003
target_bundle_contract: tools/evidence/contracts/memory-ai-direction-sync-closure-repair-003.yaml

verification_verdict: MEMORY_AI_DIRECTION_SYNC_CLOSURE_REPAIR_V3_IV_PASS_WITH_METADATA_NOTE

repair_001_contract_tracked: true
