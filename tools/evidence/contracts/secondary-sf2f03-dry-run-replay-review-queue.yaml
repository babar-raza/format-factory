contract_id: secondary-sf2f03-dry-run-replay-review-queue
description: >
  S-F2F-03 Dry-Run Replay Engine and Review Queue Export: implement three read-only tools
  (replay_acquisition_playbook.py modes validate/dry-run/explain/export-review-queue;
  diff_playbook_outputs.py; export_review_queue.py) with full test coverage. Apply mode
  is explicitly rejected. No file mutations to repo from dry-run execution.
  No gate state changes. No product source. No MAIN SPRINT deviation.
  Strengthened in S-F2F-03-VERIFY-001: min_metadata_count raised to 55,
  required_metadata_files expanded to 39 entries, checks expanded to 25.
created_run: secondary-sf2f03-dry-run-replay-review-queue
