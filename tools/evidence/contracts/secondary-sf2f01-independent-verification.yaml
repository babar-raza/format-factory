contract_id: secondary-sf2f01-independent-verification
description: >
  S-F2F-01B evidence contract. Independent verification and closure of S-F2F-01
  Playbook Schema and Policy sprint. Verification-only — no new schemas, no tools,
  no replay engine, no apply mode, no acquisition-pack playbooks, no product source.
  Closes S-F2F-01 as CLOSED_VERIFIED. Supersedes prior S-F2F-01 bundle which had
  PENDING markers in final metadata.
created_run: secondary-sf2f01-independent-verification
secondary_sprint: true
sf2f_taskcard: S-F2F-01
verification_only: true
plan_repair_only: false
require_clean_git: true
emergency_blocker_bundle: false
current_state_authority: bundle-metadata
min_metadata_count: 60

# S-F2F-01B specific checks
no_sf2f02_started: true
no_playbook_tools_created: true
no_replay_engine_created: true
no_apply_mode_created: true
no_acquisition_pack_playbooks_created: true
no_family_playbook_created: true
no_product_source_created: true
