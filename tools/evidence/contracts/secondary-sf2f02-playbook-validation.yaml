contract_id: secondary-sf2f02-playbook-validation
description: >
  S-F2F-02 Playbook Validation Tool sprint. Creates a minimal, read-only Python validator
  for acquisition playbook YAML files. No replay engine, no apply mode, no review queues,
  no acquisition-pack playbooks, no MAIN SPRINT gate state changes.
  Subordinate secondary sprint — MAIN SPRINT remains the only active delivery path.
created_run: secondary-sf2f02-playbook-validation
sprint_id: S-F2F-02
executed: "2026-05-08"
plan_repair_only: false
require_clean_git: true
emergency_blocker_bundle: false
current_state_authority: bundle-metadata
min_metadata_count: 70
no_push: true

required_repo_files:
  - tools/playbook/__init__.py
  - tools/playbook/validate_playbook.py
  - tests/playbook/__init__.py
  - tests/playbook/test_playbook_schema.py
  - tests/playbook/fixtures/valid-acquisition-playbook.yaml
  - tests/playbook/fixtures/invalid-missing-required-field.yaml
  - tests/playbook/fixtures/invalid-forbidden-authority.yaml
  - tests/playbook/fixtures/valid-review-queue.yaml
  - tests/playbook/fixtures/invalid-review-queue-missing-items.yaml
  - docs/playbook-layer.md
  - AGENTS.md
