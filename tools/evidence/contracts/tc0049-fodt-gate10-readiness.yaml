  - no-fodt-tests-check.md
  - no-dotnet-source-check.md
  - no-gate11-pass-check.md
  - no-tc0052-execution-check.md
  - dec033-status-check.md
  - no-llm-call-check.md
  - no-embedding-vector-db-check.md
  - no-playbook-replay-check.md
  - no-push-check.md
  - files-reviewed.txt
  - files-created.txt
  - files-modified.txt
  - git-status-before.txt
  - git-status-after.txt
  - git-status-final.txt
  - git-log.txt
  - evidence-contract-validation-report.md
  - bundle-manifest.yaml
  - final-state-summary.yaml
  - final-bundle-validation-proof.txt
  - verdict.md

forbidden_patterns:
  - "repo/src/python/fodt/**"
  - "repo/src/net/**"
  - "repo/reports/legal/**"
  - ".git/**"
  - ".env"
  - ".local/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/text.txt"
  - "**/pages.jsonl"
  - "**/chunks.jsonl"

# Semantic checks
checks:
  sprint_id_is_tc0049: true
  target_format_is_fodt: true
  gate10_readiness_verified: true
  fodt_ful_validation_pass: true
  facts_have_provenance: true
  requirements_trace_to_facts: true
  parser_strategy_ready: true
  security_surface_ready: true
  product_readiness_consistent: true
  tc0049_completed_or_transitioned: true
  tc0052_not_started: true
  no_fodt_source_created: true
  no_fodt_tests_created: true
  no_dotnet_source_created: true
  gate11_not_passed: true
  dec033_unchanged: true
  no_llm_call: true
  no_embedding_vector_db: true
  no_playbook_replay: true
  no_push: true
