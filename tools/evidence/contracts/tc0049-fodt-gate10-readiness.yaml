  - acquisition-packs/fodt/security-surface.yaml
  - acquisition-packs/fodt/product-readiness.yaml
  - acquisition-packs/fodt/tier-map.yaml
  - tools/evidence/contracts/tc0049-fodt-gate10-readiness.yaml

required_metadata_files:
  - phase0-baseline-authority-check.md
  - phase1-fodt-ful-validation-report.md
  - phase1-fodt-facts-review.md
  - phase1-fodt-requirements-review.md
  - phase1-fodt-parser-strategy-review.md
  - phase1-fodt-security-surface-review.md
  - phase1-fodt-product-readiness-review.md
  - phase2-gate10-requirements-map.md
  - phase3-readiness-repair-report.md
  - phase4-state-transition-report.md
  - phase5-validation-command-log.md
  - phase5-fodt-ful-validation-final.md
  - phase5-current-state-consistency-final.md
  - phase5-format-understanding-tests.md
  - phase5-evidence-tests.md
  - phase6-no-scope-drift-report.md
