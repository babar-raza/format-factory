# Evidence Bundle Contract -- TC-0049 FODT Gate 10 Readiness
# Governs the TC-0049 FODT Gate 10 planning verification evidence bundle.
# Version: 1.0
# Created: TC-0049-FODT-GATE10-EXECUTION (2026-05-09)

contract_id: tc0049-fodt-gate10-readiness
version: "1.0"
description: "TC-0049 -- FODT Gate 10 planning prerequisites verified; TC-0049 completed; TC-0052 planning_ready"

inherits: base-run

require_clean_git: true
emergency_blocker_bundle: false

min_metadata_count: 35

required_repo_files:
  - registry/format-registry.yaml
  - plans/master-plan.md
  - taskcards/TC-0049-fodt-gate10-oss-readiness.md
