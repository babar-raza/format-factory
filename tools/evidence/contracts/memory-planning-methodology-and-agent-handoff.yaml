# Purpose: Capture local planning methodology, execution handoff standard, prompt templates,
#          fresh-chat continuity brief, and user preferences into durable local repo artifacts.
#          No MAIN SPRINT gate changes. No secondary implementation. No product source.
#          No embeddings. No LLM production calls.

contract_id: memory-planning-methodology-and-agent-handoff
version: "1.0"
sprint_type: memory_sprint
description: "Memory methodology sprint: planning methodology + execution handoff standard + plan hardening checklist + prompt templates + fresh-chat continuity brief + memory/12 + commands. No gate changes. No product source."

# Current-state authority policy (run041+)
current_state_authority: bundle-metadata

# Git state: DIRTY with MAIN_SPRINT_OWNED files (tests/playbook/, tools/playbook/, .claude/settings.json).
# These are uncommitted run048 changes. Memory sprint commits only MEMORY_SPRINT_ALLOWED files.
# Clean git not achievable without staging MAIN_SPRINT_OWNED files.
# This mirrors the original memory sprint pattern. Normalize via closure hygiene after MAIN SPRINT commit.
require_clean_git: false
emergency_blocker_bundle: true
dirty_git_reason: "Working tree contains uncommitted MAIN_SPRINT_OWNED run048 changes (tests/playbook/, tools/playbook/, .claude/settings.json). Memory sprint commits only MEMORY_SPRINT_ALLOWED files. Classified: MAIN_SPRINT_OWNED -- do not stage or revert."

