validation_checks:
  - id: gate5_verified
    description: "Registry gate_5.status is 'neutral_model_verified_pending_human_review'"
  - id: gate5_not_approved
    description: "Registry gate_5.approved_by is null"
  - id: tc0024_passed
    description: "TC-0024 status is 'verification_passed_pending_human_review'"
  - id: no_gate5_approval
    description: "No agent has approved Gate 5"
  - id: no_gate6_execution
    description: "No Gate 6 execution has occurred"
  - id: model_entities
    description: "model.yaml defines 6 entities"
  - id: validation_pass
    description: "validate_neutral_model.py runs 4/4 PASS against samples"
  - id: thin_bundle_rejected
    description: "Evidence system correctly rejects thin bundles (negative test)"
