  # --- Evidence system (hardened run034) ---
  - path: tools/evidence/build_evidence_bundle.py
    must_exist: true
  - path: tools/evidence/validate_evidence_bundle.py
    must_exist: true

  # --- Gate 5 review packet (NEW run034) ---
  - path: acquisition-packs/fods/gate5-human-review-packet.md
