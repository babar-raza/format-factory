  - path: .claude/settings.json
    must_exist: true
  - path: memory/09-current-state-before-phase1.md
    must_exist: true

  # --- Evidence contract (self) ---
  - path: tools/evidence/contracts/run034-gate5-verification-gate6-planning.yaml
    must_exist: true

