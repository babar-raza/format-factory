contract_id: secondary-sf2f02b-independent-verification-and-closure
description: >
  S-F2F-02B Independent Verification and Permanent Closure of S-F2F-02.
  Independently verifies S-F2F-02 evidence bundle, repairs schema gap
  (not_for_execution added to acquisition-playbook.schema.json), strengthens
  validator (--engine option, honest engine reporting, deprecated API fix),
  expands tests to 42/42 PASS (both engines, docs example full JSON Schema),
  repairs overbroad forbidden path in evidence contract, updates taskcard to
  CLOSED_VERIFIED, and updates plan-v2 and master-plan. No replay engine,
  no apply mode, no review queue, no acquisition-pack playbooks, no product
  source, no MAIN SPRINT gate state changes, no push.
  Subordinate secondary sprint — MAIN SPRINT remains the only active delivery path.
