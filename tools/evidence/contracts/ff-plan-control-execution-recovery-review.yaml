contract_id: FF-PLAN-CONTROL-EXECUTION-RECOVERY-REVIEW-001
version: "1.0"
description: >-
  Targeted independent-review inventory for the FF6 execution-recovery route.
  It packages updated plans/taskcards, immutable current control/product truth,
  relevant runtime/source evidence, governance, and validation metadata. It is
  not product, controller, gate, or runtime activation evidence.
bundle_kind: independent_plan_review
require_clean_git: false
allow_preexisting_planning_changes: true
forbidden_patterns:
