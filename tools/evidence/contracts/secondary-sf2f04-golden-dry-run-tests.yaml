contract_id: secondary-sf2f04-golden-dry-run-tests
description: >
  S-F2F-04 Golden Dry-Run Tests: add deterministic golden test coverage for the
  replay engine. Creates tests/playbook/golden/ with 7 golden fixtures,
  three new golden test files (test_replay_golden.py, test_diff_golden.py,
  test_review_queue_golden.py), a FODT format-agnostic fixture, and
  tools/playbook/create_golden_case.py. No apply mode. No repo mutations.
  No gate status changes. No MAIN SPRINT deviation.
created_run: secondary-sf2f04-golden-dry-run-tests
sprint_id: S-F2F-04
executed: "2026-05-09"
plan_repair_only: false
require_clean_git: true
emergency_blocker_bundle: false
current_state_authority: bundle-metadata
min_metadata_count: 25
no_push: true

required_repo_files:
  - tests/playbook/golden/replay-valid-dry-run.expected.yaml
  - tests/playbook/golden/replay-missing-inputs-dry-run.expected.yaml
  - tests/playbook/golden/replay-fodt-valid-dry-run.expected.yaml
  - tests/playbook/golden/replay-explain-fods.expected.txt
  - tests/playbook/golden/diff-unchanged.expected.yaml
  - tests/playbook/golden/diff-regression.expected.yaml
  - tests/playbook/golden/diff-improvement.expected.yaml
  - tests/playbook/golden/review-queue-missing-inputs.expected.yaml
  - tests/playbook/fixtures/replay-fodt-valid.yaml
  - tests/playbook/test_replay_golden.py
  - tests/playbook/test_diff_golden.py
  - tests/playbook/test_review_queue_golden.py
  - tools/playbook/create_golden_case.py
  - tools/evidence/contracts/secondary-sf2f04-golden-dry-run-tests.yaml
  - taskcards/S-F2F-04-golden-dry-run-tests.md
