contract_id: secondary-sf2f01-playbook-schema-policy
description: >
  S-F2F-01 evidence contract. Playbook schema and policy sprint. Creates
  schemas/playbook/acquisition-playbook.schema.json,
  schemas/playbook/review-queue.schema.json, docs/playbook-layer.md, and
  docs/examples/acquisition-playbook-fods-documentation-example.yaml.
  No replay tools, no apply mode, no acquisition-pack playbooks, no product source,
  no gate status changes.
created_run: secondary-sf2f01-playbook-schema-policy
secondary_sprint: true
sf2f_taskcard: S-F2F-01
schema_policy_only: true
plan_repair_only: false
require_clean_git: true
emergency_blocker_bundle: false
current_state_authority: bundle-metadata
min_metadata_count: 50

# S-F2F-01 specific checks
no_playbook_tools_created: true
no_replay_engine_created: true
no_apply_mode_created: true
no_acquisition_pack_playbooks_created: true
no_family_playbook_created: true
no_product_source_created: true
no_gate_status_changed: true
no_main_sprint_deviation: true
no_endpoint_call: true
no_new_spec_download: true
no_push: true

