# Validator Manifest — Single Source of Truth for Expected Governance Validators
# ============================================================================
#
# Purpose: Declares every governance validator grouped by the module it is
#          imported from in governance_validator_runner.py.
#
# Count contract:
#   expected_count = sum of each module's `count` field = 245
#   This MUST equal _EXPECTED_VALIDATOR_COUNT in governance_validator_runner.py.
#
# Count mechanics:
#   The runner achieves 245 results via two mechanisms:
#   1. Explicit calls — validators directly called in run_all_governance_validators()
#   2. _VALIDATOR_REGISTRY auto-discovery — the registry loop adds validators
#      from imported modules not already in results (dedup by fn.__name__).
#      Due to a known dedup asymmetry (the explicit result's "validator" field
#      often differs from fn.__name__), 32 validators are counted twice.
#      These are tracked per-module under `registry_dedup_additions`.
#
# How to add a validator:
#   1. Add the validator ID to the appropriate module's `validators` list below.
#   2. Increment that module's `count` by 1.
#   3. The runner's _EXPECTED_VALIDATOR_COUNT must be updated to match
#      the new total (sum of all `count` fields).
#
# Per-file validators (V111-V113, V117-V118, V121, V123-V124, V126-V127):
#   These run per changed source file and add variable result counts.
#   They are NOT included in the expected_count baseline (245 is the minimum
#   achieved with changed_files=[]). The count check treats >245 as a WARNING,
#   not a failure. Per-file validators are listed under ext4_per_file for
#   documentation but do NOT contribute to expected_count.
#
# Generated: 2026-07-16
# Runner: governance_validator_runner.py (line 131)
