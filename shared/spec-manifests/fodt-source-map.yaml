# FODT Source-to-Spec Manifest
# Maps legacy model classes to their canonical spec QName equivalents.
#
# CRITICAL NOTES:
# - FodtParagraph, FodtSpan, FodtDocument are in src/python/fodt/models.py (VERIFIED)
# - neutral_model.py is a DICT BUILDER (build_document, make_warning, validate_document) — NOT the class layer
# - FodtDocument is a PUBLIC FACADE over the neutral model dict — not a spec class, stays in models.py permanently
# - FodtBody exists ONLY in .NET (src/net/fodt/Model/FodtBody.cs) — Python has NO FodtBody class
#
# Migration status lifecycle: pending → in_progress → complete
# compat.py switches from models.py → spec/ only after spec/ stubs reach status: implemented

python_classes:
  - legacy_class: FodtParagraph
    file: "src/python/fodt/models.py"
    canonical: "Text.Paragraph"
    qname: "text:p"
    spec_fact_ref: "FACT-FODT-003"
    status: facade_only
    migration_status: pending
    notes: >
      Has .kind, .text, .style_name, .outline_level, .spans properties.
      Wraps a block dict from neutral_model.build_document() output.
      Preserve until Text.Paragraph in spec/ reaches status: implemented
      AND test_compat_bootstrap.py proves behavioral equivalence.

  - legacy_class: FodtSpan
    file: "src/python/fodt/models.py"
    canonical: "Text.Span"
    qname: "text:span"
    spec_fact_ref: "FACT-FODT-006"
    status: facade_only
    migration_status: pending
    notes: >
      Has .text property. Wraps a span dict.
      Preserve until Text.Span in spec/ is implemented and equivalence proven.

  - legacy_class: FodtDocument
    file: "src/python/fodt/models.py"
    canonical: null
    qname: null
    spec_fact_ref: null
    status: public_facade
    migration_status: keep_as_facade
    notes: >
      FodtDocument is the PUBLIC FACADE wrapping the neutral model dict.
      It is NOT a spec class. Contains .paragraphs, .metadata, etc. properties.
      Stays in models.py permanently — it is the user-facing API object.
      No QName mapping because it represents the document as a whole, not a single XML element.

dotnet_classes:
  - legacy_class: FodtBody
    file: "src/net/fodt/Model/FodtBody.cs"
    canonical: "Office.Body"
    qname: "office:body"
    spec_fact_ref: "FACT-FODT-002"
    status: facade_only
    migration_status: pending
    notes: >
      Wraps XElement; has real .Paragraphs property filtering text:p and text:h elements.
      Keep until Spec/Office/Body.cs reaches status: implemented.
      NO Python equivalent — Python represents body through FodtDocument (public facade).

  - legacy_class: FodtParagraph
    file: "src/net/fodt/Model/FodtParagraph.cs"
    canonical: "Text.Paragraph"
    qname: "text:p"
    spec_fact_ref: "FACT-FODT-003"
    status: facade_only
    migration_status: pending
    notes: >
      .NET model class for paragraphs. Keep until Text.Paragraph in Spec/Text/ is implemented.

# Closure criteria for this format:
# 1. All 9 QNames in shared/qname-registry/fodt.yaml reach status: implemented or stable
# 2. compat.py imports from spec/ (not models.py)
# 3. Tests prove compat.py classes behaviorally equivalent to models.py classes
# 4. generate_canonical_stubs.py can delete and regenerate spec/ with zero semantic diff
