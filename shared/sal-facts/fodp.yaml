facts:
- fact_id: SAL-FODP-00001
  qname: FACT-FODP-001
  claim: FODP root element is <office:document> which serves as the top-level document container for flat
    OpenDocument presentation documents
  verification_status: verified_with_note
  provenance:
    format_id: fodp
    spec_id: odf-1.3
    section_id: '3.1.2'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 3.1.2: The <office:document> element is the root
      element for single-XML-file ODF documents. It combines content, styles, metadata, and settings in
      one file. Namespace: urn:oasis:names:tc:opendocument:xmlns:office:1.0.'
    confidence: high
  claim_id: FACT-FODP-001
- fact_id: SAL-FODP-00002
  qname: FACT-FODP-002
  claim: FODP document body is contained in <office:body> element which is a required child of the root element
  verification_status: verified_with_note
  provenance:
    format_id: fodp
    spec_id: odf-1.3
    section_id: '3.3'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 3.3: <office:body> is the container for the document
      content. It must appear exactly once as a child of <office:document>.'
    confidence: high
  claim_id: FACT-FODP-002
- fact_id: SAL-FODP-00003
  qname: FACT-FODP-003
  claim: FODP presentation content is wrapped in <office:presentation> element inside <office:body>
  verification_status: verified_with_note
  provenance:
    format_id: fodp
    spec_id: odf-1.3
    section_id: '3.6'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 3.6: The <office:presentation> element identifies
      the document as a presentation. It is the sole child of <office:body> in presentation documents.'
    confidence: high
  claim_id: FACT-FODP-003
- fact_id: SAL-FODP-00004
  qname: FACT-FODP-004
  claim: FODP slide element is <draw:page> representing a single presentation slide within <office:presentation>
  verification_status: verified_with_note
  provenance:
    format_id: fodp
    spec_id: odf-1.3
    section_id: '10.2.4'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 10.2.4: <draw:page> represents a presentation slide.
      draw:name attribute provides a unique name. draw:master-page-name references the slide master layout.'
    confidence: high
  claim_id: FACT-FODP-004
- fact_id: SAL-FODP-00005
  qname: FACT-FODP-005
  claim: FODP presentation notes element is <presentation:notes> attached to a slide for speaker notes content
  verification_status: verified_with_note
  provenance:
    format_id: fodp
    spec_id: odf-1.3
    section_id: '10.2.5'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 10.2.5: <presentation:notes> is a child of
      <draw:page>. Contains <draw:frame> with <draw:text-box> holding the notes text as <text:p> paragraphs.'
    confidence: high
  claim_id: FACT-FODP-005
- fact_id: SAL-FODP-00006
  qname: FACT-FODP-006
  claim: FODP text frame element is <draw:frame> containing <draw:text-box> for text placeholders on slides
