  qname: FACT-PGM-009
  element_qname: pgm:value-semantics
  claim: "A gray value of zero is black; a value of Maxval represents CIE D65 white and the most intense value in the image"
  section: "pgm.html#format"
  authority: "Netpbm format specification (netpbm.sourceforge.net)"
  source: structural_fact_manual
  fact_status: verified
  provenance:
