    added_at: '2026-07-17'
    verification_evidence: "Netpbm pgm(5): \"Each gray value is represented in pure binary by either 1 or 2 bytes. If the Maxval is less than 256, it is 1 byte. Otherwise, it is 2 bytes.\""
