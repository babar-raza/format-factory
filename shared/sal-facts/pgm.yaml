- fact_id: SAL-PGM-00006
  qname: FACT-PGM-006
  element_qname: pgm:raster
  claim: 'PGM raster is width*height gray samples in row-major order: P2 stores ASCII decimals, P5 stores
    1 byte per sample when maxval < 256 else 2 bytes big-endian'
