  element_qname: pgm:raster-raw
  claim: "In the raw P5 format each gray value is represented in pure binary by either 1 byte (when Maxval is less than 256) or 2 bytes"
  section: "pgm.html#format"
  authority: "Netpbm format specification (netpbm.sourceforge.net)"
  source: structural_fact_manual
  fact_status: verified
  provenance:
    spec_id: netpbm-pgm-spec
    section_id: "pgm.html#format"
    extraction_method: structural_derivation
