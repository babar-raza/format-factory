- fact_id: SAL-XLIFF-00001
  qname: FACT-XLIFF-001
  element_qname: xliff:file
  claim: An XLIFF 2.0 document is rooted at <xliff> (namespace urn:oasis:names:tc:xliff:document:2.0) with required
    version and srcLang attributes; it contains one or more <file> elements each holding translation units
  section: OASIS XLIFF 2.0 — document and file elements
  authority: OASIS XLIFF Version 2.0 Specification
  source: structural_fact_manual
  fact_status: verified
  verification_status: structural_derivation
