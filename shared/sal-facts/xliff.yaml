- fact_id: SAL-XLIFF-00002
  qname: FACT-XLIFF-002
  element_qname: xliff:unit
  claim: A <unit> element carries translatable content as one or more <segment> children, each holding a <source>
    and optional <target>; segments may be interleaved with <ignorable> content (shared structural fact referenced
    by xliff:unit and xliff:segment)
  section: OASIS XLIFF 2.0 — unit and segment elements
  authority: OASIS XLIFF Version 2.0 Specification
