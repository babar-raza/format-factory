- fact_id: SAL-SAFETENSORS-00005
  qname: FACT-SAFETENSORS-5
  element_qname: safetensors:header_validation
  claim: A declared header length that exceeds the available file bytes, malformed UTF-8, or malformed JSON is invalid
    and must be rejected.
  section: tensor.rs read_metadata and invalid-header tests
  authority: SafeTensors v0.8.0 commit a406ca3
