facts:
- fact_id: SAL-FODT-00001
  qname: FACT-FODT-001
  claim: FODT root element is <office:document> which serves as the top-level document container for flat
    OpenDocument text documents
  verification_status: verified_with_note
  provenance:
    format_id: fodt
    spec_id: odf-1.3
    section_id: '3.1.2'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 3.1.2: The <office:document> element is the root
      element for single-XML-file ODF documents. It combines content, styles, metadata, and settings in
      one file. Namespace: urn:oasis:names:tc:opendocument:xmlns:office:1.0.'
    confidence: high
  claim_id: FACT-FODT-001
- fact_id: SAL-FODT-00002
  qname: FACT-FODT-002
  claim: FODT document body is contained in <office:body> element which is a required child of the root element
  verification_status: verified_with_note
  provenance:
    format_id: fodt
    spec_id: odf-1.3
    section_id: '3.3'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 3.3: <office:body> is the container for the document
      content. It must appear exactly once as a child of <office:document>.'
    confidence: high
  claim_id: FACT-FODT-002
- fact_id: SAL-FODT-00003
  qname: FACT-FODT-003
  claim: FODT text content is wrapped in <office:text> element inside <office:body> identifying the document
    as text
  verification_status: verified_with_note
  provenance:
    format_id: fodt
    spec_id: odf-1.3
    section_id: '3.4'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 3.4: The <office:text> element identifies the
      document as a text document. It is the sole child of <office:body> in text documents.'
    confidence: high
  claim_id: FACT-FODT-003
