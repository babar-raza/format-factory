  qname: FACT-UBL-001
  element_qname: ubl:order
  claim: 'A UBL Order document is rooted at an <Order> element in the UBL-Order-2 namespace, composed of common
    basic components (cbc: e.g. ID, IssueDate) and common aggregate components (cac: e.g. OrderLine)'
  section: OASIS UBL 2.1 — Order document schema
  authority: OASIS UBL 2.1 Specification
  source: structural_fact_manual
  fact_status: verified
  verification_status: structural_derivation
  provenance:
