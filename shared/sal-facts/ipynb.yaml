- fact_id: SAL-IPYNB-00001
  qname: FACT-IPYNB-001
  element_qname: ipynb:notebook
  claim: A Jupyter notebook document is a single JSON object with required top-level keys nbformat (int), nbformat_minor
    (int), metadata (object), and cells (list of cell objects)
  section: nbformat 4.5 — top-level structure
  authority: Jupyter nbformat v4.5 Specification
  source: structural_fact_manual
  fact_status: verified
  verification_status: structural_derivation
  provenance:
    extraction_method: structural_derivation
    confidence: high
    added_by: TC-GWB-H03
    added_at: '2026-07-16'
- fact_id: SAL-IPYNB-00002
  qname: FACT-IPYNB-002
  element_qname: ipynb:cell
  claim: Each cell object has required keys cell_type ('code'|'markdown'|'raw'), metadata (object), and source (string
    or list of strings); code cells additionally require execution_count and outputs
  section: nbformat 4.5 — cell types
  authority: Jupyter nbformat v4.5 Specification
  source: structural_fact_manual
