- fact_id: SAL-FODG-00001
  qname: FACT-FODG-001
  claim: FODG root element is <office:document> which serves as the top-level document container for flat
    OpenDocument graphics documents
  verification_status: verified_with_note
  provenance:
    format_id: fodg
    spec_id: odf-1.3
    section_id: '3.1.2'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 3.1.2: The <office:document> element is the root
      element for single-XML-file ODF documents. It combines content, styles, metadata, and settings in
      one file. Namespace: urn:oasis:names:tc:opendocument:xmlns:office:1.0.'
    confidence: high
  claim_id: FACT-FODG-001
- fact_id: SAL-FODG-00002
  qname: FACT-FODG-002
  claim: FODG document body is contained in <office:body> element which is a required child of the root element
  verification_status: verified_with_note
  provenance:
    format_id: fodg
    spec_id: odf-1.3
    section_id: '3.3'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 3.3: <office:body> is the container for the document
      content. It must appear exactly once as a child of <office:document>.'
    confidence: high
  claim_id: FACT-FODG-002
- fact_id: SAL-FODG-00003
  qname: FACT-FODG-003
  claim: FODG drawing content is wrapped in <office:drawing> element inside <office:body> identifying the
    document as a graphic
  verification_status: verified_with_note
  provenance:
    format_id: fodg
    spec_id: odf-1.3
    section_id: '3.5'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 3.5: The <office:drawing> element identifies the
      document as a drawing/graphics document. It is the sole child of <office:body> in graphics documents.'
    confidence: high
  claim_id: FACT-FODG-003
- fact_id: SAL-FODG-00004
  qname: FACT-FODG-004
  claim: FODG drawing page element is <draw:page> representing a single page in the graphics document
  verification_status: verified_with_note
  provenance:
    format_id: fodg
    spec_id: odf-1.3
    section_id: '10.2.4'
    extraction_method: structural_derivation
    verification_status: verified_with_note
    verification_evidence: 'OASIS ODF 1.3 Part 3 Section 10.2.4: <draw:page> represents a drawing page.
      Pages are children of <office:drawing>. draw:name attribute provides a unique page identifier.
      draw:master-page-name references the master page layout.'
    confidence: high
  claim_id: FACT-FODG-004
- fact_id: SAL-FODG-00005
  qname: FACT-FODG-005
