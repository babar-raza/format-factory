      sub-flow pair rule does not establish the generic validator-agent
      processing capability.
  - obligation_id: SAL-XLIFF-CORE-HIERARCHY-IGNORABLE-001
    reason_code: INCIDENTAL_XPATH_CONTEXT_TOKEN
    reason: >-
      The ignorable ancestor limits the pc elements to which the assertion
      applies and does not independently establish ignorable hierarchy or
      cardinality semantics.
  - obligation_id: SAL-XLIFF-CORE-HIERARCHY-SEGMENT-001
    reason_code: INCIDENTAL_XPATH_CONTEXT_TOKEN
    reason: >-
      The segment ancestor limits the pc elements to which the assertion
      applies and does not independently establish segment hierarchy or
      cardinality semantics.
  - obligation_id: SAL-XLIFF-CORE-INLINE-PC-001
    reason_code: ELEMENT_SURFACE_NOT_DIRECT_PAIRING_OWNER
    reason: >-
      The pc element is the surface on which the attributes occur, but this
      assertion governs mutual attribute presence and does not establish the
      complete pc element model or all of its processing semantics.
  sal_fact_ids:
  - SAL-XLIFF-00005
  authority_reason: >-
    This exact XLIFF 2.1 Core Schematron assertion selects pc elements carrying
    subFlowsStart and requires subFlowsEnd. It is the start-to-end direction
    of the mutual-presence constraint. The segment and ignorable names are
    applicability context, while the validator and pc element surfaces are
    downstream or broader than the direct inline-pairing semantic owner.
