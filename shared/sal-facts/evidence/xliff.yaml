schema_version: '1.0'
format_id: xliff
coverage: complete
authority_policy: >-
  Every assertion is an exact structural or normalized-text predicate over the
  SHA-256 pinned XLIFF 2.1 OASIS Standard release package. XML assertions parse
  only pinned archive bytes and never resolve schemas, entities, catalogs, or
  network resources. Module inventories are bound by count and exact-name digest.
xsd_namespaces: &xsd_namespaces
  xs: http://www.w3.org/2001/XMLSchema
sch_namespaces: &sch_namespaces
  sch: http://purl.oclc.org/dsdl/schematron
