      can appear in NRRD0002 (and higher version) files, but not NRRD0001 files.
  - assertion_id: key-value-escaping
    target: teem_spec
    kind: html_text_contains
    expected: 'Because both the key and value must appear on exactly one line, a minimal escaping scheme
      is required, which readers must interpret and writers must generate: " \n " signifies a new line'
  - assertion_id: duplicate-and-delimiter-rule
    target: teem_spec
    kind: html_text_contains
    expected: If a key is repeated more than once, the value in the last key/value pair is the only one
      stored. The substring " := " is not allowed in the key string.
  - assertion_id: reference-key-value-trigger
    target: teem_reference_codec
    kind: text_contains
    expected: '} else if (nrrdKeyValueSize(nrrd)) { ret = 2; } else { ret = 1; }'
