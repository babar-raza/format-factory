- fact_id: SAL-NRRD-00018
  claim_sha256: 7ecf1729fa81f4d9e0c63d25120d225df761830b9fd6a265d600de817f607516
  assertions:
  - assertion_id: line-skip-meaning
    target: teem_spec
    kind: html_text_contains
    expected: It tells the NRRD reader to skip some number of lines (greater than or equal to zero) in the
      data file in order to get to the where the data actually begins.
  - assertion_id: byte-skip-meaning
    target: teem_spec
    kind: html_text_contains
    expected: it tells how many bytes to skip in a data file in order to get to the beginning of the data
  - assertion_id: skip-order
