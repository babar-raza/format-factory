    expected: '#define MAGIC1 "NRRD0001" #define MAGIC2 "NRRD0002" #define MAGIC3 "NRRD0003" #define
      MAGIC4 "NRRD0004" #define MAGIC5 "NRRD0005"'
  - assertion_id: oldest-representable-version
