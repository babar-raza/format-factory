schema_version: '1.0'
format_id: ora
coverage: complete
authority_policy: >-
  Every assertion is an exact visible-text predicate over one of the three
  SHA-256 pinned freedesktop.org OpenRaster 0.0.5 draft pages. HTML markup is
  discarded without loading resources or executing content. This verifies the
  published draft facts; it does not convert the draft into a formal standard.
targets:
  draft:
    source_id: SRC-ORA-001
    member_sha256: b6d041b4880556cb3e0a86612b203e82787078bacbc810ea0735e806a200568a
  file_layout:
    source_id: SRC-ORA-002
    member_sha256: e1dac00ff0d9c27cb40b04cc21ae44fcf0ddb50f23ef49a12dc8057c5a6f20d6
  layer_stack:
    source_id: SRC-ORA-003
    member_sha256: 78c993f79cfd831b6b4afcbdbc38eb8b156397d3b6995da41688fac603f6bba5
