  - assertion_id: stack-child-kinds
    target: layer_stack
    kind: html_text_contains
    expected: They may contain sub- stack s, layer s, or text elements.
  - assertion_id: visual-layer-order
    target: layer_stack
    kind: html_text_contains
    expected: The first element in a stack is the uppermost.
