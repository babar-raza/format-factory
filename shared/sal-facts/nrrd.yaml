  qname: FACT-NRRD-002
  element_qname: nrrd:header
  claim: Across NRRD0001 through NRRD0005, an attached file starts with an ASCII magic and header made
    of field specifications and comments, ends the header with a blank line, and then stores the data
    payload; readers accept both LF and CRLF line endings
  section: Teem NRRD Format Specification — Sections 1.1 and 1.2
  authority: Teem NRRD Format Specification
  source: structural_fact_manual
  fact_status: verified
  verification_status: verified
