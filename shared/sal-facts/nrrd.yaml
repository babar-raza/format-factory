  qname: FACT-NRRD-002
  element_qname: nrrd:header
  claim: 'An NRRD file begins with an ASCII header: a magic line ''NRRD000X'' (X = format version digit),
    followed by field specifications ''field: value'' and key/value pairs ''key:=value'', terminated by
    a single blank line'
  section: Teem NRRD Format Specification — Section 2 (Header)
  authority: Teem NRRD Format Specification
  source: structural_fact_manual
  fact_status: verified
  verification_status: verified
