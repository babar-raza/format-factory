  - (programmatic) CSV - HasColumn(name) tests whether a named column exists in the header row
  - (programmatic) CSV - IsEmpty returns true when the document contains zero data rows
  - (programmatic) CSV - RowCount returns the number of data rows excluding the header
  - (programmatic) CSV - ColumnCount returns the number of columns derived from the header or first data
