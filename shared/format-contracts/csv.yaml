  required_behavior:
  - Expose table, row, field, and header abstractions with by-index and by-header access.
  - Preserve the distinction between empty field, quoted empty field, and absent trailing field where
    the dialect distinguishes them.
  - Report table dimensions (row count, per-row field count) and header presence without full materialization
    where streaming.
  normative_rules:
  - (2.2) RFC 4180 s2.2 - There may be an optional header line appearing as the first line of the file
  - (2.2) RFC 4180 s2.2 - The number of fields in the header should equal the number of fields in records
  - (2.3) RFC 4180 s2.3 - Within the header and each record there may be one or more fields separated
    by commas
  - (3) RFC 4180 s3 - The text/csv type supports a header parameter with values present or absent
  - (2.5) RFC 4180 - A line break embedded within a double-quoted field is part of the field value not
    a record separator
  - (2.5) RFC 4180 - A comma embedded within a double-quoted field is part of the field value not a field
    separator
  - (3) RFC 4180 - The file extension .csv is conventionally used for CSV files
  - (2.2) RFC 4180 - A header row if present must appear as the very first line of the file
  - (2.2) RFC 4180 - Field names in the header line are subject to the same quoting rules as data fields
  - (2.1) RFC 4180 - An empty file is a valid CSV document containing zero records
  - (2.5) RFC 4180 - A quoted field may span multiple lines; embedded CRLF sequences are literal content
  - (2.3) RFC 4180 - The number of fields is inferred from the first record or header if present
  - (programmatic) CSV - Column index is zero-based in programmatic access; the first column is column
    0
  - (programmatic) CSV - Row index is zero-based for data rows when a header is present
  - (2.3) RFC 4180 - All field values are strings; numeric or boolean interpretation is application-specific
  - (2.3) RFC 4180 - NULL or missing values in CSV are conventionally represented by empty fields
  - (2.2) RFC 4180 - CSV has no schema definition mechanism; structure is inferred from the header row
  - (2.1) RFC 4180 - The total number of records is not encoded in the file; it must be determined by
    reading all records
  - (2.3) RFC 4180 - Column count is determined by the header row if present or the first data row
  - (programmatic) CSV - Accessing a cell by row and column index is a programmatic operation on the parsed
    result
  - (programmatic) CSV - Filtering rows by predicate produces a new document with the same header
  - (programmatic) CSV - Adding a row appends a new record at the end of the document
  - (programmatic) CSV - Removing a row at index removes that record; subsequent rows shift up by one
    index position
  - (programmatic) CSV - Setting a cell value mutates the field at the given row and column position in
    place
  - (programmatic) CSV - A column can be retrieved as a list of values by its zero-based index or header
    name
  - (programmatic) CSV - HasColumn(name) tests whether a named column exists in the header row
  - (programmatic) CSV - IsEmpty returns true when the document contains zero data rows
  - (programmatic) CSV - RowCount returns the number of data rows excluding the header
  - (programmatic) CSV - ColumnCount returns the number of columns derived from the header or first data
    row
  - (programmatic) CSV - A widened row produced by SetCell at a column beyond the current length fills
    intermediate cells with empty string
  - (programmatic) CSV - HasHeaders returns true when the document was loaded with hasHeaders=true and
    a header row is present
  - (2.3) RFC 4180 - A row with all empty fields is a valid record
  - (2.3) RFC 4180 - Numeric values in CSV are stored as unquoted or quoted strings without special encoding
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Header-based and index-based access agree on every fixture; dimension reporting matches fixture truth.
- release_gates:
  - All specification parsing rules covered by passing tests including quoting and line-ending variants.
  capability_id: CSV-PARSE-001
  level: MUST
  category: parse
  title: Specification-conformant record and field parsing
  production_meaning: The library splits input into records and fields exactly as the specification defines,
    including every quoting, escaping, and line-ending rule, so downstream consumers never see mis-split
    data.
  developer_use_case: A developer loads an arbitrary conformant file produced by another tool and receives
    the same logical table that tool wrote, without configuring parser internals.
  provenance:
  - POL-TAB-PARSE-01
  - POL-TAB-PARSE-02
  - POL-TAB-PARSE-03
