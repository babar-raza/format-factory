- release_gates:
  - All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: CSV-PRESERVE-001
  level: MUST
  category: preserve
  title: Baseline preservation duties
  production_meaning: Unknown constructs, absent-vs-default distinctions, and loss reporting are handled
    so round trips never silently drop data.
  developer_use_case: A developer round-trips files containing constructs the library does not model and
    loses nothing silently.
  provenance:
  - POL-SLC-PRESERVE-01
  - POL-SLC-PRESERVE-02
  - POL-SLC-PRESERVE-03
  - POL-SLC-PRESERVE-04
  required_behavior:
  - Preserve unknown or future-version constructs that can be carried safely; never silently drop unrecognized
    content in lossless mode.
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  - Report every construct that cannot be preserved before saving, through a loss report API, rather than
    failing silently.
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  depth_required: 4
  depth_rationale: Portfolio baseline (preservation) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: CSV-SEC-001
  level: MUST
  category: security
  title: Baseline security posture
  production_meaning: Input limits, no implicit external effects, traversal protection, untrusted-payload
    discipline, and complexity-attack guards are enforced with diagnostics.
  developer_use_case: A developer processes untrusted input with safe defaults and only opts into external
    effects explicitly.
  provenance:
  - POL-SLC-SEC-01
  - POL-SLC-SEC-02
  - POL-SLC-SEC-03
  - POL-SLC-SEC-04
  - POL-SLC-SEC-05
  required_behavior:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  depth_required: 5
  depth_rationale: Portfolio baseline (security_limits) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
    test proving refusal with diagnostics.
- release_gates:
  - Every documented validation rule maps to at least one negative test.
  capability_id: CSV-VALIDATE-001
  level: MUST
  category: validate
  title: Layered structural validation
  production_meaning: Validation checks lexical, syntax, and structural rules as separate layers with
    complete diagnostics, so callers can gate pipelines on machine-readable results.
  developer_use_case: A developer validates an incoming file before processing and receives every violation
    with row/column locations, not just the first failure.
  provenance:
  - POL-TAB-VALIDATE-01
  - POL-TAB-VALIDATE-02
  - SAL-CSV-00004
  - SAL-CSV-00006
  - SAL-CSV-00007
  - SAL-CSV-00009
  - SAL-CSV-00010
  - SAL-CSV-00011
  - SAL-CSV-00023
  - SAL-CSV-00024
  - SAL-CSV-00025
  - SAL-CSV-00026
  - SAL-CSV-00027
  - SAL-CSV-00039
  - SAL-CSV-00053
  - RF-CSV-00002
  required_behavior:
  - Validate lexical, syntax, and structural layers independently, returning all diagnostics with locations.
  - Structural checks include consistent field counts per record and header integrity where headers are
    declared.
  - Provide an opt-in formula-hazard scan that flags cells beginning with '=', '+', '-', or '@' before
    export toward spreadsheet consumers, returning affected row/column coordinates so callers can neutralize
    spreadsheet formula injection.
  normative_rules:
  - (2.2) RFC 4180 s2.2 - The number of fields in the header should equal the number of fields in records
  - (2.3) RFC 4180 s2.3 - Spaces are considered part of a field and should not be ignored
  - (2.3) RFC 4180 s2.3 - The last field in the record must not be followed by a comma
  - (2.4) RFC 4180 s2.4 - If fields are not enclosed with double quotes then double quotes may not appear
    inside the fields
  - (2.5) RFC 4180 s2.5 - Fields containing line breaks, double quotes, and commas should be enclosed
    in double-quotes
  - (2.6) RFC 4180 s2.6 - A double-quote appearing inside a field must be escaped by preceding it with
    another double quote
  - (2.2) RFC 4180 - A header row if present must appear as the very first line of the file
  - (2.2) RFC 4180 - Field names in the header line are subject to the same quoting rules as data fields
  - (2.1) RFC 4180 - An empty file is a valid CSV document containing zero records
  - (2.5) RFC 4180 - A quoted field may span multiple lines; embedded CRLF sequences are literal content
  - (2.1) RFC 4180 - Parsers SHOULD accept LF as well as CRLF as line terminator for cross-platform compatibility
  - (2.1) RFC 4180 - The total number of records is not encoded in the file; it must be determined by
    reading all records
  - (2.3) RFC 4180 - A row with all empty fields is a valid record
  security_requirements:
  - Formula-hazard scan is opt-in, never mutates data, and reports cell coordinates.
  depth_required: 5
  depth_rationale: 'MUST validate capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Positive and negative fixtures per validation layer; diagnostics carry stable codes and locations.
  - Hazard scan fixture with leading '=', '+', '-', '@' cells returns exact coordinates; clean fixture
    returns none.
- release_gates:
  - Writer output validated against parser and at least one external consumer fixture set.
  capability_id: CSV-WRITE-001
  level: MUST
  category: write
  title: Specification-conformant serialization
  production_meaning: Output applies quoting and escaping exactly where the dialect requires, chooses
    correct line endings, and is deterministic - loadable by the library itself and by mainstream consumers.
  developer_use_case: A developer writes a table containing embedded delimiters, quotes, and line breaks
    and every mainstream reader loads it intact.
  provenance:
  - POL-TAB-WRITE-01
  - POL-TAB-WRITE-02
  - SAL-CSV-00001
  - SAL-CSV-00002
  - SAL-CSV-00008
  - SAL-CSV-00009
  - SAL-CSV-00010
  - SAL-CSV-00011
  - SAL-CSV-00017
  - SAL-CSV-00018
  - SAL-CSV-00019
  - SAL-CSV-00021
  - SAL-CSV-00024
  - SAL-CSV-00026
  - SAL-CSV-00027
  - SAL-CSV-00036
  - SAL-CSV-00037
  - SAL-CSV-00054
  - SAL-CSV-00055
  required_behavior:
  - Quote and escape fields exactly where required by the dialect; never emit ambiguous unquoted content.
  - Offer lossless mode (preserve original quoting and line-ending choices where recorded) and normalized
    mode (canonical quoting policy), as an explicit caller choice.
  normative_rules:
  - (2.1) RFC 4180 s2.1 - Each record is on a separate line, delimited by a line break (CRLF)
  - (2.1) RFC 4180 s2.1 - The last record in the file may or may not have an ending line break
  - (2.4) RFC 4180 s2.4 - Each field may or may not be enclosed in double quotes
  - (2.4) RFC 4180 s2.4 - If fields are not enclosed with double quotes then double quotes may not appear
    inside the fields
  - (2.5) RFC 4180 s2.5 - Fields containing line breaks, double quotes, and commas should be enclosed
    in double-quotes
  - (2.6) RFC 4180 s2.6 - A double-quote appearing inside a field must be escaped by preceding it with
    another double quote
  - (2.4) RFC 4180 - A quoted field begins and ends with a double-quote character
  - (2.5) RFC 4180 - A line break embedded within a double-quoted field is part of the field value not
    a record separator
  - (2.5) RFC 4180 - A comma embedded within a double-quoted field is part of the field value not a field
    separator
  - (2.1) RFC 4180 - A CSV record is delimited by CRLF; LF alone may be used in practice but CRLF is canonical
  - (2.2) RFC 4180 - Field names in the header line are subject to the same quoting rules as data fields
  - (2.5) RFC 4180 - A quoted field may span multiple lines; embedded CRLF sequences are literal content
  - (2.1) RFC 4180 - Parsers SHOULD accept LF as well as CRLF as line terminator for cross-platform compatibility
  - (2.4) RFC 4180 - The quoting character double-quote ASCII 0x22 is fixed; single quotes are not special
  - (2.6) RFC 4180 - After a closing double-quote within a field only comma, CRLF, or EOF should follow
  - (2.3) RFC 4180 - Numeric values in CSV are stored as unquoted or quoted strings without special encoding
  - (2.4) RFC 4180 - A parsing algorithm uses a state machine with states for unquoted, quoted, and escape
    modes
  depth_required: 4
  depth_rationale: 'MUST write capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Deterministic double-serialization byte-compare; round-trip through parser for hostile field content.
public_api_contract:
  read_operations:
  - iter_rows(path_or_stream) -> iterator of row objects
  - load(path_or_stream) -> table model
preservation_contract:
  lexical_roundtrip:
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  loss_reporting_policy: Report every construct that cannot be preserved before saving, through a loss
    report API, rather than failing silently.
  structural_roundtrip:
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  unknown_construct_policy: Preserve unknown or future-version constructs that can be carried safely;
    never silently drop unrecognized content in lossless mode.
validation_contract:
  diagnostic_schema:
    fields:
    - code
    - severity
    - message
    - source_location
    - object_path
    - originating_rule
    - repair_suggestion
    - auto_repair_eligible
  layers:
  - description: 'Character-level rules: encoding validity, permitted characters, line-ending forms.'
    layer: lexical
  - description: 'Field/record splitting: delimiter, quoting, and escaping conformance.'
    layer: syntax
  - description: 'Row shape consistency: field counts, header presence, record boundaries.'
    layer: structural
  - description: Optional typed-column checks when a schema or type hints are supplied.
    layer: type
  - description: Input size, field count, and cell payload limits; formula-injection hazards flagged.
    layer: security
security_contract:
  attack_surfaces:
  - Oversized rows or fields causing unbounded memory allocation during parsing.
  - Formula-injection payloads (cells beginning with '=', '+', '-', '@') passed to spreadsheet consumers.
  - Malformed encoding sequences and BOM confusion causing silent data corruption.
  - Quote-state confusion causing record-boundary smuggling across rows.
  limits:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  safe_defaults:
  - Bounded field size, field count per record, and total input size with configurable limits.
  - No evaluation of cell content; formula-hazard flagging available for export paths.
  - Strict encoding validation by default with explicit tolerant-mode opt-in.
test_contract:
- Test official or authoritative valid samples, invalid samples, synthetic edge cases, malformed inputs,
  and hostile inputs for every claimed capability.
- Prove parse-save-parse semantic equivalence for representative documents of every supported construct.
- Prove deterministic output by serializing the same document twice and byte-comparing.
- Publish a capability manifest stating supported versions, constructs, limitations, and lossless guarantees,
  verified against implementation and tests.
- Detection fixtures across the dialect matrix; wrong-guess cases must surface low confidence rather than
  silent mis-parse.
- Round-trip after each mutation class proves the edit survived save and reload.
- BOM and no-BOM fixtures; undecodable-sequence negative fixtures in strict and tolerant modes.
- Export fixture verified against the target format's own parser.
- Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Header-based and index-based access agree on every fixture; dimension reporting matches fixture truth.
- Parse every specification example plus edge fixtures for embedded delimiters, embedded quotes, embedded
  line breaks, and empty fields.
- Negative fixtures for unterminated quotes and illegal bare quote characters in strict mode.
- Streaming iterator produces identical rows to whole-file load on the same fixture.
- Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
  test proving refusal with diagnostics.
- Positive and negative fixtures per validation layer; diagnostics carry stable codes and locations.
- Hazard scan fixture with leading '=', '+', '-', '@' cells returns exact coordinates; clean fixture returns
  none.
- Deterministic double-serialization byte-compare; round-trip through parser for hostile field content.
release_gates:
- Dialect matrix documented and covered by detection tests.
- Every mutation operation has a save-reload-verify test.
- Encoding matrix covered by tests including failure modes.
- At least one export path proven by consumer-side verification.
- All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Typed model APIs cover read access to every construct the parser produces.
- All specification parsing rules covered by passing tests including quoting and line-ending variants.
- All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Every documented validation rule maps to at least one negative test.
- Writer output validated against parser and at least one external consumer fixture set.
- Capability manifest published and independently verified against implementation and tests.
