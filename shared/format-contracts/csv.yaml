format_identity:
  active_content_model:
    has_active_content: false
    policy: Format carries passive data only; no execution, rendering, or external resolution is ever
      required to process it.
  data_model_type: tabular
  description: 'Comma-Separated Values (CSV): delimiter-structured tabular text format (IETF (RFC 4180)
    RFC 4180 (2005)). Rows of records carrying delimited fields, consumed and produced by spreadsheets,
    databases, data pipelines, and programming ecosystems.'
  primary_use_cases:
  - Exchange tabular data between spreadsheets, databases, and data-processing pipelines
  - Bulk import/export of records for business and scientific applications
  - Streaming row-oriented processing of large datasets
