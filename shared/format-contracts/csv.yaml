scope_policy:
  minimum_viable_support: Load and save specification-conformant files with correct field splitting, quoting,
    and encoding; expose rows and fields as a typed model; report structural errors with row/column locations.
  production_complete_target: Read, create, edit, validate, and write every construct defined by the target
    specification including dialect variations, quoting/escaping rules, header semantics, and encoding
    declarations, with streaming support for datasets larger than memory.
capabilities:
- release_gates:
  - Dialect matrix documented and covered by detection tests.
  capability_id: CSV-DIALECT-001
  level: SHOULD
  category: transform
  title: Dialect detection and configuration
  production_meaning: Delimiter, quote character, header presence, and line-ending variants are explicit,
    inspectable configuration; common dialects can be detected from samples with confidence reporting.
  developer_use_case: A developer loads files from heterogeneous sources and the library reports the detected
    dialect instead of silently mis-parsing.
  provenance:
  - POL-TAB-DIALECT-01
  - POL-TAB-DIALECT-02
  - SAL-CSV-00035
  - SAL-CSV-00055
  required_behavior:
  - Represent dialect parameters (delimiter, quoting, line endings, header presence) as explicit configuration
    on load and save.
  - Provide sample-based dialect detection returning the detected parameters and a confidence signal,
    never silently guessing in strict mode.
  normative_rules:
  - (2.3) RFC 4180 - CSV files may use alternative field delimiters in practice; RFC 4180 only specifies
    comma
  - (2.4) RFC 4180 - A parsing algorithm uses a state machine with states for unquoted, quoted, and escape
    modes
  depth_required: 2
  depth_rationale: 'SHOULD transform capability: family depth floor 2, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Detection fixtures across the dialect matrix; wrong-guess cases must surface low confidence rather
    than silent mis-parse.
- release_gates:
  - Every mutation operation has a save-reload-verify test.
  capability_id: CSV-EDIT-001
  level: MUST
  category: edit
  title: Safe tabular mutation
  production_meaning: Rows, fields, headers, and columns can be inserted, updated, moved, and removed
    through the model with invariants (consistent field counts, header uniqueness where required) enforced
    or diagnosed.
  developer_use_case: A developer appends rows, renames a header, and deletes a column, then saves - without
    corrupting quoting or record structure.
  provenance:
  - POL-TAB-EDIT-01
  - POL-TAB-EDIT-02
  - SAL-CSV-00007
  - SAL-CSV-00043
  - SAL-CSV-00044
  - SAL-CSV-00051
  required_behavior:
  - Insert, update, move, and remove rows and fields through model operations that keep record structure
    consistent.
  - Column-level operations (add, rename, remove, reorder) update every affected row and the header consistently.
  normative_rules:
  - (2.3) RFC 4180 s2.3 - The last field in the record must not be followed by a comma
  - (programmatic) CSV - Adding a row appends a new record at the end of the document
  - (programmatic) CSV - Removing a row at index removes that record; subsequent rows shift up by one
    index position
  - (programmatic) CSV - A widened row produced by SetCell at a column beyond the current length fills
    intermediate cells with empty string
  depth_required: 4
  depth_rationale: 'MUST edit capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Round-trip after each mutation class proves the edit survived save and reload.
- release_gates:
  - Encoding matrix covered by tests including failure modes.
  capability_id: CSV-ENCODING-001
  level: MUST
  category: parse
  title: Character encoding handling
  production_meaning: Encoding declaration, detection (BOM), and validation are explicit; data is never
    silently transcoded or corrupted.
  developer_use_case: A developer loads UTF-8 files with or without BOM and legacy-encoded files by explicit
    choice, with encoding errors reported rather than replaced silently in strict mode.
  provenance:
  - POL-TAB-ENC-01
  - POL-TAB-ENC-02
  - SAL-CSV-00005
  - SAL-CSV-00008
  - SAL-CSV-00010
  - SAL-CSV-00013
  - SAL-CSV-00016
  - SAL-CSV-00017
  - SAL-CSV-00020
  - SAL-CSV-00029
  - SAL-CSV-00032
  - SAL-CSV-00036
  - SAL-CSV-00037
  - SAL-CSV-00054
  - SAL-CSV-00055
  required_behavior:
  - Honor byte-order marks and explicit encoding parameters; report the effective encoding used.
  - In strict mode, reject undecodable byte sequences with position diagnostics; tolerant mode substitutes
    with an explicit report.
  normative_rules:
  - (2.3) RFC 4180 s2.3 - Within the header and each record there may be one or more fields separated
    by commas
  - (2.4) RFC 4180 s2.4 - Each field may or may not be enclosed in double quotes
  - (2.5) RFC 4180 s2.5 - Fields containing line breaks, double quotes, and commas should be enclosed
    in double-quotes
  - (3) RFC 4180 s3 - The default charset for text/csv is UTF-8
  - (2.3) RFC 4180 - An empty field is represented by two adjacent commas or a comma followed by a record
    terminator
  - (2.4) RFC 4180 - A quoted field begins and ends with a double-quote character
  - (3) RFC 4180 - CSV files may contain UTF-8 encoded Unicode text
  - (3) RFC 4180 - A BOM byte order mark at the start of a UTF-8 CSV file may be present in practice
  - (2.3) RFC 4180 - All field values are strings; numeric or boolean interpretation is application-specific
  - (2.4) RFC 4180 - The quoting character double-quote ASCII 0x22 is fixed; single quotes are not special
  - (2.6) RFC 4180 - After a closing double-quote within a field only comma, CRLF, or EOF should follow
  - (2.3) RFC 4180 - Numeric values in CSV are stored as unquoted or quoted strings without special encoding
  - (2.4) RFC 4180 - A parsing algorithm uses a state machine with states for unquoted, quoted, and escape
    modes
  depth_required: 2
  depth_rationale: 'MUST parse capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - BOM and no-BOM fixtures; undecodable-sequence negative fixtures in strict and tolerant modes.
- release_gates:
  - At least one export path proven by consumer-side verification.
  capability_id: CSV-EXPORT-001
  level: SHOULD
  category: export
  title: Tabular interchange export
  production_meaning: Tables export to at least one other structured representation (using Format Factory's
    own libraries where available) preserving cell values, header association, and row order.
  developer_use_case: A developer converts a loaded table to another supported tabular or document format
    in one call with a loss report.
  provenance:
  - POL-TAB-EXPORT-01
  required_behavior:
  - Export preserves cell values, header-to-column association, and row order, reporting any constructs
    the target cannot represent.
  depth_required: 4
  depth_rationale: 'SHOULD export capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Export fixture verified against the target format's own parser.
- release_gates:
  - All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: CSV-LIFECYCLE-001
  level: MUST
  category: lifecycle
  title: Baseline lifecycle I/O
  production_meaning: Load/save/bytes round-trip, version exposure, strict and tolerant read modes, first-class
    validation, deterministic serialization.
  developer_use_case: A developer integrates the library with only lifecycle APIs and never needs format-internal
    knowledge for I/O plumbing.
  provenance:
  - POL-SLC-LIFECYCLE-01
  - POL-SLC-LIFECYCLE-02
  - POL-SLC-LIFECYCLE-03
  - POL-SLC-LIFECYCLE-04
  - POL-SLC-LIFECYCLE-05
  - POL-SLC-LIFECYCLE-06
  required_behavior:
  - Provide load from filesystem path, readable stream, and in-memory bytes, returning the format's root
    document/model object.
  - Provide save to filesystem path and writable stream, plus serialization to bytes, producing output
    the library's own loader accepts.
  - Expose the detected format version and any declared version separately; never silently rewrite a declared
    version.
  - Support a strict read mode that rejects malformed input with diagnostics and a tolerant read mode
    that recovers where the format permits, with recovery actions reported.
  - Expose validation as a first-class callable operation returning structured diagnostics, not only as
    exceptions raised during parsing.
  - Offer deterministic serialization such that an unchanged loaded document serializes to identical bytes
    across repeated calls in the same mode.
  depth_required: 4
  depth_rationale: Portfolio baseline (lifecycle_io) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - Typed model APIs cover read access to every construct the parser produces.
  capability_id: CSV-MODEL-001
  level: MUST
  category: model
  title: Typed tabular object model
  production_meaning: Rows, fields, and headers are exposed as a typed domain model with stable accessors
    - not raw string lists only - so edits and queries are safe and discoverable.
  developer_use_case: A developer reads column values by header name, iterates typed rows, and inspects
    table dimensions without hand-indexing arrays.
  provenance:
  - POL-TAB-MODEL-01
  - POL-TAB-MODEL-02
  - POL-TAB-MODEL-03
  - SAL-CSV-00003
  - SAL-CSV-00004
  - SAL-CSV-00005
