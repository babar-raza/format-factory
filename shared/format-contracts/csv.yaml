  - (2.4) RFC 4180 - The quoting character double-quote ASCII 0x22 is fixed; single quotes are not special
  - (2.6) RFC 4180 - After a closing double-quote within a field only comma, CRLF, or EOF should follow
  - (2.1) RFC 4180 - CSV does not define comment lines; all lines are data unless the application defines
