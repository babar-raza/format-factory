  required_behavior:
  - Split records on the specification's record separator, honoring quoted sections that embed separators,
    delimiters, and quote characters.
  - Report malformed constructs (unterminated quotes, illegal characters, inconsistent field counts) with
    row and column positions in strict mode.
  - Parse from path, stream, and bytes with identical results, supporting incremental/streaming row iteration
    without loading the whole input.
  - Expose a streaming row iterator that yields row objects without materializing the full table, so multi-gigabyte
    CSV files can be processed in bounded memory alongside the whole-file load path.
  normative_rules:
  - (2.1) RFC 4180 s2.1 - Each record is on a separate line, delimited by a line break (CRLF)
  - (2.1) RFC 4180 s2.1 - The last record in the file may or may not have an ending line break
  - (2.2) RFC 4180 s2.2 - There may be an optional header line appearing as the first line of the file
  - (2.2) RFC 4180 s2.2 - The number of fields in the header should equal the number of fields in records
  - (2.3) RFC 4180 s2.3 - Within the header and each record there may be one or more fields separated
    by commas
  - (2.3) RFC 4180 s2.3 - Spaces are considered part of a field and should not be ignored
  - (2.3) RFC 4180 s2.3 - The last field in the record must not be followed by a comma
  - (2.4) RFC 4180 s2.4 - Each field may or may not be enclosed in double quotes
  - (2.4) RFC 4180 s2.4 - If fields are not enclosed with double quotes then double quotes may not appear
    inside the fields
  - (2.5) RFC 4180 s2.5 - Fields containing line breaks, double quotes, and commas should be enclosed
    in double-quotes
  - (2.6) RFC 4180 s2.6 - A double-quote appearing inside a field must be escaped by preceding it with
    another double quote
  - (3) RFC 4180 s3 - The text/csv type supports a header parameter with values present or absent
  - (1) RFC 4180 s1 - Each record should contain the same number of fields throughout the file
  - (2.3) RFC 4180 - An empty field is represented by two adjacent commas or a comma followed by a record
    terminator
  - (2.4) RFC 4180 - A quoted field begins and ends with a double-quote character
  - (2.5) RFC 4180 - A line break embedded within a double-quoted field is part of the field value not
    a record separator
  - (2.5) RFC 4180 - A comma embedded within a double-quoted field is part of the field value not a field
    separator
  - (2.1) RFC 4180 - A CSV record is delimited by CRLF; LF alone may be used in practice but CRLF is canonical
  - (3) RFC 4180 - The file extension .csv is conventionally used for CSV files
  - (2.2) RFC 4180 - A header row if present must appear as the very first line of the file
  - (2.2) RFC 4180 - Field names in the header line are subject to the same quoting rules as data fields
  - (2.1) RFC 4180 - An empty file is a valid CSV document containing zero records
  - (2.5) RFC 4180 - A quoted field may span multiple lines; embedded CRLF sequences are literal content
  - (2.1) RFC 4180 - Parsers SHOULD accept LF as well as CRLF as line terminator for cross-platform compatibility
  - (2.3) RFC 4180 - The number of fields is inferred from the first record or header if present
  - (programmatic) CSV - Column index is zero-based in programmatic access; the first column is column
    0
  - (programmatic) CSV - Row index is zero-based for data rows when a header is present
  - (2.3) RFC 4180 - All field values are strings; numeric or boolean interpretation is application-specific
  - (2.3) RFC 4180 - NULL or missing values in CSV are conventionally represented by empty fields
  - (2.2) RFC 4180 - CSV has no schema definition mechanism; structure is inferred from the header row
  - (2.3) RFC 4180 - CSV files may use alternative field delimiters in practice; RFC 4180 only specifies
