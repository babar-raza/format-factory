  - SAL-XCF-00043
  - SAL-XCF-00044
  required_behavior:
  - Decode every specified header variant and pixel encoding with dimension/depth validation before payload
    allocation.
  normative_rules:
  - '(spec) XCF file begins with header: magic ''gimp xcf'', version, canvas width/height/type'
  - '(spec) XCF layer: width, height, type, name, properties, level pointer'
  - (spec) XCF file begins with the 9-byte magic string 'gimp xcf ' followed by a version identifier
  - (spec) XCF image header contains width (4 bytes), height (4 bytes), and base type (4 bytes) after
    the magic
  - (spec) XCF stores channel pointers as a list of offsets terminated by a zero value after layer pointers
  - (spec) XCF property PROP_OPACITY (6) stores layer or channel opacity as a uint32 from 0 to 255
  - (spec) XCF property PROP_VISIBLE (8) stores layer or channel visibility as uint32 0 or 1
  - (spec) XCF property PROP_LOCK_ALPHA (10) prevents changes to the alpha channel when set to 1
  - (spec) XCF property PROP_OFFSETS (15) stores layer or channel X and Y offsets as two int32 values
  - (spec) XCF property PROP_COLOR (17) stores a channel color as three bytes for R, G, B
  - (spec) XCF property PROP_COMPRESSION (17 on image) stores pixel data compression type as uint32
  - (spec) XCF property PROP_RESOLUTION (19) stores X and Y resolution as two float32 values in pixels
    per inch
  - (spec) XCF property PROP_TATTOO (20) stores a unique integer ID for a layer, channel, or path
  - (spec) XCF layer structure contains width, height, type, name, then property list then hierarchy pointer
  - (spec) XCF level structure contains width, height, and a list of tile pointers terminated by zero
  - (spec) XCF tiles are 64 by 64 pixels with the last row and column tiles being smaller if image dimensions
    are not multiples of 64
  - (spec) XCF uncompressed tile data stores pixels in row-major order with all channels interleaved
  - (spec) XCF channel structure has width, height, name string, property list, then hierarchy pointer
  - (spec) XCF property PROP_ACTIVE_CHANNEL (3) on image identifies which channel is currently active
  - (spec) XCF property PROP_SELECTION (4) on image points to the selection mask channel
  - (spec) XCF files use UTF-8 encoding for all string data including layer names, channel names, and
    parasite data names
  - (spec) The XCF magic bytes 'gimp xcf ' followed by a version identifier and null terminator must be
    present at offset 0; invalid magic shall cause rejection
  depth_required: 2
  depth_rationale: 'MUST parse capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Variant matrix decodes; dimension-bomb and truncation negatives.
- release_gates:
  - All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: XCF-PRESERVE-001
  level: MUST
  category: preserve
  title: Baseline preservation duties
  production_meaning: Unknown constructs, absent-vs-default distinctions, and loss reporting are handled
    so round trips never silently drop data.
  developer_use_case: A developer round-trips files containing constructs the library does not model and
    loses nothing silently.
  provenance:
  - POL-SLC-PRESERVE-01
  - POL-SLC-PRESERVE-02
  - POL-SLC-PRESERVE-03
  - POL-SLC-PRESERVE-04
  required_behavior:
  - Preserve unknown or future-version constructs that can be carried safely; never silently drop unrecognized
    content in lossless mode.
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  - Report every construct that cannot be preserved before saving, through a loss report API, rather than
    failing silently.
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  depth_required: 4
  depth_rationale: Portfolio baseline (preservation) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: XCF-SEC-001
  level: MUST
  category: security
  title: Baseline security posture
  production_meaning: Input limits, no implicit external effects, traversal protection, untrusted-payload
    discipline, and complexity-attack guards are enforced with diagnostics.
  developer_use_case: A developer processes untrusted input with safe defaults and only opts into external
    effects explicitly.
  provenance:
  - POL-SLC-SEC-01
  - POL-SLC-SEC-02
  - POL-SLC-SEC-03
  - POL-SLC-SEC-04
  - POL-SLC-SEC-05
  required_behavior:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  depth_required: 5
  depth_rationale: Portfolio baseline (security_limits) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
    test proving refusal with diagnostics.
- release_gates:
  - Every documented rule has negative coverage.
  capability_id: XCF-VALIDATE-001
  level: MUST
  category: validate
  title: Structure and payload validation
  production_meaning: Header rules, payload sizes, and compression integrity validate with positions before
    processing.
  developer_use_case: A pipeline rejects malformed images with exact reasons.
  provenance:
  - POL-IMG-VALIDATE-01
  - SAL-XCF-00044
  - SAL-XCF-00045
  required_behavior:
  - Validate header rules, declared-vs-actual payload sizes, and compression integrity with position diagnostics.
  normative_rules:
  - (spec) The XCF magic bytes 'gimp xcf ' followed by a version identifier and null terminator must be
    present at offset 0; invalid magic shall cause rejection
  - (spec) Each property in XCF must have a valid property type identifier; unrecognized property types
    must be skipped by conforming readers
  depth_required: 5
  depth_rationale: 'MUST validate capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Negative matrix per rule with positions asserted.
- release_gates:
  - Writer proven pixel-exact across the variant matrix.
  capability_id: XCF-WRITE-001
  level: MUST
  category: write
  title: Deterministic encoding
  production_meaning: Writers emit conformant files deterministically; decode-encode-decode is pixel-exact.
  developer_use_case: A developer re-encodes an image and pixel data survives bit-exact.
  provenance:
  - POL-IMG-WRITE-01
  - SAL-XCF-00029
  - SAL-XCF-00035
  required_behavior:
  - Encode every supported variant conformantly and deterministically; decode-encode-decode is pixel-exact.
  normative_rules:
  - (spec) XCF layer type encodes both color mode and alpha presence as a uint32 enum
  - (spec) XCF RLE compression encodes runs of identical bytes with a length prefix byte
  depth_required: 4
  depth_rationale: 'MUST write capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Determinism byte-compare; pixel-exact re-encode matrix.
preservation_contract:
  lexical_roundtrip:
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  loss_reporting_policy: Report every construct that cannot be preserved before saving, through a loss
    report API, rather than failing silently.
  structural_roundtrip:
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  unknown_construct_policy: Preserve unknown or future-version constructs that can be carried safely;
    never silently drop unrecognized content in lossless mode.
validation_contract:
  diagnostic_schema:
    fields:
    - code
    - severity
    - message
    - source_location
    - object_path
    - originating_rule
    - repair_suggestion
    - auto_repair_eligible
  layers:
  - description: Magic/header rules, dimension/depth fields, section structure.
    layer: structural
  - description: Pixel-data size vs declared dimensions; compression integrity.
    layer: payload
  - description: Dimension bombs, allocation limits, malformed-compression guards.
    layer: security
security_contract:
  attack_surfaces:
  - Huge declared dimensions causing over-allocation before payload checks.
  - Malformed or hostile compressed pixel data causing runaway decode.
  limits:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  safe_defaults:
  - Checked dimension arithmetic and configurable pixel-count limits before allocation.
  - Bounded decode with corruption positions reported.
test_contract:
- Test official or authoritative valid samples, invalid samples, synthetic edge cases, malformed inputs,
  and hostile inputs for every claimed capability.
- Prove parse-save-parse semantic equivalence for representative documents of every supported construct.
- Prove deterministic output by serializing the same document twice and byte-comparing.
- Publish a capability manifest stating supported versions, constructs, limitations, and lossless guarantees,
  verified against implementation and tests.
- Conversion matrix with pixel-exact and lossy-report cases.
- Edit round trips with pixel-exact verification outside edited regions.
- Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Header-only inspection fixtures match full-decode truth.
- Variant matrix decodes; dimension-bomb and truncation negatives.
- Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
  test proving refusal with diagnostics.
- Negative matrix per rule with positions asserted.
- Determinism byte-compare; pixel-exact re-encode matrix.
release_gates:
- Conversions policy-governed and reported.
- Every mutation class round-trip proven.
- All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Model covers every structural construct of the specification.
- All specified variants decode with pixel-exact fixtures.
- All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Every documented rule has negative coverage.
- Writer proven pixel-exact across the variant matrix.
- Capability manifest published and independently verified against implementation and tests.
