scope_policy:
  minimum_viable_support: Parse documents with includes governed, expose typed elements and graph connections,
    validate structure and references, and write lossless output.
  production_complete_target: 'Complete document/graph model of the target version: typed values, names/namespaces,
    node definitions and implementations, library loading, graph editing with invariant preservation,
    looks/variants/assignments where specified, layered validation, and lossless writing.'
capabilities:
- release_gates:
  - Color metadata resolution proven; transforms opt-in only.
  capability_id: MTLX-COLOR-001
  level: MUST
  category: model
  title: Color-space metadata
  production_meaning: Color-space declarations at document/node/input/value levels resolve hierarchically;
    numeric transforms happen only through an explicit color-management adapter.
  developer_use_case: A developer reads the effective color space of any value and wires an OCIO-style
    adapter explicitly when transforms are needed.
  provenance:
  - POL-TGR-COLOR-01
  - SAL-MTLX-00108
  - SAL-MTLX-00110
  required_behavior:
  - Preserve and hierarchically resolve color-space declarations; provide an adapter interface for transforms;
    never numerically transform colors without an explicit backend and policy.
  normative_rules:
  - (MaterialX specification - value types) The standard type system defines scalar vector color matrix
    string filename and array value types with lexical value forms
  - (MaterialX specification - color spaces) colorspace attributes declare the color space of values and
    images and are inherited hierarchically through the element tree
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Inheritance-resolution fixtures; no-implicit-transform negative.
- release_gates:
  - Resolution behavior matches the specification's precedence rules.
  capability_id: MTLX-DEF-001
  level: MUST
  category: resolve
  title: Definition and implementation resolution
  production_meaning: Node instances resolve to definitions by category/type/version/target with defaults
    and explicit versions; ambiguous/missing/incompatible matches are reported, never guessed.
  developer_use_case: A developer asks which definition a node resolves to and receives the exact match
    plus alternatives.
  provenance:
  - POL-TGR-DEF-01
  - SAL-MTLX-00101
  - SAL-MTLX-00103
  - SAL-MTLX-00107
  - SAL-MTLX-00111
  - SAL-MTLX-00113
  - SAL-MTLX-00114
  - SAL-MTLX-00117
  required_behavior:
  - Resolve instances to definitions and implementations honoring version/target rules; report ambiguous,
    missing, or incompatible matches explicitly.
  normative_rules:
  - (MaterialX Specification — Document Structure) A MaterialX document is rooted at a <materialx> element
    carrying a version attribute; top-level children include <nodedef>, <typedef>, <nodegraph>, <look>,
    and <propertyset> elements (shared structural aggregate referenced by the nodedef/typedef/look/propertyset
    qnames)
  - (MaterialX specification - versioning) Documents with older version attributes must be upgraded through
    defined version transforms before target-version semantics apply
  - (MaterialX specification - definition resolution constraints) Node instances must resolve to a nodedef
    by category type version and target and unresolvable or ambiguous instances are invalid
  - (MaterialX specification - implementations) implementation elements bind nodedefs to source implementations
    or implementation nodegraphs per target
  - (MaterialX specification - nodes) node elements instantiate node definitions with typed input elements
    connected to upstream outputs or carrying literal values
  - (MaterialX specification - node definitions) nodedef elements declare node interfaces with typed input
    and output children and version and target attributes for resolution
  - (MaterialX specification - units) unittype and unit attributes declare measurement units for values
    with conversion governed by unit definitions
  depth_required: 4
  depth_rationale: 'MUST resolve capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Resolution matrix incl. ambiguity and missing-definition negatives.
- release_gates:
  - Token resolution deterministic across the fixture matrix.
  capability_id: MTLX-GEOM-001
  level: MUST
  category: model
  title: Geometry metadata and token resolution
  production_meaning: Geometry paths, geometry-scoped properties, and filename token substitutions (including
    tile-set styles where defined) resolve deterministically; actual geometry loading stays outside the
    core.
  developer_use_case: A developer resolves filename tokens for a geometry binding without loading any
    geometry data.
  provenance:
  - POL-TGR-GEOM-01
  - SAL-MTLX-00109
  - SAL-MTLX-00112
  required_behavior:
  - Represent geometry paths, geometry properties, and filename token substitution rules with deterministic
    resolution; keep geometry loading outside the core library.
  normative_rules:
  - (MaterialX specification - collections) collection elements define reusable sets of geometry paths
    via includegeom and excludegeom attributes referenced from assignments
  - (MaterialX specification - looks and assignments) look elements carry materialassign and propertyassign
    children binding materials and properties to geometry via geom attributes and collections
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Token-resolution fixtures across substitution rules.
- release_gates:
  - Graph operations preserve DAG/type invariants (property-tested where feasible).
  capability_id: MTLX-GRAPH-001
  level: MUST
  category: edit
  title: Graph editing with invariants
  production_meaning: Nodes/ports/graphs create, connect, disconnect, and query under type checks; cycles
    are detected; topological order and upstream/downstream traversal are first-class.
  developer_use_case: A developer wires nodes programmatically and illegal connections or cycles are refused
    with diagnostics.
  provenance:
  - POL-TGR-GRAPH-01
  - SAL-MTLX-00002
  - SAL-MTLX-00101
  - SAL-MTLX-00106
  - SAL-MTLX-00111
  - SAL-MTLX-00113
  - SAL-MTLX-00114
  - SAL-MTLX-00115
  - SAL-MTLX-00116
  - RF-MTLX-00001
  required_behavior:
  - Create/remove/clone/rename nodes and connect/disconnect ports with type checks; detect directed cycles;
    provide topological order, traversal, dependency closure, and dead-node detection.
  - Expose graph editing as typed operations - connect/disconnect with type checks, topological order,
    upstream/downstream traversal, and dependency closure - so pipeline tools build and analyze graphs
    without XML manipulation.
  normative_rules:
  - (MaterialX Specification — NodeGraph Elements) A <nodegraph> element contains a directed acyclic graph
    of <node> elements connected via named inputs/outputs; the graph exposes <output> elements as its
    external interface
  - (MaterialX Specification — Document Structure) A MaterialX document is rooted at a <materialx> element
    carrying a version attribute; top-level children include <nodedef>, <typedef>, <nodegraph>, <look>,
    and <propertyset> elements (shared structural aggregate referenced by the nodedef/typedef/look/propertyset
    qnames)
  - (MaterialX specification - connection constraints) Node connections must reference existing upstream
    outputs with compatible types and connection graphs must remain acyclic for the document to be valid
  - (MaterialX specification - implementations) implementation elements bind nodedefs to source implementations
    or implementation nodegraphs per target
  - (MaterialX specification - nodes) node elements instantiate node definitions with typed input elements
    connected to upstream outputs or carrying literal values
  - (MaterialX specification - node definitions) nodedef elements declare node interfaces with typed input
    and output children and version and target attributes for resolution
  - (MaterialX specification - node graphs) nodegraph elements contain node children and expose output
    elements that other elements reference
  - (MaterialX specification - materials) surfacematerial and shader-semantic node types bind shader nodes
    to materials through typed material inputs
  depth_required: 6
  depth_rationale: 'MUST edit capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Legal DAG operations, direct/indirect cycle refusal, traversal on deep chains.
- release_gates:
  - Include resolution deterministic and secure across the fixture matrix.
  capability_id: MTLX-INCLUDE-001
  level: MUST
  category: resolve
  title: Governed include and search-path resolution
  production_meaning: Includes resolve deterministically against document-relative and configured search
    paths with cycle detection, depth/count/byte limits, and an unresolved-inspection mode.
  developer_use_case: A developer inspects a document with broken includes instead of failing outright,
    then fixes the search path.
  provenance:
  - POL-TGR-INCLUDE-01
  - POL-TGR-INCLUDE-02
  - SAL-MTLX-00101
  - SAL-MTLX-00105
  - SAL-MTLX-00109
  - RF-MTLX-00003
  required_behavior:
  - Resolve includes against document-relative and configured search paths with cycle/repeat detection
    and depth, count, and byte limits; block traversal and network by default.
  - Offer an unresolved-reference mode so documents remain inspectable when includes are unavailable.
  - Resolve includes only against configured search paths with cycle detection and depth, file-count,
    and byte limits, blocking path traversal and network access by default while offering an unresolved-inspection
    mode.
  normative_rules:
  - (MaterialX Specification — Document Structure) A MaterialX document is rooted at a <materialx> element
    carrying a version attribute; top-level children include <nodedef>, <typedef>, <nodegraph>, <look>,
    and <propertyset> elements (shared structural aggregate referenced by the nodedef/typedef/look/propertyset
    qnames)
  - (MaterialX specification - includes with external references) MaterialX documents may include other
    documents via XInclude-style include references resolved against search paths
  - (MaterialX specification - collections) collection elements define reusable sets of geometry paths
    via includegeom and excludegeom attributes referenced from assignments
  depth_required: 5
  depth_rationale: 'MUST resolve capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Include cycles, deep chains, traversal attempts, and unresolved-mode fixtures.
- release_gates:
  - Standard libraries load and resolve without unsupported core constructs.
  capability_id: MTLX-LIB-001
  level: MUST
  category: resolve
  title: Standard-library management
  production_meaning: Standard definitions/implementations load over ordered search paths with precedence,
    content-hash caching, and shadowing/mismatch reports.
  developer_use_case: A developer loads pinned library versions and gets warnings when documents shadow
    standard definitions.
  provenance:
  - POL-TGR-LIB-01
  - SAL-MTLX-00108
  - RF-MTLX-00002
  required_behavior:
  - Load standard libraries with ordered search paths and precedence; cache immutable libraries by version
    and content hash; report shadowed definitions and version mismatches.
  - Load standard node libraries over ordered search paths with precedence and content-hash caching, reporting
    shadowed definitions and version mismatches so pinned pipelines stay reproducible.
  normative_rules:
  - (MaterialX specification - value types) The standard type system defines scalar vector color matrix
    string filename and array value types with lexical value forms
  depth_required: 4
  depth_rationale: 'MUST resolve capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Precedence and shadowing fixtures; cache-hash invalidation test.
- release_gates:
  - All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: MTLX-LIFECYCLE-001
  level: MUST
  category: lifecycle
  title: Baseline lifecycle I/O
  production_meaning: Load/save/bytes round-trip, version exposure, strict and tolerant read modes, first-class
    validation, deterministic serialization.
  developer_use_case: A developer integrates the library with only lifecycle APIs and never needs format-internal
    knowledge for I/O plumbing.
  provenance:
  - POL-SLC-LIFECYCLE-01
  - POL-SLC-LIFECYCLE-02
  - POL-SLC-LIFECYCLE-03
  - POL-SLC-LIFECYCLE-04
  - POL-SLC-LIFECYCLE-05
  - POL-SLC-LIFECYCLE-06
  required_behavior:
  - Provide load from filesystem path, readable stream, and in-memory bytes, returning the format's root
    document/model object.
  - Provide save to filesystem path and writable stream, plus serialization to bytes, producing output
    the library's own loader accepts.
  - Expose the detected format version and any declared version separately; never silently rewrite a declared
    version.
  - Support a strict read mode that rejects malformed input with diagnostics and a tolerant read mode
    that recovers where the format permits, with recovery actions reported.
  - Expose validation as a first-class callable operation returning structured diagnostics, not only as
    exceptions raised during parsing.
  - Offer deterministic serialization such that an unchanged loaded document serializes to identical bytes
    across repeated calls in the same mode.
  depth_required: 4
  depth_rationale: Portfolio baseline (lifecycle_io) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - Precedence resolution matches specification rules on fixtures.
  capability_id: MTLX-LOOK-001
  level: MUST
