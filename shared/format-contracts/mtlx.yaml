public_api_contract:
  mutation_operations:
  - nodegraph.connect(output, input)
  - document.rename(element, new_name, rewrite_references=True)
  read_operations:
  - nodegraph.topological_order()
  - nodegraph.upstream(element)
  root_types:
  - MaterialXDocument
  - Node
  - NodeGraph
  - NodeDef
preservation_contract:
  lexical_roundtrip:
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  loss_reporting_policy: Report every construct that cannot be preserved before saving, through a loss
    report API, rather than failing silently.
  structural_roundtrip:
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  unknown_construct_policy: Preserve unknown or future-version constructs that can be carried safely;
    never silently drop unrecognized content in lossless mode.
validation_contract:
  diagnostic_schema:
    fields:
    - code
    - severity
    - message
    - source_location
    - object_path
    - originating_rule
    - repair_suggestion
    - auto_repair_eligible
  layers:
  - description: XML well-formedness, root/version structure.
    layer: syntax
  - description: Required attributes, names, child rules, element categories.
    layer: structural
  - description: Value/type compatibility, array and member shapes, typedefs.
    layer: type
  - description: Node/port references, definition resolution, include closure.
    layer: referential
  - description: Graph acyclicity, port compatibility, inheritance, assignment precedence.
    layer: semantic
  - description: Include limits, path policy, size/nesting bounds.
    layer: security
security_contract:
  attack_surfaces:
  - Include/XInclude cycles and deep include chains causing resource exhaustion.
  - Path traversal via include or filename references escaping configured roots.
  - XML external entities during parsing.
  - Untrusted shader/implementation code treated as executable by careless consumers.
  limits:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  safe_defaults:
  - Includes resolve only against configured search paths with depth/count/byte limits and cycle detection;
    network access off by default.
  - External entities disabled; shader code carried as data, never compiled in core.
test_contract:
- Test official or authoritative valid samples, invalid samples, synthetic edge cases, malformed inputs,
  and hostile inputs for every claimed capability.
- Prove parse-save-parse semantic equivalence for representative documents of every supported construct.
- Prove deterministic output by serializing the same document twice and byte-comparing.
- Publish a capability manifest stating supported versions, constructs, limitations, and lossless guarantees,
  verified against implementation and tests.
- Inheritance-resolution fixtures; no-implicit-transform negative.
- Resolution matrix incl. ambiguity and missing-definition negatives.
- Token-resolution fixtures across substitution rules.
- Legal DAG operations, direct/indirect cycle refusal, traversal on deep chains.
- Include cycles, deep chains, traversal attempts, and unresolved-mode fixtures.
- Precedence and shadowing fixtures; cache-hash invalidation test.
- Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Assignment-precedence fixtures including conflicts and unreachable assignments.
- Dependency-inventory fixtures against resolved graphs.
- Unknown-construct round trip; typed-wrapper equivalence with generic access.
- Rename-with-references fixture; collision negatives.
- Version-recognition fixtures; entity-hardening negative fixture.
- Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
  test proving refusal with diagnostics.
- Generated-source fixtures per shipped backend; core-path no-compile proof.
- Transform fixtures verify type preservation and path maps.
- Type matrix round trip; incompatibility negatives.
- Unit-resolution and explicit-conversion fixtures.
- Upgrade fixtures per supported older version with ledger assertions and idempotency.
- Layer-by-layer negatives with path assertions.
- Graph validity matrix and resolver security fixtures as enumerated.
- Variant-selection fixtures incl. invalid names and conflicting assignments.
- Lossless round trip with includes; determinism byte-compare.
release_gates:
- Color metadata resolution proven; transforms opt-in only.
- Resolution behavior matches the specification's precedence rules.
- Token resolution deterministic across the fixture matrix.
- Graph operations preserve DAG/type invariants (property-tested where feasible).
- Include resolution deterministic and secure across the fixture matrix.
- Standard libraries load and resolve without unsupported core constructs.
- All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Precedence resolution matches specification rules on fixtures.
- Material resolution matches specification binding rules.
- Model lossless across the official example corpus.
- Reference integrity proven under rename operations.
- Parse security posture proven by hostile fixtures.
- All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Generation declared per backend; core completeness independent of it.
- Transforms proven invariant-preserving.
- All standard types round-trip with fidelity tests.
- No implicit unit conversion (negative-tested).
- Upgrade transforms idempotent and ledgered (tested).
- Every semantic rule class has negative coverage.
- Variant application proven non-destructive by default.
- Writer proven lossless on the official corpus.
- Capability manifest published and independently verified against implementation and tests.
