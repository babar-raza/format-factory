format_identity:
  active_content_model:
    has_active_content: true
    policy: Documents reference shader/implementation code and external includes. Core parsing never compiles,
      executes, or fetches; include resolution is governed by explicit search paths and limits; code generation
      is a separate opt-in adapter.
  data_model_type: graph
  description: 'MaterialX: typed node-graph exchange format (Academy Software Foundation MaterialX v1.39).
    Documents carry typed nodes, ports, definitions, and connection graphs with library resolution, used
    to exchange materials/shaders/looks across digital-content pipelines.'
  primary_use_cases:
  - Author, edit, and validate typed node graphs programmatically
  - Resolve node definitions against standard libraries and traverse dependency closures
  - Exchange graph assets across applications with lossless preservation of unknown constructs
