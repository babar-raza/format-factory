  source_authority_status: AUTHORITATIVE
  generator_version: fcl-compiler/1.0.0
  lifecycle_status: DRAFT
  confidence: low
  supersedes: null
  input_digests:
    fact_categories_sha256: 27df19fbe852ccb0b9d305711469f5ad02f686862e1dc453b53924b510e92468
    family_pack_sha256: a0c9e6a36ee0bc426d4a9b2e12de9ce1b0ec10239395c8a492e9bd1feb498d19
    qname_registry_sha256: e9ffff636120c9cfc8a8a15b06455a133065eb1cb6bc3f8d7123c13fb1bed9ca
