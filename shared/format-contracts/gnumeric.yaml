  - SAL-GNUMERIC-00061
  required_behavior:
  - Support content CRUD maintaining structure rules and reference integrity (styles, links, objects).
  normative_rules:
  - (spec) Gnumeric cell value is stored as text content in <gnm:Cell> element or via <gnm:V> child
  - (spec) Gnumeric ValueType attribute codes are 10=empty, 20=error, 30=string, 40=float, 60=boolean
  - (spec) Gnumeric individual named range element is <gnm:Name> with name and value children
  - (spec) Gnumeric calculation settings are stored in <gnm:Calculation> element as child of <gnm:Workbook>
  - (spec) Gnumeric cell string values of type 30 are stored as plain text content within <gnm:Cell>
  - (spec) Gnumeric float cell values (ValueType=40) are stored as decimal number strings within <gnm:Cell>
  - (spec) Gnumeric boolean cell values (ValueType=60) are stored as 1 for TRUE and 0 for FALSE
  - (spec) Gnumeric ColInfo Hidden attribute value 1 means the column is hidden from display
  - (spec) Gnumeric cell value element gnm:V contains the cell value as text for all value types
  - (spec) Gnumeric cell error values use numeric codes such as GNM_ERROR_DIV0 for division by zero
  - (spec) Gnumeric sheet attribute DisplayFormulas controls whether formulas or values are shown
  - (spec) Gnumeric sheet attribute HideZeros controls whether zero values are displayed as blank
  - (spec) Gnumeric WrapText attribute value 1 on Style means cell text wraps to multiple lines
  - (spec) Gnumeric cell locking is set via the Protection element inside Style with IsLocked attribute
  depth_required: 4
  depth_rationale: 'MUST edit capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Each mutation class save-reload-verifies; producer-reopen fixture where tooling exists.
