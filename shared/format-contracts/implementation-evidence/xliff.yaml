- evidence_id: XLIFF-BASELINE-SUITE
  path: reports/skills-rff6/skill-transcripts/build-evidence-ledger-xliff-001.json
  expected_result: PASS
  granularity: suite
  truth_boundary: 'SOURCE READ 2026-08-04 under the GAP-022 rule, updated 2026-08-05. Unlike ubl, xliff''s
    CORE is genuine work: segmentation.py (217 LOC) implements split_segment, join_segments, SegmentMapping,
    spanning-code closure checks and fresh-id enforcement; inline.py, text_editing.py and the reader/writer
    are real. Those `partial` entries are defensible pending audit.

    2026-08-05 correction: the prior note here named the eight XLIFF 2.1 modules as "...Resource Data,
    Change Tracking, Size and Length Restriction, Validation" -- Change Tracking is not one of the eight
    the contract''s own normative_rules name; the eighth is ITS (http://www.w3.org/2005/11/its). That
    error is fixed here rather than carried forward.

    modules.py now gives XLIFF-MODULE-001 a programmatic coverage manifest covering all eight (Translation
    Candidates, Glossary, Format Style, Metadata, Resource Data, Size and Length Restriction, Validation,
    ITS), each PRESERVATION_ONLY with round-trip fixtures proving lossless preservation (see notes above).
    No typed per-module accessor exists yet, so no XLIFF-MODULE-001 obligation may be recorded above `partial`;
    this deepens the evidence behind `partial`, exactly like the UBL slices that moved zero obligations
    while making the evidence real rather than fictional. validation/validator.py still performs no schema
    validation, so the schema-validation clauses inside XLIFF-VALIDATE-001''s `partial` entries remain
    overstated and still need per-obligation correction -- unchanged by this slice.

    XLIFF-NOTE-001, same session: no source change. Direct experiment first (before writing any test)
    showed reader.py''s _parse_inline is generic over every inline tag, so mrk/sm/em already survive with
    their exact attributes and document-order position -- which is what an overlapping span requires,
    since it cannot be a nested element pair. The gap was proof, not implementation; XLIFF-NOTE-001 could
    not be recorded `partial` before because it had zero shipped-namespace selectors, not because the
    behavior was absent.

    XLIFF-QA-001, same session: qa.py is new source (unlike NOTE-001). Five of six named QA categories
    implemented with dedicated tests each; length violations explicitly left undone pending Size/Length
    module modeling, documented rather than stubbed. No QA-001 obligation may be recorded above `partial`
    -- a check existing is not the same as it being verified against every fixture the required_tests
    line names, and length is a real, acknowledged gap in the category set itself.

    XLIFF-MERGE-001, same session: real new source (merge.py), unlike NOTE-001. SHOULD-level, and it stays
    SHOULD-level satisfied at `partial`: the reference adapter proves the protocol works end to end (extraction,
    reversible skeleton, translated merge, drift detection and refusal) but is deliberately not a real-world
    format adapter -- the obligation''s "never claim generic extraction" clause is precisely why no such
    claim is made here.

    Suite-level and NON-PROMOTING. The xliff suite is 265 passed with no failures (193 baseline + 22 +
    11 + 25 + 14 new), but that number is still dominated by the ten shadow-package files; the shipped-namespace
    files now contribute 87 tests (15 + 22 + 11 + 25 + 14). A green suite here says very little about
    the package that would be released. Binds no individual selector outcome to an obligation, so nothing
    here is verification; every obligation is recorded `partial` at most.'
