  execution_evidence_ids:
  - XLIFF-BASELINE-SUITE
  - XLIFF-LIFECYCLE-IO-SELECTOR-PROOF
  implemented_behavior:
  - 'XliffDocument.detected_version is set once, only by the reader''s _parse(), from the source file''s
    actual version attribute; `version` is the mutable, currently-declared value dumps()/dump() will
    write -- a plain field assignment (this model is not frozen) never touches detected_version, since
    there is no reconstruction step to accidentally reset it through, unlike a tree-based model would
    need. A freshly hand-built XliffDocument has detected_version=None. dumps() refuses (XliffWriteError)
    rather than silently rewriting an unsupported declared version to a supported one -- no coercion
    path exists.'
  missing_behavior: []
  proof_requirements:
    positive:
    - Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative
      test proving refusal with diagnostics.
    negative:
    - Selector-bound negative cases are not yet identified.
