    actual version attribute; `version` is the mutable, currently-declared value dumps()/dump() will
    write -- a plain field assignment (this model is not frozen) never touches detected_version, since
    there is no reconstruction step to accidentally reset it through, unlike a tree-based model would
    need. A freshly hand-built XliffDocument has detected_version=None. dumps() refuses (XliffWriteError)
