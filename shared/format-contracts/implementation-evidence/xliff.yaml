    field, unchanged). Configurable workflow transition validation is now built: check_state_transitions(before,
    after, policy) compares segment states between two document snapshots, matched by segment id, against
    a caller-supplied from_state -> permitted-to_states policy. No default policy is shipped -- XLIFF
    itself does not mandate transition legality, and inventing one would be exactly the proprietary semantics
