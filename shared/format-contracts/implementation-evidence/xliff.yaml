  implemented_behavior:
  - 'A genuine, spec-grounded slice of sc isolated-attribute validation now exists: validate() detects, per unit and separately per content type (source/target), whether an sc''s isolated attribute (yes, or no/absent -- "no" is the schema default) is consistent with whether a matching ec (by startRef against this sc''s id) exists anywhere in the same unit -- grounded directly in the pinned OASIS XLIFF 2.1 spec''s own prose (4.2.3.4 sc) and the pinned XLIFF 2.1 schematron''s F5S/F5T patterns. The check scans the whole unit, not just one segment, matching the schematron''s ancestor::xlf:unit//xlf:ec[...] scope and the spec''s explicit allowance for non-isolated sc/ec pairs to span multiple segments of one unit. The schematron''s F5.1S/F5.1T sibling assertions -- the obligation''s own remaining named gap -- are now also proven: when a non-isolated sc has a resolvable matching ec, canCopy/canDelete/canOverlap must be equivalent between the two (a "no" value on either side requires "no" on the other; "yes" and an absent attribute -- both meaning the same schema default -- are mutually compatible), and canReorder additionally allows sc''s own "firstNo" value, which requires the matching ec''s canReorder to be exactly "no". Two adjacent, honestly-documented notes, neither blocking this obligation''s own rule_text: the pre-existing, separate per-segment sc/ec pairing check (xliff.inline.ec.unpaired) still does not look across segment boundaries within a unit, a distinct limitation discovered (not introduced or repaired) when the core isolated-attribute check was first built; and the schematron''s F5.1S/F5.1T clause (a) -- exactly-one-matching-ec existence and document-order -- is not separately re-verified by the new attribute-matching check, since it only runs once _isolated_diagnostics has already proven a matching ec is present.'
