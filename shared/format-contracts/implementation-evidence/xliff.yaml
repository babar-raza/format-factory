  implemented_behavior:
  - 'Nesting depth and node count are bounded, directly bounding the primary XML algorithmic-complexity attack surface (deeply nested or oversized documents). Python''s arbitrary-precision integers mean size/count accumulation cannot silently overflow the way fixed-width arithmetic could in another language -- same characterization as the equivalent ubl obligation (SAL-UBL-OBL-8396E06EA0EA75FC, UBL-SEC-001). A width-shaped complexity vector distinct from the already-tested deep-nesting case is now also proven: _enforce_tree_limits (reader.py) checks max_xml_nodes on every node visited in its stack-based traversal, so a wide-but-shallow document (many siblings, shallow nesting -- the quadratic-blowup-style shape) is refused even though its depth stays low, confirmed by a dedicated 10000-sibling fixture against a tight max_xml_nodes limit.'
  - 'The remaining "checked arithmetic" gap is now closed with a genuine fix, not merely a test: comparing directly against the equivalent, already-implemented ubl obligation (SAL-UBL-OBL-8396E06EA0EA75FC) revealed its own _enforce_tree_limits checks FOUR vectors (node count, nesting depth, cumulative attribute count, cumulative text bytes) while this package''s own _enforce_tree_limits checked only two -- confirmed as a real, exploitable gap by direct probing before any fix: a document with 2000 attributes on its root element sailed straight through even with max_entries=100 explicitly configured, because attribute-count accumulation was never checked at all. Extended _enforce_tree_limits to also accumulate and check attribute count (against max_entries) and text bytes (against max_decompressed_bytes) incrementally during the same stack-based walk, matching the ubl sibling''s exact field choices and "check immediately after update" discipline. 4 new tests prove: an attribute flood on one element is refused; a document with attributes within the limit loads; a text-byte flood is refused; a document with text within the limit loads.'
