- evidence_id: XLIFF-NOTE-CATEGORY-ABSENT-VS-EXPLICIT-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-note-category-absent-vs-explicit-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Closes SAL-XLIFF-OBL-612349C06EB3E809 (XLIFF-PRESERVE-001), promoted partial->implemented. This obligation''s own missing_behavior named the exact gap and the exact fix: Note.category is spec-declared as unconstrained free "Text" with "Default value: undefined", so an explicit category="" is syntactically legitimate and semantically distinct from the attribute being absent, but Note.category (str, default "") could not tell them apart -- "fixing it needs a public-API type change (str -> str | None)". Made that exact change, mirroring Note.priority''s own already-proven int | None pattern in the same dataclass: reader.py''s note.get("category") (no default) returns None when absent and "" when explicitly empty; writer.py''s check changed from a falsy `if value.category:` to `if value.category is not None:`, since the falsy check had a second, previously undocumented consequence discovered while fixing this -- it silently dropped an explicit category="" on write, making an explicit empty category not just unreadable-as-distinct but actually unwritable. Verified zero false positives against the entire pre-existing 472-test xliff suite before changing the one test that had documented the gap (test_note_category_absent_and_explicit_empty_collide_a_genuine_narrow_gap, which asserted the collision) into a fix-proving test asserting the two are now distinguishable. 2 additional new tests prove an explicit empty category and an absent category each survive a write-reload round trip correctly. xliff suite: 472 -> 474 passed. mypy clean. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, the fix grounded directly in the obligation''s own missing_behavior text and this package''s own already-proven Note.priority pattern. Covers SAL-XLIFF-OBL-612349C06EB3E809 only; it supports no other obligation and promotes no other product state.'
- evidence_id: XLIFF-DATA-ELEMENT-REQUIRED-ID-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-data-element-required-id-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Narrows (strengthens, does not change the already-partial status of) SAL-XLIFF-OBL-C632C43201760C05 (XLIFF-INLINE-001) and SAL-XLIFF-OBL-C6C67E6C253C9EAB (XLIFF-PARSE-001). Both obligations'' own missing_behavior already named this exact gap: "The <data> element''s own REQUIRED id attribute is not separately enforced as a validate() diagnostic if absent (only downstream dataRef resolution against present ids is checked)." Read the pinned core schema directly (.local/format-contracts/acquired/xliff/src-xlf-002.bin, schemas/xliff_core_2.0.xsd) and confirmed <xs:attribute name="id" use="required" type="xs:NMTOKEN"/> on the <data> element. Read _data_ref_diagnostics (validator.py) directly and found data_ids = {value.id for value in unit.original_data if value.id} silently excludes any <data> element with a missing/empty id from the set -- no diagnostic was ever raised for the <data> element itself violating its own required attribute. Confirmed genuinely unenforced by direct probing before any fix: a unit with one <data> element missing its id attribute validated with no diagnostic naming that element at all. Added a dedicated check at the top of _data_ref_diagnostics that flags every <data> element with a missing/empty id as xliff.originalData.data.id.missing, before the existing dataRef-resolution logic runs. Verified zero false positives against the entire pre-existing 470-test xliff suite before writing a single new test. 2 new tests (tests/python/xliff/test_obligation_original_data_element_modeling.py) prove: a <data> element missing its id is flagged; a normal document with all ids present is unaffected. xliff suite: 470 -> 472 passed. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, the required-attribute rule grounded directly in the pinned core schema text. Covers SAL-XLIFF-OBL-C632C43201760C05 and SAL-XLIFF-OBL-C6C67E6C253C9EAB only; it supports no other obligation and promotes no product state.'
- evidence_id: XLIFF-ATTRIBUTE-TEXT-LIMITS-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-attribute-text-limits-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Closes SAL-XLIFF-OBL-130340BC212989D5 (XLIFF-SEC-001), promoted partial->implemented. The obligation''s own missing_behavior judged the gap as likely non-exploitable ("largely redundant with the count/depth-limit tests already present"), but comparing directly against the equivalent, already-implemented ubl obligation (SAL-UBL-OBL-8396E06EA0EA75FC, UBL-SEC-001) revealed a real, previously-unnoticed asymmetry: ubl''s own _enforce_tree_limits checks FOUR complexity vectors (node count, nesting depth, cumulative attribute count, cumulative text bytes), while this package''s own _enforce_tree_limits checked only the first two. Confirmed as a genuine, exploitable gap by direct probing before any fix: a document with 2000 attributes on its root element sailed straight through even with max_entries=100 explicitly configured, and a document with 5000 bytes of text sailed through with max_decompressed_bytes=100 explicitly configured -- neither vector was bounded at all, unlike the ubl reader''s own equivalent check. Extended _enforce_tree_limits (reader.py) to accumulate and check attribute count (against max_entries) and text bytes (against max_decompressed_bytes) incrementally during the same stack-based walk that already checks node count and depth, matching the ubl sibling''s exact field choices and "check immediately after update, not after the full tree is built" discipline. Verified zero false positives against the entire pre-existing 466-test xliff suite before writing a single new test. 4 new tests prove: an attribute flood on one element is refused (independent of node count and nesting depth, both trivially small in the fixture); a document with attributes within the limit loads; a text-byte flood is refused; a document with text within the limit loads. xliff suite: 466 -> 470 passed. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, the fix grounded directly in the already-proven, structurally-identical ubl sibling implementation, not invented from memory. Covers SAL-XLIFF-OBL-130340BC212989D5 only; it supports no other obligation and promotes no product state.'
- evidence_id: XLIFF-XML-SPACE-INHERITANCE-RESOLUTION-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-xml-space-inheritance-resolution-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Narrows (does not fully close) 2 obligations sharing "Expose the document hierarchy ... with tree order and inherited attributes resolved" / "Model the full core hierarchy with tree order, IDs, references, inheritance, and scope preserved through edits" across XLIFF-MODEL-001 (SAL-XLIFF-OBL-7DA078717EA60881, SAL-XLIFF-OBL-867500AA0AC3D2C1). Before this slice, confirmed genuinely unbuilt by grep: no inheritance/effective-attribute-resolution logic existed anywhere in model/document.py. Read the pinned XLIFF 2.1 spec''s own default-value table directly (.local/format-contracts/acquired/xliff/src-xliff-001.bin, section 4.3.2.2 xml:space): "default values for this attribute depend on the element in which it is used: When used in <data>: The value preserve. When used in <xliff>: The value default. When used in any other element: The value of the xml:space attribute of its parent element." Added effective_xml_space() to model/document.py as a reusable resolution primitive (local value if present; otherwise "preserve" for <data> unconditionally, or the caller-supplied parent value for every other element) rather than a full tree-walking API -- this package''s model has no parent back-references anywhere, so a true "ask any node its own effective xml:space" method would require a larger, separate architecture change (parent pointers or a redesigned tree), deliberately not attempted without dedicated design review, matching this session''s established discipline for similar architecture-shaped questions (UBL-WRITE-001''s auto-reordering, XLIFF''s own tolerant-recovery-mode obligation). Exported from model/__init__.py and the package''s own __init__.py. 5 new tests prove: a locally declared value always wins over the parent; an absent value inherits the parent''s effective value; <data> always defaults to preserve regardless of parent; an explicit value on <data> still wins over its own fixed default; the function''s own default parent argument matches the root''s spec-mandated default. xliff suite: 461 -> 466 passed. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, the resolution rule grounded directly in the pinned spec''s own default-value table. Covers SAL-XLIFF-OBL-7DA078717EA60881 and SAL-XLIFF-OBL-867500AA0AC3D2C1 only; it supports no other obligation and promotes no product state.'
- evidence_id: XLIFF-MRK-COMMENT-REF-RESOLUTION-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-mrk-comment-ref-resolution-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Closes 4 obligations sharing "id attributes on file group unit and inline elements must be unique within their specification-defined scope and references must resolve" across XLIFF-MODEL-001/VALIDATE-001/PARSE-001/INLINE-001 (SAL-XLIFF-OBL-441E7C6F7C341B12, SAL-XLIFF-OBL-DA738080DC614E67, SAL-XLIFF-OBL-EC188D4F6DD138A0, SAL-XLIFF-OBL-F20C2CA429BA381B, all moved partial->implemented). This was the last remaining "references must resolve" gap after ec/sc pairing and dataRef were closed earlier this session -- confirmed genuinely unimplemented by grep before this slice: no code path anywhere in validator.py or model/inline.py read or resolved mrk''s own ref attribute. Read the pinned XLIFF 2.1 spec source directly (.local/format-contracts/acquired/xliff/src-xliff-001.bin, section 4.7.3.1.3 Comment Annotation): "The ref attribute MUST be present and contain the URI of a <note> element within the same enclosing <unit> element that holds the comment," with the spec''s own worked example using the fragment form ref="#n=n1" against a sibling <note id="n1">. Also confirmed via the same source that the spec''s OTHER documented ref usage (type="term", e.g. ref="http://dbpedia.org/page/...") points at an arbitrary external URI with no same-document resolution requirement at all -- deliberately scoped this check to mrk[type="comment"] only, avoiding inventing a constraint for type="term" the spec never states. Added _mrk_comment_ref_diagnostics() to validator.py, wired at the same per-unit call site as the existing _data_ref_diagnostics(). Verified zero false positives against the entire pre-existing 455-test xliff suite before writing a single new test -- no existing fixture used a comment-type mrk with an unresolvable ref. 6 new tests prove: a comment ref resolving to a same-unit note validates cleanly; an unresolvable ref is flagged; a ref with zero notes in the unit is flagged; a term-type mrk''s external-URI ref is never checked; a comment-type mrk with no ref at all is not checked here (presence is a separate concern); and the check applies independently to target content. xliff suite: 455 -> 461 passed. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, every claim grounded directly in the pinned spec''s own prose and worked example. Covers SAL-XLIFF-OBL-441E7C6F7C341B12, SAL-XLIFF-OBL-DA738080DC614E67, SAL-XLIFF-OBL-EC188D4F6DD138A0, and SAL-XLIFF-OBL-F20C2CA429BA381B only; it supports no other obligation and promotes no product state.'
- evidence_id: XLIFF-ITS-MAPPING-LANG-ATTRIBUTE-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-its-mapping-lang-attribute-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Closes SAL-XLIFF-OBL-725053FB0A47E78D (XLIFF-MODULE-001) and SAL-XLIFF-OBL-E3F1C46FFD77CD5B (XLIFF-PARSE-001), identical rule_text: "The ITS module uses the W3C ITS namespace ... and the XLIFF 2.1 mapping adds urn:oasis:names:tc:xliff:itsm:2.1 attributes for domains and language." The domains half was already proven by test_its_mapping_attributes_round_trip_on_a_unit; the "language" half had never been separately tested, and both obligations'' own missing_behavior text explicitly declined to assume it behaves identically to domains without verifying. Read the pinned itsm.xsd schema directly (.local/format-contracts/acquired/xliff/src-xlf-002.bin, schemas/itsm.xsd) rather than transcribing the rule_text''s own English prose literally: the actual declared XML attribute is itsm:lang (xs:attribute name="lang" type="xs:language"), not "itsm:language" -- a real transcription risk caught before writing any test, the same discipline applied repeatedly this session for schema-derived names. Probed directly and confirmed itsm:lang already round-trips correctly through this package''s generic attribute-preservation mechanism, the same one already proven for itsm:domains -- zero source code changes needed. 1 new test (test_its_mapping_lang_attribute_round_trips_on_a_unit) proves it, mirroring the existing domains test''s exact structure. xliff suite: 454 -> 455 passed. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, the attribute name grounded directly in the pinned schema. Covers SAL-XLIFF-OBL-725053FB0A47E78D and SAL-XLIFF-OBL-E3F1C46FFD77CD5B only; it supports no other obligation and promotes no product state.'
- evidence_id: XLIFF-INLINE-REQUIRED-ID-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-inline-required-id-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Closes SAL-XLIFF-OBL-378A1E5A93B9F0E1 (XLIFF-INLINE-001) and SAL-XLIFF-OBL-3A70AA27631A594D (XLIFF-PARSE-001), identical rule_text: "Standalone placeholders use ph with a required id; paired containers use pc with a required id; spanning pairs use sc with a required id and non-isolated ec with a startRef to that id." Read _validate_inline directly before writing any test and confirmed it already checked duplicate inline ids and ec/sc pairing but never checked that ph/pc/sc actually carry an id at all -- a genuinely unenforced MUST-constraint, not merely untested behavior. Added a small check to _validate_inline: any ph/pc/sc element with a falsy id is flagged xliff.inline.id.required, checked independently for source and target content. ec is deliberately excluded from this new check -- it identifies its pairing via startRef, not its own id, and the spec text does not require one on ec itself (the pre-existing xliff.inline.ec.unpaired check already covers startRef resolution). Verified zero false positives against the entire pre-existing 447-test xliff suite before writing a single new test -- no existing fixture used a ph/pc/sc without an id. 7 new tests prove: ph/pc/sc each independently flagged when missing an id; ph with an id and ec without an id (correctly) are not flagged; a fully-id-carrying document validates cleanly; and the check applies independently to target content, not only source. xliff suite: 447 -> 454 passed. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, every claim grounded directly in the pinned obligation''s own rule_text. Covers SAL-XLIFF-OBL-378A1E5A93B9F0E1 and SAL-XLIFF-OBL-3A70AA27631A594D only; it supports no other obligation and promotes no product state.'
- evidence_id: XLIFF-FILE-REQUIRED-AND-FILE-ID-REQUIRED-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-file-required-and-file-id-required-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Closes SAL-XLIFF-OBL-087892B36F8591FF''s (XLIFF-PARSE-001) remaining two clauses and its cross-capability duplicate SAL-XLIFF-OBL-AD191413B05A60ED (XLIFF-MODEL-001, identical rule_text, promoted missing->implemented). The obligation''s own rule_text bundles three clauses -- "one or more file elements", "each carrying an id attribute", "unique within the document" -- but the file/group-id-uniqueness tick (XLIFF-FILE-GROUP-ID-UNIQUENESS-PROOF, this same test file) only ever directly proved the third. xliff.file.required (a document with zero file elements is invalid) and xliff.file.id.required (a file element missing its id attribute is invalid) both already existed in validator.py, confirmed via direct interactive probing before writing any test, but neither had dedicated test coverage. Also discovered and corrected a stale claim in SAL-XLIFF-OBL-AD191413B05A60ED''s own prior missing_behavior text: it asserted "no shipped-namespace test builds a multi-file document, so file-id-unique-within-document is never exercised," which was already false at the time this tick began -- the file/group-id-uniqueness tick had already added exactly that test, but this sibling obligation was never reconciled to reflect it, leaving it stuck at missing while its identical-rule_text sibling under XLIFF-PARSE-001 was already implemented. 2 new tests added to test_obligation_file_and_group_id_uniqueness.py prove: a document with zero file elements is flagged xliff.file.required; a file element with no id attribute is flagged xliff.file.id.required. Zero source code changes -- both checks were already shipped, only untested from this specific angle. xliff suite: 445 -> 447 passed. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule. Covers SAL-XLIFF-OBL-087892B36F8591FF and SAL-XLIFF-OBL-AD191413B05A60ED only; it supports no other obligation and promotes no product state.'
- evidence_id: XLIFF-ISOLATED-PAIRING-ATTRIBUTE-MATCHING-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-isolated-pairing-attrs-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Closes the remaining named gap on the 6-obligation isolated-attribute cluster (SAL-XLIFF-OBL-7508113EBF7E4457 and its cross-capability duplicates, all 6 moved partial->implemented), first built in an earlier tick this session (XLIFF-ISOLATED-START-CODE-VALIDATION-PROOF) which explicitly documented "the schematron''s F5.1S/F5.1T sibling assertions on canCopy/canDelete/canReorder/canOverlap attribute matching between paired sc/ec elements remain unbuilt" as this cluster''s only remaining gap. Grounded directly in the pinned XLIFF 2.1 schematron''s own F5.1S/F5.1T assertions (.local/format-contracts/acquired/xliff/src-xlf-002.bin, schemas/xliff_core_2.1.sch): when a non-isolated sc has a resolvable matching ec in the same unit, canCopy/canDelete/canOverlap must be equivalent between the two -- a "no" value on either side requires "no" on the other; "yes" and an absent attribute (both meaning the same schema default of "yes") are mutually compatible with each other -- and canReorder additionally allows sc''s own "firstNo" value, which requires the matching ec''s canReorder to be exactly "no". Added _can_attr_matches() and _isolated_pairing_attribute_diagnostics() to validator.py, deliberately scoped to only this sub-clause: _isolated_diagnostics already proves ec existence before this new function runs, so the schematron''s clause (a) (exactly-one-ec, document order) is not re-implemented. Verified zero false positives against the entire pre-existing 436-test xliff suite before writing a single new test -- no existing fixture used any can* attribute at all. 9 new tests prove: matching canCopy=no/no and absent/yes/absent-absent combinations all validate cleanly; a no/absent mismatch is flagged; canDelete and canOverlap mismatches are independently reported; canReorder=firstNo with a matching ec canReorder=no validates cleanly; firstNo with ec canReorder absent is a violation; an isolated=yes sc is never checked (no matching ec by definition); and an sc with no matching ec at all (already covered by the separate missing_ec diagnostic) is not double-checked for attribute matching. xliff suite: 436 -> 445 passed. Two adjacent, honestly-documented limitations are named in each obligation''s own implemented_behavior rather than left silent: the pre-existing per-segment ec.unpaired check still does not look across segment boundaries (a distinct, pre-existing limitation, not introduced or repaired here), and clause (a)''s exactly-one-ec/document-order assertion is not separately re-verified. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, every assertion grounded directly in the pinned schematron text. Covers SAL-XLIFF-OBL-7508113EBF7E4457, SAL-XLIFF-OBL-25A6AEE1EE8FA679, SAL-XLIFF-OBL-2D08D42095E5EFD9, SAL-XLIFF-OBL-452A66EC673B7518, SAL-XLIFF-OBL-4CDD66101DC1EEB9, and SAL-XLIFF-OBL-E8055B0103E9E5CD only; it supports no other obligation and promotes no product state.'
- evidence_id: XLIFF-FORMAT-STYLE-FS-VALUES-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-format-style-fs-values-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Closes 2 obligations sharing "The Format Style module uses namespace urn:oasis:names:tc:xliff:fs:2.0 and defines fs and subFs attributes; fs values are constrained by the module schema" across XLIFF-MODULE-001/PARSE-001 (both moved partial->implemented). Unlike the Metadata/Resource Data/Matches modules closed in the three immediately preceding ticks (each a single top-level extension element), fs and subFs "attach to existing core elements rather than introducing their own" -- confirmed directly by this package''s own pre-existing fixture (test_format_style_attributes_round_trip_on_a_unit), which attaches them to a <unit>, not an inline element. Grounded directly in the pinned XLIFF 2.1 Format Style module schema (.local/format-contracts/acquired/xliff/src-xlf-002.bin, schemas/fs.xsd): fs:fs is restricted to a fixed 58-value enumeration of HTML-tag-like tokens, cross-verified programmatically against every <xs:enumeration> entry in the pinned XSD (not typed from memory) to confirm an exact 58/58 match; fs:subFs is an unrestricted xs:string with no value to check. Added _format_style_module_diagnostics() to validator.py, checking every host this package generically preserves unknown attributes on: the unit itself, each segment/ignorable and its own source/target attribute dicts, and every inline code element (ph/pc/sc/ec/mrk) within source/target content -- broader scope than the three prior module ticks, which only needed to check a single top-level extension''s own re-parsed XML. Verified zero false positives against the entire pre-existing 428-test xliff suite before writing a single new test -- the package''s own existing fs:fs="span" fixture was already a valid enumerated value. 8 new tests prove: valid fs values on a unit and on an inline element validate cleanly; invalid values on a unit, an inline element, and source_attributes are each independently flagged; subFs accepts any string; no fs attributes anywhere stays clean; and a representative spot-check across 8 of the 58 enumerated values (a, h1, h6, table, tt, ul, div, span) are all individually accepted. xliff suite: 428 -> 436 passed. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, every enumerated value cross-checked programmatically against the pinned schema. Covers SAL-XLIFF-OBL-D8C6CC9733716C74 and SAL-XLIFF-OBL-CF05EFE9DC2D7502 only; it supports no other obligation and promotes no product state.'
- evidence_id: XLIFF-MATCHES-MODULE-STRUCTURE-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-xliff-matches-module-structure-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike XLIFF-BASELINE-SUITE. Closes 3 obligations sharing "matches contains one or more match elements, and each match requires ref plus one source and one target" across XLIFF-TEXT-001/PARSE-001/MODULE-001 (all 3 moved partial->implemented). Before this slice, the Translation Candidates (Matches) module was preserved only as opaque extension content -- the same starting point Metadata and Resource Data were in before the two immediately preceding ticks this session. Grounded directly in the pinned XLIFF 2.1 Translation Candidates module schema (.local/format-contracts/acquired/xliff/src-xlf-002.bin, schemas/matches.xsd): mtc:matches declares minOccurs="1" maxOccurs="unbounded" for its mtc:match children; mtc:match itself declares ref use="required" and requires EXACTLY one xlf:source and EXACTLY one xlf:target direct child, both using the XLIFF core namespace (imported from xliff_core_2.0.xsd), not the Matches module''s own namespace. Added _matches_module_diagnostics() to validator.py, wired at the same 3 existing extension-walking call sites alongside the pre-existing _extension_well_formed()/_metadata_module_diagnostics()/_resource_data_module_diagnostics() checks. While verifying against the full pre-existing 421-test xliff suite before writing any new test, found and fixed a genuinely pre-existing, non-conformant fixture: test_translation_candidates_module_round_trips had an mtc:match with a ref attribute but no source or target children at all (raw text content directly inside match, which the schema also does not permit since mtc:match''s complexType is mixed="false") -- fixed by adding proper source/target children carrying the same "candidate" text the test already asserted on, the same "correct the fixture, not the validation" discipline already applied earlier this session for originalData/dataRef (event 222). 7 new tests prove: a well-formed match validates cleanly; matches with no match child is a violation; a match with no ref is a violation; a match with neither source nor target is flagged for both independently; a match with two sources is flagged only for source (not target, which is still exactly one); multiple well-formed matches all validate cleanly; and a non-Matches-namespaced extension is untouched. xliff suite: 421 -> 428 passed. NOT backed by an independent reference XLIFF implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, every claim grounded directly in the pinned Translation Candidates module XSD. Covers SAL-XLIFF-OBL-73868B0E3F5A4C22, SAL-XLIFF-OBL-8CD918D3D6C70981, and SAL-XLIFF-OBL-D1E0B4FE10EAE4E3 only; it supports no other obligation and promotes no product state.'
