  implemented_behavior:
  - 'This obligation''s rule_text bundles three distinct clauses, and this slice proves two of them true for the first time (a third was already true and cited): (1) "offer canonical prefix ... policies" -- dumps() already normalizes ANY source namespace prefix alias (e.g. an ns1:/x: alias for the CommonBasicComponents/CommonAggregateComponents namespaces) to this package''s own canonical cbc:/cac:/ext: prefixes via ET.register_namespace(), regardless of what prefix the original document used, proven directly for the first time; (2) "write elements in schema-valid order" (the enforcement half, not the "independent of mutation order" half) -- dumps() now REFUSES with UblWriteError to serialize a document whose already-checked components (the same 13 cac: types the element-order validation cluster covers) have elements in the wrong relative order, via validate()''s pre-existing "refuse invalid documents" integration, proven directly for the first time; (3) "lossless mode preserving significant lexical values" -- already proven by the pre-existing test_obligation_preservation_mode.py (PreservationMode.LOSSLESS is dumps()''s own default and preserves the extension container byte-for-byte), cited here rather than re-proven.'
