    of the 137 `partial` entries below therefore assert implemented behavior that does not exist. They
    were produced by mapping capabilities to modules that EXIST; the builder cannot check that a module
    IMPLEMENTS its obligation. Correcting them needs per-obligation judgement, not a wholesale demotion.

    Suite-level and NON-PROMOTING. The ubl suite is 334 passed with no failures, but that figure is dominated
    by the ten shadow-package files; only test_production_namespace.py exercises the shipped namespace.
    Binds no individual selector outcome to an obligation, so nothing here is verification; every obligation
    is recorded `partial` at most.

    2026-08-05 (post events 74-82 and this session''s UBL-CALC-001 slice): the OVERSTATED framing above
    is no longer the current state of the package -- model/aggregates.py, model/values.py, model/temporal.py
    and model/charges.py now hold real typed components (InvoiceLine, Item, TaxTotal/TaxSubtotal, LegalMonetaryTotal,
    Amount/Quantity with Rounding policies, UblDate/UblTime/ UblDateTime, AllowanceCharge/Price/PaymentMeans)
    that did not exist when this truth_boundary was written, and reconcile_invoice() now performs tolerance-
    aware line-extension, tax-subtotal and allowance/charge reconciliation. This text is preserved as
    the historical record of the overstatement GAP-022 was written to catch, not as a current assessment
    -- see the capabilities section below and the notes above for what is actually mapped today. ubl suite:
    488 passed.

    2026-08-06: UBL-QUERY-001 (model/query.py, DocumentIndex) and UBL-REF-001 (DocumentIndex.duplicate_line_ids())
    add genuinely new source and tests since the 2026-08-05 addendum above. ubl suite: 507 -> 514 passed,
    ruff clean, mypy clean. ubl obligations: 165 partial/29 missing -> 182 partial/12 missing. No obligation
    reaches `implemented`.

    2026-08-06 (UBL-QUERY-001): model/query.py is new source, real and tested, not a remap of an existing
    stub. ubl suite: 488 -> 507 passed, ruff and mypy clean. Obligations: 163 partial/31 missing -> 165
