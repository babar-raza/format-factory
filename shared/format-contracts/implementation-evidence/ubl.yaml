  - UBL-BASELINE-SUITE
  - UBL-SIGNATURE-NAMESPACE-SELECTOR-PROOF
  implemented_behavior:
  - UblDocument.signature_preserved compares the current tree's serialized
    hash against the hash captured when a signature was last known intact;
    with_root() (the sole edit path) invalidates this on every edit, and
    validate() surfaces ubl.signature.invalidated as a non-fatal diagnostic
    -- a caller sees the report before saving rather than a silent loss.
    dumps() never rewrites subtrees since it always serializes the tree
    exactly as constructed, so a signed subtree an edit did not touch is
    never altered.
  missing_behavior:
  - '"Verification and signing remain a separate pluggable opt-in" is not
    implemented -- no signing or verification backend, pluggable or
    otherwise, exists in this package. Only signature-presence tracking
    (whether a previously-intact signature survived an edit) is built.'
  proof_requirements:
    positive:
    - Signed-document round-trip byte-preserves signed subtrees; edit-warning fixture.
    negative:
    - Selector-bound negative cases are not yet identified.
