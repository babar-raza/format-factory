  - 'FF6-EVENT-000296: the "not unified into one combined call" half of this obligation''s own missing_behavior is now closed. validate_all() (validation/combined.py) runs all 5 layers from one source (bytes/path/stream), returning every layer''s diagnostics together in one ValidationReport, never stopping at the first error -- exactly the obligation''s own wording. The earlier missing_behavior''s claim that unifying "would additionally require a pluggable business-rule mechanism... neither of which exists yet" was investigated and found wrong: ProfileValidatorRegistry (UBL-PROFILE-001''s own already-implemented, already-tested capability) IS the pluggable mechanism the rule_text asks for -- "pluggable" describes the mechanism''s extensibility, not a requirement to ship a comprehensive default rule set, which would be unscopable for a generic UBL library serving arbitrary jurisdictions/customizations anyway. 11 new tests (test_obligation_unified_validation.py) prove all 5 layers fire correctly, in combination, and that multiple simultaneous violations across different layers are all reported together.'
  - 'FF6-EVENT-000473: the code-list layer''s own "no automatic field-by-field code discoverer exists" gap is now partly closed. code_bearing_element_qnames() (validation/schema_validator.py) mechanically discovers all 273 code-bearing element types across the bundled schema graph via xmlschema type-derivation introspection, confirmed root-independent and confirmed to exclude the one deliberate same-shaped trap (cbc:CodeValue). validate_all(discover_codes=True) (opt-in; default False, unchanged) walks a document for those elements and validates the 9 of 11 this package has real bundled OASIS genericode data for connectable to an element (7 direct element-name matches, 2 via a confirmed, schema-cited element/ShortName override map for MimeCode and IdentificationCode), always honoring an explicitly document-declared list identity over any implied default, and silently skipping elements with no bundled data rather than fabricating a verdict. 12 new tests (test_obligation_discovered_code_validation.py).'
  - 'FF6-EVENT-000474: the 2 remaining bundled lists (LanguageCode, UnitOfMeasureCode), disclosed as an unbuilt attribute-based mechanism by the immediately prior event, are now also connected. _discovered_attribute_code_diagnostics() (validation/combined.py) walks the document for any node carrying the languageID or unitCode XML attribute (confirmed directly against BDNDR-CCTS_CCT_SchemaModule-1.1.xsd to be CCTS base-type attributes reused across many elements, e.g. cac:Item/cbc:Name[@languageID], cbc:InvoicedQuantity[@unitCode]) and validates the value directly against its bundled list -- no document-declared list-identity question applies here, since the attribute name itself names the list. All 11 of the 11 bundled OASIS genericode lists now connect to a real, tested discovery mechanism. 7 new tests (test_obligation_discovered_code_validation.py).'
  missing_behavior:
  - 'discover_codes=True validates only the 9 of 273 discoverable *element* code-bearing types (the type-derivation catalogue) this package has real bundled OASIS genericode data reachable for, plus the 2 attribute-carried lists -- the other 262 discoverable element types have no bundled value data at all; sourcing more official code lists (UNTDID, additional ISO/UN registries) is a separate, larger data-acquisition undertaking, not a schema-introspection gap, and is not attempted here. A caller who wants coverage beyond these 11 bundled lists must still supply codes explicitly via `used_codes`.'
