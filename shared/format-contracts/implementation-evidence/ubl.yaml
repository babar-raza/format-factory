  implemented_behavior:
  - 'Root-level namespace mismatches were already rejected (test_wrong_namespace_and_preview_profile_fail_closed). A genuine defense-in-depth mitigation is now also in place: validate() detects the one structural signature every find()/find_all() namespace-spoofing attempt must produce -- two or more same-local-name children, in different namespaces, under one parent -- and rejects the whole document as invalid before any find()-derived value could be trusted downstream. Proven directly against the exact reproduction case from this obligation''s own original finding (a spoofed {urn:evil:attacker:namespace}ID sibling of the real cbc:ID), at both the document root and nested deeper in the tree, regardless of spoofed-vs-real ordering. Verified to produce zero false positives against the entire pre-existing 878-test ubl suite before any new test was written, and deliberately does not recurse into ext:ExtensionContent (opaque vendor content this package never queries by field name, where the check would be a false-positive risk rather than a real protection).'
  missing_behavior:
  - 'find()/find_all() themselves (model/typed.py) remain unfixed at the primitive level -- confirmed directly, not merely assumed: find() still returns a spoofed element''s value when called directly without validating the document first, proven as its own dedicated test rather than hidden. This obligation''s own rule_text (unambiguous resolution, never best-effort local-name guessing) is therefore not fully satisfied by the new detection-only mitigation alone. Fixing find()/find_all() properly still requires auditing and updating roughly 78 call sites across typed.py/aggregates.py/charges.py/reference.py/document.py to verify the expected namespace, not just the local name -- a cross-cutting change with real blast radius, still out of scope for a single tick and left for a dedicated future taskcard with proper regression coverage.'
  proof_requirements:
    positive:
    - Same document under default namespace, prefixed, and re-prefixed forms parses to identical models;
      spoofed-namespace fixtures rejected.
    negative:
    - Selector-bound negative cases are not yet identified.
