- evidence_id: UBL-TOLERANT-RECOVERY-MODE-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ubl-tolerant-recovery-mode-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike UBL-BASELINE-SUITE. Closes SAL-UBL-OBL-6C91BBF7F11E4402 (UBL-LIFECYCLE-001), promoted partial->implemented. reader.py::_parse has exactly 3 raise sites: malformed XML syntax, an unrecognized document root name, and a root namespace mismatch. The first two stay hard failures under both modes (no tree exists at all under the first; no typed document class can be selected without a recognized root name under the second, matching the same discipline already applied to xliff''s own non-XLIFF-root case this same session). The third is the one genuinely recoverable defect: model/typed.py''s own find()/find_all() -- the primitive every typed field lookup in this package is built on -- is documented in its own docstring as matching by LOCAL NAME ONLY ("navigate by ID rather than {urn:...}ID"), never by namespace. Confirmed directly by interactive probe before writing any test: a document built with a deliberately wrong root namespace is still 100% field-accessible via find()/find_all() once accepted, since the mismatch never reaches any downstream lookup -- this is a materially SMALLER and SAFER recovery than xliff''s own 5-site fix, since the recovered document is not degraded at all, only a structural sanity check the object model never actually depended on is relaxed. Under mode="preservation", _parse now accepts the document using its already-recognized root_name and records a human-readable action on a new UblDocument.recovery_actions field (a frozen dataclass, tuple-typed for immutability consistency with the rest of the model); strict mode''s own exact pre-existing UblParseError message is unchanged, proven by the full pre-existing 1045-test suite passing with zero test modification. probe() is deliberately switched from mode="preservation" to mode="strict" in the same slice: before this obligation had any real recovery behavior that choice was inconsequential (both modes behaved identically), but it would now silently make probe() recognize a namespace-mismatched document as UBL, which is not what a probe''s own yes/no recognition judgment should mean -- verified the pre-existing test_wrong_namespace_and_preview_profile_fail_closed and probe(b"<Invoice/>")/probe(b"<Invoice/>") assertions (test_production_namespace.py) both still pass unchanged after the switch. 11 new tests (test_obligation_tolerant_recovery_mode.py) prove: strict refuses a namespace mismatch; preservation recovers it with exactly one recovery_actions entry; the recovered document is fully field-accessible; the default mode (no explicit kwarg) is strict; a correctly-namespaced document has an empty recovery_actions tuple under either mode; a document built directly in memory also has an empty tuple; malformed XML and an unrecognized root name both stay hard failures under both modes; probe() still rejects a namespace-mismatched document, still accepts a correctly-namespaced one, and still rejects a bare unnamespaced element. 1 sibling test in test_obligation_read_mode_lifecycle.py was renamed and its docstring corrected (its own "no document that preservation mode accepts while strict rejects" claim was accurate when originally written, now superseded by this slice, not wrong at the time it was written). ubl suite: 1045 -> 1056 passed. mypy --strict and ruff clean on all 3 changed source files. Combined 6-format run: 3746 -> 3757 passed, +11, 0 failed, 4 skipped -- zero regression. NOT backed by an independent reference UBL implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule; the recovery''s own safety is grounded directly in this package''s own find()/find_all() primitive''s already-documented, already-proven namespace-agnostic matching behavior, not a new spec interpretation. Covers SAL-UBL-OBL-6C91BBF7F11E4402 only; it supports no other obligation.'
- evidence_id: UBL-LINE-CRUD-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ubl-line-crud-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike UBL-BASELINE-SUITE. Closes SAL-UBL-OBL-AF5263F0FC7036B9 (UBL-EDIT-001), promoted missing->implemented. Narrows SAL-UBL-OBL-237188D47391391E (UBL-EDIT-001, sibling), remains partial. New module lines.py composes existing primitives -- XmlNode.with_children()/UblDocument.with_root() (immutable-replace), reorder_for_schema_order() (FF6-EVENT-000286), validate() and DocumentIndex.duplicate_line_ids() (the referential layer built for validate_all() at FF6-EVENT-000296) -- into add_line/remove_line/move_line/renumber_lines for line-role components (InvoiceLine/CreditNoteLine/OrderLine). New lines are appended after the last existing line, schema-position-correct by construction since Line elements are always the trailing repeating group in every UBL maindoc type''s own real schema sequence, then run through reorder_for_schema_order() so the inserted line''s own internal field order is also corrected regardless of how the caller constructed it. Every operation refuses (raises UblValidationError) to leave the document with a validation or referential-integrity failure it did not already have, comparing before/after diagnostic codes from both validate() and a direct DocumentIndex-based duplicate-line-id check. A first draft missed the duplicate-line-id case (add_line silently accepted a new line whose ID collided with an existing one) because the base validate() alone has no referential check -- caught during manual verification before any test was written, fixed by including the duplicate-line-id check directly rather than depending on combined.py''s own private helper. renumber_lines returns its own applied old-ID-to-new-ID map as an explicit reference-rewrite map, the exact mechanism SAL-UBL-OBL-AF5263F0FC7036B9''s own rule_text names, rather than attempting to auto-discover and rewrite every possible cross-reference a caller''s own extensions or customization profile might carry to a line ID (no closed set of such fields exists in UBL''s own generic model; it varies by profile). SAL-UBL-OBL-237188D47391391E''s own broader "core business components" scope (parties, payment means, tax totals, and more) remains genuinely uncovered by a dedicated CRUD API and is honestly documented as a separate, larger undertaking in the module''s own docstring and the obligation''s own updated missing_behavior, since arbitrary-position insertion for those types -- unlike lines, which are always the schema''s trailing group -- would need _ORDER_CHECKED_COMPONENTS-style ordering knowledge extended to cover document root types. 12 new tests (tests/python/ubl/test_obligation_line_crud.py) prove: add/remove/move/renumber each work correctly in isolation and composed together; every refusal path (nonexistent id, out-of-range move, renumber collisions, an unmatched id) raises the correct error; the duplicate-line-id regression case is explicitly guarded. Verified zero false positives against the entire pre-existing 1033-test ubl suite before writing a single new test. ubl suite: 1033 -> 1044 passed. ruff and mypy --strict clean. Combined 6-format run: 3666 -> 3678 passed (across this event and the immediately preceding sample-corpus-fix event), same 0 failures, 4 skipped. NOT backed by an independent reference UBL implementation for cross-validation, but every primitive this module composes (reorder_for_schema_order, validate, DocumentIndex) was itself independently built and tested earlier this session against the pinned OASIS UBL 2.3 schema -- the same strength of grounding as every other fix this tick. Covers SAL-UBL-OBL-AF5263F0FC7036B9 (closed) and SAL-UBL-OBL-237188D47391391E (narrowed) only; it supports no other obligation.'
- evidence_id: UBL-OFFICIAL-SCHEMA-VALIDATION-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ubl-official-schema-validation-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike UBL-BASELINE-SUITE. Closes 10 obligations and narrows 1 more, all promoted or updated together: SAL-UBL-OBL-03AF3A7D3A76F362/3C2E2EA8D3B697C9/783649FDF531B0F9/9736787B52CB148C/9C170E327B30FBD3 (the "full schema and cardinality validation" cluster, UBL-MODEL-001/DOCTYPES-001/PARSE-001/VALIDATE-001/REF-001) and SAL-UBL-OBL-26CD31E7F8CF91E1/31DE92275AF5F6EF/3B43504E9C74003C/4936871F9800219B/71FF376D05E7219A/CDADC5CFB25A9B9E (the "full element-order validation" cluster, UBL-SIGN-001/REF-001/MODEL-001/DOCTYPES-001/PARSE-001/VALIDATE-001) all promoted partial->implemented; SAL-UBL-OBL-788B2748204338B8 (UBL-VALIDATE-001, the 5-layer validation obligation) narrowed, remains partial. Both clusters'' own missing_behavior repeatedly named "the full UBL 2.3 schema''s ~91 root document types" as the scale of a "genuinely large, separate undertaking" if built as an independent, hand-written structural validator matching all 91 types'' own real schemas from scratch. Composing the REAL schemas the OASIS distribution itself ships is a fundamentally different, much smaller task -- applying the "systematically check every acquired/*.bin file for hidden data, magic numbers included" discipline proven repeatedly this session (xliff core+module schemas, ubl''s own genericode code lists earlier this same tick), re-examined .local/format-contracts/acquired/ubl/src-ubl-002.bin (already known to be the official UBL 2.3 distribution ZIP) for XSD content beyond the genericode files already extracted, and found xsd/common/ (15 shared component schemas) and xsd/maindoc/ (91 root-document-type schemas, one per document this package''s own ROOT_CLASSES models) -- the complete, authoritative OASIS UBL 2.3 schema, 106 files, 6.4MB uncompressed. Each maindoc schema''s own xs:import of the common schemas resolves via a plain relative schemaLocation path once all files are bundled together, unmodified, in the same directory structure OASIS itself ships. Added schema_validator.py (auto-detects a document''s own root element to select its matching maindoc schema, since UBL has 91 distinct root-typed schemas rather than one composable core+modules set like xliff), wrapping xmlschema''s own XMLSchemaValidationError/XMLResourceParseError into this package''s existing UblParseError/SchemaValidationUnavailable exception hierarchy for a consistent interface. Verified directly, before writing any test, that XSD sequence validation inherently catches BOTH cardinality and element-order violations together in one pass (an out-of-order or over-repeated child is structurally the same kind of violation to an XSD validator) -- proven against a real, well-formed Invoice (validates cleanly), a real CreditNote (validates cleanly, proving this isn''t hardcoded to one document type), a wrong-order Invoice (correctly rejected, "Unexpected child... Tag InvoiceLine expected"), and a duplicate-LegalMonetaryTotal Invoice (correctly rejected). Deliberately did NOT bundle the distribution''s own per-module ISO Schematron (.sch) files (a separate, XSLT-based toolchain, not required by any of these obligations'' own rule_text) or attempt to make the writer auto-reorder elements (UBL-WRITE-001''s own separate, still-unbuilt "independent of mutation order" clause, correctly left out of scope and preserved in narrowed obligation SAL-UBL-OBL-788B2748204338B8''s own missing_behavior alongside the still-genuinely-unbuilt pluggable-business-rule/code-list-field-mapping unification). Verified zero false positives against the entire pre-existing 1001-test ubl suite before writing a single new test. 10 new tests (tests/python/ubl/test_obligation_official_schema_validation.py) prove: a well-formed Invoice and CreditNote each validate cleanly; root_name auto-detection and explicit root_name both work; element-order and cardinality violations are each independently caught; every violation is reported, not just the first; an unsupported root document type and malformed XML each raise a clear UblParseError; the optional-dependency-unavailable path degrades gracefully. A real wheel was built via `pip wheel .` and all 106 bundled .xsd files confirmed to ship inside it, byte-identical to source (spot-checked UBL-Invoice-2.3.xsd), before any dependent code was written. ubl suite: 1001 -> 1011 passed. ruff and mypy --strict clean (36 source files). Combined 6-format run: 3586 -> 3596 passed, same 4 pre-existing unrelated safetensors interop failures, 2 skipped -- zero regression beyond the 10 intentional new tests. A self-inflicted YAML corruption during evidence authoring (a bulk-edit script that rewrote the file starting from the first obligation entry, discarding the preceding header and execution_evidence section) was caught immediately via a failed yaml.safe_load, before any commit, and fully repaired by reconstructing the header from the last-committed HEAD revision and re-verifying the obligation-ID and evidence-ID sets were unchanged before proceeding. NOT backed by an independent reference UBL implementation for cross-validation, but the bundled schemas ARE themselves the authoritative OASIS-published normative files, extracted byte-for-byte from the pinned official distribution package -- the same strength of grounding as xliff''s own core+module schema discovery and ubl''s own genericode code-list discovery earlier this session. Covers the 11 obligations named above only; it supports no other obligation.'
- evidence_id: UBL-OFFICIAL-CODE-LISTS-GENERICODE-LOADER-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ubl-official-code-lists-genericode-loader-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike UBL-BASELINE-SUITE. Closes SAL-UBL-OBL-C717DEB32BC6F815 and SAL-UBL-OBL-DE7D98EAE4344EDA (both UBL-CODELIST-001), both promoted partial->implemented. codelist.py''s own module docstring had honestly documented the gap: "does NOT bundle actual official code-list data ... and does not parse the OASIS genericode XML distribution format ... No SAL fact in this repository''s committed spec cache enumerates any such list''s actual values or documents the genericode schema with enough precision ... building either from memory would risk fabricating spec content." That was true of the SAL fact cache specifically, not of the pinned RAW spec acquisition cache -- applying the "read the pinned acquisition cache directly, do not trust the missing_behavior''s own framing of what it can and cannot contain" discipline just proven three times this session for xliff''s module schemas, found .local/format-contracts/acquired/ubl/src-ubl-002.bin (261,521 lines as a text dump, previously never opened as anything but spec HTML) is actually a ZIP archive -- confirmed by its own "PK" magic bytes -- and IS the real official UBL 2.3 distribution package (927 total archive entries), not spec prose at all. Its cl/gc/default/ directory contains the genuine OASIS-published genericode files for all of UBL 2.3''s standard code lists. Extracted and bundled 11 of them verbatim as package data (excluding the "-incl-deprecated"/"-incl-deleted" superset variants): AllowanceChargeReasonCode, BinaryObjectMimeCode, ChannelCode, CountryIdentificationCode (=ISO 3166), CurrencyCode (=ISO 4217), LanguageCode, PackagingTypeCode, PaymentMeansCode, TransportEquipmentTypeCode, TransportModeCode, UnitOfMeasureCode -- 4.87MB combined uncompressed, ~330KB compressed in a built wheel. Wrote a new genericode.py parsing the real OASIS genericode 1.0 structure these files themselves exhibit (confirmed directly against the parsed ElementTree, not assumed from memory: only the document''s own root element carries the genericode namespace prefix, every descendant is unprefixed/no-namespace) -- reads the document''s own declared ColumnSet/Key/ColumnRef to find the primary identifying column rather than hardcoding "code" as a column name, proven against a differently-named-column fixture. official_code_list_registry() composes load_bundled_code_lists() with the already-existing, already-proven CodeListRegistry with zero special-casing (matching codelist.py''s own "official and custom register identically" design). Verified against real, spot-checked values: USD/EUR/GBP are members of CurrencyCode; US/DE are members of CountryIdentificationCode; KGM/MTR are members of UnitOfMeasureCode; CurrencyCode''s own agency_id ("5", the UN/EDIFACT code for ISO) and version ("2018-08-29") are both extracted from the file''s own Identification block, not hardcoded. A real wheel was built via `pip wheel .` and all 11 bundled .gc files confirmed to ship inside it, byte-identical to source, before any dependent code was written -- catching a class of packaging misconfiguration that would only surface for actual pip-installed users. Hit one real security-baseline constraint while implementing: this package''s own test suite forbids importing `importlib` anywhere in src/ (a supply-chain-hardening rule already enforced for every other module) -- switched from `importlib.resources` to plain `pathlib.Path(__file__).parent`, matching the exact same pattern the xliff package''s own bundled-schema loader (built in a prior tick this session) already uses. Verified zero false positives against the entire pre-existing 987-test ubl suite before writing a single new test. 14 new tests (tests/python/ubl/test_obligation_official_code_lists.py) prove: all 11 lists load; every list has nonempty values; known-good/known-bad membership for 3 spot-checked lists; agency/version metadata extraction; the composed registry validates correctly and composes with a user-supplied list; a fresh registry each call does not leak mutation across callers; the genericode parser handles a non-standard key-column name and rejects malformed documents; every bundled filename is present on disk (a packaging-drift guard). Also updated codelist.py''s and the sibling test file''s own module docstrings, which had explicitly and specifically claimed this data/loader combination was unavailable -- both corrected to point at genericode.py rather than left to drift into stale-claim territory for a future tick to rediscover. ubl suite: 987 -> 1001 passed. ruff and mypy --strict clean (35 source files). Combined 6-format run: 3538 -> 3552 passed, same 4 pre-existing unrelated safetensors interop failures, 2 skipped -- zero regression beyond the 14 intentional new tests. NOT backed by an independent reference UBL implementation for cross-validation, but the bundled data ITSELF is the authoritative OASIS-published genericode files, extracted byte-for-byte from the pinned official distribution package -- the same strength of grounding as xliff''s own core-schema extraction earlier this session. Covers SAL-UBL-OBL-C717DEB32BC6F815 and SAL-UBL-OBL-DE7D98EAE4344EDA only; it supports no other obligation.'
- evidence_id: UBL-PAYMENT-MEANS-ORDER-VALIDATION-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ubl-payment-means-order-validation-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike UBL-BASELINE-SUITE. Closes SAL-UBL-OBL-B68F5F29F11197D6 (UBL-MODEL-001), promoted partial->implemented. The obligation''s own missing_behavior claimed "element order is not reflected or enforced anywhere in the model or validator," but reading _ORDER_CHECKED_COMPONENTS (validator.py) directly found all 6 of this obligation''s own source components (PaymentMeans, InvoiceLine, TaxTotal, LegalMonetaryTotal, AllowanceCharge, Price) already present -- the claim was stale for this obligation''s own specific scope, though the broader cluster claim (order-checking across every UBL complexType) remains genuinely true and is tracked separately. Cross-checked test coverage for each of the 6 components and found 5 already had dedicated order-violation tests (LegalMonetaryTotal, InvoiceLine, AllowanceCharge, Price, and TaxTotal correctly exempt since its own order tuple is a single element that can never itself violate order) -- only PaymentMeans lacked one. Confirmed exploitable-if-untested by direct probe before writing anything: a PayeeFinancialAccount-before-PaymentDueDate PaymentMeans document correctly failed validate() with ubl.order.violation and correctly refused dumps() with UblWriteError, proving the underlying enforcement already worked and only the test was missing. Added 4 new tests (tests/python/ubl/test_obligation_payment_means_cardinality_validation.py) closing that gap: fields in declared order validate cleanly, PayeeFinancialAccount before PaymentDueDate is an order violation, dumps() refuses the out-of-order document, dumps() writes a well-formed one without incident. Verified zero false positives against the entire pre-existing 983-test ubl suite before writing these tests, and individually re-ran all 15 cited positive+negative tests via pytest -v before finalizing the promotion. ubl suite: 983 -> 987 passed. NOT backed by an independent reference UBL implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, the order rule grounded directly in the pinned OASIS UBL 2.3 schema already cited by the sibling order-cluster obligations. Covers SAL-UBL-OBL-B68F5F29F11197D6 only; it supports no other obligation and promotes no other product state.'
- evidence_id: UBL-SIGNATURE-BACKEND-REGISTRY-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ubl-signature-backend-registry-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike UBL-BASELINE-SUITE. Closes SAL-UBL-OBL-175ADB055BC12E8F and SAL-UBL-OBL-452B9C973F40966B (both UBL-SIGN-001), promoted partial->implemented. SAL-UBL-OBL-175ADB055BC12E8F''s own missing_behavior named the exact gap: no registry lets a caller plug in a signing/verification backend, distinct from the already-proven report-before-saving/never-rewrite half. Built a new SignatureBackendRegistry (model/signature_backend.py) mirroring CodeListRegistry''s and ExtensionAdapterRegistry''s already-proven pluggable-registry pattern: a caller registers a SignatureBackend (verify and/or sign callables); this package never bundles an actual XMLDSig implementation itself, since real signature verification/creation is a cryptography concern with real key material and external trust anchors, entirely out of scope for a format library, and no SAL fact documents a specific XMLDSig profile precisely enough to build one without fabricating spec content. verify_signature()/sign_document() with no backend registered (or a backend missing the relevant half) return an explicit not-registered result (backend_registered=False, or None for sign_document) rather than raising or silently succeeding -- proven safe to call unconditionally, matching decode_extension()''s own opt-in-safe shape rather than CodeListRegistry''s validate_code() exactly, since signing has no meaningful default value to fall back to the way a validation tri-state does. While investigating the sibling obligation SAL-UBL-OBL-452B9C973F40966B, found its own missing_behavior was a stale, mismatched copy from SAL-UBL-OBL-175ADB055BC12E8F''s text: its own rule_text ("Preserve signature structures without rewriting signed subtrees in lossless mode; report edits that invalidate existing signatures before saving") contains no "pluggable opt-in" clause at all, and both halves it actually requires were already fully proven -- a citation-audit correction, promoted independent of the new registry code. Verified zero false positives against the entire pre-existing 972-test ubl suite before writing a single new test. 11 new tests (tests/python/ubl/test_obligation_signature_backend_registry.py) prove: registry population (empty/register/replace/partial-backend), verify_signature (no backend, backend without verify, real true/false results), and sign_document (no backend, backend without sign, real result returned). ubl suite: 972 -> 983 passed. mypy clean. NOT backed by an independent reference UBL implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, the registry pattern grounded directly in this package''s own already-proven CodeListRegistry/ExtensionAdapterRegistry siblings, not invented from memory. Covers SAL-UBL-OBL-175ADB055BC12E8F and SAL-UBL-OBL-452B9C973F40966B only; it supports no other obligation and promotes no other product state.'
- evidence_id: UBL-EXTENSION-ADAPTER-REGISTRY-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ubl-extension-adapter-registry-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike UBL-BASELINE-SUITE. Closes SAL-UBL-OBL-B36305DA0BCEE0F6 (UBL-EXT-001), promoted partial->implemented. The obligation''s rule_text bundles two clauses: "read and write extension containers with arbitrary namespaces and payloads without loss" (already proven, test_unknown_extension_is_preserved_semantically) and "expose registered typed adapters as opt-in" (not previously built -- the obligation''s own missing_behavior named the exact gap: no registry lets a caller register a typed decoder for a specific extension namespace, distinct from CodeListRegistry which is for business code-list values). Built a new ExtensionAdapterRegistry (model/extension_adapters.py) mirroring CodeListRegistry''s own already-proven pluggable-registry pattern (proven at UBL-CODELIST-001) exactly: an in-memory registry populated at runtime, keyed here by QName rather than (list_id, agency_id, version), and decode_extension(registry, node) returning an ExtensionDecodeResult with the same known/unknown tri-state shape as CodeListValidation. A node with no registered adapter is reported as unknown, not an error, and returned unchanged via .node, proven by identity -- this is what makes adapter use structurally opt-in: decode_extension is always safe to call on every extension node in a document, decoded or not, and never alters parsing/serialization behavior (proven by leaving codec/preservation.py and the reader/writer entirely untouched). Verified zero false positives against the entire pre-existing 962-test ubl suite before writing a single new test. 10 new tests (tests/python/ubl/test_obligation_extension_adapter_registry.py) prove: registry population (empty length, register/get round-trip, contains, replace-on-re-register) and decode behavior (a registered adapter decodes correctly, an unregistered QName is unknown not an error, an unregistered node is returned unchanged by identity, decoding is deterministic, and two distinct QNames use independent adapters). ubl suite: 962 -> 972 passed. NOT backed by an independent reference UBL implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, the registry pattern grounded directly in this package''s own already-proven CodeListRegistry, not invented from memory. Covers SAL-UBL-OBL-B36305DA0BCEE0F6 only; it supports no other obligation and promotes no other product state.'
- evidence_id: UBL-EXTENSION-PAYLOAD-CHECKSUM-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ubl-extension-payload-checksum-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike UBL-BASELINE-SUITE. Closes SAL-UBL-OBL-E98EB489DAC77A1A (UBL-EXT-001), promoted partial->implemented. This obligation''s rule_text bundles three clauses: expose media types (already proven, BinaryObject.mime_code), expose checksums without decoding side effects (proven for BinaryObject, previously missing for extension payloads), and gate external attachment retrieval (no attack surface exists -- confirmed by this package''s own whole-package static import scan finding no networking-capable module anywhere, the same structural-absence pattern already accepted as satisfying analogous obligations elsewhere in this package). Closed the one genuinely remaining gap: extension payloads had no dedicated byte-serialization helper to hash at all, confirmed by reading the model directly before writing any code (extensions are raw XmlNode subtrees). Added XmlNode.checksum (model/document.py), a SHA-256 hex digest of the subtree''s own canonical structural encoding (qname, attributes, text, children, tail via a new _canonical_node_bytes helper) -- deliberately not a real XML serialization (avoiding any dependency on a particular writer''s escaping/formatting choices for what is meant to be a content-identity check, not a wire-format proof), mirroring BinaryObject.checksum''s exact "hash only the opaque payload, never anything decoded" guarantee. 5 new tests (tests/python/ubl/test_obligation_extension_payload_checksum.py) prove: a checksum is exposed (64-hex-char SHA-256 digest); identical extension content produces the same checksum; different text content and different attributes each independently produce a different checksum; the checksum is stable across repeated access. ubl suite: 957 -> 962 passed. NOT backed by an independent reference UBL implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule. Covers SAL-UBL-OBL-E98EB489DAC77A1A only; it supports no other obligation and promotes no product state.'
- evidence_id: UBL-ITEM-PRICE-CARDINALITY-ORDER-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ubl-item-price-cardinality-order-001.json
  expected_result: PASS
