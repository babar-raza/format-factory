  execution_evidence_ids:
  - UBL-BASELINE-SUITE
  - UBL-DETECTED-DECLARED-VERSION-SELECTOR-PROOF
  implemented_behavior:
  - 'UblDocument.detected_version is set once, only by document_from_root() (the parser''s own document
    constructor), from the source file''s actual cbc:UBLVersionID; it survives with_root()-based edits
    unchanged (carried forward explicitly, not reset to a default). UblDocument.declared_version is a
    live property reading the current tree''s UBLVersionID, so an edit changes what is declared without
    touching what was detected -- the obligation''s own distinction, directly. A freshly hand-built
    document (build(), no parsing) has detected_version=None. dumps() never silently rewrites an
    unsupported declared version to the stable profile''s required "2.3": it refuses to write at all
    (existing validate()-gated behavior), which structurally rules out silent substitution rather than
    merely avoiding it by convention.'
  missing_behavior: []
