  - 'dumps()/dump() walk a fixed, ordered XmlNode tree (namespace prefixes registered once, children in
    declaration order) with no unordered-collection iteration in the serialization path, so repeated
    calls on one unchanged document -- whether to bytes, or independently to two separate files -- are
    byte-identical. Determinism holds across a load-save-load cycle too, not merely within one in-memory
    object: a freshly reloaded document serializes to the exact same bytes as the original, which is
