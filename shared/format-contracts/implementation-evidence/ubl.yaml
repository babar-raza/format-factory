  implemented_behavior:
  - UblDocument.signature_preserved compares the current tree's serialized
    hash against the hash captured when a signature was last known intact;
    with_root() (the sole edit path) invalidates this on every edit, and
    validate() surfaces ubl.signature.invalidated as a non-fatal diagnostic
    -- a caller sees the report before saving rather than a silent loss.
    dumps() never rewrites subtrees since it always serializes the tree
    exactly as constructed, so a signed subtree an edit did not touch is
    never altered.
  - '"Verification and signing remain a separate pluggable opt-in" is now also implemented: a new SignatureBackendRegistry (model/signature_backend.py) mirrors CodeListRegistry''s and ExtensionAdapterRegistry''s already-proven pluggable-registry pattern -- a caller registers a SignatureBackend (verify and/or sign callables); this package never bundles an actual XMLDSig implementation itself. verify_signature()/sign_document() with no backend registered (or a backend missing the relevant half) return an explicit not-registered result (None or backend_registered=False) rather than raising or silently succeeding, proven safe to call unconditionally either way.'
  missing_behavior: []
  proof_requirements:
    positive:
    - Signed-document round-trip byte-preserves signed subtrees; edit-warning fixture.
    negative:
    - A registered backend can report verification failure; an unregistered backend is reported, not raised.
