  missing_behavior: []
  proof_requirements:
    positive:
    - 'Non-standard source namespace prefix aliases (e.g. an ns1/x alias for the canonical cbc/cac
      prefixes) are normalized to the package''s canonical prefixes on write; a document with
      checked components in correct schema order serializes without incident; lossless mode
      preserves the extension container byte-for-byte (cited from test_obligation_preservation_mode.py).'
    negative:
