  implemented_behavior:
  - 'FF6-EVENT-000298: real CRUD now exists for line-role components (InvoiceLine/CreditNoteLine/OrderLine), composing existing primitives (XmlNode.with_children(), reorder_for_schema_order() from FF6-EVENT-000286, validate(), and a new duplicate-line-id check reused from the referential layer built for validate_all() at FF6-EVENT-000296) into add_line/remove_line/move_line/renumber_lines (lines.py). Every operation refuses (raises UblValidationError) if the result would introduce a validation or referential-integrity failure the source document did not already have -- directly satisfying "edits cannot produce elements the schema forbids at that position" for this component category. New lines are inserted after the last existing line, which is schema-position-correct by construction (Line elements are always the trailing repeating group in every UBL maindoc type''s own schema sequence), then run through reorder_for_schema_order() so the inserted line''s own internal field order is also corrected regardless of how the caller constructed it.'
  - 'FF6-EVENT-000335: replace_party() (new module components.py) further narrows this obligation''s own remaining "core business components" gap by closing UPDATE for cac:Party, one of this obligation''s own three cited authority facts (SAL-UBL-00123). Investigated directly and found Party does not need the arbitrary-position INSERT support the missing_behavior text names as the real blocker: a Party is always nested inside an already-existing, single-occurrence root-level wrapper (cac:AccountingSupplierParty or cac:AccountingCustomerParty), so replacing it needs only the same with_children() immutable-replace primitive lines.py already composes, applied one level deeper -- no _ORDER_CHECKED_COMPONENTS-style position knowledge required. Refuses an unknown role, a non-Party replacement node, or a missing wrapper (creating a brand-new wrapper remains the still-unbuilt Create/arbitrary-position problem) rather than silently accepting or fabricating one. Reuses the identical before/after diagnostic-comparison refusal pattern lines.py already established. 7 new tests (tests/python/ubl/test_obligation_party_replacement.py).'
  - 'FF6-EVENT-000336: update_component() (components.py) generalizes replace_party()''s own insight to any OTHER repeating root-level core business component -- cac:PaymentMeans, cac:TaxTotal, cac:AllowanceCharge, and so on. Confirmed by direct XSD read (not assumed) that these are maxOccurs="unbounded" in the pinned UBL 2.3 schema, unlike Party''s own always-exactly-one wrappers, but the same core fact still holds: an already-present occurrence, however many same-name siblings exist, is already at its own schema-correct position, so replacing it (by 0-based index among same-name root children) needs no position-aware insertion logic either -- only the same with_children() primitive, indexed instead of assumed-unique. Refuses a type-mismatched replacement, an out-of-range index (0 existing occurrences, or index >= count, or negative -- creating an ADDITIONAL occurrence beyond what the document already has is the still-unbuilt Create/arbitrary-position problem), or an edit that would introduce a new validation failure. 8 new tests (tests/python/ubl/test_obligation_component_update.py).'
  - 'FF6-EVENT-000337: add_component() (components.py) closes a genuinely separable slice of Create itself -- inserting an ADDITIONAL occurrence of a component the document already has at least one of. Grounded directly in XSD sequence-model semantics (confirmed by reading the pinned UBL 2.3 Invoice maindoc schema, not assumed): every element declared maxOccurs>1 inside one xsd:sequence must appear as one contiguous run at its own declared position, so inserting immediately after the last existing same-name sibling is always schema-position-correct for ANY repeating component, not only lines (the same fact lines.py''s own "trailing group" reasoning is a special case of). Runs reorder_for_schema_order() afterward, the same benefit add_line already gives, correcting the new component''s own internal field order for every type already in _ORDER_CHECKED_COMPONENTS (confirmed PaymentMeans/TaxTotal/AllowanceCharge all are). Refuses a type-mismatched new_component or a document with ZERO existing occurrences of component_name (inserting the FIRST occurrence of a type not already present needs full header-position knowledge this function does not have -- correctly left as the obligation''s own one remaining, precisely-scoped gap). 8 new tests (tests/python/ubl/test_obligation_component_create_adjacent.py), including one proving the new component''s own internal field order is corrected regardless of caller-supplied order.'
  - 'FF6-EVENT-000338: remove_component() (components.py) closes the Delete quarter of this obligation''s own "CRUD" rule_text for any already-present occurrence of any core business component -- no position-aware logic is needed to remove one either, only with_children() used to omit rather than replace a child. A genuine, surprising finding was made and honestly disclosed during this slice, not hidden: validate() does NOT currently check for the presence of mandatory top-level elements at all -- confirmed directly by probing a document missing IssueDate/InvoiceTypeCode/DocumentCurrencyCode/AccountingSupplierParty (all XSD minOccurs="1" in the real Invoice schema) and finding validate().is_valid still True. remove_component''s own refusal is therefore exactly as strong as validate() itself and no stronger: it does NOT refuse removing a document''s only AccountingSupplierParty even though the real schema requires one. This is a real, disclosed limitation of the underlying validate() layer this function composes, not a defect in how it composes it -- closing that gap belongs to validate()''s own schema-coverage scope (a different obligation), not this one''s CRUD scope. An initial test draft wrongly assumed the refusal would fire; caught by running the test and observing it did not raise, not assumed correct -- the test and this obligation''s own missing_behavior/docstring text were both corrected to state the verified truth rather than the original assumption. 8 new tests (tests/python/ubl/test_obligation_component_removal.py), including one that directly documents and proves the validate()-coverage-gap finding rather than asserting a false refusal.'
  - 'FF6-UBL-EDIT-FIRST-OCCURRENCE-001: this obligation''s own sole remaining named gap -- inserting the FIRST occurrence of a core business component type a document does not already have at all -- is now closed when the optional xmlschema dependency is installed. schema_root_order() (validation/schema_validator.py) reads the real, declared child sequence for a document''s own root type directly from the bundled, official UBL 2.3 maindoc XSD (the same schema files and the same optional dependency schema_validate() already uses), supplying the exact "full header-position knowledge" this gap''s own prior text named as missing. add_component() now uses it to compute the correct insertion position for a genuinely new component type, proven both for insertion before an already-present later sibling and after an already-present earlier one (real relative-position correctness, not merely "does not raise"). Falls back to the original unconditional refusal, unchanged, when xmlschema is unavailable or the component name is not a declared child of the root type at all. 9 new tests (tests/python/ubl/test_obligation_component_first_occurrence_insertion.py); 1 pre-existing test that pinned the now-superseded refusal was found (repo-wide grep confirmed no other test asserted it) and rewritten to prove the new behavior.'
  missing_behavior:
  - 'Two narrower items remain, both disclosed rather than silently dropped when the FIRST-occurrence gap closed: (1) when the optional xmlschema dependency is NOT installed, add_component still refuses a first occurrence unconditionally, exactly as before -- schema_root_order() genuinely needs that dependency and there is no dependency-free fallback for real header-position knowledge; (2) this module has no opinion on a new component''s own INTERNAL field structure for a component type this package''s typed model does not otherwise represent at all -- it only determines correct ROOT-level position, not how to build the component''s own contents. Separately, and NOT part of this obligation''s own scope: validate() itself does not check for mandatory top-level element presence (SAL-UBL-OBL-237188D47391391E''s own remove_component composes validate() as-is and is only as strong as it is) -- a real, disclosed limitation surfaced by an earlier slice''s own testing, belonging to validate()''s own obligation, not tracked or claimed as closed here.'
  proof_requirements:
    positive:
    - Each mutation class save-reload-verifies; renumbering fixture proves reference rewrite.
    negative:
    - Selector-bound negative cases are not yet identified.
