  implemented_behavior:
  - '_enforce_tree_limits walks the parsed tree with an explicit stack (not Python recursion, avoiding a stack-overflow-shaped complexity vector of its own) and checks node count, nesting depth, attribute count, and text bytes incrementally -- each counter is compared against its ceiling immediately after being updated, inside the walk, not after the full tree is built and counted. This is the ''checked arithmetic'' guarantee in the sense used elsewhere this session: bounding growth before it becomes unbounded, not C-style overflow detection (Python''s arbitrary-precision integers make silent wraparound impossible regardless). Depth was already proven; 2 new tests this slice prove the width-shaped and attribute-shaped complexity vectors specifically: a document with 500 sibling elements (wide, not deep) is refused via the node-count limit, and a single element carrying 500 attributes is refused via the attribute-count limit, each independent of the other limits. Entity-expansion-style attacks are a structurally different vector, already closed by unconditional DTD/entity rejection (a separate mechanism -- entities are disallowed outright, not merely size-bounded), not by this checked-arithmetic guard.'
  missing_behavior: []
  proof_requirements:
    positive:
    - Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
      test proving refusal with diagnostics.
    negative:
    - Selector-bound negative cases are cited for depth, node-count, and attribute-count violations.
