  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike IPYNB-BASELINE-SUITE. Closes event 172''s last 2 deferred clusters (IPYNB-DOCMETA-001, IPYNB-HIDDEN-001), both genuine gaps (no typed model existed for any of title/authors/source_hidden/outputs_hidden), unlike IPYNB-PRESERVE-001 which was a pure mis-citation. New production code: AuthorMetadata and JupyterCellMetadata dataclasses in model/metadata.py, plus title/authors accessors on NotebookMetadataAdapter and a jupyter accessor on CellMetadataAdapter, exported through model/__init__.py and the top-level package. Intended field shapes (author item name+extras; jupyter source_hidden/outputs_hidden booleans) are read directly from this package''s own pinned, vendored nbformat schemas (nbformat.v4.2.schema.json, nbformat.v4.3.schema.json), not from memory -- both schemas declare these shapes under non-standard keywords ("item" instead of "items"; sibling placement instead of nested under properties) that a real JSON Schema validator never enforces, so the typed model deliberately mirrors that unenforced-but-intended shape (name and both hidden booleans all optional, every other field preserved via extras) rather than over-constraining. 9 new tests: 4 positive (title+authors with mixed name/extras-only entries; absent title/authors returning None; jupyter with both booleans plus an unknown key; jupyter with only source_hidden present) and 5 negative cases within test_malformed_known_metadata_fails_explicitly (malformed title, authors container, individual author item, jupyter container, source_hidden type, each raising MetadataShapeError with a precise diagnostic). ipynb suite: 698 -> 707 passed. NOT backed by an independent reference implementation for the new fields specifically -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, not VERIFIED. Covers SAL-IPYNB-OBL-1805FD97C77EDC3D, SAL-IPYNB-OBL-C2890074D83A8170, SAL-IPYNB-OBL-8998C2CB8626FA68, and SAL-IPYNB-OBL-959B89100C121E