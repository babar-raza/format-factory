      to commit 8f0d41de, which built and tested this capability targeting the sibling
      obligation NRRD-LIFECYCLE-001 -- its evidence was simply never propagated to these
      two NRRD-VERSION-001 obligations sharing the identical underlying feature.
      Confirmed via direct interactive probe before touching any evidence (a NRRD0005
