      version-gate refusal. nrrd suite: 531 -> 540 passed. NOT backed by an independent reference
      NRRD implementation -- SELF-CONSISTENT format_factory-only evidence per the
      execution-recovery directive's GAP-008 rule, not VERIFIED. Covers
      SAL-NRRD-OBL-00F18A8DA59864CD and SAL-NRRD-OBL-38F3D4743DF2B0F9 only; it supports no other
