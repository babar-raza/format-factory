n), so the writer's own byte distribution -- the full encoded payload split into N equal consecutive chunks, one per destination, in order -- is the exact mirror the reader's own contract requires, proven directly by full round-trip (including a gzip-compressed payload, split post-compression and correctly reassembled before decompression). Refuses an uneven split, a destination outside the header's own directory (reusing dump_detached's own confinement check), and an explicit or auto-selected profile older than NRRD0004 (matching the reader's own read-time version gate) rather than writing a file the reader would then reject.", "FF6-EVENT-000304: dump_multifile_printf() closes the remaining printf-form half of 'no multifile writer'. Generates filenames via the exact same `pattern % item` expression the reader's own _safe_detached_payload evaluates when reading a printf sequence back, and derives `stop` from the caller's own `start`/`step`/`file_count` using the reader's own file-count arithmetic in reverse -- so a file this function writes is named exactly what the reader looks for, proven by full round trip including a negative step, an explicit subdim, and a compressed payload. 'Per-file byte validation' is satisfied by construction: every generated file is exactly `len(payload) // file_count` bytes by the same even-split check both writer functions share, refused upfront rather than silently producing an uneven file the reader could not correctly reassemble."], missing_behavior: [], proof_requirements: {positive: ["LIST/printf/subdimension read-write matrix against Teem."], negative: ["Profile, range, step, expansion, truncation, traversal, and bytes-per-file cases."]}}
