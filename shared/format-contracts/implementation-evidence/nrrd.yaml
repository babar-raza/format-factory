  - evidence_id: NRRD-CWD-RELATIVE-RESOLVER-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-cwd-relative-resolver-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-09CDF5A28C011CD7
      (NRRD-PAYLOAD-001) in full -- the obligation's own missing_behavior named the exact
      gap: "an explicit opt-in policy parameter would be needed to support [pre-NRRD0004
      cwd-relative resolution] safely, and does not exist yet." Added `cwd_relative_base:
      Path | None = None` to load()/loads() (codec/reader/reader.py, threaded through
      _load -> _safe_detached_payload) and open_lazy_payload() (codec/lazy.py, threaded
      through _resolve_detached_path), default None preserving the exact prior refusal
      behavior with zero behavior change for any existing caller. When supplied, a
      pre-NRRD0004 bare-relative (no leading './') detached data file name resolves
      against the caller-supplied directory instead of being refused, through the same
      shared traversal-safety primitive (extracted as _read_relative_to()/
      _resolve_relative_to() in each module respectively, deduplicating what was
      previously two separately-inlined absolute-path/parent-traversal/escape checks)
      already enforced for header-relative resolution -- an absolute path or a path that
      escapes the supplied directory is refused exactly as before. 9 new tests
      (tests/python/nrrd/test_obligation_cwd_relative_resolver.py) prove: refusal remains
      the default with no opt-in; load()/open_lazy_payload() (both memory-mapped and
      streaming-decode access modes) all resolve correctly against a real, separate
      caller-supplied directory using real files on disk; a directory-escape attempt and
      an absolute-path attempt are both still refused even with the opt-in active; the
      opt-in is a no-op for already-working './'-prefixed names and for NRRD0004+ (which
      has no cwd-relative case at all); and loads() (bytes input, no filesystem source)
      correctly still refuses detached payloads regardless of the opt-in, since a
      detached payload requires a filesystem header source with or without it. Also fixed
      a real, pre-existing documentation bug found while verifying this feature's own
      neighboring README section: the "Lazy payload access" example called a nonexistent
      `payload.read_region(offset=..., length=..., mode=PayloadAccessMode.STRICT)`
      (neither the method name nor the STRICT enum member exist) -- corrected to the real
      `payload.region(start, end)` (MEMORY_MAPPED, zero-copy memoryview, released before
      close()) / `payload.read_stream(size)` (STREAMING_DECODE, sequential decoded bytes)
      API, each verified end-to-end against real corpus samples (2d-float32.nrrd for
      memory-mapped, gzip-encoded.nrrd for streaming-decode) before being published. nrrd
      suite: 709 -> 718 passed, 1 skipped (unchanged). mypy and ruff clean on both
      modified source files and the new test file. NOT backed by an independent reference
      NRRD implementation -- SELF-CONSISTENT format_factory-only evidence per the
      execution-recovery directive's GAP-008 rule, not VERIFIED; the obligation's own
      proof_requirements (Teem-fixture-backed exhaustive profile/path/security matrix)
      remain open as a separate, broader verification target this entry does not claim.
      Covers SAL-NRRD-OBL-09CDF5A28C011CD7 only.
  - evidence_id: NRRD-ATTACHMENT-CONVERSION-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-attachment-conversion-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Narrows (does not fully close)
      SAL-NRRD-OBL-E2B0331E7D4F6AD8 (NRRD-CONVERT-001). The obligation's own compound
      rule_text names four conversion kinds -- dtype, encoding, attached/detached form,
      and endian -- with explicit overflow/clipping/scaling/rounding policies. This
      entry closes the "attached/detached form" quarter, the third of four. convert.py's
      own prior module docstring called it "a genuinely separate, larger piece of work"
      needing real file-splitting/joining logic; investigated and found that logic
      already existed at dump()/dump_multifile()/dump_multifile_printf()
      (codec/writer/writer.py, built for NRRD-MULTIFILE-001 at FF6-EVENT-000303/000304
      earlier this session). Confirmed by direct inspection that NrrdDocument (model)
      carries no attached/detached state field of its own -- the wire form is determined
      entirely by which writer function a caller invokes and how many destinations they
      supply -- so converting between forms needs zero document mutation. Added
      convert_to_attached()/convert_to_detached_list()/convert_to_detached_printf(), each
      composing the matching existing writer and returning a new
      AttachmentConversionReport (target_form, file_count, is_lossless -- always True by
      the same reasoning already proven for EncodingConversionReport, since no
      value-level transformation occurs). Verified end-to-end with a standalone repro
      before any test was written: attached-to-detached-list, attached-to-detached-printf
      (including a negative step and an explicit subdim token), and detached-to-attached
      (starting from a document actually loaded from a real detached source via load(),
      not just a freshly-built in-memory one) all round-trip correctly through the
      existing, unmodified reader. 8 new tests
      (tests/python/nrrd/test_obligation_attachment_conversion.py) additionally prove: a
      document loaded from one detached form converts cleanly to a DIFFERENT detached
      form with no source-form state leaking; the composed writers' own pre-existing
      refusal paths (uneven split, invalid printf pattern) still fire correctly through
      the new wrapper functions rather than being silently swallowed. nrrd suite: 665
      passed, 1 skipped (test file is new, no existing test count changed). mypy --strict
      and ruff clean. Combined 6-format run: 3772 -> 3780 passed, +8, 0 failed, 4 skipped.
      NOT backed by an independent reference NRRD implementation -- SELF-CONSISTENT
      format_factory-only evidence per the execution-recovery directive's GAP-008 rule;
      the conversion's own correctness is grounded directly in the already-proven writer
      and reader contracts this composes, not a new spec interpretation. Covers
      SAL-NRRD-OBL-E2B0331E7D4F6AD8 only, and only its "attached/detached form" quarter
      at the time this entry was written; the obligation's own remaining "scaling"
      policy for dtype conversion was NOT claimed resolved by this entry -- it was
      closed separately by NRRD-DTYPE-SCALE-CONVERSION-PROOF at FF6-EVENT-000328, which
      promoted the obligation to implemented in full.
  - evidence_id: NRRD-DTYPE-SCALE-CONVERSION-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-dtype-scale-conversion-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-E2B0331E7D4F6AD8
      (NRRD-CONVERT-001), promoted partial->implemented -- the fourth and last quarter
      of the obligation's own compound rule_text (dtype/encoding/attached-detached/
      endian conversion, each with explicit overflow/clipping/scaling/rounding
      policies), following NRRD-DTYPE-SCALE-CONVERSION-PROOF's own three predecessor
      entries (NRRD-R1-SOURCE-TESTS for dtype/endian, the encoding-conversion proof at
      FF6-EVENT-000300, and NRRD-ATTACHMENT-CONVERSION-PROOF for attached/detached form
      at FF6-EVENT-000316, which explicitly and honestly left "the obligation's own
      remaining 'scaling' policy for dtype conversion... NOT claimed resolved"). Added
      an optional `scale: float | None = None` parameter to convert_dtype(), applied to
      every value before overflow/rounding, matching the common medical-imaging case of
      remapping a normalized float range (e.g. [0.0, 1.0]) onto an integer type's own
      representable range (e.g. scale=255 for uint8) -- the exact worked example this
      package's own module docstring and POL-SCR-CONVERT-01's own rule_text already
      named ("overflow/clipping/scaling/rounding policies") before this slice built it.
      A non-integer scale factor can introduce fractional values even from an integer
      source (10 * 0.5 = 5.0), so the existing "float source requires explicit
      RoundingPolicy" guard was widened to a `may_be_non_integral = source_is_float or
      scale is not None` precondition, covering that case too -- confirmed by a
      dedicated negative test (an integer source scaled by 0.5 into an integer target
      without rounding is refused, the same as a float source would be). `scale`
      defaults to None (its absence is byte-for-byte identical to convert_dtype()'s own
      pre-existing behavior, confirmed by a dedicated regression test), so this is a
      purely additive, backward-compatible change -- no existing caller's behavior
      changes. ConversionReport gained a `scale: float | None = None` field so a
      conversion's own applied scale factor is always visible, matching this module's
      own "never silent" ethos for every other policy field it already carries. 5 new
      tests (tests/python/nrrd/test_obligation_dtype_conversion.py): a normalized
      [0,1]->[0,255] remap (with an honestly-reasoned is_lossless=False assertion, since
      0.5*255=127.5 is genuinely fractional and gets rounded, not an exact match), an
      out-of-range-after-scaling clip case, the integer-source-non-integer-scale
      refusal, a working integer-source-scaled-and-rounded case, and the
      no-scale-given-is-unchanged regression proof. Verified zero regressions against
      the entire pre-existing 675-test nrrd suite before writing a single new test.
      nrrd suite: 675 -> 680 passed, 1 skipped (unchanged). mypy --strict and ruff
      clean. Combined 6-format run: pending final tick regeneration. NOT backed by an
      independent reference NRRD implementation -- SELF-CONSISTENT format_factory-only
      evidence per the execution-recovery directive's GAP-008 rule; the scaling
      semantics themselves are a direct, literal reading of the obligation's own named
      policy set, not a new spec interpretation. Covers SAL-NRRD-OBL-E2B0331E7D4F6AD8
      only; it supports no other obligation and promotes no other product state.
  - evidence_id: NRRD-WRITE-ABSENCE-DETACHED-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-write-absence-detached-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-284E2438B08DA529
      (NRRD-WRITE-001), promoted partial->implemented. This obligation's own
      missing_behavior text read "No detached partition writer or complete
      conditional/optional absence policy" -- investigated directly rather than assumed
      current, and found stale on both counts. The detached-partition writer already
      exists: dump_multifile()/dump_multifile_printf() (codec/writer/writer.py,
      FF6-EVENT-000303/000305) were built for the sibling obligation NRRD-MULTIFILE-001
      (SAL-NRRD-OBL-807586E5B4D0EDB2/SAL-NRRD-OBL-EBE5230D5204B4AD, both already
      implemented, with their own extensive existing coverage in
      test_obligation_multifile_writer.py/test_obligation_multifile_printf_writer.py --
      round trips, uneven-split refusal, cross-directory refusal, version-gate refusal,
      compressed payloads). The capability genuinely exists; it had simply never been
      cross-mapped onto THIS obligation's own evidence entry. Added both writer functions
      to this obligation's own source_symbols and added a freestanding, dedicated
      round-trip test for each (test_dump_multifile_round_trips_directly,
      test_dump_multifile_printf_round_trips_directly) rather than merely re-citing the
      sibling obligation's tests as if they were this obligation's own -- plus
      cross-referenced the sibling's own negative refusal tests as supplementary evidence
      for this obligation's "unrepresentable... combinations fail before write" proof
      requirement. Optional-field absence in canonical-mode writing was investigated by
      direct source read of _header_bytes (codec/writer/writer.py): it iterates
      document.header (a plain dict[str, str]) and emits exactly the keys present in it --
      a field absent from that dict at load time is never synthesized on write, and a
      field present is always re-emitted unchanged. This is the field-presence policy the
      writer itself owns, proven here by two new dedicated tests (a present optional
      field round-trips unchanged; an absent one is never synthesized). The deeper
      question of whether an explicit default value and an absent optional field are
      modeled as DISTINGUISHABLE states in the first place remains NRRD-PRESERVE-001's
      own, separate, still-partial scope (SAL-NRRD-OBL-ADAC45BDF110C59C) -- not
      duplicated or closed by this entry. Lossless-mode absence preservation needed no
      dedicated test: dumps(mode="lossless") returns document.source_bytes verbatim by
      construction (see writer.py's own dumps()), already covered by this format's
      existing preservation-report test suites. Determinism (the obligation's own third
      required_tests item, "determinism byte-compare") was also unproven before this
      entry -- two new dedicated tests prove repeated dumps() calls on the same document
      are byte-identical, and that field order in the output does not depend on the
      source header mapping's own insertion order (matching _header_bytes' own fixed
      _FIELD_ORDER tuple plus sorted() construction). 6 new tests
      (tests/python/nrrd/test_obligation_write_absence_and_detached_policy.py). mypy
      --strict and ruff clean. nrrd suite: 680 -> 686 passed, 1 skipped (unchanged).
      NOT backed by an independent reference NRRD implementation -- SELF-CONSISTENT
      format_factory-only evidence per the execution-recovery directive's GAP-008 rule;
      this entry composes and cross-references already-proven writer contracts rather
      than introducing new spec interpretation. Covers SAL-NRRD-OBL-284E2438B08DA529
      only; it supports no other obligation and promotes no other product state.
  - evidence_id: NRRD-FIELD-PRESENCE-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-field-presence-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-ADAC45BDF110C59C
      (NRRD-PRESERVE-001), promoted partial->implemented. This obligation's own
      implemented_behavior already correctly noted the distinction was preserved
      LEXICALLY (self.header never loses a present field or invents an absent one);
      its own missing_behavior named two further gaps -- "typed defaults" and "empty
      values" not modeled -- investigated directly rather than assumed either buildable
      or unbuildable. Found: some typed accessors (content, min, max, ...) already
      return None on absence via their own internal .get() call; others (spacings, axis
      mins, labels, kinds, thicknesses, centers, units -- 8 total) collapse BOTH "never
      declared" and "declared with no tokens" into the same [] return value, and a
      defaulted scalar (encoding falls back to "raw" when absent) cannot be told apart
      from an explicit write of that same value -- both indistinguishable from outside
      via the typed accessor alone. Added NrrdDocument.field_present(name) -> bool
      (name in self.header), the exact same idiom version_requirements() and
      per_axis_field_arities() already use internally, now exposed directly rather than
      requiring a caller to reach into the raw header dict themselves -- this closes
      both named gaps uniformly, since NRRD's own wire format has no separate
      default-marker mechanism beyond presence itself: any string written to a header
      key IS an explicit write, whatever it happens to equal. Deliberately did NOT
      change the return type of the 8 existing list-shaped properties (spacings et al.)
      -- that would be a breaking signature change across roughly 50 existing call
      sites for a distinction field_present() already exposes additively; matches this
      session's own established caution against high-blast-radius signature changes
      (see UBL's own find()/find_all() obligation, explicitly deferred for the same
      reason). A genuine, previously-unenforced WRITE-time gap was found and fixed in
      the same slice, not merely documented: _header_bytes would have silently emitted
      an empty-valued field (e.g. "content: ") that the reader's own _parse_header
      grammar already refuses to parse back ("malformed header field at line N") --
      confirmed by writing the round-trip test first and watching it fail with exactly
      that reader-side error, not assumed. Added a new _field_line helper mirroring the
      reader's own `not value.strip()` refusal, so the writer now raises NrrdWriteError
      before producing output this same library could not read back, for both scalar
      and per-axis fields (both go through the identical code path). 9 new tests
      (tests/python/nrrd/test_obligation_field_presence.py): absence vs presence for a
      scalar field, absence vs explicit-empty-presence for a per-axis field (only
      reachable via from_mapping(), not real file text -- disclosed directly in the
      test's own docstring), silent-default vs explicit-write for encoding, presence
      surviving a full write/read round trip through the real file grammar, and two new
      writer-refusal negative tests (scalar and per-axis empty-value cases). mypy
      --strict and ruff clean. nrrd suite: 686 -> 695 passed, 1 skipped (unchanged).
      NOT backed by an independent reference NRRD implementation -- SELF-CONSISTENT
      format_factory-only evidence per the execution-recovery directive's GAP-008 rule;
      the presence/absence semantics themselves are a direct, literal reading of the
      obligation's own rule_text plus the reader's own already-proven refusal grammar,
      not a new spec interpretation. Covers SAL-NRRD-OBL-ADAC45BDF110C59C only; it
      supports no other obligation and promotes no other product state.
  - evidence_id: NRRD-AXIS-ORDER-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-axis-order-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-94D8938DE18A6562
      (NRRD-SHAPE-001), promoted partial->implemented. This obligation's own
      missing_behavior text (updated at a prior tick) already correctly narrowed the
      remaining scope to one thing: "a first-class axis-order model/conversion report is
      absent," per-axis arity validation having already been closed under the sibling
      obligation SAL-NRRD-OBL-428BE326FCBC9A6E. Investigated to_array()/reshape_nrrd_array
      directly: the axis-order mapping (fastest-first strides) was already correctly
      computed, but only implicitly, inside a recursive closure private to
      reshape_nrrd_array -- not inspectable on its own, and with no explicit inverse
      operation to convert a host-order nested list back to NRRD's own flat order. Added
      three things: axis_order_report(sizes) -> AxisOrderReport (strides, nesting_order),
      computed via a new shared _axis_strides() helper (extracted from
      reshape_nrrd_array's own prior inline computation so both share one
      implementation, not two independently-maintained copies); flatten_nrrd_array(nested,
      sizes) -> list, the explicit inverse of reshape_nrrd_array, refusing (ValueError)
      a nested list whose shape does not match sizes at any axis rather than guessing or
      silently truncating; and NrrdDocument.with_array(nested) -> NrrdDocument, a
      document-level convenience pairing the existing to_array() with this new explicit
      reverse via dataclasses.replace() (non-mutating, confirmed by a dedicated test).
      All three are exported through model/__init__.py and the top-level nrrd/__init__.py
      (AxisOrderReport, axis_order_report, flatten_nrrd_array joining the existing
      reshape_nrrd_array in both __all__ lists). 14 new tests
      (tests/python/nrrd/test_obligation_axis_order.py): axis_order_report for 1D/2D/3D
      shapes (including the obligation's own worked 2x3 example, cross-checked against
      to_array()'s already-proven [[1,2],[3,4],[5,6]] output), flatten as the exact
      inverse of reshape across 4 parametrized shapes plus the obligation's own worked
      example, two negative tests (wrong outer length, wrong inner length -- the second
      one's first draft used a fixture that tripped the OUTER check instead of the
      intended inner one, caught by running the test and reading the actual error
      message before assuming the test was right), and 3 with_array tests (replaces the
      array, round-trips through to_array, does not mutate the original). mypy --strict
      and ruff clean. nrrd suite: 695 -> 709 passed, 1 skipped (unchanged). NOT backed by
      an independent reference NRRD implementation -- SELF-CONSISTENT format_factory-only
      evidence per the execution-recovery directive's GAP-008 rule; the axis-order
      semantics themselves are a direct, literal application of reshape_nrrd_array's own
      already-proven fastest-first convention (SAL-NRRD-00011), not a new spec
      interpretation -- flatten is its mathematical inverse, not a new policy choice.
      Covers SAL-NRRD-OBL-94D8938DE18A6562 only; it supports no other obligation and
      promotes no other product state.
  - evidence_id: NRRD-VERSION-SELECTION-RECONCILIATION-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-version-selection-reconciliation-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-1DAEF31DD0BB6EBB
      and SAL-NRRD-OBL-725881DB5590E608 (both NRRD-VERSION-001), promoted
      partial->implemented. Both obligations'
      missing_behavior claimed "feature-introduction validation" and "oldest-sufficient-
      version selection" were absent, but re-reading writer.py's _select_profile and
      model/document.py's version_requirements()/minimal_version_for() directly found
