rashing with an opaque AttributeError deep inside the codec call, proven via monkeypatch (the environment always has bz2 present, so this is the only way to exercise the guard)."], missing_behavior: [], proof_requirements: {positive: ["Installed-wheel encoding/alias matrix with Teem and pynrrd."], negative: ["Malformed framing, unavailable codec, truncation, and expansion-limit cases."]}}
