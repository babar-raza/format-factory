urce bytes, detached payloads, missing snapshots, and post-load mutation.", "FF6-EVENT-000302: the loss report is now a complete construct-by-construct preservation analysis, not a single coarse flag. preservation_report() reports one PreservationIssue per header field or key/value pair added, removed, or changed (via a new _dict_diff_issues() helper comparing the original and current dicts key-by-key), naming the exact construct and its old/new values. Comments and the decoded array remain single coarse issues when changed -- comments are an ordered list where per-index diffing is not obviously more useful, and the array can be arbitrarily large, where per-element issues would make the report itself an unbounded-size liability. 9 new tests prove: no false positives on an unmodified document or a no-op same-value write; additions, removals, and changes are each correctly classified and separately reported; multiple simultaneous changes each produce their own issue; comments/array changes stay coarse by design."], missing_behavior: [], proof_requirements: {positive: ["Loss-report matrix for every supported and safely preserved construct."], negative: ["Prove every lossy edit is reported before write."]}}
