  - evidence_id: NRRD-MULTIFILE-VERSION-GATE-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-multifile-version-gate-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Narrows (strengthens, does
