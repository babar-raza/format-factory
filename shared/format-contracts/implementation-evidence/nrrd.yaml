      "-tensor"-style alias. nrrd suite: 517 -> 531 passed. NOT backed by an independent
      third-party reference NRRD implementation -- SELF-CONSISTENT format_factory-only evidence
      per the execution-recovery directive's GAP-008 rule, not VERIFIED, though grounded in two
