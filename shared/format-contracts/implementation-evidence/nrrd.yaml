n the exact parsed field name, so no scattered per-consumer patch could have fixed that path. Declaring both the spaced and unspaced form of either field is correctly treated as a duplicate-field violation, matching the spec's own framing that alternate forms are \"the same field\"."], missing_behavior: ["\"Canonical parsing strips significant field whitespace\" was investigated a second time with fresh eyes (flagged by an earlier tick as worth revisiting) and remains a genuinely ambiguous, unsettled question rather than a clear gap: the reader already refuses (not silently strips) any value with more than the one mandatory space after the colon, so there is no leading-whitespace-loss scenario in practice; the only whitespace value.strip() actually removes is trailing whitespace before the line terminator, which the spec's own text explicitly permits ignoring (\"extra whitespace after the field descriptor and before the line termination is ignored\"). Whether a quoted string field's own trailing whitespace inside the quotes should be exempted from this general-field rule is not addressed anywhere in the pinned spec text, and building a guess here risks inventing spec content rather than following it -- deliberately left unresolved, not deferred without investigation."], proof_requirements: {positive: ["Lexical-variant corpus with byte-exact lossless replay."], negative: ["Illegal whitespace and separators fail closed."]}}
