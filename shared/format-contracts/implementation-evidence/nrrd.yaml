execution_evidence:
  - evidence_id: NRRD-MULTIFILE-PRINTF-SUBDIM-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-multifile-printf-subdim-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Narrows (does not fully close)
      SAL-NRRD-OBL-807586E5B4D0EDB2 and SAL-NRRD-OBL-EBE5230D5204B4AD (both
      NRRD-MULTIFILE-001). Read the pinned NRRD spec's own Section 3 text directly
      (.local/format-contracts/acquired/nrrd/src-nrrd-001.bin) for the printf detached
      form's optional <subdim> parameter: "This value can be between 1 and D," D being
      the declared dimension. Read _safe_detached_payload directly before writing any
      code and found the printf branch hard-required exactly 4 tokens, meaning a
      legitimately spec-conformant 5-token declaration (format, min, max, step, subdim)
      was outright rejected as an invalid range -- confirmed as a real bug (rejecting
      valid input), not merely an unimplemented feature, via direct probing before any
      fix. Extended the printf branch to accept 4 or 5 tokens, parsing and
      range-validating the 5th as subdim (1 to dimension) before any file is opened;
      does not use subdim to alter which files are read or how bytes are concatenated
      (min/max/step alone already determine that). Investigated the LIST form's own
      subdim separately and found a structural obstacle -- _parse_header's list-mode
      handling discards the original header line entirely before this parser ever runs
      -- deliberately not attempted this slice, a separate, larger parsing change. 6 new
      tests (tests/python/nrrd/test_obligation_multifile_printf_subdim.py) prove: valid
      subdim=1 and the subdim==dimension "slabs" boundary both read correctly; a
      no-subdim 4-token declaration is unaffected; subdim too high, subdim=0, and a
      non-integer subdim are each independently rejected with a clear message. nrrd
      suite: 563 -> 569 passed. While patching the evidence YAML, a self-inflicted
      anchor break was caught and fixed before commit: the target obligation's own line
      was the sole definition site of the shared &TMULT anchor, and the first edit
      replaced it with a literal list without checking for aliases elsewhere --
      yaml.safe_load immediately raised "found undefined alias TMULT," fixed by
      expanding the second obligation's own alias into an equivalent literal list, then
      the whole file was re-validated to parse cleanly with &EXEC/&PAYLOAD intact. NOT
      backed by an independent reference NRRD implementation -- SELF-CONSISTENT
      format_factory-only evidence per the execution-recovery directive's GAP-008 rule,
      the subdim range rule grounded directly in the pinned spec's own text. Covers
      SAL-NRRD-OBL-807586E5B4D0EDB2 and SAL-NRRD-OBL-EBE5230D5204B4AD only; it supports
      no other obligation and promotes no product state.
  - evidence_id: NRRD-HEADER-FIELD-NAME-ALIASES-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-header-field-name-aliases-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes the "lexical variants" half of
      SAL-NRRD-OBL-6F9641D043F9DAAA (NRRD-HEADER-001). Grounded directly in the pinned NRRD
      spec text (.local/format-contracts/acquired/nrrd/src-nrrd-001.bin): "Field
      specifications with alternate equivalent forms are listed together (for example,
      'block size' is the same as 'blocksize')." Programmatically extracted every genuine
      "<spaced>: <...> <unspaced>: <...>" adjacency in the spec text via a dedicated
      extraction script (filtering for unspaced == spaced.replace(' ', '') to reject false
      positives like the coincidentally-adjacent "type"/"encoding" fields), rather than
      hand-transcribing a list from memory: block size/blocksize, old min/oldmin, old
      max/oldmax, data file/datafile, line skip/lineskip, byte skip/byteskip, sample
      units/sampleunits. Cross-checked all 7 against the current codebase and found 5
      already correctly handled (old min, old max, sample units, line skip, byte skip, each
      via an existing header.get(canonical, header.get(alias)) fallback at their own
      consumer) and 2 genuinely unrecognized anywhere (block size, data file), confirmed by
      direct interactive probing before any fix: a document declaring only "blocksize: 4"
      or "datafile: a.raw" was silently mishandled (block size validation never fired;
      data file was never found at all, since the header dict stored the literal unspaced
      key everything else ignored). Added a small _UNSPACED_FIELD_ALIASES map to
      codec/reader/reader.py, applied once in _parse_header immediately after computing the
      normalized field key -- before the existing duplicate-field check, so declaring both
      the spaced and unspaced form of the same field is correctly caught as a duplicate,
      matching the spec's own "alternate forms are the same field" framing. data file
      specifically required this parse-time approach rather than a scattered per-consumer
      patch (the pattern used for the other 5 pairs), since its own LIST-mode detection is
      itself keyed on the exact parsed field name, not resolved lazily by a downstream
      consumer. 5 new tests (tests/python/nrrd/test_obligation_header_field_name_aliases.py)
      prove: the blocksize alias is recognized for a block-typed document; the datafile
      alias is recognized and resolves a real detached payload; declaring both spaced and
      unspaced forms of either field raises a duplicate-field error; and the canonical
      spaced forms remain unaffected by the new alias map. nrrd suite: 558 -> 563 passed.
      NOT backed by an independent reference NRRD implementation -- SELF-CONSISTENT
      format_factory-only evidence per the execution-recovery directive's GAP-008 rule, with
      the alias table extracted programmatically from the pinned spec's own text rather than
      invented from memory. Covers SAL-NRRD-OBL-6F9641D043F9DAAA only (its own separate
      "canonical parsing strips significant field whitespace" clause remains a genuinely
      unsettled, deliberately unresolved question, investigated but not closed this slice);
      it supports no other obligation and promotes no product state.
  - evidence_id: NRRD-HEADER-FIELD-ORDERING-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-header-field-ordering-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-7D1A84A3077B90C2
      (NRRD-HEADER-001). The obligation's own missing_behavior named "field ordering
      constraints" as a remaining gap. Read the pinned NRRD specification text directly
      (.local/format-contracts/acquired/nrrd/src-nrrd-001.bin) rather than assuming: "the
      only constraint on field specification ordering is that the 'data file: LIST' form
      of the data file field ... must be the last field specification in the header.
      Within these constraints, the field specification may appear in any order" -- the
      ONLY ordering rule the format defines. Read _parse_header directly before writing
      any test and found the reader already enforces this correctly by construction:
      once 'data file: LIST' is seen, list_mode becomes True and every subsequent
      non-blank line unconditionally becomes list-file content, so nothing after it can
      ever be recognized as a field or comment again. 3 new tests (tests/python/nrrd/
      test_obligation_header_field_ordering.py) prove: a document where 'data file: LIST'
      truly is the last field specification, followed immediately by real filenames,
      reads correctly; a field-shaped line ("encoding: gzip") placed after 'data file:
      LIST' is never parsed as that field -- it surfaces as a detached-payload read
      error (a nonexistent filename), not a silently-applied wrong encoding; and a
      comment-shaped line ("# ...") placed after 'data file: LIST' is likewise never
      parsed as a comment, proving the list-mode switch is unconditional rather than
      selectively skipping comments. Field uniqueness (the other half of this
      obligation's "field uniqueness/ordering" clause) was already directly tested by
      a pre-existing fixture (test_duplicate_header_and_truncated_payload_fail_closed),
      confirmed by reading it directly rather than re-testing redundantly. Zero source
      code changes -- the ordering behavior was already shipped, only untested from
      this specific angle. nrrd suite: 555 -> 558 passed. NOT backed by an independent
      reference NRRD implementation -- SELF-CONSISTENT format_factory-only evidence per
      the execution-recovery directive's GAP-008 rule, with the ordering rule grounded
      directly in the pinned spec's own text. Covers SAL-NRRD-OBL-7D1A84A3077B90C2 only;
      it supports no other obligation and promotes no product state.
  - evidence_id: NRRD-CODEC-AVAILABILITY-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-codec-availability-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-09FD9B976DEEA254 (NRRD-ENC-001).
      bz2 was imported unconditionally at module level in payload.py -- a real CPython possibility (some
      minimal/container builds omit libbz2 support) that would crash the whole package at import time
      rather than failing explicitly at the point of use, with no public codec-availability API at all.
      gzip and zlib are, for all practical purposes, always present (required internally for zip/wheel
      handling) and were deliberately not given the same guard, avoiding speculative generality for
      modules that are not realistically optional. Converted the bz2 import to a guarded try/except,
      added available_encodings() (reporting the subset of SUPPORTED_ENCODINGS this interpreter can
      actually use), and wired an explicit refusal into decode_encoding/encode_encoding's bzip2 branches
      (NrrdParseError / NrrdWriteError respectively, naming the missing module) rather than letting an
      opaque AttributeError propagate from deep inside the codec call. 6 new tests use monkeypatch to
      simulate bz2 absence, the only way to exercise the guard since the dev environment always has bz2
      present; a 6th confirms gzip stays fully unaffected. nrrd suite: 549 -> 555 passed. NOT backed by an
      independent reference NRRD implementation -- SELF-CONSISTENT format_factory-only evidence per the
      execution-recovery directive's GAP-008 rule, with the bz2-optionality claim grounded in documented
      CPython build behavior. Covers SAL-NRRD-OBL-09FD9B976DEEA254 only; it supports no other obligation
      and promotes no product state.
  - evidence_id: NRRD-BASIC-METADATA-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-basic-metadata-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-1FE17FFCC0572ABC and
      SAL-NRRD-OBL-556FAEE08EA61D1A (both NRRD-META-001). None of content/min/max/old-min/old-max/
      number had any typed accessor before this slice, confirmed by grepping document.py directly.
      The pinned spec source confirms each field's exact semantics word-for-word: content is free
      text with no explicit delimiting; min/max are doubles where "any value, infinite or not, NaN
      or not, is valid"; old min/old max are doubles "meaningless for floating-point and block
      nrrds" (with unspaced oldmin/oldmax aliases); number is explicitly instructed to be "always
      ignored on reading, without even an attempt to parse the field as an integer" -- implemented
      exactly as instructed (raw text only, deliberately never parsed), not guessed. 9 new tests
      prove every field's projection, absence, NaN/infinite acceptance, both old-min/old-max
      spellings, no version gate (baseline since NRRD0001), and round-trip preservation. nrrd
      suite: 540 -> 549 passed. NOT backed by an independent reference NRRD implementation --
      SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive's GAP-008
      rule, not VERIFIED. Covers SAL-NRRD-OBL-1FE17FFCC0572ABC and SAL-NRRD-OBL-556FAEE08EA61D1A
      only; it supports no other obligation and promotes no product state.
  - evidence_id: NRRD-SAMPLE-UNITS-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-sample-units-001.json
