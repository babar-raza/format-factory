    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-00F18A8DA59864CD and
      SAL-NRRD-OBL-38F3D4743DF2B0F9 (both NRRD-PHYSICALMETA-001). No sample_units accessor existed
