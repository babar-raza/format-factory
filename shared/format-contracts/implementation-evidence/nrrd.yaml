      confirmed passing unchanged). Zero source or test changes -- pure evidence
      reconciliation, the same pattern as the xliff dataRef-resolution cluster fix
      (event 255) applied for the first time to nrrd. nrrd suite unchanged (575 passed).
      NOT backed by an independent reference NRRD implementation -- SELF-CONSISTENT
      format_factory-only evidence per the execution-recovery directive's GAP-008 rule;
      this is pure bookkeeping correction against already-proven implementation, not new
