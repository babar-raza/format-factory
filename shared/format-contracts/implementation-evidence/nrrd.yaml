  - evidence_id: NRRD-KIND-ENUM-ALIAS-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-kind-enum-alias-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-02AE194021A775AC and
      SAL-NRRD-OBL-7C0FD86BAE579F5C (both NRRD-KINDS-001). Grounded in two independent pinned
      authoritative sources, cross-checked against each other: the prose spec's own 31-entry
