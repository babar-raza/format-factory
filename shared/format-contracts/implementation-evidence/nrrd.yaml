ece of work' needing real file-splitting/joining logic -- investigated and found that logic already existed: dump()/dump_multifile()/dump_multifile_printf() (codec/writer/writer.py, built for NRRD-MULTIFILE-001 earlier this session) already perform it. NrrdDocument itself carries no attached/detached state of its own (confirmed by direct inspection: the model has no such field, and the wire form is determined entirely by which writer function a caller invokes), so 'conversion' needs no document mutation at all -- these three functions compose the existing writers and return an AttachmentConversionReport, making the capability a discoverable, single-purpose API rather than something a caller must infer from separately reading four writer functions' own signatures. Verified end-to-end with a standalone repro before any test was written: attached-to-detached-list, attached-to-detached-printf (including a negative step and an explicit subdim), and detached-to-attached (starting from a document actually loaded from a detached source, not just a freshly-built one) all round-trip correctly through the existing, unmodified reader. 8 new tests (test_obligation_attachment_conversion.py) additionally prove a document loaded from one detached form converts cleanly to a different detached form (no source-form state leaks), and that the composed writers' own refusal paths (uneven split, invalid printf pattern) still fire correctly through the new wrapper functions. nrrd suite: 665 passed, 1 skipped (unchanged count; test file is new, no existing test modified). mypy --strict and ruff clean. Combined 6-format run: 3772 -> 3780 passed, +8, 0 failed, 4 skipped.", "FF6-EVENT-000328: dtype conversion now also accepts an optional scale: float | None = None parameter, applied before overflow/rounding -- the fourth and last named policy (scaling) in the obligation's own compound rule_text, closing this obligation in full. Widened the existing 'float source requires explicit RoundingPolicy' guard to may_be_non_integral = source_is_float or scale is not None, since a non-integer scale factor can introduce fractional values even from an integer source. scale defaults to None with byte-for-byte identical behavior to before, so this is purely additive. ConversionReport gained a matching scale field so the applied factor is never silent. 5 new tests. nrrd suite: 675 -> 680 passed, 1 skipped."], missing_behavior: [], proof_requirements: {positive: ["Dtype, encoding, attachment, and endian conversion matrices with reports."], negative: ["Overflow, clipping, scaling, rounding, and unrepresentable-conversion cases."]}}
