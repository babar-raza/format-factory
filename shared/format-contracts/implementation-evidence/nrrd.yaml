      _nrrdKindStr_Eqv/_nrrdKindVal_Eqv arrays), which supplied the exact 23 alias strings Teem's
      own reader accepts (e.g. "RGB"/"RGBcolor" for "RGB-color"). A new codec/kinds.py module
      provides the full table plus canonical_kind(); validator.py now reports
      nrrd.kinds.unrecognized for a genuinely unrecognized kind string and
      nrrd.kinds.size_mismatch when a size-constrained kind's declared axis size disagrees with
