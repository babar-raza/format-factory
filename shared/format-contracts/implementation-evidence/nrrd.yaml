  - evidence_id: NRRD-DETACHED-WRITER-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-detached-writer-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-9FFEE6E206F405F4
      (NRRD-PAYLOAD-001) only. writer.py only ever emitted attached payloads before this slice,
      confirmed by reading dumps()/dump() directly. A new dump_detached() function writes the
      header (with a 'data file:' field naming the payload relative to the header's own
      directory) and the encoded payload to two separate destinations, reusing the same
      profile-selection and payload-encoding logic dumps() already uses (extracted into
      _select_profile/_encode_payload via a pure refactor, verified against the unchanged nrrd
      suite before any new code was added). Confinement is enforced at write time -- a payload
      destination outside the header's own directory is refused immediately, matching this
      reader's own read-time confinement rules (NRRD-SEC-001), so a document this package writes
      always round-trips through it. 5 new tests prove the header field, byte-exact round-trip,
      subdirectory support, write-time confinement refusal, and header-field preservation.
      Scoped to the single-file detached form only; multi-file LIST/printf sequence write support
      remains a genuinely separate, larger feature. nrrd suite: 512 -> 517 passed. NOT backed by
      an independent reference NRRD implementation -- SELF-CONSISTENT format_factory-only evidence
      per the execution-recovery directive's GAP-008 rule, not VERIFIED. Covers
      SAL-NRRD-OBL-9FFEE6E206F405F4 only; it supports no other obligation and promotes no product
      state.
  - evidence_id: NRRD-DETACHED-PATH-VERSION-GATE-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-detached-path-version-gate-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-4CAFF21A47F62F19 fully and
      narrows SAL-NRRD-OBL-09CDF5A28C011CD7 (both NRRD-PAYLOAD-001). The pinned spec source
      (src-nrrd-001.bin, SRC-NRRD-001) confirms word-for-word: "as of NRRD0004, the signifier of a
      header-relative file changed from the presence (at the beginning of the filename) of './',
      to the absence of '/' ... it becomes impossible for a header to refer to the data file
      relative to the current working directory of the reader" (post-change) -- meaning
      pre-NRRD0004 bare-relative names ARE cwd-relative per spec, a genuinely different, unconfined
      resolution base. reader.py's _safe_detached_payload and lazy.py's _resolve_detached_path
      (a separate, duplicated code path for lazy access, proven independently so the two cannot
      silently diverge) both now branch on version: a leading './' is recognized and stripped as
      header-relative pre-NRRD0004, and a bare relative name without it is refused rather than
      resolved unconfined -- a deliberate security-conscious choice, not spec-literal cwd-relative
      support, leaving the caller-supplied-resolver-policy half of the cluster honestly partial.
      12 new tests across 2 files prove all 4 version/prefix combinations plus confirm directory
      confinement still holds. nrrd suite: 500 -> 512 passed. NOT backed by an independent
      reference NRRD implementation -- SELF-CONSISTENT format_factory-only evidence per the
      execution-recovery directive's GAP-008 rule, not VERIFIED. Covers
      SAL-NRRD-OBL-4CAFF21A47F62F19 and SAL-NRRD-OBL-09CDF5A28C011CD7 only; it supports no other
      obligation and promotes no product state.
  - evidence_id: NRRD-KEYVALUE-ESCAPING-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-keyvalue-escaping-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Closes SAL-NRRD-OBL-48CB227B444651BA
      and SAL-NRRD-OBL-6533C8FB0044E3A2 (both NRRD-KEYVALUE-001). The pinned spec
      source (src-nrrd-001.bin, SRC-NRRD-001) confirms word-for-word: "a minimal
      escaping scheme is required ... '\n' signifies a new line ... '\\' signifies
      the backslash character" and "These can appear in NRRD0002 (and higher
      version) files, but not NRRD0001 files." Before this slice neither reader.py
      nor writer.py implemented any escaping -- a key/value value containing a real
      newline or backslash produced a header that could not be parsed back after
      dumps(), reproduced interactively before the fix. reader.py now unescapes and
      writer.py now escapes both directions correctly (backslash before newline, to
      avoid double-escaping); a NRRD0002 version gate now rejects key:=value lines
      in NRRD0001 headers. 10 new tests confirm round-tripping, escaping order, raw
      sequence decoding, and the version gate both ways. nrrd suite: 490 -> 500
      passed. NOT backed by an independent reference NRRD implementation --
      SELF-CONSISTENT format_factory-only evidence per the execution-recovery
      directive's GAP-008 rule, not VERIFIED. Covers SAL-NRRD-OBL-48CB227B444651BA
      and SAL-NRRD-OBL-6533C8FB0044E3A2 only; it supports no other obligation and
      promotes no product state.
