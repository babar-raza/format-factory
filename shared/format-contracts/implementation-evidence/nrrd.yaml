g_unchanged_from_before", "tests/python/nrrd/test_obligation_encoding_conversion.py::test_converting_to_every_supported_encoding_round_trips_the_same_values", "tests/python/nrrd/test_obligation_encoding_conversion.py::test_converting_to_the_same_encoding_is_a_no_op_round_trip", "tests/python/nrrd/test_obligation_attachment_conversion.py::TestConvertToDetachedList::test_round_trips_through_the_existing_reader", "tests/python/nrrd/test_obligation_attachment_conversion.py::TestConvertToDetachedList::test_works_starting_from_an_already_detached_document", "tests/python/nrrd/test_obligation_attachment_conversion.py::TestConvertToDetachedPrintf::test_round_trips_through_the_existing_reader", "tests/python/nrrd/test_obligation_attachment_conversion.py::TestConvertToDetachedPrintf::test_supports_negative_step_and_subdim", "tests/python/nrrd/test_obligation_attachment_conversion.py::TestConvertToAttached::test_round_trips_through_the_existing_reader", "tests/python/nrrd/test_obligation_attachment_conversion.py::TestConvertToAttached::test_converts_a_detached_document_back_to_a_single_attached_file"], negative_test_selectors: ["tests/python/nrrd/test_obligation_dtype_conversion.py::test_overflow_policy_raise_refuses_out_of_range_conversion", "tests/python/nrrd/test_obligation_dtype_conversion.py::test_float_to_integer_conversion_requires_an_explicit_rounding_policy", "tests/python/nrrd/test_obligation_dtype_conversion.py::test_a_non_integer_scale_on_an_integer_source_requires_an_explicit_rounding_policy", "tests/python/nrrd/test_obligation_dtype_conversion.py::test_endian_conversion_rejects_a_payload_not_a_multiple_of_element_size", "tests/python/nrrd/test_obligation_encoding_conversion.py::test_convert_encoding_refuses_an_unsupported_encoding_name", "tests/python/nrrd/test_obligation_encoding_conversion.py::test_convert_encoding_does_not_mutate_the_source_document", "tests/python/nrrd/test_obligation_attachment_conversion.py::TestRefusalPathsAreInheritedFromTheComposedWriter