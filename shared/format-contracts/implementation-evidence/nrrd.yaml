  - evidence_id: NRRD-LIST-FILE-COUNT-LIMIT-PROOF
    path: reports/skills-rff6/skill-transcripts/product-source-task-nrrd-list-file-count-limit-001.json
    expected_result: PASS
    granularity: selector
    truth_boundary: >-
      Selector-bound, unlike NRRD-R1-SOURCE-TESTS. Narrows (strengthens, does not
      change the already-partial status of) SAL-NRRD-OBL-807586E5B4D0EDB2
      (NRRD-MULTIFILE-001). Found by applying the same cross-format resource-limit
      comparison technique that closed the equivalent xliff and ora obligations at
      events 247-248: this obligation's own rule_text explicitly requires "file
      count... before allocation" validated for both numbered sequences and LIST
      payloads, and _safe_detached_payload's printf branch already checked
      file_count against limits.max_entries -- but the LIST branch, which builds
      its own names list from the header text with no equivalent check, did not.
      Confirmed as a genuine, exploitable gap by direct probing before any fix: a
      header declaring 200 LIST file names loaded successfully even with
      max_entries=64 explicitly configured. Fixed by adding the identical
      len(names) > limits.max_entries check to the LIST branch, matching the
      printf branch's exact message style and its check-before-any-file-is-opened
      discipline. Verified zero false positives against the entire pre-existing
      569-test nrrd suite before writing a single new test. 2 new tests
