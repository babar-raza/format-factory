  implemented_behavior:
  - 'FF6-EVENT-000317: OraNode now has an explicit_attributes: frozenset[str] field
    plus a was_explicit(name) query method, closing "was this value written explicitly,
    or just defaulted?" A prior tick''s own missing_behavior framed the fix as needing
    "nullable defaults threaded through OraNode/OraStack/OraLayer and every consumer
    of them (is_isolated_group included) -- real, larger-scoped work," which would
    have changed every existing field''s own type (float -> float | None) and forced
    every consumer to handle the new None case. Investigated and found a smaller,
    additive alternative: explicit_attributes is a PARALLEL field recording presence
    without changing x/y/opacity/visibility/composite_op/isolation''s own type or
    default value at all, so no existing consumer (is_isolated_group, is_visible,
    composite_op_details, any external caller) is affected -- proven directly by the
    entire pre-existing 337-test ora suite passing completely unchanged. Populated
    once at the single choke point every default-having attribute already passes
    through (_common() in codec/stack_xml.py, extended with an extra_tracked parameter
    for stack()''s own isolation-specific attribute), so it can never drift from what
    the existing opacity/visibility/composite_op parsing itself already considers
    "present". Confirmed the writer side needs no corresponding change: ora''s own
    round-trip story is byte-level LOSSLESS (original archive bytes preserved verbatim
    in LOSSLESS mode), not model-reconstruction-based -- grepped the whole package for
    a stack.xml serializer and found none, confirming this obligation''s own prior note
    ("the archive-level round trip is unaffected... container-level preservation, not
    this obligation''s model-level distinction") was correct: this is purely a
    model-level query capability. Verified end-to-end with a standalone repro before
    any test was written: a layer with opacity="0.5" explicit and a sibling with
    opacity omitted (defaulting to the SAME 1.0 as an explicitly-written "opacity=1.0"
    layer would) are correctly distinguished by was_explicit() despite identical
    resulting values -- the whole point of the obligation. 12 new tests
    (test_obligation_explicit_attribute_preservation.py) additionally prove: every
    tracked attribute (x, y, opacity, visibility, composite-op, isolation) is
    independently recorded; a partially-written set records only what was written; a
    node built directly in memory (bypassing the parser) has an empty set; isolation
    does not leak between a stack and its own child layers; nested stacks each track
    their own attributes independently. ora suite: 337 -> 349 passed (+12). mypy
    --strict and ruff clean. Combined 6-format run: 3780 -> 3792 passed, +12, 0 failed,
    4 skipped.'
  missing_behavior: []
  proof_requirements:
    positive:
    - Each preservation baseline behavior has a focused positive test and, where refusable, a negative
      test proving refusal with diagnostics.
    negative:
    - Selector-bound negative cases are not yet identified.
