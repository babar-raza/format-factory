    2026-08-06: ORA-ISOLATION-001 adds 15 tests against already-existing source (no new production code
    this slice either). ORA suite is now 204 passed with no failures. The remaining 9 capabilities have
    no source and no suite; their obligations stay `missing`. No ORA obligation is `implemented`; ORA-ISOLATION-001''s
    obligations move to `partial` only.

    2026-08-06 (later): ORA-PRESERVE-001 adds a new module (preservation.py, check_preservation()) plus
    9 tests -- genuinely new production code this time, not only tests against existing behavior. ORA
    suite is now 213 passed with no failures. The remaining 8 capabilities have no source and no suite;
    their obligations stay `missing`. No ORA obligation is `implemented`; ORA-PRESERVE-001''s obligations
    move to `partial` only.

    2026-08-06 (later still): ORA-LAYER-001/ORA-GROUP-001 add __post_init__ validation (validate_opacity/validate_visibility/validate_src)
    to every node type in model/stack.py, and codec/stack_xml.py now delegates to those same functions
    instead of keeping its own copies. All 213 pre-existing tests still pass unchanged (parser behavior
    and error types are identical). 38 new tests. ORA suite is now 251 passed with no failures. The remaining
    6 capabilities have no source and no suite; their obligations stay `missing`. No ORA obligation is
    `implemented`; ORA-LAYER-001/ORA-GROUP-001''s obligations move to `partial` only.

    2026-08-06 (later still): ORA-EDIT-001 adds a new module (transaction.py, apply_transaction()) plus
    10 tests, covering only its "transaction rollback" required-proof area (three others -- reference
    repair, stale-view invalidation, independent application reopen -- remain unattempted, see the dated
    note above for why). ORA suite is now 261 passed with no failures. The remaining 5 capabilities have
    no source and no suite; their obligations stay `missing`. No ORA obligation is `implemented`; ORA-EDIT-001''s
    obligations move to `partial` only.

    2026-08-06 (later still): first ORA `implemented` promotions -- pure evidence-citation correction,
    zero new production code or tests. codec/container.py''s OraContainer._check_mimetype/ALLOWED_COMPRESSION
    and model/stack.py''s validate_src already fully and exactly implement four ORA-MIMETYPE-001 obligations
    (mimetype sentinel position/compression/exact-bytes, ZIP-member compression-method restriction, and
    archive-root-relative src referencing), each with existing on-point positive and negative tests in
    tests/python/ora/test_obligation_container_and_mimetype.py and test_obligation_stack_and_document.py --
    but every one was citing the same three generic placeholder selectors (test_a_well_formed_archive_opens/test_missing_mimetype_is_rejected/test_mimetype_must_be_the_first_member)
    with no negative selectors at all, left over from this file''s original codex-authored ledger-map
    mapping. Corrected each obligation''s citation to its own precise, differentiated selector set. ORA
    suite unchanged at 261 passed (0 new tests, 0 source changes) -- proves this was a citation fix, not
    product work. Four ORA-MIMETYPE-001 obligations move from `partial` to `implemented`.

    2026-08-06 (later still): ORA-DOCUMENT-001 closes. model/document.py''s OraDocument had no
    __post_init__ at all -- every w/h/version/xres/yres domain invariant was enforced only by
    codec/stack_xml.py''s parser, so direct model construction (bypassing XML) could build an invalid
    document with no refusal. Added OraDocument.__post_init__ (positive width/height/xres/yres,
    non-empty version), matching model/stack.py''s OraNode precedent exactly, plus
    tests/python/ora/test_obligation_document_model_construction.py (14 new tests) proving the same
