  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-edit-metadata-reference-grounding-audit-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Narrows (does not fully close) SAL-ORA-OBL-EC8D65524EB96820 (ORA-EDIT-001), which stays partial -- this is an evidence-grounding correction, not new product capability. The obligation''s own rule_text names 3 remaining clauses: metadata as an edit target, reference maintenance, and stale-derived-view invalidation. Applied the identical citation-audit discipline already used and accepted for this obligation''s own ORA-MASK-001 sibling this session (same authority cluster, both citing SAL-ORA-00008 among others): full-text-searched all 3 pinned acquired OpenRaster spec sources for "metadata" (0 hits across all 3 -- confirmed the format has no dedicated metadata element or schema at all, unlike ODF''s meta.xml) and "reference" (4 hits, all in src-ora-002.bin, all describing the src attribute as an archive-member file path -- "image data files referenced by stack.xml", "files must be referenced... by their full path" -- zero hits describing any cross-element reference concept within the model tree). Confirmed directly that src (model/stack.py::validate_src) is a static archive-relative path independent of tree position, so renaming/moving/removing a layer does not change what its own src means -- there is nothing for "reference maintenance" to actually repair. Both clauses are therefore ungrounded authoring artifacts the spec does not define, the same disposition already established for ORA-MASK-001''s own "mask extension model" clause -- documented, not force-built, per GAP-008. The 3rd remaining clause (stale-derived-view invalidation) is explicitly NOT included in this finding: it is genuinely blocked on ORA-RENDER-001/ORA-COMPOSITE-001''s own still-unbuilt rendering engine, a real dependency gap, not an authoring artifact -- confirmed no pixel-compositing infrastructure exists anywhere in this package (the only render() in the codebase generates XML text, not pixels, per ORA-UTF8-BASELINE-CITATION-AUDIT-PROOF''s own earlier finding, re-confirmed unchanged this tick). Zero source or test changes -- pure evidence reconciliation citing direct, reproducible full-text spec searches. ora suite unchanged (349 passed). NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule; this is pure bookkeeping correction against verified spec-absence, not new evidence generation. Covers SAL-ORA-OBL-EC8D65524EB96820 only; it supports no other obligation and promotes no other product state.'
- evidence_id: ORA-EXPLICIT-ATTRIBUTE-PRESERVATION-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-explicit-attribute-preservation-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Closes SAL-ORA-OBL-9C467C6DD59DFEE7 (ORA-PRESERVE-001), promoted missing->implemented. A prior tick''s own missing_behavior framed the fix as needing "nullable defaults threaded through OraNode/OraStack/OraLayer and every consumer of them (is_isolated_group included) -- real, larger-scoped work not yet attempted," which would change every existing field''s own type (float -> float | None) and force every consumer to handle a new None case. Investigated and found a smaller, additive alternative: a PARALLEL explicit_attributes: frozenset[str] field on OraNode (plus a was_explicit(name) query method) records which of x/y/opacity/visibility/composite-op/isolation the source XML actually wrote, without changing any existing field''s own type or default value at all -- proven directly by the entire pre-existing 337-test ora suite passing completely unchanged after the field was added. Populated once at the single choke point every default-having attribute already passes through (_common() in codec/stack_xml.py), extended with an extra_tracked parameter for stack()''s own isolation-specific attribute, so tracking can never drift from what the existing opacity/visibility/composite_op parsing itself already considers "present". Confirmed the writer side needs no corresponding change: ora''s own round-trip story is byte-level LOSSLESS (original archive bytes preserved verbatim), not model-reconstruction-based -- grepped the whole package for a stack.xml serializer and found none, confirming this obligation is purely a model-level query capability, matching its own prior note that "the archive-level round trip is unaffected... container-level preservation, not this obligation''s model-level distinction." Verified end-to-end with a standalone repro before any test was written: a layer with opacity="0.5" explicit and a sibling with opacity omitted (defaulting to the SAME 1.0 an explicitly-written "opacity=1.0" layer would also produce) are correctly distinguished by was_explicit() despite identical resulting values -- the whole point of the obligation. 12 new tests (test_obligation_explicit_attribute_preservation.py) prove: every tracked attribute independently recorded; a partially-written set records only what was written; a node built directly in memory has an empty set; isolation does not leak between a stack and its own child layers; nested stacks track their own attributes independently. ora suite: 337 -> 349 passed (+12). mypy --strict and ruff clean. Combined 6-format run: 3780 -> 3792 passed, +12, 0 failed, 4 skipped -- zero regression beyond the 12 intentional new tests. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule; the obligation''s own rule_text ("preserve the distinction between an absent optional value and an explicitly written default") is the direct authority, and the tracked-attribute set is grounded in the same normative default-value rules OraNode''s own pre-existing __post_init__/docstring already cite. Covers SAL-ORA-OBL-9C467C6DD59DFEE7 only; it supports no other obligation.'
