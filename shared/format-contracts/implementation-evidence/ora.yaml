cluster. ora suite unchanged (320 passed). NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule; this is pure bookkeeping correction against already-proven implementation, not new evidence generation. Covers SAL-ORA-OBL-071A5F40BB2F4A17 and SAL-ORA-OBL-96D74D42B49F8C8B only; it supports no other obligation and promotes no other product state.'
- evidence_id: ORA-ATTRIBUTE-COUNT-LIMIT-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-attribute-count-limit-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Narrows (strengthens, does not change the already-implemented status of) SAL-ORA-OBL-1C91BEA24163FEE8 (ORA-SEC-001). Found by applying the same cross-format comparison technique that closed the equivalent xliff obligation (SAL-XLIFF-OBL-130340BC212989D5, XLIFF-SEC-001) one tick earlier: read this package''s own _Walker (stack_xml.py) directly and found it checked node count and nesting depth but never accumulated or checked attribute count anywhere, despite max_entries already being a configured, caller-facing limit. Confirmed as a genuine, exploitable gap by direct probing before any fix: a layer carrying 2000 attributes sailed straight through even with max_entries=5 explicitly configured. A second, distinct sub-gap was also found and fixed in the same pass: the <image> root element and the top-level <stack> element''s own attributes bypass _Walker.child()''s recursive dispatch entirely (only their descendants are ever visited through it), so an attribute flood on either of those two specific elements would have escaped even a naive attribute-count fix that only touched child(). Added _Walker.count_element() (node count + attribute count together) called explicitly for the root and top-level stack in parse_stack, and via the existing child() dispatch for every descendant as before. Verified zero false positives against the entire pre-existing 316-test ora suite before writing a single new test. 4 new tests (tests/python/ora/test_obligation_security_baseline.py) prove: an attribute flood on a nested layer, on the <image> root, and on the top-level <stack> are each independently refused, and a normal document with attributes safely within the limit still parses. ora suite: 316 -> 320 passed. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, the fix grounded directly in the already-proven, structurally-identical ubl/xliff sibling implementations, not invented from memory. Covers SAL-ORA-OBL-1C91BEA24163FEE8 only; it supports no other obligation and promotes no product state.'
- evidence_id: ORA-STACK-XML-UTF8-ENFORCEMENT-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-stack-xml-utf8-enforcement-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Closes SAL-ORA-OBL-8EDD775BF1715438 (ORA-STREAM-001). This obligation''s own rule_text is narrow -- "The required stack.xml archive member is a UTF-8 encoded XML document conforming to the OpenRaster Layer Stack format" -- distinct from its capability sibling SAL-ORA-OBL-F8A3777A56AA6121''s much larger streaming/lazy-access/resource-budget rule_text; the two share a proof_requirements template but not a rule_text, and this slice closes only the former. Before this slice, parse_stack fed raw archive bytes straight to ElementTree.fromstring with no encoding check at all, confirmed via direct interactive probing before writing any test: a stack.xml declaring encoding="ISO-8859-1" (with correspondingly-encoded bytes) parsed successfully, and a stack.xml with genuinely non-UTF-8 bytes and NO declaration at all also parsed successfully (mojibake silently produced instead of a refusal) -- both real, previously-unenforced spec violations, not just untested behavior. Added _require_utf8() to codec/stack_xml.py: rejects any XML declaration whose encoding pseudo-attribute is not case-insensitively "utf-8", then independently rejects payload bytes that fail to decode as UTF-8 even with no declaration present (catching the undeclared-mojibake case the declaration check alone would miss). Wired immediately after the existing reject_unsafe_xml() call in parse_stack. 5 new tests prove: a declared non-UTF-8 encoding is refused; genuinely non-UTF-8 bytes are refused even with no declaration; an explicit UTF-8 declaration parses normally; a case-insensitive "utf-8" declaration parses normally; and undeclared genuine UTF-8 bytes (including non-ASCII content) parse normally. The "conforming to the OpenRaster Layer Stack format" half of this obligation''s rule_text was already extensively covered by test_obligation_stack_and_document.py''s pre-existing 33 tests (root/stack/layer/text element structure, required attributes, opacity/visibility/composite-op parsing) -- cited here rather than re-proven. ora suite: 311 -> 316 passed. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, with the UTF-8 requirement grounded directly in the pinned spec''s own text (quoted verbatim in container.py''s module docstring from an earlier tick). Covers SAL-ORA-OBL-8EDD775BF1715438 only; it supports no other obligation and promotes no product state.'
- evidence_id: ORA-VERSION-DRIFT-WARNING-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-version-drift-warning-001.json
