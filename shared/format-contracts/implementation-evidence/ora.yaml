  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Closes SAL-ORA-OBL-F2672F4CCD923AC2 (ORA-VALIDATE-001)''s remaining "distinguish errors from interoperability warnings" clause. Every Diagnostic this package ever emitted used Severity.ERROR; Severity.WARNING, already supported by the shared Diagnostic/Severity type, was never constructed anywhere in lifecycle.py before this slice. load() already computed declared_version and detected_version (via the pre-existing _detect_version helper) but only exposed their disagreement as two separate OraImage fields, never diagnosed it. Added _parse_profile_version() (a narrow x.y.z parser, since the version attribute has no format constraint in the specification''s own grammar) and _version_drift_diagnostics(), wired into validate(): a document whose declared version is older than what its own features require now gets a Severity.WARNING finding, while ValidationReport.is_valid correctly stays true (WARNING is deliberately excluded from invalidating a report by the shared type''s own design). 6 new tests prove: the warning fires with the correct content, it does not flip is_valid, no warning when versions already match, no warning when declared is ahead of detected, an unparseable declared version produces neither a warning nor a crash, and the warning coexists with a genuine ERROR in the same report without either masking the other. ora suite: 305 -> 311 passed. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, not VERIFIED. Covers SAL-ORA-OBL-F2672F4CCD923AC2 only; it supports no other obligation and promotes no product state.'
- evidence_id: ORA-COMPOSITE-OP-REGISTRY-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-composite-op-registry-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Closes 6 obligations sharing the identical "composite-op attribute defaults to svg:src-over and selects a documented blend function combined with a Porter-Duff compositing operator" rule_text, one per capability (ORA-COMPOSITE-001, ORA-STACK-001, ORA-LAYER-001, ORA-GROUP-001, ORA-EDIT-001, ORA-RENDER-001). Every prior event explicitly deferred this cluster: "building an honest registry now would risk inventing spec content from memory rather than a verified source." This slice reads the pinned, authority-locked Layer Stack Specification directly (.local/format-contracts/acquired/ora/src-ora-003.bin, "composite-op attribute" section) and transcribes its own 20-row table (Value / Blending function / Compositing Operator) into a new composite_ops.py module, wired onto OraNode as a composite_op_details property inherited by every layer/stack/text node. The same spec text states composite-op is a deliberately open, forward-compatible vocabulary ("In the future other compositing modes might be added..."), so the lookup returns None for a value outside the table rather than raising -- proven both statically and via a behavioral test constructing a node with an unrecognized value and confirming it survives unrejected. 11 new tests: registry completeness, default-value mapping, a blend-only case, a Porter-Duff-operator-only case, the one non-Source-Over-operator case (svg:plus), the unrecognized-value-returns-None case, OraLayer/OraStack accessor wiring, a behavioral forward-compat preservation proof, and an exhaustive round trip over all 20 registry entries. SAL-ORA-OBL-071A5F40BB2F4A17 (ORA-LAYER-001''s separate, bundled "reject invalid values" rule_text covering source/name/offsets/opacity/visibility/composite-op together) deliberately left untouched -- its composite-op sub-clause is in tension with this same spec text''s own open-vocabulary statement and needs a dedicated future investigation, not a rushed force-close here. ora suite: 294 -> 305 passed. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, not VERIFIED. Covers SAL-ORA-OBL-3EFB60C80F84675D, SAL-ORA-OBL-41F8137CE8D8479A, SAL-ORA-OBL-6B6D7BEE18077E8A, SAL-ORA-OBL-930CACD129A5CC40, SAL-ORA-OBL-4EC8C1CC747F7FC6, and SAL-ORA-OBL-07BA02F318F0DE06 only; it supports no other obligation and promotes no product state.'
