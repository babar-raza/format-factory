  - ORA-MIMETYPE-SELECTOR-PROOF
  implemented_behavior:
  - 'validate_src (shared by the XML parser and direct model construction, so neither route can diverge)
    enforces the rule''s normative half: a layer/text src must be a non-empty, archive-root-relative
    path -- absolute paths, backslashes, drive letters, and `..` traversal are all rejected. The rule''s
    other clause ("conventionally stored below data/") is explicitly non-normative phrasing (a naming
    convention, not a MUST); no validator enforces a data/ prefix, and none should -- the writer preserves
