  implemented_behavior:
  - 'apply_transaction genuinely provides atomic multi-step commit/rollback (proven: all-succeed commits, any failure rolls back completely, layer and asset-member edits commit or roll back together as one unit). This slice closes the ''replace'', ''move'', and ''remove'' half of the obligation''s own confirmed gap: apply_transaction is fully generic (any OraImage -> OraImage callable built from dataclasses.replace() on the model is a valid step), so these were not a new feature to build, only new step helpers to exercise through the existing machinery. All five named operations (add, replace, move, rename, remove) are now proven against both a layer target and a group target (OraStack nests other stacks/layers/text, so a ''group'' is simply a non-root OraStack) -- including a group removal that carries its own children with it, and a rollback proof combining a replace and a group-remove that both revert together on a later failure. ''Metadata'' remains untested: no metadata concept exists anywhere in the ora model, so there is nothing to build a step against without inventing one (GAP-008). Reference maintenance and stale-derived-view invalidation remain out of scope, unchanged from before this slice: no cross-element reference type exists yet to repair against, and no rendering engine exists to make a stale view fresh again (ORA-RENDER-001/ORA-COMPOSITE-001 are still missing).'
  - 'FF6-EVENT-000318: investigated whether ''metadata'' and ''maintain references'' -- 2 of this obligation''s own 3 remaining rule_text clauses -- are genuinely grounded in the pinned OpenRaster spec, applying the identical discipline already validated for this obligation''s own ORA-MASK-001 sibling (same authority_fact_ids cluster, SAL-ORA-00008 among them). Full-text-searched all 3 pinned acquired spec sources (.local/format-contracts/acquired/ora/src-ora-00{1,2,3}.bin) for "metadata": 0 hits in all 3 -- the OpenRaster format has no dedicated metadata element or schema the way ODF has meta.xml; it is a ZIP of mimetype + stack.xml + raster assets only. Searched for "reference": 4 hits, all in src-ora-002.bin, all describing the src attribute pointing to an ARCHIVE MEMBER FILE ("image data files referenced by stack.xml", "files must be referenced in stack.xml by their full path") -- zero hits describing a cross-ELEMENT reference within the model tree (no id-based pointer from one layer/stack/text to another exists anywhere in the spec). src (already fully validated by validate_src in model/stack.py, confirmed unaffected by rename/move/remove since it is a static archive path, not derived from tree position) is the ONLY reference-shaped concept OpenRaster defines, and it needs no "maintenance" on edit -- renaming, moving, or removing a layer does not change what its own src value means. Both clauses are therefore ungrounded authoring artifacts, the same finding already established for ORA-MASK-001''s own "mask extension model" clause -- not force-built, matching this obligation''s own established discipline of citing rather than inventing. The 3rd remaining clause, stale-derived-view invalidation, is NOT ungrounded -- it is genuinely blocked on ORA-RENDER-001/ORA-COMPOSITE-001''s own still-unbuilt rendering engine (confirmed: no pixel-compositing infrastructure exists anywhere in this package). Zero source or test changes -- pure evidence-grounding correction, matching the identical evidentiary weight and non-promoting scope of ORA-UTF8-BASELINE-CITATION-AUDIT-PROOF and ORA-COMPOSITE-OP-REJECTION-SCOPE-CORRECTION-PROOF earlier this session. ora suite unchanged (349 passed).'
  missing_behavior:
  - '''Metadata'' as an edit target and ''maintain references'' are confirmed ungrounded, not merely untested (see FF6-EVENT-000318 above): the OpenRaster spec defines no metadata concept and no cross-element reference concept, so neither clause can be honestly built without inventing content the format does not define. Stale-derived-view invalidation on edit remains genuinely, differently blocked: it needs a rendering engine (ORA-RENDER-001/ORA-COMPOSITE-001) that does not exist yet -- this clause alone is the obligation''s own remaining real gap, not an authoring artifact.'
