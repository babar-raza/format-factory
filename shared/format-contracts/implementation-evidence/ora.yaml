  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Narrows (does not fully close) SAL-ORA-OBL-EC8D65524EB96820 (ORA-EDIT-001). apply_transaction was already fully generic before this slice -- any OraImage -> OraImage callable built from dataclasses.replace() is a valid step -- so replace/move/remove were not a missing feature, only untested through the existing machinery. Verified interactively before writing any test: a replace step swapping one layer for a newly-constructed one, a move step relocating a layer from the root into a nested group (OraStack nesting is the group mechanism), a remove step deleting a layer, a remove step deleting an entire group along with its children, and a rollback proof combining a replace and a group-remove that both revert together on a later failure -- all 5 confirmed working on the first attempt via the model''s existing dataclasses.replace()-based mutation, then formalized as 5 new pytest tests. Metadata targets remain untested (no metadata concept exists in the model); reference maintenance and stale-view invalidation remain untested (no reference type or rendering engine exists) -- both correctly left as open gaps per GAP-008, not force-closed. ora suite: 289 -> 294 passed. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, not VERIFIED. Covers SAL-ORA-OBL-EC8D65524EB96820 only; it supports no other obligation and promotes no product state.'
- evidence_id: ORA-MALFORMED-UNICODE-MEMBER-NAME-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-malformed-unicode-member-name-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. A member declaring the ZIP UTF-8 filename flag but carrying invalid UTF-8 bytes made zipfile.ZipFile() raise a raw, uncaught UnicodeDecodeError during construction -- confirmed directly against CPython zipfile module source (filename.decode(''utf-8'') with no error handling when the flag is set) and interactively with a hand-built ZIP before any fix was written; zipfile''s own writer API cannot construct an invalid-UTF-8 name, so no test using it could ever have caught this. Fixed by catching UnicodeDecodeError around the ZipFile() construction in OraContainer.from_bytes() and raising the package''s own typed OraArchiveError instead. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, not VERIFIED for anything beyond the confirmed CPython zipfile decode behavior. Covers SAL-ORA-OBL-5F86B60E46B035A9 only; it supports no other obligation and promotes no product state.'
- evidence_id: ORA-UTF8-BASELINE-CITATION-AUDIT-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-utf8-baseline-citation-audit-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Closes 15 of the 22 generic-placeholder obligations event 174 flagged as ora''s largest remaining opportunity -- the other 7 (ORA-COMPOSITE-001, ORA-MASK-001, ORA-STREAM-001, ORA-RENDER-001) had no citation at all and remain genuine, confirmed unbuilt features (mask extensions: zero hits for "mask" anywhere in src/; streaming: load() eagerly reads every archive member into memory in one dict comprehension, the opposite of lazy/bounded access; rendering: the only render() in the codebase generates XML text, not pixels). 6 obligations sharing one identical rule_text ("the required stack.xml archive member is a UTF-8 encoded XML document") were cited against unrelated tests (PNG-header reads, in-memory-only transaction edits, mimetype-presence checks) -- closed with 2 new tests proving both directions: a non-ASCII layer name round-trips through write and read with the emitted bytes carrying the UTF-8 XML declaration, and a byte sequence that is not valid UTF-8 inside a document declaring encoding="UTF-8" is refused (verified interactively against ElementTree.fromstring''s real behavior before writing the test, not assumed). 4 obligations sharing another identical rule_text ("full baseline support for reading/editing/viewing... baseline support for visualization where editing may damage the result") were promoted via a reasoned, explicitly-documented mapping onto this library''s existing LOSSLESS-vs-CANONICAL PreservationMode design, not a literal citation match -- the reasoning is written into each obligation''s implemented_behavior for independent audit. 4 more obligations closed individually: baseline-intent extension safety for stack.xml attributes (cross-file citation to already-existing preservation tests), interop/non-destructive-saving (cross-file citation to already-existing round-trip tests), tree modeling (existing visual-order/nesting/child-kind tests plus 2 new tests closing the one untested clause, root-versus-non-root constraints -- parse_stack already correctly enforced exactly-one-root-stack but had zero test coverage), and extension safety for raster/archive assets specifically (1 new test proving an unrecognized vendor archive member survives round-trip in both preservation modes). 1 obligation (transactional add/replace/move/rename/remove for groups/layers/assets/metadata) stays honestly partial: only add is genuinely tested; replace/move/remove/groups/metadata/reference-maintenance/stale-view-invalidation are not -- its generic placeholder was replaced with this precise characterization rather than force-promoted. ora suite: 283 -> 288 passed. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule, not VERIFIED. Covers SAL-ORA-OBL-11A840CCAC773C4F, SAL-ORA-OBL-FAE67484E14C50B4, SAL-ORA-OBL-68519A171D58F7D6, SAL-ORA-OBL-46734DBF545B4DD3, SAL-ORA-OBL-587789B06338BF94, SAL-ORA-OBL-E371B8F2C428AB4C, SAL-ORA-OBL-2B5CB90B7C3E7512, SAL-ORA-OBL-3B127E22A6A75F82, SAL-ORA-OBL-11C60333E6524D1B, SAL-ORA-OBL-A9ED959901671553, SAL-ORA-OBL-4C5ADF883687656E, SAL-ORA-OBL-D4098FD6A2610B3F, SAL-ORA-OBL-D430DAB9BD55A80C, SAL-ORA-OBL-D7C9E9B6208C49AF, and SAL-ORA-OBL-EC8D65524EB96820 only; it supports no other obligation and promotes no product state.'
