  implemented_behavior:
  - 'OpenRaster''s full-vs-baseline implementation-level concept is modeled directly by this library''s two PreservationMode values: LOSSLESS (the default) reads, edits in memory, and writes back without damaging content it does not model -- proven by test_lossless_is_the_default_preservation_mode, an unknown vendor attribute survives an unmodified save. CANONICAL is the explicit, opt-in ''baseline save'' path that regenerates stack.xml purely from the typed model, so anything the model does not represent is visibly dropped rather than accidentally lost -- test_canonical_mode_regenerates_the_stack_and_drops_unmodelled_content proves exactly this: an unmodeled mypaint:locked extension attribute is absent from the regenerated output. This is the concrete implementation of ''full baseline support for reading and editing and viewing'' (LOSSLESS, safe by default) versus ''baseline support for visualization where editing may damage the result'' (CANONICAL, the caller-chosen path where editing can discard what the model does not understand). Full read-edit-write viability is proven by test_the_written_archive_is_accepted_by_our_own_loader.'
