- evidence_id: ORA-COMPOSITE-INVENTORY-PROFILE-INDEPENDENCE-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-composite-inventory-profile-independence-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Narrows (does not fully close) SAL-ORA-OBL-2CC875865800D528 (ORA-COMPOSITE-001), promoted missing->partial. This specific obligation ID had zero cross-referenced evidence before this tick -- status=missing, source_symbols=[] -- despite sharing the exact same capability_id (ORA-COMPOSITE-001) as a sibling obligation (SAL-ORA-OBL-4EC8C1CC747F7FC6) already closed earlier this session by the same composite_ops.py registry this entry now also cites; the two obligations have different rule_text (this one''s own is broader: "expose the selected profile''s complete compositing-operation inventory, default operation, validation, and pixel semantics through a replaceable rendering adapter" vs the sibling''s narrower "composite-op attribute defaults to svg:src-over..."), so this was never a pure duplicate-mapping fix. Investigated all four named clauses directly. "The selected profile''s... inventory": re-read the pinned Layer Stack Specification''s own "composite-op attribute" section directly (.local/format-contracts/acquired/ora/src-ora-003.bin) and confirmed the composite-op table has no per-profile gating anywhere in that section -- "profile" is not a real distinct requirement beyond the existing registry. Proven behaviorally (not merely by spec citation) via 2 new tests showing composite-op resolution is identical regardless of isolation-triggering attributes (this obligation''s own second authority fact, SAL-ORA-00011: isolation depends on opacity/composite-op/isolation together, a profile 0.0.4+ concern already covered by a different sibling obligation, SAL-ORA-OBL-C668456FEC0FF4E4). "Default operation" and "validation": already fully implemented (DEFAULT_COMPOSITE_OP, composite_op_info()); 2 new tests add fresh, dedicated proof of "validation" specifically meaning universal acceptance with structured lookup (every known value plus 3 forward-compatible unknown values including an empty string all construct successfully), matching the spec''s own explicit open-vocabulary mandate rather than inventing a rejection semantic the spec forbids. "Pixel semantics through a replaceable rendering adapter" remains genuinely, honestly unresolved: investigated and confirmed this package has no rendering engine, no pixel-level compositing computation, and no adapter abstraction at all -- the same genuinely-blocked scope already correctly deferred for ORA-RENDER-001 (also unbuilt, requires the identical missing infrastructure). 4 new tests (tests/python/ora/test_obligation_composite_inventory_profile_independence.py), plus 4 existing tests from the sibling test_obligation_composite_op_registry.py cross-referenced as supplementary positive evidence for this obligation specifically (inventory completeness, default-value mapping, unrecognized-value preservation, full registry round trip). ora suite: 359 passed (unchanged -- purely additive). mypy --strict via standalone single-file invocation fails to resolve format_factory.ora for ALL ora test files (confirmed identical failure on the already-committed, already-passing sibling test_obligation_composite_op_registry.py) -- a pre-existing environment quirk in how mypy resolves this package''s own editable install for standalone test-file checks, not a regression; mypy --strict against the full ora source package itself (14 files) is clean. ruff clean. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule; the profile-independence and validation-scope findings are direct, literal readings of the pinned spec text, not new interpretation. Covers SAL-ORA-OBL-2CC875865800D528 only; it supports no other obligation and promotes no other product state. This is a NARROWING, not a closure -- the obligation stays partial, and ora''s own unresolved-obligation count is unchanged by this entry alone.'
- evidence_id: ORA-STREAM-BUDGETS-CANCELLATION-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-stream-budgets-cancellation-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Narrows (does not fully close) SAL-ORA-OBL-F8A3777A56AA6121 (ORA-STREAM-001), promoted missing->partial. This specific obligation ID had zero cross-referenced evidence before this tick -- status=missing, source_symbols=[] -- despite five of its own six named requirements ("stream archive and XML inspection in bounded memory, expose lazy asset access, and fail before exceeding configured compressed, expanded, raster, nesting, or render budgets") already being implemented and extensively tested across modules built for other obligations this session: OraContainer.from_bytes (codec/container.py) checks entry count, declared uncompressed size, and compression ratio from the ZIP central directory alone, refusing before a single byte is decompressed; read_png_metadata (codec/png_metadata.py) parses only a PNG''s 25-byte IHDR chunk and never inflates pixel data, proven available even when the pixel payload itself is corrupt, with the declared surface size checked via checked arithmetic before decode; codec/stack_xml.py''s bounded recursion walk refuses nesting depth beyond the configured limit. Cross-mapped 8 already-existing, already-passing tests from 4 sibling test files onto this obligation as supplementary evidence rather than duplicating them. The two genuinely unproven pieces got fresh, dedicated tests: "lazy-read instrumentation" (this obligation''s own required_tests wording, taken literally) is proven by spying on the underlying zipfile.ZipFile.read calls directly, confirming resolving one layer''s asset never reads a sibling layer''s own archive member -- not inferred from the absence of an observed side effect. "Cancellation" was investigated rather than assumed unbuildable: this library is fully synchronous with no interrupt-mid-flight primitive anywhere in the codebase (confirmed by a targeted grep across ora and its sibling formats), so cancellation cannot mean interrupting a read in progress -- it means the API''s own shape lets a caller stop calling the resolver after any layer without cost. Proven by contrasting resolve_all_assets() (eager, all-or-nothing: raises outright on an unresolvable layer, yielding nothing at all) against the granular iter_layers()/resolve_asset() combination (yields each result as it goes, so a caller can stop -- cancel -- the moment they have what they need or before reaching a layer they no longer want). "Render budget" remains genuinely, honestly unresolved: this package has no rendering engine at all, so there is no render operation to bound in the first place -- the identical scope already correctly deferred for ORA-RENDER-001 and for ORA-COMPOSITE-001''s own "pixel semantics" clause (SAL-ORA-OBL-2CC875865800D528, narrowed the same way one tick earlier this session). 2 new tests (tests/python/ora/test_obligation_stream_budgets_and_cancellation.py). ora suite: 359 -> 361 passed. mypy --strict via standalone single-file invocation fails to resolve format_factory.ora for ALL ora test files (the same pre-existing environment quirk already confirmed and disclosed for ORA-COMPOSITE-INVENTORY-PROFILE-INDEPENDENCE-PROOF, not a regression); mypy --strict against the full ora source package (unchanged by this slice -- no production source was modified) remains clean. ruff clean. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule; every claim here is grounded in direct reads of already-existing, already-proven source and behavioral tests, not new interpretation. Covers SAL-ORA-OBL-F8A3777A56AA6121 only; it supports no other obligation and promotes no other product state. This is a NARROWING, not a closure -- ora''s own unresolved-obligation count is unchanged by this entry alone.'
- evidence_id: ORA-BASELINEASSET-REPLACE-PROOF
  path: reports/skills-rff6/skill-transcripts/product-source-task-ora-baseline-asset-replace-001.json
  expected_result: PASS
  granularity: selector
  truth_boundary: 'Selector-bound, unlike ORA-BASELINE-SUITE. Narrows (does not fully close) SAL-ORA-OBL-52746ABC41B3E790 (ORA-BASELINEASSET-001), which stays partial -- "generate" remains genuinely unbuilt. This obligation''s own compound rule_text names 4 actions ("read, validate, generate, and replace") plus one negative constraint ("without confusing them with editable layer sources"); "read", "validate", and the no-confusion constraint were already implemented and proven, leaving "generate" and "replace" bundled together in this obligation''s own prior missing_behavior text as if they were one requirement. Investigated directly and found they are two distinct requirements: "generate" needs actual pixel-compositing/downscaling computation this package has no rendering engine for at all (the same genuinely blocked scope as ORA-RENDER-001 and ORA-COMPOSITE-001''s own "pixel semantics" clause), but "replace" does not -- it only needs to accept a caller-supplied new asset (produced by some other means, outside this library) and validate it the same way a freshly loaded document''s own assets are validated on load. Confirmed the underlying mechanism already existed: OraImage.members is a general dict of every archive member, and dumps() already writes whatever it contains -- so "replacing" a member was already mechanically possible by mutating the dict directly, just with no validated, dedicated, ergonomic API for it. Added replace_baseline_asset(image, *, thumbnail=None, merged_image=None) -> OraImage (lifecycle.py): reuses read_png_metadata and the exact same satisfies_thumbnail_constraints()/satisfies_merged_image_constraints() checks _baseline_asset_diagnostics already applies on load, refusing a non-conforming replacement (oversized/interlaced thumbnail, wrong merged-image bit depth) with the same error framing rather than silently accepting it or leaving a caller to reimplement the checks themselves. Returns a new OraImage via dataclasses.replace (non-mutating, proven by a dedicated test showing the original document''s own members are unchanged after a replace call). Exported through both lifecycle.py and the top-level ora __init__.py. 9 new tests (tests/python/ora/test_obligation_baseline_asset_replacement.py): swapping the thumbnail alone, the merged image alone, both together, non-mutation of the original, 3 refusal cases (oversized thumbnail, interlaced thumbnail, wrong-bit-depth merged image), the require-at-least-one-argument refusal, and a full write/read round trip proving the replaced member survives dumps()/loads() byte-identical. mypy --strict and ruff clean on both changed source files. ora suite: 361 -> 370 passed. Combined 6-format regression: 3989 passed, 4 skipped, 0 failed. NOT backed by an independent reference OpenRaster implementation -- SELF-CONSISTENT format_factory-only evidence per the execution-recovery directive''s GAP-008 rule; the validation semantics are a direct reuse of already-proven, already-spec-grounded constraint checks, not new interpretation. Covers SAL-ORA-OBL-52746ABC41B3E790 only; it supports no other obligation and promotes no other product state. This is a NARROWING (real new product capability added, not pure evidence remapping), not a closure -- ora''s own unresolved-obligation count is unchanged by this entry alone since "generate" keeps the obligation at partial, not implemented.'
