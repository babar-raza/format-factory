scope_policy:
  minimum_viable_support: Recognize document roots by QName, parse into a typed component model, edit
    core business components, serialize schema-valid output, and run schema plus referential validation
    with complete diagnostics.
  production_complete_target: 'Support every document root of the target specification version with its
    full shared component library: typed read, create, edit, schema-order serialization, layered validation
    including code lists, extension preservation, signature-safe round trips, and referential integrity.'
capabilities:
- release_gates:
  - Calculation policies documented; reconciliation never mutates by default (tested).
  capability_id: UBL-CALC-001
  level: SHOULD
  category: calculate
  title: Business-total calculation and reconciliation
  production_meaning: Line extensions, allowances/charges, taxes, and payable totals calculate under explicit
    policies and reconcile against declared totals with configurable tolerances - never silently mutating
    declared values.
  developer_use_case: A developer validates that declared totals match calculated totals under the profile's
    rounding rules and receives per-total deltas.
  provenance:
  - POL-XBZ-CALC-01
  - SAL-UBL-00110
  - SAL-UBL-00122
  - SAL-UBL-00123
  - SAL-UBL-00127
  - SAL-UBL-50613DF5EFE944E0
  - RF-UBL-00005
  required_behavior:
  - Calculate document totals under explicit rounding/tolerance policies and compare to declared totals
    without mutating them unless repair mode is explicitly requested.
  - Calculate line extensions, allowance/charge totals, tax totals, and payable amounts under explicit
    rounding/tolerance policies and reconcile them against declared totals with per-total deltas, never
    mutating declared values outside explicit repair mode.
  normative_rules:
  - (UBL document totals) UBL AmountType is decimal and requires currencyID; aggregate definitions document
    line extension, tax, and payable amounts, but the XSD does not encode cross-field arithmetic reconciliation.
  - (UBL common library - LegalMonetaryTotal) cac:LegalMonetaryTotal is an aggregate component type carrying
    line extension, tax-inclusive, allowance, charge, and payable amount elements
  - (UBL common library - Party) cac:Party is an aggregate component type carrying party identification,
    names, postal addresses, tax schemes, and contacts as child elements
  - (UBL common library - TaxTotal) cac:TaxTotal is an aggregate component type carrying cbc:TaxAmount
    and nested cac:TaxSubtotal elements per tax category
  - (xsd/maindoc/UBL-*-2.3.xsd) Each UBL 2.3 maindoc XSD declares a document-type target namespace and
    qualified XML element syntax for its document element and content model.
  depth_required: 6
  depth_rationale: 'SHOULD calculate capability: family depth floor 6, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Reconciliation fixtures with agreeing and disagreeing declared totals across rounding policies.
- release_gates:
  - Code-list validation produces machine-readable results separated from schema results.
  capability_id: UBL-CODELIST-001
  level: MUST
  category: validate
  title: Code-list infrastructure
  production_meaning: Official code lists load from their distribution format, map to coded properties,
    and validate values with list/agency/version identity - deterministic and offline.
  developer_use_case: A developer validates coded fields against the official lists and plugs in profile-supplied
    lists without code changes.
  provenance:
  - POL-XBZ-CODELIST-01
  - SAL-UBL-00110
  - SAL-UBL-00112
  - SAL-UBL-00116
  - SAL-UBL-00118
  - SAL-UBL-00119
  - SAL-UBL-00121
  - SAL-UBL-00124
  - SAL-UBL-00129
  - RF-UBL-00003
  required_behavior:
  - Load official code-list resources, map them to coded properties, validate identifiers/agencies/versions/values,
    and support user-supplied lists.
  - Load official code lists from their distribution artifacts, cache them immutably, and validate coded
    values deterministically offline, with user- or profile-supplied lists pluggable at runtime.
  normative_rules:
  - (UBL document totals) UBL AmountType is decimal and requires currencyID; aggregate definitions document
    line extension, tax, and payable amounts, but the XSD does not encode cross-field arithmetic reconciliation.
  - (UBL code lists) UBL CodeType values are normalized strings with optional listID and related list-identification
    attributes; the base UBL XSD does not enumerate business code values.
  - (UBL unqualified data types - QuantityType) Quantity-typed basic components carry an optional unitCode
    attribute identifying the unit of measure
  - (UBL common library - AllowanceCharge) cac:AllowanceCharge is an aggregate component type with a charge
    indicator, reason codes, and amount elements applied at document or line level
  - (UBL common library - ExternalReference) cac:ExternalReference is an aggregate with optional URI,
    DocumentHash, MimeCode, FileName, and Description elements.
  - (UBL common library - Item) cac:Item is an aggregate component type describing traded items with names,
    identification schemes, and classification code elements
  - (UBL common library - PaymentMeans) cac:PaymentMeans is an aggregate component type carrying payment
    means codes, due dates, and payee financial account elements
  - (UBL common library - attachments) cbc:EmbeddedDocumentBinaryObject restricts UDT BinaryObjectType,
    whose value is base64Binary and whose mimeCode attribute is required in the UBL UDT.
  depth_required: 5
  depth_rationale: 'MUST validate capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Known-good and known-bad coded values per first-wave list; offline determinism verified.
- release_gates:
  - Per-type coverage declaration matches tests; no type claimed without a factory + parse + write proof.
  capability_id: UBL-DOCTYPES-001
  level: MUST
  category: model
  title: Document-type registry and factory
  production_meaning: Each specification document type has a distinct root class plus factory operations
    (create-empty, detect-type, supported-types) so structurally impossible documents cannot be constructed.
  developer_use_case: A developer creates a new empty document of a chosen type and enumerates the types
    the library supports with their coverage state.
  provenance:
  - POL-XBZ-DOC-01
  - POL-XBZ-DOC-02
  - SAL-UBL-00001
  - SAL-UBL-00002
  - SAL-UBL-00105
  - SAL-UBL-00106
  - SAL-UBL-00107
  - SAL-UBL-00108
  - SAL-UBL-00110
  - SAL-UBL-00111
  - SAL-UBL-00115
  - SAL-UBL-00117
  - SAL-UBL-00118
  - SAL-UBL-00119
  - SAL-UBL-00120
  - SAL-UBL-00128
  - SAL-UBL-00129
  - SAL-UBL-00131
  - SAL-UBL-00132
  - SAL-UBL-00133
  - SAL-UBL-50613DF5EFE944E0
  - RF-UBL-00001
  required_behavior:
  - Expose a distinct typed root per supported document type plus create_empty, detect_document_type,
    and supported_document_types operations.
  - Document-type coverage is declared per type (supported/preservation-only/unsupported) - never claimed
    globally.
  - Expose a distinct typed root document class per supported maindoc type together with create_empty(document_type),
    detect_document_type(), and supported_document_types() so integrations enumerate coverage programmatically.
  normative_rules:
  - '(OASIS UBL 2.1 — Order document schema) A UBL Order document is rooted at an <Order> element in the
    UBL-Order-2 namespace, composed of common basic components (cbc: e.g. ID, IssueDate) and common aggregate
    components (cac: e.g. OrderLine)'
  - (OASIS UBL 2.1 — Invoice document schema) A UBL Invoice document is rooted at an <Invoice> element
    in the UBL-Invoice-2 namespace; each invoice line is a cac:InvoiceLine aggregate carrying cbc:ID,
    cbc:InvoicedQuantity, and cbc:LineExtensionAmount (shared aggregate referenced by ubl:line-item)
  - (OASIS UBL 2.1 — CreditNote document schema) A UBL CreditNote document is rooted at a <CreditNote>
    element in the UBL-CreditNote-2 namespace with cac:CreditNoteLine aggregates for its lines
  - (UBL maindoc schemas - ApplicationResponse) A UBL ApplicationResponse document is rooted at an ApplicationResponse
    document root element carrying cac:DocumentResponse aggregates for business-level acknowledgement
  - (UBL maindoc schemas - DespatchAdvice) A UBL DespatchAdvice document is rooted at a DespatchAdvice
    document root element in its own maindoc namespace carrying cac:DespatchLine aggregates
  - (UBL maindoc schemas - Order) A UBL Order document is rooted at an Order document root element in
    its own maindoc namespace with order lines carried as cac:OrderLine aggregate components
  - (UBL document totals) UBL AmountType is decimal and requires currencyID; aggregate definitions document
    line extension, tax, and payable amounts, but the XSD does not encode cross-field arithmetic reconciliation.
  - (UBL naming and design rules - element order) Child elements inside UBL aggregate components must
    appear in the order declared by the schema sequence model for the document to be valid
  - (UBL naming and design rules - namespaces) Every UBL maindoc type declares its own document root namespace
    of the form urn:oasis:names:specification:ubl:schema:xsd:<Type>-2
  - (UBL conformance - schema validation) UBL document schemas are W3C XML Schema definitions and conforming
    documents must be valid against the maindoc schema of their declared type
  - (UBL common library - AllowanceCharge) cac:AllowanceCharge is an aggregate component type with a charge
    indicator, reason codes, and amount elements applied at document or line level
  - (UBL common library - ExternalReference) cac:ExternalReference is an aggregate with optional URI,
    DocumentHash, MimeCode, FileName, and Description elements.
  - (UBL common library - InvoiceLine) cac:InvoiceLine is an aggregate component type carrying cbc:ID,
    cbc:InvoicedQuantity, cbc:LineExtensionAmount, and a cac:Item element
  - (UBL document metadata - customization and profile) cbc:CustomizationID and cbc:ProfileID identify
    the customization profile and business process profile a document instance follows
  - (UBL common library - attachments) cbc:EmbeddedDocumentBinaryObject restricts UDT BinaryObjectType,
    whose value is base64Binary and whose mimeCode attribute is required in the UBL UDT.
  - (UBL document metadata - version identification) cbc:UBLVersionID identifies the UBL specification
    version a document instance declares
  - (UBL extension model) ext:UBLExtensions is the first optional component in UBL document sequences;
    each UBLExtension contains ExtensionContent, which permits one foreign-namespaced apex element with
    lax validation.
  - (UBL 2.3 schema package - maindoc inventory) The pinned UBL 2.3 OASIS Standard package contains exactly
    91 maindoc XSD files, one for each supported UBL document root.
  - (xsd/maindoc/UBL-*-2.3.xsd) Each UBL 2.3 maindoc XSD declares a document-type target namespace and
    qualified XML element syntax for its document element and content model.
  depth_required: 4
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Factory round-trip per supported type; detect_document_type agrees with the parsed root on every official
    sample.
- release_gates:
  - Every documented mutation proven by round-trip tests.
  capability_id: UBL-EDIT-001
  level: MUST
  category: edit
  title: Business component editing
  production_meaning: Parties, lines, references, totals, and attachments can be created, updated, moved,
    and removed with schema order and references kept consistent, including line renumbering with reference
    rewrite.
  developer_use_case: A developer inserts a line, renumbers, and every cross-reference still resolves
    after save.
  provenance:
  - POL-XBZ-EDIT-01
  - POL-XBZ-EDIT-02
  - SAL-UBL-00105
  - SAL-UBL-00123
  - SAL-UBL-00125
  required_behavior:
  - CRUD for core business components with schema-order preservation; edits cannot produce elements the
    schema forbids at that position.
  - Line insertion, removal, movement, and renumbering maintain referential integrity via an explicit
    reference-rewrite map.
  normative_rules:
  - (OASIS UBL 2.1 — CreditNote document schema) A UBL CreditNote document is rooted at a <CreditNote>
    element in the UBL-CreditNote-2 namespace with cac:CreditNoteLine aggregates for its lines
  - (UBL common library - Party) cac:Party is an aggregate component type carrying party identification,
    names, postal addresses, tax schemes, and contacts as child elements
  - (UBL common library - Address) cac:PostalAddress is an aggregate component type composed of street,
    city, postal zone, and country sub-elements
  depth_required: 4
  depth_rationale: 'MUST edit capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Each mutation class save-reload-verifies; renumbering fixture proves reference rewrite.
- release_gates:
  - Extension round-trip proven with large and hostile payload fixtures.
  capability_id: UBL-EXT-001
  level: MUST
  category: preserve
  title: Extension preservation and authoring
  production_meaning: Specification extension points round-trip unknown payloads losslessly and allow
    registered typed extension adapters; unknown extension content is never interpreted as core data.
  developer_use_case: A developer round-trips documents carrying national extensions untouched and reads
    a registered extension through a typed adapter.
  provenance:
  - POL-XBZ-EXT-01
  - SAL-UBL-00002
  - SAL-UBL-00110
  - SAL-UBL-00120
  - SAL-UBL-00122
  - SAL-UBL-00132
  - RF-UBL-00007
  required_behavior:
  - Read and write extension containers with arbitrary namespaces and payloads without loss; expose registered
    typed adapters as opt-in.
  - Treat extension payloads and embedded binary attachments as untrusted data; expose their media types
    and checksums without decoding side effects, and gate any external attachment retrieval behind allowlists,
    byte limits, and timeouts.
  normative_rules:
  - (OASIS UBL 2.1 — Invoice document schema) A UBL Invoice document is rooted at an <Invoice> element
    in the UBL-Invoice-2 namespace; each invoice line is a cac:InvoiceLine aggregate carrying cbc:ID,
    cbc:InvoicedQuantity, and cbc:LineExtensionAmount (shared aggregate referenced by ubl:line-item)
  - (UBL document totals) UBL AmountType is decimal and requires currencyID; aggregate definitions document
    line extension, tax, and payable amounts, but the XSD does not encode cross-field arithmetic reconciliation.
  - (UBL common library - InvoiceLine) cac:InvoiceLine is an aggregate component type carrying cbc:ID,
    cbc:InvoicedQuantity, cbc:LineExtensionAmount, and a cac:Item element
  - (UBL common library - LegalMonetaryTotal) cac:LegalMonetaryTotal is an aggregate component type carrying
    line extension, tax-inclusive, allowance, charge, and payable amount elements
  - (UBL extension model) ext:UBLExtensions is the first optional component in UBL document sequences;
    each UBLExtension contains ExtensionContent, which permits one foreign-namespaced apex element with
    lax validation.
  security_requirements:
  - Extension payload decoding never executes or resolves content implicitly.
  depth_required: 2
  depth_rationale: 'MUST preserve capability: family depth floor 2, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Unknown-namespace extension payloads survive load-save byte-semantically in lossless mode.
- release_gates:
  - All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: UBL-LIFECYCLE-001
  level: MUST
  category: lifecycle
  title: Baseline lifecycle I/O
  production_meaning: Load/save/bytes round-trip, version exposure, strict and tolerant read modes, first-class
    validation, deterministic serialization.
  developer_use_case: A developer integrates the library with only lifecycle APIs and never needs format-internal
    knowledge for I/O plumbing.
  provenance:
  - POL-SLC-LIFECYCLE-01
  - POL-SLC-LIFECYCLE-02
  - POL-SLC-LIFECYCLE-03
  - POL-SLC-LIFECYCLE-04
  - POL-SLC-LIFECYCLE-05
  - POL-SLC-LIFECYCLE-06
  required_behavior:
  - Provide load from filesystem path, readable stream, and in-memory bytes, returning the format's root
    document/model object.
  - Provide save to filesystem path and writable stream, plus serialization to bytes, producing output
    the library's own loader accepts.
  - Expose the detected format version and any declared version separately; never silently rewrite a declared
    version.
  - Support a strict read mode that rejects malformed input with diagnostics and a tolerant read mode
    that recovers where the format permits, with recovery actions reported.
  - Expose validation as a first-class callable operation returning structured diagnostics, not only as
    exceptions raised during parsing.
  - Offer deterministic serialization such that an unchanged loaded document serializes to identical bytes
    across repeated calls in the same mode.
  depth_required: 4
  depth_rationale: Portfolio baseline (lifecycle_io) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - Component model covers every element used by first-wave document types.
  capability_id: UBL-MODEL-001
  level: MUST
  category: model
  title: Typed shared-component model
  production_meaning: Common components (parties, addresses, amounts, quantities, lines, references, periods)
    are typed composites reflecting schema hierarchy, order, and cardinality - not generic XML nodes.
  developer_use_case: A developer reads a line item's quantity and monetary amount as typed values with
    their supplementary attributes intact.
  provenance:
  - POL-XBZ-MODEL-01
  - POL-XBZ-MODEL-02
  - SAL-UBL-00001
  - SAL-UBL-00002
  - SAL-UBL-00105
  - SAL-UBL-00106
  - SAL-UBL-00107
  - SAL-UBL-00108
  - SAL-UBL-00109
  - SAL-UBL-00110
  - SAL-UBL-00111
  - SAL-UBL-00112
  - SAL-UBL-00113
  - SAL-UBL-00114
  - SAL-UBL-00115
  - SAL-UBL-00116
  - SAL-UBL-00117
  - SAL-UBL-00118
  - SAL-UBL-00119
  - SAL-UBL-00120
  - SAL-UBL-00121
  - SAL-UBL-00122
  - SAL-UBL-00123
  - SAL-UBL-00124
  - SAL-UBL-00125
  - SAL-UBL-00126
  - SAL-UBL-00127
  - SAL-UBL-00128
  - SAL-UBL-00129
  - SAL-UBL-00130
  - SAL-UBL-00131
  - SAL-UBL-00132
  - SAL-UBL-50613DF5EFE944E0
  - SAL-UBL-6D5AF510AAF4874B
  - SAL-UBL-87F7B313CE24D408
  required_behavior:
  - Represent shared aggregate components as typed composites and basic components as typed values retaining
    lexical form where round-trip fidelity requires it.
  - Reflect schema element order, cardinality, and optionality in the model so invalid structures are
    diagnosable at edit time.
  normative_rules:
  - '(OASIS UBL 2.1 — Order document schema) A UBL Order document is rooted at an <Order> element in the
    UBL-Order-2 namespace, composed of common basic components (cbc: e.g. ID, IssueDate) and common aggregate
    components (cac: e.g. OrderLine)'
  - (OASIS UBL 2.1 — Invoice document schema) A UBL Invoice document is rooted at an <Invoice> element
    in the UBL-Invoice-2 namespace; each invoice line is a cac:InvoiceLine aggregate carrying cbc:ID,
    cbc:InvoicedQuantity, and cbc:LineExtensionAmount (shared aggregate referenced by ubl:line-item)
  - (OASIS UBL 2.1 — CreditNote document schema) A UBL CreditNote document is rooted at a <CreditNote>
    element in the UBL-CreditNote-2 namespace with cac:CreditNoteLine aggregates for its lines
  - (UBL maindoc schemas - ApplicationResponse) A UBL ApplicationResponse document is rooted at an ApplicationResponse
    document root element carrying cac:DocumentResponse aggregates for business-level acknowledgement
  - (UBL maindoc schemas - DespatchAdvice) A UBL DespatchAdvice document is rooted at a DespatchAdvice
    document root element in its own maindoc namespace carrying cac:DespatchLine aggregates
  - (UBL maindoc schemas - Order) A UBL Order document is rooted at an Order document root element in
    its own maindoc namespace with order lines carried as cac:OrderLine aggregate components
  - (UBL unqualified data types - AmountType) Amount-typed basic components require a currencyID attribute
    identifying the ISO 4217 currency of the value
  - (UBL document totals) UBL AmountType is decimal and requires currencyID; aggregate definitions document
    line extension, tax, and payable amounts, but the XSD does not encode cross-field arithmetic reconciliation.
  - (UBL naming and design rules - element order) Child elements inside UBL aggregate components must
    appear in the order declared by the schema sequence model for the document to be valid
  - (UBL code lists) UBL CodeType values are normalized strings with optional listID and related list-identification
    attributes; the base UBL XSD does not enumerate business code values.
  - (UBL common library - CAC namespace) Common aggregate components live in the CommonAggregateComponents-2
    namespace conventionally prefixed cac and represent typed composite structures
