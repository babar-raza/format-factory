  required_behavior:
  - Use decimal arithmetic for amounts and quantities; preserve currencyID, unitCode, listID, schemeID,
    and related supplementary attributes.
  - Preserve timezone and lexical precision of date/time values; expose explicit rounding policies for
    calculations.
  - Represent monetary amounts and quantities with decimal arithmetic and retain currencyID, unitCode,
    and scheme attributes through edits, with explicit rounding policies for any calculation - binary
    floating point is never acceptable for money.
  normative_rules:
  - '(OASIS UBL 2.1 — Order document schema) A UBL Order document is rooted at an <Order> element in the
    UBL-Order-2 namespace, composed of common basic components (cbc: e.g. ID, IssueDate) and common aggregate
    components (cac: e.g. OrderLine)'
  - (OASIS UBL 2.1 — Invoice document schema) A UBL Invoice document is rooted at an <Invoice> element
    in the UBL-Invoice-2 namespace; each invoice line is a cac:InvoiceLine aggregate carrying cbc:ID,
    cbc:InvoicedQuantity, and cbc:LineExtensionAmount (shared aggregate referenced by ubl:line-item)
  - (UBL unqualified data types - AmountType) Amount-typed basic components require a currencyID attribute
    identifying the ISO 4217 currency of the value
  - (UBL document totals) UBL AmountType is decimal and requires currencyID; aggregate definitions document
    line extension, tax, and payable amounts, but the XSD does not encode cross-field arithmetic reconciliation.
  - (UBL code lists) UBL CodeType values are normalized strings with optional listID and related list-identification
    attributes; the base UBL XSD does not enumerate business code values.
  - (UBL unqualified data types - QuantityType) Quantity-typed basic components carry an optional unitCode
    attribute identifying the unit of measure
  - (UBL common library - AllowanceCharge) cac:AllowanceCharge is an aggregate component type with a charge
    indicator, reason codes, and amount elements applied at document or line level
  - (UBL common library - ExternalReference) cac:ExternalReference is an aggregate with optional URI,
    DocumentHash, MimeCode, FileName, and Description elements.
  - (UBL common library - InvoiceLine) cac:InvoiceLine is an aggregate component type carrying cbc:ID,
    cbc:InvoicedQuantity, cbc:LineExtensionAmount, and a cac:Item element
  - (UBL common library - Item) cac:Item is an aggregate component type describing traded items with names,
    identification schemes, and classification code elements
  - (UBL common library - LegalMonetaryTotal) cac:LegalMonetaryTotal is an aggregate component type carrying
    line extension, tax-inclusive, allowance, charge, and payable amount elements
  - (UBL common library - PaymentMeans) cac:PaymentMeans is an aggregate component type carrying payment
    means codes, due dates, and payee financial account elements
  - (UBL common library - Price) cac:Price is an aggregate component type carrying cbc:PriceAmount and
    quantity-basis elements for unit pricing
  - (UBL common library - TaxTotal) cac:TaxTotal is an aggregate component type carrying cbc:TaxAmount
    and nested cac:TaxSubtotal elements per tax category
  - (UBL common library - attachments) cbc:EmbeddedDocumentBinaryObject restricts UDT BinaryObjectType,
    whose value is base64Binary and whose mimeCode attribute is required in the UBL UDT.
  - (UBL common library - Identifier type) cbc:ID is a basic component element of UDT IdentifierType carrying
    optional schemeID and schemeAgencyID attributes
  depth_required: 4
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Extreme decimal fixtures round-trip losslessly; attribute retention verified per value type.
  - Extreme decimal fixtures (large precision, trailing zeros) round-trip with attributes intact.
- release_gates:
  - Writer output schema-validates for every first-wave type; determinism proven.
  capability_id: UBL-WRITE-001
  level: MUST
  category: write
  title: Schema-order-aware serialization
  production_meaning: Serialization emits schema-valid element order regardless of property-set order,
    with canonical namespace-prefix and formatting policies plus lossless mode.
  developer_use_case: A developer sets properties in any order and the output always validates against
    the schema.
  provenance:
  - POL-XBZ-WRITE-01
  - RF-UBL-00008
  required_behavior:
  - Write elements in schema-valid order independent of mutation order; offer canonical prefix/formatting
    policies and lossless mode preserving significant lexical values.
  - Round-trip every official sample of each supported maindoc type comparing canonicalized XML plus typed
    semantics, and prove schema-valid element order for documents assembled property-by-property in arbitrary
    order.
  depth_required: 4
  depth_rationale: 'MUST write capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Out-of-order property assignment still yields schema-valid output; determinism byte-compare.
  - Official-sample round trips per supported document type with canonical XML comparison.
public_api_contract:
  diagnostic_types:
  - UblDiagnostic
  mutation_operations:
  - UblDocument.create(document_type)
  read_operations:
  - UblDocument.load(path_or_stream_or_bytes)
  - document.detect_document_type()
  - document.find_by_id(id)
  - document.query(qname_or_selector)
  root_types:
  - UblDocument
  - UblDocumentType
  validation_operations:
  - document.calculate_totals(policy)
  - document.reconcile_totals(policy)
preservation_contract:
  lexical_roundtrip:
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  loss_reporting_policy: Report every construct that cannot be preserved before saving, through a loss
    report API, rather than failing silently.
  structural_roundtrip:
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  unknown_construct_policy: Preserve unknown or future-version constructs that can be carried safely;
    never silently drop unrecognized content in lossless mode.
validation_contract:
  diagnostic_schema:
    fields:
    - code
    - severity
    - message
    - source_location
    - object_path
    - originating_rule
    - repair_suggestion
    - auto_repair_eligible
  layers:
  - description: XML well-formedness and namespace conformance.
    layer: syntax
  - description: Schema validation against the specification's document and component schemas.
    layer: schema
  - description: ID uniqueness, cross-references between lines/documents/parties resolve.
    layer: referential
  - description: Coded values validated against official code lists with list/agency/version identifiers.
    layer: codelist
  - description: Profile/customization rulesets plugged in explicitly; never claimed implicitly.
    layer: business_rule
  - description: Entity/DTD hardening, size and nesting limits, external-reference policy.
    layer: security
security_contract:
  attack_surfaces:
  - XML external entities and DTD expansion enabling file disclosure or denial of service.
  - Signature wrapping and namespace spoofing changing semantic identity of signed content.
  - Oversized or deeply nested documents exhausting memory or stack.
  - External attachment URIs triggering unintended network retrieval.
  limits:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  safe_defaults:
  - External entities and DTD processing disabled by default; no network fetch during parse or validate.
  - Attachment and external-reference retrieval gated by explicit allowlists, byte limits, and timeouts.
  - Bounded document size, element count, and nesting depth with configurable limits.
test_contract:
- Test official or authoritative valid samples, invalid samples, synthetic edge cases, malformed inputs,
  and hostile inputs for every claimed capability.
- Prove parse-save-parse semantic equivalence for representative documents of every supported construct.
- Prove deterministic output by serializing the same document twice and byte-comparing.
- Publish a capability manifest stating supported versions, constructs, limitations, and lossless guarantees,
  verified against implementation and tests.
- Reconciliation fixtures with agreeing and disagreeing declared totals across rounding policies.
- Known-good and known-bad coded values per first-wave list; offline determinism verified.
- Factory round-trip per supported type; detect_document_type agrees with the parsed root on every official
  sample.
- Each mutation class save-reload-verifies; renumbering fixture proves reference rewrite.
- Unknown-namespace extension payloads survive load-save byte-semantically in lossless mode.
- Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Typed access for every first-wave component; cardinality violations diagnosed on mutation.
- Same document under default namespace, prefixed, and re-prefixed forms parses to identical models; spoofed-namespace
  fixtures rejected.
- Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- 'Profile ruleset plug-in fixture: verdicts scoped to the profile and absent when not installed.'
- Query result paths verified against fixtures; indexed and linear scans agree.
- Duplicate-ID and broken-reference fixtures produce complete diagnostics.
- Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
  test proving refusal with diagnostics.
- Signed-document round-trip byte-preserves signed subtrees; edit-warning fixture.
- 'Older-version fixtures: migrate-with-report and unsupported-refusal paths.'
- Per-layer positive/negative fixtures; layered report structure asserted machine-readable.
- Extreme decimal fixtures round-trip losslessly; attribute retention verified per value type.
- Extreme decimal fixtures (large precision, trailing zeros) round-trip with attributes intact.
- Out-of-order property assignment still yields schema-valid output; determinism byte-compare.
- Official-sample round trips per supported document type with canonical XML comparison.
release_gates:
- Calculation policies documented; reconciliation never mutates by default (tested).
- Code-list validation produces machine-readable results separated from schema results.
- Per-type coverage declaration matches tests; no type claimed without a factory + parse + write proof.
- Every documented mutation proven by round-trip tests.
- Extension round-trip proven with large and hostile payload fixtures.
- All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Component model covers every element used by first-wave document types.
- All specification document roots recognized by QName with namespace-variation tests.
- All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- No implicit profile-conformance claims (audited in capability manifest).
- Query API covers the identifier kinds used by first-wave document types.
- Referential validation layer has dedicated negative fixtures.
- All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Signature preservation proven; verification/creation explicitly declared separate opt-in scope.
- No silent version relabeling (negative-tested).
- Layered validation has separate machine-readable results per layer.
- No monetary path uses binary floating point (audited).
- Writer output schema-validates for every first-wave type; determinism proven.
- Capability manifest published and independently verified against implementation and tests.
