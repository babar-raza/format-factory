format_identity:
  active_content_model:
    has_active_content: false
    policy: Documents are passive data; signature verification and external reference resolution are opt-in
      operations, never side effects of parsing.
  data_model_type: xml
  description: 'OASIS Universal Business Language: schema-defined XML business-document standard (OASIS
    UBL 2.3 OASIS Standard). Namespaced document types built from shared typed components, exchanged in
    procurement, invoicing, logistics, and related business workflows.'
  primary_use_cases:
  - Create, read, edit, validate, and exchange structured business documents between trading partners
  - Programmatic document assembly from business data with schema-valid output
  - Compliance validation against schemas, code lists, and profile rules before transmission
