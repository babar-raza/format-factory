preservation_contract:
  lexical_roundtrip:
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  loss_reporting_policy: Report every construct that cannot be preserved before saving, through a loss
    report API, rather than failing silently.
  structural_roundtrip:
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  unknown_construct_policy: Preserve unknown or future-version constructs that can be carried safely;
    never silently drop unrecognized content in lossless mode.
validation_contract:
  diagnostic_schema:
    fields:
    - code
    - severity
    - message
    - source_location
    - object_path
    - originating_rule
    - repair_suggestion
    - auto_repair_eligible
  layers:
  - description: ZIP structure, member naming, ordering, compression methods, duplicates, paths, sizes,
      and expansion limits.
    layer: archive
  - description: XML root, declared profile, canvas, tree ordering, attributes, references, and extension
      boundaries.
    layer: document
  - description: Raster member existence, type, dimensions, channel depth, interlace constraints, and
      decode limits.
    layer: raster
  - description: Layer order, offsets, visibility, opacity, isolation, compositing operations, and flattened
      viewing assets.
    layer: render
  - description: Independent application read/write/render agreement for each selected profile.
    layer: interoperability
security_contract:
  attack_surfaces:
  - ZIP traversal, duplicate names, ambiguous Unicode names, oversized declarations, and decompression
    bombs.
  - Hostile XML depth, entity expansion, excessive node counts, and external-resource resolution.
  - Hostile raster dimensions, malformed PNG payloads, and rendering resource exhaustion.
  limits:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  safe_defaults:
  - Reject unsafe or ambiguous archive members before XML or raster decoding.
  - Disable XML entities and external resources; enforce archive, XML, raster, and render budgets.
  - Preserve safe unknown extensions without interpreting or executing them.
test_contract:
- Test official or authoritative valid samples, invalid samples, synthetic edge cases, malformed inputs,
  and hostile inputs for every claimed capability.
- Prove parse-save-parse semantic equivalence for representative documents of every supported construct.
- Prove deterministic output by serializing the same document twice and byte-comparing.
- Publish a capability manifest stating supported versions, constructs, limitations, and lossless guarantees,
  verified against implementation and tests.
- Missing, aliased, hostile-path, malformed-raster, huge-dimension, and replacement round trips.
- Raster-depth, dimension, aspect, interlace, path, XML-reference, and stale-view regeneration matrices.
- Golden pixel vectors, alpha edge cases, unsupported-operation preservation, and adapter differential
  tests.
- Valid and hostile archive matrices cover member naming, compression, duplicates, traversal, truncation,
  and expansion limits.
- Root/canvas/profile boundary and overflow matrices; model construction without I/O.
- Transaction rollback, reference repair, stale-view invalidation, and independent application reopen
  tests.
- Group create/edit/move/remove, root restriction, and unknown-extension preservation tests.
- Declared/inferred isolation pixel vectors and pre-profile rejection/preservation cases.
- Full attribute boundary matrix and add/edit/move/remove semantic round trips.
- Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Recognized-mask edit tests and unknown-mask byte-preservation tests from independent producers.
- One negative fixture independently varies each sentinel invariant.
- Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Golden images, subtree rendering, clipping, resource exhaustion, and adapter-version differential tests.
- Absent/default/pairing/minimum/profile-boundary round trips.
- Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
  test proving refusal with diagnostics.
- Deep nesting, mixed-child ordering, root-attribute rejection, and reorder round trips.
- Large sparse archives, lazy-read instrumentation, flat-memory checks, cancellation, and every resource
  limit.
- One discriminating negative per normative and security obligation plus multi-error aggregation.
- Three-run byte determinism, installed-wheel writes, independent application reopen, and unknown-extension
  preservation.
release_gates:
- All tree-to-asset references and raster limits are proven.
- Generated viewing assets are accepted and visually checked by independent consumers.
- All claimed operations match pinned rendering references within declared tolerances.
- Every archive rule has positive and negative executed evidence.
- All root attributes and profile-dependent canvas fields are modeled and validated.
- Editing workflows preserve all unmodified supported and unknown data.
- Group edits remain accepted and visually equivalent in independent applications.
- Isolation semantics agree with independent application renders for every applicable profile.
- Every layer attribute and edit operation has behavior and rejection proof.
- All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Mask support is explicitly classified as extension behavior and never inflates baseline conformance.
- Sentinel validation fails closed before document parsing.
- All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Rendering is reproducible and agrees with at least two independent producers/consumers within declared
  tolerances.
- Resolution behavior is exact for each declared profile.
- All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Tree order and nesting survive semantic round trips and independent rendering.
- Large-file tests prove bounded behavior rather than only successful completion.
- Every rejection obligation has executed negative evidence bound to exact inputs.
- Writer output passes strict self-validation and independent application interoperability.
- Capability manifest published and independently verified against implementation and tests.
