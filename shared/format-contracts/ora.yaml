  depth_required: 5
  depth_rationale: 'MUST model capability: family depth floor 5, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Root/canvas/profile boundary and overflow matrices; model construction without I/O.
- release_gates:
  - Editing workflows preserve all unmodified supported and unknown data.
  capability_id: ORA-EDIT-001
  level: MUST
  category: edit
  title: Transactional document editing
  production_meaning: Tree, metadata, and raster edits preserve referential integrity and expose loss
