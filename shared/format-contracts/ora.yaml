- release_gates:
  - All root attributes and profile-dependent canvas fields are modeled and validated.
  capability_id: ORA-DOCUMENT-001
  level: MUST
  category: model
  title: Image document and canvas model
  production_meaning: The root image, declared profile, canvas dimensions, resolution, and root layer
    tree are typed separately from I/O.
  developer_use_case: A developer creates and inspects an image document and canvas without manipulating
