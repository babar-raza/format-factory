scope_policy:
  minimum_viable_support: Securely decode and encode conforming archives, preserve the editable layer
    tree, validate required assets, and produce an independently renderable flattened view.
  production_complete_target: Complete document/canvas, layer tree, raster asset, viewing asset, compositing,
    preservation, security, deterministic-write, and interoperability behavior for every selected stable
    profile.
capabilities:
- release_gates:
  - All tree-to-asset references and raster limits are proven.
  capability_id: ORA-ASSET-001
  level: MUST
  category: model
  title: Referenced raster asset model
  production_meaning: Layer and extension assets are content-addressed, type-checked, dimension-bounded,
    and referentially validated.
  developer_use_case: A developer replaces layer pixels or streams an asset without losing its relationship
    to the layer tree.
  provenance:
  - POL-LRA-ASSET-01
  - SAL-ORA-00003
  - SAL-ORA-00004
  - SAL-ORA-00006
  - SAL-ORA-00007
  - SAL-ORA-00008
  - SAL-ORA-00009
  - SAL-ORA-00016
  - SAL-ORA-00017
  - SAL-ORA-00018
  - SAL-ORA-00019
  - SAL-ORA-00020
  required_behavior:
  - Resolve archive-root-relative asset references safely; expose raster metadata before decode; validate
    existence, media type, dimensions, channel depth, and declared resource budgets.
  normative_rules:
  - (File Layout — Required Files — data) Layer data files are conventionally stored below data/ and are
    referenced from stack.xml using complete paths relative to the archive root.
  - (File Layout — Storage) Member names in an OpenRaster ZIP archive are case-sensitive and must be UTF-8
    encoded with the ZIP UTF-8 flag used for non-ASCII names.
  - (Draft OpenRaster Specification — Baseline Intent) OpenRaster 0.0.5 defines a baseline intent for
    exchange between applications and permits custom extensions that remain safe for baseline consumers.
  - (File Layout — Storage) OpenRaster ZIP members may use only the DEFLATED and STORED compression methods.
  - (File Layout — Storage) OpenRaster archives use the .ora extension and store their data inside a ZIP
    file wrapper.
  - (Layer Stack — Baseline documents) OpenRaster defines full baseline support for reading and editing
    and viewing baseline support for visualization where editing may damage the result.
  - (File Layout — Required Files — mimetype) The first archive member must be named mimetype, must be
    STORED without compression, and must contain exactly image/openraster without whitespace or a trailing
    newline.
  - (File Layout — Required Files — stack.xml) The required stack.xml archive member is a UTF-8 encoded
    XML document conforming to the OpenRaster Layer Stack format.
  - (Layer Stack — image element) The root image element requires positive integer w and h attributes
    and a version string identifying the OpenRaster specification profile.
  - (File Layout — Thumbnails/thumbnail.png) Thumbnails/thumbnail.png is required, must be a non-interlaced
    PNG with 8 bits per channel, and must not exceed 256 by 256 pixels.
  - (File Layout — Optional Files — mergedimage.png) mergedimage.png is mandatory since profile 0.0.2
    and contains the final rendered image as a PNG with 8 or 16 bits per channel.
  depth_required: 5
  depth_rationale: 'MUST model capability: family depth floor 5, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Missing, aliased, hostile-path, malformed-raster, huge-dimension, and replacement round trips.
- release_gates:
  - Generated viewing assets are accepted and visually checked by independent consumers.
  capability_id: ORA-BASELINEASSET-001
  level: MUST
  category: write
  title: Thumbnail and flattened viewing assets
  production_meaning: Required preview and flattened assets follow their exact path, raster, dimension,
    and reference constraints.
  developer_use_case: A developer refreshes thumbnails and flattened views for file browsers and non-editing
    consumers.
  provenance:
  - POL-LRA-BASELINE-ASSET-01
  - SAL-ORA-00009
  - SAL-ORA-00019
  - SAL-ORA-00020
  required_behavior:
  - Read, validate, generate, and replace required thumbnail and flattened-view assets without confusing
    them with editable layer sources.
  normative_rules:
  - (Layer Stack — Baseline documents) OpenRaster defines full baseline support for reading and editing
    and viewing baseline support for visualization where editing may damage the result.
  - (File Layout — Thumbnails/thumbnail.png) Thumbnails/thumbnail.png is required, must be a non-interlaced
    PNG with 8 bits per channel, and must not exceed 256 by 256 pixels.
  - (File Layout — Optional Files — mergedimage.png) mergedimage.png is mandatory since profile 0.0.2
    and contains the final rendered image as a PNG with 8 or 16 bits per channel.
  depth_required: 5
  depth_rationale: 'MUST write capability: family depth floor 5, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Raster-depth, dimension, aspect, interlace, path, XML-reference, and stale-view regeneration matrices.
- release_gates:
  - All claimed operations match pinned rendering references within declared tolerances.
  capability_id: ORA-COMPOSITE-001
  level: MUST
  category: advanced
  title: Compositing operation semantics
  production_meaning: Every selected-profile blend and Porter-Duff operation is modeled, validated, and
    rendered with documented color/alpha semantics.
  developer_use_case: A developer renders or changes blend modes and receives predictable pixel results.
  provenance:
  - POL-LRA-COMPOSITE-01
  - SAL-ORA-00011
  - SAL-ORA-00015
  required_behavior:
  - Expose the selected profile's complete compositing-operation inventory, default operation, validation,
    and pixel semantics through a replaceable rendering adapter.
  normative_rules:
  - (Layer Stack — Compositing the image) Since profile 0.0.4, a non-root stack is isolated when isolation
    is isolate, opacity is below one, or composite-op differs from svg:src-over.
  - (Layer Stack — Common attributes — composite-op) The composite-op attribute defaults to svg:src-over
    and selects a documented blend function combined with a Porter-Duff compositing operator.
  depth_required: 5
  depth_rationale: 'MUST advanced capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Golden pixel vectors, alpha edge cases, unsupported-operation preservation, and adapter differential
    tests.
