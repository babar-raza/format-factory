format_identity:
  active_content_model:
    has_active_content: false
    policy: Archive members and XML are untrusted passive data; parsing and rendering never execute embedded
      content or resolve network resources.
  data_model_type: layered_raster_archive
  description: 'OpenRaster Image: editable layered raster archive (freedesktop.org (community) OpenRaster
    0.0.5 commit f050b99fa8af44cb4cc3c9d842d25097458765f6). An ordered layer tree and raster assets are
    preserved, validated, rendered, and written safely.'
  primary_use_cases:
  - Read, inspect, edit, render, validate, and write layered raster documents.
  - Exchange editable and flattened views between independent graphics applications.
