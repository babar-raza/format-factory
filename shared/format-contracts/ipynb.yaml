format_identity:
  active_content_model:
    has_active_content: true
    policy: Documents contain executable code and active outputs (HTML/JS/SVG). Parsing, validating, diffing,
      and saving NEVER execute or render content; execution lives in a separate opt-in adapter behind
      an isolation boundary; sanitization is explicit and mode-controlled.
  data_model_type: executable_document
  description: 'Jupyter Notebook: JSON executable-document format (Jupyter Project nbformat v4.5). Ordered
    cells with sources, rich MIME outputs, attachments, and metadata; documents can carry executable code
    and active content that must never run implicitly.'
  primary_use_cases:
  - Programmatic creation, editing, and cleaning of notebooks in CI and publishing pipelines
  - Structure-aware diff/merge for version control of computational documents
  - Trust, sanitization, and validation of untrusted notebooks before rendering or execution
