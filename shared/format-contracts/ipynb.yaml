scope_policy:
  minimum_viable_support: Lossless parse/write of conformant documents, typed cell/output model, schema
    validation with positions, and output/metadata cleanup operations.
  production_complete_target: Read, create, edit, validate, clean, trust-manage, sanitize, diff, and write
    every construct of the target schema version losslessly, with execution exclusively in an opt-in isolated
    adapter.
capabilities:
- release_gates:
  - Attachment integrity part of the validation layer.
  capability_id: IPYNB-ATTACH-001
  level: MUST
  category: model
  title: Cell attachments
  production_meaning: Attachments read/add/remove/rename with reference validation; orphaned attachments
    and missing targets are detectable.
  developer_use_case: A developer embeds an image attachment and validation confirms its reference resolves.
  provenance:
  - POL-EXD-ATTACH-01
  - SAL-IPYNB-00005
  - SAL-IPYNB-00009
  required_behavior:
  - Manage attachments with MIME-bundle validation and reference checks; detect orphans and missing targets.
  normative_rules:
  - (nbformat - attachment references) Markdown content can reference a cell attachment with an attachment
    URI whose filename corresponds to a key in that cell's attachments mapping
  - (nbformat - attachments) Markdown and raw cells may carry an attachments object mapping filenames
    to MIME bundles referenced from cell content
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Orphan and missing-target fixtures produce diagnostics.
- release_gates:
  - Cleanup is deterministic and idempotent (second run no-op).
  capability_id: IPYNB-CLEAN-001
  level: MUST
  category: transform
  title: Output and execution-state cleanup
  production_meaning: Clearing outputs/execution counts and stripping transient metadata are configurable,
    dry-runnable operations - the CI staple - never implicit.
  developer_use_case: A pre-commit hook clears outputs with a dry-run report before mutating.
  provenance:
  - POL-EXD-CLEAN-01
  - RF-NB-00002
  required_behavior:
  - Clear outputs (all/by type/by cell), reset execution counts consistently, and strip transient metadata
    via configurable rules with dry-run reporting.
  - Output clearing, execution-count reset, and transient-metadata stripping run as configurable, dry-runnable,
    idempotent operations - the pre-commit staple for notebook version control.
  depth_required: 6
  depth_rationale: 'MUST transform capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Dry-run report matches actual mutation; selective clearing fixtures.
- release_gates:
  - Diff stability under cell moves proven.
  capability_id: IPYNB-DIFF-001
  level: MUST
  category: query
  title: Structure-aware diff
  production_meaning: Diffs compare cells by identity with move detection, distinguishing source/metadata/outputs/counts,
    with ignore policies - the version-control staple.
  developer_use_case: A review tool shows a moved, edited cell as move+edit instead of delete+add noise.
  provenance:
  - POL-EXD-DIFF-01
  - RF-NB-00003
  required_behavior:
  - Diff by stable cell identity with move detection; distinguish source, metadata, attachments, execution
    counts, and outputs; support ignore policies and machine-applicable patches with preconditions.
  - Diff notebooks by stable cell identity with move detection and ignore policies for outputs, execution
    counts, and transient metadata, producing machine-applicable patches with preconditions.
  depth_required: 6
  depth_rationale: 'MUST query capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Move-detection fixtures; ignore-policy matrix; patch precondition failures.
- release_gates:
  - Editing preserves schema validity (validated post-edit).
  capability_id: IPYNB-EDIT-001
  level: MUST
  category: edit
  title: Cell collection editing
  production_meaning: Insert, move, copy, remove, and replace cells with search by ID/type/tag/content;
    bulk operations report their changes.
  developer_use_case: A publishing pipeline removes setup cells by tag and appends a colophon cell with
    a change report.
  provenance:
  - POL-EXD-EDIT-01
  - SAL-IPYNB-00002
  - SAL-IPYNB-00006
  - SAL-IPYNB-00017
  required_behavior:
  - Provide cell CRUD plus search by ID, type, tag, metadata, and source text; bulk operations return
    change reports.
  normative_rules:
  - (nbformat 4.5 — cell types) Each cell object has required keys cell_type ('code'|'markdown'|'raw'),
    metadata (object), and source (string or list of strings); code cells additionally require execution_count
    and outputs
  - (nbformat - cell metadata) Cell metadata may carry tags as a unique list of comma-free strings and
    arbitrary additional JSON properties; custom metadata should use a sufficiently unique namespace
  - (nbformat - forward compatibility) Backward-compatible minor-version changes may introduce new dictionary
    fields, cell types, and output types; official validation relaxes additionalProperties and permits
    unrecognized cell and output types for future minors
  depth_required: 4
  depth_rationale: 'MUST edit capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Each mutation class save-reload-verifies with IDs stable.
- release_gates:
  - Execution is physically and logically separated from parsing (dependency audit).
  capability_id: IPYNB-EXEC-001
  level: SHOULD
  category: advanced
  title: Optional isolated execution adapter
  production_meaning: Execution lives in a separate opt-in package/service with kernel selection, timeouts,
    and isolation; core operations are physically incapable of executing content.
  developer_use_case: A CI job executes notebooks in a container with per-cell timeouts and consumes a
    structured execution report.
  provenance:
  - POL-EXD-EXEC-01
  - SAL-IPYNB-00003
  - SAL-IPYNB-00010
  - SAL-IPYNB-00013
  - SAL-IPYNB-00018
  required_behavior:
  - Keep execution in an opt-in adapter with kernel selection, timeouts, error policy, and isolation boundary;
    return a structured execution report; never execute during load/validate/diff/save.
  normative_rules:
  - (nbformat 4.5 — cell outputs) Code-cell outputs are typed objects with output_type in {execute_result,
    display_data, stream, error}; execute_result/display_data carry a data mime-bundle, stream carries
    name+text, error carries ename/evalue/traceback
  - (nbformat - notebook metadata) Notebook metadata may carry kernelspec and language_info objects describing
    the execution kernel and language
  - (nbformat - output types) Output objects declare output_type stream display_data execute_result or
    error each with its own required fields
  - (nbformat - MIME bundles) display_data and execute_result outputs carry data objects mapping MIME
    types to content and metadata objects with per-MIME rendering hints
  depth_required: 6
  depth_rationale: 'SHOULD advanced capability: family depth floor 6, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Isolated-environment execution tests covering timeout, kernel failure, and partial output; core-path
    no-execution proof.
- release_gates:
  - At least one exporter adapter proven or the domain explicitly deferred by scope.
  capability_id: IPYNB-EXPORT-001
  level: SHOULD
  category: export
  title: Exporter integration
  production_meaning: Adapter interfaces export documents to publishing targets with exporter-specific
    resources kept outside the core parser, returning main output plus ancillary resources.
  developer_use_case: A publishing pipeline exports notebooks to a target representation and collects
    ancillary assets programmatically.
  provenance:
  - POL-EXD-EXPORT-01
  required_behavior:
  - Provide exporter adapter interfaces returning main output plus ancillary resources; keep exporter-specific
    preprocessors and resources outside the core parser.
  depth_required: 2
  depth_rationale: 'SHOULD export capability: family depth floor 2, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Exporter adapter contract test with ancillary-resource collection.
- release_gates:
  - ID behavior matches the target schema minor exactly.
  capability_id: IPYNB-ID-001
  level: MUST
  category: model
  title: Cell identity management
  production_meaning: Cell IDs validate for uniqueness and syntax where the schema version requires them;
    ID generation for older documents is an explicit upgrade operation with a rewrite map.
  developer_use_case: A developer upgrades an old notebook and receives stable new IDs plus the mapping.
  provenance:
  - POL-EXD-ID-01
  - SAL-IPYNB-00006
  - SAL-IPYNB-00011
  - SAL-IPYNB-00012
  - SAL-IPYNB-00014
  - SAL-IPYNB-00016
  - SAL-IPYNB-00017
  required_behavior:
  - Validate required cell IDs (uniqueness, syntax, length); generate IDs only via explicit upgrade with
    a rewrite map for references.
  normative_rules:
  - (nbformat - cell metadata) Cell metadata may carry tags as a unique list of comma-free strings and
    arbitrary additional JSON properties; custom metadata should use a sufficiently unique namespace
  - (nbformat - output security considerations) Notebook MIME bundles can carry HTML, SVG, and JavaScript
    payloads
  - (nbformat - validation) The official nbformat validator selects a JSON schema using the document's
    nbformat and nbformat_minor pair and relaxes the current schema for future minor versions
  - (nbformat 4.5 - cell ids) Since schema minor version 4.5 every cell must carry an id field unique
    within the notebook conforming to the permitted character set and length rules
  - (nbformat - versioning rules) The nbformat version pair identifies format evolution; future minor
    versions are treated as backward-compatible, with unknown cell and output types allowed and preserved
    by official tooling
  - (nbformat - forward compatibility) Backward-compatible minor-version changes may introduce new dictionary
    fields, cell types, and output types; official validation relaxes additionalProperties and permits
    unrecognized cell and output types for future minors
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Duplicate/invalid ID negatives; upgrade fixture verifies mapping.
- release_gates:
  - All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: IPYNB-LIFECYCLE-001
  level: MUST
  category: lifecycle
  title: Baseline lifecycle I/O
  production_meaning: Load/save/bytes round-trip, version exposure, strict and tolerant read modes, first-class
    validation, deterministic serialization.
  developer_use_case: A developer integrates the library with only lifecycle APIs and never needs format-internal
    knowledge for I/O plumbing.
  provenance:
  - POL-SLC-LIFECYCLE-01
  - POL-SLC-LIFECYCLE-02
  - POL-SLC-LIFECYCLE-03
  - POL-SLC-LIFECYCLE-04
  - POL-SLC-LIFECYCLE-05
  - POL-SLC-LIFECYCLE-06
  required_behavior:
  - Provide load from filesystem path, readable stream, and in-memory bytes, returning the format's root
    document/model object.
  - Provide save to filesystem path and writable stream, plus serialization to bytes, producing output
    the library's own loader accepts.
  - Expose the detected format version and any declared version separately; never silently rewrite a declared
    version.
  - Support a strict read mode that rejects malformed input with diagnostics and a tolerant read mode
    that recovers where the format permits, with recovery actions reported.
  - Expose validation as a first-class callable operation returning structured diagnostics, not only as
    exceptions raised during parsing.
  - Offer deterministic serialization such that an unchanged loaded document serializes to identical bytes
    across repeated calls in the same mode.
  depth_required: 4
  depth_rationale: Portfolio baseline (lifecycle_io) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - Merge conflicts always surfaced explicitly (negative-tested).
  capability_id: IPYNB-MERGE-001
  level: SHOULD
  category: transform
  title: Structure-aware three-way merge
  production_meaning: Three-way merges operate on stable cell identity and structure, detecting move/edit,
    delete/edit, output, and metadata conflicts, with conflicts reported explicitly - never hidden inside
    executable source.
  developer_use_case: A version-control driver merges divergent notebook branches and receives an explicit
    conflict report.
  provenance:
  - POL-EXD-MERGE-01
  required_behavior:
  - Merge by stable cell identity and structure; detect move/edit, delete/edit, output, and metadata conflicts;
    produce an explicit conflict report and never hide conflicts inside executable source.
  depth_required: 4
  depth_rationale: 'SHOULD transform capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Conflict-matrix fixtures (move/edit, delete/edit, output, metadata).
- release_gates:
  - Zero unknown-metadata loss proven.
  capability_id: IPYNB-META-001
  level: MUST
  category: preserve
  title: Metadata preservation with typed adapters
  production_meaning: Arbitrary notebook/cell/output metadata is preserved; common namespaces (kernelspec,
    language info, tags, slideshow, execution) get typed adapters; normalization never deletes unknown
    metadata.
  developer_use_case: A developer reads the kernel spec through a typed adapter while a vendor's custom
    metadata rides along untouched.
  provenance:
  - POL-EXD-META-01
  - SAL-IPYNB-00001
  - SAL-IPYNB-00002
  - SAL-IPYNB-00004
  - SAL-IPYNB-00006
  - SAL-IPYNB-00010
  - SAL-IPYNB-00018
  required_behavior:
  - Preserve arbitrary metadata at all levels; provide typed adapters for common namespaces; never delete
    unknown metadata during normalization.
  normative_rules:
  - (nbformat 4.5 — top-level structure) A Jupyter notebook document is a single JSON object with required
    top-level keys nbformat (int), nbformat_minor (int), metadata (object), and cells (list of cell objects)
  - (nbformat 4.5 — cell types) Each cell object has required keys cell_type ('code'|'markdown'|'raw'),
    metadata (object), and source (string or list of strings); code cells additionally require execution_count
    and outputs
  - (nbformat - top-level structure) A notebook document is a single JSON object whose top level carries
    nbformat and nbformat_minor integers plus metadata and a cells array
  - (nbformat - cell metadata) Cell metadata may carry tags as a unique list of comma-free strings and
    arbitrary additional JSON properties; custom metadata should use a sufficiently unique namespace
  - (nbformat - notebook metadata) Notebook metadata may carry kernelspec and language_info objects describing
    the execution kernel and language
  - (nbformat - MIME bundles) display_data and execute_result outputs carry data objects mapping MIME
    types to content and metadata objects with per-MIME rendering hints
  depth_required: 2
  depth_rationale: 'MUST preserve capability: family depth floor 2, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Unknown-metadata round trip; typed adapter reads on real fixtures.
- release_gates:
  - Model covers every schema cell construct.
  capability_id: IPYNB-MODEL-001
  level: MUST
  category: model
  title: Typed cell and document model
  production_meaning: Markdown, code, and raw cells are typed with source, metadata, attachments, execution
    count, and outputs; future cell types are preserved even when not editable.
  developer_use_case: A developer filters code cells by tag and inspects outputs without dictionary spelunking.
  provenance:
  - POL-EXD-MODEL-01
  - SAL-IPYNB-00002
  - SAL-IPYNB-00003
  - SAL-IPYNB-00005
  - SAL-IPYNB-00007
  - SAL-IPYNB-00008
  - SAL-IPYNB-00009
  - SAL-IPYNB-00015
  - RF-NB-00001
  required_behavior:
  - Model every specified cell type with typed accessors; preserve future/unknown cell types as preservation-only
    nodes.
  - Expose typed Notebook/MarkdownCell/CodeCell/RawCell/NotebookOutput/MimeBundle objects with search
    by ID, type, tag, and source text, so pipelines manipulate notebooks without raw dictionary access.
  normative_rules:
  - (nbformat 4.5 — cell types) Each cell object has required keys cell_type ('code'|'markdown'|'raw'),
    metadata (object), and source (string or list of strings); code cells additionally require execution_count
    and outputs
  - (nbformat 4.5 — cell outputs) Code-cell outputs are typed objects with output_type in {execute_result,
    display_data, stream, error}; execute_result/display_data carry a data mime-bundle, stream carries
    name+text, error carries ename/evalue/traceback
  - (nbformat - attachment references) Markdown content can reference a cell attachment with an attachment
    URI whose filename corresponds to a key in that cell's attachments mapping
  - (nbformat - multiline strings) Cell source content is either a single string or a list of strings
    that concatenate to the logical source text
  - (nbformat - code cell) Code cells carry an execution_count field that is an integer or null and an
    outputs array of output objects
  - (nbformat - attachments) Markdown and raw cells may carry an attachments object mapping filenames
    to MIME bundles referenced from cell content
  - (nbformat - cell types) The cells array holds cell objects in document order and each cell declares
    a cell_type of markdown code or raw
  depth_required: 4
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Typed access per cell type; unknown-cell-type preservation fixture.
- release_gates:
  - No output construct is dropped or reordered on round trip.
  capability_id: IPYNB-OUTPUT-001
  level: MUST
  category: model
  title: Complete rich-output support
  production_meaning: All output types and arbitrary MIME bundles (text, HTML, images, JSON, vendor types)
    are preserved with metadata and counts; active content is data, never rendered.
  developer_use_case: A developer extracts image outputs and strips vendor bundles without corrupting
    remaining outputs.
  provenance:
  - POL-EXD-OUTPUT-01
  - SAL-IPYNB-00002
  - SAL-IPYNB-00003
  - SAL-IPYNB-00008
  - SAL-IPYNB-00009
  - SAL-IPYNB-00011
  - SAL-IPYNB-00013
  - SAL-IPYNB-00016
  - SAL-IPYNB-00017
  - SAL-IPYNB-00018
  - SAL-IPYNB-00019
  - RF-NB-00005
  required_behavior:
  - Support every specified output type and arbitrary MIME bundles, preserving execution counts, tracebacks,
    metadata, and unknown bundle entries.
  - Test the full MIME-bundle matrix including vendor MIME types, binary payloads, large base64 attachments,
    and malformed bundles, proving no output entry is lost or reordered.
  normative_rules:
  - (nbformat 4.5 — cell types) Each cell object has required keys cell_type ('code'|'markdown'|'raw'),
    metadata (object), and source (string or list of strings); code cells additionally require execution_count
