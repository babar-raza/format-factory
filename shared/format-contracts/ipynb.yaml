    a cell_type of markdown code or raw
  - (nbformat - versioning rules) The nbformat version pair identifies format evolution; future minor
    versions are treated as backward-compatible, with unknown cell and output types allowed and preserved
    by official tooling
  - (nbformat - forward compatibility) Backward-compatible minor-version changes may introduce new dictionary
    fields, cell types, and output types; official validation relaxes additionalProperties and permits
    unrecognized cell and output types for future minors
  - (nbformat - MIME bundles) display_data and execute_result outputs carry data objects mapping MIME
    types to content and metadata objects with per-MIME rendering hints
  - (nbformat - error output) error outputs carry ename evalue and a traceback list of strings
  depth_required: 2
  depth_rationale: 'MUST parse capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Fixtures for string vs list-of-strings sources, unknown fields, and numeric edge values round-trip.
- release_gates:
  - All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: IPYNB-PRESERVE-001
  level: MUST
  category: preserve
  title: Baseline preservation duties
  production_meaning: Unknown constructs, absent-vs-default distinctions, and loss reporting are handled
    so round trips never silently drop data.
  developer_use_case: A developer round-trips files containing constructs the library does not model and
    loses nothing silently.
  provenance:
  - POL-SLC-PRESERVE-01
  - POL-SLC-PRESERVE-02
  - POL-SLC-PRESERVE-03
  - POL-SLC-PRESERVE-04
  required_behavior:
  - Preserve unknown or future-version constructs that can be carried safely; never silently drop unrecognized
    content in lossless mode.
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  - Report every construct that cannot be preserved before saving, through a loss report API, rather than
    failing silently.
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  depth_required: 4
  depth_rationale: Portfolio baseline (preservation) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - Sanitization catalog documented with per-mode tests.
  capability_id: IPYNB-SANITIZE-001
  level: MUST
  category: security
  title: Active-content sanitization
  production_meaning: HTML/SVG/JavaScript/external-link sanitizers are configurable with remove/quarantine/mark-untrusted
    modes; lossless mode never sanitizes silently.
  developer_use_case: A viewer quarantines active outputs of an untrusted notebook and renders the rest.
  provenance:
  - POL-EXD-SANITIZE-01
  - SAL-IPYNB-00011
  required_behavior:
  - Provide configurable sanitizers for active content with remove, quarantine, and preserve-but-mark
    modes; never sanitize silently in lossless mode.
  normative_rules:
  - (nbformat - output security considerations) Notebook MIME bundles can carry HTML, SVG, and JavaScript
    payloads
  depth_required: 2
  depth_rationale: 'MUST security capability: family depth floor 2, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Hostile active-content fixtures per mode; lossless mode leaves content intact and reported.
- release_gates:
  - All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: IPYNB-SEC-001
  level: MUST
  category: security
  title: Baseline security posture
  production_meaning: Input limits, no implicit external effects, traversal protection, untrusted-payload
    discipline, and complexity-attack guards are enforced with diagnostics.
  developer_use_case: A developer processes untrusted input with safe defaults and only opts into external
    effects explicitly.
  provenance:
  - POL-SLC-SEC-01
  - POL-SLC-SEC-02
  - POL-SLC-SEC-03
  - POL-SLC-SEC-04
  - POL-SLC-SEC-05
  required_behavior:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  depth_required: 5
  depth_rationale: Portfolio baseline (security_limits) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
    test proving refusal with diagnostics.
- release_gates:
  - Trust behavior proven against modification scenarios.
  capability_id: IPYNB-TRUST-001
  level: MUST
  category: security
  title: Trust and signature integration
  production_meaning: Trust signatures compute/store/verify through a pluggable notary; modified documents
    are never auto-trusted; cryptographic trust stays separate from schema validity.
  developer_use_case: A platform verifies notebook trust before enabling rich rendering and re-signs only
    after review.
  provenance:
  - POL-EXD-TRUST-01
  - RF-NB-00004
  required_behavior:
  - Integrate a pluggable trust notary (compute/store/verify/revoke); never mark modified content trusted
    automatically; keep trust separate from validity.
  - Integrate a pluggable notebook-notary trust backend where modified notebooks are never auto-trusted
    and cryptographic trust stays separate from schema validity.
  depth_required: 5
  depth_rationale: 'MUST security capability: family depth floor 2, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Edit-invalidates-trust fixture; notary plug-in contract test.
- release_gates:
  - No silent version relabeling; conversion ledger complete (tested).
  capability_id: IPYNB-UPGRADE-001
  level: MUST
  category: transform
  title: Version conversion framework
  production_meaning: Older document versions upgrade through explicit conversion paths with a conversion
    ledger; downgrades report unsupported constructs and expected loss first; higher-minor documents keep
    unknown additions.
  developer_use_case: A developer batch-upgrades legacy documents and audits every synthesized or dropped
    construct from the ledger.
  provenance:
  - POL-EXD-UPGRADE-01
  - SAL-IPYNB-00001
  - SAL-IPYNB-00004
  - SAL-IPYNB-00012
  - SAL-IPYNB-00014
  - SAL-IPYNB-00016
  - SAL-IPYNB-00017
  required_behavior:
  - Upgrade older versions through explicit conversion paths producing a conversion ledger; downgrade
    only after reporting unsupported constructs and expected loss; preserve unknown future additions when
    reading higher minors.
  normative_rules:
  - (nbformat 4.5 — top-level structure) A Jupyter notebook document is a single JSON object with required
    top-level keys nbformat (int), nbformat_minor (int), metadata (object), and cells (list of cell objects)
  - (nbformat - top-level structure) A notebook document is a single JSON object whose top level carries
    nbformat and nbformat_minor integers plus metadata and a cells array
  - (nbformat - validation) The official nbformat validator selects a JSON schema using the document's
    nbformat and nbformat_minor pair and relaxes the current schema for future minor versions
  - (nbformat 4.5 - cell ids) Since schema minor version 4.5 every cell must carry an id field unique
    within the notebook conforming to the permitted character set and length rules
  - (nbformat - versioning rules) The nbformat version pair identifies format evolution; future minor
    versions are treated as backward-compatible, with unknown cell and output types allowed and preserved
    by official tooling
  - (nbformat - forward compatibility) Backward-compatible minor-version changes may introduce new dictionary
    fields, cell types, and output types; official validation relaxes additionalProperties and permits
    unrecognized cell and output types for future minors
  depth_required: 4
  depth_rationale: 'MUST transform capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Fixtures at each supported older version upgrade with ledger assertions; downgrade-loss reporting
    fixture.
- release_gates:
  - Target-minor schema compliance proven on the official corpus.
  capability_id: IPYNB-VALIDATE-001
  level: MUST
  category: validate
  title: Schema and semantic validation
  production_meaning: Declared-version and current-minor validation modes check structure, IDs, MIME shapes,
    attachments, and counts, reporting forward-compatible unknowns separately from errors.
  developer_use_case: A gatekeeper validates untrusted notebooks and distinguishes hard errors from forward-compatible
    fields.
  provenance:
  - POL-EXD-VALIDATE-01
  - SAL-IPYNB-00012
  - SAL-IPYNB-00014
  - SAL-IPYNB-00017
  required_behavior:
  - Validate against the schema matching declared version and optionally current minor; report unknown
    forward-compatible fields separately from errors.
  normative_rules:
  - (nbformat - validation) The official nbformat validator selects a JSON schema using the document's
    nbformat and nbformat_minor pair and relaxes the current schema for future minor versions
  - (nbformat 4.5 - cell ids) Since schema minor version 4.5 every cell must carry an id field unique
    within the notebook conforming to the permitted character set and length rules
  - (nbformat - forward compatibility) Backward-compatible minor-version changes may introduce new dictionary
    fields, cell types, and output types; official validation relaxes additionalProperties and permits
    unrecognized cell and output types for future minors
  depth_required: 5
  depth_rationale: 'MUST validate capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Both validation modes on fixtures per schema construct; unknown-field separation asserted.
- release_gates:
  - Writer round-trips the official corpus with zero semantic loss.
  capability_id: IPYNB-WRITE-001
  level: MUST
  category: write
  title: Deterministic JSON serialization
  production_meaning: UTF-8 output with configurable indentation, canonical key ordering without changing
    cell order, unknown fields retained, and binary payloads intact.
  developer_use_case: A pipeline writes notebooks whose diffs contain only real changes.
  provenance:
  - POL-EXD-WRITE-01
  required_behavior:
  - Write valid UTF-8 JSON with configurable formatting and canonical key ordering that never reorders
    cells or outputs; retain unknown fields and binary MIME payloads exactly.
  depth_required: 4
  depth_rationale: 'MUST write capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Determinism byte-compare; binary-payload integrity fixtures.
public_api_contract:
  mutation_operations:
  - notebook.clear_outputs(filter=...)
  - notebook.sanitize(policy)
  read_operations:
  - Notebook.load(...)
  - notebook.cells.find(...)
  root_types:
  - Notebook
  - Cell
  - NotebookOutput
  - MimeBundle
  validation_operations:
  - notebook.validate(mode='declared|current')
preservation_contract:
  lexical_roundtrip:
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  loss_reporting_policy: Report every construct that cannot be preserved before saving, through a loss
    report API, rather than failing silently.
  structural_roundtrip:
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  unknown_construct_policy: Preserve unknown or future-version constructs that can be carried safely;
    never silently drop unrecognized content in lossless mode.
validation_contract:
  diagnostic_schema:
    fields:
    - code
    - severity
    - message
    - source_location
    - object_path
    - originating_rule
    - repair_suggestion
    - auto_repair_eligible
  layers:
  - description: JSON validity and encoding rules.
    layer: syntax
  - description: Version-matched schema validation (declared and current-minor modes).
    layer: schema
  - description: Cell/output shape, ID uniqueness, attachment references, MIME-bundle shape.
    layer: structural
  - description: Execution-count consistency, orphaned attachments, forward-compatible unknown fields
      reported separately.
    layer: semantic
  - description: Active-content inventory, size limits, payload decoding limits.
    layer: security
security_contract:
  attack_surfaces:
  - Active HTML/JavaScript/SVG in outputs executing in viewers.
  - Executable source cells run by careless tooling during processing.
  - Oversized base64 attachments/outputs exhausting memory.
  - Trust-signature confusion marking modified content trusted.
  limits:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  safe_defaults:
  - No execution, rendering, or sanitization side effects during load/validate/diff/save.
  - Configurable size limits for cells, outputs, and attachments with streaming-safe decoding.
  - Modified documents never auto-marked trusted; trust state is explicit and pluggable.
test_contract:
- Test official or authoritative valid samples, invalid samples, synthetic edge cases, malformed inputs,
  and hostile inputs for every claimed capability.
- Prove parse-save-parse semantic equivalence for representative documents of every supported construct.
- Prove deterministic output by serializing the same document twice and byte-comparing.
- Publish a capability manifest stating supported versions, constructs, limitations, and lossless guarantees,
  verified against implementation and tests.
- Orphan and missing-target fixtures produce diagnostics.
- Dry-run report matches actual mutation; selective clearing fixtures.
- Move-detection fixtures; ignore-policy matrix; patch precondition failures.
- Each mutation class save-reload-verifies with IDs stable.
- Isolated-environment execution tests covering timeout, kernel failure, and partial output; core-path
  no-execution proof.
- Exporter adapter contract test with ancillary-resource collection.
- Duplicate/invalid ID negatives; upgrade fixture verifies mapping.
- Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Conflict-matrix fixtures (move/edit, delete/edit, output, metadata).
- Unknown-metadata round trip; typed adapter reads on real fixtures.
- Typed access per cell type; unknown-cell-type preservation fixture.
- MIME-bundle matrix round-trips including vendor types and binary payloads.
- MIME matrix fixtures per output type with byte-exact payload verification.
- Fixtures for string vs list-of-strings sources, unknown fields, and numeric edge values round-trip.
- Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Hostile active-content fixtures per mode; lossless mode leaves content intact and reported.
- Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
  test proving refusal with diagnostics.
- Edit-invalidates-trust fixture; notary plug-in contract test.
- Fixtures at each supported older version upgrade with ledger assertions; downgrade-loss reporting fixture.
- Both validation modes on fixtures per schema construct; unknown-field separation asserted.
- Determinism byte-compare; binary-payload integrity fixtures.
release_gates:
- Attachment integrity part of the validation layer.
- Cleanup is deterministic and idempotent (second run no-op).
- Diff stability under cell moves proven.
- Editing preserves schema validity (validated post-edit).
- Execution is physically and logically separated from parsing (dependency audit).
- At least one exporter adapter proven or the domain explicitly deferred by scope.
- ID behavior matches the target schema minor exactly.
- All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Merge conflicts always surfaced explicitly (negative-tested).
- Zero unknown-metadata loss proven.
- Model covers every schema cell construct.
- No output construct is dropped or reordered on round trip.
- Parse is proven side-effect-free (no execution/render hooks reachable).
- All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Sanitization catalog documented with per-mode tests.
- All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Trust behavior proven against modification scenarios.
- No silent version relabeling; conversion ledger complete (tested).
- Target-minor schema compliance proven on the official corpus.
- Writer round-trips the official corpus with zero semantic loss.
- Capability manifest published and independently verified against implementation and tests.
