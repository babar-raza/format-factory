  preservation duties, streaming, and resolution profiles.

  ORA-ISOLATION-001 status as of 2026-08-06: another XLIFF-NOTE-001-pattern
  capability, like ORA-SEC-001 before it. model/stack.py's
  OraStack.is_isolated_group property already implements "declared and
  inferred group isolation separately" verbatim -- its docstring even reads
  "ORA-ISOLATION-001, profile 0.0.4+" -- and lifecycle.py's _detect_version()/
  _uses_isolation() already implement "enforce profile availability" via the
  same declared-vs-detected version separation this package uses for xres/
  yres drift (a document declaring 0.0.1 that uses isolation is detected as
  0.0.4, exposing the mismatch rather than either silently accepting or
  rejecting it). Neither had a single test anywhere in the shipped-namespace
  suite before this slice -- confirmed by grep, not assumption. 15 new tests
  in test_obligation_isolation_semantics.py prove both halves: all three
  independent isolation triggers (declared isolate, opacity below one,
  non-default composite-op) individually and combined, that declared and
  inferred are genuinely distinguishable (not conflated into one boolean),
  that isolation is evaluated per-stack rather than inherited by nested
  children, and that both declared-attribute and inferred-only isolation
  usage register as a 0.0.1-vs-0.0.4 version drift. All 15 passed on first
  run against the unmodified existing implementation.

  Deliberately not attempted: "render isolated groups against a transparent
  intermediate backdrop" is actual pixel compositing this package has no
  rendering engine for at all -- not a testing gap, a genuinely absent
  capability, matching ORA-RENDER-001/ORA-COMPOSITE-001's own missing status.

  ORA-SEC-001 status as of 2026-08-05: this format has no shadow-package
  problem at all -- unlike ipynb/ubl/xliff/nrrd, every one of ORA's 4
  pre-existing test files already imports format_factory.ora exclusively
  (confirmed by grep before any other work this slice; there is no top-level
  `ora` shadow package under src/python/ora/ either). ORA-SEC-001 itself
  turned out to be the XLIFF-NOTE-001 pattern rather than the XLIFF-MODULE-001
  pattern: every required_behavior bullet was already implemented -- input
  limits (ResourceLimits throughout container.py/stack_xml.py/png_metadata.py
  with safe non-None defaults), path-traversal rejection (container.py's
  _reject_unsafe_name and stack_xml.py's _validate_src, both already tested
  incidentally under other capabilities), untrusted-payload discipline
  (png_metadata.py reads only the IHDR chunk, never inflating pixel data),
  and checked arithmetic plus bounded recursion (checked_product in
  png_metadata.py/stack_xml.py, max_nesting_depth enforced in stack_xml.py's
  _Walker) -- but it had zero tests framed under its OWN obligation, and one
  behavior (no network resolution) had never been tested at all, in any
  frame. 17 new tests in test_obligation_security_baseline.py prove all five
  bullets explicitly, including that a URL-shaped layer src cannot cause a
  network fetch (src is used only as a ZIP member-name lookup key, so it
  simply fails to match any archive member -- a stronger guarantee than an
  opt-in flag, since there is no code path that could ever dereference it as
  a URI).

  Three test-construction bugs were caught and fixed during this slice
  (product code was correct throughout): a URL-shaped src assertion expected
  the wrong rejection point (parse_stack does not resolve src at all; the
  lifecycle.load() layer-PNG-validation added in this session's earlier
  Phase 4.2 slice is what actually catches it as ORA_LAYER_SOURCE_MISSING);
  an XML attribute value containing literal `<script>` markup was invalid
  XML syntax without entity-escaping it; and a raw backslash in a ZIP member
  name cannot survive zipfile.writestr's own os.sep normalization on
  Windows, so that one guard is exercised by importing and calling
  _reject_unsafe_name directly rather than through a constructed archive.

