basis: >-
  OpenRaster had NO implementation until 2026-08-04, when its first source was
  written: src/python/ora/ with the archive container, media-type sentinel,
  layer-tree model and stack.xml parser. The rest of the format is still
  unbuilt, so most capabilities remain unmapped.
notes: >-
  Capabilities with no modules and no tests are recorded `missing`, which is
  deliberate: inventing a mapping to make the ledger look populated would be
  exactly the fabrication the evidence process exists to prevent. Recording
  them explicitly keeps all 134 obligations inside the denominator.

  Fourteen capabilities are now mapped to real source that was read, not
  merely assumed to exist (the GAP-022 rule). Mapping them does not assert
  they are complete -- ORA-STACK-001's model is built and its rendering is
  not -- only that implementing behaviour and tests exist for the
  reconciler to grade.

  This remains mostly a build-from-nothing lane. 6 of 20 capabilities have no
  source: rendering, compositing, transactional multi-entity editing
  (ORA-EDIT-001 -- distinct from ORA-LAYER-001/ORA-GROUP-001's per-node
  edit-and-validate, which is now mapped), masks, streaming, and resolution
  profiles.

  ORA-ISOLATION-001 status as of 2026-08-06: another XLIFF-NOTE-001-pattern
  capability, like ORA-SEC-001 before it. model/stack.py's
  OraStack.is_isolated_group property already implements "declared and
  inferred group isolation separately" verbatim -- its docstring even reads
  "ORA-ISOLATION-001, profile 0.0.4+" -- and lifecycle.py's _detect_version()/
  _uses_isolation() already implement "enforce profile availability" via the
  same declared-vs-detected version separation this package uses for xres/
  yres drift (a document declaring 0.0.1 that uses isolation is detected as
  0.0.4, exposing the mismatch rather than either silently accepting or
  rejecting it). Neither had a single test anywhere in the shipped-namespace
  suite before this slice -- confirmed by grep, not assumption. 15 new tests
  in test_obligation_isolation_semantics.py prove both halves: all three
  independent isolation triggers (declared isolate, opacity below one,
  non-default composite-op) individually and combined, that declared and
  inferred are genuinely distinguishable (not conflated into one boolean),
  that isolation is evaluated per-stack rather than inherited by nested
  children, and that both declared-attribute and inferred-only isolation
  usage register as a 0.0.1-vs-0.0.4 version drift. All 15 passed on first
  run against the unmodified existing implementation.

  Deliberately not attempted: "render isolated groups against a transparent
  intermediate backdrop" is actual pixel compositing this package has no
  rendering engine for at all -- not a testing gap, a genuinely absent
  capability, matching ORA-RENDER-001/ORA-COMPOSITE-001's own missing status.

  ORA-SEC-001 status as of 2026-08-05: this format has no shadow-package
  problem at all -- unlike ipynb/ubl/xliff/nrrd, every one of ORA's 4
  pre-existing test files already imports format_factory.ora exclusively
  (confirmed by grep before any other work this slice; there is no top-level
  `ora` shadow package under src/python/ora/ either). ORA-SEC-001 itself
  turned out to be the XLIFF-NOTE-001 pattern rather than the XLIFF-MODULE-001
  pattern: every required_behavior bullet was already implemented -- input
  limits (ResourceLimits throughout container.py/stack_xml.py/png_metadata.py
  with safe non-None defaults), path-traversal rejection (container.py's
  _reject_unsafe_name and stack_xml.py's _validate_src, both already tested
  incidentally under other capabilities), untrusted-payload discipline
  (png_metadata.py reads only the IHDR chunk, never inflating pixel data),
  and checked arithmetic plus bounded recursion (checked_product in
  png_metadata.py/stack_xml.py, max_nesting_depth enforced in stack_xml.py's
  _Walker) -- but it had zero tests framed under its OWN obligation, and one
  behavior (no network resolution) had never been tested at all, in any
  frame. 17 new tests in test_obligation_security_baseline.py prove all five
  bullets explicitly, including that a URL-shaped layer src cannot cause a
  network fetch (src is used only as a ZIP member-name lookup key, so it
  simply fails to match any archive member -- a stronger guarantee than an
  opt-in flag, since there is no code path that could ever dereference it as
  a URI).

  Three test-construction bugs were caught and fixed during this slice
  (product code was correct throughout): a URL-shaped src assertion expected
  the wrong rejection point (parse_stack does not resolve src at all; the
  lifecycle.load() layer-PNG-validation added in this session's earlier
  Phase 4.2 slice is what actually catches it as ORA_LAYER_SOURCE_MISSING);
  an XML attribute value containing literal `<script>` markup was invalid
  XML syntax without entity-escaping it; and a raw backslash in a ZIP member
  name cannot survive zipfile.writestr's own os.sep normalization on
  Windows, so that one guard is exercised by importing and calling
  _reject_unsafe_name directly rather than through a constructed archive.

  ORA-PRESERVE-001 status as of 2026-08-06: a mixed capability, not a single
  pattern. Of its 4 obligations, two were already implemented with zero
  tests (the XLIFF-NOTE-001 pattern): "distinguish lossless round-trip
  output mode from normalized/canonical output mode as an explicit caller
  choice" is lifecycle.PreservationMode, already an explicit dumps()/dump()
  parameter defaulting to LOSSLESS; "preserve unknown or future-version
  constructs ... never silently drop unrecognized content in lossless mode"
  is dumps()'s existing member-passthrough behavior (LOSSLESS re-emits
  image.members verbatim, including the original stack.xml bytes). One was
  genuinely absent (the XLIFF-MODULE-001 pattern): "report every construct
  that cannot be preserved before saving, through a loss report API, rather
  than failing silently" had no API at all -- nothing told a caller, before
  choosing CANONICAL, which constructs regeneration would drop. Built as a
  new module, preservation.py: check_preservation(image, target) returns an
  empty LossReport for LOSSLESS (nothing is ever lost) and, for CANONICAL,
  re-parses the original stack.xml bytes and diffs their actual XML
  attributes against the fixed set _canonical_stack_xml/_common already
  recognize per element tag, reporting anything else -- a vendor extension,
  a future-profile attribute -- with its element, value and tree location.

  The fourth obligation, "preserve the distinction between an absent
  optional value and an explicitly written default or empty value," is
  deliberately NOT attempted and NOT claimed implemented. model/stack.py's
  OraNode applies attribute defaults at construction time by documented
  design ("a caller never has to distinguish 'absent' from 'explicitly
  default' to composite correctly") -- correct for compositing, but it
  means the in-memory model cannot currently tell whether opacity=1.0 was
  written explicitly or just defaulted. This does not affect the
  archive-level round trip (LOSSLESS keeps the original bytes verbatim
  regardless of what the model captures), but fixing it properly at the
  model level would need nullable defaults threaded through
  OraNode/OraStack/OraLayer and every consumer of them (is_isolated_group
  included) -- real, larger-scoped work, the same kind of gap identified
  and deferred for ORA-LAYER-001/ORA-GROUP-001 this session, not something
  to half-implement here.

  9 new tests in test_obligation_preservation_baseline.py, all passed on
  first run; ruff clean, mypy clean. ORA suite: 204 -> 213 passed. All 4
  ORA-PRESERVE-001 obligations move from `missing` to `partial` (78
  partial/56 missing -> 82 partial/52 missing) even though only 3 of the 4
  underlying behaviors are proven -- consistent with how every other
  `partial` capability in this ledger works (evidence exists for real
  behavior; `missing_behavior` on the implementation-evidence YAML records
  what is not yet audited or, here, not yet built).

  ORA-LAYER-001 / ORA-GROUP-001 status as of 2026-08-06: the deferred gap
  from the ORA-ISOLATION-001 and ORA-PRESERVE-001 ticks, closed this slice.
  `OraNode`/`OraLayer`/`OraStack`/`OraText` were frozen dataclasses with NO
  domain validation at construction -- every check (opacity range,
  visibility enum, src safety) lived only in codec/stack_xml.py's PARSING
  functions. Since "edit" throughout this session's other formats means
  `dataclasses.replace()`, and `replace()` calls `__init__` again (which
  runs `__post_init__`), this meant editing silently bypassed every domain
  rule the parser enforces -- a real gap, not a testing one. Fixed by
  moving the validators into model/stack.py as
  validate_opacity/validate_visibility/validate_src, calling them from
  `__post_init__` on every node type, and making codec/stack_xml.py
  delegate to the SAME functions instead of keeping its own copies, so
  parser and model can never silently diverge on what counts as valid --
  the exact failure mode "reject invalid values" exists to prevent.

  Proven for both capabilities: "model and edit ... reject invalid values"
  (opacity, visibility, src) via `__post_init__` plus `dataclasses.replace()`
  (a rejected edit raises before the new object is ever returned, so the
  original -- already immutable by construction -- is provably untouched);
  "create/edit/move/remove" nested groups via ordinary children-tuple
  construction and `dataclasses.replace()` (no dedicated helper functions
  exist or are needed for this -- a frozen dataclass with a tuple field
  already supports every one of those operations mechanically, matching
  the dataclasses.replace()-is-editing precedent this session's other
  formats already established); "lossless child preservation" as the
  direct, provable consequence of replace() only touching fields a caller
  names (a dedicated test asserts `renamed.children is group.children`,
  not merely equal, after an attribute-only edit).

  Deliberately NOT attempted: composite-op and isolation have no validated
  enum anywhere in this package, parser or model -- codec/stack_xml.py
  never validated them either, and no SAL fact enumerates the exact
  permitted composite-op/isolation value sets with enough confidence to
  hard-code one now. This is a real, standing gap in "reject invalid
  values" for those two specific fields, not something this slice closes,
  and it is not claimed. "Root restriction" (image must contain exactly
  one root stack) is enforced by parse_stack already and is not a new
  model-level check this slice adds, since which stack is "the root" is a
  document-level fact OraStack itself has no way to know.

  38 new tests in test_obligation_layer_and_group_editing.py, all passed on
  first run; ruff clean, mypy clean on the full package (12 source files).
  All 213 pre-existing tests still pass unchanged after moving the
  validators (parser behavior and error types are identical; only the
  validation now also runs on direct/edited construction). ORA suite: 213
  -> 251 passed. All 15 obligations across both capabilities move from
  `missing` to `partial` (82 partial/52 missing -> 97 partial/37 missing).
  No ORA obligation reaches `implemented`.

