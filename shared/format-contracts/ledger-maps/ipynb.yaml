  IPYNB-MERGE-001 status as of 2026-08-06: this was ipynb's ONE genuinely
  unmapped capability (0 modules, 0 tests) -- every other ipynb capability
  already had real source and tests (67 of 68 obligations `partial`, only
  IPYNB-MERGE-001's single obligation `missing`). Built model/merge.py:
  merge_notebooks(base, ours, theirs) does a three-way merge on top of the
  existing diff_notebooks() (model/diff.py, built in an earlier session for
  IPYNB-DIFF-001) -- a three-way merge is two of its two-way diffs
  (base-to-ours, base-to-theirs) reconciled cell by cell: unchanged on both
  sides keeps base; changed on exactly one side takes that side; changed
  identically on both sides takes either; changed differently is a
  conflict, classified into one of the four categories the obligation names
  (MOVE_EDIT, DELETE_EDIT, OUTPUT, METADATA -- EDIT_EDIT covers the
  remaining fields, e.g. source and cell_type), reported in a MergeReport,
  and resolved to base's own original value pending real resolution --
  NEVER either side's conflicting value, and never a marker splice into
  source. "Never hide conflicts inside executable source" is read as an
  outright prohibition on textual conflict markers (which would silently
  turn a real conflict into a syntax error or a foreign string literal),
  not merely a caution; a dedicated test proves no marker text or either
  side's disputed content appears in a conflicted cell's merged source.

  Scope boundary stated explicitly: this reconciles CELLS only. All four
  named conflict categories are cell-scoped in the obligation's own
  phrasing. Notebook-level fields (kernelspec, language_info, nbformat) are
  taken from `base` unchanged -- top-level metadata merging is a different,
  unbuilt capability. Pure position divergence (both sides reorder cells
  differently but neither edits content) is also not one of the four named
  categories and is deliberately not flagged as a conflict -- a dedicated
  test proves this documented limitation rather than leaving it merely
  claimed.

