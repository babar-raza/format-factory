basis: >-
  XLIFF has exactly ONE test file that imports format_factory.xliff
  (test_production_namespace.py, 15 tests). The other ten import the deprecated
  xliff.* shadow package and cannot supply selectors under
  forbidden_progress_claims. Its 15 tests were read and assigned to capabilities
  by what they actually exercise, not by name similarity. 2026-08-05: added
  test_obligation_module_coverage.py (22 tests) for XLIFF-MODULE-001 and
  test_obligation_notes_and_annotations.py (11 tests) for XLIFF-NOTE-001, both
  written fresh against format_factory.xliff per the mission's no-shadow-port
  rule. Also added test_obligation_qa_checks.py (25 tests) for XLIFF-QA-001
  and test_obligation_merge_adapter.py (14 tests) for XLIFF-MERGE-001. Every
  xliff capability now has at least one shipped-namespace test.

  XLIFF-MERGE-001 status as of 2026-08-05: genuinely new source, unlike
  NOTE-001. No skeleton concept existed anywhere in the package. merge.py
  adds Skeleton (template bytes with translatable spans replaced by
  placeholder tokens, plus a source_digest computed at extraction time), the
  MergeAdapter protocol (extract/merge, deliberately with NO built-in
  adapter-less extraction path -- "never claim generic extraction without
  format-specific adapters" is a real constraint on this module's shape, not
  just prose), check_drift/merge_with_drift_check for the drift-refusal half,
  and TemplateMergeAdapter, a reference adapter for a minimal invented
  %%TR%%-delimited template format that exists only to prove the protocol
  against a real, working extraction and merge-back -- not to claim coverage
  of any real-world source format (no production template language uses this
  marker syntax).

  A real bug the test suite caught before commit: the adapter's first
  extraction consumed both %%TR%% markers into the placeholder span rather
  than keeping them as skeleton, so merging an UNTRANSLATED extraction back
  did not reproduce the original bytes -- test_skeleton_mapping_is_reversible_
  without_edits failed with the markers missing. Fixed by capturing only the
  text BETWEEN the markers (regex group 1) for replacement, leaving both
  %%TR%% occurrences as literal skeleton bytes on either side of the
  placeholder. 14 tests, including the drift-refused-with-a-report case the
  obligation's required_tests names explicitly.

  XLIFF-QA-001 status as of 2026-08-05: qa.py adds run_qa_checks(), a
  pluggable check registry kept structurally and semantically separate from
  validate()'s conformance report -- QA diagnostics never use ERROR/FATAL
  severity, so a QA finding can never make is_valid() false, and the two
  reports are never merged. Five of the six named categories in
  required_behavior are implemented: missing targets, unchanged targets,
  placeholder/code mismatches (tag+id signature comparison, not tag-only --
  a tag-only signature would miss two same-tagged codes swapping position,
  caught by a real test failure during this slice and fixed), whitespace/
  punctuation drift, and inconsistent translations across repeated source
  text. Target language compatibility is also implemented with its own
  normative-rule citation (the only one of the six with real normative_rules
  text: XLIFF 2.0 requires exact xml:lang equality against trgLang, XLIFF 2.1
  additionally accepts more-specific tags and reports reverse-specific or
  incompatible ones).

  Length violations are the one named category NOT implemented: checking
  them meaningfully needs actual parsed restriction values from the Size and
  Length Restriction module (slr:profiles' sizeRestriction/storageRestriction
  attributes), which XLIFF-MODULE-001 deliberately keeps PRESERVATION_ONLY --
  the raw XML round-trips, nothing parses it into usable numbers yet. A stub
  that always passes would be worse than this documented gap; it would read
  as coverage that was never built. qa.py's own module docstring states this
  explicitly rather than leaving it to be discovered later.

  XLIFF-NOTE-001 status as of 2026-08-05: this capability turned out to be
  substantially already satisfied by existing, generic machinery, not
  unimplemented. Note (text/id/appliesTo/category/priority) already existed
  and is parsed/written at file, group and unit level. The bigger question --
  whether overlapping annotation spans (sm/em start/end markers, which cannot
  be represented as a properly nested element pair) survive -- was answered by
  direct experiment before writing the test file: reader.py's _parse_inline is
  fully generic over ANY inline child tag (mrk, sm, em, pc, sc, ec alike),
  preserving each one's tag, attributes and document-order position without
  any tag-specific handling. That already gives sm/em their exact intended
  semantics: a flat sequence of self-closing markers linked by id/startRef,
  which is precisely how an overlapping span (one that a wrapping mrk could
  not represent) must be encoded. 11 tests prove this: note priority/category/
  appliesTo at all three levels, mrk wrapping a span, sm/em marking a span
  that overlaps a pc element's boundary, and annotation survival through
  create_target_from_source. No source change was needed -- the generic model
  already had this obligation's required behavior; it had not been proven.

  XLIFF-MODULE-001 status as of 2026-08-05: modules.py adds a programmatic
  coverage manifest (ModuleCoverage.MODELED/PRESERVATION_ONLY/UNSUPPORTED) for
  all eight XLIFF 2.1 standard modules named in the contract, each reporting
  PRESERVATION_ONLY -- honestly, since model/document.py still has no typed
  accessor (Match, GlossEntry, MetaGroup, etc.) for any of them, only
  ExtensionNode for unknown-namespace preservation. Per-module round-trip
  fixtures prove all eight preserve losslessly through a real loads/dumps
  cycle: six as unrecognized child elements (Translation Candidates, Glossary,
  Metadata, Resource Data, Size and Length Restriction, Validation) and two as
  unrecognized namespaced attributes on core elements (Format Style's fs/subFs,
  ITS's itsm:2.1 domain/language mapping), which is how the actual OASIS spec
  attaches them -- not as their own child elements. Resource Data's namespace
  is reported as unconfirmed (None) rather than invented, because unlike the
  other seven, no SAL fact states it explicitly; a control test proves
  preservation does not depend on that field being populated. This satisfies
  the obligation's "declare per-module coverage programmatically...never drop
  module data silently" and "coverage manifest matches behavior" required_test.
  It does NOT satisfy "production-complete status requires all modules
  modeled" -- is_production_complete() correctly returns False, and no
  XLIFF-MODULE-001 obligation may be recorded above `partial` on this alone.

execution_evidence:
  path: reports/skills-rff6/skill-transcripts/build-evidence-ledger-xliff-001.json
  result: PASS
  truth_boundary: >-
    SOURCE READ 2026-08-04 under the GAP-022 rule, updated 2026-08-05. Unlike
    ubl, xliff's CORE is genuine work: segmentation.py (217 LOC) implements
    split_segment, join_segments, SegmentMapping, spanning-code closure checks
    and fresh-id enforcement; inline.py, text_editing.py and the reader/writer
    are real. Those `partial` entries are defensible pending audit.

    2026-08-05 correction: the prior note here named the eight XLIFF 2.1
    modules as "...Resource Data, Change Tracking, Size and Length
    Restriction, Validation" -- Change Tracking is not one of the eight the
    contract's own normative_rules name; the eighth is ITS
    (http://www.w3.org/2005/11/its). That error is fixed here rather than
    carried forward.

    modules.py now gives XLIFF-MODULE-001 a programmatic coverage manifest
    covering all eight (Translation Candidates, Glossary, Format Style,
    Metadata, Resource Data, Size and Length Restriction, Validation, ITS),
    each PRESERVATION_ONLY with round-trip fixtures proving lossless
    preservation (see notes above). No typed per-module accessor exists yet,
    so no XLIFF-MODULE-001 obligation may be recorded above `partial`; this
    deepens the evidence behind `partial`, exactly like the UBL slices that
    moved zero obligations while making the evidence real rather than
    fictional. validation/validator.py still performs no schema validation, so
    the schema-validation clauses inside XLIFF-VALIDATE-001's `partial`
    entries remain overstated and still need per-obligation correction --
    unchanged by this slice.

    XLIFF-NOTE-001, same session: no source change. Direct experiment first
    (before writing any test) showed reader.py's _parse_inline is generic
    over every inline tag, so mrk/sm/em already survive with their exact
    attributes and document-order position -- which is what an overlapping
    span requires, since it cannot be a nested element pair. The gap was
    proof, not implementation; XLIFF-NOTE-001 could not be recorded `partial`
    before because it had zero shipped-namespace selectors, not because the
    behavior was absent.

    XLIFF-QA-001, same session: qa.py is new source (unlike NOTE-001). Five
    of six named QA categories implemented with dedicated tests each;
    length violations explicitly left undone pending Size/Length module
    modeling, documented rather than stubbed. No QA-001 obligation may be
    recorded above `partial` -- a check existing is not the same as it being
    verified against every fixture the required_tests line names, and length
    is a real, acknowledged gap in the category set itself.

    XLIFF-MERGE-001, same session: real new source (merge.py), unlike
    NOTE-001. SHOULD-level, and it stays SHOULD-level satisfied at `partial`:
    the reference adapter proves the protocol works end to end (extraction,
    reversible skeleton, translated merge, drift detection and refusal) but
    is deliberately not a real-world format adapter -- the obligation's
    "never claim generic extraction" clause is precisely why no such claim is
    made here.

    Suite-level and NON-PROMOTING. The xliff suite is 265 passed with no
    failures (193 baseline + 22 + 11 + 25 + 14 new), but that number is still
    dominated by the ten shadow-package files; the shipped-namespace files
    now contribute 87 tests (15 + 22 + 11 + 25 + 14). A green suite here says
    very little about the package that would be released. Binds no
    individual selector outcome to an obligation, so nothing here is
    verification; every obligation is recorded `partial` at most.

