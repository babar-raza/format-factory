basis: >-
  UBL has exactly ONE test file importing format_factory.ubl
  (test_production_namespace.py, 12 test functions). The other ten import the
  deprecated ubl.* shadow package and cannot supply selectors under
  forbidden_progress_claims. Its tests were read and assigned to capabilities by
  what they actually exercise. One of them is parametrized across all 91 UBL
  document roots, so its real assertion count is far higher than the function
  count suggests -- it is the strongest single shipped-namespace file of the
  four formats ledgered so far.
notes: >-
  As of 2026-08-04, six capabilities were mapped with NO tests because no
  shipped-namespace test exercised them: UBL-VALUES-001 (19 obligations),
  UBL-REF-001 (17), UBL-CODELIST-001 (10), UBL-CALC-001 (7), UBL-QUERY-001 (2)
  and UBL-UPGRADE-001 (2) -- 57 obligations, the largest unevidenced block in
  the program at the time. UBL-VALUES-001 and UBL-REF-001 have since been
  built out across the events-74-through-82 slices (typed temporal/monetary
  values, aggregates, allowance/charge, price, payment means); this note's
  historical framing of them as untouched is stale and should not be trusted
  without checking the current capabilities section below.

  UBL-CALC-001 status as of 2026-08-05: model/aggregates.py's
  reconcile_invoice() already existed (built in an earlier UBL slice as part
  of UBL-MODEL-001's aggregate work) and already reconciled line-extension
  and tax-subtotal totals -- but always by exact match, with no allowance/
  charge total check and no test file framed under UBL-CALC-001's own
  obligation. Extended, not rebuilt: reconcile_invoice() gained a `tolerance:
  Decimal = Decimal(0)` keyword parameter (default preserves prior exact-match
  behavior for every existing caller) satisfying "under explicit rounding/
  tolerance policies", and a new _reconcile_allowance_charge_totals() helper
  that sums document-level cac:AllowanceCharge entries by charge/allowance
  indicator and compares against cac:LegalMonetaryTotal's declared
  AllowanceTotalAmount/ChargeTotalAmount, only when both sides exist ("optional
  is not zero" -- an invoice with AllowanceCharge entries but no declared total
  is not asserting the total is nil). A real bug was caught and fixed before
  commit: the new diagnostic codes were built by string-concatenating a
  caller-supplied "already includes _MISMATCH" constant with another
  "_CURRENCY_MISMATCH" suffix, producing "UBL_CHARGE_TOTAL_MISMATCH_CURRENCY_
  MISMATCH" instead of the intended "UBL_CHARGE_TOTAL_CURRENCY_MISMATCH" --
  caught by test_allowance_charge_currency_mismatch_is_reported asserting the
  exact intended code, not a substring match that would have silently passed.

  Payable-amount reconciliation is a deliberate, documented gap, not an
  oversight: PayableAmount = TaxInclusiveAmount - PrepaidAmount +
  PayableRoundingAmount, and neither cbc:PrepaidAmount nor
  cbc:PayableRoundingAmount is modeled anywhere in this package. Checking
  PayableAmount == TaxInclusiveAmount without them would flag every invoice
  that legitimately declares a prepayment as a mismatch -- a false positive on
  correct data, which is worse than not checking. Recorded in aggregates.py's
  own module docstring, matching the precedent set by XLIFF-QA-001's
  undocumented-length-violations gap in the same session.

  13 new tests in test_obligation_business_calculation.py, all 20 pre-existing
  aggregate-component tests still pass unchanged (zero-tolerance default is
  behaviorally identical to the prior exact `!=` comparison for every existing
  case). ubl suite: 475 -> 488 passed.

  UBL-QUERY-001 status as of 2026-08-06: genuinely new source (model/query.py),
  unlike UBL-VALUES-001/REF-001's prior-session build-out. No query/index
  concept existed anywhere in the package before this slice. DocumentIndex
  walks the tree once and answers by_qname/by_local_name/by_id/
  by_business_role from dict lookups afterward -- "read-only indexed views
  for large documents" is the whole reason it builds once rather than
  re-walking per query. business_role() classifies party/item/line/
  document_reference by local-name suffix, plus lines_referencing_item_id()
  answers the obligation's own worked example directly.

  Three real design bugs were caught by the test suite before commit, all
  fixed by correcting the design rather than the test: (1) path segments
  were bare local names, so two sibling cac:InvoiceLine elements produced
  IDENTICAL paths -- paths that cannot distinguish which of several
  same-named siblings was matched are not path-aware in any useful sense.
  Fixed by making every segment `name[index]`, index being position among
  same-named siblings under that parent, uniformly (not only where
  disambiguation happens to be needed, which would make the path shape
  depend on document content). (2) The "document_reference" role initially
  suffix-matched any name ending in "Reference", which incorrectly classified
  cac:BillingReference -- a pure wrapper around a nested
  cac:InvoiceDocumentReference with no cbc:ID of its own -- as a reference in
  its own right. Fixed by requiring the reference-suffixed node to carry its
  OWN identifying child, which correctly excludes wrapper-only containers
  while still matching cac:OrderReference and cac:InvoiceDocumentReference
  (both of which do carry their own cbc:ID). This restriction is deliberately
  NOT applied to the party/line/item roles, since cac:AccountingSupplierParty
  (no own ID; the ID lives on the nested cac:Party) and cac:Item (no own ID
  in the real UBL schema at all) are both wrapper-shaped by design and the
  existing tests correctly expect them classified anyway. (3)
  lines_referencing_item_id() initially returned zero matches for a realistic
  fixture: cac:Item carries no cbc:ID of its own in the actual UBL schema --
  the identifier lives one level deeper, inside cac:StandardItemIdentification
  (or cac:SellersItemIdentification/cac:BuyersItemIdentification). Fixed by
  adding a dedicated item-identifier resolver that checks those three wrapper
  children specifically, rather than reusing the generic own-identifier
  lookup that only checks direct ID/LineID/UUID children.

  19 new tests in test_obligation_document_query.py. ubl suite: 488 -> 507
  passed. ubl obligations: 163 partial/31 missing -> 165 partial/29 missing.

