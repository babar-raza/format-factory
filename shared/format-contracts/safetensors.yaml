  provenance:
  - POL-BT-LAZY-01
  required_behavior:
  - Provide header-only validation, read-only path mapping, tensor-relative region views, configurable
    size limits, and machine-readable access-strategy disclosure.
  performance_requirements:
  - Large sparse-file tests prove header bytes copied, mapping mode, bounded Python allocations, and borrowed-view
    lifetime behavior.
  depth_required: 4
  depth_rationale: 'MUST performance capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Bounded-memory large-file, header-read-count, mapped-region, stream-buffer disclosure, and view-lifetime
    tests.
- release_gates:
  - Every lifecycle entry point passes from the installed wheel.
  capability_id: SAFETENSORS-LIFECYCLE-001
  level: MUST
  category: lifecycle
  title: Strict lifecycle API
  production_meaning: Paths, binary streams, and in-memory bytes use one typed lifecycle with strict and
    preservation modes, structured validation, and deterministic output.
  developer_use_case: A developer uses probe/load/loads/dump/dumps/validate consistently without importing
    framework adapters.
  provenance:
  - POL-BT-LIFECYCLE-01
  - POL-BT-LIFECYCLE-02
  required_behavior:
  - Provide probe, path/stream/bytes load, path/stream dump, bytes serialization, and structured validation
    through the production namespace.
  - Strict mode rejects invalid input; preservation mode retains safe unknown descriptor fields; no recovery
