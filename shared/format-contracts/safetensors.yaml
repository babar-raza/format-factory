format_identity:
  active_content_model:
    has_active_content: false
    policy: Tensor metadata and payload bytes are passive data and are never executed, imported, or interpreted
      as plugins.
  data_model_type: binary
  description: 'SafeTensors: binary tensor container (Hugging Face safetensors v0.8.0 commit a406ca3e7a90598be0cd05a50069cb9bf5ef6ba6)
    with bounded metadata, named typed tensor descriptors, and a raw byte payload.'
  primary_use_cases:
  - Inspect tensor names, dtypes, shapes, metadata, and byte regions without loading the payload
  - Read and write framework-neutral tensor files deterministically
  - Validate untrusted tensor containers before exposing payload views or allocating framework arrays
