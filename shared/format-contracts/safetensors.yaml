  - Unknown descriptor fields, metadata absence, empty metadata, and string-map round trips.
- release_gates:
  - Sharded-index support is packaged and documented separately from core file conformance.
  capability_id: SAFETENSORS-SHARD-001
  level: MUST
  category: advanced
  title: Separately scoped sharded index
  production_meaning: Multi-file sharded indexes are modeled as an explicit companion convention and never
    misrepresented as part of the core file grammar.
  developer_use_case: A developer resolves a named tensor to one shard under explicit root and resource
    policies.
  provenance:
  - POL-BT-SHARD-01
  required_behavior:
  - Provide separately documented sharded-index parsing, deterministic writing, tensor-to-shard resolution,
    duplicate detection, and root-confined path policy.
  depth_required: 4
  depth_rationale: 'MUST advanced capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Official index examples, multi-shard resolution, duplicate/missing tensor, traversal, and deterministic
    index writing.
- release_gates:
  - No mandatory validation or security rule lacks executed negative evidence.
  capability_id: SAFETENSORS-VALIDATE-001
  level: MUST
  category: validate
  title: Layered structural and security validation
  production_meaning: Metadata, descriptors, arithmetic, region coverage, resource limits, and document
    invariants produce stable structured diagnostics.
  developer_use_case: A service validates hostile tensor uploads without creating framework arrays.
  provenance:
  - POL-BT-VALIDATE-01
  - SAL-SAFETENSORS-00002
  - SAL-SAFETENSORS-00004
  - SAL-SAFETENSORS-00005
  - SAL-SAFETENSORS-00011
  - SAL-SAFETENSORS-00012
  - SAL-SAFETENSORS-00016
  - SAL-SAFETENSORS-00017
  - SAL-SAFETENSORS-00018
  required_behavior:
  - Validate metadata, dtype, shape, checked size arithmetic, offsets, complete coverage, limits, and
    borrowed-view ownership with stable diagnostic codes.
  normative_rules:
  - (SafeTensors v0.4 — tensor entries) Each tensor entry declares dtype (e.g. F16, F32, I64, BF16), shape
    (list of non-negative ints), and data_offsets [begin, end) into the byte buffer immediately following
    the header; offsets are contiguous and non-overlapping
  - (tensor.rs MetadataIncompleteBuffer and test_metadata_incomplete_buffer) A complete SafeTensors file
    may not contain unindexed trailing payload bytes after the final tensor because incomplete metadata
    coverage is invalid.
  - (tensor.rs read_metadata and invalid-header tests) A declared header length that exceeds the available
    file bytes, malformed UTF-8, or malformed JSON is invalid and must be rejected.
  - (tensor.rs Metadata.validate and test_validation_overflow) Shape multiplication and element-bit multiplication
    overflow are invalid and must be rejected instead of wrapping during validation.
  - (tensor.rs Dtype.bitsize and Metadata.validate) Sub-byte F4 and six-bit tensor types are valid only
    when the complete tensor bit count ends on a byte boundary; a misaligned slice is invalid.
  - (README Notes line 99 and tensor.rs Metadata.validate) The data buffer must be entirely indexed by
    tensor entries without holes, and ordered tensor offsets must be contiguous and non-overlapping.
  - (tensor.rs MAX_HEADER_SIZE and read_metadata) The official implementation limits a JSON header to
    100,000,000 bytes and rejects a declared header length above that resource limit.
  - (tensor.rs Metadata.validate lines 627-659) The tensor byte span must equal the checked product of
    all shape dimensions and the dtype bit width divided by eight.
  validation_rules:
  - Positive and rejection obligations are distinct and each rejection rule requires an executed negative
    result.
  depth_required: 5
  depth_rationale: 'MUST validate capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - One negative vector per rule plus property, mutation, fuzz, and resource-exhaustion suites.
- release_gates:
  - Two clean writes are byte-identical and accepted by the pinned official implementation.
  capability_id: SAFETENSORS-WRITE-001
  level: MUST
  category: write
  title: Deterministic conformant writing
  production_meaning: Writers emit one complete target-version container with canonical metadata ordering
    and exact payload bytes.
  developer_use_case: A developer builds reproducible tensor artifacts accepted by the official implementation.
  provenance:
  - POL-BT-WRITE-01
  required_behavior:
  - Write deterministic metadata and exact payload bytes, recomputing all offsets and rejecting inconsistent
    models before output.
  depth_required: 4
  depth_rationale: 'MUST write capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Repeated byte comparison, every dtype, metadata, scalar/empty/sub-byte, and official-reader acceptance.
preservation_contract:
  lexical_roundtrip:
  - Exact JSON spelling, whitespace, and object order are not preserved; normalized deterministic metadata
    serialization is the explicit guarantee.
  loss_reporting_policy: Validation reports any unknown value that cannot be retained safely before writing;
    writers never drop it silently.
  structural_roundtrip:
  - Preserve file metadata, tensor descriptors, safe unknown descriptor fields, and exact tensor payload
    bytes across semantic round trips.
  unknown_construct_policy: Preservation mode retains safe unknown tensor descriptor fields without treating
    them as understood; strict mode rejects unsafe or structurally conflicting fields.
validation_contract:
  diagnostic_schema:
    fields:
    - code
    - severity
    - message
    - source_location
    - object_path
    - originating_rule
    - repair_suggestion
    - auto_repair_eligible
  layers:
  - description: Fixed-width prefix, declared metadata extent, UTF-8, and JSON object syntax.
    layer: lexical
  - description: Tensor names, dtypes, shapes, metadata types, and byte-range fields.
    layer: type
  - description: Checked tensor sizes, region coverage, order, overlap, holes, truncation, and trailing
      bytes.
    layer: payload
  - description: Header, input, tensor-count, arithmetic, mapping, and borrowed-view lifetime limits.
    layer: security
security_contract:
  attack_surfaces:
  - Hostile header lengths, tensor counts, dimensions, and bit widths causing excessive allocation or
    arithmetic overflow.
  - Overlapping, out-of-order, truncated, or unindexed tensor byte ranges exposing unintended bytes.
  - Duplicate JSON keys changing descriptor meaning across parsers.
  - Borrowed payload views outliving their mapped document owner.
  limits:
  - Bound input bytes, header bytes, tensor count, rank, dimensions, mapped regions, and borrowed views
    with configurable safe defaults.
  - Use checked arithmetic for shape products, dtype bit widths, byte counts, and absolute payload offsets.
  - Never resolve network resources, execute payload bytes, import plugins, or allocate framework arrays
    during base parsing or validation.
  safe_defaults:
  - Validate the fixed prefix and bounded metadata before creating any payload view.
  - Use checked size arithmetic and require complete contiguous payload coverage.
  - Reject duplicate keys and non-string file metadata.
  - Expose borrowed-view ownership rules and require callers to release views before closing mapped documents.
test_contract:
- Test official or authoritative valid samples, invalid samples, synthetic edge cases, malformed inputs,
  and hostile inputs for every claimed capability.
- Prove parse-save-parse semantic equivalence for representative documents of every supported construct.
- Prove deterministic output by serializing the same document twice and byte-comparing.
- Publish a capability manifest stating supported versions, constructs, limitations, and lossless guarantees,
  verified against implementation and tests.
- Dependency-absent imports, minimum/latest adapter versions, dtype matrix, copy/zero-copy disclosure,
  and device behavior.
- Prefix endian/extent, whitespace padding, duplicate-key, UTF-8, JSON, metadata-type, truncation, and
  header-limit vectors.
- Official corpus, bidirectional writer vectors, contradiction cases, and installed co-import proof.
- Bounded-memory large-file, header-read-count, mapped-region, stream-buffer disclosure, and view-lifetime
  tests.
- Lifecycle source matrix, strict rejection, preservation, and deterministic serialization tests.
- Complete dtype inventory plus rank, scalar, zero-dimension, unknown-field, and aligned/misaligned sub-byte
  cases.
- Coverage, ordering, overlap, hole, truncation, trailing-byte, size-equation, and region-boundary matrices.
- Unknown descriptor fields, metadata absence, empty metadata, and string-map round trips.
- Official index examples, multi-shard resolution, duplicate/missing tensor, traversal, and deterministic
  index writing.
- One negative vector per rule plus property, mutation, fuzz, and resource-exhaustion suites.
- Repeated byte comparison, every dtype, metadata, scalar/empty/sub-byte, and official-reader acceptance.
release_gates:
- Base, NumPy, and PyTorch environments pass independently.
- Header-only inspection matches full-load descriptor truth without reading payload bytes.
- No unexplained official-oracle contradiction remains open.
- Header-only and mapped-region paths pass installed-wheel large-data tests.
- Every lifecycle entry point passes from the installed wheel.
- The public model inventory covers every target-version descriptor construct.
- All payload invariants have positive and negative executed evidence.
- Every preserved construct survives an independently parsed semantic round trip.
- Sharded-index support is packaged and documented separately from core file conformance.
- No mandatory validation or security rule lacks executed negative evidence.
- Two clean writes are byte-identical and accepted by the pinned official implementation.
- Capability manifest published and independently verified against implementation and tests.
