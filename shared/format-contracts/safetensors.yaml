  capability_id: SAFETENSORS-PRESERVE-001
  level: MUST
  category: preserve
  title: Baseline preservation duties
  production_meaning: Unknown constructs, absent-vs-default distinctions, and loss reporting are handled
    so round trips never silently drop data.
  developer_use_case: A developer round-trips files containing constructs the library does not model and
    loses nothing silently.
  provenance:
  - POL-SLC-PRESERVE-01
  - POL-SLC-PRESERVE-02
  - POL-SLC-PRESERVE-03
  - POL-SLC-PRESERVE-04
  required_behavior:
  - Preserve unknown or future-version constructs that can be carried safely; never silently drop unrecognized
    content in lossless mode.
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  - Report every construct that cannot be preserved before saving, through a loss report API, rather than
    failing silently.
