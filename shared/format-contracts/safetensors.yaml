scope_policy:
  minimum_viable_support: Strictly parse, validate, and deterministically write complete tensor containers
    with checked sizes and bounded path-backed access.
  production_complete_target: Complete target-version header, metadata, dtype, shape, offset, payload,
    validation, lazy-access, deterministic-writing, adapter, sharding-index, and official-implementation
    interoperability behavior.
capabilities:
- release_gates:
  - Base, NumPy, and PyTorch environments pass independently.
  capability_id: SAFETENSORS-ADAPTER-001
  level: MUST
  category: advanced
  title: Optional framework adapters
  production_meaning: NumPy and PyTorch conversion is isolated behind optional adapters while the core
    model remains framework-neutral.
  developer_use_case: A developer opts into a framework adapter without forcing that dependency on other
    users.
  provenance:
  - POL-BT-ADAPTER-01
  - SAL-SAFETENSORS-00001
  - SAL-SAFETENSORS-00002
  - SAL-SAFETENSORS-00006
  - SAL-SAFETENSORS-00007
  - SAL-SAFETENSORS-00008
  - SAL-SAFETENSORS-00011
  - SAL-SAFETENSORS-00012
  - SAL-SAFETENSORS-00018
  - SAL-SAFETENSORS-00019
  required_behavior:
  - Provide separately importable optional NumPy and PyTorch adapters with explicit dtype/device/copy
    behavior and no framework import in the base package.
  normative_rules:
  - (SafeTensors v0.4 — file format) A safetensors file starts with an unsigned little-endian 64-bit integer
    N, followed by exactly N bytes of UTF-8 JSON header mapping tensor names to {dtype, shape, data_offsets},
    plus an optional __metadata__ string map
  - (SafeTensors v0.4 — tensor entries) Each tensor entry declares dtype (e.g. F16, F32, I64, BF16), shape
    (list of non-negative ints), and data_offsets [begin, end) into the byte buffer immediately following
    the header; offsets are contiguous and non-overlapping
  - (tensor.rs test_zero_sized_tensor) A tensor shape containing a zero dimension is valid and has an
    empty data span whose begin and end offsets are equal.
  - (README Notes line 98 and tensor.rs test_empty_shapes_allowed) A zero-rank tensor with an empty shape
    list is a valid scalar whose data span contains exactly one element of its declared dtype.
  - (README Format lines 80-82) Each tensor entry has a dtype field, a shape field containing dimensions,
    and a data_offsets field containing a begin and end byte offset.
  - (tensor.rs Metadata.validate and test_validation_overflow) Shape multiplication and element-bit multiplication
    overflow are invalid and must be rejected instead of wrapping during validation.
  - (tensor.rs Dtype.bitsize and Metadata.validate) Sub-byte F4 and six-bit tensor types are valid only
    when the complete tensor bit count ends on a byte boundary; a misaligned slice is invalid.
  - (tensor.rs Metadata.validate lines 627-659) The tensor byte span must equal the checked product of
    all shape dimensions and the dtype bit width divided by eight.
  - (tensor.rs Dtype enum lines 811-865) The v0.8.0 dtype inventory includes BOOL, F4, F6_E2M3, F6_E3M2,
    U8, I8, F8_E5M2, F8_E4M3, F8_E8M0, F8_E4M3FNUZ, F8_E5M2FNUZ, I16, U16, F16, BF16, I32, U32, F32, C64,
    F64, I64, and U64.
  depth_required: 4
  depth_rationale: 'MUST advanced capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Dependency-absent imports, minimum/latest adapter versions, dtype matrix, copy/zero-copy disclosure,
    and device behavior.
- release_gates:
  - Header-only inspection matches full-load descriptor truth without reading payload bytes.
  capability_id: SAFETENSORS-HEADER-001
  level: MUST
  category: parse
  title: Exact bounded metadata parsing
  production_meaning: The fixed prefix and complete bounded UTF-8 JSON metadata object parse with duplicate-key,
    metadata-type, padding, and extent rules enforced.
  developer_use_case: A developer inspects all tensor descriptors and file metadata without reading payload
    bytes.
  provenance:
  - POL-BT-HEADER-01
  - POL-BT-HEADER-02
  - SAL-SAFETENSORS-00001
  - SAL-SAFETENSORS-00002
  - SAL-SAFETENSORS-00003
  - SAL-SAFETENSORS-00004
  - SAL-SAFETENSORS-00005
  - SAL-SAFETENSORS-00009
  - SAL-SAFETENSORS-00011
  - SAL-SAFETENSORS-00012
  - SAL-SAFETENSORS-00013
  - SAL-SAFETENSORS-00014
  - SAL-SAFETENSORS-00015
  - SAL-SAFETENSORS-00016
  - SAL-SAFETENSORS-00017
  - SAL-SAFETENSORS-00018
  required_behavior:
  - Parse the exact fixed-width little-endian metadata-length prefix and only the declared UTF-8 JSON
    metadata bytes.
  - Reject duplicate keys, malformed UTF-8 or JSON, invalid metadata values, truncated metadata, and configured
    header-limit violations.
  normative_rules:
  - (SafeTensors v0.4 — file format) A safetensors file starts with an unsigned little-endian 64-bit integer
    N, followed by exactly N bytes of UTF-8 JSON header mapping tensor names to {dtype, shape, data_offsets},
    plus an optional __metadata__ string map
  - (SafeTensors v0.4 — tensor entries) Each tensor entry declares dtype (e.g. F16, F32, I64, BF16), shape
    (list of non-negative ints), and data_offsets [begin, end) into the byte buffer immediately following
    the header; offsets are contiguous and non-overlapping
  - (README Format lines 74-79) A SafeTensors file header prefix is exactly eight bytes interpreted as
    an unsigned little-endian 64-bit integer containing the UTF-8 JSON header byte length.
  - (tensor.rs MetadataIncompleteBuffer and test_metadata_incomplete_buffer) A complete SafeTensors file
    may not contain unindexed trailing payload bytes after the final tensor because incomplete metadata
    coverage is invalid.
  - (tensor.rs read_metadata and invalid-header tests) A declared header length that exceeds the available
    file bytes, malformed UTF-8, or malformed JSON is invalid and must be rejected.
  - (tensor.rs test_whitespace_padded_header) JSON whitespace may pad the beginning or end of the header,
    allowing writers to align the following data section while preserving valid syntax.
  - (tensor.rs Metadata.validate and test_validation_overflow) Shape multiplication and element-bit multiplication
    overflow are invalid and must be rejected instead of wrapping during validation.
  - (tensor.rs Dtype.bitsize and Metadata.validate) Sub-byte F4 and six-bit tensor types are valid only
    when the complete tensor bit count ends on a byte boundary; a misaligned slice is invalid.
  - (README Format line 81) Tensor data offsets are relative to the beginning of the data buffer that
    immediately follows the variable-length JSON header.
  - (README Format lines 76-83) The SafeTensors header is UTF-8 JSON and its top-level object maps tensor-name
    keys to tensor entries, with __metadata__ reserved for file metadata.
  - (README Format line 83) The __metadata__ entry may contain only a free-form string-to-string map;
    arbitrary nested JSON metadata values are not valid.
  - (README Notes line 99 and tensor.rs Metadata.validate) The data buffer must be entirely indexed by
    tensor entries without holes, and ordered tensor offsets must be contiguous and non-overlapping.
  - (tensor.rs MAX_HEADER_SIZE and read_metadata) The official implementation limits a JSON header to
    100,000,000 bytes and rejects a declared header length above that resource limit.
  - (tensor.rs Metadata.validate lines 627-659) The tensor byte span must equal the checked product of
    all shape dimensions and the dtype bit width divided by eight.
  depth_required: 3
  depth_rationale: 'MUST parse capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Prefix endian/extent, whitespace padding, duplicate-key, UTF-8, JSON, metadata-type, truncation, and
    header-limit vectors.
- release_gates:
  - No unexplained official-oracle contradiction remains open.
  capability_id: SAFETENSORS-INTEROP-001
  level: MUST
  category: interoperability
  title: Pinned official implementation interoperability
  production_meaning: The library reads official output, the pinned official implementation reads this
    writer's output, and both distributions co-install without namespace collision.
