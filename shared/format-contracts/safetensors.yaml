  - Orientation matrices, non-spatial axes, and mismatch negatives.
- release_gates:
  - All specified types and aliases round-trip.
  capability_id: SAFETENSORS-TYPES-001
  level: MUST
  category: model
  title: Complete scalar and block types
  production_meaning: All specified integer/float widths with aliases plus opaque block types are represented
    independently of host-language names with validity rules enforced.
  developer_use_case: A developer reads a dataset's exact declared type and receives documented host-type
    mappings.
  provenance:
  - POL-SCR-TYPES-01
  - SAL-SAFETENSORS-00001
  - SAL-SAFETENSORS-00002
  - SAL-SAFETENSORS-00003
  - SAL-SAFETENSORS-00007
  - SAL-SAFETENSORS-00008
  - SAL-SAFETENSORS-00012
  - SAL-SAFETENSORS-00018
  - SAL-SAFETENSORS-00019
  required_behavior:
  - Support every specified scalar type and alias plus block types with their validity rules; represent
    declared types independently from host-language type names.
  normative_rules:
  - (SafeTensors v0.4 — file format) A safetensors file starts with an unsigned little-endian 64-bit integer
    N, followed by exactly N bytes of UTF-8 JSON header mapping tensor names to {dtype, shape, data_offsets},
    plus an optional __metadata__ string map
  - (SafeTensors v0.4 — tensor entries) Each tensor entry declares dtype (e.g. F16, F32, I64, BF16), shape
    (list of non-negative ints), and data_offsets [begin, end) into the byte buffer immediately following
    the header; offsets are contiguous and non-overlapping
  - (README Format lines 74-79) A SafeTensors file header prefix is exactly eight bytes interpreted as
    an unsigned little-endian 64-bit integer containing the UTF-8 JSON header byte length.
  - (README Notes line 98 and tensor.rs test_empty_shapes_allowed) A zero-rank tensor with an empty shape
    list is a valid scalar whose data span contains exactly one element of its declared dtype.
  - (README Format lines 80-82) Each tensor entry has a dtype field, a shape field containing dimensions,
    and a data_offsets field containing a begin and end byte offset.
  - (tensor.rs Dtype.bitsize and Metadata.validate) Sub-byte F4 and six-bit tensor types are valid only
    when the complete tensor bit count ends on a byte boundary; a misaligned slice is invalid.
  - (tensor.rs Metadata.validate lines 627-659) The tensor byte span must equal the checked product of
    all shape dimensions and the dtype bit width divided by eight.
  - (tensor.rs Dtype enum lines 811-865) The v0.8.0 dtype inventory includes BOOL, F4, F6_E2M3, F6_E3M2,
    U8, I8, F8_E5M2, F8_E4M3, F8_E8M0, F8_E4M3FNUZ, F8_E5M2FNUZ, I16, U16, F16, BF16, I32, U32, F32, C64,
    F64, I64, and U64.
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Type/alias matrix round trips; invalid type/encoding combination negatives.
- release_gates:
  - Validation layer complete against specification rule inventory.
  capability_id: SAFETENSORS-VALIDATE-001
  level: MUST
  category: validate
  title: Header and payload validation
  production_meaning: Required/conditional fields, per-axis arity, version-feature compatibility, and
    expected payload size after decoding validate before allocation with complete diagnostics.
  developer_use_case: A service validates uploads cheaply (header-first) and rejects shape/payload mismatches
    with exact reasons.
  provenance:
  - POL-SCR-VALIDATE-01
  - SAL-SAFETENSORS-00004
  - SAL-SAFETENSORS-00005
  - SAL-SAFETENSORS-00006
  - SAL-SAFETENSORS-00007
  - SAL-SAFETENSORS-00009
  - SAL-SAFETENSORS-00011
  - SAL-SAFETENSORS-00012
  - SAL-SAFETENSORS-00015
  - SAL-SAFETENSORS-00016
  - SAL-SAFETENSORS-00018
  required_behavior:
  - Check required and conditional fields, arity, version-feature compatibility, and expected sample/byte
    counts after decoding; treat trailing payload per policy with reporting.
  normative_rules:
  - (tensor.rs MetadataIncompleteBuffer and test_metadata_incomplete_buffer) A complete SafeTensors file
    may not contain unindexed trailing payload bytes after the final tensor because incomplete metadata
    coverage is invalid.
  - (tensor.rs read_metadata and invalid-header tests) A declared header length that exceeds the available
    file bytes, malformed UTF-8, or malformed JSON is invalid and must be rejected.
  - (tensor.rs test_zero_sized_tensor) A tensor shape containing a zero dimension is valid and has an
    empty data span whose begin and end offsets are equal.
  - (README Notes line 98 and tensor.rs test_empty_shapes_allowed) A zero-rank tensor with an empty shape
    list is a valid scalar whose data span contains exactly one element of its declared dtype.
  - (tensor.rs test_whitespace_padded_header) JSON whitespace may pad the beginning or end of the header,
    allowing writers to align the following data section while preserving valid syntax.
  - (tensor.rs Metadata.validate and test_validation_overflow) Shape multiplication and element-bit multiplication
    overflow are invalid and must be rejected instead of wrapping during validation.
  - (tensor.rs Dtype.bitsize and Metadata.validate) Sub-byte F4 and six-bit tensor types are valid only
    when the complete tensor bit count ends on a byte boundary; a misaligned slice is invalid.
  - (README Format line 83) The __metadata__ entry may contain only a free-form string-to-string map;
    arbitrary nested JSON metadata values are not valid.
  - (README Notes line 99 and tensor.rs Metadata.validate) The data buffer must be entirely indexed by
    tensor entries without holes, and ordered tensor offsets must be contiguous and non-overlapping.
  - (tensor.rs Metadata.validate lines 627-659) The tensor byte span must equal the checked product of
    all shape dimensions and the dtype bit width divided by eight.
  depth_required: 5
  depth_rationale: 'MUST validate capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Truncated/oversized payloads, conditional-field negatives, version-feature mismatches.
