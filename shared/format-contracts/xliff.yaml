format_identity:
  active_content_model:
    has_active_content: false
    policy: Localization data is passive; external resource-data resolution is opt-in through a secure
      resolver.
  data_model_type: xml
  description: 'XLIFF (XML Localisation Interchange File Format): XML localization-interchange standard
    (OASIS XLIFF 2.1). Source/target text units with inline codes, segmentation, annotations, and optional
    modules, exchanged across translation tools and workflows.'
  primary_use_cases:
  - Extract translatable content, translate, and merge back without corrupting the original format
  - Segment, annotate, and track translation state across tool chains
  - Preserve inline formatting codes and tool-specific extensions through round trips
