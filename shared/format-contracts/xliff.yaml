  - (XLIFF core - identifier constraints) id attributes on file group unit and inline elements must be
    unique within their specification-defined scope and references must resolve
  - (XLIFF core - annotations) mrk elements annotate inline spans and sm/em elements mark span boundaries
    where spans overlap element structure
  - (XLIFF core - notes) notes elements carry note children with optional priority and category attributes
    attached to files groups or units
  - (XLIFF core - original data) originalData elements carry native code data referenced from inline codes
    via dataRef attributes
  - (XLIFF core - skeleton) skeleton elements carry or reference the non-translatable document skeleton
    needed to reconstruct the original file on merge
  - (XLIFF core - translation state) Segment elements carry an optional state attribute defaulting to
    initial with values initial, translated, reviewed, and final; translated, reviewed, or final requires
    a target child.
  - (XLIFF core - segment and ignorable) unit elements contain segment and ignorable elements whose source
    children carry translatable text and whose target children carry translations
  - (XLIFF core - whitespace and language) The xliff root declares xml:space with default value default,
    and source and target permit optional xml:lang and xml:space attributes.
  - (XLIFF 2.1 Translation Candidates module) The Translation Candidates module uses namespace urn:oasis:names:tc:xliff:matches:2.0;
    matches contains one or more match elements, and each match requires ref plus one source and one target.
  - (XLIFF 2.1 Glossary module) The Glossary module uses namespace urn:oasis:names:tc:xliff:glossary:2.0;
    a glossary contains one or more glossEntry elements, each with one term, zero or more translations,
    and at most one definition.
  - (XLIFF 2.1 Metadata module) The Metadata module uses namespace urn:oasis:names:tc:xliff:metadata:2.0;
    metadata contains one or more metaGroup elements, and meta elements require a type attribute.
  - (XLIFF 2.1 Size and Length Restriction module) The Size and Length Restriction module uses namespace
    urn:oasis:names:tc:xliff:sizerestriction:2.0 and defines profiles, normalization, data, and restriction
    attributes including sizeRestriction and storageRestriction.
  - (XLIFF 2.1 Validation module) The Validation module uses namespace urn:oasis:names:tc:xliff:validation:2.0;
    validation contains one or more rule elements whose constraints include presence, occurrence, boundary,
    source-existence, case, normalization, and disabled controls.
  - (XLIFF 2.1 Format Style module) The Format Style module uses namespace urn:oasis:names:tc:xliff:fs:2.0
    and defines fs and subFs attributes; fs values are constrained by the module schema.
  - (XLIFF 2.1 ITS module) The ITS module uses the W3C ITS namespace http://www.w3.org/2005/11/its and
    the XLIFF 2.1 mapping adds urn:oasis:names:tc:xliff:itsm:2.1 attributes for domains and language.
  - (XLIFF 2.1 normative schema inventory) The official XLIFF 2.1 schema bundle contains exactly nine
    first-party module XSDs covering Format Style, Glossary, ITS, ITS mapping, Translation Candidates,
    Metadata, Resource Data, Size and Length Restriction, and Validation.
  - (XLIFF 2.1 processing-requirement schema inventory) The official XLIFF 2.1 schema bundle contains
    exactly nine Schematron rule sets covering core processing constraints and the modules that define
    Schematron constraints.
  - '(XLIFF 2.1 advanced validation artifacts) XLIFF 2.1 validation is layered: the release package supplies
    the core XSD, a core Schematron, module XSDs and Schematrons, and an NVDL advanced-validation dispatch
    artifact.'
  - (schemas/xliff_core_2.1.xsd) The XLIFF 2.1 core XSD defines namespace-qualified XML element syntax
    for the core document vocabulary in urn:oasis:names:tc:xliff:document:2.0.
  depth_required: 2
  depth_rationale: 'MUST parse capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Version/namespace consistency fixtures per supported version; legacy-version refusal fixture.
- release_gates:
  - All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: XLIFF-PRESERVE-001
  level: MUST
  category: preserve
  title: Baseline preservation duties
  production_meaning: Unknown constructs, absent-vs-default distinctions, and loss reporting are handled
    so round trips never silently drop data.
  developer_use_case: A developer round-trips files containing constructs the library does not model and
    loses nothing silently.
  provenance:
  - POL-SLC-PRESERVE-01
  - POL-SLC-PRESERVE-02
  - POL-SLC-PRESERVE-03
  - POL-SLC-PRESERVE-04
  required_behavior:
  - Preserve unknown or future-version constructs that can be carried safely; never silently drop unrecognized
    content in lossless mode.
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  - Report every construct that cannot be preserved before saving, through a loss report API, rather than
    failing silently.
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  depth_required: 4
  depth_rationale: Portfolio baseline (preservation) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
