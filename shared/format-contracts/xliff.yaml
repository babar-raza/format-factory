  capability_id: XLIFF-QA-001
  level: SHOULD
  category: validate
  title: Localization quality checks
  production_meaning: Missing/unchanged targets, code mismatches, whitespace/punctuation drift, length
    violations, and inconsistent translations are pluggable QA checks kept separate from conformance errors.
  developer_use_case: A reviewer runs a QA profile and triages warnings without conflating them with format
