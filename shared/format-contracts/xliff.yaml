  normative_rules:
  - (OASIS XLIFF 2.0 — document and file elements) An XLIFF 2.0 document is rooted at <xliff> (namespace
    urn:oasis:names:tc:xliff:document:2.0) with required version and srcLang attributes; it contains one
    or more <file> elements each holding translation units
  - (OASIS XLIFF 2.0 — unit and segment elements) A unit contains at least one segment or ignorable child;
    each segment and ignorable contains exactly one source followed by at most one target.
  - (XLIFF core - document root) XLIFF 2.0 and 2.1 use the core namespace urn:oasis:names:tc:xliff:document:2.0;
    the XLIFF 2.1 standard identifies version 2.1 through the required version attribute.
  - (XLIFF core - extensibility and agent obligations) Foreign-namespace elements and attributes are permitted
    at defined wildcard extension points. Conformant applications should preserve existing custom extensions
    unless their containing elements are removed under applicable processing requirements.
  - (XLIFF core - inline constraints) Inline original-data references must resolve to data elements in
    the same unit. Paired container codes use pc, while spanning start and end codes use sc id and ec
    startRef with the pairing constraints defined by the core Schematron.
  - (XLIFF core - inline elements) Standalone placeholders use ph with a required id; paired containers
    use pc with a required id; spanning pairs use sc with a required id and non-isolated ec with a startRef
