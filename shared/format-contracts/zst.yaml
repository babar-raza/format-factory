format_identity:
  active_content_model:
    has_active_content: false
    policy: Containers carry passive payloads; extraction paths are policy-governed; nothing embedded
      is ever executed.
  data_model_type: archive
  description: 'Zstandard Compressed File: compressed container/stream format (IETF RFC 8878). Framed
    compressed payloads or entry-based archives carrying documents and data.'
  primary_use_cases:
  - Compress and decompress payloads or archive entries reliably and safely
  - Inspect container structure and metadata without full extraction
  - Stream large payloads in bounded memory
authoritative_sources:
- title: IETF RFC 8878
  source_id: SRC-ZST-001
  organization: IETF
  version: RFC 8878
  canonical_url: https://www.rfc-editor.org/info/rfc8878
  authority_class: AUTHORITATIVE
  acquisition_status: URL_ONLY
scope_policy:
  minimum_viable_support: Decode and encode conformant containers with integrity verification, bounded-memory
    streaming, and decompression-bomb protection.
  production_complete_target: 'Full container/frame model of the target specification: framing/entry structure,
    checksums, metadata, streaming and random access where defined, safe extraction with limits, and deterministic
    writing.'
