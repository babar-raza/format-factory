schema_version: "1.0"
description: >-
  Hand-curated many-to-many mapping between spec-coverage feature IDs
  (reports/spec-coverage/manifests/{fmt}-feature-manifest.json) and format-contract
  capability IDs (shared/format-contracts/{fmt}.yaml). Authored by reading both
  systems per format; NOT generated by substring matching (measured 11.4% true
  positive on this data — see plans/.claude/investigate-and-plan-a-snuggly-grove.md).

  Consumed by:
    - V248 validate_coverage_xref_integrity — referential integrity (FAIL) and
      completeness (WARN) over this file.
    - V247 validate_format_coherence — Rule A diagnostics are enriched with the
      coverage items mapped to each unstarted MUST capability.

  Scope: the 6 dual-system formats that have BOTH a feature manifest AND a compiled
  contract. safetensors has a feature manifest but NO contract
  (shared/format-contracts/safetensors.yaml does not exist) and therefore has no
  capability space to map into; it is intentionally absent from this file and V248
  does not require it. If safetensors later gets a contract, V248 emits a
  missing-format WARN as the forcing function to add it here.

  Maintenance: adding a coverage feature or a contract capability without updating
  this file makes V248 WARN (orphaned item). Broken IDs make V248 FAIL.

  Semantics of a mapping: "this coverage feature is evidence bearing on this
  capability". It is deliberately NOT "this feature fully satisfies this
  capability" — a capability is category-scoped (one architectural concern) while
  a coverage feature is spec-construct-scoped, so several IMPLEMENTED features can
  coexist with a NOT_STARTED capability whose remaining duties are broader. Those
  cases are the highest-value V247 Rule A diagnostics.

formats:

  qoi:
    mappings:
    - coverage_id: FACT-QOI-101
      capability_ids: [QOI-PARSE-001, QOI-LIFECYCLE-001]
      rationale: >-
        Real pixel decode (spec: QOI_OP chunk decode loop) is the payload half of
        QOI-PARSE-001's "decode every specified header variant and pixel encoding".
        QOI-LIFECYCLE-001 is included because its load duty returns a populated root
        model — the reconciler observes parse_qoi/parse_qoi_strict as its symbols,
        i.e. the same decode entry points.
    - coverage_id: FACT-QOI-102
      capability_ids: [QOI-MODEL-001, QOI-PARSE-001]
      rationale: >-
        The colorspace header byte is a typed model property (QOI-MODEL-001 "typed
        image structure ... properties"), and QOI-PARSE-001's required_behavior names
        colorspace explicitly in its header-only inspection duty.
    - coverage_id: FACT-QOI-103
      capability_ids: [QOI-WRITE-001]
      rationale: >-
        Pixel encode (QOI_OP chunk encode) is the write path; QOI-WRITE-001 requires
        conformant deterministic encoding with pixel-exact decode-encode-decode.
    unmapped_coverage:
    - FACT-QOI-104  # Streaming/lazy decode — optional, MISSING w/ deferred_reason. QOI
                    # has no performance capability (contrast NRRD-LAZY-001), so there
                    # is no capability counterpart to map. Absence is expected.
    unmapped_capabilities:
    - QOI-CONVERT-001    # depth/channel conversion — no coverage feature enumerates it
    - QOI-EDIT-001       # pixel-region/structural edits — not a spec construct, no feature
    - QOI-PRESERVE-001   # unknown-construct preservation — QOI has no extension space in the manifest
    - QOI-SEC-001        # resource limits/safe defaults — library posture, not a spec feature
    - QOI-VALIDATE-001   # declared-vs-actual payload validation — no coverage feature enumerates it

  ubl:
    mappings:
    - coverage_id: FACT-UBL-101
      capability_ids: [UBL-CALC-001, UBL-MODEL-001]
      rationale: >-
        cac:TaxTotal/TaxSubtotal is the VAT breakdown UBL-CALC-001 reconciles against
        declared totals (reconciler observes _parse_tax_total/_parse_tax_subtotal as
        CALC symbols), and it is a shared aggregate component under UBL-MODEL-001's
        typed-composite duty.
    - coverage_id: FACT-UBL-102
      capability_ids: [UBL-CALC-001, UBL-VALUES-001]
      rationale: >-
        cac:LegalMonetaryTotal carries the line/tax-exclusive/tax-inclusive/payable
        amounts UBL-CALC-001 calculates and compares; the amounts themselves are
        decimal values with currencyID, which is UBL-VALUES-001's duty.
    - coverage_id: FACT-UBL-103
      capability_ids: [UBL-MODEL-001]
      rationale: >-
        PostalAddress/PartyTaxScheme/PartyLegalEntity/Contact/EndpointID are shared
        aggregate components; representing them as typed composites at real depth is
        UBL-MODEL-001. Not mapped to UBL-CALC-001 despite the reconciler listing
        _parse_party_tax_scheme there — that is a category-regex artifact, not a
        calculation duty.
    - coverage_id: FACT-UBL-104
      capability_ids: [UBL-WRITE-001, UBL-PRESERVE-001]
      rationale: >-
        write_ubl silently dropping party data that load_ubl parsed violates
        UBL-WRITE-001's round-trip duty and UBL-PRESERVE-001's "never silently drop"
        baseline. This feature is the correctness fix for both.
    - coverage_id: FACT-UBL-105
      capability_ids: [UBL-DOCTYPES-001]
      rationale: >-
        CreditNote is a supported document type; UBL-DOCTYPES-001 requires a distinct
        typed root per document type plus detect_document_type/supported_document_types.
    - coverage_id: FACT-UBL-110
      capability_ids: [UBL-DOCTYPES-001]
      rationale: >-
        Invoice-2 and Order-2 are document types under the same UBL-DOCTYPES-001
        per-type typed-root duty.
    unmapped_coverage: []
    unmapped_capabilities:
    - UBL-CODELIST-001   # official code-list loading/validation — no coverage feature
    - UBL-EDIT-001       # CRUD with schema-order preservation — not a spec construct
    - UBL-EXT-001        # UBLExtensions containers — not enumerated in the manifest
    - UBL-LIFECYCLE-001  # load/save entry points — generic I/O, no spec feature
    - UBL-PARSE-001      # QName resolution/namespace spoofing — no coverage feature
    - UBL-PROFILE-001    # customization/profile identifiers — no coverage feature
    - UBL-QUERY-001      # find-by-QName/business identifier — library API, no spec feature
    - UBL-REF-001        # duplicate ID/broken reference detection — no coverage feature
    - UBL-SEC-001        # resource limits/safe defaults — library posture
    - UBL-SIGN-001       # signature-safe preservation — no coverage feature
    - UBL-UPGRADE-001    # version migration — no coverage feature
    - UBL-VALIDATE-001   # layered validation orchestration — no coverage feature

  ipynb:
    mappings:
    - coverage_id: FACT-IPYNB-101
      capability_ids: [IPYNB-ID-001]
      rationale: >-
        nbformat 4.5 required cell id (uniqueness, survives load->write, auto-generated
        when absent) is exactly IPYNB-ID-001's validate-and-generate duty. Deliberately
        NOT mapped to IPYNB-PRESERVE-001: that capability covers unknown/future
        constructs, whereas cell id is a known required field.
    - coverage_id: FACT-IPYNB-102
      capability_ids: [IPYNB-ATTACH-001]
      rationale: >-
        Base64 attachments referenced by markdown are IPYNB-ATTACH-001's MIME-bundle
        validation and reference-check duty.
    - coverage_id: FACT-IPYNB-103
      capability_ids: [IPYNB-OUTPUT-001]
      rationale: >-
        Add/get/remove of a specific MIME representation inside a multi-representation
        output is IPYNB-OUTPUT-001's "arbitrary MIME bundles" duty.
    - coverage_id: FACT-IPYNB-104
      capability_ids: [IPYNB-EDIT-001, IPYNB-CLEAN-001]
      rationale: >-
        add_cell/remove_cell is IPYNB-EDIT-001's cell CRUD. clear_outputs is named
        directly in IPYNB-CLEAN-001's required_behavior — but CLEAN-001 additionally
        requires clear-by-type/by-cell, execution-count reset, transient-metadata
        stripping and dry-run reporting, which this feature does not provide. This is
        a depth gap, not a spec-feature absence.
    - coverage_id: FACT-IPYNB-105
      capability_ids: [IPYNB-VALIDATE-001]
      rationale: >-
        Cell id uniqueness/format, output_type enum and required-field-per-output-type
        checks are IPYNB-VALIDATE-001's schema-and-semantic validation duty.
    - coverage_id: FACT-IPYNB-106
      capability_ids: [IPYNB-UPGRADE-001]
      rationale: >-
        nbformat v1-3 -> v4 and v4.0<->4.5 conversion is IPYNB-UPGRADE-001's version
        conversion framework. Note the coherence signal: this feature is optional-tier
        and consciously deferred, while the capability is MUST and NOT_STARTED — the
        two systems rank the same work differently.
    - coverage_id: FACT-IPYNB-110
      capability_ids: [IPYNB-MODEL-001]
      rationale: >-
        code/markdown/raw cell types are IPYNB-MODEL-001's "model every specified cell
        type with typed accessors".
    - coverage_id: FACT-IPYNB-111
      capability_ids: [IPYNB-OUTPUT-001]
      rationale: >-
        stream/display_data/execute_result/error are the specified output types
        IPYNB-OUTPUT-001 must support.
    unmapped_coverage: []
    unmapped_capabilities:
    - IPYNB-DIFF-001      # structure-aware diff — library capability, no spec feature
    - IPYNB-EXEC-001      # isolated execution adapter — explicitly out of core
    - IPYNB-EXPORT-001    # exporter adapters — cross-product, no spec feature
    - IPYNB-LIFECYCLE-001 # load/save entry points — generic I/O
    - IPYNB-MERGE-001     # three-way merge — library capability, no spec feature
    - IPYNB-META-001      # metadata preservation w/ typed adapters — no coverage feature
    - IPYNB-PARSE-001     # multiline text repr / lossless JSON — no coverage feature
    - IPYNB-PRESERVE-001  # unknown-construct preservation — no coverage feature
    - IPYNB-SANITIZE-001  # active-content sanitization — library posture
    - IPYNB-SEC-001       # resource limits/safe defaults — library posture
    - IPYNB-TRUST-001     # trust notary integration — library posture
    - IPYNB-WRITE-001     # deterministic JSON serialization — no coverage feature

  xliff:
    mappings:
    - coverage_id: FACT-XLIFF-101
      capability_ids: [XLIFF-INLINE-001]
      rationale: >-
        pc/sc/ec/ph/mrk with id/dataRef preserved as structured objects is
        XLIFF-INLINE-001's token-tree duty, including its paired-code relationships,
        identity and original-data (dataRef) references.
    - coverage_id: FACT-XLIFF-102
      capability_ids: [XLIFF-STATE-001, XLIFF-WRITE-001]
      rationale: >-
        The segment @state attribute is XLIFF-STATE-001's translation-state model;
        write_xliff failing to emit what load_xliff read is an XLIFF-WRITE-001
        round-trip defect.
    - coverage_id: FACT-XLIFF-103
      capability_ids: [XLIFF-NOTE-001]
      rationale: >-
        notes/note attached to file/group/unit are XLIFF-NOTE-001's notes-and-
        annotations duty.
    - coverage_id: FACT-XLIFF-104
      capability_ids: [XLIFF-MODEL-001]
      rationale: >-
        group nesting is part of XLIFF-MODEL-001's "full core hierarchy with tree
        order ... preserved through edits"; flattening it loses that hierarchy.
    - coverage_id: FACT-XLIFF-110
      capability_ids: [XLIFF-MODEL-001]
      rationale: >-
        file/unit/segment are the core structural elements XLIFF-MODEL-001 models as
        typed XliffDocument/File/Unit/Segment.
    unmapped_coverage: []
    unmapped_capabilities:
    - XLIFF-LIFECYCLE-001 # load/save entry points — generic I/O
    - XLIFF-MERGE-001     # extraction/merge skeletons — no spec feature
    - XLIFF-MODULE-001    # optional-module coverage declaration — no coverage feature
    - XLIFF-PARSE-001     # version-aware namespace parsing — no coverage feature
    - XLIFF-PRESERVE-001  # unknown-construct preservation — no coverage feature
    - XLIFF-QA-001        # localization QA checks — no spec feature
    - XLIFF-SEC-001       # resource limits/safe defaults — library posture
    - XLIFF-SEG-001       # split/join segmentation — no coverage feature
    - XLIFF-TEXT-001      # source/target text editing — no coverage feature
    - XLIFF-VALIDATE-001  # core+module validation — no coverage feature

  nrrd:
    mappings:
    - coverage_id: FACT-NRRD-101
      capability_ids: [NRRD-ARRAY-001, NRRD-ENC-001, NRRD-TYPES-001]
      rationale: >-
        Decoding the payload into real typed values reshaped per sizes spans three
        capabilities: NRRD-ENC-001 (raw/gzip decode framing), NRRD-TYPES-001 (declared
        scalar type -> host representation) and NRRD-ARRAY-001 (shape/dtype/element
        access over the result).
    - coverage_id: FACT-NRRD-102
      capability_ids: [NRRD-SHAPE-001]
      rationale: >-
        NRRD-SHAPE-001 is titled "Dimensions, axis order, and endian correctness" and
        requires converting to host order only where specified — byte-swapping on
        declared-endian mismatch is that duty.
    - coverage_id: FACT-NRRD-103
      capability_ids: [NRRD-HEADER-001, NRRD-PAYLOAD-001]
      rationale: >-
        line skip / byte skip are header fields (NRRD-HEADER-001 field parsing) whose
        only purpose is locating the payload start (NRRD-PAYLOAD-001 attached/detached
        payload handling).
    - coverage_id: FACT-NRRD-104
      capability_ids: [NRRD-SPACE-001, NRRD-ARRAY-001]
      rationale: >-
        kinds distinguishes domain (spatial) from range (vector/tensor/colour) axes;
        NRRD-SPACE-001 explicitly requires non-spatial-axis handling, and NRRD-ARRAY-001
        carries per-axis metadata.
    - coverage_id: FACT-NRRD-105
      capability_ids: [NRRD-SPACE-001]
      rationale: >-
        space / space directions / space origin are NRRD-SPACE-001's orientation
        metadata and index-to-world transform duty.
    - coverage_id: FACT-NRRD-106
      capability_ids: [NRRD-HEADER-001, NRRD-META-001]
      rationale: >-
        key:=value lines are NRRD-HEADER-001's key/value metadata parsing; preserving
        them with correct quoting/escaping is NRRD-META-001's fidelity duty.
    - coverage_id: FACT-NRRD-110
      capability_ids: [NRRD-ENC-001]
      rationale: >-
        raw and gzip are two of the encodings NRRD-ENC-001 must read and write with
        correct container framing.
    unmapped_coverage: []
    unmapped_capabilities:
    - NRRD-CONVERT-001   # dtype/encoding/endian conversion policies — no coverage feature
    - NRRD-LAZY-001      # lazy/mmap/streaming I/O — no coverage feature (contrast FACT-QOI-104)
    - NRRD-LIFECYCLE-001 # load/save entry points — generic I/O
    - NRRD-PRESERVE-001  # unknown-construct preservation — no coverage feature
    - NRRD-SEC-001       # resource limits/safe defaults — library posture
    - NRRD-VALIDATE-001  # header/payload validation — no coverage feature
    - NRRD-WRITE-001     # canonical/lossless writing — no coverage feature

  mtlx:
    mappings:
    - coverage_id: FACT-MTLX-101
      capability_ids: [MTLX-WRITE-001, MTLX-MODEL-001]
      rationale: >-
        write_mtlx dropping the generic nodes bucket (nodedef/typedef/look/propertyset/
        plain nodes) violates MTLX-WRITE-001's lossless-write duty; MTLX-MODEL-001 is
        the element model those kinds belong to.
    - coverage_id: FACT-MTLX-102
      capability_ids: [MTLX-DEF-001, MTLX-NAME-001, MTLX-GRAPH-001]
      rationale: >-
        Turning nodename/interfacename strings into traversable edges is the resolution
        step MTLX-DEF-001 performs (reconciler observes resolve_connections as its
        symbol) and MTLX-NAME-001's qualified-reference resolution. MTLX-GRAPH-001 is
        included because its traversal/topological-order duties consume that edge set —
        but GRAPH-001 also owns node create/remove/clone/rename and cycle detection,
        which this feature does not provide.
    - coverage_id: FACT-MTLX-103
      capability_ids: [MTLX-MODEL-001]
      rationale: >-
        MTLX-MODEL-001 requires modelling elements with their category; reporting the
        node's function/category is that duty. Deliberately NOT mapped to
        MTLX-TYPES-001 — data type is precisely what this feature says the histogram
        must stop reporting.
    - coverage_id: FACT-MTLX-104
      capability_ids: [MTLX-MAT-001]
      rationale: >-
        volumematerial and legacy shaderref/bindinput are material/shader-binding forms
        under MTLX-MAT-001. Not mapped to MTLX-UPGRADE-001: recognising legacy forms is
        not the same as running an ordered upgrade transform with a migration ledger.
    - coverage_id: FACT-MTLX-110
      capability_ids: [MTLX-MODEL-001, MTLX-PARSE-001]
      rationale: >-
        The materialx root is what MTLX-PARSE-001 recognises (root + version); materials
        and nodegraphs are elements under MTLX-MODEL-001.
    unmapped_coverage: []
    unmapped_capabilities:
    - MTLX-COLOR-001     # color-space metadata resolution — no coverage feature
    - MTLX-GEOM-001      # geometry paths/token substitution — no coverage feature
    - MTLX-INCLUDE-001   # include/search-path resolution w/ limits — no coverage feature
    - MTLX-LIB-001       # standard-library load/precedence — no coverage feature
    - MTLX-LIFECYCLE-001 # load/save entry points — generic I/O
    - MTLX-LOOK-001      # looks/collections/assignment precedence — no coverage feature
    - MTLX-PRESERVE-001  # unknown-construct preservation — no coverage feature
    - MTLX-SEC-001       # resource limits/safe defaults — library posture
    - MTLX-SHADER-001    # codegen adapters (MAY) — explicitly out of core
    - MTLX-TRANSFORM-001 # graph transforms (flatten/prune) — no coverage feature
    - MTLX-TYPES-001     # value/type system — no coverage feature (see FACT-MTLX-103 note)
    - MTLX-UNIT-001      # units and unit conversion — no coverage feature
    - MTLX-UPGRADE-001   # document upgrade framework — no coverage feature
    - MTLX-VALIDATE-001  # structural/semantic validation — no coverage feature
    - MTLX-VARIANT-001   # variants and variant sets — no coverage feature
