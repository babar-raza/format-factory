  - (spec) TOML file extension is .toml and MIME type is application/toml
  - (spec) TOML control characters other than tab (U+0009) must be escaped in basic strings
  - (spec) TOML integer literals must not have leading zeros except for the 0 value itself
  - (spec) TOML float values must have at least one digit on both sides of the decimal point
  - (spec) TOML float underscores must be surrounded by at least one digit on each side
  - (spec) TOML integer range must fit in a 64-bit signed integer; parsers may accept larger values
  - (spec) TOML multi-line basic strings allow a line-ending backslash to trim whitespace and the following
