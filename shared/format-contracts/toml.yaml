  required_behavior:
  - Expose typed accessors and path-based navigation over nested structures.
  - Preserve document key order where the format defines or conventionally preserves it.
  normative_rules:
  - (spec) TOML (Tom's Obvious Minimal Language) version 1.0.0 is the current stable specification
  - (spec) A TOML file must be a valid UTF-8 encoded document
  - (spec) TOML is case-sensitive; key names and value types distinguish uppercase and lowercase
  - (spec) TOML key-value pairs are defined as key = value on a single line
  - (spec) Whitespace around the key-value pair equals sign is ignored in TOML
  - (spec) TOML bare keys may only contain ASCII letters, ASCII digits, dashes, and underscores
  - (spec) TOML bare keys may be composed entirely of ASCII digits but are still interpreted as strings
  - (spec) TOML quoted keys use basic string or literal string syntax and allow any Unicode characters
    as key names
  - (spec) TOML dotted keys use dot notation to create nested structures without explicit table headers
  - (spec) TOML booleans are the lowercase keywords true and false
  - (spec) TOML arrays are ordered sequences of values enclosed in square brackets and separated by commas
  - (spec) TOML arrays may contain mixed value types including nested arrays
  - (spec) TOML inline tables are single-line key-value collections enclosed in curly braces
  - (spec) TOML inline tables must appear on a single line and do not allow trailing commas
  - (spec) TOML standard tables are defined by a header in square brackets on its own line
  - (spec) TOML table headers define the namespace for all key-value pairs that follow until the next
    table or array-of-tables header
  - (spec) TOML table names follow the same key definition rules as regular keys including dotted key
    support
  - (spec) Defining a table with the same name twice in a TOML document is an error
  - (spec) TOML arrays of tables are defined by double square bracket headers and create an array of table
    objects
  - (spec) TOML array-of-tables entries may contain key-value pairs and sub-tables like regular tables
  - (spec) TOML keys must be non-empty; an empty bare key is an error
  - (spec) TOML does not permit defining a key twice in the same table; it is an error
  - (spec) TOML inline table keys follow the same uniqueness rules as regular table keys
  - (spec) TOML inline tables are immutable; once defined they cannot be extended with additional keys
  - (spec) TOML dotted keys may not reopen a table or inline table previously defined
  - (spec) TOML table array entries create homogeneous array elements; you cannot mix array-of-tables
    and regular table with the same name
  - (spec) TOML top-level document is itself an implicit table containing all key-value pairs and subtables
  - (spec) TOML keys at any level may use whitespace around the dot separator in dotted keys
  - '(spec) TOML values may be one of six types: string, integer, float, boolean, datetime, array, or
    inline table'
  - (spec) TOML table header names are trimmed of surrounding whitespace before comparison
  - (spec) TOML does not permit bare newlines inside inline tables
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Path navigation and order preservation verified on nested fixtures.
- release_gates:
  - Grammar coverage demonstrated against the specification's own examples and invalid cases.
  capability_id: TOML-PARSE-001
  level: MUST
  category: parse
  title: Grammar-conformant parsing
  production_meaning: The library accepts exactly the documents the specification grammar accepts and
    rejects what it rejects, with position-accurate diagnostics, so conformance disagreements with other
    implementations do not corrupt data.
  developer_use_case: A developer loads documents produced by any conformant tool and receives the same
    typed structure that tool intended.
  provenance:
  - POL-CFG-PARSE-01
  - POL-CFG-PARSE-02
  - POL-CFG-PARSE-03
