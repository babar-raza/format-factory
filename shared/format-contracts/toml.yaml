  - (spec) TOML datetime offset Z means UTC (equivalent to +00:00 offset)
  - (spec) TOML datetime millisecond and sub-second precision is supported with fractional seconds
  - (spec) TOML table array entries create homogeneous array elements; you cannot mix array-of-tables
