format_identity:
  active_content_model:
    has_active_content: false
    policy: Format carries passive data only; no execution, rendering, or external resolution is ever
      required to process it.
  data_model_type: text
  description: 'Newline Delimited JSON: structured text data format (Informal (ndjson.org) v1). Typed
    keyed values and nested structures used for configuration and record streams across programming ecosystems.'
  primary_use_cases:
  - Application and tool configuration authored by humans and written back by tools
  - Typed data interchange between services and build systems
  - Streaming or record-oriented structured data processing
authoritative_sources:
- title: Informal (ndjson.org) v1
  source_id: SRC-NDJSON-001
  organization: Informal (ndjson.org)
  version: v1
  canonical_url: null
  authority_class: AUTHORITATIVE
  acquisition_status: NEEDS_AUTHORITY
scope_policy:
  minimum_viable_support: Load and save conformant documents with correct typing of all value kinds; expose
    a typed model; report syntax and type errors with positions.
  production_complete_target: Read, create, edit, validate, and write every value type, structure, and
    syntax rule of the target specification with lossless round-trip of comments, formatting, and key
    order where the format defines or conventionally preserves them.
capabilities:
- release_gates:
  - Every mutation operation proven by round-trip and locality tests.
  capability_id: NDJSON-EDIT-001
  level: MUST
  category: edit
  title: Structure-safe mutation
  production_meaning: Values, keys, and nested structures can be created, updated, and removed with grammar
    invariants (key uniqueness, structure shape) enforced or diagnosed at edit time.
  developer_use_case: A developer updates a config value and adds a nested section programmatically, then
    saves without breaking the document's validity or unrelated formatting.
  provenance:
  - POL-CFG-EDIT-01
  - POL-CFG-EDIT-02
  required_behavior:
  - Create, update, and remove keys, values, and nested structures with duplicate-key and shape rules
    enforced.
  - Edits do not disturb unrelated content, comments, or formatting in lossless mode.
  depth_required: 4
  depth_rationale: 'MUST edit capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Each mutation class has save-reload-verify plus untouched-region byte comparison in lossless mode.
- release_gates:
  - All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: NDJSON-LIFECYCLE-001
  level: MUST
  category: lifecycle
  title: Baseline lifecycle I/O
  production_meaning: Load/save/bytes round-trip, version exposure, strict and tolerant read modes, first-class
    validation, deterministic serialization.
  developer_use_case: A developer integrates the library with only lifecycle APIs and never needs format-internal
    knowledge for I/O plumbing.
  provenance:
  - POL-SLC-LIFECYCLE-01
  - POL-SLC-LIFECYCLE-02
  - POL-SLC-LIFECYCLE-03
  - POL-SLC-LIFECYCLE-04
  - POL-SLC-LIFECYCLE-05
  - POL-SLC-LIFECYCLE-06
  required_behavior:
  - Provide load from filesystem path, readable stream, and in-memory bytes, returning the format's root
    document/model object.
  - Provide save to filesystem path and writable stream, plus serialization to bytes, producing output
    the library's own loader accepts.
  - Expose the detected format version and any declared version separately; never silently rewrite a declared
    version.
  - Support a strict read mode that rejects malformed input with diagnostics and a tolerant read mode
    that recovers where the format permits, with recovery actions reported.
  - Expose validation as a first-class callable operation returning structured diagnostics, not only as
    exceptions raised during parsing.
  - Offer deterministic serialization such that an unchanged loaded document serializes to identical bytes
    across repeated calls in the same mode.
  depth_required: 4
  depth_rationale: Portfolio baseline (lifecycle_io) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - Model APIs cover every construct the parser produces.
  capability_id: NDJSON-MODEL-001
  level: MUST
  category: model
  title: Typed document object model
  production_meaning: Keys, values, nested structures, and ordering are exposed as a typed navigable model
    with path-based access, not raw dictionaries only.
  developer_use_case: A developer navigates nested structures by path, enumerates keys in document order,
    and inspects value types without manual casting.
  provenance:
  - POL-CFG-MODEL-01
  - POL-CFG-MODEL-02
  - SAL-NDJSON-00002
  - SAL-NDJSON-00011
  required_behavior:
  - Expose typed accessors and path-based navigation over nested structures.
  - Preserve document key order where the format defines or conventionally preserves it.
  normative_rules:
  - '(spec) NDJSON field: a key-value pair within a JSON object record'
  - (spec) NDJSON is equivalent to JSON Lines format which uses the same one-value-per-line structure
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Path navigation and order preservation verified on nested fixtures.
- release_gates:
  - Grammar coverage demonstrated against the specification's own examples and invalid cases.
  capability_id: NDJSON-PARSE-001
  level: MUST
  category: parse
  title: Grammar-conformant parsing
  production_meaning: The library accepts exactly the documents the specification grammar accepts and
    rejects what it rejects, with position-accurate diagnostics, so conformance disagreements with other
    implementations do not corrupt data.
  developer_use_case: A developer loads documents produced by any conformant tool and receives the same
    typed structure that tool intended.
  provenance:
  - POL-CFG-PARSE-01
  - POL-CFG-PARSE-02
  - POL-CFG-PARSE-03
  - SAL-NDJSON-00003
  - SAL-NDJSON-00008
  - SAL-NDJSON-00012
  - SAL-NDJSON-00013
  - SAL-NDJSON-00015
  required_behavior:
  - Implement the specification grammar completely - every production, terminator, and whitespace/comment
    rule.
  - Report syntax violations with line/column positions and the violated grammar rule in strict mode.
  - Parse from path, stream, and bytes with identical results.
  normative_rules:
  - (spec) NDJSON files contain one valid JSON value per line separated by newline characters
  - (spec) NDJSON lines must not contain embedded unescaped newlines within string values
  - (spec) NDJSON trailing newline after the last record is optional
  - (spec) NDJSON parsers must handle each line independently so malformed lines do not prevent parsing
    others
  - (spec) NDJSON files may contain comments only if the consuming application explicitly allows them
    as an extension
  depth_required: 2
  depth_rationale: 'MUST parse capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Specification example corpus parses; grammar negative fixtures rejected with correct positions.
- release_gates:
  - All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: NDJSON-PRESERVE-001
  level: MUST
  category: preserve
  title: Baseline preservation duties
  production_meaning: Unknown constructs, absent-vs-default distinctions, and loss reporting are handled
    so round trips never silently drop data.
  developer_use_case: A developer round-trips files containing constructs the library does not model and
    loses nothing silently.
  provenance:
  - POL-SLC-PRESERVE-01
  - POL-SLC-PRESERVE-02
  - POL-SLC-PRESERVE-03
  - POL-SLC-PRESERVE-04
  required_behavior:
  - Preserve unknown or future-version constructs that can be carried safely; never silently drop unrecognized
    content in lossless mode.
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  - Report every construct that cannot be preserved before saving, through a loss report API, rather than
    failing silently.
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  depth_required: 4
  depth_rationale: Portfolio baseline (preservation) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: NDJSON-SEC-001
  level: MUST
  category: security
  title: Baseline security posture
  production_meaning: Input limits, no implicit external effects, traversal protection, untrusted-payload
    discipline, and complexity-attack guards are enforced with diagnostics.
  developer_use_case: A developer processes untrusted input with safe defaults and only opts into external
    effects explicitly.
  provenance:
  - POL-SLC-SEC-01
  - POL-SLC-SEC-02
  - POL-SLC-SEC-03
  - POL-SLC-SEC-04
  - POL-SLC-SEC-05
  required_behavior:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  depth_required: 5
  depth_rationale: Portfolio baseline (security_limits) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
    test proving refusal with diagnostics.
- release_gates:
  - All specified value kinds round-trip with type and precision fidelity.
  capability_id: NDJSON-TYPES-001
  level: MUST
  category: model
  title: Complete value-type system
  production_meaning: Every value kind the specification defines is represented with correct typing, precision,
    and lexical fidelity - no silent coercion between types or precision loss.
  developer_use_case: A developer reads and writes every specified value kind and gets the same typed
    value back after a round trip.
  provenance:
  - POL-CFG-TYPES-01
  - POL-CFG-TYPES-02
  - SAL-NDJSON-00001
  - SAL-NDJSON-00002
  - SAL-NDJSON-00003
  - SAL-NDJSON-00006
  - SAL-NDJSON-00008
  - SAL-NDJSON-00010
  - SAL-NDJSON-00011
  - SAL-NDJSON-00014
  required_behavior:
  - Represent every specified value kind distinctly with documented host-language mappings.
  - Preserve numeric precision and value-form distinctions the specification treats as significant; report
    out-of-range values.
  normative_rules:
  - '(spec) NDJSON record: one complete JSON value per line'
  - '(spec) NDJSON field: a key-value pair within a JSON object record'
  - (spec) NDJSON files contain one valid JSON value per line separated by newline characters
  - (spec) NDJSON each line may be any valid JSON type including object, array, string, number, boolean,
    or null
  - (spec) NDJSON lines must not contain embedded unescaped newlines within string values
  - (spec) NDJSON files use the .ndjson file extension and MIME type application/x-ndjson
  - (spec) NDJSON is equivalent to JSON Lines format which uses the same one-value-per-line structure
  - (spec) NDJSON number encoding follows JSON RFC 8259 with no leading zeros and optional exponent notation
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - 'Type matrix fixtures: every value kind in minimal and edge forms, round-tripped.'
- release_gates:
  - Every documented validation rule maps to at least one negative test.
  capability_id: NDJSON-VALIDATE-001
  level: MUST
  category: validate
  title: Layered validation with typed diagnostics
  production_meaning: Lexical, syntax, type, and structural rules are validated as separate layers returning
    all diagnostics, so pipelines can gate on machine-readable results.
  developer_use_case: A developer validates untrusted input and receives every violation with positions
    and stable codes before deciding to process it.
  provenance:
  - POL-CFG-VALIDATE-01
  - SAL-NDJSON-00003
  - SAL-NDJSON-00005
  - SAL-NDJSON-00006
  - SAL-NDJSON-00008
  - SAL-NDJSON-00013
  required_behavior:
  - Validate lexical, syntax, type, and structural layers independently, returning all diagnostics with
    positions and stable codes.
  normative_rules:
  - (spec) NDJSON files contain one valid JSON value per line separated by newline characters
  - (spec) NDJSON files must be encoded in UTF-8 without BOM
  - (spec) NDJSON each line may be any valid JSON type including object, array, string, number, boolean,
    or null
  - (spec) NDJSON lines must not contain embedded unescaped newlines within string values
  - (spec) NDJSON parsers must handle each line independently so malformed lines do not prevent parsing
    others
  depth_required: 5
  depth_rationale: 'MUST validate capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Positive and negative fixtures per layer; diagnostics carry stable codes and positions.
- release_gates:
  - Writer proven by parser round-trip and determinism byte-compare.
  capability_id: NDJSON-WRITE-001
  level: MUST
  category: write
  title: Conformant and deterministic serialization
  production_meaning: Output always re-parses to the same typed content, respects the specification's
    encoding rules, and is deterministic; lossless mode preserves comments and formatting where recorded.
  developer_use_case: A developer saves an edited document and diff against the original shows only the
    intended change.
  provenance:
  - POL-CFG-WRITE-01
  - POL-CFG-WRITE-02
  - SAL-NDJSON-00008
  required_behavior:
  - Serialize every value kind in specification-conformant form that re-parses identically.
  - Offer lossless mode (comments, formatting, ordering preserved) and normalized mode (canonical style)
    as an explicit caller choice.
  normative_rules:
  - (spec) NDJSON lines must not contain embedded unescaped newlines within string values
  depth_required: 4
  depth_rationale: 'MUST write capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Deterministic double-serialization; lossless-mode minimal-diff fixtures; escape-required content round-trips.
preservation_contract:
  lexical_roundtrip:
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  loss_reporting_policy: Report every construct that cannot be preserved before saving, through a loss
    report API, rather than failing silently.
  structural_roundtrip:
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  unknown_construct_policy: Preserve unknown or future-version constructs that can be carried safely;
    never silently drop unrecognized content in lossless mode.
validation_contract:
  diagnostic_schema:
    fields:
    - code
    - severity
    - message
    - source_location
    - object_path
    - originating_rule
    - repair_suggestion
    - auto_repair_eligible
  layers:
  - description: Character and encoding validity plus token-level rules.
    layer: lexical
  - description: 'Grammar conformance: structure, terminators, nesting.'
    layer: syntax
  - description: 'Value-type rules: permitted forms, ranges, uniqueness.'
    layer: type
  - description: 'Document-level rules: duplicate keys, table/record shape.'
    layer: structural
  - description: Input size, nesting depth, and payload limits.
    layer: security
security_contract:
  attack_surfaces:
  - Deeply nested structures causing stack exhaustion during parsing.
  - Oversized documents or values causing unbounded memory allocation.
  - Numeric edge forms (huge integers, special floats) causing overflow or precision corruption in consumers.
  limits:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  safe_defaults:
  - Bounded nesting depth, document size, and value size with configurable limits.
  - Checked numeric parsing that reports range violations instead of silently wrapping.
test_contract:
- Test official or authoritative valid samples, invalid samples, synthetic edge cases, malformed inputs,
  and hostile inputs for every claimed capability.
- Prove parse-save-parse semantic equivalence for representative documents of every supported construct.
- Prove deterministic output by serializing the same document twice and byte-comparing.
- Publish a capability manifest stating supported versions, constructs, limitations, and lossless guarantees,
  verified against implementation and tests.
- Each mutation class has save-reload-verify plus untouched-region byte comparison in lossless mode.
- Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Path navigation and order preservation verified on nested fixtures.
- Specification example corpus parses; grammar negative fixtures rejected with correct positions.
- Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
  test proving refusal with diagnostics.
- 'Type matrix fixtures: every value kind in minimal and edge forms, round-tripped.'
- Positive and negative fixtures per layer; diagnostics carry stable codes and positions.
- Deterministic double-serialization; lossless-mode minimal-diff fixtures; escape-required content round-trips.
release_gates:
- Every mutation operation proven by round-trip and locality tests.
- All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Model APIs cover every construct the parser produces.
- Grammar coverage demonstrated against the specification's own examples and invalid cases.
- All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- All specified value kinds round-trip with type and precision fidelity.
- Every documented validation rule maps to at least one negative test.
- Writer proven by parser round-trip and determinism byte-compare.
- Capability manifest published and independently verified against implementation and tests.
