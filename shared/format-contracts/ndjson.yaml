  - .jsonl
  family: config_data
  target_spec_version: v1
  source_authority_status: NEEDS_AUTHORITY
  generator_version: fcl-compiler/1.0.0
  lifecycle_status: DRAFT
  confidence: low
  supersedes: null
  input_digests:
    fact_categories_sha256: aedd4c838073695752c724e8f53fd189f58653ca22e01b88f5932ebe9fe376bc
