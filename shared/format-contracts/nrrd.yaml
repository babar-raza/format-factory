  active_content_model:
    has_active_content: false
    policy: Payloads are passive data; detached-file resolution follows a secure path policy and never
      leaves configured roots.
  data_model_type: scientific_array
  description: 'Nearly Raw Raster Data: N-dimensional array/raster data format (Teem Project NRRD0005).
    Header metadata describing typed, dimensioned payloads used for scientific, medical, and machine-learning
    data.'
  primary_use_cases:
  - Read and write typed N-dimensional arrays with correct shape, type, and byte order
  - Header-only and lazy access to very large datasets in bounded memory
  - Validate untrusted data files safely before allocation or processing
