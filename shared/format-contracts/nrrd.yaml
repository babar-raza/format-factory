scope_policy:
  minimum_viable_support: Parse headers with required-field validation, read/write the core encodings
    and types with correct shape and endian handling, and validate payload size against declared shape
    before allocation.
  production_complete_target: Complete header parsing for all specified fields and versions, every defined
    encoding and scalar type, endian correctness, attached and detached payload forms, axis/orientation
    metadata, lazy and streaming access, layered validation, and lossless canonical writing.
capabilities:
- release_gates:
  - Array operations preserve metadata consistency (tested per op).
  capability_id: NRRD-ARRAY-001
  level: MUST
  category: model
  title: Typed N-dimensional array access
  production_meaning: Shape/strides/dtype-aware access with slicing, permutation, flip, and crop that
    update orientation and per-axis metadata correctly; zero-copy views where safe.
  developer_use_case: A developer crops a volume and every axis-aligned metadata field follows the crop.
  provenance:
  - POL-SCR-ARRAY-01
  - RF-NRRD-00001
  required_behavior:
  - Expose shape, strides, dtype, and axis metadata with element access, slicing, permutation, flip, and
    crop that update orientation and per-axis metadata; zero-copy views where safe, explicit copies otherwise.
  - Expose typed N-dimensional array access with shape, strides, dtype, slicing, axis permutation, flip,
    and crop where orientation and per-axis metadata follow every operation - the imaging-pipeline core.
  depth_required: 6
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Metadata-follows-operation fixtures for each axis operation.
- release_gates:
  - Conversions policy-governed and reported (no silent semantic change).
  capability_id: NRRD-CONVERT-001
  level: SHOULD
  category: transform
  title: Data conversion
  production_meaning: Dtype/encoding/endian/layout conversions run with explicit overflow/clipping/rounding
    policies and produce a conversion report; semantics never change silently.
  developer_use_case: A developer converts float data to a narrower type under an explicit clipping policy
    with a report of affected values.
  provenance:
  - POL-SCR-CONVERT-01
  required_behavior:
  - Convert dtype, encoding, attached/detached form, and endian with explicit overflow/clipping/scaling/rounding
    policies and a conversion report.
  depth_required: 4
  depth_rationale: 'SHOULD transform capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Policy matrix fixtures with boundary values.
- release_gates:
  - All defined encodings round-trip.
  capability_id: NRRD-ENC-001
  level: MUST
  category: parse
  title: All defined encodings
  production_meaning: Every specified payload encoding (raw, text, hex, compressed forms) reads and writes
    with codec availability exposed and explicit failures when optional codecs are absent.
  developer_use_case: A developer queries supported encodings at runtime and receives explicit errors
    rather than silent fallbacks.
  provenance:
  - POL-SCR-ENC-01
  - SAL-NRRD-00013
  - RF-NRRD-00005
  required_behavior:
  - Read and write every specified encoding using the correct container framing; expose codec availability;
    fail explicitly when an optional codec is unavailable.
  - Test every magic version, every type alias, every encoding, endian combinations, attached plus all
    detached data-file forms, and hostile fixtures (decompression bombs, overflow shapes, traversal paths,
    truncated payloads).
  normative_rules:
  - (NRRD format - encoding field) The encoding field is required and declares the payload encoding as
    raw, text or ASCII, hex, gzip, or bzip2 using the specification's defined aliases and lexical rules
  depth_required: 2
  depth_rationale: 'MUST parse capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Encoding matrix round trips; missing-codec explicit-failure fixture.
  - Full matrix as enumerated with hostile-fixture negatives.
- release_gates:
  - Measurement-frame math and NRRD0005-only applicability are independently proven.
  capability_id: NRRD-FRAME-001
  level: MUST
  category: model
  title: NRRD0005 measurement frame
  production_meaning: NRRD0005 measurement-frame vectors transform coefficients of non-scalar measurements
    into the surrounding space basis and validate independently from index-to-world orientation.
  developer_use_case: A diffusion-imaging developer transforms tensor coefficients through the declared
    measurement frame without confusing it with voxel orientation.
  provenance:
  - POL-SCR-FRAME-01
  - SAL-NRRD-00024
  required_behavior:
  - Model measurement frames only for NRRD0005; require exactly space-dimension vectors and expose an
    explicit measurement-to-world transform separate from index-to-world.
  normative_rules:
  - (Teem NRRD Format Specification Sections 1.1 and 4) Starting with NRRD0005, measurement frame supplies
    exactly space-dimension vectors that transform measurement coefficients into the surrounding space
    basis
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Identity, rotated, and non-orthogonal frame fixtures; cardinality and NRRD0001-NRRD0004 rejection
    negatives.
- release_gates:
  - Baseline header grammar is proven independently from later-version feature parsing.
  capability_id: NRRD-HEADER-001
  level: MUST
  category: parse
  title: Baseline header parsing
  production_meaning: Magic/version forms, ordinary field specifications, comments, line endings, uniqueness,
    and ordering parse without assigning later-version constructs to earlier profiles.
  developer_use_case: A developer inspects any conformant file's full metadata without touching the payload.
  provenance:
  - POL-SCR-HEADER-01
  - POL-SCR-HEADER-02
  - SAL-NRRD-00002
  - SAL-NRRD-00004
  - SAL-NRRD-00005
  - SAL-NRRD-00007
  - SAL-NRRD-00008
  required_behavior:
  - Recognize every specified magic/version; parse ordinary fields and comments; enforce field uniqueness/ordering;
    preserve unknown metadata and optional-field absence.
  - Accept the specification's permitted line endings and lexical variants while preserving original lexical
    form in lossless mode.
  normative_rules:
  - (Teem NRRD Format Specification — Sections 1.1 and 1.2) Across NRRD0001 through NRRD0005, an attached
    file starts with an ASCII magic and header made of field specifications and comments, ends the header
    with a blank line, and then stores the data payload; readers accept both LF and CRLF line endings
  - (NRRD format - magic and header structure) A NRRD file begins with a magic line of the form NRRD000X
    identifying the format version followed by header lines terminated by a blank line
  - (NRRD format - comments) Comment lines begin with a hash character inside the header and carry no
    field semantics but may be preserved
  - (NRRD format - field identifier rules) Field identifiers are case-insensitive and each field may appear
    at most once for the header to be valid
  - (Teem NRRD Format Specification — Section 1.2) Every ordinary NRRD header field specification uses
    a field identifier, a colon followed by one space, and a field value; no whitespace may precede the
    field identifier
  depth_required: 2
  depth_rationale: 'MUST parse capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Every magic/version fixture; LF/CRLF fixtures; duplicate-field, leading-whitespace, and ordering negatives.
- release_gates:
  - Key/value metadata has exact profile and lexical round-trip proof.
  capability_id: NRRD-KEYVALUE-001
  level: MUST
  category: model
  title: NRRD0002 key/value metadata
  production_meaning: From NRRD0002 onward, arbitrary key/value metadata preserves the exact delimiter,
    escaping, duplicate-key, ordering, and empty-value semantics defined by the format.
  developer_use_case: A developer round-trips custom acquisition metadata without losing empty values,
    newlines, backslashes, or duplicate-key resolution semantics.
  provenance:
  - POL-SCR-KEYVALUE-01
  - SAL-NRRD-00021
  required_behavior:
  - Parse, validate, preserve, edit, and write key/value pairs only for NRRD0002 and newer, implementing
    newline/backslash escaping, forbidden key delimiters, and last-value-wins duplicate behavior.
  normative_rules:
  - (Teem NRRD Format Specification Sections 1.1 and 1.2) Starting with NRRD0002, header lines may carry
    key/value pairs as key:=value with defined newline and backslash escaping, last-value-wins duplicate-key
    behavior, and no := substring in a key
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - NRRD0001 rejection plus NRRD0002-NRRD0005 escape, empty-value, duplicate-key, and ordering fixtures.
- release_gates:
  - Kind semantics and exact profile boundaries are proven without inferring orientation.
  capability_id: NRRD-KINDS-001
  level: MUST
  category: model
  title: NRRD0003 axis kinds
  production_meaning: From NRRD0003 onward, every axis may carry one defined kind value that distinguishes
    spatial, temporal, vector, tensor, color, domain, and other sample semantics without changing storage
    order.
  developer_use_case: A developer distinguishes a three-vector component axis from three independent spatial
    samples before transforming data.
  provenance:
  - POL-SCR-KINDS-01
  - SAL-NRRD-00022
  required_behavior:
  - Model every specified axis kind and its aliases only for NRRD0003 and newer; preserve unknown future
    kinds safely while strict validation reports them.
  normative_rules:
  - (Teem NRRD Format Specification Sections 1.1 and 6) Starting with NRRD0003, the per-axis kinds field
    classifies each axis using one value per declared dimension
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Defined-kind and alias matrix, one-value-per-axis cardinality, unknown preservation, and NRRD0001-NRRD0002
    rejection.
- release_gates:
  - Header-only, lazy, and bounded-memory paths pass large-data tests.
  capability_id: NRRD-LAZY-001
  level: MUST
  category: performance
  title: Large-data and lazy I/O
  production_meaning: Header-only loading, lazy payloads, memory mapping for eligible raw data, and streaming
    decode for compressed/text payloads keep memory bounded; full-decompression requirements are reported.
  developer_use_case: A developer streams a slice from a huge compressed dataset and is told when a request
    forces full decode.
  provenance:
  - POL-SCR-LAZY-01
  - RF-NRRD-00002
  required_behavior:
  - Provide header-only and lazy payload loading, memory mapping for eligible uncompressed data, streaming
    decode, and region reads where layout permits, reporting when full decompression is required.
  - Provide header-only loading, lazy payload access, memory mapping for eligible raw data, and streaming
    decode for compressed payloads, reporting when a requested slice forces full decompression.
  depth_required: 5
  depth_rationale: 'MUST performance capability: family depth floor 4, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Bounded-memory large-file tests; slice-requires-full-decode reporting fixture.
- release_gates:
  - All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: NRRD-LIFECYCLE-001
  level: MUST
  category: lifecycle
  title: Baseline lifecycle I/O
  production_meaning: Load/save/bytes round-trip, version exposure, strict and tolerant read modes, first-class
    validation, deterministic serialization.
  developer_use_case: A developer integrates the library with only lifecycle APIs and never needs format-internal
    knowledge for I/O plumbing.
  provenance:
  - POL-SLC-LIFECYCLE-01
  - POL-SLC-LIFECYCLE-02
  - POL-SLC-LIFECYCLE-03
  - POL-SLC-LIFECYCLE-04
  - POL-SLC-LIFECYCLE-05
  - POL-SLC-LIFECYCLE-06
  required_behavior:
  - Provide load from filesystem path, readable stream, and in-memory bytes, returning the format's root
    document/model object.
  - Provide save to filesystem path and writable stream, plus serialization to bytes, producing output
    the library's own loader accepts.
  - Expose the detected format version and any declared version separately; never silently rewrite a declared
    version.
  - Support a strict read mode that rejects malformed input with diagnostics and a tolerant read mode
    that recovers where the format permits, with recovery actions reported.
  - Expose validation as a first-class callable operation returning structured diagnostics, not only as
    exceptions raised during parsing.
  - Offer deterministic serialization such that an unchanged loaded document serializes to identical bytes
    across repeated calls in the same mode.
  depth_required: 4
  depth_rationale: Portfolio baseline (lifecycle_io) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - Baseline metadata fidelity is proven independently from later profile fields.
  capability_id: NRRD-META-001
  level: MUST
  category: preserve
  title: Baseline metadata fidelity
  production_meaning: Baseline optional basic and per-axis metadata preserves absence-vs-explicit distinctions,
    quoting/escaping rules, and legacy fields without absorbing kinds, thicknesses, sample units, or spatial
    metadata introduced by later profiles.
  developer_use_case: A developer round-trips files with unusual labels/units and nothing is normalized
    away.
  provenance:
  - POL-SCR-META-01
  - SAL-NRRD-00009
  - SAL-NRRD-00010
  - SAL-NRRD-00026
  required_behavior:
  - Preserve baseline optional basic and per-axis metadata with absence-vs-explicit-value distinctions
    and the format's quoting/escaping rules; carry obsolete number and range fields in lossless mode.
  normative_rules:
  - (NRRD format - quoted values) Labels and units are per-axis quote-delimited strings; labels escape
    embedded double quotes with backslash-quote and support no other escaping
  - (Teem NRRD Format Specification — Sections 1.3 and 6) The baseline per-axis metadata fields spacings,
    axis mins, axis maxs, centers, labels, and units each carry exactly one value per declared dimension;
    kinds and thicknesses are later-version fields
  - (Teem NRRD Format Specification Section 5) Baseline basic metadata includes content, min, max, old
    min, old max, and number fields with the optionality, numeric meaning, and legacy-preservation behavior
    defined by the specification
  depth_required: 2
  depth_rationale: 'MUST preserve capability: family depth floor 2, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Quoted/escaped label and unit fixtures; baseline field inventory; absence-vs-NaN/empty distinctions;
    obsolete-field lossless round trip.
- release_gates:
  - Every multi-file form is independently interoperable and fails closed outside its profiles.
  capability_id: NRRD-MULTIFILE-001
  level: MUST
  category: parse
  title: NRRD0004 multi-file detached payloads
  production_meaning: From NRRD0004 onward, printf-style filename sequences and LIST declarations partition
    payloads by subdimension with exact file-count and per-file-size validation.
  developer_use_case: A developer streams a slice stack stored across many files and receives a precise
    error before reading when the sequence or LIST is incomplete.
  provenance:
  - POL-SCR-MULTIFILE-01
  - SAL-NRRD-00006
  required_behavior:
  - Read and write numbered sequences and LIST payloads only for NRRD0004 and newer; validate min/max/step/subdimension,
    filename expansion, file count, and bytes per file before allocation.
  normative_rules:
  - (Teem NRRD Format Specification — Sections 1.1 and 3) Starting with NRRD0004, the data file field
    can identify multiple payload files through a printf-style numbered sequence or a LIST declaration
    with an optional subdimension
  depth_required: 2
  depth_rationale: 'MUST parse capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Sequence and LIST fixtures across NRRD0004-NRRD0005 plus earlier-profile, format-string, range, count,
    truncation, and traversal negatives.
- release_gates:
  - Baseline payload forms pass the complete profile/path/security matrix.
  capability_id: NRRD-PAYLOAD-001
  level: MUST
  category: parse
  title: Attached and single-file detached payload handling
  production_meaning: Every profile reads and writes attached payloads and its single-file detached form;
    path interpretation follows the pre-NRRD0004 versus NRRD0004+ rule under a secure resolver policy.
  developer_use_case: A developer loads a detached-header dataset and file-count or path violations surface
    before any read.
  provenance:
  - POL-SCR-PAYLOAD-01
  - SAL-NRRD-00003
  - SAL-NRRD-00018
  - SAL-NRRD-00025
  required_behavior:
  - Support attached and single-file detached payloads in every profile; apply profile-correct header-relative
    path semantics, skip fields, payload bounds, and a secure resolver policy.
  normative_rules:
  - (Teem NRRD Format Specification — Sections 1.2, 3, and 5) Across NRRD0001 through NRRD0005, payload
    data is either attached after the header blank line or stored in one detached file named by the data
    file field, with decoding and layout governed by encoding, sizes, type, and endian declarations
  - (NRRD format - skip fields) line skip and byte skip fields declare how much of a data file to skip
    before payload with line skip applied before byte skip
  - '(Teem NRRD Format Specification Section 3) Detached-path interpretation changes at NRRD0004: older
    headers use a leading ./ to mark header-relative files, while NRRD0004 and newer treat any path without
    a leading slash as relative to the detached header'
  depth_required: 2
  depth_rationale: 'MUST parse capability: family depth floor 2, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Attached and single-detached fixtures for every profile, pre/post-NRRD0004 relative-path cases, skip
    fields, and traversal negatives.
- release_gates:
  - All three unit concepts and thickness versus spacing remain distinct in model and round trip.
  capability_id: NRRD-PHYSICALMETA-001
  level: MUST
  category: preserve
  title: NRRD0004 thickness and sample-unit metadata
  production_meaning: From NRRD0004 onward, per-axis thicknesses and the array's scalar sample unit preserve
    optional absence, unknown values, and exact lexical form.
  developer_use_case: A medical-imaging developer preserves slice thickness independently from axis spacing
    and records the unit of stored scalar measurements.
  provenance:
  - POL-SCR-PHYSICALMETA-01
  - SAL-NRRD-00023
  required_behavior:
  - Model thicknesses and sample units only for NRRD0004 and newer; keep thickness distinct from spacing
    and sample units distinct from axis and space units.
  normative_rules:
  - (Teem NRRD Format Specification Sections 1.1, 5, and 6) Starting with NRRD0004, thicknesses provides
    one optional thickness per array axis and sample units provides a single quoted unit for the values
    stored in the array
  depth_required: 2
  depth_rationale: 'MUST preserve capability: family depth floor 2, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - NRRD0004-NRRD0005 thickness/sample-unit fixtures, optional unknown values, semantic-separation checks,
    and earlier-profile rejection.
- release_gates:
  - All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: NRRD-PRESERVE-001
  level: MUST
  category: preserve
  title: Baseline preservation duties
  production_meaning: Unknown constructs, absent-vs-default distinctions, and loss reporting are handled
    so round trips never silently drop data.
  developer_use_case: A developer round-trips files containing constructs the library does not model and
    loses nothing silently.
  provenance:
  - POL-SLC-PRESERVE-01
  - POL-SLC-PRESERVE-02
  - POL-SLC-PRESERVE-03
  - POL-SLC-PRESERVE-04
  required_behavior:
  - Preserve unknown or future-version constructs that can be carried safely; never silently drop unrecognized
    content in lossless mode.
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  - Report every construct that cannot be preserved before saving, through a loss report API, rather than
    failing silently.
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  depth_required: 4
  depth_rationale: Portfolio baseline (preservation) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
    proving refusal with diagnostics.
- release_gates:
  - All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
  capability_id: NRRD-SEC-001
  level: MUST
  category: security
  title: Baseline security posture
  production_meaning: Input limits, no implicit external effects, traversal protection, untrusted-payload
    discipline, and complexity-attack guards are enforced with diagnostics.
  developer_use_case: A developer processes untrusted input with safe defaults and only opts into external
    effects explicitly.
  provenance:
  - POL-SLC-SEC-01
  - POL-SLC-SEC-02
  - POL-SLC-SEC-03
  - POL-SLC-SEC-04
  - POL-SLC-SEC-05
  required_behavior:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  depth_required: 5
  depth_rationale: Portfolio baseline (security_limits) from shared-library-contract.yaml; depth reflects
    enforced-with-diagnostics expectation.
  required_tests:
  - Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
    test proving refusal with diagnostics.
- release_gates:
  - Axis semantics proven against ground-truth fixtures.
  capability_id: NRRD-SHAPE-001
  level: MUST
  category: model
  title: Dimensions, axis order, and endian correctness
  production_meaning: Dimension counts, per-axis sizes/arity, explicit axis-order semantics, and endian
    declarations are enforced with checked arithmetic; axis conversion to host order is explicit, never
    silent.
  developer_use_case: A developer converts between format axis order and host array order through an explicit
    documented operation.
  provenance:
  - POL-SCR-SHAPE-01
  - POL-SCR-SHAPE-02
  - SAL-NRRD-00011
  - SAL-NRRD-00012
  - SAL-NRRD-00014
  - SAL-NRRD-00015
  required_behavior:
  - Validate dimension/sizes/per-axis arity with checked multiplication for sample and byte counts; represent
    the format's axis order explicitly and convert to host order only via explicit operations.
  - Enforce endian declaration rules where element size exceeds one byte; byte-swap transparently on read/write;
    never endian-transform opaque blocks.
  normative_rules:
  - (NRRD format - payload consistency) The expected uncompressed payload byte count is the product of
    the declared sizes multiplied by the byte length of one element as determined by type and, for block
    samples, block size
  - (NRRD format - dimension field) The dimension field is required and declares the array dimension with
    every per-axis field carrying exactly dimension entries
  - (NRRD format - endian field) The endian field is required whenever the encoding exposes byte order
    and the element size exceeds one byte declaring little or big byte order
  - (NRRD format - sizes field and axis ordering) The sizes field is required and declares positive per-axis
    sample counts in fastest-to-slowest axis order
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Axis-order semantics fixtures; endian matrix; overflow-shape negatives.
- release_gates:
  - Index-to-world transforms and NRRD0004 profile boundary are verified against reference calculations.
  capability_id: NRRD-SPACE-001
  level: MUST
  category: model
  title: NRRD0004 orientation and space metadata
  production_meaning: From NRRD0004 onward, space names or explicit dimensions, space units, origins,
    and per-axis direction vectors validate for consistency and expose index-to-world transforms; measurement
    frames remain a separate NRRD0005 capability.
  developer_use_case: A medical-imaging developer obtains the index-to-world transform and non-spatial
    axes are handled correctly.
  provenance:
  - POL-SCR-SPACE-01
  - SAL-NRRD-00019
  - RF-NRRD-00004
  required_behavior:
  - Support NRRD0004+ space/orientation metadata with vector-length validation against space dimension,
    non-spatial axes, and index-to-world transforms; never infer axis order from a named space.
  - Expose index-to-world transforms from NRRD0004 and newer space metadata without ever inferring axis
    order from a named space; keep NRRD0005 measurement-frame transforms in a separate model and API -
    medical-imaging orientation correctness.
  normative_rules:
  - (Teem NRRD Format Specification — Sections 1.1 and 4) Starting with NRRD0004, space, space dimension,
    space units, space origin, and per-axis space directions describe array orientation in a surrounding
    space; measurement frame is not available until NRRD0005
  depth_required: 5
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - NRRD0004-NRRD0005 orientation matrices, named and explicit spaces, units, non-spatial axes, and dimension-mismatch
    negatives.
- release_gates:
  - All specified types and aliases round-trip.
  capability_id: NRRD-TYPES-001
  level: MUST
  category: model
  title: Complete scalar and block types
  production_meaning: All specified integer/float widths with aliases plus opaque block types are represented
    independently of host-language names with validity rules enforced.
  developer_use_case: A developer reads a dataset's exact declared type and receives documented host-type
    mappings.
  provenance:
  - POL-SCR-TYPES-01
  - SAL-NRRD-00016
  - SAL-NRRD-00017
  required_behavior:
  - Support every specified scalar type and alias plus block types with their validity rules; represent
    declared types independently from host-language type names.
  normative_rules:
  - (NRRD format - type field) The type field is required and declares the sample scalar type from the
    defined integer, floating-point, and opaque block type set with documented aliases
  - (NRRD format - block type constraints) block type samples require a positive block size field and
    must not use ascii encoding
  depth_required: 3
  depth_rationale: 'MUST model capability: family depth floor 3, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Type/alias matrix round trips; invalid type/encoding combination negatives.
- release_gates:
  - Validation layer complete against specification rule inventory.
  capability_id: NRRD-VALIDATE-001
  level: MUST
  category: validate
  title: Header and payload validation
  production_meaning: Required/conditional fields, per-axis arity, version-feature compatibility, and
    expected payload size after decoding validate before allocation with complete diagnostics.
  developer_use_case: A service validates uploads cheaply (header-first) and rejects shape/payload mismatches
    with exact reasons.
  provenance:
  - POL-SCR-VALIDATE-01
  - RF-NRRD-00003
  required_behavior:
  - Check required and conditional fields, arity, version-feature compatibility, and expected sample/byte
    counts after decoding; treat trailing payload per policy with reporting.
  - Validate declared shape and encoded payload size with checked arithmetic BEFORE any payload allocation,
    with decompressed-size and ratio limits - hostile headers must fail cheaply.
  depth_required: 5
  depth_rationale: 'MUST validate capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Truncated/oversized payloads, conditional-field negatives, version-feature mismatches.
- release_gates:
  - No obligation inherits a profile earlier than the feature it describes.
  capability_id: NRRD-VERSION-001
  level: MUST
  category: validate
  title: Magic and feature-version compatibility
  production_meaning: NRRD0001 through NRRD0005 are cumulative profiles with exact feature-introduction
    boundaries; strict validation rejects a later feature under an older magic and writers select the
    oldest sufficient magic unless the caller supplies a valid target.
  developer_use_case: A developer targets an older reader and gets an exact incompatibility report instead
    of a falsely labeled file.
  provenance:
  - POL-SCR-VERSION-01
  - SAL-NRRD-00020
  required_behavior:
  - Model NRRD0001 through NRRD0005 explicitly; validate every feature against its introduction version;
    choose the oldest sufficient magic deterministically when no target profile is requested.
  normative_rules:
  - '(Teem NRRD Format Specification Section 1.1; Teem formatNRRD.c lines 183-205) NRRD profile magics
    are cumulative: NRRD0001 is the baseline, NRRD0002 adds key/value pairs, NRRD0003 adds kinds, NRRD0004
    adds thicknesses, sample units, space/orientation fields and multiple data files, and NRRD0005 adds
    measurement frame; writers select the oldest version able to represent the document'
  depth_required: 5
  depth_rationale: 'MUST validate capability: family depth floor 5, finding hints applied; depth scale
    0-8 per L30 schema.'
  required_tests:
  - Positive fixtures for every magic, cross-product negatives for every later feature under every earlier
    magic, and deterministic oldest-sufficient writer selection.
- release_gates:
  - Writer output validated by independent reload across the fixture matrix.
  capability_id: NRRD-WRITE-001
  level: MUST
  category: write
  title: Canonical and lossless writing
  production_meaning: Writers select the correct version/magic for used features (or honor explicit targets
    after validation), preserve optional absence in lossless mode, and order fields deterministically.
  developer_use_case: A developer writes a dataset and any conformant reader loads it; rewriting an unchanged
    file is byte-stable.
  provenance:
  - POL-SCR-WRITE-01
  required_behavior:
  - Write required/conditional fields correctly with version selection honoring used features; preserve
    optional absence in lossless mode; deterministic field ordering and detached-partition policies.
  depth_required: 4
  depth_rationale: 'MUST write capability: family depth floor 4, finding hints applied; depth scale 0-8
    per L30 schema.'
  required_tests:
  - Version-selection fixtures; determinism byte-compare; detached-partition round trips.
public_api_contract:
  mutation_operations:
  - document.array.permute_axes(order)
  - document.array.flip_axis(axis)
  read_operations:
  - NrrdDocument.load(..., data='eager|lazy|header_only')
  - document.array.slice(...)
  - document.index_to_world(index)
  root_types:
  - NrrdDocument
  - NrrdHeader
  - NrrdArray
  - NrrdAxis
preservation_contract:
  lexical_roundtrip:
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller
    choice.
  loss_reporting_policy: Report every construct that cannot be preserved before saving, through a loss
    report API, rather than failing silently.
  structural_roundtrip:
  - Preserve the distinction between an absent optional value and an explicitly written default or empty
    value.
  unknown_construct_policy: Preserve unknown or future-version constructs that can be carried safely;
    never silently drop unrecognized content in lossless mode.
validation_contract:
  diagnostic_schema:
    fields:
    - code
    - severity
    - message
    - source_location
    - object_path
    - originating_rule
    - repair_suggestion
    - auto_repair_eligible
  layers:
  - description: Header line/token rules, magic/version recognition, encodings of the header itself.
    layer: lexical
  - description: Required and conditional fields, per-axis arity, field ordering/uniqueness.
    layer: structural
  - description: Scalar type validity, block-size rules, encoding/type compatibility.
    layer: type
  - description: Declared shape/byte count vs actual payload after decoding; trailing-data policy.
    layer: payload
  - description: Overflow-checked size math, decompression limits, detached-path policy.
    layer: security
security_contract:
  attack_surfaces:
  - Multiplicative overflow in sample/byte-count calculations from hostile dimensions.
  - Decompression bombs in compressed payload encodings.
  - Path traversal through detached data-file references.
  - Allocation of the full declared payload before validating encoded size.
  limits:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded
    payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references
    during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced
    resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing
    must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations
    and bound recursion depth.
  safe_defaults:
  - Checked arithmetic for all size calculations; reject overflow explicitly.
  - Decompressed-byte and compression-ratio limits with configurable policy.
  - Detached references resolve only inside configured roots; absolute paths gated.
  - Header-first validation; no full-payload allocation before size verification.
test_contract:
- Test official or authoritative valid samples, invalid samples, synthetic edge cases, malformed inputs,
  and hostile inputs for every claimed capability.
- Prove parse-save-parse semantic equivalence for representative documents of every supported construct.
- Prove deterministic output by serializing the same document twice and byte-comparing.
- Publish a capability manifest stating supported versions, constructs, limitations, and lossless guarantees,
  verified against implementation and tests.
- Metadata-follows-operation fixtures for each axis operation.
- Policy matrix fixtures with boundary values.
- Encoding matrix round trips; missing-codec explicit-failure fixture.
- Full matrix as enumerated with hostile-fixture negatives.
- Identity, rotated, and non-orthogonal frame fixtures; cardinality and NRRD0001-NRRD0004 rejection negatives.
- Every magic/version fixture; LF/CRLF fixtures; duplicate-field, leading-whitespace, and ordering negatives.
- NRRD0001 rejection plus NRRD0002-NRRD0005 escape, empty-value, duplicate-key, and ordering fixtures.
- Defined-kind and alias matrix, one-value-per-axis cardinality, unknown preservation, and NRRD0001-NRRD0002
  rejection.
- Bounded-memory large-file tests; slice-requires-full-decode reporting fixture.
- Each lifecycle_io baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Quoted/escaped label and unit fixtures; baseline field inventory; absence-vs-NaN/empty distinctions;
  obsolete-field lossless round trip.
- Sequence and LIST fixtures across NRRD0004-NRRD0005 plus earlier-profile, format-string, range, count,
  truncation, and traversal negatives.
- Attached and single-detached fixtures for every profile, pre/post-NRRD0004 relative-path cases, skip
  fields, and traversal negatives.
- NRRD0004-NRRD0005 thickness/sample-unit fixtures, optional unknown values, semantic-separation checks,
  and earlier-profile rejection.
- Each preservation baseline behavior has a focused positive test and, where refusable, a negative test
  proving refusal with diagnostics.
- Each security_limits baseline behavior has a focused positive test and, where refusable, a negative
  test proving refusal with diagnostics.
- Axis-order semantics fixtures; endian matrix; overflow-shape negatives.
- NRRD0004-NRRD0005 orientation matrices, named and explicit spaces, units, non-spatial axes, and dimension-mismatch
  negatives.
- Type/alias matrix round trips; invalid type/encoding combination negatives.
- Truncated/oversized payloads, conditional-field negatives, version-feature mismatches.
- Positive fixtures for every magic, cross-product negatives for every later feature under every earlier
  magic, and deterministic oldest-sufficient writer selection.
- Version-selection fixtures; determinism byte-compare; detached-partition round trips.
release_gates:
- Array operations preserve metadata consistency (tested per op).
- Conversions policy-governed and reported (no silent semantic change).
- All defined encodings round-trip.
- Measurement-frame math and NRRD0005-only applicability are independently proven.
- Baseline header grammar is proven independently from later-version feature parsing.
- Key/value metadata has exact profile and lexical round-trip proof.
- Kind semantics and exact profile boundaries are proven without inferring orientation.
- Header-only, lazy, and bounded-memory paths pass large-data tests.
- All lifecycle_io baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Baseline metadata fidelity is proven independently from later profile fields.
- Every multi-file form is independently interoperable and fails closed outside its profiles.
- Baseline payload forms pass the complete profile/path/security matrix.
- All three unit concepts and thickness versus spacing remain distinct in model and round trip.
- All preservation baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- All security_limits baseline behaviors demonstrably enforced or explicitly waived with recorded rationale.
- Axis semantics proven against ground-truth fixtures.
- Index-to-world transforms and NRRD0004 profile boundary are verified against reference calculations.
- All specified types and aliases round-trip.
- Validation layer complete against specification rule inventory.
- No obligation inherits a profile earlier than the feature it describes.
- Writer output validated by independent reload across the fixture matrix.
- Capability manifest published and independently verified against implementation and tests.
