    declared types independently from host-language type names.
  normative_rules:
  - (Teem NRRD Format Specification — Section 3 (Data)) The data segment follows the header's blank line
    (or lives in a detached file named by the 'data file' field) and is decoded per the 'encoding' field
    (raw, txt/ascii, hex, gz, bz2) with layout governed by the sizes/type/endian fields
  - (NRRD format - detached data files with external references) Detached headers reference payloads via
    the data file field supporting a single file printf-style numbered sequences and LIST declarations
    resolved relative to the header
  - (NRRD format - quoted values) Labels and units are per-axis quote-delimited strings; labels escape
    embedded double quotes with backslash-quote and support no other escaping
  - (NRRD format - payload consistency) The expected uncompressed payload byte count is the product of
    the declared sizes multiplied by the byte length of one element as determined by type and, for block
    samples, block size
  - (NRRD format - type field) The type field is required and declares the sample scalar type from the
