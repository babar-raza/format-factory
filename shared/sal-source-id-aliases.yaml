# sal-source-id-aliases.yaml
#
# Committed registry of informal source_id values used by the SAL extraction pipeline
# in sal-facts-latest.json. These IDs are generated by the workbench extraction tools
# and differ from the formal SPEC-* IDs in .local/spec-source-registry/sources.jsonl.
#
# Consumed by: tools/specification-authority-layer/fact_quality.py::load_registered_source_ids()
# Purpose: Makes quality level computation correct on any checkout, without requiring .local/ data.
#
# To add a new entry: append to source_ids list below.
# Source: verified from live .local/sal-output/sal-facts-latest.json (2026-07-01)

source_ids:
  # ODF formats (shared extraction pipeline)
  - odf-1.3
  - odf-1.3-part1
  - odf-1.3-part2
  - odf-1.3-part3
  - odf-1.3-part4

  # Per-format normalized extraction outputs
  - fods-normalized
  - fodt-normalized
  - fodg-normalized
  - fodp-normalized
  - ods-normalized
  - ods-structural
  - odt-normalized

  # Image formats
  - qoi-structural
  - xcf-gimp-2.10
  - xcf-structural
  - netpbm-spec

  # Compression
  - zst-normalized
  - rfc8878
  - rfc9659

  # Spreadsheet / data formats
  - gnumeric-structural
  - csv-structural
  - rfc4180
  - dif-v1
  - dif-structural
  - sylk-ms
  - sylk-structural
  - tsv-informal
  - tsv-structural
  - ndjson-structural
  - ndjson-v1
  - toml-1.0
  - toml-structural

  # Document formats
  - abw-structural

  # Other / container formats
  - ora-structural
  - zpaq-structural
