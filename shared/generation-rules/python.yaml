# Generation rules for Python spec stubs
# Used by tools/spec/generate_canonical_stubs.py

target_language: python
stub_template: |
  # GENERATED — architecture_only
  # Do not implement here until compat.py switch is ready.
  # Source: {spec_fact_ref} ({qname})
  class {class_name}:
      spec_qname = "{qname}"
      spec_fact_ref = "{spec_fact_ref}"
      # TODO: implement to match legacy facade class in models.py
init_file_content: ""
output_base: "src/python/{format}/spec"
namespace_map:
  "urn:oasis:names:tc:opendocument:xmlns:office:1.0": "office"
  "urn:oasis:names:tc:opendocument:xmlns:text:1.0": "text"
  "urn:oasis:names:tc:opendocument:xmlns:table:1.0": "table"
