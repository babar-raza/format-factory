# Generation rules for .NET spec stubs
# Used by tools/spec/generate_canonical_stubs.py

target_language: csharp
stub_template: |
  // GENERATED — architecture_only
  // Source: {spec_fact_ref} ({qname})
  namespace FormatFactory.{FormatPascal}.Spec.{NamespacePascal};
  public static class {class_name}
  {{
      public const string QName = "{qname}";
      public const string SpecFactRef = "{spec_fact_ref}";
  }}
output_base: "src/net/FormatFactory.{FormatPascal}/Spec"
namespace_map:
  "urn:oasis:names:tc:opendocument:xmlns:office:1.0": "Office"
  "urn:oasis:names:tc:opendocument:xmlns:text:1.0": "Text"
  "urn:oasis:names:tc:opendocument:xmlns:table:1.0": "Table"
