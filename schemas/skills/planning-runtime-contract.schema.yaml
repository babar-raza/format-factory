---
$schema: "http://json-schema.org/draft-07/schema#"
$id: "planning-runtime-contract.schema.yaml"
title: "Planning Runtime Contract"
description: >
  Schema for a planning bundle runtime contract produced by the governed
  orchestration layer (CONWAY-R9). Validates the runtime contract that binds
  a planning bundle to its authority entry, simulation results, and governance
  constraints. Used to enforce deterministic replay consistency across sprints.

  A planning runtime contract is a SIGNED DESCRIPTION of what was planned
  and simulated — not an execution authorization. Execution requires
  separate human authorization.

type: object
required:
  - contract_id
  - format_id
  - contract_version
  - planning_bundle_hash
  - authority_id
  - simulation_id
  - requirements_state
  - stale_verdict
  - gate_state_snapshot
  - replay_fingerprint
  - constraint_summary
  - governance
  - created_date
  - contract_status

additionalProperties: false

properties:
  contract_id:
    type: string
    minLength: 8
    maxLength: 64
    description: "Deterministic SHA-256-derived ID for this contract (hexdigest[:16])."

  format_id:
    type: string
    enum: ["fods", "fodt"]
    description: "Format this contract applies to."

  contract_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"
    description: "Semantic version of the planning runtime contract schema."

  planning_bundle_hash:
    type: string
    minLength: 8
    maxLength: 64
    description: "Deterministic hash of the planning bundle this contract was generated from."

  authority_id:
    type: string
    minLength: 8
    maxLength: 64
    description: "authority_id from the authority continuity registry entry."

  simulation_id:
    type: string
    minLength: 1
    description: "simulation_id from the execution_simulator run that validated this contract."

  requirements_state:
    type: string
    enum:
      - REQUIREMENTS_AUTHORITATIVE
      - REQUIREMENTS_REVIEW_REQUIRED
      - REQUIREMENTS_PENDING
      - REQUIREMENTS_MISSING
      - REQUIREMENTS_STALE
    description: "Requirements authority state at contract creation time."

  stale_verdict:
    type: string
    enum:
      - FRESH
      - REVIEW_REQUIRED
      - STALE_BLOCKED
    description: "Stale verdict at contract creation time."

  gate_state_snapshot:
    type: object
    required:
      - gates_passed
      - gate_11_approved
      - snapshot_read_only
    additionalProperties: true
    properties:
      gates_passed:
        type: integer
        minimum: 0
        maximum: 11
      gate_11_approved:
        type: boolean
        enum: [false]
        description: "MUST be false — gate 11 cannot be approved by the runtime contract."
      gate_11_status:
        type: string
      snapshot_read_only:
        type: boolean
        enum: [true]
        description: "Gate state is read-only in the contract — never mutated."
    description: "Read-only snapshot of gate state at contract creation time."

  replay_fingerprint:
    type: ["string", "null"]
    description: "Replay fingerprint for deterministic replay consistency."

  constraint_summary:
    type: object
    required:
      - constraint_count
      - constraints
    additionalProperties: false
    properties:
      constraint_count:
        type: integer
        minimum: 0
      constraints:
        type: array
        items:
          type: object
          required:
            - constraint
            - scope
          additionalProperties: true
          properties:
            constraint:
              type: string
            scope:
              type: string
            source:
              type: string
    description: "Summary of constraints active at contract creation time."

  governance:
    type: object
    required:
      - commercial_product_ready
      - autonomous_execution_allowed
      - gate_self_approval_allowed
      - dry_run_only
      - simulation_only
      - implementation_requires_human_authorization
    additionalProperties: false
    properties:
      commercial_product_ready:
        type: boolean
        enum: [false]
      autonomous_execution_allowed:
        type: boolean
        enum: [false]
      gate_self_approval_allowed:
        type: boolean
        enum: [false]
      dry_run_only:
        type: boolean
        enum: [true]
      simulation_only:
        type: boolean
        enum: [true]
      implementation_requires_human_authorization:
        type: boolean
        enum: [true]
    description: "Governance flags. All are immutable in the contract."

  created_date:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    description: "ISO 8601 date of contract creation."

  contract_status:
    type: string
    enum:
      - VALID
      - SUPERSEDED
      - INVALIDATED_STALE
      - INVALIDATED_AUTHORITY_LOST
      - INVALIDATED_REPLAY_MISMATCH
    description: >
      Lifecycle status of this contract.
      VALID: contract is current and valid.
      SUPERSEDED: a newer contract has replaced this one.
      INVALIDATED_STALE: stale state invalidated the planning inputs.
      INVALIDATED_AUTHORITY_LOST: requirements authority was lost.
      INVALIDATED_REPLAY_MISMATCH: replay fingerprint mismatch detected.

  invalidation_reason:
    type: string
    description: "Present when contract_status is not VALID. Explains why."

  prior_contract_id:
    type: ["string", "null"]
    description: "contract_id of the prior contract this supersedes (for lineage tracking)."

  lane_contract_entries:
    type: array
    description: "Per-lane contract entries from the simulation."
    items:
      $ref: "#/definitions/LaneContractEntry"

definitions:
  LaneContractEntry:
    type: object
    required:
      - lane_id
      - simulation_status
      - requirement_ids
      - dry_run_only
    additionalProperties: true
    properties:
      lane_id:
        type: string
        pattern: "^LANE-I-"
        description: "Implementation lane ID."
      simulation_status:
        type: string
        enum:
          - SIMULATION_PASS
          - SIMULATION_FAIL
          - BLOCKED_STALE
          - BLOCKED_AUTHORITY
          - BLOCKED_DEPENDENCY
          - BLOCKED_GOVERNANCE
          - REPLAY_MISMATCH
      requirement_ids:
        type: array
        items:
          type: string
        description: "Requirement IDs assigned to this lane."
      dry_run_only:
        type: boolean
        enum: [true]
      constraint_count:
        type: integer
        minimum: 0
