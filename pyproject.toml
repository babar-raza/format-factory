[project]
name = "format-factory-dev"
version = "0.0.0"
description = "Development tooling umbrella for format-factory"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "ruff>=0.4",
    "bandit>=1.7",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Unknown config option.*timeout:pytest.PytestConfigWarning",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E711"]
