[project]
name = "format-factory-dev"
version = "0.0.0"
description = "Development tooling umbrella for format-factory"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ruff>=0.4",
    "bandit>=1.7",
    "defusedxml>=0.7",
    "hypothesis>=6.0",
    "lxml>=4.9",
    "zstandard>=0.21",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
# Repo root on sys.path for tests, set by pytest itself (pytest>=7 `pythonpath`).
# This is the SUPPORTED substitute for `sys.path.insert(0, str(_REPO))` at the top
# of a test module. Until this existed there was no way to `import tools.*` /
# `import src.python.*` from a test without hand-mutating sys.path, which is why
# the playbooks taught that hack and why ~2,600 sys.path calls accumulated under
# tests/ (plan finding PA-F6). New tests must NOT mutate sys.path — see
# playbooks/format-factory/new-format-kickstart-template.md.
# Note: `src` and `src/python` are already injected by the venv's editable-install
# .pth files, so format packages import without this; this entry is what makes
# `tools.*` and `src.python.*` reachable.
pythonpath = ["."]
timeout = 120
timeout_method = "thread"
markers = [
    "layer0: Structural - health check, import smoke",
    "layer1: Focused - single-format unit tests",
    "layer2: Family - related format group tests",
    "layer3: Integration - supervisor, governance, evidence",
    "layer4: Golden - roundtrip, cross-format, export",
    "layer5: Broad - all python + supervisor + evidence",
    "layer6: Full - entire test suite",
    "state_dependent: Test reads live repo state files (may skip when dirty)",
    "network: Test makes real network calls (LLM, HTTP endpoints)",
    "arithmetic_deepening: Arithmetic-formula deepening test with no spec backing (generated, suspended)",
    "slow: Test consistently exceeds 5s measured duration (from registry/slow-test-ledger.yaml)",
    "roundtrip: Test performs a load-edit-save-reload cycle proving format round-trip fidelity",
    "oracle: Test executes oracle-package cases to verify spec-literal correctness",
    "property_based: Test uses Hypothesis or similar property-based strategy",
    "security: Test validates malformed input, injection, or boundary security behavior",
    "real_src: Test invokes validators against real source files in src/ (may fail when file is healed)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Unknown config option.*timeout:pytest.PytestConfigWarning",
]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    "tools/oracle",  # pre-existing f-string backslash-escape syntax (Python 3.9 compat issue)
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long (handled by line-length setting)
    "I001",   # import sorting (deferred to v0.2 style enforcement)
    "E741",   # ambiguous variable names (l, O, I)
    "F841",   # local variable assigned but never used (common in tests for side effects)
    "E402",   # module level import not at top (common in scripts with sys.path setup)
    "E701",   # multiple statements on one line (colon)
    "E702",   # multiple statements on one line (semicolon)
    "E712",   # equality comparison to True/False (test readability)
    "W291",   # trailing whitespace
    "W293",   # whitespace before a blank line
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E711", "F401", "F811"]  # tests use conditional imports and fixtures
"tools/**" = ["F401", "F811"]          # tools use dynamic imports
"tools/ora/producer_harness/krita/scripts/**" = ["F821"]
# These scripts are never imported or run standalone -- they are exec()'d by
# ora_harness_driver's own __init__.py inside a real Krita process, which
# injects Krita/window/log/write_sentinel into the exec() namespace at
# runtime (see that file's own _run_driver_script). Undefined-name warnings
# for those 4 names are therefore false positives, not real bugs.

[tool.mypy]
# Format Factory's newer-generation format libraries (core, ipynb, nrrd,
# safetensors, ubl, xliff) share the format_factory.* PEP 420 implicit
# namespace across independent src/python/{format}/src/ directories with no
# format_factory/__init__.py. Without this section mypy resolves each such
# package's own files fine in isolation but cannot resolve format_factory.*
# imports ACROSS packages (e.g. src/python/nrrd/.../payload.py importing
# format_factory.core), because it has no path telling it where the other
# packages' src/ roots are. mypy_path + namespace_packages +
# explicit_package_bases together let mypy treat each src/ directory as a
# package root under the shared format_factory namespace, matching how these
# packages are actually installed (editable, PEP 660) and imported at
# runtime. Legacy flat-layout formats (abw, csv, zst, etc.) are unaffected —
# they do not use this namespace and are not listed here.
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "src/python/core/src",
    "src/python/ipynb/src",
    "src/python/nrrd/src",
    "src/python/ora/src",
    "src/python/safetensors/src",
    "src/python/ubl/src",
    "src/python/xliff/src",
]
# Deliberately NOT including tools/supervisor here: that directory mixes
# bare imports (`from atomic_io import ...`) and qualified imports
# (`from tools.supervisor.X import ...`) for the same files, so adding it as
# an mypy_path root makes mypy see e.g. continuation_state.py as two
# different modules ("continuation_state" and
# "tools.supervisor.continuation_state") and hard-stop with a duplicate-
# module error -- strictly worse than the handful of import-not-found notes
# it would otherwise produce. Fixing this for real means auditing and
# converting tools/supervisor's remaining bare imports to qualified ones
# (already done for one case in Stage 1 -- the `from action_queue import
# enqueue_front` fix in autonomous_orchestrator.py); that is GAP-004/GAP-005
# territory in the 2026-08-04 independent review, not a config change.
