    challenge: >
      CRITICAL SAFETY REQUIREMENT: IR-FODT-003 iterative list traversal — MUST NOT be recursive.
      This is correctly included in critical_requirements in the traceability map.
      ODF FODT documents can contain deeply nested lists (nested text:list elements inside
      text:list-item). A naive recursive traversal can cause stack overflow on adversarial
      inputs. Iterative traversal using an explicit stack is required.
    notes: >
      Verifier strongly endorses this requirement. Any implementation of list traversal
      MUST use an iterative pattern (explicit Stack<T>) not recursion. This requirement
      is non-negotiable and must be enforced in code review. Test case must include
      deeply-nested list (10+ levels) to verify no StackOverflowException.

