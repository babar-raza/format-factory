recovery_cases:
  clean_equal_checkpoint:
    condition: HEAD and origin/main descend from the source checkpoint and validator passes
    action: register a new identity and execute XLF-04-BATCH-005
  remote_advanced:
    condition: origin/main contains commits after this packet
    action: >-
      Recompute controller, complete journal, task index, active taskcard,
      current gaps, proofs, and exact next work; refresh the packet before
      mutating.
  implementation_commit_without_event:
    condition: a valid bounded implementation commit exists but no native event binds it
    action: >-
      Independently rerun its declared evidence. If valid and owned, append the
      next native event and projections through plan-control. Never recreate or
      cherry-pick an already integrated commit.
  event_present_projection_stale:
    condition: journal head is newer than controller or handover
    action: >-
      Validate the event hash chain, rebuild derived projections from the
      journal, and refresh the handover. Do not append a duplicate event.
  owned_red_or_green_worktree:
    condition: current provider has attributable uncommitted Batch 005 files
    action: >-
      Continue only under the same live identity and leases. If the provider
      is ending, record a non-clean recovery packet; do not label it RESUMABLE.
  unattributed_or_foreign_dirty_paths:
    condition: any modification is not attributable to the incoming identity
    action: >-
      Preserve bytes, inspect coordination journal and diffs, avoid reset,
      clean, restore, or stash, and work only on non-overlapping safe paths.
  stale_lease:
    condition: a required path is owned by a stale identity
    action: >-
      Use governed takeover with a recorded reason only after rechecking the
      owner and filesystem baseline. Expiry never authorizes discarding bytes.
  live_lease:
    condition: another active identity owns a required path
    action: >-
      Do not write or release the lease. Continue other safe work or wait for
      the owner to reach a clean checkpoint.
  live_owner_committed_without_event:
    condition: >-
      the captured owner pushed a bounded implementation commit but the native
      journal still ends at event 26
    action: >-
      Fetch origin/main, inspect the immutable commit and receipts, rerun its
      declared tests independently, and only then append one event through
      plan-control. Do not reimplement, cherry-pick, or duplicate the commit.
  live_owner_ended_with_red_files:
    condition: >-
      the captured owner is no longer live, no implementation commit exists,
      its leases remain stale, and the two attributable files remain RED or
      incomplete
    action: >-
      Preserve exact bytes and their Git status, use governed takeover with a
      recorded reason, recapture baselines, and continue the same TDD batch.
      The files are recovery input, not a checkpoint.
  prior_owner_completed_and_released:
    condition: >-
      the prior owner completed normally, its leases are released, no
      implementation commit exists, and both optional assets exactly match
      their recorded identities
    action: >-
      Register a new provider identity, claim the logical Batch 005 scope and
      both exact files, preflight and recapture baselines, then adopt the
      preserved RED/GREEN work. No takeover is needed when no foreign lease
      remains.
  authority_or_oracle_contradiction:
    condition: primary sources or independent implementations disagree
    action: >-
      Preserve both results, add a discriminating test, and resolve from
      primary authority. Never select the result that makes a test pass.

