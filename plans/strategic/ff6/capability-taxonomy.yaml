classifications:
  - id: stable
    label: Stable
    description: >-
      Capability required for the production-complete target of its format
      contract. Must be fully implemented, tested, and proven before any
      production release gate can pass.
    level_filter: [MUST]

  - id: optional_adapter
    label: Optional Adapter
    description: >-
      Capability delivered through a separately importable, separately
      testable adapter package or module. The core library must function
      without it. Framework-specific integrations and format-to-format
      export adapters belong here.
    level_filter: [SHOULD, MUST]

  - id: preview
    label: Preview
    description: >-
      Capability whose specification authority, scope definition, or
      implementation strategy is not yet settled. May ship as explicitly
      labeled preview with no stability guarantee. Promoted to stable
      only by a controller event with evidence.
    level_filter: [SHOULD]

  - id: excluded
    label: Excluded
    description: >-
      Capability explicitly outside the scope of this program. Requires
      a primary-authority basis (specification does not define it, or
      format family does not support it) and a user-visible disposition
      (not supported, use external tool X, deferred to future program).
    level_filter: []

categories:
