    classification_locks:
      XLIFF-MERGE-001: OPTIONAL_ADAPTER_REQUIRED
      XLIFF-QA-001: OPTIONAL_ADAPTER_REQUIRED
    exclusions: {}
    known_surface_gaps:
      - gap_id: FF6-XLIFF-PROFILE-001
        description: >-
          Submitted enrichments claim only XLIFF 2.1. Per-capability 2.0
          applicability and isolated 2.2 preview behavior remain uncompiled.
  safetensors:
    target_profiles:
      - safetensors_v0.8.0
    classification_locks:
