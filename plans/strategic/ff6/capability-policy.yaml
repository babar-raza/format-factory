      - ORA-MIMETYPE-001
      - ORA-DOCUMENT-001
      - ORA-STACK-001
      - ORA-GROUP-001
      - ORA-LAYER-001
      - ORA-MASK-001
      - ORA-ASSET-001
      - ORA-BASELINEASSET-001
      - ORA-COMPOSITE-001
      - ORA-ISOLATION-001
      - ORA-RESOLUTION-001
      - ORA-RENDER-001
      - ORA-EDIT-001
      - ORA-STREAM-001
      - ORA-VALIDATE-001
      - ORA-WRITE-001
      - ORA-LIFECYCLE-001
      - ORA-PRESERVE-001
      - ORA-SEC-001
    profile_applicability:
      ORA-ISOLATION-001:
        - openraster_0.0.4
        - openraster_0.0.5
  nrrd:
    target_profiles:
      - nrrd0001
      - nrrd0002
      - nrrd0003
      - nrrd0004
      - nrrd0005
    classification_locks:
      NRRD-CONVERT-001: PREVIEW_ISOLATED
    exclusions: {}
    known_surface_gaps:
      - gap_id: FF6-NRRD-PROFILE-001
        description: >-
          The contract is compiled around NRRD0005; explicit obligation-to-
          version applicability for NRRD0001-NRRD0004 remains to be projected.
  xliff:
    target_profiles:
      - xliff_2.0
      - xliff_2.1
    preview_profiles:
