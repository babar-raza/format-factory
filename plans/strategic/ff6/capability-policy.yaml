    exclusions: {}
    known_surface_gaps: []
  ubl:
    target_profiles:
      - ubl_2.3
    classification_locks:
      UBL-CALC-001: PREVIEW_ISOLATED
      UBL-UPGRADE-001: PREVIEW_ISOLATED
    exclusions: {}
    known_surface_gaps:
      - gap_id: FF6-UBL-TYPING-001
        description: >-
          The capability contract does not by itself prove distinct generated
