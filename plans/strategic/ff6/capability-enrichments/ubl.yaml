- capability_id: UBL-EXT-001
  stable_name: Extension preservation and authoring
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer round-trips documents carrying national extensions untouched and reads a registered extension through a typed adapter.
  spec_profiles:
  - ubl_2.3
  authority_fact_ids:
  - POL-XBZ-EXT-01
  - SAL-UBL-00002
  - SAL-UBL-00110
  - SAL-UBL-00120
  - SAL-UBL-00122
  - SAL-UBL-00132
  - RF-UBL-00007
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Read and write extension containers with arbitrary namespaces and payloads without loss; expose registered typed adapters as opt-in.
  - Treat extension payloads and embedded binary attachments as untrusted data; expose their media types and checksums without decoding side effects, and gate any external attachment retrieval behind allowlists, byte limits, and timeouts.
  preservation_contract:
  - Unknown-namespace extension payloads survive load-save byte-semantically in lossless mode.
  - Extension content position (first child of document sequence) preserved.
  error_contract:
  - Extension payload decoding failures reported as diagnostics, not silent drops.
  - Diagnostics include code, severity, message, source_location, object_path, originating_rule.
  security_contract:
  - Extension payload decoding never executes or resolves content implicitly.
  - External attachment retrieval gated by allowlists, byte limits, and timeouts.
  resource_limits:
  - Configurable byte limits on extension payload size.
  - Configurable timeouts on external attachment retrieval.
