- capability_id: UBL-CALC-001
  stable_name: Business-total calculation and reconciliation
  classification: PREVIEW_ISOLATED
  developer_use_cases:
  - A developer validates that declared totals match calculated totals under the profile's rounding rules and receives per-total deltas.
  spec_profiles:
  - ubl_2.3
  authority_fact_ids:
  - POL-XBZ-CALC-01
  - SAL-UBL-00110
  - SAL-UBL-00122
  - SAL-UBL-00123
  - SAL-UBL-00127
  - SAL-UBL-50613DF5EFE944E0
  - RF-UBL-00005
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Calculate document totals under explicit rounding/tolerance policies and compare to declared totals without mutating them unless repair mode is explicitly requested.
  - Calculate line extensions, allowance/charge totals, tax totals, and payable amounts under explicit rounding/tolerance policies and reconcile them against declared totals with per-total deltas, never mutating declared values outside explicit repair mode.
  preservation_contract:
  - Declared totals are never silently mutated; repair mode is an explicit opt-in.
  error_contract:
  - Per-total deltas reported when declared totals disagree with calculated totals.
  security_contract:
  - Checked arithmetic for size and count calculations; bound recursion depth.
  resource_limits:
  - Configurable tolerance thresholds for reconciliation.
