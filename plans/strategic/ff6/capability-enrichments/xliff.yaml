- capability_id: XLIFF-INLINE-001
  stable_name: Inline-code model
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer reorders translated text around inline codes and cannot silently orphan or cross paired codes.
  spec_profiles:
  - xliff_2.1
  authority_fact_ids:
  - POL-XLC-INLINE-01
  - POL-XLC-INLINE-02
  - SAL-XLIFF-00005
  - SAL-XLIFF-00006
  - SAL-XLIFF-00013
  - SAL-XLIFF-00014
  - SAL-XLIFF-00016
  - SAL-XLIFF-D5C1325C047A7CB0
  - RF-XLF-00002
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Expose inline content as a token tree/sequence preserving paired-code relationships, identity, nesting, and original-data references.
  - Prevent or diagnose edits that orphan, duplicate, cross, or illegally reorder paired codes before save.
  - Represent inline content as a token sequence preserving paired-code identity and nesting, and refuse edits that orphan, cross, duplicate, or illegally reorder paired codes - the mergeability guarantee translation tools depend on.
  preservation_contract:
  - Token round trip preserves original data references.
  - Inline-code integrity proven not to corrupt mergeability.
  error_contract:
  - Paired-code corruption attempts (orphan, cross, duplicate) refused/diagnosed with structured diagnostics including code, severity, message, source_location, object_path, originating_rule, repair_suggestion, and auto_repair_eligible.
  security_contract:
  - Inline-code parsing does not evaluate embedded payloads.
  resource_limits:
  - Bounded inline nesting depth with configurable limit.
  performance_budget: PLANNED
  dependency_policy: PLANNED
  positive_tests: PLANNED
  negative_tests: PLANNED
  property_tests: PLANNED
  roundtrip_tests: PLANNED
  fixtures: PLANNED
  independent_oracles: PLANNED
  documentation_examples: PLANNED
  compatibility_status: PLANNED
  proof_node_ids: PLANNED
  invalidation_inputs:
  - Orphaned, crossed, or duplicated paired-code edits.
  - Inline original-data references that do not resolve to data elements in the same unit.
  taskcard_ids:
  - TC-FF6-PROGRAM-CAPABILITIES-001
  release_state: PLANNED
- capability_id: XLIFF-LIFECYCLE-001
  stable_name: Baseline lifecycle I/O
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer integrates the library with only lifecycle APIs and never needs format-internal knowledge for I/O plumbing.
  spec_profiles:
  - xliff_2.1
  authority_fact_ids:
  - POL-SLC-LIFECYCLE-01
  - POL-SLC-LIFECYCLE-02
  - POL-SLC-LIFECYCLE-03
  - POL-SLC-LIFECYCLE-04
  - POL-SLC-LIFECYCLE-05
  - POL-SLC-LIFECYCLE-06
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Provide load from filesystem path, readable stream, and in-memory bytes, returning the format's root document/model object.
  - Provide save to filesystem path and writable stream, plus serialization to bytes, producing output the library's own loader accepts.
  - Expose the detected format version and any declared version separately; never silently rewrite a declared version.
  - Support a strict read mode that rejects malformed input with diagnostics and a tolerant read mode that recovers where the format permits, with recovery actions reported.
  - Expose validation as a first-class callable operation returning structured diagnostics, not only as exceptions raised during parsing.
  - Offer deterministic serialization such that an unchanged loaded document serializes to identical bytes across repeated calls in the same mode.
  preservation_contract:
  - Unchanged loaded document serializes to identical bytes across repeated calls in the same mode.
  error_contract:
  - Strict read mode rejects malformed input with structured diagnostics.
  - Tolerant read mode reports recovery actions through diagnostics.
  - Validation returns structured diagnostics as first-class callable operation.
  security_contract:
  - Safe defaults for all I/O operations; no implicit external effects during load/save.
  resource_limits:
  - Configurable input size limits on load.
