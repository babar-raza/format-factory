- capability_id: XLIFF-SEC-001
  stable_name: Baseline security posture
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer processes untrusted input with safe defaults and only opts into external effects explicitly.
  spec_profiles:
  - xliff_2.1
  authority_fact_ids:
  - POL-SLC-SEC-01
  - POL-SLC-SEC-02
  - POL-SLC-SEC-03
  - POL-SLC-SEC-04
  - POL-SLC-SEC-05
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations and bound recursion depth.
  preservation_contract:
  - Security limits do not silently corrupt preserved content; documents exceeding limits are refused, not truncated.
  error_contract:
  - Limit violations diagnosed with structured diagnostics including code, severity, message, and the specific limit exceeded.
  - Path traversal attempts refused with diagnostic.
  - External reference resolution refused by default with diagnostic.
  security_contract:
  - XML external entities disabled by default.
  - Resource-data resolution opt-in with allowlists and limits.
  - Bounded nesting depth and document size with configurable limits.
  - No implicit network access, code execution, or plugin loading.
  - Checked arithmetic for all size and count calculations.
  resource_limits:
  - Configurable input size limit with safe default.
  - Configurable nesting depth limit with safe default.
  - Configurable element/record count limit with safe default.
  - Configurable total decoded payload bytes limit with safe default.
  - Bounded recursion depth.
  performance_budget: PLANNED
  dependency_policy: PLANNED
  positive_tests: PLANNED
  negative_tests: PLANNED
  property_tests: PLANNED
  roundtrip_tests: PLANNED
  fixtures: PLANNED
  independent_oracles: PLANNED
  documentation_examples: PLANNED
  compatibility_status: PLANNED
  proof_node_ids: PLANNED
  invalidation_inputs:
  - XML external entity expansion attempted.
  - Path traversal in resource-data reference.
  - Input exceeding configured size, depth, or element count limits.
  - Algorithmic complexity attack via deeply nested or pathologically structured input.
  taskcard_ids:
  - TC-FF6-PROGRAM-CAPABILITIES-001
  release_state: PLANNED
