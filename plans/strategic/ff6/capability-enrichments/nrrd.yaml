- capability_id: NRRD-HEADER-001
  stable_name: Complete header parsing
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer inspects any conformant file's full metadata without touching the payload.
  spec_profiles:
  - nrrd0001
  - nrrd0002
  - nrrd0003
  - nrrd0004
  - nrrd0005
  authority_fact_ids:
