- capability_id: NRRD-LAZY-001
  stable_name: Large-data and lazy I/O
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer streams a slice from a huge compressed dataset and is told when a request forces full decode.
  spec_profiles:
  - nrrd0001
  - nrrd0002
  - nrrd0003
  - nrrd0004
  - nrrd0005
  authority_fact_ids:
  - POL-SCR-LAZY-01
  - RF-NRRD-00002
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Provide header-only and lazy payload loading, memory mapping for eligible uncompressed data, streaming decode, and region reads where layout permits, reporting when full decompression is required.
  - Provide header-only loading, lazy payload access, memory mapping for eligible raw data, and streaming decode for compressed payloads, reporting when a requested slice forces full decompression.
  preservation_contract:
  - Lazy access returns identical data to eager access for the same region.
  - Memory-mapped views are read-only unless explicitly requested as writable.
  error_contract:
  - Full-decompression-required condition reported with code, severity, and message.
  - Memory-mapping ineligibility reported with code and originating_rule.
  security_contract:
  - Lazy access does not bypass decompression or payload-size limits.
  - Memory-mapped regions bounded by declared payload size.
  resource_limits:
  - Bounded memory consumption for header-only and lazy modes.
  - Streaming decode buffers bounded by configurable limit.
