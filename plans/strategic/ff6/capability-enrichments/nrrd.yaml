  - A key containing the := delimiter.
  - Escaped newline and backslash sequences, empty values, and repeated keys.
  - Key/value metadata whose decoded size exceeds configured limits.
  taskcard_ids:
  - TC-FF6-NRRD-PROFILE-SURFACE-001
  release_state: PLANNED
- capability_id: NRRD-KINDS-001
  stable_name: NRRD0003 axis kinds
  classification: STABLE_REQUIRED
