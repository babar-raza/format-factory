  - SAL-NRRD-00005
  - SAL-NRRD-00007
  - SAL-NRRD-00008
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Recognize every specified magic/version; parse ordinary field specifications and comments; enforce field uniqueness and ordering without treating NRRD0002 key/value syntax as an NRRD0001 baseline feature.
  - Accept the specification's permitted line endings and lexical variants while preserving original lexical form in lossless mode.
  preservation_contract:
  - Unknown ordinary header fields and comments that can be carried safely are preserved in lossless mode.
  - Optional-field absence preserved (not filled with defaults).
  - Original lexical form of values preserved in lossless mode.
  error_contract:
  - Unrecognized magic line reported with code, severity, source_location, and message.
  - Duplicate field reported with code, object_path, originating_rule, and repair_suggestion.
  - Invalid field ordering reported with severity and originating_rule.
  security_contract:
  - Header size bounded by configurable input-size limit.
  - No execution of embedded content during header parsing.
  resource_limits:
  - Maximum header line count enforced.
  - Maximum header-line length and total header byte count enforced before payload access.
