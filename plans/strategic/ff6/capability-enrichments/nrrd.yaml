  model_invariants:
  - Model every specified axis kind and its aliases only for NRRD0003 and newer; preserve unknown future kinds safely while strict validation reports them.
  preservation_contract:
  - Preserve each declared kind token and alias lexically in lossless mode while exposing a normalized typed enumeration separately.
  - Preserve unknown future kind tokens in the raw view without assigning invented semantics.
  error_contract:
