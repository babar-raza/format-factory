- capability_id: NRRD-MULTIFILE-001
  stable_name: NRRD0004 multi-file detached payloads
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer streams a slice stack stored across many files and receives a precise error before reading when the sequence or LIST is incomplete.
  spec_profiles:
  - nrrd0004
  - nrrd0005
  authority_fact_ids:
  - POL-SCR-MULTIFILE-01
  - SAL-NRRD-00006
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Read and write numbered sequences and LIST payloads only for NRRD0004 and newer; validate min/max/step/subdimension, filename expansion, file count, and bytes per file before allocation.
  preservation_contract:
  - Preserve whether the source used a numbered pattern or LIST, its lexical pattern, subdimension, ordering, and each listed path in lossless mode.
  - Changing a partition strategy is an explicit conversion and is included in the loss/conversion report.
  error_contract:
  - Numbered patterns or LIST forms under NRRD0001 through NRRD0003 produce a version-feature diagnostic with NRRD0004 as the minimum profile.
  - Invalid min/max/step, pattern expansion, list length, subdimension, or per-file payload size reports expected and observed values before data reads.
  - Missing, duplicate, inaccessible, or traversal-escaping members identify the exact logical member and resolved path policy.
  security_contract:
  - Resolve every expanded or listed member through the same configured-root, traversal, symlink, and absolute-path policy.
  - Validate the complete member plan and checked aggregate payload size before opening payload files.
  resource_limits:
  - Bound generated filename count, LIST entry count, per-member bytes, aggregate bytes, and simultaneously open files.
