- capability_id: NRRD-SEC-001
  stable_name: Baseline security posture
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer processes untrusted input with safe defaults and only opts into external effects explicitly.
  spec_profiles:
  - nrrd0001
  - nrrd0002
  - nrrd0003
  - nrrd0004
  - nrrd0005
  authority_fact_ids:
  - POL-SLC-SEC-01
  - POL-SLC-SEC-02
  - POL-SLC-SEC-03
  - POL-SLC-SEC-04
  - POL-SLC-SEC-05
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations and bound recursion depth.
  preservation_contract:
  - Security limits do not alter preserved data; they reject input before model construction.
  error_contract:
  - Input size limit exceeded reported with code, severity, and message.
  - Decompression ratio exceeded reported with code, severity, source_location, and originating_rule.
  - Path traversal attempt reported with code, severity, and message.
  - Arithmetic overflow in size calculation reported with code and originating_rule.
  security_contract:
  - Checked arithmetic for all size and count calculations; reject overflow explicitly.
  - Decompressed-byte and compression-ratio limits with configurable policy.
  - Detached references resolve only inside configured roots; absolute paths gated.
  - Header-first validation; no full-payload allocation before size verification.
  - No network resolution, code execution, or plugin loading during load/validate/save.
  resource_limits:
  - Configurable input size limit with safe default.
  - Configurable element/record count limit with safe default.
  - Configurable total decoded payload byte limit with safe default.
  - Configurable decompression ratio limit with safe default.
  - Bounded recursion depth.
  performance_budget: PLANNED
  dependency_policy: PLANNED
  positive_tests: PLANNED
  negative_tests: PLANNED
  property_tests: PLANNED
  roundtrip_tests: PLANNED
  fixtures: PLANNED
  independent_oracles: PLANNED
  documentation_examples: PLANNED
  compatibility_status: PLANNED
  proof_node_ids: PLANNED
  invalidation_inputs:
  - Hostile header declaring dimensions whose product overflows size arithmetic.
  - Compressed payload designed as a decompression bomb.
  - Detached data-file path with directory traversal sequences.
  - Declared payload size exceeding configured byte limit.
  - Input file exceeding configured input size limit.
  taskcard_ids:
  - TC-FF6-PROGRAM-CAPABILITIES-001
  - TC-FF6-NRRD-PROFILE-SURFACE-001
  release_state: PLANNED
