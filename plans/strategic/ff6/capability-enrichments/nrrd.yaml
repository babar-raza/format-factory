  model_invariants:
  - Support attached payloads and the single-file detached form in every profile; route numbered and LIST multi-file forms exclusively through NRRD-MULTIFILE-001 for NRRD0004 and newer.
  - Apply the profile-specific detached-path rule: before NRRD0004 only a leading ./ selects header-relative resolution, while NRRD0004 and newer resolve every non-absolute path relative to the detached header.
  preservation_contract:
  - Attached/detached form preserved in lossless mode; form changes are explicit conversion operations.
  - Line-skip and byte-skip values preserved when re-serializing in lossless mode.
  error_contract:
