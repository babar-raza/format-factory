- capability_id: NRRD-FRAME-001
  stable_name: NRRD0005 measurement frame
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A diffusion-imaging developer transforms tensor coefficients through the declared measurement frame without confusing it with voxel orientation.
  spec_profiles:
  - nrrd0005
  authority_fact_ids:
  - POL-SCR-FRAME-01
  - SAL-NRRD-00024
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Model measurement frames only for NRRD0005; require exactly space-dimension vectors and expose an explicit measurement-to-world transform separate from index-to-world.
  preservation_contract:
  - Preserve the declared vector order, numeric values, lexical values, and absent-versus-present state in lossless mode.
  - Keep the measurement frame distinct from space directions and space origin in both typed and raw-header views.
  error_contract:
  - A measurement frame under NRRD0001 through NRRD0004 produces a version-feature diagnostic with the required minimum profile.
  - Frame vector count or vector length mismatch reports the declared space dimension, observed cardinality, source location, and originating rule.
  - A frame without a resolvable surrounding space dimension is rejected in strict mode without guessing a dimension.
  security_contract:
  - Parse frame coefficients as bounded passive numeric data; never invoke coordinate-system or plugin resolution.
  resource_limits:
  - Bound vector count and vector length by the validated space dimension before allocating a matrix.
