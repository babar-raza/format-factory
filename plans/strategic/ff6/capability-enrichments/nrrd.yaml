  security_contract:
  - Detached references resolve only inside configured roots; absolute paths gated.
  - Path traversal prevention for all detached data-file references.
  - Header-first validation; no payload allocation before size verification.
  resource_limits:
  - At most one detached payload file is opened by this baseline capability.
  - Total payload byte count bounded by configurable limit.
