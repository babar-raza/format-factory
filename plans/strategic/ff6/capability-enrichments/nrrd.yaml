- capability_id: NRRD-ENC-001
  stable_name: All defined encodings
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer queries supported encodings at runtime and receives explicit errors rather than silent fallbacks.
  spec_profiles:
  - nrrd0001
  - nrrd0002
  - nrrd0003
  - nrrd0004
  - nrrd0005
  authority_fact_ids:
  - POL-SCR-ENC-01
  - SAL-NRRD-00013
  - RF-NRRD-00005
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Read and write every specified encoding using the correct container framing; expose codec availability; fail explicitly when an optional codec is unavailable.
  - Test every magic version, every type alias, every encoding, endian combinations, attached plus all detached data-file forms, and hostile fixtures (decompression bombs, overflow shapes, traversal paths, truncated payloads).
  preservation_contract:
  - Encoding round-trips preserve payload byte-identity for lossless encodings.
  - Codec availability is queryable; unavailable codecs produce explicit errors, not silent fallbacks.
  error_contract:
  - Unavailable codec raises a diagnostic with code, severity, and message naming the missing encoding.
  - Malformed encoded payload reported with source_location and originating_rule.
  security_contract:
  - Decompressed-byte and compression-ratio limits with configurable policy for compressed encodings.
  - Checked arithmetic for payload size calculations.
  resource_limits:
  - Decompressed payload byte limit enforced before full decompression.
  - Compression ratio limit guards against decompression bombs.
