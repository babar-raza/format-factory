- capability_id: NRRD-ARRAY-001
  stable_name: Typed N-dimensional array access
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer crops a volume and every axis-aligned metadata field follows the crop.
  spec_profiles:
  - nrrd0001
  - nrrd0002
  - nrrd0003
  - nrrd0004
  - nrrd0005
  authority_fact_ids:
  - POL-SCR-ARRAY-01
  - RF-NRRD-00001
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Expose shape, strides, dtype, and axis metadata with element access, slicing, permutation, flip, and crop that update orientation and per-axis metadata; zero-copy views where safe, explicit copies otherwise.
  - Expose typed N-dimensional array access with shape, strides, dtype, slicing, axis permutation, flip, and crop where orientation and per-axis metadata follow every operation - the imaging-pipeline core.
  preservation_contract:
  - Per-axis metadata follows every array operation (permutation, flip, crop, slice).
  - Zero-copy views preserve backing data; explicit copies are independent.
  error_contract:
  - Axis index out of range raises a diagnostic with object_path and originating_rule.
  - Shape/stride inconsistency reported with severity, code, and repair_suggestion.
  security_contract:
  - Checked arithmetic for size and stride calculations; reject overflow explicitly.
  resource_limits:
  - Element count bounded by configurable limit before allocation.
  performance_budget: PLANNED
  dependency_policy: PLANNED
  positive_tests: PLANNED
  negative_tests: PLANNED
  property_tests: PLANNED
  roundtrip_tests: PLANNED
  fixtures: PLANNED
  independent_oracles: PLANNED
  documentation_examples: PLANNED
  compatibility_status: PLANNED
  proof_node_ids: PLANNED
  invalidation_inputs:
  - Axis index exceeding declared dimension count.
  - Permutation order with duplicate or out-of-range indices.
  - Crop region exceeding axis size.
  taskcard_ids:
  - TC-FF6-PROGRAM-CAPABILITIES-001
  - TC-FF6-NRRD-PROFILE-SURFACE-001
  release_state: PLANNED
