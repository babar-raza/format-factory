- capability_id: NRRD-KEYVALUE-001
  stable_name: NRRD0002 key/value metadata
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer round-trips custom acquisition metadata without losing empty values, newlines, backslashes, or duplicate-key resolution semantics.
  spec_profiles:
  - nrrd0002
  - nrrd0003
  - nrrd0004
  - nrrd0005
  authority_fact_ids:
  - POL-SCR-KEYVALUE-01
  - SAL-NRRD-00021
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Parse, validate, preserve, edit, and write key/value pairs only for NRRD0002 and newer, implementing newline/backslash escaping, forbidden key delimiters, and last-value-wins duplicate behavior.
  preservation_contract:
  - Preserve insertion order, exact key and value text, escape sequences, empty values, and repeated-key source occurrences in the raw view.
  - Expose the specification's last-value-wins semantic view without deleting shadowed source occurrences during lossless round trips.
  error_contract:
  - Key/value syntax under NRRD0001 produces a version-feature diagnostic with NRRD0002 as the minimum profile.
  - A key containing the forbidden delimiter or an invalid escape reports the exact line, column, and originating rule.
  - Resource-limit failures report the observed pair count and total decoded metadata bytes.
  security_contract:
  - Treat keys and values as passive text; never interpolate, evaluate, or use them as paths without a separate caller operation.
  resource_limits:
  - Bound pair count, key length, value length, and total decoded key/value bytes.
