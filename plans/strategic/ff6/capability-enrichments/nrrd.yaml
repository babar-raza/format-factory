- capability_id: NRRD-LIFECYCLE-001
  stable_name: Baseline lifecycle I/O
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer integrates the library with only lifecycle APIs and never needs format-internal knowledge for I/O plumbing.
  spec_profiles:
  - nrrd0001
  - nrrd0002
  - nrrd0003
  - nrrd0004
  - nrrd0005
  authority_fact_ids:
  - POL-SLC-LIFECYCLE-01
  - POL-SLC-LIFECYCLE-02
  - POL-SLC-LIFECYCLE-03
  - POL-SLC-LIFECYCLE-04
  - POL-SLC-LIFECYCLE-05
  - POL-SLC-LIFECYCLE-06
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Provide load from filesystem path, readable stream, and in-memory bytes, returning the format's root document/model object.
  - Provide save to filesystem path and writable stream, plus serialization to bytes, producing output the library's own loader accepts.
  - Expose the detected format version and any declared version separately; never silently rewrite a declared version.
  - Support a strict read mode that rejects malformed input with diagnostics and a tolerant read mode that recovers where the format permits, with recovery actions reported.
  - Expose validation as a first-class callable operation returning structured diagnostics, not only as exceptions raised during parsing.
  - Offer deterministic serialization such that an unchanged loaded document serializes to identical bytes across repeated calls in the same mode.
  preservation_contract:
  - Declared format version preserved; never silently rewritten.
  - Strict/tolerant mode distinction is an explicit caller choice.
  error_contract:
  - Strict mode rejects malformed input with structured diagnostics including code, severity, message, source_location, and originating_rule.
  - Tolerant mode reports recovery actions with severity and repair_suggestion.
  - Validation callable returns structured diagnostics independent of load exceptions.
  security_contract:
  - Load from untrusted input respects all configured limits by default.
  - No implicit external effects during load, validate, or save.
  resource_limits:
  - Configurable input size limit applied at load boundary.
