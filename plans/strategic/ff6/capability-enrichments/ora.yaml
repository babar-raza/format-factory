- capability_id: ORA-ASSET-001
  stable_name: Referenced raster asset model
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer replaces layer pixels or streams an asset without losing its relationship to the layer tree.
  spec_profiles:
  - openraster_0.0.3
  - openraster_0.0.4
  - openraster_0.0.5
  authority_fact_ids:
  - POL-LRA-ASSET-01
  - SAL-ORA-00003
  - SAL-ORA-00004
  - SAL-ORA-00006
  - SAL-ORA-00007
  - SAL-ORA-00008
  - SAL-ORA-00009
  - SAL-ORA-00016
  - SAL-ORA-00017
  - SAL-ORA-00018
  - SAL-ORA-00019
  - SAL-ORA-00020
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Resolve archive-root-relative asset references safely; expose raster metadata before decode; validate existence, media type, dimensions, channel depth, and declared resource budgets.
  preservation_contract: &id001
  - Distinguish lossless round-trip output mode from normalized/canonical output mode as an explicit caller choice.
  - Report every construct that cannot be preserved before saving, through a loss report API, rather than failing silently.
  - Preserve the distinction between an absent optional value and an explicitly written default or empty value.
  - Preserve unknown or future-version constructs that can be carried safely; never silently drop unrecognized content in lossless mode.
  error_contract: &id002
  - code
  - severity
  - message
  - source_location
  - object_path
  - originating_rule
  - repair_suggestion
  - auto_repair_eligible
  security_contract:
  - Treat all input as untrusted and enforce configured resource limits before allocation or external access.
  resource_limits:
  - Bound input bytes, expanded bytes, nesting, object count, and decoded payload size.
  performance_budget: PLANNED
