  model_invariants:
  - Write required/conditional fields correctly with version selection honoring used features; preserve optional absence in lossless mode; deterministic field ordering and detached-partition policies.
  preservation_contract:
  - Optional field absence preserved in lossless mode (not filled with defaults).
  - Version selection honors used features; explicit target version validated against feature set.
  - Deterministic field ordering produces byte-identical output for unchanged documents.
  error_contract:
  - Explicit version target incompatible with used features reported with code, severity, and repair_suggestion.
