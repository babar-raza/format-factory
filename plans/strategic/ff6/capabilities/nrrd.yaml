  model_invariants:
  - Expose shape, strides, dtype, and axis metadata with element access, slicing, permutation, flip, and crop that update orientation and per-axis metadata; zero-copy views where safe, explicit copies otherwise.
  - Expose typed N-dimensional array access with shape, strides, dtype, slicing, axis permutation, flip, and crop where orientation and per-axis metadata follow every operation - the imaging-pipeline core.
  preservation_contract:
  - Per-axis metadata follows every array operation (permutation, flip, crop, slice).
  - Zero-copy views preserve backing data; explicit copies are independent.
  error_contract:
  - Axis index out of range raises a diagnostic with object_path and originating_rule.
  - Shape/stride inconsistency reported with severity, code, and repair_suggestion.
  security_contract:
  - Checked arithmetic for size and stride calculations; reject overflow explicitly.
  resource_limits:
  - Element count bounded by configurable limit before allocation.
