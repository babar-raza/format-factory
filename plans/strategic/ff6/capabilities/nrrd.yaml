  security_contract:
  - Checked arithmetic for all size and count calculations; reject overflow explicitly.
  - Decompressed-byte and compression-ratio limits with configurable policy.
  - Detached references resolve only inside configured roots; absolute paths gated.
  - Header-first validation; no full-payload allocation before size verification.
  - No network resolution, code execution, or plugin loading during load/validate/save.
  resource_limits:
  - Configurable input size limit with safe default.
  - Configurable element/record count limit with safe default.
  - Configurable total decoded payload byte limit with safe default.
  - Configurable decompression ratio limit with safe default.
  - Bounded recursion depth.
