- capability_id: NRRD-VERSION-001
  format_id: nrrd
  stable_name: Magic and feature-version compatibility
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer targets an older reader and gets an exact incompatibility report instead of a falsely labeled file.
  spec_profiles:
  - nrrd0001
  - nrrd0002
  - nrrd0003
  - nrrd0004
  - nrrd0005
  authority_fact_ids:
  - POL-SCR-VERSION-01
  - SAL-NRRD-00020
  normative_obligation_ids:
  - SAL-NRRD-OBL-1DAEF31DD0BB6EBB
  - SAL-NRRD-OBL-725881DB5590E608
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Model NRRD0001 through NRRD0005 explicitly; validate every feature against its introduction version; choose the oldest sufficient magic deterministically when no target profile is requested.
  preservation_contract:
  - Preserve the declared magic exactly in lossless mode when every carried feature is legal for that profile.
  - Never silently raise or lower a declared profile; normalized output reports and deterministically applies any required version change.
  error_contract:
  - Every later feature under an older magic reports its feature, declared profile, and minimum legal profile.
  - An explicit writer target below the minimum required version fails before writing bytes.
  - Unknown future magic values are rejected in strict mode and may be retained only as opaque input under preservation policy.
  security_contract:
  - Perform feature-version checks from bounded declarative inventories, before payload allocation or external resource access.
  resource_limits:
  - Bound the number of reported incompatibilities and retain a deterministic complete-count summary when diagnostics are truncated.
