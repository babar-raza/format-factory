  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Parse the exact fixed-width little-endian metadata-length prefix and only the declared UTF-8 JSON metadata bytes.
  - Reject duplicate keys, malformed UTF-8 or JSON, invalid metadata values, truncated metadata, and configured header-limit violations.
  preservation_contract:
  - Parsed metadata faithfully represents the original header content at the semantic level.
  - Exact JSON spelling, whitespace, and object order are not preserved; normalized deterministic metadata serialization is the explicit guarantee.
  error_contract:
  - code: stable diagnostic code identifying the specific header violation.
  - severity: error for mandatory rejections, warning for advisory conditions.
  - message: human-readable description of the header parsing failure.
  - source_location: byte offset or range within the header where the violation occurs.
  - object_path: JSON key path to the offending entry when applicable.
  - originating_rule: reference to the normative rule that requires rejection.
  - repair_suggestion: actionable fix description when deterministic repair is possible.
  - auto_repair_eligible: boolean indicating whether the violation can be auto-repaired.
  security_contract:
  - Hostile header lengths causing excessive allocation are rejected before reading header bytes.
  - Duplicate JSON keys changing descriptor meaning across parsers are rejected.
  - Malformed UTF-8 and JSON are rejected before any model construction.
  resource_limits:
  - Header byte length is bounded to 100,000,000 bytes per the official implementation limit.
  - Input byte count is bounded before header allocation.
  performance_budget: PLANNED
