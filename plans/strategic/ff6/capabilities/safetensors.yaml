  - SAL-SAFETENSORS-OBL-991021FCD2FCB37C
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Provide header-only validation, read-only path mapping, tensor-relative region views, configurable size limits, and machine-readable access-strategy disclosure.
  preservation_contract:
  - Memory-mapped access provides identical tensor data as full-load access.
  - Header-only inspection yields the same descriptor truth as full-load inspection.
  error_contract:
  - Access strategy (mapped, copied, streamed) is disclosed in machine-readable form.
  - Configurable size limits produce structured diagnostics when exceeded.
  security_contract:
  - Borrowed payload views do not outlive their mapped document owner.
  - Read-only memory mapping prevents accidental payload mutation.
  resource_limits:
  - Configurable size limits bound total mapped regions and borrowed views.
  - Header-only path reads only metadata bytes without touching payload.
  - Python heap allocation remains bounded regardless of tensor file size.
