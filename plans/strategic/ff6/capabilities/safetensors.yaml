  model_invariants:
  - Write deterministic metadata and exact payload bytes, recomputing all offsets and rejecting inconsistent models before output.
  preservation_contract:
  - Two serializations of the same model produce byte-identical output.
  - Canonical metadata ordering is deterministic and stable across invocations.
  - Exact tensor payload bytes are written without transformation.
  error_contract:
  - Inconsistent model state (mismatched shape/dtype/offset) is rejected before any output bytes are written.
  - Structured diagnostics identify which model invariant is violated.
  security_contract:
  - Writers validate the complete model before emitting any bytes to prevent partial corrupt output.
  - Offsets are recomputed from validated shape and dtype to prevent offset injection.
  - No network resources are resolved and no payload bytes are executed during writing.
  resource_limits:
  - Written header size is bounded to 100,000,000 bytes.
  - Shape dimension products use checked arithmetic during offset recomputation.
