  model_invariants:
  - Validate metadata, dtype, shape, checked size arithmetic, offsets, complete coverage, limits, and borrowed-view ownership with stable diagnostic codes.
  preservation_contract:
  - Validation is non-destructive; input is never modified by the validation process.
  error_contract:
  - code: stable diagnostic code identifying the specific validation rule violation.
  - severity: error for mandatory rejections, warning for advisory conditions.
  - message: human-readable description of the validation failure.
  - source_location: byte offset or range where the violation occurs.
  - object_path: JSON key path or tensor name identifying the offending entry.
  - originating_rule: reference to the normative rule that requires rejection.
  - repair_suggestion: actionable fix description when deterministic repair is possible.
  - auto_repair_eligible: boolean indicating whether the violation can be auto-repaired.
  - Validation layers are distinct and ordered as lexical, type, payload, and security.
  security_contract:
  - Hostile header lengths, tensor counts, dimensions, and bit widths causing excessive allocation or arithmetic overflow are rejected.
  - Overlapping, out-of-order, truncated, or unindexed tensor byte ranges are rejected before exposing payload.
  - Duplicate JSON keys are rejected to prevent descriptor meaning divergence across parsers.
  - Borrowed payload views are tracked to prevent use-after-close.
  - Never resolve network resources, execute payload bytes, import plugins, or allocate framework arrays during validation.
  resource_limits:
  - Bound input bytes, header bytes, tensor count, rank, dimensions, mapped regions, and borrowed views with configurable safe defaults.
  - Use checked arithmetic for shape products, dtype bit widths, byte counts, and absolute payload offsets.
  - Header byte length is bounded to 100,000,000 bytes.
