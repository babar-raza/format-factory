  invalidation_inputs:
  - Shape multiplication or element-bit multiplication overflows without rejection.
  - Sub-byte dtype total bit count does not end on a byte boundary.
  - Tensor byte span does not equal the checked product of shape dimensions and dtype bit width divided by eight.
  - Data buffer is not entirely indexed by tensor entries (holes or unindexed trailing bytes).
  - Declared header length exceeds the 100,000,000-byte resource limit.
  - Borrowed payload view outlives its mapped document owner.
  taskcard_ids:
  - TC-FF6-PROGRAM-CAPABILITIES-001
