- capability_id: SAFETENSORS-LAZY-001
  format_id: safetensors
  stable_name: Header-only and memory-mapped access
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer inspects or slices a multi-gigabyte tensor file with flat Python heap usage.
  spec_profiles:
  - safetensors_v0.8.0
