  - Strict mode rejects invalid input; preservation mode retains safe unknown descriptor fields; no recovery mode exists without separately specified deterministic rules.
  preservation_contract:
  - Preservation mode retains safe unknown tensor descriptor fields without treating them as understood.
  - Strict mode rejects values that cannot be represented safely.
