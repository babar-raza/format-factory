  - Expose the detected format version and any declared version separately; never silently rewrite a declared version.
  - Support a strict read mode that rejects malformed input with diagnostics and a tolerant read mode that recovers where the format permits, with recovery actions reported.
  - Expose validation as a first-class callable operation returning structured diagnostics, not only as exceptions raised during parsing.
  - Offer deterministic serialization such that an unchanged loaded document serializes to identical bytes across repeated calls in the same mode.
  preservation_contract:
  - Unchanged loaded document serializes to identical bytes across repeated calls in the same mode.
  error_contract:
  - Strict read mode rejects malformed input with structured diagnostics.
  - Tolerant read mode reports recovery actions through diagnostics.
  - Validation returns structured diagnostics as first-class callable operation.
  security_contract:
  - Safe defaults for all I/O operations; no implicit external effects during load/save.
  resource_limits:
  - Configurable input size limits on load.
