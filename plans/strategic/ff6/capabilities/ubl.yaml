- capability_id: UBL-CALC-001
  format_id: ubl
  stable_name: Business-total calculation and reconciliation
  classification: PREVIEW_ISOLATED
  developer_use_cases:
  - A developer validates that declared totals match calculated totals under the profile's rounding rules and receives per-total deltas.
  spec_profiles:
  - ubl_2.3
  authority_fact_ids:
