  format_id: ubl
  stable_name: Baseline security posture
  classification: STABLE_REQUIRED
  developer_use_cases:
  - A developer processes untrusted input with safe defaults and only opts into external effects explicitly.
  spec_profiles:
  - ubl_2.3
  authority_fact_ids:
  - POL-SLC-SEC-01
  - POL-SLC-SEC-02
  - POL-SLC-SEC-03
  - POL-SLC-SEC-04
  - POL-SLC-SEC-05
  normative_obligation_ids:
  - SAL-UBL-OBL-4CA52BA5DDD8840F
  - SAL-UBL-OBL-5026C29977F347B7
  - SAL-UBL-OBL-8396E06EA0EA75FC
  - SAL-UBL-OBL-9817A4DE4754E298
  - SAL-UBL-OBL-F506A4219783DD7D
  public_symbols: PLANNED
  source_symbols: PLANNED
  model_invariants:
  - Provide configurable limits for input size, nesting depth, element/record count, and total decoded payload bytes, with safe defaults enabled.
  - Never resolve network resources, execute embedded code, load plugins, or follow external references during load, validate, or save unless explicitly enabled by the caller.
  - Prevent path traversal and unapproved absolute-path access when resolving any detached or referenced resource.
  - Treat all embedded payloads (scripts, styles, binary blobs, signatures) as untrusted data; parsing must not evaluate them.
  - Guard against algorithmic complexity attacks; use checked arithmetic for size and count calculations and bound recursion depth.
  preservation_contract:
  - Security limits do not silently truncate or alter preserved content; violations produce diagnostics.
  error_contract:
  - Input exceeding configured limits rejected with diagnostic identifying the exceeded limit.
  - Path traversal attempts rejected with diagnostic.
  - Diagnostics include code, severity, message, source_location, object_path, originating_rule.
  security_contract:
  - External entities and DTD processing disabled by default; no network fetch during parse or validate.
  - Attachment and external-reference retrieval gated by explicit allowlists, byte limits, and timeouts.
