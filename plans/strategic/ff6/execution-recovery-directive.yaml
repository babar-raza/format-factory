execution_model_rationale: >
  The independent assessment (2026-08-04) found NRRD (17/65 obligations
  implemented, golden-slice gap is a single missing endian guard clause),
  SafeTensors (all 11 declared capabilities coded, ~1,300 LOC, obligation
  tests already present), and IPYNB (~7,200 LOC, ~60-70% toward production)
  each carry substantially more real implementation than product_states:
  UNASSESSED implies. The critical path for Stage 2+ is independently
  verifying and certifying existing behavior against obligations, not
  writing product code from a blank slate. This does not change what
  "certified" means or skip any required proof step — it changes where
  effort is spent first (read + prove before writing new code).
