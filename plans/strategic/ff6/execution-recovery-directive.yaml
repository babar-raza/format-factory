principles:
  - Product behavior and independent proof are the unit of progress.
  - Planning, reports, taskcards, test presence, and source presence are non-promoting.
  - Repair only a demonstrated critical or high control defect before product work.
  - Generalize machinery only after two distinct product slices prove the repeated need.
  - Preserve all final production and certification requirements.
  - Continue safe disjoint work without routine human confirmation.

state_machine:
  initial: PLAN_PACKAGED_FOR_INDEPENDENT_REVIEW
  terminal: SIX_FORMAT_PROGRAM_COMPLETE
  # Hardening amendment 2026-08-04: STAGE_2_NRRD_GOLDEN_SLICE and
  # STAGE_3_SAFETENSORS_REFERENCE_SLICE are concurrently enterable, not
  # sequential. Their source/test trees are fully disjoint
  # (src/python/nrrd/** vs src/python/safetensors/**), each is claimed under
  # the existing coordination lease system (tools/supervisor/coordination),
  # and work_in_progress.initial_product_writers was already provisioned at
  # 2 — the original BLOCKED_BY_NRRD_ACCEPTANCE gate on SafeTensors was a
  # sequencing artifact, not a real dependency. same_product_mutation_limit
  # (1) still applies per-format; it does not force cross-format serialization.
  transitions:
    - from: PLAN_PACKAGED_FOR_INDEPENDENT_REVIEW
      to: STAGE_1_MINIMAL_CONTROL_REPAIR
      requires:
        - independent review package inspected
        - no unresolved critical error in plan artifact integrity
    - from: STAGE_1_MINIMAL_CONTROL_REPAIR
      to: [STAGE_2_NRRD_GOLDEN_SLICE, STAGE_3_SAFETENSORS_REFERENCE_SLICE]
      requires:
        - TC-FF6-EXECUTION-RECOVERY-001 accepted
        - exact governed NRRD and SafeTensors mutation paths unlocked
        - controller continuation can select either TC-FF6-NRRD-GOLDEN-SLICE-001
          or TC-FF6-SAFETENSORS-REFERENCE-SLICE-001, whichever has a free
          product-writer slot first
    - from: [STAGE_2_NRRD_GOLDEN_SLICE, STAGE_3_SAFETENSORS_REFERENCE_SLICE]
      to: STAGE_4_EXTRACT_ONLY_PROVEN_SHARED_MACHINERY
      requires:
        - TC-FF6-NRRD-GOLDEN-SLICE-001 independently accepted
        - TC-FF6-SAFETENSORS-REFERENCE-SLICE-001 independently accepted
        - built-wheel proof bound to both accepted candidates
        - two archetype comparison identifies actual repeated machinery
    - from: STAGE_4_EXTRACT_ONLY_PROVEN_SHARED_MACHINERY
      to: IPYNB_VERTICAL_SLICES
      requires:
        - extraction is completed with both archetype regressions, or explicitly unnecessary
    - from: IPYNB_VERTICAL_SLICES
      to: XLIFF_VERTICAL_SLICES
      requires: [ipynb implementation obligations complete or independently blocked]
    - from: XLIFF_VERTICAL_SLICES
      to: UBL_VERTICAL_SLICES
      requires: [xliff implementation obligations complete or independently blocked]
    - from: UBL_VERTICAL_SLICES
      to: OPENRASTER_VERTICAL_SLICES
      requires: [ubl implementation obligations complete or independently blocked]
    - from: OPENRASTER_VERTICAL_SLICES
      to: PER_FORMAT_CERTIFICATION
      requires: [all unblocked format implementation obligations complete]
    - from: PER_FORMAT_CERTIFICATION
      to: SIX_FORMAT_PROGRAM_COMPLETE
      requires: [all six technical certification graphs pass]

