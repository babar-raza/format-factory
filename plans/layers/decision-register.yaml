    disposition: adopted
    rationale: >
      Mission AGENT-COORD-2026-07-15 (plans/.claude/lazy-hugging-lovelace.md).
      Root causes of cross-agent lost work (R1227/GAP-MA-006): no agent
      identity or write attribution, no pre-write arbitration for interactive
      sessions, enforcement asymmetry (headless-only), etiquette-based
      voluntary guards that stochastic agents skip. Decision: (1) ambient
      enforcement - Claude sessions are auto-registered, auto-claimed and
      auto-journaled by SessionStart/PreToolUse/PostToolUse/SessionEnd hooks
      so correct behavior requires zero agent discipline; (2) coordination
      state lives OFF-repo at %LOCALAPPDATA%/ff-coordination/<repo-key>/
      (keyed on git common dir; FF_AGENT_COORDINATION_ROOT override) because
      the repo including .git/.local is OneDrive-synced and SQLite WAL under
      sync interference is a corruption risk on a per-edit hot path;
      (3) interactive layer fails OPEN with audited FAIL_OPEN/BYPASS events
      (a hook bug must not brick sessions) while the pre-commit layer fails
      CLOSED; V195 fails sprints carrying unexplained degradations;
      (4) legacy concurrency package (MissionLock/WorkerClaims) subsumed via
      a mirror bridge - every legacy claim/lock also exists as a coordination
      lease and coordination conflicts raise the legacy exceptions - rather
      than a table rewrite, preserving 42 proven tests; full delegation is
      registered follow-up; (5) attribution never trusts git status: content
      hashes vs lease baselines, own/other write journal, and HEAD blob
      (newline-normalized for Windows CRLF), with UNKNOWN always resolving to
      refuse-and-preserve. Proven by 16/16 pilots including a before/after
      reproduction of the unsafe git add -A sweep
      (reports/coordination/pilot-evidence/).
