cross_cutting_unmapped_product_tracks:
  acquisition:
    unmapped_skill_ids:
    - score-format
    - create-acquisition-pack
    - backfill-gate4-prototype-evidence
    already_dual_attributed_skill_ids:
    - check-gate
    - check-release-boundary
    already_dual_attributed_layers:
    - L18
    - L21
    decision: cross_cutting_unmapped
    rationale: The acquisition product_track covers pre-portfolio format scoring,
      acquisition-pack scaffolding, and Gate 4 evidence backfill -- work that happens
      BEFORE a format is admitted into the 29-layer taxonomy (the taxonomy's own dependency
      graph starts at 'External Specs -> L01 SAL', which presumes the format has already
      been chosen). No L01-L27 layer owns the decision of whether to acquire a new
      format at all, so 3 of the 5 acquisition-track skills (score-format, create-acquisition-pack,
      backfill-gate4-prototype-evidence) are intentionally left unattributed to any
      single layer rather than force-fit. The other 2 (check-gate, check-release-boundary)
      are generic gate/boundary checkers reused beyond acquisition (Gate 8/11, release
      boundary) and are correctly already attributed to L18 (Package Release) and
      L21 (AI Acceleration Boundary).
    resolved_by: TC-EXT-006-09
  playbook_governance:
    unmapped_skill_ids:
    - replay-acquisition-playbook
    - diff-playbook-outputs
    - export-review-queue
    - validate-playbook
    decision: cross_cutting_unmapped
    rationale: The playbook_governance product_track (FF-PLAYBOOK-SYSTEM-001) is read-only
      dry-run/validate/diff/export tooling for the acquisition playbook itself --
      it governs the SAME pre-portfolio acquisition decision process as the 'acquisition'
      track above, not any of the L01-L27 execution layers. Grouped with the acquisition-track
      decision as one cross-cutting, intentionally unmapped bucket rather than forced
      into an unrelated layer.
    resolved_by: TC-EXT-006 (computed fresh; not explicitly named in the TC-EXT-006-01..08
      child tables, but discovered during the live registry-vs-index reconciliation)
