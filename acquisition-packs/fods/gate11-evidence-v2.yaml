evidence_version: "2.0"
incident_closure: GI-FODS-NET-001
date: 2026-07-02
supersedes: gate11-evidence-v1 (implied by prior submission packet)

summary: >
  This evidence packet documents the corrected state of the FODS .NET commercial implementation
  after resolution of governance incident GI-FODS-NET-001. The incident identified 102 public
  methods in FodsDocumentMissingMethods.cs (untracked file) as falling into anti-pattern
  categories: 67 constant-zero methods (Category D), 25 detached-dictionary property stubs
  (Category B), 2 computable DOM methods (Category A), 2 alias delegates (Category C),
  and 3 private guard helpers (Category E).

  All 6 categories have been remediated in Sprints 1-5 of the buzzing-wiggling-whistle plan.

# ─── WHAT CHANGED FROM v1 ───────────────────────────────────────────────────

changes_from_v1:
  methods_removed:
    count: 67
    description: >
      Category D constant-zero public APIs (GetChartCount, GetImageCount, GetFormulaCount,
      and 64 others) removed. These had no ODF specification basis. They inflated the
      visible API surface with stub behavior (=> 0) that was not computable from ODF XML.
    test_impact: -574 tests (88 test files deleted — all Type 1 guard-only/tautological)

  methods_upgraded:
    count: 25
    category: B
    description: >
      Category B property getters/setters upgraded from detached-dictionary backing to
      ODF-XML-grounded implementation via FodsStyleResolver (reader) and FodsStyleEditor (writer).
      Properties include: GetCellHorizontalAlignment, GetCellVerticalAlignment, GetCellFontColor,
      GetCellFontName, GetCellFontSize, GetCellBackgroundColor, GetCellBorderStyle,
      GetCellUnderline, GetCellShrinkToFit, GetCellIndentLevel, GetCellRotationAngle,
      GetCellStrikethrough, GetCellProtection, GetCellMergeInfo, GetSheetFreezeRows,
      GetSheetFreezeColumns, GetSheetZoomLevel, GetSheetShowGrid, GetSheetShowHeaders,
      GetSheetRightToLeft, GetSheetTabColor, GetSheetVisibility, GetSheetPrintArea,
      GetColumnWidth, GetRowHeight.
    test_impact: +14 new Type 4 persistence roundtrip tests; existing Type 3 ODF semantic tests added

  infrastructure_added:
    - file: src/net/fods/FodsStyleResolver.cs
      description: ODF style chain resolver — reads cell/column/row styles from ODF XML
    - file: src/net/fods/FodsStyleEditor.cs
      description: ODF setter path — writes property to correct ODF auto-style element
    - file: tests/net/fods/Fixtures/fods-cell-styles.fods
      description: Fixture with explicit center-aligned, 14pt, red-font, yellow-bg cell
    - file: tests/net/fods/Fixtures/fods-sheet-view-settings.fods
      description: Fixture with office:settings freeze pane / zoom / ShowGrid
    - file: tests/net/fods/Fixtures/fods-column-widths.fods
      description: Fixture with explicit 2.5cm/5cm column widths and 0.8cm row height

