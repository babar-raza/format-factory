# ─── PERSISTENCE ROUNDTRIP EVIDENCE ──────────────────────────────────────────

persistence_roundtrip_evidence:
  test_file: tests/net/fods/FodsGI001CategoryBRoundtripTests.cs
  test_count: 11
  methodology: CreateNew → AddSheet → SetCellValue → Set[Property] → ToFodsXml() → LoadFromXml() → Get[Property]
  properties_proven:
    - GetCellHorizontalAlignment  # "center", "end"
    - GetCellVerticalAlignment    # "middle"
    - GetCellFontColor            # "#0000FF"
    - GetCellUnderline            # "solid"
    - GetCellShrinkToFit          # true
    - GetCellRotationAngle        # 90
    - GetCellStrikethrough        # true
    - GetCellBorderStyle          # "0.05pt solid #000000"
    - GetCellIndentLevel          # 2
    - compound (4 props same cell)

  rt_mut_05_inversion:
    test_file: tests/net/fods/FodsRoundtripMutationTests.cs
    prior_test: Roundtrip_SetCellFontColor_DoesNotPersist_KnownGap (SKIPPED/KNOWN_GAP)
    replacement: RT_MUT_05_HEALED_SetCellFontColor_Roundtrips (PASSES)
    proven: SetCellFontColor persists through ToFodsXml/LoadFromXml cycle

# ─── ODF SEMANTIC FIXTURE EVIDENCE ───────────────────────────────────────────

odf_semantic_evidence:
  - fixture: tests/net/fods/Fixtures/fods-column-widths.fods
    property: GetColumnWidth
    test_file: tests/net/fods/FodsR442GetColumnWidthDedicatedTests.cs
    assertions:
      - "GetColumnWidth(Sheet1, 0) ≈ 70.87 pt (2.5cm × 28.3465)"
      - "GetColumnWidth(Sheet1, 1) ≈ 141.73 pt (5cm × 28.3465)"
      - "GetColumnWidth(Sheet1, 2) = 0.0 pt (no style)"
  - fixture: tests/net/fods/Fixtures/fods-column-widths.fods
    property: GetRowHeight
    test_file: tests/net/fods/FodsR443GetRowHeightDedicatedTests.cs
    assertions:
      - "GetRowHeight(Sheet1, 0) ≈ 22.68 pt (0.8cm × 28.3465)"
      - "GetRowHeight(Sheet1, 1) = 0.0 pt (no style)"
  - fixture: tests/net/fods/Fixtures/fods-sheet-view-settings.fods
    property: GetSheetFreezeRows
    test_file: tests/net/fods/FodsR452GetSheetFreezeRowsDedicatedTests.cs
    assertions:
      - "GetSheetFreezeRows(Sheet1) = 2 (HorizontalSplitPosition=2, HorizontalSplitMode=2)"
      - "GetSheetFreezeRows on doc with no settings = 0"
  - fixture: tests/net/fods/Fixtures/fods-cell-styles.fods
    property: GetCellHorizontalAlignment
    test_file: tests/net/fods/FodsR455GetCellHorizontalAlignmentDedicatedTests.cs
    assertions:
      - "GetCellHorizontalAlignment(Sheet1, 0, 0) = 'center' (ce1 style)"
      - "GetCellHorizontalAlignment(Sheet1, 0, 1) = 'end' (ce2 style)"
      - "GetCellHorizontalAlignment(Sheet1, 0, 2) = 'start' (no style → default)"

