python_library: "Custom implementation using struct (binary header parsing). No PyPI library required — format is well-documented binary."
oracle_strategy: "Round-trip: construct XCF with known pixel data, read back, compare layer pixel arrays and metadata."
acquisition_risk_classification: LOW
acquisition_risk_notes: "XCF binary header and structure are fully documented in GIMP developer docs. Format versions are stable. No encryption or DRM. GPLv3 on GIMP source does not restrict format parsing."
