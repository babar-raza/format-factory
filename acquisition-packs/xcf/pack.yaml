  gate_2:
    status: passed
    approved_by: "delegated_agent_r27"
    approved_date: "2026-05-19"
    fast_path_eligible: false
    spec_source: "https://developer.gimp.org/core/xcf/"
    spec_version_confirmed: "XCF v011 (GIMP 2.10+)"
    spec_access: public
    patent_search_required: false
    patent_notes: "No patents on XCF format. GIMP is a GNU project. Format is community-defined, no standards body, no patent pool."
    spec_summary: |
      XCF file structure:
        Header (14 bytes):
          - magic: 9 bytes ('gimp xcf ' — note trailing space)
          - version: 4 bytes ('file' for v0, 'v001' through 'v011')
          - NUL: 1 byte (0x00)

        Canvas properties:
          - width: 4 bytes (big-endian uint32)
          - height: 4 bytes (big-endian uint32)
          - color_mode: 4 bytes (0=RGB, 1=Grayscale, 2=Indexed)

        Property list:
          - Sequence of (type: uint32, payload_length: uint32, payload: bytes)
          - Terminated by PROP_END (type=0, length=0)
          - Notable properties: PROP_COLORMAP (1), PROP_COMPRESSION (17),
            PROP_RESOLUTION (19), PROP_PARASITES (21)

        Layer/channel offsets:
          - Layer offsets: sequence of uint32 (0-terminated)
          - Channel offsets: sequence of uint32 (0-terminated)

        Layers: each has name, properties, hierarchy (tiles), mask
        Channels: each has name, properties, hierarchy

        Compression modes: 0=none, 1=RLE, 2=zlib (v010+)
        Tile size: 64x64 pixels

      Authoritative source: GIMP source code app/xcf/xcf-load.c, xcf-save.c
      Developer docs: https://developer.gimp.org/core/xcf/
    notes: "Gate 2 passed by delegated agent R27. Spec is public via GIMP developer wiki + source code. Awaits human IV per DEC-034."

