aspose_notes: "Not supported by Aspose. High differentiation value. PPM is the simplest raster image format — text-based (P3) or binary (P6), no compression, no headers beyond magic/width/height/maxval."
python_library: "No library needed; trivially parseable with stdlib (open/read/split)"
oracle_strategy: "Pixel-exact comparison; PPM P3 is human-readable text so oracle is trivial"
acquisition_risk_classification: MINIMAL
acquisition_risk_notes: "Public domain format from 1988. Trivially simple structure. No compression, no container, no encryption. Parsing is straightforward string/binary reading."
