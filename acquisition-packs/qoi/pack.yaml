  gate_2:
    status: passed
    approved_by: "delegated_agent_r23"
    approved_date: "2026-05-17"
    fast_path_eligible: false
    spec_source: "https://qoi.phoboslab.org/"
    spec_version_confirmed: "QOI 1.0"
    spec_access: public
    patent_search_required: false
    patent_notes: "MIT-licensed reference implementation. Author explicitly states no patents. Format is open."
    spec_summary: |
      QOI header: 14 bytes
        - magic: 4 bytes ('qoif')
        - width: 4 bytes (big-endian u32)
        - height: 4 bytes (big-endian u32)
        - channels: 1 byte (3=RGB, 4=RGBA)
        - colorspace: 1 byte (0=sRGB+linear alpha, 1=all linear)

      Pixel encoding: variable-length chunks
        - QOI_OP_RGB (0xFE): 3-byte literal RGB
        - QOI_OP_RGBA (0xFF): 4-byte literal RGBA
        - QOI_OP_INDEX (2 bits + 6 bits): reference to 64-color running array
        - QOI_OP_DIFF (2 bits + 6 bits): small RGB delta
        - QOI_OP_LUMA (2 bits + 6 bits + 8 bits): larger green delta
        - QOI_OP_RUN (2 bits + 6 bits): run-length repeat

      End marker: 8 bytes (7x 0x00 + 0x01)
    notes: "Gate 2 passed by delegated agent R23. Full spec available without download — qoi.phoboslab.org is a one-page format definition. Awaits human IV per DEC-034."

