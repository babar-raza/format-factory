  gate_2:
    status: passed
    approved_by: "delegated_agent_r27"
    approved_date: "2026-05-19"
    fast_path_eligible: false
    spec_source: "http://mattmahoney.net/dc/zpaq206.pdf"
    spec_version_confirmed: "ZPAQ Level 2 (version 2.06, 2013)"
    spec_access: public
    patent_search_required: false
    patent_notes: "Public domain. No patents. Author explicitly released all rights. Multiple independent implementations exist (zpaq, zpaqd, libzpaq) without legal issues."
    spec_summary: |
      ZPAQ archive structure:

        Block header:
          - magic: 'zPQ' (3 bytes, 0x7A 0x50 0x51)
          - level: 1 byte (1 or 2)
          - header_size: 2 bytes (little-endian, for level 1) or 4 bytes (for level 2)

        Block contains:
          - Compression model (ZPAQL bytecode)
          - One or more segments

        Segment structure:
          - segment_type byte
          - Optional filename (NUL-terminated)
          - Optional comment (NUL-terminated)
          - Compressed data
          - Optional 20-byte SHA-1 hash of original data
          - End marker (0xFF)

        ZPAQL Virtual Machine:
          - Stack-based bytecode interpreter
          - 256 opcodes
          - Used to define custom compression/decompression algorithms
          - Context mixing with arithmetic coding
          - Programs are stored in the archive — format is self-describing

        Journaling:
          - Archives support incremental updates (append-only)
          - File deduplication via content hashing
          - Transaction IDs for version tracking

      Authoritative source: mattmahoney.net/dc/zpaq206.pdf
      Reference implementation: mattmahoney.net/dc/zpaq.cpp (public domain)
    notes: "Gate 2 passed by delegated agent R27. Full public spec available as PDF. Awaits human IV per DEC-034."

  gate_3:
    status: blocked_sample_generation_requires_tool
    sprint: R27
    date: "2026-05-19"
    blocker: |
      ZPAQ sample generation requires either:
        1. The zpaq CLI tool (public domain C++ binary, not available in current environment)
        2. A ZPAQL bytecode program embedded in the archive for decompression

      Unlike simpler formats (QOI, XCF) where Python struct can construct valid samples,
      ZPAQ archives contain ZPAQL bytecode programs that define the compression algorithm.
      A valid ZPAQ file cannot be constructed with just header bytes — the compression
      model bytecode must be correct and the compressed data must be decompressible by
      that model.

      Header-only samples (magic + block header without valid compressed data) could be
      created for magic-byte validation testing, but would not constitute valid samples
      for Gate 3 corpus requirements.

      Resolution path:
        A. Install zpaq CLI and generate samples via command-line compression
        B. Port minimal ZPAQL context model from reference implementation
        C. Use pre-existing public domain ZPAQ test files (with provenance)
    awaiting_human_iv: true
    notes: "Gate 3 blocked. ZPAQ requires embedded VM bytecode for valid archives — cannot generate with Python struct alone. Blocker documented. Awaits resolution strategy decision."
