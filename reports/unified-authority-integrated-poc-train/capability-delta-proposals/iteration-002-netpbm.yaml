    status: VERIFIED

  - capability: GetBrightnessMap
    method: "GetBrightnessMap() -> double[]"
    description: "Return per-pixel brightness normalized 0.0–1.0. PGM: pixel/maxVal. PPM: Rec.601 luminance."
    tests: ["tests/net/netpbm/NetpbmR115DrawTests.cs"]
    status: VERIFIED

verdict: DELTA_ACCEPTED
