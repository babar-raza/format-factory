coverage_findings:
  - id: F-COV-001
    severity: P1
    description: |
      Many FOSS formats have very few SAL facts (tsv=2, ndjson=2, pbm=2, pgm=2, ppm=2, tsv=2)
      yet claim 80-200 capability records. This implies most capabilities are derived from
      source introspection (function names), NOT from SAL facts. The SAL-driven authority
      chain is broken for these formats.
    affected_subjects: [tsv:python, ndjson:python, pbm:python, pgm:python, ppm:python]
    resolution: "TC-CAP-006 — SAL-driven compiler will expose the true capability universe"

  - id: F-COV-002
    severity: P1
    description: |
      ABW (149 capabilities) vs 0 known SAL facts; DIF, SYLK, TOML similar.
      Capabilities appear to be generated from source function introspection only.
    affected_subjects: [abw:python, dif:python, sylk:python, toml:python, gnumeric:python]
    resolution: "TC-CAP-006 — SAL-driven compiler; missing SAL facts = missing capabilities"

  - id: F-COV-003
    severity: P2
    description: |
      Netpbm double-counting risk: unified-capability-map has PBM(74)+PGM(83)+PPM(84)=241
      FOSS records AND Netpbm(56) commercial records. Dashboard must not sum
      241+56=297; correct aggregate is: FOSS 241 (individual) + commercial 56 (aggregate).
    affected_subjects: [netpbm:dotnet, pbm:python, pgm:python, ppm:python]
    resolution: "TC-CAP-004 aggregation rules already documented; enforce in reporting"

