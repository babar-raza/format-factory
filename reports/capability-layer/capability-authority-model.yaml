# ── CANONICAL AUTHORITY CHAIN ─────────────────────────────────────────────────

canonical_authority_chain:
  description: |
    The CORRECT derivation chain for capability truth. All capability state claims
    must be traceable back to step 1 (SAL/spec fact). No capability may be created
    from prose, field names, or dashboard goals alone.

  steps:
    - step: 1
      name: "SAL / Spec Fact"
      description: "Atomic, verified statement about format structure/behavior extracted from public spec"
      authority_level: HIGHEST
      source: ".local/spec-cache/sal-facts-latest.json (14,635 facts)"
      schema_fields: [qname, claim, section, authority, verification_status, fact_status, source_id]
      constraints:
        - must be verified (fact_status=verified)
        - must reference a public spec (odf-1.3, etc.)
        - must have a FACT-{FORMAT}-{N} identifier

    - step: 2
      name: "Product/Format Obligation"
      description: "Derived obligation: if format has this SAL fact, implementing product MUST support it"
      authority_level: HIGH
      source: "reports/all-format-deepening/all-format-obligation-register.yaml"
      schema_fields: [obligation_id, format_id, language, proof_level, current_state, evidence_paths]
      derivation_rule: |
        For each (format_id, operation_kind) group of SAL facts:
        → One obligation per (format, language, track) triple
        e.g., ALLF-FODS-PY = Python obligation to support all FODS SAL facts

    - step: 3
      name: "Capability Identity"
      description: "Specific, bounded capability that an obligation requires the product to provide"
      authority_level: HIGH
      source: "reports/capability-layer/commercial-capability-map.json, foss-reduced-capability-map.json"
      schema_fields: [capability_id, subject_id, obligation_ids, source_fact_ids, category, applicability]
      derivation_rule: |
        Each obligation decomposes into N capability records (one per operation_kind):
        obligation ALLF-FODS-PY → capabilities: fods:python:load, fods:python:write, fods:python:export, etc.
        Capability ID MUST include: format_id, language, operation_kind, sequence number.
      constraints:
        - MUST have obligation_ids[] non-empty (no provenance-free capability)
        - MUST have source_fact_ids[] tracing to SAL FACT-* identifiers
        - MUST NOT be derived from dashboard field names or poc-targets.yaml prose alone

    - step: 4
      name: "Implementation Evidence"
      description: "Proof that the implementation exists (source code, package installation)"
      authority_level: MEDIUM
      source: "src/python/{format}/*.py, src/net/{format}/*.cs, .venv/Lib/site-packages/{format}/"
      schema_fields: [implementation_refs, package_refs]
      constraints:
        - Source file existence alone → state=IMPLEMENTED_UNVERIFIED (NOT verified)
        - Package installation → state=PACKAGE_VERIFIED (supplemental)
        - Implementation evidence alone CANNOT produce state=VERIFIED

    - step: 5
      name: "Verification Evidence"
      description: "Proof that the implementation behaves correctly (tests, oracle, examples)"
      authority_level: HIGH
      source: "tests/python/{format}/*, tests/net/{format}/*, oracle results"
      schema_fields: [test_refs, oracle_evidence, example_refs, certification_evidence]
      state_levels:
        test_verified: "≥1 passing test covers the capability function — MINIMUM for VERIFIED"
        example_verified: "≥1 working example demonstrates capability — WEAKER than test_verified"
        dogfood_verified: "format factory products consume each other — STRONG export evidence"
        oracle_verified: "oracle case covers capability — STRONGEST atomic verification"
        certification_evidence: "gate-level certification — RELEASE READY"
      constraints:
        - example_verified alone: confidence < 0.8 (not fully verified)
        - implementation_verified alone: NOT verified; strong state but requires test evidence to upgrade
        - test_verified: MINIMUM acceptable evidence for VERIFIED claim

    - step: 6
      name: "Gap or Verified State"
      description: "Current capability state assignment based on evidence evaluation"
      authority_level: HIGH
      source: "reports/capability-layer/gap-ledger.json (for gaps), capability maps (for verified)"
      states:
        VERIFIED: "test_verified, dogfood_verified, oracle_verified, certification_verified"
        PARTIAL: "implementation_verified, example_verified (NOT fully verified)"
        MISSING: "no implementation evidence found"
        BLOCKED: "external dependency blocks implementation"
        NOT_APPLICABLE: "capability not required for this format/track"
        STALE_EVIDENCE: "evidence existed but source changed; re-verification required"
      constraints:
        - VERIFIED requires test_verified as MINIMUM (or stronger)
        - implementation_verified and example_verified are PARTIAL states (misleadingly named)
        - gap_id MUST be created when state != VERIFIED and requirement exists
        - gap_id MUST NOT be created for NOT_APPLICABLE capabilities

    - step: 7
      name: "Taskcard (when actionable)"
      description: "Bounded execution authority for resolving a gap"
      authority_level: MEDIUM
      source: "reports/capability-layer/taskcards/*.yaml"
      schema_fields: [task_id, gap_id, capability_id, required_skills, allowed_paths, validation_steps, closeout_rules]
      eligibility_rules:
        - gap status = OPEN_ACTIONABLE
        - dependencies resolved
        - required skill exists (or skill gap must be created)
        - allowed paths and forbidden paths are known
      constraints:
        - CLOSED gaps MUST NOT have active taskcards
        - BLOCKED gaps MUST NOT generate executable taskcards
        - Taskcard closure MUST update: capability state, gap status, action queue

