    - name: "Netpbm aggregate (commercial .NET only)"
      aggregate_id: "netpbm"
      aggregate_children: [pbm, pgm, ppm]
      product_path: "src/net/netpbm/"
      rule: |
        The commercial .NET product 'Netpbm' handles all three formats (PBM/PGM/PPM)
        in a single library. For commercial capability subjects, use 'netpbm' as the
        aggregate subject. For FOSS Python, use individual subjects (pbm, pgm, ppm)
        because each has its own Python package.
      capability_counting:
        commercial: "Count once per (operation, Netpbm) — do NOT triple-count for PBM+PGM+PPM"
        foss: "Count once per (operation, format) — three separate counts"

    - name: "ODF flat formats (NOT grouped)"
      formats: [fods, fodt, fodp, fodg]
      rule: |
        FODS, FODT, FODP, FODG are related ODF formats but are NOT a grouped family.
        Each has its own Python package and its own commercial product (FODS, FODT only for commercial).
        Treat as SEPARATE subjects; do NOT aggregate.

    - name: "Language track split (Python vs .NET)"
      rule: |
        For formats with both Python FOSS and .NET commercial products,
        create two subjects: one per language track.
        FODS: subject fods:python (FOSS) + subject fods:dotnet (commercial)
        FODT: subject fodt:python (FOSS) + subject fodt:dotnet (commercial)
        ZST: subject zst:python (FOSS) + subject zst:dotnet (commercial)
        CSV/TSV/NDJSON: dotnet is export-target helper only; no commercial product; python:FOSS only
        Netpbm: subject netpbm:python (FOSS, 3 individual pkgs) + subject netpbm:dotnet (commercial, aggregate)

