  - id: L3-002
    type: WINDOWS_ENCODING_FRAGILITY
    severity: LOW
    component: tools/supervisor/ (multiple)
    description: >
      Multiple supervisor tools may have Windows cp1252 encoding issues if they emit
      Unicode characters to stdout. autonomous_cycle.py is the confirmed case.
      Any tool with → or other non-ASCII chars in help text will fail on Windows
      without PYTHONIOENCODING=utf-8.
    recommendation: >
      Standardize on ASCII-safe characters in argparse help text, or add
      PYTHONIOENCODING=utf-8 to the launch script (.venv/Scripts/activate).
    blocking: false

  - id: L3-003
    type: SAL_CHAIN_COVERAGE_GAP
    severity: LOW
    component: SAL pipeline
    description: >
      10 of 20 formats are CHAIN_BROKEN_AT_SAL (ABW, CSV, DIF, GNUMERIC, NDJSON,
      SYLK, TOML, TSV, XCF, ZST). SAL spec parser exists only for ODF/image formats.
      These formats lack spec-fact extraction from authoritative sources.
    current_state: >
      10 GAP-CHAIN-*-SAL-MRH-001 entries added to gap-ledger.json at P3/LOW priority.
      Chain break is expected and documented. Does not block product deepening for
      CHAIN_INTACT formats (ODS, ODT, FODS, FODT, FODG, FODP, PBM, PGM, PPM, QOI).
    recommendation: >
      Prioritize SAL chain extension for CSV and TSV (high-commercial-value formats)
      in a future machinery sprint. Current state is tracked and not blocking.
    blocking: false

