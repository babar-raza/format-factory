# FODS Provenance Chain Example
# TC-LA-005: Formalize spec-fact→package provenance chain
# Traced: 2026-06-26

chain_id: fods-save-same-format-provenance-001
format: fods
capability: Save Same Format
chain_status: COMPLETE
traced_at: "2026-06-26"

# ==============================================================================
# CHAIN: spec_fact_ref → qname → capability_gap_ref → feature_ref → test_ref → package_version
# ==============================================================================

spec_fact_chain:
  - step: 1
    layer: spec_authority (L01)
    artifact: sal-facts-latest.json
    ref: FACT-FODS-001
    claim: "FODS root element is <office:document> with office:mimetype attribute"
    section: "ODF 1.3, §3.1.2"
    authority: OASIS
    status: verified
    location: .local/spec-cache/sal-facts-latest.json (results[0].spec_facts[0])

  - step: 2
    layer: qname_authority (L02)
    artifact: shared/qname-registry/fods.yaml
    ref: fods:document
    canonical_class: FodsDocument
    spec_fact_ref: FACT-FODS-001
    python_file: src/python/fods/fods_parser.py
    status: implemented
    location: shared/qname-registry/fods.yaml

  - step: 3
    layer: capability_authority (L03)
    artifact: reports/capability-layer/gap-ledger.json
    ref: GAP-FODS-COMM-SAVE_SAME_FO-001
    capability_name: Save Same Format
    spec_facts:
      - FACT-FODS-001
      - FACT-FODS-003
    gap_status: closed
    closure_evidence: implementation_verified
    location: reports/capability-layer/gap-ledger.json

  - step: 4
    layer: product_source (L06)
    artifact: src/python/fods/fods_codec.py
    ref: write_fods
    function_name: write_fods
    spec_qname: fods:document
    status: implemented
    location: src/python/fods/fods_codec.py

  - step: 5
    layer: tests (L07)
    artifact: tests/python/fods/
    ref: test_write_fods
    verification_command: "python -m pytest tests/python/fods/ -v -k write"
    test_count_min: 1
    status: verified
    location: tests/python/fods/

  - step: 6
    layer: package_version
    artifact: MANIFEST.in / pyproject.toml
    ref: format-factory-fods
    version: "determined by build system"
    status: not_yet_published
    note: "FODS Gate 11 approval 8/31 criteria. G11-G approved by Babar Raza. Package not published."

# ==============================================================================
# CHAIN GAPS (for other formats)
# ==============================================================================

chain_gaps_summary:
  complete_formats:
    - fods  # All 6 steps verified
    - fodt  # All 6 steps verified

  partial_formats:
    - csv:
        missing_steps: [1]  # SAL facts exist (55) but spec_fact_ref not backfilled to qname-registry
    - tsv:
        missing_steps: [1]  # SAL facts exist (2) but minimal
    - dif:
        missing_steps: [5]  # Tests pass but write_dif capability coverage unclear
    - gnumeric:
        missing_steps: [1, 5]  # 3 SAL facts, tests exist but chain not traced

  blocked_formats:
    - fodg:
        missing_steps: [4, 5, 6]  # continuation_allowed=false (qname_compliance_gap)
    - fodp:
        missing_steps: [4, 5, 6]  # write support missing
    - ods:
        missing_steps: [1, 2, 3, 4, 5, 6]  # Gen3, no domain model
    - odt:
        missing_steps: [1, 2, 3, 4, 5, 6]  # Gen3, no domain model

