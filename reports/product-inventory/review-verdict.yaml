key_findings:
  finding_1:
    severity: CRITICAL
    title: "Analytics masquerade: 16 Python products have analytics bags disguised as domain model files"
    detail: >
      word_document.py, tabular_document.py, spreadsheet_document.py, text_document.py,
      bitmap_image.py, grayscale_image.py, color_image.py, image_document.py (QOI/NDJSON),
      config_document.py, workbook_document.py, interchange_document.py are all analytics
      function bags with domain-model filenames. This is the single largest structural
      misrepresentation in the codebase.
    affected_products: 16
    root_cause: RC-001

  finding_2:
    severity: HIGH
    title: "7 Python products have no domain model class at all"
    detail: >
      ABW, CSV, Gnumeric, NDJSON, TOML, TSV, ZST Python products expose only function bags.
      .NET counterparts (where they exist) have properly structured sealed domain model classes.
      The Python/.NET asymmetry is most visible in: CSV vs CsvDocument, TSV vs TsvDocument,
      NDJSON vs NdjsonDocument.
    affected_products: 7
    root_cause: RC-002

  finding_3:
    severity: HIGH
    title: "Python/.NET exporter parity gap: FODT Python has 0 exporters vs .NET's 5"
    detail: >
      .NET FODT: HTML, Markdown, PDF, PNG, TXT exporters.
      .NET FODS: 7 exporters.
      Python FODT: read + write only, zero exporters.
      Python FODS: read + write + CSV exporter only.
      This gap is the most visible capability asymmetry to end users.
    affected_products: PY-FODT
    root_cause: RC-003

  finding_4:
    severity: MEDIUM
    title: "Best Python product (FODS) still has analytics masquerade file"
    detail: >
      Even PY-FODS — which has the best model (FodsCell/FodsSheet/FodsDocument in models.py)
      — still has spreadsheet_document.py containing analytics with docstring
      "fods_analytics.py -- Analytics functions". This underscores that RC-001 affects
      every format regardless of model quality.
    affected_products: PY-FODS
    root_cause: RC-001

  finding_5:
    severity: HIGH
    title: ".NET HTML, Markdown, TXT are output-target stubs, not standalone products"
    detail: >
      These three .NET products score 9/50 on manual grade — no parser, no model, no spec.
      They exist solely as output targets for FodtHtmlExporter, FodtMarkdownExporter, etc.
      They should be reclassified as exporter infrastructure, reducing the standalone
      product count from 30 to 27 for Gate 11 purposes.
    affected_products: NET-HTML, NET-MARKDOWN, NET-TXT
    root_cause: RC-007

