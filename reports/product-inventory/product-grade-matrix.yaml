# FORMAT FACTORY — PRODUCT GRADE MATRIX
# 20 dimensions × 30 products
# Scale: 0=absent/broken, 1=stub, 2=minimal, 3=partial, 4=mostly-complete, 5=fully-realized
#
# MANUAL_LIBRARY_GRADE dimensions (as a library consumer):
#   D01 api_discoverability      — Can a user find the right functions/classes?
#   D02 importability            — Does it import cleanly? Is __all__ clean?
#   D03 domain_model_presence    — Are there proper typed classes (not just function bags)?
#   D04 read_parse_capability    — Can you load/parse a real file?
#   D05 write_save_capability    — Can you save back to the same format?
#   D06 mutation_api             — Can you modify the model after loading?
#   D07 export_convert           — Can you export to other formats?
#   D08 error_handling           — Are errors meaningful and typed?
#   D09 security_posture         — File size guards, bomb protection?
#   D10 spec_alignment           — Does the model mirror spec element structure?
#
# MACHINERY_EXPECTATION_GRADE dimensions (vs. what the machinery expects):
#   D11 spec_qname_coverage      — Do classes/modules have spec_qname?
#   D12 gap_ledger_coverage      — Are capabilities tracked in gap ledger?
#   D13 test_coverage_depth      — Tests exercise real behaviors (not just arithmetic)?
#   D14 spec_fact_refs           — Are spec facts (FACT-xxx) cited?
#   D15 product_contract         — Is the stated capability contract fulfilled?
#   D16 governance_compliance    — No GOV_BLOCK validators triggered?
#   D17 analytics_separation     — Are analytics in separate analytics.py files?
#   D18 architecture_compliance  — spec/ + domain model + Compat/ pattern?
#   D19 poc_target_coverage      — Are POC targets (poc-targets.yaml) hit?
#   D20 release_gate_readiness   — Gate 11 criteria (G11-C or G11-G)?
#
# Generated: 2026-06-24

