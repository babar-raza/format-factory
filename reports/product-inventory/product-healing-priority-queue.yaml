# FORMAT FACTORY — PRODUCT HEALING PRIORITY QUEUE
# Generated from: manual library review + grade matrix + root-cause analysis
# Date: 2026-06-24

metadata:
  generated: "2026-06-24"
  basis: "MANUAL_LIBRARY_GRADE + MACHINERY_EXPECTATION_GRADE + business value"

# Priority buckets (execute in order within each bucket):
#   TIER-1: Structural correctness — must fix before any product deepening
#   TIER-2: API completeness — P1 gaps blocking usability
#   TIER-3: Coverage and tests — P2 gaps reducing confidence
#   TIER-4: Spec alignment — P2 gaps reducing machinery scores
#   TIER-5: Classification cleanup — P3 gaps (reclassification only)

priority_queue:

  tier_1_structural_correctness:
    rationale: >
      These are naming and architecture violations that create false impressions
      about product completeness. They must be fixed before any new capability work.

    - item_id: PQ-T1-001
      title: "Rename 16 analytics-masquerade files to {format}_analytics_extra.py"
      gap_refs: [GAP-PROD-INV-MASQ-001, GAP-INV-001..GAP-INV-016]
      root_cause: RC-001
      effort: HIGH  # 16 files × imports × test updates
      impact: CRITICAL  # removes false domain-model impressions across entire Python portfolio
      recommended_skill: extract-analytics-from-monolith
      batch_order:
        priority_1: [fods, fodt]   # already have real models.py — rename is safe
        priority_2: [csv, tsv, ndjson, ods, odt]  # moderate usage
        priority_3: [abw, dif, gnumeric, sylk, toml, pbm, pgm, ppm, qoi]
      acceptance_criteria: >
        All 16 files renamed to {format}_analytics_extra.py (or consolidated into
        existing {format}_analytics.py). All imports updated. All tests pass.
        No file named *_document.py or *_image.py contains only analytics functions.

    - item_id: PQ-T1-002
      title: "Fix spec_qname pattern: class attribute vs dataclass field default"
      gap_refs: [GAP-PROD-INV-QNAME-001, GAP-INV-033..GAP-INV-036]
      root_cause: RC-004
      effort: LOW
      impact: HIGH  # machinery validators depend on class-level spec_qname
      recommended_skill: qname-backfill
      affected_classes:
        - ods.OdsCell: add spec_qname = "table:table-cell"
        - ods.OdsSheet: add spec_qname = "table:table"
        - ods.OdsDocument: add spec_qname = "office:document"
        - odt.OdtParagraph: add spec_qname = "text:p"
        - odt.OdtHeading: add spec_qname = "text:h"
        - odt.OdtDocument: add spec_qname = "office:document"
        - sylk.SylkCell: add spec_qname = "slk:cell"
        - dif.DifCell: change from dataclass field default to class attribute
      acceptance_criteria: >
        All listed classes have spec_qname as class-level attribute (not dataclass field).
        V36 spec_qname check passes for all affected formats.

  tier_2_api_completeness:
    rationale: >
      These are P1 gaps where users cannot perform basic operations.
      Prioritized by user value and cross-product symmetry.

    - item_id: PQ-T2-001
      title: "Add Python TsvDocument domain class (parity with .NET TsvDocument)"
      gap_refs: [GAP-PROD-INV-MODEL-001, GAP-INV-022]
      root_cause: RC-002
      effort: MEDIUM
      impact: HIGH  # TSV is widely used; .NET has it
      recommended_skill: add-python-object-model-feature
      spec_qname: "tsv:record"
      model_pattern: "Wrap tsv_parser output in TsvDocument(headers, rows, row_count, has_header)"
      acceptance_criteria: >
        TsvDocument class in tsv/models.py with spec_qname = "tsv:record".
        TsvDocument.from_file(path) factory method works.
        Iterating rows via TsvDocument.rows works.

    - item_id: PQ-T2-002
      title: "Add Python CsvDocument domain class (parity with .NET CsvDocument)"
      gap_refs: [GAP-PROD-INV-MODEL-001, GAP-INV-018]
      root_cause: RC-002
      effort: MEDIUM
      impact: HIGH  # CSV is most common format; .NET has it
      recommended_skill: add-python-object-model-feature
      spec_qname: "csv:record"
      acceptance_criteria: >
        CsvDocument class with spec_qname = "csv:record" in csv/models.py.
        CsvDocument.from_file(path) factory method.

    - item_id: PQ-T2-003
      title: "Add Python NdjsonDocument domain class (parity with .NET NdjsonDocument)"
      gap_refs: [GAP-PROD-INV-MODEL-001, GAP-INV-020]
      root_cause: RC-002
      effort: MEDIUM
      impact: HIGH
      recommended_skill: add-python-object-model-feature
      spec_qname: "ndjson:record"

    - item_id: PQ-T2-004
      title: "Add TSV Python writer (parity with .NET TsvWriter)"
      gap_refs: [GAP-PROD-INV-WRITE-001, GAP-INV-030]
      root_cause: RC-003
      effort: LOW  # TSV is simple tab-separated; trivial writer
      impact: HIGH  # critical parity gap vs .NET
      recommended_skill: add-same-format-writer-feature
      acceptance_criteria: >
        write_tsv(rows, path, headers=None) in tsv_parser.py or tsv_writer.py.
        Round-trip: load → write → reload → compare passes.

