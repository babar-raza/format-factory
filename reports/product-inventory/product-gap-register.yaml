    gap_type: api_pollution
    root_cause: RC-005
    severity: P2
    status: open
    details: >
      Pattern: `__all__ = [k for k in vars(_sys.modules[__name__]) if not k.startswith("_")]`
      This exports Any, Path, FormatFactoryError, dataclass, field, Iterator, etc. as
      public API symbols alongside actual functions. Breaks API discoverability.
      Affects 16 of 20 Python products.

