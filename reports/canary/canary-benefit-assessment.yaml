validator_shadow_overhead_ms: 0
  # Shadow registry is loaded once at run_all_governance_validators() entry (~0ms for empty YAML).
  # With one validator in shadow: FAIL check + JSONL append adds ~0-1ms per validator.
  # Measured: YAML load + dict lookup is sub-millisecond. Log write (single fh.write) is sub-millisecond.
  # Total estimated overhead per sprint: <2ms for ≤10 shadow validators.

grader_shadow_overhead_per_item_ms: 0
  # Current stub: _grade_item_shadow logs observation only (no second LLM call).
  # Estimated overhead for full shadow call: ~1500-5000ms per item (LLM latency).
  # Sprint-level overhead depends on shadow_provider activation (opt-in, not default).

sqlite_rows_per_sprint: 0
  # validator_shadow_observations: 0 rows if no shadow validators fire (empty registry default).
  # grader_shadow_observations: 0 rows if --shadow-provider not set (default).
  # Maximum: 1 row per shadow validator suppression + 1 row per work item graded with shadow provider.

rollback_complexity: LOW
  # Validator shadow: remove entry from .supervisor/validator-shadow-registry.yaml (edit + save)
  # Grader shadow: remove --shadow-provider flag from autonomous_cycle.py invocation
  # Compilation diff: no state; pure function; no rollback needed
  # SQLite tables: DROP TABLE IF EXISTS (non-destructive; reconstructed by init_db)

operational_model: |
  1. Validator shadow: new validators are added to shadow registry before setting blocks_sprint=True
     in code. Sprint continues; observation is logged. After N sprints at threshold, promote.
  2. Grader shadow: new LLM provider is tested in parallel for N sprints before switching primary.
     Agreement rate monitored via grader_promotion.py summary. Promote only when rate >= 0.90 and
     no downgrades (ACCEPTED->REWORK transitions) are observed.
  3. Compilation diff: run before any change to capability_feature_compiler.py scoring. If priority
     or format coverage changes appear, review before committing. HOLD if items would be dropped.

