invalid_retention_justifications:
  - justification: "Many references exist"
    verdict: INVALID
    reason: >
      Reference count is not a retention criterion. Files with high reference counts
      (security.md, release-control.md, acquisition-workflow.md) are MOVABLE and
      use compatibility stubs to handle reference migration gracefully.

  - justification: "It has always been there"
    verdict: INVALID
    reason: Historical placement without a documented governance reason is not sufficient.

  - justification: "Moving would require updating many files"
    verdict: INVALID
    reason: >
      Reference updates are the work of the migration — they are not a blocker.
      TEMPORARY_COMPATIBILITY_STUB strategy handles high-reference moves safely.

policy_statement: >
  All docs/ root files without a valid retention_reason from the list above MUST be
  moved to a canonical topical subfolder. New files created directly under docs/ after
  this reorganization must be registered and justified against this policy.
  Validation: tools/governance/check_docs_placement.py --full

