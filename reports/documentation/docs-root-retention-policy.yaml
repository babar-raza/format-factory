# Root Retention Policy
# A document may remain directly under docs/ only when one of these
# retention_reasons is proven. "Many references" alone is NOT sufficient.

valid_retention_reasons:
  - id: canonical_entry_point
    description: The primary entry point for all project documentation navigation
    applies_to: [README.md]

  - id: repository_wide_navigation_index
    description: Cross-cutting navigation document read by all agents as a first step
    applies_to: [agent-methodology-index.md]

  - id: cross_cutting_policy_root_convention
    description: >
      Cross-cutting policy document whose established convention and reference
      patterns require root placement. High reference count alone is not sufficient —
      the document must genuinely span ALL tracks/layers without a natural topical home.
    applies_to: [gates.md]
    notes: >
      security.md does NOT qualify here — it belongs in docs/governance/ with a
      compatibility stub. gates.md qualifies because it is literally the authority
      for ALL 11 acquisition gates across FOSS/commercial/spec tracks.

  - id: validator_enforced_root_location
    description: >
      Path is hardcoded in tools/governance/check_methodology_links.py and moving
      the file would require updating the validator. The validator is an operational
      gate — changing its paths is a separate governed task. Documents in this
      category remain at root until the validator is updated.
    applies_to:
      - agent-methodology-index.md
      - planning-methodology.md
      - agent-execution-handoff-standard.md
      - plan-hardening-checklist.md
      - fresh-chat-continuity-brief.md
    enforced_by: tools/governance/check_methodology_links.py

  - id: mandatory_agent_pre_read
    description: >
      Document is explicitly referenced in CLAUDE.md or AGENTS.md as a mandatory
      pre-read that MUST be completed before any work in the session begins.
      Changing the path requires coordinated updates to both CLAUDE.md and AGENTS.md.
    applies_to: [spec-to-feature-correction-plan-summary.md]
    references:
      - file: CLAUDE.md
        line: 160
        text: "Quick reference: docs/spec-to-feature-correction-plan-summary.md"

retained_files:
