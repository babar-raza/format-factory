known_authority_peculiarities:
  - id: NRRD-AUTH-PEC-001
    profiles: *all_profiles
    observation: >-
      The Teem 1.9.0 reference reader explicitly says it accepts newer fields
      under older magics even though those files violate the format.
    evidence: c-lines-306-310
    effect: >-
      Differential tests must distinguish strict format validation from a
      compatibility/interoperability mode. Teem acceptance alone cannot prove a
      profile-valid file.
  - id: NRRD-AUTH-PEC-002
    profiles: [nrrd0001]
    observation: >-
      NRRD00.01 is a circa-1998 legacy magic accepted by the reference reader;
      the reference writer emits NRRD0001 for version 1.
    evidence: [html-lines-174-175, c-lines-26-32, c-lines-237-246, c-lines-589-597]
    effect: >-
      Preserve and read the legacy magic explicitly, but deterministic modern
      writing uses NRRD0001 unless a separately documented lexical-preservation
      mode retains original bytes.
  - id: NRRD-AUTH-PEC-003
    profiles: [nrrd0004, nrrd0005]
    observation: >-
      NRRD0004 reverses the header-relative path signifier from a required ./
      prefix to the absence of a leading slash.
    evidence: html-lines-762-770
    effect: >-
      Path resolution must be profile-aware before applying the stricter
      configured-root and absolute-path security policy.
  - id: NRRD-AUTH-PEC-004
    profiles: [nrrd0005]
    observation: >-
      The specification notes that measurement frame should conceptually have
      been included in NRRD0004, but normatively introduces it only in
      NRRD0005.
    evidence: html-lines-188-189
    effect: >-
      Do not backport measurement-frame acceptance to NRRD0004 in strict mode.
oracle_contract:
  teem:
    role: independent primary reference implementation
    future_proofs:
      - writer output loads with Teem for every supported profile and encoding
      - profile-invalid later fields are rejected by this library even when Teem accepts them
      - reference-writer oldest-sufficient magic is matched
  pynrrd:
    role: independent Python interoperability oracle
    future_proofs:
      - semantic differential reads across scalar types, encodings, endian, metadata, and detached forms
      - writer outputs load with pynrrd where pynrrd supports the selected construct
    limit: >-
      Pynrrd behavior is not a normative authority and cannot override the
      pinned Teem specification.
uncertainty:
  unresolved_normative_contradictions: 0
  confidence_limits:
    - >-
      The profile matrix proves the selected NRRD0001-NRRD0005 contract
      surface, not implementation completeness or third-party interoperability.
    - >-
      Teem source supplies a strong baseline-field inference because its writer
      computes the oldest sufficient magic. The live specification does not
      publish five separate full schemas, so baseline classification is not a
      mechanical schema diff.
    - >-
      Exact byte reproduction is not implied. Lossless lexical preservation and
      normalized deterministic writing remain separate future implementation
      modes.
