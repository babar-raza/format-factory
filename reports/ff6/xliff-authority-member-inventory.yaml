classification_notes:
  - >-
    XLIFF 2.1 package validation is not XSD-only: Core and several modules
    include Schematron constraints, and the package includes an NVDL dispatch
    artifact. Later obligation compilation must preserve this distinction.
  - >-
    The XLIFF 2.1 package contains nine normative module schema vocabularies
    for eight official modules because ITS uses both `its` and `itsm`.
  - >-
    The XLIFF 2.1 Change Tracking schema is located under the package's
    informative third-party copy tree and cannot receive normative module
    conformance credit.
  - >-
    XLIFF 2.0 Change Tracking appears under `schemas/modules`; its exact
    standard status and processing requirements must be resolved from the
    pinned 2.0 prose during XLF-03 instead of inferred from directory naming.
