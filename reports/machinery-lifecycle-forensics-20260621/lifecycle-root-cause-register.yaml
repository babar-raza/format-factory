      - "No MISSION_COMPLETE evaluation gate"
      - "check_continuation.py tracks sprint iteration but not mission progress"
    production_impact: >
      CRITICAL — without a mission ledger, the machinery repair mission can be incorrectly
      declared complete when only one sprint completes. This is the root cause of the
      missing iteration behavior.
    durable_fix: >
      1. Create .local/supervisor/machinery/mission-ledger.json
      2. check_continuation.py --track machinery reads mission-ledger.json
      3. CONTINUE only when mission.stop_status != MISSION_COMPLETE
