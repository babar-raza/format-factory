      The supervisor architecture tracks sprint state (evidence declaration, autonomous-cycle,
      continuation-signal) but not MISSION state (are all repairs done? is the audit passing?).
      Sprint completion ≠ mission completion, but no machine enforces this distinction.
    contributing_conditions:
