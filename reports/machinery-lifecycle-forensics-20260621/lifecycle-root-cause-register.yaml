    migration_required: true
    tests_required:
      - "TC-LIF-001: check_continuation --track machinery with mission_state=EXECUTION_REQUIRED returns CONTINUE"
      - "TC-LIF-002: investigation sprint writes mission-ledger.json with next_required_stage=EXECUTION"

  - root_cause_id: "RC-002"
    title: "PLAN_COMPLETED_IN_SESSION blocks all continuation including machinery repair"
    symptoms:
      - "check_continuation.py returns STOP with reason=PLAN_COMPLETED_IN_SESSION"
      - "No autonomous loop can start (product OR machinery)"
      - "The machinery repair tasks identified by archaeology cannot run"
    first_failing_boundary: "check_continuation.py → autonomous_loop_start"
    immediate_cause: >
      Per-chat plan fuzzy-conjuring-papert.md was completed with --complete in session
      7c0655b93790. The session-keyed plan lock has status=COMPLETE. The M8 safety net
      in check_continuation.py detects this and returns PLAN_COMPLETED_IN_SESSION.
    structural_cause: >
      Session IDs are derived from git HEAD hash. Multiple distinct chat sessions running
      on the same git HEAD get the SAME session_id. When one session completes a plan, ALL
      sessions on the same HEAD see PLAN_COMPLETED_IN_SESSION — including sessions that
      were never involved in that plan. This creates a CROSS-SESSION FALSE POSITIVE.
    contributing_conditions:
      - "No new git commits between plan completion session and machinery forensics session"
      - "session-keyed lock .local/supervisor/plan-locks/7c0655b93790.json has status=COMPLETE"
      - "active-plan-lock.json has status=TERMINAL_CLOSED (additional lock)"
      - "PLAN_COMPLETED_IN_SESSION is NON-OVERRIDABLE by the Supreme Directive"
    affected_components:
      - "tools/supervisor/check_continuation.py (M8 check, lines 210-229)"
      - "tools/supervisor/continuation_identity.py (session_id derivation from git HEAD)"
      - ".local/supervisor/plan-locks/7c0655b93790.json"
      - ".local/supervisor/active-plan-lock.json"
    affected_runs:
      - "ALL sessions on HEAD 23d1333f after fuzzy-conjuring-papert.md completion"
    why_existing_tests_missed_it: >
      CCI tests (test_isolation.py) test session mismatch but not the case where two
      DIFFERENT user chat sessions share the same session_id because they're on the same HEAD.
    why_existing_governance_allowed_it: >
      The plan lock mechanism was designed for intra-session isolation, not for the case
      where git HEAD doesn't change between sessions (common when user doesn't commit between sessions).
    recurrence_path: >
      Every future session on the same git HEAD after a plan completion will hit this blocker.
      Likely to recur frequently since commits require explicit user authorization.
    production_impact: >
      HIGH — the PLAN_COMPLETED_IN_SESSION guard is working correctly (it IS preventing
      cross-session plan contamination). The real fix is to ensure new sessions get a
      unique session_id even when git HEAD hasn't changed.
    durable_fix: >
      The 4h TTL on session files (.local/supervisor/session-{track}.id) should handle this
      if the previous session was more than 4 hours ago. For immediate unblocking:
      1. User provides explicit authorization (THIS PROMPT = authorization)
      2. The machinery track uses --track machinery which has separate signal isolation
      3. Future: session_id should include a random nonce OR timestamp component
         to prevent same-HEAD identity collision
    migration_required: false
    tests_required:
      - "TC-LIF-003: Two sessions on same HEAD get different session_ids (nonce-based)"

