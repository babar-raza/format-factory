  - taskcard_id: QNAME-BACKFILL-001
    title: Fix DIF spec_qname on production codec classes
    group: QNAME-BACKFILL
    lane: C
    status: open
    severity: High
    priority: 1
    allowed_paths:
      - src/python/dif/dif_parser.py
      - tests/python/dif/test_dif_spec_qname.py
    forbidden_paths:
      - src/python/dif/spec/
      - src/python/dif/Compat/
    purpose: >
      Inject spec_qname: ClassVar[str] on DifData and DifCell classes in the production
      codec file. Registry already has entries. Compliance is blocked by missing ClassVar.
    problem: >
      dif_parser.py:DifData and dif_parser.py:DifCell lack spec_qname ClassVar.
      QName compliance score for DIF is 60% (should be 100%).
    evidence:
      - reports/forensic-audit-20260625/per-product-qname-compliance.yaml (gap entry)
    required_change: >
      Add to dif_parser.py:
        from typing import ClassVar  (if not present)
        class DifData: spec_qname: ClassVar[str] = "dif:data"
        class DifCell: spec_qname: ClassVar[str] = "dif:cell"
    steps:
      - Read src/python/dif/dif_parser.py to find DifData and DifCell class definitions
      - Add ClassVar import if missing
      - Inject spec_qname ClassVar on each class
      - Run tests/python/dif/test_dif_spec_qname.py to verify
    tests:
      - tests/python/dif/test_dif_spec_qname.py (create if not exists, add V53 assertions)
    evidence_required:
      - SHA-256 of modified dif_parser.py
      - Pytest output showing tests pass
    closeout_criteria: >
      V53 would pass for DIF (spec_qname ClassVar present on both DifData and DifCell).
      QName compliance score for DIF >= 95%.
    rollback_resume_notes: >
      git revert on dif_parser.py if anything breaks. Purely additive change.
    dependencies: []
    gap_impact: SYSARCH-002
    product_impact: DIF
    machinery_impact: QName coverage metric improves

