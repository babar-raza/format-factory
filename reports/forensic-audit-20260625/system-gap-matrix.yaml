gaps:

  - gap_id: SYSARCH-001
    layer: Backfill
    lane: J
    severity: High
    evidence: reports/forensic-audit-20260625/backfill-facility-design.md
    current_behavior: >
      QName backfill is a manual task-driven process. Each format requires a TC-QHARD-POST-*
      taskcard and 20-40 minutes of manual injection work per format.
    expected_behavior: >
      An automated scan_qname_gaps.py tool identifies all classes missing spec_qname.
      An inject_spec_qname.py tool injects ClassVar from registry with --dry-run option.
      A generate_domain_model.py tool creates models.py from spec/ + registry.
    root_cause: >
      The spec-to-feature correction plan addressed qname governance but did not
      include automated backfill tooling. Each format was treated as a manual sprint task.
    product_impact: >
      Manual backfill required for 7 Gen3 formats (ODS, ODT, PBM, PGM, PPM, QOI, SYLK).
      7 x 2-4 hours = significant manual effort per round.
    machinery_impact: >
      No tooling to automatically verify qname compliance across all 20 formats.
      V53 only catches violations at sprint submission, not proactively.
    repeatability_impact: >
      Cannot guarantee new formats added to src/ will be qname-compliant.
      Each new format requires manual backfill process.
    autonomy_impact: Low
    qname_impact: >
      3 HIGH-severity qname gaps (DIF, FODG) exist because backfill is manual.
      Would be caught and fixed automatically with automated tooling.
    required_fix: >
      Implement tools/backfill/scan_qname_gaps.py, inject_spec_qname.py,
      generate_domain_model.py, backfill_evidence_snapshot.py
    tests_required:
      - Unit tests for scan_qname_gaps.py
      - Dry-run verification for inject_spec_qname.py
      - V53 post-backfill validation
    evidence_required:
      - Before/after SHA-256 snapshots
      - Pytest pass/fail for affected format
    must_fix_before_product_deepening: "no"
    can_defer: "yes"
    suggested_taskcard_id: BACKFILL-001
    priority: 2

  - gap_id: SYSARCH-002
    layer: QName
    lane: C
    severity: High
    evidence:
      - src/python/dif/dif_parser.py
      - reports/forensic-audit-20260625/per-product-qname-compliance.yaml
    current_behavior: >
      DifData and DifCell classes in dif_parser.py lack spec_qname: ClassVar[str].
      The Compat/ facades and spec/ skeletons have spec_qname, but the production
      codec class does not. V53 would flag this if run.
    expected_behavior: >
      DifData has spec_qname: ClassVar[str] = "dif:data"
      DifCell has spec_qname: ClassVar[str] = "dif:cell"
      Both ClassVars present on production class, V53 passes.
    root_cause: >
      spec_qname was injected into spec/ and Compat/ but not backfilled to the
      original codec class. TC-QHARD-POST-001 covered some formats but missed DIF.
    product_impact: >
      DIF product cannot claim full qname compliance. V53 would block DIF
      from RELEASE_GATE until fixed. DIF product audit shows 60% compliance.
    machinery_impact: >
      qname-coverage report shows DIF at 60% instead of 100%.
      Capability map spec_refs for DIF may be incomplete.
    repeatability_impact: High
    autonomy_impact: Medium
    qname_impact: High
    required_fix: >
      Add to src/python/dif/dif_parser.py:
      - from typing import ClassVar (if not present)
      - class DifData: spec_qname: ClassVar[str] = "dif:data"
      - class DifCell: spec_qname: ClassVar[str] = "dif:cell"
    tests_required:
      - tests/python/dif/test_dif_spec_qname.py (V53 compliance tests)
    evidence_required:
      - SHA-256 before/after for dif_parser.py
      - pytest output for dif spec_qname tests
    must_fix_before_product_deepening: "yes"
    can_defer: "no"
    suggested_taskcard_id: QNAME-BACKFILL-001
    priority: 1

