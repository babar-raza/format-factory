      Users can only access data via raw dict model.
    expected_behavior: >
      Each format has a models.py with:
      - Domain class (OdsDocument, OdtDocument, PbmImage, etc.)
      - spec_qname: ClassVar[str] attribute
      - from_file(path) factory method
      - Typed property access (.headers, .rows, etc.)
      - to_dict() serialization
    root_cause: >
      Domain model expansion (Epoch 3, 2026-06-20 to 2026-06-24) addressed Gen4 formats
      but did not reach the 7 Gen3 formats before the sprint rotation ended.
    product_impact: >
      Gen3 formats cannot offer typed API. Consumer experience is raw dict access only.
      Cannot pass capability criteria requiring domain model.
    machinery_impact: Low
    repeatability_impact: Medium
    autonomy_impact: Low
    qname_impact: Low
    required_fix: >
      Create src/python/{format}/models.py for: ODS, ODT, PBM, PGM, PPM, QOI, SYLK
      Each using pattern: spec_qname ClassVar + from_file() + typed properties + to_dict()
    tests_required:
      - tests/python/{format}/test_{format}_document_model.py for each (30+ tests each)
    evidence_required:
      - from_file() working proof
      - Property access test results
    must_fix_before_product_deepening: "no"
    can_defer: "yes"
