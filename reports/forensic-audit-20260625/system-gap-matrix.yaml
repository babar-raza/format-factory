    expected_behavior: >
      A single compiler pipeline: gap-ledger → capability_feature_compiler.py →
      next-work-items.json → autonomous_cycle.py Step 3a. OR both compilers unified
      into one call with de-duplication.
    root_cause: >
      gap_ledger_to_work_items.py was created as a standalone batch tool.
      capability_feature_compiler.py was wired into autonomous_cycle.py separately.
      The two were never unified.
    product_impact: >
      Work items from gap_ledger_to_work_items.py are invisible to the supervisor.
      Some open gaps may never be assigned to sprint tasks automatically.
    machinery_impact: High
    repeatability_impact: High
    autonomy_impact: High
    qname_impact: Low
    required_fix: >
      Either:
      1. Wire gap_ledger_to_work_items.py into autonomous_cycle.py Step 3a-pre, OR
      2. Make capability_feature_compiler.py the single compiler and deprecate gap_ledger_to_work_items.py
    tests_required:
      - Integration test: gap-ledger entry → next-work-items.json → sprint task
    evidence_required:
      - End-to-end trace showing gap_id → capability_id → work_item_id → sprint task
    must_fix_before_product_deepening: "yes"
    can_defer: "no"
    suggested_taskcard_id: CAP-REPAIR-001
    priority: 1

