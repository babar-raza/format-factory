implementation_guidance:
  method_name: Pipeline
  source_class: NetpbmImage
  method_signature: "public NetpbmImage Pipeline(IEnumerable<Func<NetpbmImage, NetpbmImage>> steps)"
  description: >
    Add Pipeline method to NetpbmImage.cs. The method chains image transformation steps,
    each step receiving the result of the previous. Steps are applied in order.
    Empty steps list returns the original image (or a copy). Null step in list should
    throw ArgumentNullException. Returns the final transformed NetpbmImage.
  test_pattern: >
    Create NetpbmR114FlipMergePipelineTests.cs with 8 tests using a small test PPM/PBM image:
    1. Single step pipeline (e.g., img => img.Resize(10,10)) returns correct result
    2. Two step pipeline (flip + resize) applies both transforms in order
    3. Three step pipeline works correctly
    4. Empty steps list returns image (not null)
    5. Null step in list throws ArgumentNullException
    6. Pipeline result can be saved to file via SaveToFile
    7. Pipeline roundtrip: apply two inverse operations, result equals original
    8. Pipeline result is a new object (not same reference as input)

