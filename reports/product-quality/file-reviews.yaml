dotnet_file_reviews:

  - file: src/net/fods/FodsDocumentExtendedApis.cs
    loc: 1556
    intended_responsibility: >
      Extended ODF spreadsheet APIs for sheet metadata, conditional formatting,
      data validation, hyperlinks, pivot tables, sparklines, named ranges,
      page breaks, and cell formatting.
    actual_responsibilities:
      - "149 public methods covering R290-R394 test requirements"
      - "All methods created explicitly because test files reference them"
      - "71 methods backed only by in-memory dictionaries (no XML persistence)"
      - "78 additional aliases, no-ops, and convenience wrappers"
    namespace_or_module: FormatFactory.Fods
    public_types: [FodsDocument]  # partial class
    internal_types: []
    state_owned:
      - "_sheetProtection: Dictionary<string, string?>"
      - "_cellNumberFormats: Dictionary<(Sheet,Row,Col), string>"
      - "_cellAlignment: Dictionary<(Sheet,Row,Col), string>"
      - "_cellFont: Dictionary<(Sheet,Row,Col), (Font,Size,Bold)>"
      - "_cellWrapping: Dictionary<(Sheet,Row,Col), bool>"
      - "_freezePanes: Dictionary<string, (Rows,Cols)>"
      - "_filters: Dictionary<string, List<(Range,Column)>>"
      - "_conditionalFormats: Dictionary<string, List<(Range,Condition,Style)>>"
      - "_dataValidations: Dictionary<string, List<(Range,Rule,ErrorMsg)>>"
      - "_hyperlinks: Dictionary<string, List<(Url,Display)>>"
      - "_cellHyperlinks: Dictionary<(Sheet,Row,Col), (Url,Display)>"
      - "...and 22 more detached dictionaries"
    qnames: []  # No spec_qname declarations anywhere in file
    parser_role: NONE
    model_role: STUB_PROVIDER
    writer_role: NONE
    comment_quality: POOR  # XML doc comments describe intended behavior that does NOT happen
    documentation_quality: POOR  # False promises (persist claims without XML path)
    tags_and_markers:
      - "// R290 through R394 in doc comments — requirement IDs, not spec references"
      - "File header line 3: 'minimal implementations suitable for governed test coverage'"
    architecture_findings:
      - type: TEST_SHAPED_APIS
        severity: CRITICAL
        detail: >
          File header explicitly states: "covers all APIs referenced by R290-R341 test files."
          APIs were created because tests reference them, not because ODF spec authorizes them.
          This is the clearest confirmed case of test-driven API creation in the portfolio.
      - type: DETACHED_PERSISTENT_STATE
        severity: CRITICAL
        detail: >
          33 in-memory dictionaries store state that is claimed to be persistent
          but is entirely lost on every Save()+Load() cycle. No XML write path exists
          for these stores. SetSheetProtection, SetFreezePane, AddDataValidation,
          AddHyperlink, AddConditionalFormat — ALL store to in-memory only.
      - type: SEMANTIC_STUBS
        severity: CRITICAL
        detail: >
          Self-described: "minimal implementations suitable for governed test coverage."
          SortSheet (line 906-915) is explicitly documented as a no-op.
          Many setters store to dict (appear to work) while getters return the dict value
          (tests pass) — but the feature does not actually exist in the document.
      - type: DUMPING_GROUND_FILENAME
        severity: HIGH
        detail: >
          'ExtendedApis' in filename is a forbidden pattern (mission §8).
          The name signals 'stuff that didn't fit elsewhere' — organized by
          development history (R290-R394 requirement ranges), not domain responsibility.
      - type: RESPONSIBILITY_VIOLATION
        severity: MEDIUM
        detail: >
          Lines 952-979: SetCellFontColor calls FodsStyleEditor (style responsibility).
          This is a style editor concern mixed into the extended-api partial class.
    code_writing_findings:
      - "Constant-return pattern: GetProtectionStatus always returns 'none' for unset sheets"
      - "Fabricated defaults: GetFreezePaneRow returns 0 for unset (plausible but invented)"
      - "Alias methods: GetCellTextColor = GetCellFontColor (line 1419)"
      - "No-op method: SortSheet (line 906-915) explicitly documented as no-op"
    governance_findings:
      - "No spec_qname fields on any type"
      - "R-numbers in XML doc comments are requirement IDs, not ODF spec references"
      - "Missing IReadOnlyList<T> — mutable collection exposure risk"
    disposition: QUARANTINE_THEN_REDESIGN

  - file: src/net/fods/FodsDocumentAccessor.cs
    loc: 3283
    intended_responsibility: "Query and data access layer for FodsDocument"
    actual_responsibilities:
      - "Data query (GetRowValues, GetColumnValues, GetUsedRange)"
      - "Data export (ExportSheetToJson, ExportSheetToCsv, ExportSheetToXml)"
      - "Data filtering (FilterRows, SortRows)"
      - "Style resolution (GetResolvedCellStyle via FodsStyleResolver)"
      - "Cell formatting mutation (SetCellBold, SetCellItalic, SetCellStyle)"
      - "Sheet configuration (GetSheetFreezeRows, GetSheetZoomLevel)"
      - "Column/row mutation (AddColumn, DeleteRows, InsertRow)"
      - "File I/O (ExportSheetToCsvFile)"
      - "Document metadata (GetSheetCount, GetSheetIndex)"
    qnames: []
    parser_role: NONE
    model_role: QUERY_AND_ACCESSOR
    writer_role: MUTATION_SIDE  # Mutation methods mixed in
    comment_quality: MEDIUM
    documentation_quality: MEDIUM  # TODOs are explicit about what's missing
    tags_and_markers:
      - "15 GI-FODS-NET-001 Phase 3b/3c/3d/3e TODO markers"
    architecture_findings:
      - type: MONOLITHIC_MIXED_RESPONSIBILITY
        severity: CRITICAL
        detail: >
          7 distinct responsibility domains in a single 3283 LOC file.
          Query, Export, Filter/Sort, Style, Sheet Config, Mutation, Metadata
          are all interleaved with no structural separation.
      - type: LOC_CAP_VIOLATION
        severity: HIGH
        detail: "3283 LOC vs 800 LOC cap = 4.1× the limit"
      - type: EXPORT_IN_ACCESSOR
        severity: MEDIUM
        detail: "ExportSheetToCsvFile (file I/O) in accessor violates responsibility contract"
      - type: STYLE_IN_ACCESSOR
        severity: MEDIUM
        detail: "SetCellBold/Italic, GetCellStyle in accessor blurs styling responsibility"
    governance_findings:
      - "LOC cap violation detected but frozen in baseline — cannot increase"
      - "47 TODO markers indicate known incomplete work"
    disposition: SPLIT_BY_DOMAIN

  - file: src/net/fods/FodsDocument.cs
    loc: 893
    intended_responsibility: "Core document model — load, save, sheet management"
    actual_responsibilities:
