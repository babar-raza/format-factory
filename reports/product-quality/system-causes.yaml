  - cause_id: SC-009
    title: Certification closes on test-count proof without requiring round-trip and persistence evidence
    defect_categories: [tests_certification, governance]
    findings_implicated: [TEST-001, TEST-002, TEST-003, TEST-004, GOV-005]
    originating_component: ".governance/certification/ (certification criteria schema)"
    exact_instruction_or_behavior: |
      Certification closes when: test_count >= threshold AND evidence_review.json shows PASS.
      No certification criterion requires:
      - Save()+Load() round-trip proof per persistent feature
      - Getter-without-parser detection
      - Setter-without-writer detection
      - API authority proof (QName per method)
      GI-FODS-NET-001 was certified CLOSED with R290-R341 tests passing
      (get/set symmetry tests only).
    incentive_created: |
      Task closes when tests pass. Tests test in-memory symmetry. No round-trip required.
      Certification closes when enough tasks close. 33 detached dicts survive certification.
    resulting_code_pattern: |
      GI-FODS-NET-001 declared COMPLETE. 33 detached dictionaries in production code.
    first_failed_control_boundary: |
      Certification evidence review: should require roundtrip_proof per persistent feature.
    why_existing_controls_failed: |
      Certification criteria in evidence-review.json do not include roundtrip_proof dimension.
      Test count + in-memory test pass = sufficient for certification closure.
    evidence:
      - "reports/supervisor/evidence-review.json: GI-FODS-NET-001 CLOSED"
      - "incident-baseline.yaml: DETACHED_PERSISTENT_STATE_STORES=37 confirmed after closure"
      - "R290-R341 test pattern: SetX(v); Assert.Equal(v, GetX()) — no Save()+Load()"
    prevention: |
      Add to certification criteria: "MUST include at least one round-trip test per
      persistent document property. MUST show getter reads from XML parser path."
    detection: V91, V92, V93.
    recovery: |
      Reopen GI-FODS-NET-001 certification.
      Add mandatory round-trip tests for all 35 detached SetXxx methods.
      Re-certify only after XML persistence path is implemented and round-trip tests pass.

