# ============================================================
# SCORING DIMENSIONS AND WEIGHTS
# ============================================================
scoring_dimensions:
  known_baseline_violations:
    description: Count of files in source-structure-baseline.json known_violations for this format
    weight: 2
  dotnet_files_over_800_loc:
    description: Sum of (actual_LOC / 800) for .NET files exceeding 800 LOC cap
    weight: 5
  dumping_ground_filenames:
    description: Presence of ExtendedApis, MissingMethods, Misc, Helpers, Stubs in product filenames
    weight: 10
  sprint_history_identifiers:
    description: Sprint/wave/train identifiers in source comments (not spec refs)
    weight: 3
  analytics_not_separated:
    description: Python format lacks dedicated {format}_analytics.py
    weight: 3
  analytics_masquerade:
    description: File named *_document.py whose docstring describes analytics functions (V69 violation)
    weight: 8
  public_method_explosion:
    description: .NET public method count > 100 (indicates inflated surface)
    weight: 4
  test_shaped_apis_confirmed:
    description: Confirmed evidence of APIs created to satisfy test references, not spec
    weight: 15
  detached_persistent_state:
    description: Dictionary used as primary backing store for features that claim ODF persistence
    weight: 10
  semantic_stubs_confirmed:
    description: Self-described "minimal implementations suitable for governed test coverage"
    weight: 15

