# ============================================================
# SELECTION RESULT
# ============================================================
example_product_selection:
  format: fods
  languages: [python, csharp]
  composite_score: 172
  runner_up: fodt
  runner_up_score: 86
  score_margin: 86  # FODS score is 2x the next worst

  selection_rationale:
    - reason: test_shaped_apis_confirmed
      evidence: >
        FodsDocumentExtendedApis.cs line 2: "covers all APIs referenced by R290-R341 test files."
        Line 3: "These methods provide minimal implementations suitable for governed test coverage."
        This is the most explicit example of test-shaped API creation in the entire portfolio.
        APIs were created because test files referenced them, not because spec facts authorized them.

    - reason: detached_persistent_state_confirmed
      evidence: >
        FodsDocumentExtendedApis.cs line 43: private readonly Dictionary<string, string?> _sheetProtection = new();
        IsSheetProtected() reads from the in-memory dict, not from ODF XML.
        SetSheetProtection() writes to the dict, not to ODF XML.
        State is permanently lost on Save()+Load() cycle — feature does not actually persist.

    - reason: semantic_stubs_confirmed
      evidence: >
        149 public methods in FodsDocumentExtendedApis.cs, self-described as
        "minimal implementations suitable for governed test coverage." These are
        semantic stubs that return plausible results without actual spec grounding.

    - reason: monolithic_files
      evidence: >
        FodsDocumentAccessor.cs: 3283 LOC, 187 public members — 4.1× the 800 LOC cap.
        No architectural justification. Contains GetRowCount, GetColumnCount, GetCellCount,
        ExportSheetToJson, ExportSheetToMarkdown — multiple concerns in one file.

    - reason: dumping_ground_filename
      evidence: >
        FodsDocumentExtendedApis.cs is a forbidden filename pattern (ExtendedApis suffix).
        Exists solely to accumulate "the rest" that did not fit in FodsDocument.cs.

    - reason: analytics_masquerade
      evidence: >
        spreadsheet_document.py (1124 LOC) has module docstring:
        "fods_analytics.py -- Analytics functions for the FODS neutral model"
        but the filename is spreadsheet_document.py. V69 violation confirmed.

    - reason: spans_both_tracks
      evidence: >
        Defects exist in both Python FOSS (spreadsheet_document.py masquerade, 285 history IDs)
        and .NET commercial (ExtendedApis, Accessor monolith) tracks simultaneously.
        Broadest scope for mission investigation and healed-system demonstration.

    - reason: highest_violation_count
      evidence: >
        32 entries in source-structure-baseline.json known_violations — highest in the portfolio.

    - reason: known_incident
      evidence: >
        GI-FODS-NET-001 required "Category D purge" — code was generated, survived CI,
        closed taskcards, but was structurally defective. This is the confirmed incident
        that demonstrates the systemic problem. Recent commits (b947eeac, 9bf2fe21) show
        healing work still in progress.

