        formats: [ppm, pgm, pbm]
        tasks: [TC-FG-PROD-004]
        mutation_owner: "src/python/ppm/ + src/python/pgm/ + src/python/pbm/ + tests/python/ppm/"
      - name: pilot_csv
        formats: [csv, tsv]
        tasks: [TC-FG-PROD-005]
        mutation_owner: "src/python/csv/ + src/python/tsv/ + tests/python/csv_format/ + tests/python/tsv/"
    dependencies: [BATCH-1, BATCH-2]
    exit_gates:
