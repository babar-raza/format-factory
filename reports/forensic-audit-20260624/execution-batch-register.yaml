      - name: lane_non_odf_qnames
        formats: [abw, csv, dif, gnumeric, ndjson, pbm, pgm, ppm, qoi, sylk, toml, tsv, xcf, zst]
        tasks: [TC-FG-QNAME-001-NON-ODF]
        mutation_owner: "shared/qname-registry/*.yaml (non-ODF files)"
