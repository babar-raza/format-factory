      - TC-FG-SAL-001-B  # XML schema ingestion: Gnumeric, ABW
      - TC-FG-SAL-002    # TOML full spec ingestion
      - TC-FG-SAL-003    # ABW reverse-engineering
    parallel_lanes:
      - name: lane_rfc_adapter
        formats: [zst, csv]
        tasks: [TC-FG-SAL-001-A]
        mutation_owner: "tools/spec/sal_rfc_ingester.py + .local/spec-cache/zst/ + .local/spec-cache/csv/"
      - name: lane_xml_adapter
        formats: [gnumeric, abw]
        tasks: [TC-FG-SAL-001-B, TC-FG-SAL-003]
        mutation_owner: "tools/spec/sal_xml_ingester.py + .local/spec-cache/gnumeric/ + .local/spec-cache/abw/"
      - name: lane_toml_spec
        formats: [toml]
        tasks: [TC-FG-SAL-002]
        mutation_owner: ".local/spec-cache/toml/"
    dependencies: [BATCH-0]
    exit_gates:
