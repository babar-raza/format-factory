  - root_cause_id: RC-001
    affected_gap_ids: [FG-SAL-001, FG-SAL-002, FG-SAL-003]
    affected_formats: [abw, gnumeric, xcf, dif, sylk, csv, tsv, ndjson, toml, qoi, ppm, pgm, pbm, zst, xpm, pam, zpaq]
    first_failing_boundary: SPEC_TO_FACT
    symptom: "Non-ODF formats have 2-22 spec facts each, while ODF formats have 1,000-5,000. Capabilities are not supported by spec evidence."
    local_cause: "SAL (Spec Authority Layer) pipeline was built and calibrated for ODF 1.3. For non-ODF formats it uses bootstrap-only seeding without automated extraction."
    systemic_cause: "ODF has a machine-readable PDF that can be chunked and verified. Non-ODF formats range from short RFCs (8 pages) to informal community wikis to binary reverse-engineered specs. The SAL pipeline has no generic text-spec ingestion mode."
    machinery_cause: "sal_master_runner.py processes spec_cache entries. For non-ODF formats, only manifest.yaml + provenance metadata exists in spec-cache — no chunked text, no verified-facts YAML."
    governance_cause: "No enforcement exists requiring spec_facts > N before capabilities can be generated. TC-GUARD-001 guards new work items but does not retroactively audit existing capabilities."
    state_cause: "14,486 total facts exists but 13,204 are ODF family. Non-ODF is 1,282 facts for 19 formats (~67 avg) — but many of these are also ODF-adjacent (ODS/ODT use ODF 1.3)."
    why_prior_tests_missed_it: "No test validates that capability counts are proportional to verified fact counts. Inflation ratio is not a governance gate criterion."
    recurrence_path: "New formats added without rich spec extraction will repeat the inflation pattern."
    permanent_fix: "Build a generic spec-ingestion adapter for each spec type: RFC parser, XML schema parser, informal HTML spec crawler. Require verified_facts_count > 10 before capability generation is allowed."
    prevention_controls:
      - "Add V-NEW-001: validate that capabilities / verified_facts < 10 for non-ODF formats"
      - "Add spec ingestion adapters (RFC, XSD, ABNF, informal HTML)"
      - "Require spec_cache/{format}/chunks.jsonl before SAL processing"
    product_backfill_required: false

  - root_cause_id: RC-002
    affected_gap_ids: [FG-QNAME-001, FG-QNAME-002]
    affected_formats: [all_20_in_qname_registry]
    first_failing_boundary: FACT_TO_QNAME
    symptom: "All 20 qname-registry YAML files have 0 entries. Parity matrix shows '?' for all formats."
    local_cause: "The qname registry seeding script (.local/tmp_create_registries.py per MEMORY.md) created file skeletons with 'entries: []' but did not populate the entries."
    systemic_cause: "QName registry was designed as a data file to be populated by a generator. The generator was never built or run. Files were created manually as architecture placeholders."
    machinery_cause: "No tool exists to: (a) read SAL facts, (b) derive qnames from facts, (c) write qname-registry YAML entries. The pipeline stops at SAL facts and skips the qname derivation step entirely."
    governance_cause: "V53 validates that code classes have spec_qname class attributes, but it does not validate that the spec_qname is registered in the qname-registry. The registry is therefore orphaned."
    why_prior_tests_missed_it: "No test reads qname-registry files and checks non-zero entries. Existing tests only validate Python class attributes."
    recurrence_path: "Continued addition of classes with spec_qname attributes without registry entries means the registry diverges further from code."
    permanent_fix: |
      1. Build qname_registry_generator.py: reads SAL facts -> derives {namespace}:{local_name} -> writes entries to registry YAML
      2. Build qname_registry_validator.py: checks that code spec_qname matches registered entries
      3. Wire both into governance_validators.py
    prevention_controls:
      - "V-NEW-002: validate qname_registry entries > 0 for all formats with source code"
      - "V-NEW-003: validate code spec_qname attributes exist in registry"
    product_backfill_required: false

  - root_cause_id: RC-003
    affected_gap_ids: [FG-CAP-001, FG-CAP-002, FG-GOV-002]
    affected_formats: [abw, gnumeric, xcf, dif, sylk, csv, tsv, ndjson, toml, qoi, ppm, pgm, pbm]
    first_failing_boundary: FACT_TO_CAPABILITY
    symptom: "Capability-to-fact inflation ratios range from 10x to 54x for non-ODF formats."
    local_cause: "Capability extraction used POC_GOAL templates (load, save, inspect, convert, export) applied to every format, regardless of spec evidence. Each template generates 60-120 capabilities per format."
    systemic_cause: "The capability_map_generator.py uses a format's goal_template to produce capability records. Goal templates are defined per format family, not per spec fact. No fact_id is attached to individual capabilities."
    machinery_cause: "unified-capability-map.json shows spec_refs_count = 5009 for every FODS capability — this is the TOTAL fact count for FODS, not the count of facts relevant to each capability. Per-capability fact citation is missing."
    governance_cause: "TC-GUARD-001 (gap_ledger_ref required) guards new PRODUCT_SOURCE items but does not retroactively audit the 1,641 existing foss_reduced capability records."
    why_prior_tests_missed_it: "No test validates that capability.spec_refs points to specific fact IDs, not the total format fact count."
    recurrence_path: "New formats added using the same goal-template approach will continue to produce inflated, unsupported capabilities."
    permanent_fix: |
      1. Redesign capability extraction: for each capability type (load/save/inspect), determine which spec facts are relevant
      2. Build per-capability fact citation: capability.spec_fact_refs = [FACT-{FORMAT}-NNN, ...]
      3. Audit existing 1,641 capabilities: classify each as FACT_DERIVED, POC_DERIVED, or UNSUPPORTED
    prevention_controls:
      - "Require len(spec_fact_refs) > 0 for each capability"
      - "Cap capabilities = min(verified_facts * 5, N) per format"
    product_backfill_required: false

