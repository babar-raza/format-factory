false_green_class: TYPE_OR_SHAPE_ONLY_PROOF_MIXED_WITH_BEHAVIORAL

false_green_evidence:
  - field: acceptance_criteria_met
    value: ["Evidence found", "No missing paths"]
    issue: file-existence-only criteria — no behavioral assertion strength check performed
  - field: semantic_verification.confidence
    value: 0.7
    issue: intermediate_content_check path — benefit-of-doubt threshold applied without behavioral verification
  - field: semantic_verification.llm_used
    value: false
    issue: intermediate fallback ran (grade_intermediate_verify.intermediate_verify_item) — string-search only, no AST analysis
  - field: semantic_verification.source
    value: intermediate_content_check
    issue: blanket adequate=true for any file containing 'def test_' and 'assert'

root_cause_mechanism: >
  When LLM is unavailable, grade_declared_work.py falls through to
  grade_intermediate_verify.intermediate_verify_item(). That function does:
    test_content_valid = "def test_" in content and "assert" in content
  This is True for any test file. Combined with adequate=True → item promoted to
  ACCEPTED_VERIFIED regardless of assertion strength. Grade cache then persists
  result 7 days keyed by content hash. LLM was unavailable for this sprint run.

