# ──────────────────────────────────────────────────────────────────────────────
# GLOBAL LAYOUT RULES (enforced by TC-ARC-012 validators)
# ──────────────────────────────────────────────────────────────────────────────

global_rules:
  prohibited_subdir_names:
    - "MissingMethods"
    - "ExtendedApis"
    - "Misc"
    - "Extra"
    - "Helpers"
    - "Utils"
    - "LegacyCounters"
  prohibited_filename_patterns:
    - "*Sprint*"
    - "*Wave*"
    - "*Task*"
    - "*Run*"
    - "*R[0-9][0-9][0-9][0-9]*"   # sprint-ID-ranged filenames
  dotnet_requirements:
    - "One primary public type per .cs file"
    - "Filename matches primary type (e.g. TableCell.cs for class TableCell)"
    - "Model/<Ns>/ path follows QName namespace"
    - "Parsing/ components may only reference Model/ types"
    - "Writing/ components may only reference Model/ types"
  python_requirements:
    - "spec/<ns>/<type>.py — one canonical class per file"
    - "Compat/ wraps spec classes — does not re-implement behavior"
    - "parser/ modules populate spec/ objects from real files"
    - "writer/ modules serialize spec/ objects to format bytes"
    - "models.py is transitional — target is Compat/ wrapping spec/"
  wave1_scope:
    status: "QUEUED_PENDING_SYSTEM_HEALING_GATE"
    note: >
      Wave 1 source migration creates these directory structures in src/net/ and src/python/.
      No directories are created until Lanes 1-6, 14, 15 system healing gate passes.
      This plan records WHAT will be created, not authorization to create it now.
