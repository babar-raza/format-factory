# ──────────────────────────────────────────────────────────────────────────────
# NEW PRODUCT AUTO-GOVERNANCE
# ──────────────────────────────────────────────────────────────────────────────

new_product_onboarding:
  governance_applies_automatically: true
  mechanism: >
    When a new product is added to the Format Factory:
    1. Add entry to registry/format-registry.yaml (format_id, spec_uri, language)
    2. Add entry to reports/product-architecture/qname-code-organization-plan.yaml
       (format, language, root, target_layout) — this is the ONLY manual registration needed
    3. V125 (validate_new_product_bypassing_architecture_gate) immediately BLOCKS any
       new source code for this format until the org-plan entry exists
    4. V126 BLOCKS any files placed outside the approved QName layout
    5. V127 BLOCKS any types outside the approved QName hierarchy
    6. /add-dotnet-api, /add-python-api, /add-dotnet-object-model-feature,
       /add-python-object-model-feature skills ALL require spec_fact_ids, qname,
       canonical_owning_type, parser_obligation, writer_obligation — enforced at execution time
    7. Promotion registry auto-inherits classification from product-architecture-audit.yaml
  no_manual_registration_required: true
  exception: >
    Only qname-code-organization-plan.yaml requires manual entry. All other governance
    is automatic from that point forward.
  validated_by:
    - "V125 (governance_validators_ext4.py)"
    - "V126 (governance_validators_ext4.py)"
    - "V127 (governance_validators_ext4.py)"
    - "pre_execution_checklist in all 4 product-adding skills"
    - "traceability_required in all 4 product-adding skills"
