# ~40 ODF-grounded getters/setters backed by in-memory dictionaries.
# Dictionaries are never populated by the parser and never flushed by the writer.
# State is silently lost on every save/reload. Roundtrip contract is broken.
category_B_detached_dict_count: 40
category_B_detached_dict:
  - GetSheetFreezeRows / SetSheetFreezeRows     # needs config:config-item
  - GetSheetFreezeColumns / SetSheetFreezeColumns
  - GetSheetZoomLevel / SetSheetZoomLevel       # needs config:config-item
  - GetSheetPrintArea / SetSheetPrintArea       # needs table:named-range
  - GetSheetProtectionPassword / SetSheetProtectionPassword  # table:table/@table:protection-key
  - GetSheetVisibility / SetSheetVisibility     # table:table/@table:display
  - GetSheetRightToLeft                         # sheet style writing-mode (getter only)
  - GetSheetShowGrid                            # config:config-item ShowGrid (getter only)
  - GetSheetShowHeaders                         # config:config-item HasColumnRowHeaders (getter only)
  - GetCellColumnWidth                          # delegates GetColumnWidth (committed anti-pattern)
  - GetCellRowHeight                            # delegates GetRowHeight (committed anti-pattern)
  - GetCellBorderStyle / SetCellBorderStyle     # style:table-cell-properties/@fo:border
  - GetCellFontStyle / SetCellFontStyle         # style:text-properties/@fo:font-style
  - GetCellHorizontalAlignment / SetCellHorizontalAlignment  # style:paragraph-properties/@fo:text-align
  - GetCellVerticalAlignment / SetCellVerticalAlignment      # style:table-cell-properties/@style:vertical-align
  - GetCellIndentLevel / SetCellIndentLevel     # style:paragraph-properties/@fo:margin-left
  - GetCellRotationAngle / SetCellRotationAngle # style:table-cell-properties/@style:rotation-angle
  - GetCellMergeInfo                            # table:table-cell/@table:number-rows-spanned (getter only)
  - GetCellMergeSpan / SetCellMergeSpan         # table:table-cell/@table:number-columns-spanned
  - GetCellShrinkToFit / SetCellShrinkToFit     # style:table-cell-properties/@style:shrink-to-fit
  - GetCellUnderline / SetCellUnderline         # style:text-properties/@style:text-underline-style
  - GetCellStrikethrough / SetCellStrikethrough # style:text-properties/@style:text-line-through-style
  - GetCellProtection / SetCellProtection       # style:table-cell-properties/@style:cell-protect

# --- First failed governance boundary ---
first_failed_boundary: >
  No validator existed to detect constant-return public APIs in .NET source, detached
  dictionary backing fields, or "MissingMethods"-style product filenames. The file was
  created as an untracked artifact to satisfy test compilation without entering the
  governed source baseline. Sprint acceptance rewarded method presence (test PASS) rather
  than semantic correctness (roundtrip persistence, ODF spec grounding). No architecture
  owner challenged the "production-grade stubs" comment in the file header.

# --- Governance gaps confirmed ---
governance_gaps:
  - No V87-class validator: constant-return public APIs not detected
  - No V88-class validator: detached dictionary fields not detected
  - No V89-class validator: suspicious filenames not detected
  - Certification treats "test_verified" as equivalent to "implementation_verified"
  - FodsRoundtripMutationTests.cs documents RT-MUT-05 as "known gap" for font color;
    same gap class extends to all Category B properties — not disclosed in certification
  - No persistence testing in Gate 11 evidence for these API classes

# --- Committed anti-patterns in related files ---
committed_anti_patterns:
  - file: src/net/fods/FodsDocumentAccessor.cs
    fields: [_columnWidths, _namedRanges, _activeFilters, _rowHeights, _charts]
