  - gap_id: GAP-FORENSIC-025
    title: "csv wheel module is unimportable — stdlib 'csv' shadows it by construction"
    severity: HIGH
    pipeline_boundary: B9_oracle_to_package
    scope: csv
    description: >
      Discovered by the first real package-install proof (2026-07-15): Python resolves
      stdlib before site-packages, so 'import csv' ALWAYS finds the stdlib module.
      The format-factory-csv wheel installs cleanly but its top-level module can never
      be imported in a standard environment — the shipped package is dead code.
      The old sys.path-based test masked this by excluding csv "due to stdlib name
      collision" instead of treating the collision as a product defect.
      In-repo usage only works because tests/python/conftest.py prepends src/python
      to sys.path (ahead of stdlib), which no consumer environment does.
    rc_ref: null
    anomaly_refs: []
    evidence_of_gap: "reports/package-install-proof/proof-manifest.json: csv verdict FAIL (import resolved to stdlib Lib/csv.py); junit .local/package-install-proof-results-csv.xml"
    remediation: >
      Product decision required: rename csv's import package (e.g. ff_csv or csv_ff)
      with a PYREL-001 naming-convention amendment, then migrate the 13 csv_to_* /
      *_to_csv converters and tests. Until then the failure is waived in
      package-matrix.yaml (install_proof.known_failure -> this gap) so V226 reports
      WARN, not FAIL; the proof manifest keeps the honest FAIL verdict.
    remediation_tc: plans/.claude/parallel-nibbling-dongarra-taskcards/TC-GAP-FORENSIC-025.yaml
    remediation_owner: agent_owned_after_naming_decision
    status: OPEN

