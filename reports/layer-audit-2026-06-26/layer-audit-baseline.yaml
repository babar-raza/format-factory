---
# TARGET LAYER ARCHITECTURE

target_architecture:
  principles:
    - Each layer owns a single coherent responsibility
    - No new layer unless it adds operational value not achievable by extending an existing one
    - False layers (taskcards/ archive, stale docs) are demoted to observation or archived
    - Reduce machinery complexity — merge layers where responsibility overlaps
    - Every layer must have a registered skill to invoke it
    - Provenance chain must be unbroken from spec fact to deployed package

  true_independent_layers:
    - L01: Specification Authority Layer (needs SAL skill + 14 formats)
    - L02: QName Hierarchy Authority (needs spec_fact_ref completion)
    - L03: Capability and Gap Authority (needs closure audit)
    - L05: Oracle and Conformance Authority (needs expansion to all formats)
    - L06: Product Source Layer (production, ongoing)
    - L07: Test Infrastructure Layer (production, prune arithmetic tests)
    - L08: Evidence and Review Package Layer (production)
    - L09: State and Continuation Layer (production)
    - L11: Supervisor and Sprint Authority Layer (production)
    - L12: Governance and Policy Layer (production)
    - L13: Skill and Command Execution Layer (production)

  sublayers_not_independent:
    - L04: Sample Corpus → sublayer of L01 (corpus feeds SAL)
    - L10: Plan Authority → sublayer of L11 (supervisor owns sprint prompts)
    - L14: Source-Change Handoff → sublayer of L13 (a skill, not a layer)
    - L17: Feature Compilation → sublayer of L03 (gap → work item is capability layer output)
    - L19: Dogfood Evidence → sublayer of L08 (evidence type, not independent)
    - L20: Regression Authority → sublayer of L07 (test layer concern)
    - L21: Provenance → cross-cutting policy, embedded in L08+L15
    - L22: Product Architecture → cross-cutting policy, enforced by L12
    - L23: Legal/Obligation → sublayer of L13 (skill-governed gate check)
    - L24: Security → sublayer of L07 (test layer concern)

  rejected_as_layers:
    - L15: Release/Packaging → formalize as skill set in L13, not independent layer
    - L16: AI Boundary → cross-cutting policy in L08+L12, not independent layer
    - L18: Knowledge → cross-cutting concern (docs + memory), not operational layer

