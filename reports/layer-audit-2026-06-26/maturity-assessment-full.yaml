# Format Factory — Full 25-Dimension Layer Maturity Assessment
# Mission: FORMAT-FACTORY-LAYER-AUDIT-20260626
# Generated: 2026-06-26
# Analyst: autonomous sprint (TC-LA-AUDIT-003)
# Formula version: 1.0

formula_version: "1.0"
scoring_scale: "0=absent, 1=conceptual, 2=partial, 3=operational, 4=governed, 5=production"
maturity_bands:
  L0: "0.0–0.5"
  L1: "0.5–1.5"
  L2: "1.5–2.5"
  L3: "2.5–3.5"
  L4: "3.5–4.5"
  L5: "4.5–5.0"

bucket_weights:
  contract: 1.5   # input_contract, output_contract, schema_quality, authority_clarity, provenance
  validation: 1.5  # validation, test_coverage, negative_controls, idempotency, evidence_quality
  lifecycle: 1.0   # failure_handling, recovery_rollback, versioning_compatibility, stale_state_detection, artifact_identity
  integration: 1.0 # skill_command_integration, supervisor_integration, consumer_adoption, responsibility_cohesion, producer_completeness
  overhead: 0.75   # maintainability, machinery_overhead, product_value, observability, security_compliance

# Formula: weighted_score = sum(bucket_avg * weight) / sum(weights)
# sum(weights) = 1.5 + 1.5 + 1.0 + 1.0 + 0.75 = 5.75

layers:
  - layer_id: L01
    canonical_name: Specification Authority (SAL)
    dimension_scores:
      # Contract bucket
      input_contract: 3         # normalized text format defined, not formally schematized
      output_contract: 3        # sal-facts-{format}.json exists but schema informal
      schema_quality: 0         # schemas/ has only _readme.md — NO formal SAL schema
      authority_clarity: 4      # sal_master_runner.py is clear authority
      provenance: 3             # FACT-FORMAT-NNN IDs trace to spec source
      # Validation bucket
      validation: 2             # refresh_check.py exists but not enforced
      test_coverage: 1          # no automated tests of SAL pipeline
      negative_controls: 1      # no tests of bad spec input
      idempotency: 3            # safe_rerun documented in /ingest-spec-sal skill
      evidence_quality: 2       # sal-facts-latest.json is evidence; quality varies by format
      # Lifecycle bucket
      failure_handling: 2       # no explicit failure handling documented
      recovery_rollback: 2      # facts are additive; can delete and remerge
      versioning_compatibility: 1  # no spec version upgrade path
      stale_state_detection: 1  # refresh_check.py not auto-called
      artifact_identity: 3      # FACT-FORMAT-NNN IDs exist
      # Integration bucket
      skill_command_integration: 4  # /ingest-spec-sal registered (93 skills)
      supervisor_integration: 2     # refresh_check.py wired but non-enforced
      consumer_adoption: 3          # QName registry references FACT-IDs
      responsibility_cohesion: 4    # clear: spec text → facts
      producer_completeness: 2      # only 6/20 formats have facts
      # Overhead bucket
      maintainability: 3        # tools exist and are documented
      machinery_overhead: 2     # heavy: PDF → normalize → extract → merge pipeline
      product_value: 4          # enables spec-parity verification when working
      observability: 2          # sal-facts-latest.json visible; no monitoring
      security_compliance: 3    # reads spec PDFs; no external calls
    bucket_avgs:
      contract: 2.60   # (3+3+0+4+3)/5
      validation: 1.80  # (2+1+1+3+2)/5
      lifecycle: 1.80  # (2+2+1+1+3)/5
      integration: 3.00 # (4+2+3+4+2)/5
      overhead: 2.80   # (3+2+4+2+3)/5
    weighted_score: 2.35  # (2.60*1.5 + 1.80*1.5 + 1.80*1.0 + 3.00*1.0 + 2.80*0.75) / 5.75
    computed_maturity: "L2"
    human_override: null
    critical_zero_dimensions:
      - schema_quality  # No formal SAL schema in schemas/; directory has only _readme.md
    key_gaps:
      - No formal schema for sal-facts JSON format
      - Only 6/20 formats have extraction working (ODF family + ZST partial)
      - SAL pipeline not tested; no negative controls
      - No auto-staleness detection for cached spec versions

