    exporter_file: "src/net/fods/FodsCsvExporter.cs"
    delegation_line: 149
    tests: "tests/net/fods/FodsCsvExporterTests.cs"
    tests_pass: 547
    tests_fail: 0
    dogfood_sample: "reports/authority-target-writer-mega-train-r119/fods-csv-integration/fods-csv-output-sample/multi-sheet-first-sheet-expected.csv"

