    tests_prove_invocation: true
    dogfood_artifact_exists: true
    rca_proof_graph_linked: false  # requires RCA R2 sprint

  limitations:
    - "Only first sheet exported by ExportFirstSheetToCsv (prototype)"
    - "table:number-columns-repeated not expanded"
    - "Formula results not available"
