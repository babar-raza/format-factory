description: |
  Add a get_pixel(x, y) method to the PbmImage class in pbm_parser.py that
  returns the pixel value (0 or 1) at the given coordinates. The method should:
  1. Validate x is in range [0, width)
  2. Validate y is in range [0, height)
  3. Return the pixel value from the decoded pixel data
  4. Raise ValueError for out-of-bounds coordinates
  Tests: at least 8 focused tests covering:
  1. get_pixel at (0, 0) on a known 1-pixel image
  2. get_pixel at corners of a multi-pixel image
  3. get_pixel returns 0 for white pixel
  4. get_pixel returns 1 for black pixel
  5. get_pixel with negative x raises ValueError
  6. get_pixel with x >= width raises ValueError
  7. get_pixel with negative y raises ValueError
  8. get_pixel with y >= height raises ValueError

