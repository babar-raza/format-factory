    semantic_key: "site_packages_sync_no_enforcement"
    source_stage_ids: ["S04-SITE-PACKAGES-SYNC"]
    affected_output_classes: ["OC-03"]
    source_claim_ids: []
    category: "WEAK_VERIFICATION"
    severity: "MEDIUM"
    symptom: |
      Non-editable package sync (cp src/ → site-packages/) has no automated hook,
      validator, or test. If sync is skipped, tests pass (via sys.path) but the
      installed package serves stale behavior.
    evidence:
      - "MEMORY.md: 'Non-editable installs: Copy .py files to .venv/Lib/site-packages/{pkg}/'"
      - "No pre-commit hook that checks diff(src/, site-packages/)"
      - "Test fixture uses sys.path.insert — bypasses installed package"
    first_failing_boundary: "S04-SITE-PACKAGES-SYNC (no automated enforcement)"
    root_cause: |
      Python non-editable install is a design constraint (pip install -e not used).
      Manual sync step is required but has no machine-enforced validation.
    blast_radius: "Any consumer using installed package (not repo source) gets stale behavior"
    current_risk: |
      LOW for current sprint — sync verified manually (diff shows no delta).
      MEDIUM for future sprints — easy to forget, invisible to tests.
    permanent_solution: |
      Add a pre-commit hook that diffs src/python/{format}/*.py vs
      .venv/Lib/site-packages/{format}/*.py and fails if stale.
      OR switch to editable installs (pip install -e src/python/{format}/).
    machinery_repair_required: false
    output_backfill_required: false
    verification:
      - "diff src/python/ndjson/models.py .venv/Lib/site-packages/ndjson/models.py: NO OUTPUT ✓"
      - "diff src/python/toml/models.py .venv/Lib/site-packages/toml/models.py: NO OUTPUT ✓"
