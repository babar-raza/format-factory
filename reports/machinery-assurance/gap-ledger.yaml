  - gap_id: "GAP-MA-006"
    semantic_key: "dogfood_namespace_conflict_on_import"
    source_stage_ids: ["S09-GAP-LEDGER"]
    affected_output_classes: ["OC-007"]
    source_claim_ids: []
    category: "WEAK_VERIFICATION"
    severity: "MEDIUM"
    symptom: |
      When `from {pkg}.{pkg}_to_{tgt} import fn` is used in a dogfood module,
      it overwrites the `{pkg}.{pkg}_to_{tgt}` attribute on the package object
      with the module itself, breaking `importlib.import_module("{pkg}").{pkg}_to_{tgt}(path)`
      tests. Confirmed in SYLK (sylk_to_csv) and DIF (dif_to_csv).
    evidence:
      - "MEMORY.md Dogfood Export Namespace Conflict Pattern (2026-07-11)"
      - "sylk_to_csv and dif_to_csv confirmed affected"
      - "Risk extends to ODS and GNUMERIC (same-named functions)"
    first_failing_boundary: "Dogfood import test using importlib.import_module"
    root_cause: |
      Python module import system: importing a submodule overwrites the package
      attribute of the same name. Fix: use repo-rooted namespace
      `from src.python.{pkg}.{pkg}_to_{tgt} import fn` to avoid package attribute overwrite.
    blast_radius: |
      Any format with both a `{pkg}_to_{tgt}` function and a same-named dogfood module.
      Confirmed: SYLK, DIF. Risk: ODS, GNUMERIC.
    current_risk: "MEDIUM — breaks dogfood tests using importlib.import_module pattern"
    permanent_solution: |
      Use `from src.python.{pkg}.{pkg}_to_{tgt} import fn` (repo-rooted namespace)
      instead of `from {pkg}.{pkg}_to_{tgt} import fn` in dogfood modules.
    machinery_repair_required: false
    output_backfill_required: false
    verification:
      - "Dogfood export tests pass for SYLK after fix ✓"
      - "Dogfood export tests pass for DIF after fix ✓"
    negative_controls: []
    regression_tests: ["tests/python/sylk/test_dogfood.py", "tests/python/dif/test_dogfood.py"]
    pilot_required: false
    dependencies: []
    taskcard_ids: []
    status: "DOCUMENTED_IN_MEMORY"
    exact_next_action: "No immediate action. Apply fix when adding new dogfood modules for affected formats."

