    enforcement: Documented; no mechanical enforcement needed.

  - id: BP-GOV-003
    name: validator-exception-degradation
    stage: S10
    description: >
      When a governance validator module fails to import or its function raises an
      unhandled exception, the validator falls back to WARN with blocks_sprint=False.
      This prevents one validator failure from blocking an entire sprint cycle.
    mechanism: Per-validator try/except in governance_validator_runner.py; _skipped_validators list
    classification: ARCHITECTURAL_PATTERN
    risk: MEDIUM — a broken validator is silently skipped
    enforcement: _skipped_validators is included in cycle output; visible to agent.
    finding: >
      V119, V120, V125 etc. each have individual try/except blocks that degrade to WARN.
      The outer V111 block exception at line 755 adds a bulk skip entry for V111-V127.
      No silent masking — all skips are recorded.

  - id: BP-GOV-004
    name: shadow-routing-suppression
    stage: S10
    description: >
      Validators listed in .supervisor/validator-shadow-registry.yaml have their
      blocks_sprint flag set to False by _apply_shadow_routing(). This allows
      tracking a failing validator without blocking the sprint.
    mechanism: _apply_shadow_routing() in governance_validator_runner.py
    classification: CANARY_SHADOW_CONTROL
