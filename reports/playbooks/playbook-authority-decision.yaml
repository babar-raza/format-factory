# ─────────────────────────────────────────────────────────
# AUTHORITY BOUNDARY SUMMARY
# ─────────────────────────────────────────────────────────
authority_boundaries:
  what_playbooks_may_do:
    - Standardize recurring task decomposition
    - Define required checks and validation
    - Define evidence expectations
    - Define rollback procedures
    - Encode known failure modes
    - Generate bounded taskcards with provenance (via generate_playbook_taskcards.py)
    - Select applicable execution template for work item type (via playbook_selector.py)

  what_playbooks_may_not_do:
    - Create product requirements without source authority
    - Override plans or taskcards
    - Approve gates (any gate, any format)
    - Mark work complete
    - Replace evidence contracts
    - Replace DEC-034 independent verification
    - Replace human approval for Gate 11 execution
    - Substitute for master-plan.md authority
    - Encode one-off workaround noise as reusable lessons

  forbidden_at_all_times:
    - Using "playbook" terminology to describe Sprint Task Templates in new documentation
    - Creating per-format acquisition playbooks without separate sprint authorization
    - Calling templates "execution authority"
    - Treating playbook validation PASS as gate approval
