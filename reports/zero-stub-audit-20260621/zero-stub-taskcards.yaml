  - task_id: TC-ZS-003
    stable_semantic_key: heal_xcf_layer_name_list
    mission_id: ZERO-STUB-AUDIT-20260621
    finding_ids: [STUB-PY-XCF-LAYER-NAMES-001]
    root_cause_ids: [RC-PARTIAL-IMPLEMENTATION-XCF]
    product_ids: [xcf]
    title: "Heal xcf_layer_name_list — implement real layer name parsing or document exclusion"
    lane: Lane-7 Python Product Healing
    owner: Agent (via add-python-api skill)
    reviewer: Supervisor
    status: DISCOVERED
    objective: |
      Resolve the INCOMPLETE_IMPLEMENTATION for xcf_layer_name_list.
      The function returns synthetic ["Layer 0", "Layer 1", ...] instead of real XCF layer names.
    preferred_healing_path: |
      Path A: Extend XcfImage to include layer_names: list[str].
      In _parse_layer_offsets, navigate each layer pointer, read the layer name string
      (NUL-terminated, at fixed offset in layer record).
      Update xcf_layer_name_list to return img.layer_names.
    fallback_healing_path: |
      Path B: Add GAP-ledger entry GAP-XCF-LAYER-NAMES.
      Rename xcf_layer_name_list to xcf_layer_synthetic_names_list with explicit doc.
      Add xcf_layer_names_parsed = None as explicit capability exclusion.
    allowed_paths:
      - src/python/xcf/xcf_parser.py
      - tests/python/xcf/ (new test file)
    required_skill: add-python-api (or add-python-object-model-feature)
    closeout_rules:
      - "xcf_layer_name_list returns real parsed names OR is renamed with explicit exclusion documented"
      - "Test passes with known XCF file asserting real layer name (not 'Layer 0')"

