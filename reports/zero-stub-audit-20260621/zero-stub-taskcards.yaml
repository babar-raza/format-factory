  - task_id: TC-ZS-001
    stable_semantic_key: validate_architecture_only_stub_gate_V48
    mission_id: ZERO-STUB-AUDIT-20260621
    finding_ids: [GOV-ESCAPE-NO-STUB-GATE-001]
    root_cause_ids: [RC-GOV-NO-STUB-GATE, RC-GENERATOR-ARCH-ONLY]
    product_ids: [fodt, fods, fodt-net, fods-net]
    title: "Implement V48 — validate_architecture_only_stub_gate governance validator"
    lane: Lane-3 Governance
    owner: Agent (tools/supervisor/governance_validators.py)
    reviewer: Supervisor
    status: DISCOVERED
    objective: |
      Add a blocking governance validator that prevents RELEASE_GATE and Gate 11
      work items from citing architecture_only stub files as behavioral evidence.
    observed_incomplete_behavior: |
      No validator exists. An agent could declare a RELEASE_GATE item with
      evidence_paths=[architecture_only_stub.py] and the sprint would not be blocked.
    expected_complete_behavior: |
      When a RELEASE_GATE or Gate 11 item cites a file whose content contains
      "GENERATED — architecture_only" or "architecture_only" marker, the validator
      returns result=FAIL, blocks_sprint=True, with a descriptive error.
      For PRODUCT_SOURCE items (non-gate), it returns WARN/blocks_sprint=False.
    allowed_paths:
      - tools/supervisor/governance_validators.py
      - tests/supervisor/test_governance_validators.py
    forbidden_paths:
      - src/ (no product source changes)
    dependencies: []
    machinery_repair: |
      Add function `validate_architecture_only_stub_gate(declaration, repo_root=None)` to
      governance_validators.py after line 3005.
      Register in run_all_governance_validators() as V48.
    expected_outputs:
      - "V48 validator function in governance_validators.py"
      - "Tests for V48 in test_governance_validators.py (negative control + positive pass)"
    focused_verification:
      - "Negative control: declare RELEASE_GATE with evidence_path=architecture_only file → blocked"
      - "Positive pass: declare RELEASE_GATE with evidence_path=real implementation file → passes"
    negative_controls:
      - fixture: RELEASE_GATE item with architecture_only evidence
        expected: FAIL, blocks_sprint=True
      - fixture: PRODUCT_SOURCE item with architecture_only evidence
        expected: WARN, blocks_sprint=False
    closeout_rules:
      - "V48 blocks_sprint=True for RELEASE_GATE items citing architecture_only files"
      - "V48 WARN (non-blocking) for PRODUCT_SOURCE items"
      - "At least 2 tests pass in test_governance_validators.py"

