  - task_id: TC-ZS-004
    stable_semantic_key: wire_fods_compat_facades
    mission_id: ZERO-STUB-AUDIT-20260621
    finding_ids: [STUB-PY-FODS-COMPAT-CELL-001, STUB-PY-FODS-COMPAT-SHEET-001, STUB-PY-FODS-COMPAT-DOC-001]
    root_cause_ids: [RC-COMPAT-EMPTY-FACADES]
    product_ids: [fods]
    title: "Wire FODS Compat facades to models.py or document as architecture markers"
    lane: Lane-7 Python Product Healing
    owner: Agent
    reviewer: Supervisor
    status: DISCOVERED
    objective: |
      Resolve the naming collision: FodsDocument/FodsSheet/FodsCell exist in both
      fods/models.py (real implementations) and fods/Compat/ (empty facades).
      Either wire Compat to models or document Compat as architecture-only markers.
    preferred_healing_path: |
      Option A: Make Compat facades delegate to models:
        In FodsCell, add __init__ and all properties from models.FodsCell.
        In FodsSheet, add __init__ and all methods from models.FodsSheet.
        In FodsDocument, add __init__ and all methods from models.FodsDocument.
      Option B: Rename Compat classes to SpecFodsCell etc. to avoid confusion
      Option C: Add explicit docstring "THIS IS AN ARCHITECTURE MARKER — use fods.models.FodsCell"
    allowed_paths:
      - src/python/fods/Compat/fods_cell.py
      - src/python/fods/Compat/fods_sheet.py
      - src/python/fods/Compat/fods_document.py
    closeout_rules:
      - "Compat facades either have working methods OR have explicit architecture-marker documentation"
      - "No naming collision misled by identical class names with different behaviors"

