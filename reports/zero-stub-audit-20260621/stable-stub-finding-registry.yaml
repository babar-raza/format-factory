      STUB-DOTNET-FODT-SPEC-LIST-001,
      STUB-DOTNET-FODT-SPEC-LIST-ITEM-001,
      STUB-DOTNET-FODT-SPEC-TABLE-ROW-001,
      STUB-DOTNET-FODT-SPEC-TABLE-001,
      STUB-DOTNET-FODT-SPEC-TABLE-CELL-001,
      STUB-DOTNET-FODS-SPEC-DOC-001,
      STUB-DOTNET-FODS-SPEC-TABLE-CELL-001,
      STUB-DOTNET-FODS-SPEC-TABLE-001,
      STUB-DOTNET-FODS-SPEC-TABLE-ROW-001,
    ]
    first_failing_boundary: generate_canonical_stubs.py → spec/ directories
    producer: tools/spec/generate_canonical_stubs.py
    producer_path: tools/spec/generate_canonical_stubs.py
    generated_pattern: |
      Python: "# GENERATED — architecture_only. ... class X:\n    spec_qname = ...\n    # TODO:"
      .NET: "// GENERATED — architecture_only. ... public static class X { public const string QName = ...; // TODO: }"
    immediate_cause: Generator intentionally creates skeleton stubs as spec-parity markers.
    structural_cause: |
      No enforcement gate prevents architecture_only stubs from being cited as
      behavioral proof in declarations or capability claims.
    governance_escape: |
      V44 is permanently WARN-only (never inspects any file).
      No validator checks if RELEASE_GATE items cite architecture_only files as evidence.
    validator_gap: |
      validate_facade_delegates_to_spec (V44): always returns WARN/PASS with empty items.
      validate_skeleton_progress: only checks LOC < 10, misses attribute-only classes.
      validate_no_stub_tests: only checks is_not_None/isinstance, misses spec_qname assertions.
    test_gap: |
      test_spec_qname_stubs.py tests only assert spec_qname attribute value,
      never test behavioral methods. No negative controls exist.
    task_state_gap: |
      architecture_only stubs can be marked architecture_only in qname-registry without
      any required action plan or transition deadline.
    why_previous_audits_missed_it: |
      architecture_only marker is intentional — audits classified these as
      "expected intermediate state" without checking for downstream bypass.
    recurrence_path: |
      Any call to generate_canonical_stubs.py will produce new architecture_only stubs.
      Without a blocking gate, they can persist indefinitely.
    machinery_fix: |
      1. Implement validate_architecture_only_stub_gate validator:
         - scan evidence_paths for files containing "architecture_only" marker
         - FAIL (blocks_sprint=True) when RELEASE_GATE or Gate 11 items cite them
      2. Fix V44 to actually inspect imports
      3. Fix V36/validate_skeleton_progress to catch spec_qname-only assertions
    product_healing_required: true
    prevention_proof: |
      After V48 (architecture_only_stub_gate) is implemented:
      - Negative control: declare RELEASE_GATE with evidence_path=architecture_only stub
      - Expected: validator blocks sprint
      - Negative control: declare PRODUCT_SOURCE with evidence_path=architecture_only stub
      - Expected: WARN (non-blocking) for non-gate items

  - root_cause_id: RC-COMPAT-EMPTY-FACADES
    affected_findings: [
      STUB-PY-FODS-COMPAT-CELL-001,
      STUB-PY-FODS-COMPAT-SHEET-001,
      STUB-PY-FODS-COMPAT-DOC-001,
    ]
    first_failing_boundary: fods/Compat/ layer creation (TC-MACH-ARCH-004)
    producer: TC-MACH-ARCH-004 sprint worker
    immediate_cause: |
      Facades created to satisfy Gate 11 P-ARCH-001 (architecture criterion).
      They inherit from spec-only classes that have no behavior.
      Real production implementations (FodsCell, FodsSheet, FodsDocument) already exist in models.py.
    structural_cause: |
      Compat/ layer was created as an architectural artifact for Gate 11 but
      was not wired to the actual model implementations.
    governance_escape: V44 always passes; no test verifies Compat/ facades actually work.
    product_healing_required: false
    prevention_proof: |
      The REAL implementations exist in models.py and are fully functional.
      The Compat facades just need to either (a) delegate to models.py or (b) be documented
      as architecture markers only (not production facades).

  - root_cause_id: RC-PARTIAL-IMPLEMENTATION-XCF
    affected_findings: [STUB-PY-XCF-LAYER-NAMES-001]
    first_failing_boundary: xcf_parser.py XcfImage struct definition
    producer: xcf_parser.py implementer
    immediate_cause: |
      XCF layer records contain layer names, but the parser only reads
      the layer pointer table (num_layers) from the XCF header.
      Full layer record parsing was deferred.
    structural_cause: |
      No requirement trace: xcf_layer_name_list was added without a GAP-ledger entry
      documenting that actual layer name parsing was deferred.
    governance_escape: |
      No validator checks that function return values match documented contracts.
      The docstring honestly says "placeholder names" but the function name implies real names.
    product_healing_required: true
    prevention_proof: |
      Test xcf_layer_name_list with a known XCF file and assert returned names
      match actual XCF layer names (not synthetic "Layer N" values).

  - root_cause_id: RC-GOV-WEAK-VALIDATORS
    affected_findings: [GOV-ESCAPE-V44-ALWAYS-WARN-001, GOV-ESCAPE-V36-WARN-ONLY-001]
    immediate_cause: |
      V44 was written as a monitoring stub only — the function body is a constant return.
      V36 catches only is_not_None/isinstance assertions, missing spec_qname-only tests.
    structural_cause: |
      "Monitoring mode" validators were created without a scheduled graduation to enforcement.
      No deadline or trigger condition causes them to become blocking.
    product_healing_required: false
    prevention_proof: |
      After implementing real V44: negative control with compat.py importing
      architecture_only class should cause V44 to FAIL.

  - root_cause_id: RC-GOV-NO-STUB-GATE
    affected_findings: [GOV-ESCAPE-NO-STUB-GATE-001]
    immediate_cause: |
      No validator exists that specifically blocks capability/Gate 11 closure
      when evidence cites architecture_only stub files.
    structural_cause: |
      The zero-stub governance standard was never codified as a blocking gate in the
      governance validator suite.
    product_healing_required: false
    prevention_proof: |
      After implementing V48 (architecture_only_stub_gate):
      - Negative control: RELEASE_GATE item with architecture_only evidence → blocked.

