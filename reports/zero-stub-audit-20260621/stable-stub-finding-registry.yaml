  - root_cause_id: RC-GENERATOR-ARCH-ONLY
    affected_findings: [
      STUB-PY-FODT-SPEC-TABLE-CELL-001,
      STUB-PY-FODT-SPEC-TABLE-ROW-001,
      STUB-PY-FODT-SPEC-TABLE-TABLE-001,
