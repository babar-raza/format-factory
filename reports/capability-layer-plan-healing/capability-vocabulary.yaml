# Capability & Feature Understanding Layer — Normalized Vocabulary
# Sprint: FORMAT-FACTORY-CAPABILITY-FEATURE-UNDERSTANDING-LAYER-INVESTIGATIVE-HEALING-001
# Generated: 2026-06-08

schema_version: "1.0"

terms:

  format:
    canonical: format
    aliases: [file-format, file format, format_id, format_key]
    definition: "A specific file format identified by extension and MIME type (e.g., FODS, FODG, ABW)"
    examples: [FODS, FODT, FODG, ABW, Gnumeric, TSV, NDJSON, ZST, SYLK, DIF, Netpbm]

  format_family:
    canonical: format_family
    aliases: [product family, format family, file family]
    definition: "A group of related formats sharing a common origin or structure (e.g., ODF flat family, Netpbm family)"
    examples: [odf_flat, netpbm, spreadsheet_text, compression, document_text]

  product_target:
    canonical: product_target
    aliases: [product profile, target product, product type, track]
    definition: "The specific product track for which a capability is being described"
    values:
      - commercial: ".NET commercial product (Tier 0-6, FODS/FODT/Netpbm)"
      - foss_reduced: "Python FOSS product (Tier 0-4, reduced scope)"
      - internal: "Internal tooling, not for release"

  commercial_product:
    canonical: commercial_product
    aliases: [dotnet, enterprise, paid, commercial, commercial_net]
    definition: "The .NET commercial product track. Formats: FODS, FODT, Netpbm. Gate 11 required."

  foss_product:
    canonical: foss_reduced_product
    aliases: [foss, foss_reduced, reduced, open-source, python-foss]
    definition: "The Python FOSS product track with reduced scope. Formats: ZST, Netpbm-py, SYLK, ABW, Gnumeric, FODG, TSV, NDJSON, DIF, QOI."

  capability:
    canonical: capability
    aliases: [feature, operation, function, api_function, api_symbol]
    definition: "A specific named operation that a product can perform (e.g., load, write, export_to_csv)"
    note: "In code: a public function or method. In matrix: a named operation category."

  capability_category:
    canonical: capability_category
    aliases: [operation_kind, capability_type]
    values:
      - probe: "Format detection without full parse"
      - load: "Parse file into in-memory model"
      - inspect: "Read model properties (count, metadata)"
      - edit: "Modify model in memory"
      - save: "Write model back to same format (round-trip)"
      - export: "Convert to a different format"
      - import: "Accept input from another format"
      - validate: "Validate file against spec/schema"
      - dogfood: "Use another FF library as the export target"
      - package: "Package the library for distribution"

  requirement:
    canonical: requirement
    aliases: [spec fact, spec requirement, product requirement, implementation requirement]
    definition: "A product behavior that is derived from spec authority, product goals, or gate decisions"

  authority_source:
    canonical: authority_source
    aliases: [spec authority, requirement authority, authority, provenance_source]
    definition: "The authoritative source for a requirement or capability claim"
    values:
      - spec_fact: "Backed by a confirmed spec fact in the FUL verified-facts.yaml"
      - schema_authority: "Backed by a formal schema (XSD/DTD/RelaxNG)"
      - gate_evidence: "Backed by a passed gate decision"
      - product_goal: "From plans/master-plan.md or plans/ product goals"
      - human_approval: "Explicitly approved by a human (gate or Babar Raza)"
      - ai_draft: "Generated by AI — NOT authoritative"

  implementation_proof:
    canonical: implementation_proof
    aliases: [source proof, source evidence, implementation evidence]
    definition: "Evidence that a capability is implemented in source code"
    requires: ["source file path", "function name", "file exists"]

  test_proof:
    canonical: test_proof
    aliases: [test evidence, test verification, test backing]
    definition: "Evidence that a capability is tested and passes"
    requires: ["test file path", "test function name", "passing test log"]

  example_proof:
    canonical: example_proof
    aliases: [sample output, example evidence, dogfood output]
    definition: "An example or sample output demonstrating the capability"

  package_proof:
    canonical: package_proof
    aliases: [package artifact, install proof, package evidence]
    definition: "Evidence that the package can be built and installed"

  readiness:
    canonical: readiness
    aliases: [POC readiness, release readiness, product readiness]
    definition: "The degree to which a format/capability is ready for POC or release"
    levels:
      - poc_candidate: "POC-ready with verified source, tests, examples"
      - commercial_ready: "Gate 11 approved, all proofs present"
      - foss_ready: "Gates 1-10 passed, package proven"
      - partial: "Implementation exists but tests or examples missing"
      - not_ready: "Missing implementation or tests"

  pilot:
    canonical: pilot
    aliases: [pilot run, capability pilot, verification pilot]
    definition: "A structured test run of the capability layer for a specific format"

  taskcard:
    canonical: taskcard
    aliases: [task card, work item, TC, CAP-]
    definition: "A bounded, trackable unit of work with acceptance criteria"

  gap:
    canonical: capability_gap
    aliases: [missing capability, unimplemented capability, missing feature]
    definition: "A capability that is expected or desired but not yet implemented or verified"

  blocker:
    canonical: blocker
    aliases: [hard blocker, blocking issue, blocking constraint]
    definition: "A constraint that prevents a capability from being implemented or verified"
    subtypes:
      - external_gate: "Requires gate approval (Gate 11, human)"
      - missing_spec: "No spec authority available"
      - dependency: "Depends on another capability or tool"

  limitation:
    canonical: limitation
    aliases: [soft blocker, caveat, constraint]
    definition: "A known constraint that reduces capability scope without fully blocking it"

  ai_draft:
    canonical: ai_draft
    aliases: [LLM draft, AI generated, AI output, machine generated]
    definition: "A capability claim or fact generated by an AI/LLM — not independently verified"
    rule: "ai_draft CANNOT be treated as verified. Must be promoted through independent verification."

  verified:
    canonical: verified
    aliases: [proof-backed, evidence-backed, confirmed]
    definition: "A capability state confirmed by independent evidence (source + test + example/package)"

  inferred_unverified:
    canonical: inferred_unverified
    aliases: [assumed, inferred, probable, likely]
    definition: "A capability inferred from patterns or incomplete evidence — not independently verified"

  unsupported:
    canonical: unsupported
    aliases: [not supported, explicitly not supported]
    definition: "A capability explicitly declared as not part of this product's scope"

  future:
    canonical: future
    aliases: [deferred, planned for later, backlog]
    definition: "A capability intentionally deferred to a future sprint or release"
