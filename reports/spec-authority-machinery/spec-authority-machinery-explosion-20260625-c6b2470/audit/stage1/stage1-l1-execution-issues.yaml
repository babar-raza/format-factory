  - issue_id: IS-L1-003
    title: FODT P6 vs STALE Contradiction in Raw Logs
    description: >
      authority-gate-per-format.json reports FODT=P6 (product_expansion=true).
      refresh-check.txt reports fodt/1.3 as STALE (missing_file). This is a contradiction:
      FODT cannot be both P6 (verified facts in production) and have a missing spec file.
      Investigation authority-debt-ledger.json AD-003 notes this but the format-authority-matrix
      still lists FODT at P6 without qualifying the contradiction prominently.
    evidence: raw-logs/authority-gate-per-format.json fodt.level=P6; raw-logs/refresh-check.txt fodt/1.3 STALE(missing_file)
    missing_evidence: How authority_gate_validation.py computed P6 for FODT despite stale spec
    root_cause: authority_gate_validation.py uses cached P-level from spec-index.yaml, not refresh_check status
    why_not_only_symptom: FODT P6 overclaim could influence product expansion decisions
    affected_files:
      - reports/spec-authority-machinery/.../format-authority-matrix.json
      - .local/spec-cache/fodt/
    affected_components: [authority_gate_validation, format_authority_matrix]
    severity: MEDIUM
    blocker: false
    recurrence_risk: MEDIUM
    required_fix_type: clarify_in_matrix
    requires_plan_update: false
    requires_taskcard: false
    requires_system_healing: false
    requires_reexecution: false
    requires_governance_change: false
    requires_evidence_repair: true
    recommended_next_stage: PROMPT3_EXECUTE
    acceptance_impact: FODT P6 should be qualified as "claimed P6 / spec cache stale"
