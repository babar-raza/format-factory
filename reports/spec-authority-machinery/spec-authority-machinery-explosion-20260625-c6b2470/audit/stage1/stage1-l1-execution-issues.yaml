    title: BP-002 Investigation Claim is Inaccurate — V13 Already Blocks Absent spec_fact_refs
    description: >
      The investigation (machinery-bypass-ledger.json BP-002) claims V13 only fires when
      spec_fact_refs is PROVIDED AND INVALID. Code inspection + live test prove this is WRONG.
      validate_spec_fact_refs.py check_item() fires HARD BLOCK (compliant=False) when
      spec_fact_refs is absent AND no exception_classification at item level.
      The actual bypass is: exception_classification=legacy_backfill at item level allows PASS.
      BP-002 severity was listed as CRITICAL; actual severity is MODERATE (designed exception bypass).
    evidence: >
      Live test: check_item({'item_type':'PRODUCT_SOURCE','gap_ledger_ref':'GAP-TEST-001'}) →
      compliant=False, violation="has empty spec_fact_refs and no exception_classification. BLOCKING."
    missing_evidence: null
    root_cause: Investigation performed code-path analysis without live execution verification
    why_not_only_symptom: Overclaiming bypass severity damages Phase A priority ordering
    affected_files:
