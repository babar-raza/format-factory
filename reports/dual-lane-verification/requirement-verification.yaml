# ─── Systemic Findings ───

systemic_findings:

  - finding_id: FIND-V01-001
    severity: P1_SYSTEMIC
    category: DEAD_CONFIGURATION
    title: "policies.yaml dual_lane_deepening section is dead config"
    description: >
      .supervisor/policies.yaml Section 10 (dual_lane_deepening) defines format classifications,
      execution modes, starvation thresholds, and DOM maturity scales. ZERO Python code in
      src/python/ or tools/supervisor/ reads this section. The configuration is completely
      disconnected from runtime behavior.
    affected_requirements: [REQ-DL-003]
    repair_path: "TC-DL2-001 (Lane Selector) must read policies.yaml for defaults"

  - finding_id: FIND-V01-002
    severity: P1_SYSTEMIC
    category: MISSING_ENFORCEMENT
    title: "update_lane_counters() has no ceiling enforcement"
    description: >
      tools/supervisor/autonomous_cycle_extensions.py update_lane_counters() (lines 994-1033)
      increments lane counters unconditionally. When lane_b_maturity >= lane_b_ceiling,
      counters still increment, producing false starvation warnings for lanes that are
      already complete.
    affected_requirements: [REQ-DL-013]
    repair_path: "TC-DL2-003 (Starvation Prevention) must add ceiling check before increment"

  - finding_id: FIND-V01-003
    severity: P1_SYSTEMIC
    category: MISSING_SAFETY
    title: "update_lane_counters() has no replay detection"
    description: >
      Calling update_lane_counters() twice with the same sprint_id will double-increment
      counters. No idempotency guard exists.
    affected_requirements: [REQ-DL-013]
    repair_path: "TC-DL2-019 (Lane Counter Replay-Safety) must add replay guard"

  - finding_id: FIND-V01-004
    severity: P2_OPERATIONAL
    category: MISSING_INTEGRATION
    title: "check_continuation.py has zero lane-related checks"
    description: >
      tools/supervisor/check_continuation.py performs 9 checks but has no lane balance
      or starvation awareness. Lane imbalance does not influence continuation decisions.
    affected_requirements: [REQ-DL-003, REQ-DL-006]
    repair_path: "TC-DL2-006 (Check-Continuation Advisory Lane Gate) adds Check 10"

