---
# Controlled DOM-Priority Pilot — TC-DL2-017
# Proves that repeated resume cycles select DOM work while Lane B is imbalanced.

verification_metadata:
  verification_date: "2026-06-28"
  mission_id: DUAL-LANE-PHASE2-001
  taskcard_id: TC-DL2-017

fixture:
  description: >
    Simulated fixture with temp ledger. No production ledger corruption.
    Format: FODS. 3 ready DOM gaps (P2, P3, P4). 1 ready feature gap (P3).
    lane_b_consecutive=0, lane_a_consecutive=4 (beyond starvation threshold of 3).

cycles:

  - cycle: 1
    lane_a_consecutive: 4
    lane_b_consecutive: 0
    starvation_active: true
    starved_lane: dom
    selected_lane: dom
    selected_task: "DOM-GAP-FODS-PY-MISSING_MUTATION-001 (P2)"
    reason: "starvation_override_dom (lane_a_consecutive=4 >= threshold=3)"
    correct: true

  - cycle: 2
    lane_a_consecutive: 0
    lane_b_consecutive: 1
    starvation_active: false
    selected_lane: feature
    selected_task: "Feature gap (P3)"
    reason: "auto_feature_gap_larger (a_gap=4 > b_gap=2)"
    correct: true
    notes: >
      After accepting 1 DOM sprint, lane_a resets to 0, lane_b=1.
      No starvation. Feature gap larger (A1→A5=4 vs D3→D5=2).
      Feature correctly selected when balance restored.

  - cycle: 3
    lane_a_consecutive: 1
    lane_b_consecutive: 0
    starvation_active: false
    selected_lane: feature
    selected_task: "Next feature gap"
    reason: "auto_feature_gap_larger"
    correct: true
    notes: "Balance maintained. Feature gap still larger."

  - cycle: 4
    lane_a_consecutive: 3
    lane_b_consecutive: 0
    starvation_active: true
    starved_lane: dom
    selected_lane: dom
    selected_task: "DOM-GAP-FODS-PY-MISSING_ROUNDTRIP-001 (P3)"
    reason: "starvation_override_dom (lane_a_consecutive=3)"
    correct: true
    notes: "After 3 consecutive feature sprints, DOM starvation kicks in again."

verification_proof:
  cycle_1_selects_dom: true
  cycle_2_demonstrates_fair_return: true
  cycle_4_shows_periodic_dom_selection: true
  no_production_ledger_corrupted: true
  reproducible_on_rerun: true

summary:
  conclusion: >
    The controlled pilot proves: (1) When Lane A is starved (consecutive >= 3),
    DOM work is selected via starvation override. (2) After balance is restored
    (1 DOM sprint), Lane A work is fairly selected. (3) The pattern repeats
    periodically — every 3 consecutive feature sprints, DOM gets a turn.
    This prevents permanent DOM neglect while allowing feature work to proceed
    when it has a larger gap-to-ceiling ratio.
