# ─── P1 Finding ───

findings:

  - finding_id: FIND-V03-001
    severity: P1_SYSTEMIC
    category: DOM_GAPS_NOT_IN_CANONICAL_LEDGER
    title: "21 material Python DOM gaps missing from all canonical gap ledgers"
    description: >
      The canonical gap-ledger.json has 0 DOM maturity boundary gaps for Python.
      From source-truth recomputation, 21 material DOM gaps exist across 8 FULL-applicability
      Python formats. These gaps represent the work needed to reach each format's DOM ceiling.
      None are tracked, none have taskcards, and the lane selector has no awareness of them.
    affected_formats: [fods, fodt, ods, odt, abw, fodg, fodp, gnumeric]
    repair_path: "TC-DL2-V04 must add these to canonical ledger with stable IDs"

  - finding_id: FIND-V03-002
    severity: P2_OPERATIONAL
    category: LEDGER_UNDERCLAIM
    title: "3 formats have ledger maturity lower than source-verified actual"
    description: >
      FODT claimed D2 but has D3 features. ODS claimed D2 but has D3 features.
      ODT claimed D1 but has D2 features. These are conservative underclaims (safe)
      but the ledger should be corrected to reflect actual maturity.
    affected_formats: [fodt, ods, odt]
    repair_path: "TC-DL2-V04 should update ledger maturity for these 3 formats"

summary:
  conclusion: >
    21 material Python DOM gaps are missing from all canonical ledgers. This is the core
    finding of the verification — the dual-lane system has no DOM work to select because
    the gaps were never logged. The lane selector, compiler, and resume pipeline cannot
    select DOM work that does not exist in the gap ledger. TC-DL2-V04 must add these gaps
    and TC-DL2-001+ must build machinery to select them.
