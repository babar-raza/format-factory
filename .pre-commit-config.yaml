repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: local
    hooks:
      - id: source-structure-baseline-check
        name: Architecture baseline growth check
        entry: python tools/validators/source_structure_validator.py --check-baseline-growth
        language: system
        pass_filenames: false
        always_run: false
        files: ^src/(python|net)/
        stages: [pre-commit]
      - id: validate-source-architecture
        name: Validate source architecture (anti-monolith)
        entry: python tools/validators/validate_source_architecture.py --check-new-files
        language: system
        pass_filenames: false
        always_run: false
        files: ^src/python/
        stages: [pre-commit]
      - id: capability-registry-drift-check
        name: Capability registry drift check
        entry: python tools/capability_sync/detect_drift.py
        language: system
        pass_filenames: false
        always_run: false
        files: ^(\.supervisor/skill-registry\.yaml|\.claude/commands/command-registry\.yaml|\.supervisor/capability-routing-registry\.yaml|\.claude/commands/.*\.md|\.governance/capabilities/.*)$
        stages: [pre-commit]
      - id: project-status-structure-check
        name: Check PROJECT_STATUS.md structure
        entry: python tools/docs/generate_project_status.py --validate
        language: system
        pass_filenames: false
        always_run: false
        files: >
          (?x)^(
            registry/format-registry\.yaml|
            \.governance/capabilities/registry\.yaml|
            \.supervisor/skill-registry\.yaml|
            oracle/formats/.*/reports/oracle-run-summary\.json|
            reports/certification/portfolio-certification-matrix\.json|
            reports/supervisor/maturity-trend\.json|
            tools/supervisor/governance_validators.*\.py|
            \.supervisor/policies\.yaml
          )$
        stages: [pre-commit]
