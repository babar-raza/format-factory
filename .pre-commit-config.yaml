repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: local
    hooks:
      - id: source-structure-baseline-check
        name: Architecture baseline growth check
        entry: python tools/validators/source_structure_validator.py --check-baseline-growth
        language: system
        pass_filenames: false
        always_run: false
        files: ^src/(python|net)/
        stages: [pre-commit]
      - id: validate-source-architecture
        name: Validate source architecture (anti-monolith)
        entry: python tools/validators/validate_source_architecture.py --check-new-files
        language: system
        pass_filenames: false
        always_run: false
        files: ^src/python/
        stages: [pre-commit]
