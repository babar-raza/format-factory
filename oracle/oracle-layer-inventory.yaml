# ==============================================================================
# PART 3: TARGET ARCHITECTURE
# ==============================================================================

target_architecture:
  canonical_root: oracle/
  schemas: oracle/schema/
  registry: oracle/registry/
  per_format: oracle/formats/<format_id>/
  shared: oracle/shared/
  reports: oracle/reports/
  corpus_root: samples/by-format/  # SEPARATE — oracle references corpus, does not own it

  key_design_decisions:
    - id: D001
      decision: "Oracle layer references corpus (samples/by-format/) but does not own it"
      rationale: "Corpus ownership stays in samples/ with existing policy and provenance"
    - id: D002
      decision: "Acquisition oracle (LibreOffice/Gate 6) is retained separately from product oracle"
      rationale: "They serve different purposes. Acquisition oracle = 'does LibreOffice agree?'. Product oracle = 'does product implement the spec?'"
    - id: D003
      decision: "Authority classification required on every oracle case expected value"
      rationale: "Core non-negotiable oracle principle (§9 of mission spec)"
    - id: D004
      decision: "Family comparators live in oracle/shared/comparators/, parameterized per format"
      rationale: "Avoid duplicating comparison logic per format"
    - id: D005
      decision: "Oracle verdicts are local-only (.local/oracle/) — only sanitized reports committed"
      rationale: "Consistent with existing Gate 6 oracle local-output policy"
