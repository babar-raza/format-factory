  specification_refs:
    - id: RFC-8878
      title: "Zstandard Compression and the application/zstd Media Type"
      body: IETF
      url: "https://www.rfc-editor.org/rfc/rfc8878"
      legal_category: 1
      authority_class: SPEC_NORMATIVE
    - id: ZSTD-SPEC-INTERNAL
      title: "Zstandard Compression Format (internal spec document)"
      body: Meta Platforms / phoboslab
      url: "https://github.com/facebook/zstd/blob/dev/doc/zstd_compression_format.md"
      authority_class: SPEC_INFORMATIVE
  authorized_fact_refs:  # TC-LA-001: 94 ZST SAL facts in sal-facts-latest.json
    - "FACT-ZST-001"
    - "FACT-ZST-002"
    - "FACT-ZST-003"
  authority_summary: >
    RFC 8878 is normative (IETF, royalty-free). The Zstandard compression format
    is fully specified in the RFC. Decompression behavior is deterministic:
    any conforming decompressor must produce byte-identical output from the same input.
    Test corpus from facebook/zstd (BSD-3-Clause) provides authoritative reference vectors.

