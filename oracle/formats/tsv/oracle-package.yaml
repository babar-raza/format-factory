    Canonical form is a list of lists of strings, with the tab delimiter stripped.
    Header row normalized to list of strings. Whitespace in field values preserved.
  ordering_policy: "row order preserved"
  whitespace_policy: "field values preserved; trailing newline ignored"
  encoding_policy: "UTF-8 (or system default)"

