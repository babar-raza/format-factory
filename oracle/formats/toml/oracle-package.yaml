      - PARSE_VALIDITY

  - case_id: toml-valid-002
    purpose: "TOML key count matches Python stdlib tomllib.loads()"
    authority_class: ACCEPTED_EMPIRICAL_EVIDENCE
    authority_refs:
      - "PYTHON-TOMLLIB-STDLIB -- len(tomllib.loads(content))"
    sample_ref: samples/by-format/toml/minimal.toml
    input_hash: "sha256:93511a72e50a7d58b814f45f3834b9ab0b9ca8d9e1958410895e66767abf2491"
    expected_parse_result: SUCCESS
    expected_model_properties:
      - property: key_count
        value: 5
        authority: PYTHON-TOMLLIB-STDLIB
        derivation: "len(tomllib.loads(content)) == 5 (title, version, enabled, server, database)"
    applicable_profiles:
      - PARSE_VALIDITY
      - DOMAIN_MODEL_MAPPING

  - case_id: toml-valid-003
    purpose: "TomlDocument.from_file() returns spec_qname=toml:table"
    authority_class: ACCEPTED_EMPIRICAL_EVIDENCE
    authority_refs:
      - "shared/qname-registry/toml.yaml -- toml:table entry"
    sample_ref: samples/by-format/toml/minimal.toml
    input_hash: "sha256:93511a72e50a7d58b814f45f3834b9ab0b9ca8d9e1958410895e66767abf2491"
    expected_parse_result: SUCCESS
    expected_model_properties:
      - property: spec_qname
        value: "toml:table"
        authority: TOML-SPEC-V1
    applicable_profiles:
      - DOMAIN_MODEL_MAPPING

  - case_id: toml-valid-004
    purpose: "Write+reload TOML preserves key count (roundtrip)"
    authority_class: ACCEPTED_EMPIRICAL_EVIDENCE
    authority_refs:
      - "PYTHON-TOMLLIB-STDLIB -- tomllib roundtrip"
    sample_ref: samples/by-format/toml/minimal.toml
    input_hash: "sha256:93511a72e50a7d58b814f45f3834b9ab0b9ca8d9e1958410895e66767abf2491"
    expected_parse_result: SUCCESS
    roundtrip_fields_equal:
