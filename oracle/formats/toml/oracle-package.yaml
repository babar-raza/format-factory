# ==============================================================================
# CANONICALIZATION
# ==============================================================================
canonicalization:
  method: toml-key-value-dict
  description: >
    Canonical form is a Python dict produced by tomllib.loads(). Tables are
    nested dicts. Key order is preserved from the file. All scalar types
    (string, integer, float, bool, datetime) are Python-native types.
  ordering_policy: "key order preserved from file"
  whitespace_policy: "whitespace between keys and values is insignificant"
  encoding_policy: "UTF-8 (required by TOML spec)"

# ==============================================================================
# TOLERANCE POLICY
# ==============================================================================
tolerance_policy:
  numeric_tolerance: NOT_APPLICABLE
  ordering_tolerance: "none -- key order must be preserved"
  whitespace_tolerance: "inter-key whitespace is ignored; within-value whitespace is preserved"
  metadata_tolerance: "None"
  policy_summary: "Key count and structure must match Python stdlib tomllib.loads() output"

