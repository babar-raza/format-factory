valid_cases:

  - case_id: toml-valid-001
    purpose: "Minimal TOML file parses without error"
    authority_class: ACCEPTED_EMPIRICAL_EVIDENCE
    authority_refs:
      - "PYTHON-TOMLLIB-STDLIB -- tomllib.loads()"
    sample_ref: samples/by-format/toml/minimal.toml
    input_hash: "sha256:93511a72e50a7d58b814f45f3834b9ab0b9ca8d9e1958410895e66767abf2491"
    expected_parse_result: SUCCESS
    expected_model_properties:
