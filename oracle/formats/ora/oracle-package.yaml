canonicalization:
  method: ora-stack-model
  description: >
    Canonical form is the typed OraDocument model: width, height, version, and a
    recursive OraStack/OraLayer/OraText tree with each node's own explicit-vs-defaulted
    attributes tracked separately from their resolved values.
  ordering_policy: layer/group order within the stack tree is preserved exactly as declared
  whitespace_policy: not applicable -- ZIP archive, not a text format
  encoding_policy: stack.xml member is UTF-8; archive members are binary (PNG rasters)
tolerance_policy:
  numeric_tolerance: NOT_APPLICABLE
  ordering_tolerance: none -- layer/group order within the stack tree must be preserved
  whitespace_tolerance: NOT_APPLICABLE
  metadata_tolerance: attributes not tracked by the typed model are preserved verbatim in LOSSLESS mode, dropped in CANONICAL mode (see this format's own preservation-mode tests)
  policy_summary: Canvas dimensions, declared version, and layer/group count and order must match exactly
