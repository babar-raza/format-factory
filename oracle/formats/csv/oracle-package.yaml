  partial_recovery_allowed: false
  security_relevance: false
- case_id: csv-invalid-002
  purpose: Inconsistent column counts — varying field counts per row
  defect_class: structural-inconsistency
  malformed_boundary: Row 2 has 3 fields but row 1 has 2 fields
  authority_refs:
  - 'RFC 4180 §2 rule 4: Each record same number of fields as header'
