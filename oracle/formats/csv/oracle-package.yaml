canonicalization:
  method: csv-tabular-canonical
  description: 'Canonical form for CSV comparison: 1. Strip leading/trailing whitespace
    from cell values 2. Normalize line endings to LF 3. Compare row-by-row, cell-by-cell
    4. Empty trailing newline ignored

    '
  ordering_policy: Row order preserved
  whitespace_policy: 'Cell values: strip leading/trailing; internal preserved'
  encoding_policy: UTF-8 normalized
