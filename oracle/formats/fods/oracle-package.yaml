# ==============================================================================
# VALID CASES
# ==============================================================================
valid_cases:

  - case_id: fods-valid-001
    purpose: "Minimal FODS — single sheet, single string cell"
    authority_class: SPEC_NORMATIVE
    authority_refs:
      - "ODF 1.3 §3.1.2 — office:document root element"
      - "ODF 1.3 §9.4 — table:table, table:table-row, table:table-cell"
    sample_ref: samples/by-format/fods/minimal-spreadsheet.fods
    input_hash: "sha256:a790b18a811c47d634603ad0dd3e42c41c102a36c74b6349b46b9770a2825543"
    expected_parse_result: SUCCESS
    expected_model_properties:
      - property: sheet_count
        value: 1
        authority: "ODF 1.3 §9.1 — table:spreadsheet contains table:table elements"
      - property: cell_count
        value: 1
        authority: "ODF 1.3 §9.4.2 — table:table-cell"
      - property: first_sheet_name
        value: "Sheet1"
        authority: "ACCEPTED_EMPIRICAL — sheet naming not strictly spec-mandated"
        authority_class: ACCEPTED_EMPIRICAL
    applicable_profiles:
      - STRUCTURAL_VALIDITY
      - PARSE_VALIDITY
      - DOMAIN_MODEL_MAPPING

  - case_id: fods-valid-002
    purpose: "Multi-sheet FODS — 2 sheets, verifies table:table enumeration"
    authority_class: SPEC_NORMATIVE
    authority_refs:
      - "ODF 1.3 §9.1 — office:spreadsheet contains multiple table:table elements"
      - "ODF 1.3 §9.1.2 — table:name attribute on table:table"
    sample_ref: samples/by-format/fods/multi-sheet-basic.fods
    input_hash: "sha256:669b60befc7206a08578815e781ff72526c98d07be53f20e37f062b73b7dcc41"
    expected_parse_result: SUCCESS
    expected_model_properties:
      - property: sheet_count
        value: 2
        authority: "ODF 1.3 §9.1"
    applicable_profiles:
      - PARSE_VALIDITY
      - DOMAIN_MODEL_MAPPING

  - case_id: fods-valid-003
    purpose: "Typed values — float, string, boolean (office:value-type attribute)"
    authority_class: SPEC_NORMATIVE
    authority_refs:
      - "ODF 1.3 §2.2.4 — office:value-type"
      - "ODF 1.3 §9.4 — value-type values: string, float, boolean"
    sample_ref: samples/by-format/fods/typed-values-basic.fods
    input_hash: "sha256:c873322d69fa93ff64519a37a5f87f4efc9cd244a18488f03adc342524e51977"
    expected_parse_result: SUCCESS
    expected_model_properties:
      - property: has_float_cell
        value: true
        authority: "ODF 1.3 §9.4.2 — office:value-type='float'"
      - property: has_string_cell
        value: true
    applicable_profiles:
      - PARSE_VALIDITY
      - DOMAIN_MODEL_MAPPING

  - case_id: fods-valid-004
    purpose: "Formula cell — table:formula attribute with cached result"
    authority_class: SPEC_NORMATIVE
    authority_refs:
      - "ODF 1.3 §9.4 — table:formula attribute"
      - "OpenFormula OASIS specification"
    sample_ref: samples/by-format/fods/formula-basic.fods
    input_hash: "sha256:72b065415748db3e3c7796608f50b488db6d23b2439d2468baf88ea41b38db1e"
    expected_parse_result: SUCCESS
    expected_model_properties:
      - property: has_formula_cell
        value: true
        authority: "ODF 1.3 §9.4"
    applicable_profiles:
