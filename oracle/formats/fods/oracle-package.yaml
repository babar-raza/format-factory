invalid_cases:
- case_id: fods-invalid-001
  purpose: Non-XML content — fails XML parse
  defect_class: invalid-encoding
  malformed_boundary: File is not XML (binary or random bytes)
  authority_refs:
  - ODF 1.3 §3.1 — FODS must be a valid XML document
  sample_ref: tests/fixtures/fods/malformed/
  expected_failure_stage: PARSE_HEADER
  expected_error_type: FodsParseError or xml.etree.ElementTree.ParseError
  partial_recovery_allowed: false
  security_relevance: true
- case_id: fods-invalid-002
  purpose: XXE injection attempt — must not resolve external entities
  defect_class: security-xml-injection
  malformed_boundary: DOCTYPE declaration with external entity reference
  authority_refs:
  - ODF 1.3 — XML security
  - 'Gate 8 security: TC-2 DTD/XXE mitigated'
  sample_ref: null
  input_description: <?xml version='1.0'?><!DOCTYPE foo [<!ENTITY xxe SYSTEM 'file:///etc/passwd'>]><foo>&xxe;</foo>
  expected_failure_stage: PARSE_HEADER
  expected_error_type: ParseError (Expat rejects DOCTYPE by default)
  partial_recovery_allowed: false
  security_relevance: true
- case_id: fods-invalid-003
  purpose: Missing office:document root — invalid ODF structure
  defect_class: invalid-structure
  malformed_boundary: Valid XML but missing required office:document root
  authority_refs:
  - ODF 1.3 §3.1.2 — office:document is required root
  sample_ref: null
  input_description: <root><child/></root>
  expected_failure_stage: PARSE_BODY
  expected_error_type: FodsParseError
  partial_recovery_allowed: false
  security_relevance: false
roundtrip_cases:
- case_id: fods-rt-001
  purpose: Parse minimal FODS → FodsDocument → write → re-parse → semantic equivalence
  operation: FodsDocument.load(path) → write_fods(doc, path2) → FodsDocument.load(path2)
  sample_ref: samples/by-format/fods/minimal-spreadsheet.fods
  authority_class: SPEC_NORMATIVE
  authority_refs:
  - ODF 1.3 §3.1 — FODS must produce semantically equivalent output on round-trip
  equality_mode: SEMANTICALLY_EQUIVALENT
  canonicalizer: odf-workbook-canonical
  comparator: spreadsheet-cell-comparator
  fields_required_equal:
  - sheet_count
  - sheet_names
  - cell_values (all non-empty cells)
  fields_allowed_normalized:
  - XML whitespace
  - namespace prefix variations
  - style definitions (round-trip may normalize styles)
  fields_allowed_lossy:
  - office:meta (metadata regenerated)
  ordering_policy: rows in ascending order, columns in ascending order
  whitespace_policy: cell value whitespace preserved
  tolerance_policy: FLOAT64_RELATIVE_1E-9 for numeric cells
interoperability_cases:
- case_id: fods-lo-001
  purpose: LibreOffice headless converts minimal-spreadsheet.fods to xml without error
  operation: soffice --headless --convert-to xml <path>
  authority_class: ACCEPTED_EMPIRICAL
  authority_refs:
  - ODF 1.3 §3.1.2 — FODS is a valid ODF document readable by conforming processors
  sample_ref: samples/by-format/fods/minimal-spreadsheet.fods
  expected_parse_result: SUCCESS
  depth: D3
  skipped_when_missing: true
  skip_reason: LibreOffice installation required — SKIPPED_MISSING_PROVIDER if soffice
    not on PATH
  applicable_profiles:
  - INTEROPERABILITY
error_cases:
- case_id: fods-security-001
  purpose: All 18 Gate 7 malformed fixtures must not crash the product parser
  description: 'Run FodsDocument.load(path) on each of the 18 malformed fixtures in
    tests/fixtures/fods/malformed/. Each must raise an exception (not crash). This
    extends Gate 7 (prototype level) to the production product.

    '
  fixture_dir: tests/fixtures/fods/malformed/
  expected_behavior: Each file raises FodsParseError or equivalent — no crash
  security_relevance: true
  authority_class: ACCEPTED_EMPIRICAL
canonicalization:
  method: odf-workbook-canonical
  description: 'Canonical form for FODS comparison: 1. Compare sheet count and sheet
    names 2. Compare cell values (all non-empty cells) row-by-row, column-by-column
    3. For numeric values: compare with FLOAT64_RELATIVE_1E-9 tolerance 4. Ignore
    XML whitespace, namespace prefix variations, style definitions 5. Ignore empty
    rows/columns at end of sheet

    '
  ordering_policy: Sheets in definition order; rows in ascending order
  whitespace_policy: Significant whitespace in cell text values preserved
  encoding_policy: UTF-8 normalized; BOM stripped
tolerance_policy:
  numeric_tolerance: FLOAT64_RELATIVE_1E-9
  ordering_tolerance: Sheet order and row order must be preserved
  whitespace_tolerance: XML whitespace normalized; cell text whitespace preserved
  metadata_tolerance: 'office:meta (creator, creation-date, modified-date) may differ
    after round-trip. Metadata is excluded from semantic comparison.

    '
  policy_summary: 'Numeric cells: FLOAT64 relative tolerance 1e-9. String cells: exact
    match after whitespace normalization. Metadata: excluded. Styles: allowed to normalize.

    '
