invalid_cases:
- case_id: ubl-invalid-001
  purpose: XML without UBL namespace must raise UblParseError
  defect_class: missing-namespace
  malformed_boundary: Root element lacks UBL namespace URI
  authority_refs:
  - UBL-SPEC -- UBL namespace is mandatory for document identification
  sample_ref: samples/by-format/ubl/invalid/missing-namespace.xml
  input_hash: sha256:f02659af5dfe8c2c4463d8aea41250f87cdd63ed9b61ac171bc49c664ba1c86f
  expected_failure_stage: PARSE
  expected_error_type: UblParseError
  partial_recovery_allowed: false
  security_relevance: false
  notes: >-
    FF6-EVENT-000282: this case's own sample previously (samples/by-format/
    ubl/invalid/missing-mandatory.xml) had a fully valid UBL namespace and
    only lacked mandatory business fields -- contradicting this case's own
    purpose/defect_class/expected_failure_stage, unchanged since the
    2026-07-14 onboarding commit (GAP-026). Rather than repurpose that
    file (it is also used by legacy shadow-package tests expecting its
    exact current content), a new, minimal, genuinely-namespace-less
    sample was added so this case actually tests what it always claimed
    to: load() correctly raises UblParseError('root namespace mismatch')
    for a root element with no UBL namespace URI, verified interactively
    before this case was repointed.
canonicalization:
  method: ubl-document-model
  description: >
    Canonical form is a Python dict with document_type, ubl_version, doc_id, issue_date,
    and lines (list of line items). Party information and currency are extracted from
    their respective UBL namespace elements.
  ordering_policy: line item order preserved
  whitespace_policy: XML whitespace normalized by ElementTree; text values trimmed
  encoding_policy: UTF-8
tolerance_policy:
  numeric_tolerance: NOT_APPLICABLE for document structure
  ordering_tolerance: none -- line item order must be preserved
  whitespace_tolerance: XML whitespace normalization
  metadata_tolerance: UBL extension elements are preserved but not compared
  policy_summary: Document type, ID, line count, and party names must match
comparators:
- model-property-comparator
- line-count-comparator
