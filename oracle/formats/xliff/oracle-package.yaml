  - DOMAIN_MODEL_MAPPING
- case_id: xliff-valid-003
  purpose: >
    Parsed document reports the correct XLIFF version attribute.
    TC-ORACLE-002 (libxliff Mission 2): this case previously checked
    spec_qname == "xliff:file" against the format_factory.xliff donor.
    spec_qname is an FF-monorepo-internal qname-registry convention that
    libxliff (the independent product now backing this oracle track, see
    ENRICHED_LOADERS/executor_config below) deliberately does not implement
    -- removed on purpose during extraction (TC-API-002-03, "monorepo
    convention", not a defect). Re-pointed at version, a real XLIFF domain
    property, rather than leaving a case that would always FAIL against the
    now-canonical implementation for a property it was never meant to have.
  authority_class: SPEC_NORMATIVE
  authority_refs:
  - XLIFF-SPEC -- xliff/@version attribute is mandatory
  sample_ref: samples/by-format/xliff/valid/minimal.xliff
  input_hash: sha256:04da8a74ce16130ea8a83e59eba813087ce1798c1097679861baac816310f977
  expected_parse_result: SUCCESS
  expected_model_properties:
  - property: version
    value: '2.0'
    authority: XLIFF-SPEC
  applicable_profiles:
  - DOMAIN_MODEL_MAPPING
interoperability_cases:
- case_id: xliff-okapi-001
  purpose: >
    libxliff's own parse of a minimal XLIFF 2.0 document agrees with Okapi
    Tikal's independently-developed okf_xliff2 filter on source/target text
    content (TC-ORACLE-002/003). Okapi Framework (Apache-2.0,
    okapiframework.org) is a real, actively maintained, independent
    localization toolset -- not affiliated with this project -- selected
    per the Mission 2 plan's named-alternative fallback after OpenXLIFF
    proved infeasible in this environment (no prebuilt release JAR; source
    build requires Java 25, only 21/17 available). See
    tools/oracle/provider_registry.yaml: okapi-tikal.
  authority_class: SPEC_NORMATIVE
  authority_refs:
  - XLIFF-SPEC -- source/target text content
  sample_ref: samples/by-format/xliff/valid/minimal.xliff
  okapi_filter: okf_xliff2
  target_language: fr
  applicable_profiles:
  - INTEROPERABILITY
- case_id: xliff-okapi-002
  purpose: >
    Multi-unit XLIFF 2.0 document -- libxliff vs. Okapi Tikal segment-by-
    segment text agreement across 3 units (TC-ORACLE-003).
  authority_class: SPEC_NORMATIVE
  authority_refs:
  - XLIFF-SPEC -- unit ordering and source/target text content
  sample_ref: samples/by-format/xliff/valid/multi-unit.xliff
  okapi_filter: okf_xliff2
  target_language: fr
  applicable_profiles:
  - INTEROPERABILITY
- case_id: xliff-okapi-003
  purpose: >
    XLIFF 2.0 document with inline pc codes -- libxliff's flatten_inline_
    content() vs. Okapi Tikal's own inline-code-stripping table extraction
    agree on the resulting plain text (TC-ORACLE-003). Verified empirically
    during TC-ORACLE-001 acquisition that Tikal's -2tbl output strips
    inline codes to plain text, making this a like-for-like text
    comparison rather than a codes-vs-no-codes mismatch.
  authority_class: SPEC_NORMATIVE
  authority_refs:
  - XLIFF-SPEC -- pc inline code content model
  sample_ref: samples/by-format/xliff/valid/with-inline-codes.xliff
  okapi_filter: okf_xliff2
  target_language: de
  applicable_profiles:
  - INTEROPERABILITY
- case_id: xliff-okapi-101
  purpose: >
    XLIFF 1.2 Core -- libxliff's v12 model vs. Okapi Tikal's independent
    okf_xliff (1.2) filter agree on source/target text content
    (TC-ORACLE-004, extending the 2.x interoperability lane to 1.2).
  authority_class: SPEC_NORMATIVE
  authority_refs:
