canonicalization:
  method: xliff-unit-model
  description: >
    Canonical form is a Python dict with version, source_language, target_language,
    and files containing units with segments (source/target pairs).
  ordering_policy: unit order preserved within each file
  whitespace_policy: XML whitespace normalized by ElementTree serialization
  encoding_policy: UTF-8
tolerance_policy:
  numeric_tolerance: NOT_APPLICABLE
  ordering_tolerance: none -- unit order within file must be preserved
  whitespace_tolerance: XML whitespace normalization
  metadata_tolerance: XLIFF attributes beyond source/target are preserved but not compared
  policy_summary: Unit count and source/target text must match
