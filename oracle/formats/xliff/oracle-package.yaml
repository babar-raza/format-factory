executor_config:
  module: libxliff
  callable: load_any
  notes: >
    TC-ORACLE-002 (libxliff Mission 2, 2026-08-12): re-pointed from the
    superseded format_factory.xliff donor (src/python/xliff/, frozen
    history, not touched) to libxliff -- the independent, standalone XLIFF
    library that is now the maintained product for this format track.
    load_any (not the plain 2.x-only load) is used deliberately so this
    oracle track covers both XLIFF 1.2 and 2.x without needing two
    separate executor_configs -- load_any probes and dispatches to
    libxliff's genuinely separate v12 vs. 2.x models, never flattening
    them (see libxliff ADR-001). load_any(path) raises XliffParseError
    (XliffUnsupportedVersionError is a subclass) for malformed/unsupported
    input (verified against xliff-invalid-001's missing-namespace sample),
    matching the generic invalid-case executor's raise-to-PASS contract.
    libxliff must be `pip install`-ed into this venv for the oracle to
    resolve this import -- see tools/oracle/enriched_generic.py's
    ENRICHED_LOADERS comment and format-factory's libxliff extraction plan.
    Resolved as a bare top-level import (not src.python.libxliff) via
    execute_oracle.py's resolve_executor_module_path().
