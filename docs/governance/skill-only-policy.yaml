---
# Format Factory — Canonical Skill-Only Execution Policy
# This is the SINGLE AUTHORITATIVE machine-readable policy for skill-only governance.
# All agent entry points (CLAUDE.md, AGENTS.md, Codex adapters) MUST reference this file.
# They must NOT copy, diverge from, or redefine governance semantics from this file.
#
# Authority order (conflicts: later wins):
#   1. plans/master-plan.md (strategic direction)
#   2. THIS FILE (operational policy — canonical for all agents)
#   3. CLAUDE.md / AGENTS.md (agent-specific operational notes, must not redefine)
#   4. .supervisor/skill-first-policy.md (derived summary — subordinate to this file)

policy_id: SKILL-ONLY-POLICY-001
version: "2.2"
created: "2026-06-25"
last_reconciled: "2026-07-17"   # SFC production hardening: Gaps A/B/C/D/E shipped
owner: format-factory-governance
# 2.2 (2026-07-17, SFC production hardening plan): shipped the 5-gap production
# design (plans/.claude/vivid-noodling-pancake.md) — closure-oracle mission-scoping
# (Gap D), hot-governance-file generator-guard adoption (Gap B), staged tool-layer
# skill-resolution rollout with per-check mode + observe-only analyzer (Gap C,
# EP-010/011/012/013), run-loop manifest/closeout wiring via scoped hash-diff
# (Gap E), and a static src/-permission regression guard (Gap A). Discovered and
# recorded (not fixed — out of this plan's approved scope) a third instance of the
# same unscoped-global-state weakness in EP-007's exception bypass check
# (EP-007-EXCEPTION-SCAN-UNSCOPED-GAP). Promotion of Gap C/E's advisory-mode
# checks to enforcing remains a deliberate, evidence-gated, NOT-YET-TAKEN step.
#
# 2.1 (2026-07-16, Skills-First Control sprint): reconciled stale enforcement-point
# statuses against ground truth (EP-007 was falsely NOT_IMPLEMENTED); registered the
# concrete Skills-First Control (SFC) primitives — execution manifest, closeout gate,
# and control validator — as EP-011..EP-013; documented the three real ungoverned-
# mutation gaps (tool-layer skill gate, headless --dangerously-skip-permissions run-loop,
# direct-mutation generator scripts) as first-class known_gaps with compensating controls.
applies_to_agents:
  - CLAUDE_CODE
  - CODEX
  - SUPERVISOR
  - LOCAL_AUTOMATION
  - CI

# ─────────────────────────────────────────────
# 1. GOVERNED OPERATIONS
# All of these require a registered skill before any mutation occurs.
# ─────────────────────────────────────────────
governed_operations:
  - creating_editing_moving_deleting_files
  - applying_patches
  - generating_code
  - changing_project_files
  - changing_package_metadata
  - updating_product_capability_documentation
  - changing_tests_or_fixtures
  - running_migrations_or_backfills
  - changing_taskcard_states
  - changing_sprint_state
  - changing_approval_gates
  - changing_ledgers_or_registries
  - accepting_or_closing_gap_findings
  - creating_release_artifacts
  - producing_canonical_evidence
  - marking_gates_complete

# ─────────────────────────────────────────────
# 2. READ-ONLY EXCEPTION
# Allowed without a skill ONLY when ALL of these hold:
#   (a) no repository file is mutated
#   (b) no canonical state is mutated
#   (c) no accepted output is created
#   (d) no existing audit or inventory skill covers the operation
# ─────────────────────────────────────────────
read_only_exception:
  allowed: true
  conditions:
    - no_mutation_of_repository_files
    - no_mutation_of_canonical_state
    - no_creation_of_accepted_outputs
    - no_existing_skill_covers_operation
  note: >
    Read-only investigation does NOT require a skill but MUST be recorded
    when it influences a governed decision.

# ─────────────────────────────────────────────
# 3. SKILL DISCOVERY REQUIREMENTS
# ─────────────────────────────────────────────
skill_discovery_required: true
skill_registry_path: .supervisor/skill-registry.yaml
capability_routing_registry_path: .supervisor/capability-routing-registry.yaml
command_registry_path: .claude/commands/command-registry.yaml

discovery_algorithm:
  step_1: classify_task_operation_type_using_route_id_taxonomy
  step_2: query_capability_routing_registry_by_route_id
  step_3: if_ROUTE_ACTIVE_select_preferred_skill_ids_primary
  step_4: verify_skill_in_skill_registry_with_status_active
  step_5: if_MISSING_SKILL_CAPABILITY_follow_missing_skill_workflow
  step_6: if_no_route_classify_as_MISSING_SKILL_CAPABILITY

# ─────────────────────────────────────────────
# 4. SKILL RESOLUTION PRIORITY
# ─────────────────────────────────────────────
exact_capability_match_required: true
composition_allowed: true

skill_resolution_order:
  - REUSE_EXACT_MATCH         # existing skill fully covers capability
  - REUSE_PARAMETERIZED_MATCH # existing skill covers capability with different params
  - COMPOSE_EXISTING_SKILLS   # combine atomic skills for multi-capability task
  - REPAIR_EXISTING_SKILL     # fix broken/stale skill before replacement
  - EXTEND_EXISTING_SKILL     # add bounded capability to existing skill (same responsibility)
  - CREATE_MISSING_MICRO_SKILL  # ONLY when no existing skill owns responsibility

# ─────────────────────────────────────────────
# 5. NEW SKILL CREATION RULES
# ─────────────────────────────────────────────
new_skill_creation_rule:
  allowed_when:
    - no_existing_skill_owns_the_responsibility
    - capability_is_expected_to_recur
    - rejection_reasons_documented_for_all_candidates
  forbidden_when:
    - existing_skill_can_be_repaired
    - new_skill_is_sprint_specific
    - new_skill_duplicates_existing_logic
    - new_skill_is_one_file_wrapper
    - new_skill_is_trivial_with_no_reusable_semantics
  required_steps:
    - record_missing_capability
    - create_skill_development_micro_taskcard
    - design_contract_with_input_output_schemas
    - implement_smallest_correct_atomic_skill
    - write_tests
    - register_in_skill_registry
    - add_command_file
    - add_route_to_work_type_skill_map
    - prove_focused_behavior
    - prove_idempotency
    - use_skill_to_complete_original_task
    - write_execution_receipt

registration_required: true
tests_required: true
idempotency_required: true
execution_receipt_required: true

# ─────────────────────────────────────────────
# 6. MUTATION AUTHORIZATION
# Pre-mutation, the agent must hold an authorization record.
# ─────────────────────────────────────────────
direct_mutation_allowed: false
mutation_authorization_required: true

# The concrete machine-readable pre-mutation record is the Skills-First Control
# execution manifest. It is the authoritative implementation of this section.
execution_manifest_schema: .supervisor/schemas/execution-manifest.schema.json
execution_manifest_impl: tools/governance/skills_first/manifest.py
closeout_gate_impl: tools/governance/skills_first/closeout.py
skill_resolution_impl: tools/governance/skills_first/resolve.py
control_auditor_impl: tools/governance/skills_first/audit.py
control_validator_impl: tools/governance/validate_skills_first_control.py

mutation_authorization_schema:
  authorization_id: required
  agent_type: required              # CLAUDE_CODE | CODEX | SUPERVISOR | CI
  mission_id: required
  sprint_id: required
  task_id: required
  skill_resolution_id: required
  skill_id: required
  skill_version: required
  command_id: required
  allowed_paths: required_list
  normalized_input_hash: required
  expiry: required
  single_use_or_reusable: required
  issued_by: required

mutation_rejection_conditions:
  - no_active_task
  - no_skill_resolution_on_record
  - no_registered_skill_bound
  - no_command_bound
  - skill_version_stale
  - skill_status_broken_or_disabled
  - target_path_outside_ownership
  - agent_attempting_direct_patch
  - receipt_generation_unavailable
  - operation_differs_from_task_contract

# ─────────────────────────────────────────────
# 7. ENFORCEMENT POINTS
# These must ALL be active for the policy to be enforced.
# Current enforcement status shown — see gaps below.
# ─────────────────────────────────────────────
enforcement_points:
  - id: EP-001
    name: skill_registry_query
    mechanism: agent_prompt_instruction
    enforced_by: CLAUDE.md + AGENTS.md + codex-adapter.md
    tool_neutral: true
    current_status: PROMPT_ONLY  # no runtime check
    gap: EP-001-GAP  # agents can skip without technical barrier

  - id: EP-002
    name: mutation_guard_pre_mutation
    mechanism: python_script_pre_check
    enforced_by: tools/governance/pre_mutation_guard.py
    tool_neutral: true
    current_status: IMPLEMENTED  # script exists, not called automatically
    gap: EP-002-GAP  # must be called by agent; no automatic invocation

  - id: EP-003
    name: declaration_governance_validators
    mechanism: autonomous_cycle_step_2d
    enforced_by: tools/supervisor/autonomous_cycle.py + governance_validators.py (48 validators)
    tool_neutral: false  # fires only when agent submits declaration
    current_status: PARTIAL
    gap: SKILL-GAP-012  # agents that skip declaration bypass entirely

  - id: EP-004
    name: execution_receipt_required
    mechanism: agent_transcript_write
    enforced_by: validate-skill-transcript skill
    tool_neutral: false
    current_status: PROMPT_ONLY
    gap: EP-004-GAP  # receipts are written if agent complies; no enforcement if not

  - id: EP-005
    name: supervisor_rejection_of_unskilled_work
    mechanism: autonomous_cycle_grading
    enforced_by: tools/supervisor/grade_declared_work.py (TC-GUARD-001/002)
    tool_neutral: false
    current_status: PARTIAL
    gap: SKILL-GAP-012  # same as EP-003

  - id: EP-006
    name: ci_skill_attribution_check
    mechanism: github_actions_job
    enforced_by: .github/workflows/ci.yml + tools/governance/ci_skill_attribution_check.py
    tool_neutral: true
    current_status: IMPLEMENTED  # script exists, workflow job added
    gap: null

  - id: EP-007
    name: pre_commit_hook
    mechanism: git_pre_commit_hook
    enforced_by: .hooks/pre-commit-skill-guard
    tool_neutral: true
    current_status: IMPLEMENTED_AND_INSTALLED  # RECONCILED 2026-07-16 (SFC sprint)
    installed_at: .git/hooks/pre-commit -> ../../.hooks/pre-commit-skill-guard (symlink verified)
    residual_gap: EP-007-RESIDUAL
    gap: null
    reconciliation_note: >
      The prior 'NOT_IMPLEMENTED' status was STALE and factually wrong: the hook file
      exists (executable) AND is installed as .git/hooks/pre-commit. The Skills-First
      Control auditor (tools/governance/skills_first/audit.py) now probes ground truth
      and fails closed if this field ever regresses to NOT_IMPLEMENTED while installed.
      Residual weaknesses (tracked as EP-007-RESIDUAL, not a blanket NOT_IMPLEMENTED):
      (a) src/-scoped only — non-src material paths are not commit-gated by this hook;
      (b) receipt match is a 1-hour time window, not bound to the staged file set;
      (c) bypassable via `git commit --no-verify` and .local/exceptions/*.yaml.
      The closeout gate (EP-012) binds evidence to the actual changed file set and
      covers all governed paths, compensating for (a) and (b).

  - id: EP-008
    name: taskcard_schema_execution_contract
    mechanism: yaml_schema_validation
    enforced_by: .supervisor/schemas/taskcard-execution-contract.schema.json
    tool_neutral: true
    current_status: SCHEMA_CREATED_NOT_ENFORCED  # TC-SGOV-W2-003: schema created 2026-07-11
    gap: EP-008-GAP  # schema exists but not called at taskcard READY transition

  - id: EP-009
    name: plan_skill_route_validation
    mechanism: plan_validator_script
    enforced_by: tools/governance/validate_plan_skill_routes.py
    tool_neutral: true
    current_status: IMPLEMENTED_MANUAL_ONLY  # RECONCILED 2026-07-16: script exists (exit 0/1/2), NOT auto-invoked
    gap: EP-009-GAP  # manual invocation only; no CI/hook wiring — reconciled from the contradictory 'null'

  # ── Skills-First Control (SFC) primitives — added 2026-07-16 ──
  - id: EP-011
    name: execution_manifest
    mechanism: pre_mutation_manifest_record
    enforced_by: tools/governance/skills_first/manifest.py
    schema: .supervisor/schemas/execution-manifest.schema.json
    tool_neutral: true
    current_status: IMPLEMENTED  # create/validate/close; fail-closed on unregistered/inactive skill
    gap: EP-011-GAP  # creation is agent-invoked; not yet auto-required by the tool layer
    note: >
      Concrete skill-resolution + execution record binding {task, agent, operation,
      selected skills + command hashes, allowed/forbidden paths, validators, tests,
      evidence}. Refuses to bind an unregistered/inactive skill or empty allowed_paths.

  - id: EP-012
    name: skills_first_closeout_gate
    mechanism: closeout_evidence_gate
    enforced_by: tools/governance/skills_first/closeout.py
    tool_neutral: true
    current_status: IMPLEMENTED  # fail-closed: blocks close on out-of-scope change, drift, or missing evidence
    gap: null
    note: >
      A task cannot close unless: the manifest is valid, selected skills are still
      active, each command hash is stable since resolution, every changed file is
      inside allowed_paths, and skill-use evidence resolves on disk. Naming a skill
      is never sufficient.

  - id: EP-013
    name: skills_first_control_validator
    mechanism: standalone_fail_closed_validator
    enforced_by: tools/governance/validate_skills_first_control.py
    tool_neutral: true
    current_status: IMPLEMENTED  # composes audit + manifest self-test + policy self-consistency
    gap: EP-013-GAP  # standalone; wiring into the 226-validator runner as V227 is the recommended follow-up
    note: >
      CI/closeout entry. exit 2 on unreadable registry/schema (never a clean pass),
      exit 1 on any CRITICAL parity finding or policy/schema inconsistency.

  - id: EP-010
    name: tool_layer_skill_gate
    mechanism: pretooluse_hook_and_cli_preflight_skill_resolution
    enforced_by: tools/supervisor/coordination/hooks/skill_gate.py
    tool_neutral: true  # CORRECTED 2026-07-24 (was false) -- see note
    current_status: IMPLEMENTED_ADVISORY_MODE  # RECONCILED 2026-07-17 (SFC production hardening)
    gap: EP-010-GAP  # promotion to enforcing is the remaining, deliberately deferred step
    compensating_controls:
      - EP-007  # pre-commit skill guard (src/)
      - EP-012  # closeout gate (all governed paths, file-bound evidence)
      - EP-013  # control validator
    note: >
      RECONCILED 2026-07-17: Edit/Write/Bash are intercepted by
      tools/supervisor/coordination/hooks/gate.py for COORDINATION (leases) AND,
      as of this reconciliation, for skill resolution via skill_gate.py's 3-tier
      check (MANIFEST_COVERING / NO_SKILL_RESOLVED_FOR_PATH /
      SKILL_EXISTS_BUT_NO_MANIFEST). This check runs under its OWN per-check mode
      dial (tools/supervisor/coordination/db.py get_check_mode/set_check_mode,
      key check_mode:skill_resolution), independent of and never overriding the
      global coordination `mode` — a decoupling proven by test
      (tests/supervisor/test_skill_gate_rollout.py). Default is advisory (logs to
      advisory-log.jsonl, never blocks); an observe-only analyzer
      (tools/supervisor/coordination/advisory_analyzer.py, `advisory-report` CLI
      verb) exists so promotion to enforcing is evidence-gated rather than a
      guess. Promotion itself (`check-mode set --to enforcing`) has NOT happened
      — this remains the honest residual: the check is live and logging, not yet
      blocking. See EP-010-GAP for the remaining step.

      CORRECTED 2026-07-24 (strict skills-first hardening): `tool_neutral` was
      previously (and incorrectly) declared `false` — the check ran ONLY inside
      gate.py's PreToolUse hook, which is Claude Code-specific plumbing; Codex's
      own mandatory entry point (`python -m tools.supervisor.coordination
      preflight`, docs/governance/codex-adapter.md §3a) never called
      evaluate_path() at all, so a Codex session following its own documented
      procedure got coordination-lease protection but not skill-resolution
      protection — an unintentional asymmetry the "applies equally to Claude
      Code and Codex" claim (codex-adapter.md line 21) did not actually hold in
      code. Both entry points now resolve through one shared function,
      `skill_gate.decide()`, and the CLI `preflight` verb gained a new exit
      code (7 = skill-gate-blocked) mirroring the hook's block behavior, plus
      identical advisory-log.jsonl telemetry either way (proof:
      tests/supervisor/test_cli_skill_gate_parity.py). Also added path-scoped
      check_mode (tools/supervisor/coordination/db.py
      get_check_mode_for_path/set_check_mode_for_path) since a single global
      on/off switch made "promote per path-scope, smallest blast radius first"
      (the remediation this same file already recommended below) mechanically
      impossible — both callers now honor per-prefix promotion identically.
      Registry path declarations for every src/-mutating skill were also
      fixed (`.supervisor/skill-registry.yaml`'s implementation_paths were
      empty or contained unmatchable `<format>` template tokens for every one
      of them, so `evaluate_path()` could never resolve `src/` at all before
      this pass — see tools/governance/skills_first/path_scope_lint.py, the
      new regression guard against this exact class of registry bug).

# ─────────────────────────────────────────────
# 8. EXCEPTION POLICY
# ─────────────────────────────────────────────
exception_process:
  recording_required: true
  schema:
    exception_id: required
    mission_id: required
    task_id: required
    agent_type: required
    operation: required
    reason: required
    scope: required
    paths: required_list
    mutation_allowed: required
    authority: required
    expiry: required
    reusable_logic_review: required
    final_disposition: required
  storage_path: .local/exceptions/

forbidden_exception_reasons:
  - no_skill_applicable
  - small_change
  - documentation_only
  - urgent
  - pre_existing
  - one_time
  - assistant_discretion

# ─────────────────────────────────────────────
# 9. VIOLATION RESPONSE
# ─────────────────────────────────────────────
violation_response:
  on_ungoverned_mutation:
    - classify_as_UNGOVERNED_MUTATION_in_residual_bypass_report
    - create_repair_taskcard
    - require_retroactive_skill_binding_or_reconstruction
    - block_close_task_until_receipt_exists
  on_skill_created_not_used:
    - classify_as_SKILL_CREATED_NOT_USED_violation
    - require_original_task_completion_via_skill
  on_broken_skill_direct_bypass:
    - reject_bypass
    - require_skill_repair_first
    - then_rerun_via_skill

# ─────────────────────────────────────────────
# 10. CODEX-SPECIFIC ADAPTER
# ─────────────────────────────────────────────
codex_adapter:
  path: docs/governance/codex-adapter.md
  canonical_policy_reference: docs/governance/skill-only-policy.yaml
  note: >
    Codex must consume the same skill registry, capability routing registry,
    taskcard schema, mutation guard, execution receipt schema, exception policy,
    and audit rules as Claude Code. Codex has different shell tool access
    but must not have different governance semantics.

# ─────────────────────────────────────────────
# 11. KNOWN GAPS (requiring planned remediation)
# ─────────────────────────────────────────────
known_gaps:
  - gap_id: SKILL-GAP-008
    description: Pre-commit/pre-push hook for AG0 enforcement
    status: backlog
    blocking: false

  - gap_id: SKILL-GAP-012
    description: >
      Agents that edit files without submitting an evidence declaration
      bypass the declaration-based governance layer (EP-003) entirely.
      This is the primary first unenforced boundary.
    status: resolved
    resolved_at: '2026-06-25'
    resolution: >
      V-SGF-001 (validate_skill_attribution_in_declaration) added to governance_validators_ext.py
      and wired into run_all_governance_validators() via governance_validator_runner.py.
      WARN for missing declared_skill_ids (until 2026-09-01), BLOCK for unregistered skill IDs.
      5 regression tests in tests/supervisor/test_governance_validators.py pass (119/119 total).
      Idempotency proven: identical output on two consecutive runs.
    blocking: false
    first_unenforced_boundary: true

  - gap_id: EP-001-GAP
    description: Skill registry query is prompt-only (no technical barrier to skip)
    status: open
    blocking: false

  - gap_id: EP-002-GAP
    description: >
      pre_mutation_guard.py exists but must be called explicitly by agent.
      No automatic invocation from tool layer.
      NARROWED 2026-07-15 (mission AGENT-COORD-2026-07-15, TC-COORD-007):
      the guard now verifies live coordination leases covering target paths
      (--require-lease, auto-on when the coordination DB exists), and the
      Claude tool layer IS automatically intercepted by the PreToolUse
      coordination gate (.claude/settings.json ->
      tools/supervisor/coordination/hooks/gate.py). Residual: Codex/Kilo
      still invoke the guard per adapter contract rather than via tool-layer
      interception; backstopped by the pre-commit coordination check.
    status: MITIGATED_BY_PLAN_FF-AGENTS-PARITY-001
    mitigation_note: >
      Pre-commit hook (EP-007) at .hooks/pre-commit-skill-guard auto-enforces skill
      receipt check for src/ mutations. sprint_executor_validate.py Phase 16 (TC-ACP-006)
      adds WARN for PRODUCT_SOURCE items lacking pre_mutation_guard_authorization_id.
      Not fully RESOLVED: hook covers Claude Code commits; Codex/Kilo commit paths
      may still bypass guard. Full resolution requires RC-016/RC-017 on those platforms.
    blocking: false

  - gap_id: EP-004-GAP
    description: Execution receipts are voluntary — no enforcement if agent skips
    status: open
    blocking: false

  - gap_id: EP-008-GAP
    description: taskcard execution_contract schema defined but not validated at READY transition
    status: open
    blocking: false

  - gap_id: EP-009-GAP
    description: >
      Plan skill-route validator (validate_plan_skill_routes.py) exists and works
      (exit 0/1/2) but is manual-invocation only — no CI/hook wiring. RECONCILED
      2026-07-16: prior text 'not implemented' contradicted the EP-009 status block;
      the script IS implemented, only the auto-invocation is missing.
    status: open
    blocking: false

  # ── Ungoverned-mutation gaps documented 2026-07-16, hardened to production
  #    (SFC production hardening plan, plans/.claude/vivid-noodling-pancake.md,
  #    2026-07-17) ──
  - gap_id: EP-010-GAP
    description: >
      RECONCILED 2026-07-17: infrastructure shipped (skill_gate.py 3-tier check,
      per-check mode dial decoupled from the global coordination mode, observe-only
      advisory_analyzer.py + `advisory-report`/`check-mode` CLI verbs — 9 decoupling
      tests + 6 analyzer-correctness tests pass). The check is LIVE and logging in
      its default advisory mode. What remains open: promotion to `enforcing` is a
      deliberate, evidence-gated, NOT-YET-TAKEN step — there is no real traffic
      data yet to calibrate a promotion decision against, and automatic rollback
      was explicitly rejected for day one (real oscillation/governance-defeat risk
      with zero incident-rate baseline). This gap stays open until a human/governed-
      skill reviews `advisory-report --check skill_resolution` evidence and
      deliberately promotes.
    status: infrastructure_shipped_pending_promotion
    blocking: false
    compensating_controls: [EP-007, EP-012, EP-013]
    remediation: >
      Accumulate advisory-mode evidence (advisory_analyzer.py) over a defined
      burn-in window (minimum sample size AND minimum elapsed time), then promote
      check_mode:skill_resolution to enforcing per path-scope, smallest blast
      radius first (tools/governance/** before src/**). Automatic rollback is a
      separate, later follow-up once real enforcing-mode incident-rate data exists.

  - gap_id: RUNLOOP-SKIPPERMS-GAP
    description: >
      RECONCILED 2026-07-17: sprint_executor.py's cmd_run_sprint now creates an
      execution manifest (resolve.py scope, falling back to the autonomous-loop
      skill with a bounded lane-wide scope when nothing specific resolves) BEFORE
      spawning the `--dangerously-skip-permissions` subprocess, and computes an
      independently-derived changed_files list via a content-hash diff scoped ONLY
      to the manifest's own allowed_paths (never the whole repo — this is what
      makes it sound under 44+-agent concurrency, unlike a git-diff over the
      30-minute execution window, which the design rejected as provably unsound:
      it would either over-attribute concurrent unrelated agents' commits or
      under-attribute the sprint's own uncommitted edits). autonomous_cycle.py's
      evaluate_sfc_closeout_gate() runs the SFC closeout gate against that list
      before the ledger-update acceptance gate. 13 tests pass (concurrent-write
      non-attribution, call-order proof, manifest-failure non-blocking, close-ok/
      close-blocked/enforcing paths).
    status: infrastructure_shipped_pending_promotion
    blocking: false
    remediation: >
      Gated by check_mode:sprint_closeout_governance (default advisory: logs the
      verdict, does not yet block the ledger update). Promotion to enforcing is a
      separate, evidence-gated decision, same discipline as EP-010-GAP. Separately,
      the fallback scope (bounded lane paths when no skill resolves from the
      sprint's free-text prompt) should be tightened via next-work-items.json's own
      lane/path structure — tracked, not yet done.

  - gap_id: DIRECT-GENERATOR-GAP
    description: >
      TRIAGED 2026-07-17 (TC-RG-002). The original estimate ("~25") was stale —
      the scan actually flagged 125 tools/*.py files, because
      scan_ungoverned_generators() matched a write call ANYWHERE in a file
      against a mutation-target string (src/python/, registry/, .supervisor/,
      oracle/) ANYWHERE ELSE in the same file, with no relation between the
      two. Fixed: the match now requires the target string in a bounded line
      window around the actual write call (see
      tools/governance/skills_first/audit.py's _write_call_targets_mutation_path
      and tests/governance/test_scan_ungoverned_generators_proximity.py).
      This alone cut the real-repo signal from 125 to 5 candidates. Manual
      triage of all 5 (tests/governance/test_direct_generator_gap_triage.py):
        - tools/supervisor/bounded_repair_engine.py: CONFIRMED real gap —
          writes directly to src/ with no skill resolution, and two of its
          repair actions (MISSING_ATTRIBUTE, NAME_ERROR) write a literal
          `# TODO: implement` stub into product source, an EP-1 conflict.
          Confirmed dead code (no importer outside its own test) — marked
          deprecated-pending-redesign in its own module docstring rather than
          governance-wrapped, since wrapping would legitimize code that must
          not run as-is. Remediation option (b) applied.
        - tools/supervisor/build_context_pack.py: CONFIRMED real gap — GOVERNED
          this pass. Added to
          tools/governance/hot-governance-files/output-manifest.yaml (outputs
          .supervisor/context-pack.yaml + its report) and to gate.py's
          GENERATOR_PATTERNS, following the SFC-GAP-B precedent exactly.
          Remediation option (a) applied.
        - tools/supervisor/supervisor_loop.py: its .supervisor/state/
          current-run.json write is already declared under the pre-existing
          tools/supervisor/autonomous-cycle-output-manifest.yaml; gate.py does
          not yet route it through guard-run enforcement. Backlogged (not
          urgent — single-writer ephemeral heartbeat file, not a shared
          multi-writer canonical policy document like the hot-files set).
        - tools/review/architecture_audit.py, tools/oracle/self_test_oracle_harness.py:
          reclassified FALSE POSITIVE on manual read — both write only to
          reports/self-test scratch dirs; the nearby match was a
          docstring/error-message describing what the tool *reads*, not its
          write target.
    status: open
    blocking: false
    remediation: >
      Each such script must be either (a) wrapped by a governed skill+command, or
      (b) marked read-only/deprecated. The closeout gate flags their outputs as
      out-of-scope when no manifest authorizes the touched paths. Both real
      candidates from the 2026-07-17 triage have remediation applied (see
      description). Remaining open item: supervisor_loop.py's guard-run
      enforcement wiring (backlog, non-blocking).

  - gap_id: EP-007-EXCEPTION-SCAN-UNSCOPED-GAP
    description: >
      DISCOVERED 2026-07-17 (during SFC production hardening commit work): the
      pre-commit skill guard's exception bypass check
      (.hooks/pre-commit-skill-guard check_exception_record()) scans the ENTIRE
      .local/exceptions/ directory for ANY file containing the substring
      "no_verify_exception" or "pre_commit_bypass" — with no scoping to the
      specific commit, mission, or files being committed. A live example: a
      stale exception file from an unrelated, long-closed mission
      (fiop-full-001-src-healing.yaml, dated 2026-07-12) silently causes
      "[skill-guard] Exception record found — bypassing guards" on EVERY commit
      touching src/, regardless of relevance — the exact same "unscoped global
      state" structural weakness this hardening pass fixed in Gap D
      (lifecycle_audit.py) and Gap B (hot-file writes), now found in a THIRD
      enforcement point (EP-007) not covered by this plan's approved scope.
    status: open
    blocking: false
    remediation: >
      Scope check_exception_record() to exceptions whose recorded scope/paths
      actually cover the staged files (and are unexpired), mirroring the
      mission-scoping pattern already applied to lifecycle_audit.py's G4 guard
      and the exceptions.py governed-exception validator built for
      tools/governance/skills_first/exceptions.py. Out of scope for this
      hardening pass (a new, not-yet-approved change); tracked here so it is
      not silently lost.

