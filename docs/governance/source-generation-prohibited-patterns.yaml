# Source Generation Prohibited Patterns — Format Factory
# Authority: Plans/spec-to-feature-radical-correction-plan.md
# Enforcement: governance_validators.py validators referenced below

prohibited_patterns:

  - pattern_id: "PP-001"
    name: "monolith-single-file"
    description: "Single file handling parsing + model + serialization + analytics"
    detection_rule: "File exceeds 800 LOC or 60 functions AND handles multiple concerns"
    validator_ref: "V39"
    enforcement_level: "blocking"
    remedy: "Split into parser.py, models.py, writer.py, analytics.py per production-readiness-standard.md §1"

  - pattern_id: "PP-002"
    name: "no-spec-qname"
    description: "ODF format model class missing spec_qname attribute"
    detection_rule: "Class in ODF format package (fods, fodt, ods, odt, fodp, fodg) without spec_qname"
    validator_ref: "V36"
    enforcement_level: "warning"
    remedy: "Add spec_qname = 'namespace:local-name' from shared/qname-registry/{format}.yaml"

  - pattern_id: "PP-003"
    name: "generic-helper-dumping-ground"
    description: "Utility file accumulating unrelated helper functions"
    detection_rule: "File named utils.py or helpers.py exceeding 200 LOC"
    validator_ref: "MANUAL"
    enforcement_level: "advisory"
    remedy: "Move functions to domain-specific modules; delete utils.py"

  - pattern_id: "PP-004"
    name: "analytics-in-parser"
    description: "Analytics/statistics functions mixed into parser or codec file"
    detection_rule: "Functions with _mod_*_times_* pattern in non-analytics file"
    validator_ref: "V42"
    enforcement_level: "blocking"
    remedy: "Extract to {format}_analytics.py; add try/except ImportError re-export at codec bottom"

  - pattern_id: "PP-005"
    name: "raw-dict-public-api"
    description: "Public API returning raw dicts instead of typed model objects"
    detection_rule: "parse_* function returning dict without model wrapper"
    validator_ref: "MANUAL"
    enforcement_level: "advisory"
    remedy: "Wrap return value in a domain model class (e.g., FodsDocument); keep dict access for backward compat"

  - pattern_id: "PP-006"
    name: "architecture-only-stub-as-product"
    description: "Architecture-only spec stub claimed as product implementation"
    detection_rule: "File with '# GENERATED — architecture_only' marker cited in RELEASE_GATE evidence"
    validator_ref: "V48"
    enforcement_level: "blocking"
    remedy: "Do not cite architecture_only stubs as evidence of implementation; implement behavioral class"

  - pattern_id: "PP-007"
    name: "format-prefixed-canonical-name"
    description: "Using format-prefixed names (e.g., FodsCell) as primary implementation classes"
    detection_rule: "Primary implementation class named {Format}{Concept} instead of canonical spec name"
    validator_ref: "MANUAL"
    enforcement_level: "advisory"
    remedy: "Use spec-derived canonical name (e.g., TableCell); facade in Compat/ for backward compat"

  - pattern_id: "PP-008"
    name: "init-with-logic"
    description: "__init__.py containing implementation logic instead of re-exports"
    detection_rule: "__init__.py exceeding 100 LOC with function definitions"
    validator_ref: "V39"
    enforcement_level: "warning"
    remedy: "Move logic to dedicated module; __init__.py should only re-export"

  - pattern_id: "PP-009"
    name: "stub-test-patterns"
    description: "Test files with only assert True or trivial spec_qname assertions"
    detection_rule: ">80% assertions are 'assert True' or 'assert X.spec_qname =='"
    validator_ref: "V36"
    enforcement_level: "warning"
    remedy: "Add behavioral assertions testing actual parsing/serialization logic"

  - pattern_id: "PP-010"
    name: "hardcoded-goals-bypassing-gap-ledger"
    description: "Task generation using hardcoded goal lists instead of gap-ledger authority"
    detection_rule: "_EXPANSION_GOALS list used without gap_ledger_ref traceability"
    validator_ref: "V45"
    enforcement_level: "blocking"
    remedy: "Source work items from gap-ledger.json; use capability compiler for feature IR generation"

  - pattern_id: "PP-011"
    name: "baseline-loc-cap-increase"
    description: "Increasing baseline_loc_cap in source-structure-baseline.json"
    detection_rule: "baseline_loc_cap value increased from prior committed value"
    validator_ref: "MANUAL"
    enforcement_level: "blocking"
    remedy: "baseline_loc_cap is write-once. Reduce file LOC instead of increasing cap"
