  - gap_id: OGAP-004
    title: "`assertion:` schema silently ignored by executor"
    category: schema_compatibility
    severity: HIGH
    false_green_risk: MEDIUM
    evidence:
      file: tools/oracle/execute_oracle.py
      function: execute_generic_load_case
      lines: "717-780"
      citation: |
        Line 751 (approx): expected_props = case.get("expected_model_properties", [])
        The `assertion:` block in oracle-package.yaml is never read by this function.
        If case has only `assertion:` (no `expected_model_properties`), executor gets expected_props=[]
        → depth=D0 → PASS (load succeeded, no comparison made).
      secondary_file: oracle/formats/abw/oracle-package.yaml
      secondary_citation: |
        abw-valid-001 and abw-valid-002: assertion: {expect_type: dict, expect_no_exception: true}
        No expected_model_properties present.
        → These 2 cases run at D0 with no comparison.
    root_causes: [RC3, SW2]
    affected_formats: [abw]  # only abw has assertion: without expected_model_properties
    affected_cases: [abw-valid-001, abw-valid-002]
    partially_affected: [fodg]  # fodg has both assertion: AND model_props — model_props IS read
    current_impact: "abw 2/3 cases run at D0 with no real comparison; assertion: is documentation only"
    migration_stage: Fix 5
    task_ids: [IMPL-FIX-005]
    implementation_location:
      file: tools/oracle/execute_oracle.py
      function: execute_generic_load_case
      change: "After getting result_val, check assertion: block if expected_model_properties is absent"

