  - gap_id: OGAP-001
    title: "Synthetic `loaded: true` property inflates D1 depth score"
    category: depth_scoring
    severity: HIGH
    false_green_risk: HIGH
    evidence:
      file: tools/oracle/execute_oracle.py
      function: _compare_model_properties
      lines: "664-714"
      citation: |
        Line 683-685:
          if prop_name == "loaded":
              actual = result_val is not None  # synthetic: if no exception, always True
        Line 713:
          depth = DEPTH_D1 if expected_props else DEPTH_D0
        Any non-empty expected_props list → D1, even if all props are synthetic.
    root_causes: [RC1, SW3]
    affected_formats: [dif, fodt, sylk]  # ALL cases are synthetic → inflated to D1
    partially_affected: [gnumeric, ods, xcf]  # some cases synthetic, some real
    current_reported_depth: D1
    actual_depth_for_affected: D0
    migration_stage: Fix 1
    task_ids: [IMPL-FIX-001]
    implementation_location:
      file: tools/oracle/execute_oracle.py
      change: "Add SYNTHETIC_PROPERTIES = frozenset({'loaded', 'result_type'}); modify depth computation"
      lines_to_change: "713"

