# G2 FALLBACK IMPACT (Fix 2 — remove test-suite fallback):
# Which formats currently have 0 oracle PASS? NONE — all 20 have PASS > 0.
# The fallback is only triggered when passed_cases == 0.
# Therefore Fix 2 does NOT immediately block any format's G2 gate.
# However, the gate output was previously LYING (claiming oracle_depth_minimum_d1: True
# via fallback for formats that had no oracle run). This is now corrected.
