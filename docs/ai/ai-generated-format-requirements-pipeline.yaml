---
document_id: ai-generated-format-requirements-pipeline
version: "1.0"
created: "2026-05-13"

core_principle: "Detailed per-format requirements must be generated by the system using AI, not manually authored"

human_product_goals:
  source_type: PRODUCT_DECISION
  goals:
    - id: PG-001
      description: "Load supported format and build in-memory document object model"
    - id: PG-002
      description: "Inspect and manipulate the DOM programmatically"
    - id: PG-003
      description: "Edit format-specific entities in the DOM"
    - id: PG-004
      description: "Save same format with or without edits (round-trip)"
    - id: PG-005
      description: "Export/convert to PDF, PNG, HTML, and related family formats"

input_sources:
  - priority: 1
    source: human_product_goals
    location: docs/product-factory/commercial-product-capability-model.md
    source_type: PRODUCT_DECISION
  - priority: 2
    source: verified_facts
    location: "acquisition-packs/{format}/verified-facts.yaml"
    source_type: VERIFIED_FACT
  - priority: 3
    source: implementation_requirements
    location: "acquisition-packs/{format}/implementation-requirements.yaml"
    source_type: VERIFIED_FACT
  - priority: 4
    source: neutral_model_schema
    location: "schemas/neutral-model/{format}/model.yaml"
    source_type: VERIFIED_FACT
  - priority: 5
    source: existing_dotnet_source
    location: "src/net/{format}/"
    source_type: EXISTING_SOURCE
  - priority: 6
    source: existing_dotnet_tests
    location: "tests/net/{format}/"
    source_type: TEST_EVIDENCE
  - priority: 7
    source: format_profile
    location: "acquisition-packs/{format}/format-profile.yaml"
    source_type: VERIFIED_FACT
  - priority: 8
    source: tier_map
    location: "acquisition-packs/{format}/tier-map.yaml"
    source_type: VERIFIED_FACT
  - priority: 9
    source: normalized_spec_text
    location: ".local/spec-normalize/{format}/text.txt"
    source_type: SPEC
  - priority: 10
    source: security_surface
    location: "acquisition-packs/{format}/security-surface.yaml"
    source_type: VERIFIED_FACT
  - priority: 11
    source: ai_retrieval_synthesis
    location: "(LLM call over above sources)"
    source_type: AI_PROPOSAL

pipeline_stages:
  - stage: 1
    name: input_collection
  - stage: 2
    name: retrieval
  - stage: 3
    name: requirement_extraction
  - stage: 4
    name: requirement_normalization
  - stage: 5
    name: object_model_candidate_generation
  - stage: 6
    name: save_edit_conversion_requirement_generation
  - stage: 7
    name: risk_and_gap_analysis
  - stage: 8
    name: verifier_review
  - stage: 9
    name: schema_validation
  - stage: 10
    name: acceptance

output_artifacts:
  - "generated-requirements/{format}/commercial-requirements.yaml"
  - "generated-requirements/{format}/object-model-requirements.yaml"
  - "generated-requirements/{format}/save-edit-requirements.yaml"
  - "generated-requirements/{format}/conversion-requirements.yaml"
  - "generated-requirements/{format}/traceability-map.yaml"
  - "generated-requirements/{format}/verifier-review.yaml"
  - "generated-requirements/{format}/generation-report.md"

validation_rules:
  - "Every requirement maps to a product goal"
  - "Format-specific requirements cite local evidence OR source_type: PRODUCT_DECISION"
  - "UNKNOWN/NEEDS_REVIEW items clearly marked"
  - "AI_PROPOSAL requires verifier approval before ACCEPTED"
  - "ACCEPTED_FOR_VERTICAL_SLICE requires test_requirements"
  - "Conversion requirements are future-scoped"
  - "Capability claims must not exceed evidence"

implementation_gate:
  requires:
    - lane_r1: PASS
    - lane_r2: PASS
    - lane_r3: [PASS, PASS_WITH_LOW_CONFIDENCE_ITEMS]
    - lane_r4: [PASS, PASS_WITH_LOW_CONFIDENCE_ITEMS]
    - lane_r5: [PASS, PASS_WITH_NOTES]
    - schema_validation: PASS
    - accepted_for_vertical_slice_exists: true
  failure_code: REQUIREMENTS_GENERATION_NOT_READY_FOR_IMPLEMENTATION
