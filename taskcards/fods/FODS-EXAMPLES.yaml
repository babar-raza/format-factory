taskcard_id: FODS-EXAMPLES
title: "FODS Python runnable example scripts"
status: PROPOSED
owner: execution-agent
supervisor: coordinator-lane
source:
  plan_section: "TC-READINESS-001"
  plan_file: "plans/fluffy-yawning-jellyfish.md"
  gap_description: "No runnable example scripts exist for FODS"
scope:
  allowed_paths:
    - examples/python/fods/read_and_inspect.py
    - examples/python/fods/edit_and_export.py
  forbidden_paths:
