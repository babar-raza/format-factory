## Feature Gaps (Known, Not Defects at alpha-foss level)

formula_evaluation: NOT_SUPPORTED
  - Formula cells are preserved as-is in parse/write
  - Editing formula cells triggers FORMULA_CELL_EDIT warning

merged_cells: PARTIAL
  - Merged cell boundaries preserved in parse/write
  - Editing boundary cells triggers MERGED_CELL_BOUNDARY warning

column_widths: NOT_PRESERVED
  - Column width metadata dropped in write round-trip
  - Known gap: documented

cell_styles: NOT_PRESERVED
  - Style references dropped in write round-trip
  - Known gap: documented

## Warning Code Taxonomy

FORMULA_CELL_EDIT: editing a cell that had a formula expression
MERGED_CELL_BOUNDARY: editing at merged range boundary
AUTO_UPDATE_FORMULA: sheet has auto_updatable=True
STYLE_REFERENCE: cell has style references that may be lost

