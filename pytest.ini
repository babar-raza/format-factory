[pytest]
# importlib mode gives each test module a unique path-based name, preventing
# basename collisions when multiple format test suites share filenames
# (e.g. tests/python/fods/test_parser_basic.py vs tests/python/fodt/test_parser_basic.py).
addopts = --import-mode=importlib
# Default per-test timeout (requires pytest-timeout installed).
# Prevents runaway tests from blocking CI or replay. Auto-proof tests are
# excluded from this limit via their own conftest or --timeout override.
# Install: pip install --user pytest-timeout==2.3.1
timeout = 120
