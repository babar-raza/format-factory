# All XCF corpus samples are project-owned synthetic, generated via Python
# standard library (struct + bytes) with no third-party dependencies.
# XCF format is documented at developer.gimp.org/core/xcf/ and in GIMP source.
# Generation constructs: 14-byte header ('gimp xcf ' + version + NUL),
# canvas properties (width, height, color_mode), property list with
# PROP_COMPRESSION=0 (none) + PROP_END, single layer with hierarchy
# containing one uncompressed tile of raw pixel data.

