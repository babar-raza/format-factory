# All ORA (OpenRaster) corpus samples are project-owned synthetic archives,
# conformant to the OpenRaster baseline/file-layout/layer-stack specifications
# pinned in shared/format-contracts/authority-lock.yaml:
#   https://invent.kde.org/documentation/openraster-org/-/raw/f050b99fa8af44cb4cc3c9d842d25097458765f6/baseline/baseline.rst
# Originally added in commit 356a0008 ("ORA gains layer-source PNG structural
# validation... and its first sample fixtures, which the format had none of"),
# alongside the layer-PNG-validation and lifecycle/write obligation tests that
# consume them (tests/python/ora/test_obligation_lifecycle_and_write.py,
# test_obligation_stack_and_document.py). No standalone generation script was
# preserved separately from that commit; the fixtures were built as ZIP
# archives containing a stack.xml layer manifest plus PNG layer/thumbnail/
# mergedimage members, matching the structure the format's own reader/writer
# round-trips exercise in the same commit's test additions.
# All files are fully deterministic, zero third-party sample content.

samples:
  - sample_id: valid/minimal.ora
    sha256: "a8fa5a0ce7840a8b1e6a199a84d2beafe354db697c374bff478334718dbe0543"
    source_type: project-owned-synthetic
    generation_tool: "format_factory.ora write path (commit 356a0008)"
    generation_date: "2026-08-05"
    input_content: "Minimal single-layer OpenRaster document: one PNG layer plus required mergedimage/thumbnail members and a stack.xml layer manifest."
    license: Apache-2.0
    copyright: "format-factory project"
    provenance_status: confirmed

  - sample_id: valid/multi-layer.ora
    sha256: "aed18dda231f98f6b589de6e71af7c793bee639bfc7166d41e8dd5f4276c70d4"
    source_type: project-owned-synthetic
    generation_tool: "format_factory.ora write path (commit 356a0008); mergedimage.png regenerated by format_factory.ora.render.generate_baseline_assets (FF6-ORA-RENDER-001)"
    generation_date: "2026-08-05"
    input_content: "OpenRaster document with multiple stacked PNG layers under a single layer stack, exercising layer-order and opacity/visibility attributes."
    license: Apache-2.0
    copyright: "format-factory project"
    provenance_status: confirmed
    correction_note: >-
      2026-08-09: this fixture's own mergedimage.png (sha256
      7eefb650ca0f883119e1554de88c5e2a770c3e12c0cdbf2e28f2a40f8ea36822 before
      this fix) did not reflect its own stack.xml -- it was a byte-for-byte
      copy of the raw Foreground layer's PNG (opacity 0.8, RGBA
      0,0,255,200), with no compositing over the Background layer and no
      opacity applied at all. Discovered while building the package's first
      real rendering engine (ORA-RENDER-001): rendering this document and
      comparing against the fixture's own asset was the first case where
      they disagreed, and hand-verified standard alpha-compositing
      arithmetic (0.8-opacity blue foreground, straight alpha 200/255,
      source-over onto an opaque white background) independently confirms
      the correct result is RGBA(95,95,255,255), not the file's prior
      placeholder value. mergedimage.png was regenerated from the same
      unmodified stack.xml and layer PNGs via the new renderer and written
      back through the existing lossless write path (stack.xml and layer
      members byte-identical; only mergedimage.png and the archive's
      resulting sha256 changed). No other sample in this corpus showed the
      same defect -- minimal.ora and with-groups.ora both use opacity 1.0
      throughout, where a placeholder direct copy happens to equal the
      correct composite.

