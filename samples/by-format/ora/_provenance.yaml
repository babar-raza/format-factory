# Note: samples/by-format/ora/invalid/ now has 7 fixture files covering
# ORA_LAYER_SOURCE_MISSING, ORA_THUMBNAIL_MISSING, ORA_LAYER_SOURCE_INVALID_PNG,
# ORA_THUMBNAIL_UNREADABLE, ORA_THUMBNAIL_NON_CONFORMING,
# ORA_MERGED_IMAGE_UNREADABLE, and ORA_MERGED_IMAGE_NON_CONFORMING
# (tests/python/ora/test_obligation_invalid_corpus_diagnostics.py). Building
# the last 4 surfaced and fixed a real exception-hierarchy bug in
# lifecycle.py (see that test file's own module docstring for detail).
# ORA_MERGED_IMAGE_MISSING already has in-memory (not file-based) coverage in
# test_obligation_lifecycle_and_write.py. All 9 real diagnostic codes this
# module's own validation functions can produce now have test coverage.
