format_id: ubl
corpus_version: '1.0'
acquisition_sprint: FF6-EVENT-000320-UBL-OFFICIAL-SAMPLE-ROUNDTRIP
source: OASIS Universal Business Language (UBL) 2.3 official Committee Specification package
source_note: Vendored from the same pinned OASIS UBL 2.3 release package this product already vendors
  its XSD schemas from (src/python/ubl/src/format_factory/ubl/validation/schemas/), under the same OASIS
  specification terms. These are real OASIS-authored example instance documents, not project-generated
  synthetic fixtures (contrast samples/by-format/ubl/_corpus-manifest.yaml, which is entirely project-owned-synthetic).
license: OASIS specification content (same terms as the vendored XSD schemas)
total_count: 55
roundtrip_capable_count: 10
load_only_count: 45
roundtrip_capable_field_scope_note: 'roundtrip_capable_count/load_only_count above (and each sample''s
  own roundtrip_capable field) deliberately KEEP their original, narrower meaning: DIRECT round-trip
  only (dumps() succeeds on the as-loaded document with no migration step) -- test_obligation_official_sample_roundtrip.py
  own parametrization depends on this exact semantic and would break if it changed. See
  roundtrips_overall_count near the end of this file (and each sample''s own roundtrips_overall/roundtrip_method
  fields) for the fuller, accurate picture that also counts migrate_document()''s own 2.0/2.1/2.2-to-2.3
  paths: 54 of 55 round-trip overall, not merely 10. Independent review (2026-08-11) flagged this
  apparent inconsistency between the two field families as a readability risk -- this note is the fix.'
total_supported_document_types: 91
coverage_note: '55 of this package own 91 supported UBL 2.3 root types have an official OASIS example
  available in the pinned release package; the remaining 36 have no official example in that package at
  all (a separate, unaddressed data-acquisition gap, not attempted this slice). Of the 55: 10 round-trip
  in full (load real bytes -> dumps() -> semantic-XML-equal to the original) either because the official
  example omits cbc:UBLVersionID entirely or (Manifest only) explicitly declares 2.3. The other 45 declare
  an older UBLVersionID (2.0/2.1/2.2) and are correctly, deliberately refused by dumps()/validate()''s
  own stable-2.3-profile gate -- proven as a load-only + correct-refusal case, not a round trip, since
  silently relabeling an older official document as 2.3 output would misrepresent it.'
