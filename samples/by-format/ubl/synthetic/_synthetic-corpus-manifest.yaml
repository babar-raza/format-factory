format_id: ubl
corpus_version: '1.0'
acquisition_sprint: FF6-EVENT-000516-UBL-SYNTHETIC-SAMPLE-GENERATION
source: Project-generated, walking the pinned OASIS UBL 2.3 official maindoc XSD schemas this product
  already vendors
source_note: 'These are NOT OASIS-authored example instances (contrast samples/by-format/ubl/official/,
  which vendors 55 real OASIS examples). OASIS has never published an example instance for any of these
  36 root document types, in any UBL version -- confirmed by exhaustive research, see reports/format-contract-layer/ubl-sample-coverage-research-memo.md.
  Each file here is the smallest structurally valid instance of its own type: every minOccurs>=1 element
  and attribute from the real, pinned OASIS schema is populated with a deterministic placeholder value;
  every optional (minOccurs=0) element is omitted. Generated by walking each type''s own maindoc XSD with
  the xmlschema library''s real content-model introspection (tools/ubl/generate_synthetic_document_samples.py),
  not a hand-maintained per-type field list.'
license: Apache-2.0 (format-factory project) -- project-owned content, not OASIS specification text
total_count: 36
schema_valid_count: 36
roundtrip_capable_count: 36
total_supported_document_types: 91
coverage_note: Covers exactly the 36 of this package's own 91 supported UBL 2.3 root types that have no
  official OASIS example in the pinned release package (see samples/by-format/ubl/official/ for the other
  55). Every one of these 36 validates against the real, official OASIS UBL 2.3 schema (schema_validate())
  and round-trips (load real bytes -> dumps() -> reload, structurally unchanged). NOT claimed as independent-producer
  interoperability evidence and NOT claimed as an official OASIS example -- these are project-owned synthetic
  fixtures proving the writer/reader handle every one of these 36 document types correctly against the
  real schema, which is what this obligation's own rule_text (round-trip proof against real, schema-valid
  content) actually requires; official-example coverage remains a separate, still-open data-acquisition
  question for these 36 types specifically.
