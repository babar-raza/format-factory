    sha256: 5e7af27b318238d0dffc332cd619556df0f09bac615c9e9cb077a307d623d6bb
    verified_this_tick: >-
      format_factory.ubl.load() parses this file successfully (it is well-formed XML with a
      recognized Invoice root), and validate() currently reports is_valid=True -- this sample
      does NOT actually trigger a validation error today, contradicting this entry's own prior
      error_detection_rate claim below. validate()'s own docstring says so directly: "This
      chassis validation is deliberately not an XSD-conformance claim. Full schema and
      cardinality validation remains a mandatory open obligation" -- root-level mandatory-child
      presence (as opposed to the cardinality checks already built for specific already-present
      aggregate components like TaxTotal/InvoiceLine) is one of the still-open parts of that
      obligation (UBL-VALIDATE-001). Left as a genuine sample fixture and an honest, disclosed
      gap rather than silently deleted or force-fixed -- fixing it would mean building the
      broader mandatory-cardinality validation feature UBL-VALIDATE-001 itself still needs,
      out of scope for a corpus-gate evidence tick.

