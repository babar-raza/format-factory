# All QOI corpus samples are project-owned synthetic, generated via Python
# standard library (struct + bytes) with no third-party dependencies.
# QOI format is fully specified at qoi.phoboslab.org (MIT).
# Generation script: .local/gen_samples.py (ephemeral, gitignored)
# Encoding: 14-byte header + QOI_OP_RGBA (0xFF) literal chunks + QOI_OP_RUN (0xC0|run-1)
# + 8-byte end marker (7x 0x00 + 0x01). All files are fully deterministic.

