# All NRRD corpus samples are project-owned synthetic, generated via Python
# standard library (struct + gzip + bytes) with no third-party dependencies.
# NRRD format is specified at http://teem.sourceforge.net/nrrd/format.html.
# Generation script: .local/gen_samples.py (ephemeral, gitignored)
# Encoding: ASCII header lines terminated by blank line, followed by raw or
# gzip-compressed binary data. All files are fully deterministic.

samples:
