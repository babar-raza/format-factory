unsupported_capabilities:
  - Cell/character style inheritance
  - Text field extraction (text:date, text:time, etc. — detected only)
  - Embedded frames/images (detected but not extracted)
  - Footnote/endnote body extraction (detection and count via document_footnote_count; body text not extracted)
  - Track changes / revisions
  - Password-protected FODT
  - Table cell styles and column widths

security_limits:
  - MAX_FILE_BYTES: 100 MiB
  - XXE protection via defusedxml (fallback: stdlib ElementTree)
  - No macro execution (office:scripts detected, never run)
  - Iterparse streaming: direct office:text children processed one at a time

dependencies:
  runtime: []
  dev:
    - pytest>=8.0
    - defusedxml>=0.7  # optional but recommended

license: Apache-2.0
spec_license: OASIS ODF 1.3 (open standard)

