  - write_fodt() / document_to_xml() — round-trip write API
  - Inline span preservation: text:span with style-name (R55 TC-0057)
  - Hyperlink preservation: text:a with xlink:href (R56 TC-0057 criterion 3)
  - Nested list hierarchy: level-stack algorithm (R56 TC-0059 criterion 2)
  - Table preservation: table:table/table:table-row/table:table-cell (R54 TC-0058)
  - Document ordering: content sequence preserves blocks/lists/tables order (R55 TC-0060)
  - document_stats() — block/heading/list/table/hyperlink counts (R57)
  - document_reading_level() — Flesch-Kincaid readability estimation (R57)
  - document_hyperlink_count() — hyperlink count per block and total (R62)
  - document_footnote_count() — footnote/endnote detection and count (R62)

