format_id: fodg
package_name: aspose-format-factory-fodg
module_import: fodg
version: 0.1.0.dev0
source_path: src/python/fodg/
tests_path: tests/python/fodg/
examples_path: examples/python/fodg/

acquisition_gates_passed:
  - gate: 1
    status: passed
    notes: "Format authorized — ODF 1.3 OASIS RF Category 1"
  - gate: 2
    status: passed_fast_path
    notes: "ODF family spec shared"
  - gate: 3
    status: passed
    notes: "Sample corpus (3 samples)"
  - gate: 4
    status: passed
    notes: "Parser prototype (12 tests)"
  - gate: 5
    status: passed_fast_path
    notes: "ODF spec family shared — same namespace/schema"
  - gate: 6
    status: passed_planning
    notes: "Oracle plan: LibreOffice Draw → SVG/PDF"
  - gate: 7
    status: passed
    notes: "XXE-safe, 64 MiB guard"

unsupported_capabilities:
