unsupported_capabilities:
  - Full visual style fidelity (colors, fonts, borders, column widths round-trip)
  - Conditional formatting
  - Charts and embedded objects
  - Named ranges
  - Data validation
  - Password-protected FODS
  - Multi-level merged cells (partial: is_covered flag only; merge metadata via workbook_merged_cell_summary)
  # Note: Raw style metadata XML (office:automatic-styles, office:styles) IS preserved
  # verbatim on round-trip (TC-0055 CLOSED R55). Only visual fidelity is unsupported.

security_limits:
  - MAX_FILE_BYTES: 100 MiB
  - XXE protection via defusedxml (fallback: stdlib ElementTree)
  - No macro execution (office:scripts detected, never run)
  - Iterparse streaming: max one element held in memory at a time

dependencies:
  runtime: []
  dev:
