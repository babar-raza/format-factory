# Flaky Test Ledger — Format Factory
# Created: 2026-06-18
# Plan: optimized-sauteeing-hellman (supplemental infrastructure)
#
# Tracks tests that are non-deterministically failing — i.e., tests that
# sometimes pass and sometimes fail without code changes. Distinguish from:
# - Pre-existing known failures (registry/known-failures.yaml): always fail
# - Collection errors: fail because source function not yet implemented
#
# Policy: A test is "flaky" when it fails in >=2 of 10 runs with NO code changes.
# Investigation is required before a test can be classified as flaky.
#
# Severity levels:
#   critical: Blocks sprint closes. Must be quarantined immediately.
#   high:     Reduces grade confidence. Should be investigated next sprint.
#   medium:   Monitor for repeat occurrences.
#   low:      Track for now; no immediate action.

version: 1
