schema_version: "2.0"
description: >
  Governance whitelist for V87 (constant-return public APIs), V90 (setter without
  XML write), and V91 (getter without XML read). Entries are grandfathered violations
  from before V87/V90/V91 became blocking. New violations must be implemented from
  ODF XML or justified before being added here.
  Schema 2.0: each entry is a structured record with governance fields:
    method: FULLY_QUALIFIED_NAMESPACE.ClassName.MethodName
    approved_by: who approved the exception (or "pre-existing-grandfathered")
    approved_date: ISO-8601 date
    review_due: ISO-8601 date (V_WHITELIST_EXPIRY fires WARN 30 days before, FAIL after)
    removal_condition: when the entry can be removed
  All entries require a justification comment.

known_constant_return_ok:
  # FodsDocument property defaults — init-only / schema-defined constants, not APIs.
  # These are properties or methods where a constant is the correct architectural answer.
  #
  # Grandfathered violations (TC-FGSQ-004, 2026-07-11): enumerated from HEAD before
  # V87 was made blocking for all declaration types. Future constant-return methods
  # must either be architecturally justified here or be implemented from ODF XML.

  - method: "FormatFactory.Fods.FodsDocument.GetPrintAreaCount"
    approved_by: "pre-existing-grandfathered"
    approved_date: "2026-07-11"
    review_due: "2027-01-11"
    removal_condition: "implement XML path via table:print-range or replace with NotSupportedException"
    # GetPrintAreaCount: ODF does not have a native count attribute for print areas;
    # the current implementation returns 0 as a known architectural placeholder.
    # GAP-NET-XG-012 tracks future implementation.

