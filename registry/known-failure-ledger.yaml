# Known Failure Ledger — Format Factory
# Created: 2026-06-18
# Sprint: format-factory-fullsuite-layering-20260618-001
#
# This ledger tracks pre-existing test failures that are expected under
# specific environment conditions. Failures in this ledger do NOT block
# taskcard closure. New failures (not in this ledger) DO require investigation.
#
# Usage: python tools/test_runner.py --layer N --known-failures registry/known-failure-ledger.yaml
# Format: YAML with known_failures list of {test_id, reason, condition, mitigation}

version: 1
created_at: "2026-06-18"
last_updated: "2026-06-18"
source: "docs/test-layering.md §Known Environment-Dependent Test Failures"

known_failures:
