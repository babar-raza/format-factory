known_failures:
- test_id: tests/evidence/test_auto_proof_bundle.py
  reason: Requires clean git working tree. Fails on dirty working tree (uncommitted
    changes).
  condition: dirty_working_tree
  mitigation: Run pytest with --no-state flag, or commit/stash all changes before
    running L3.
  layer: 3
  first_documented: pre-sprint (documented in docs/code-quality/test-layering.md)
  category: environment_dependent
- test_id: tests/supervisor/test_r113_ai_learning_loop.py
  reason: Makes real SSL/network calls; may timeout without internet connectivity
    or with slow network.
  condition: network_unavailable_or_slow
  mitigation: Ensure stable internet connectivity, or run with --timeout=60 to bound
    the test.
  layer: 3
  first_documented: '2026-06-18'
  category: network_dependent
