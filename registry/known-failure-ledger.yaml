# Gap tests (collection errors, not test failures)
# These are NOT failures — they are ImportErrors at collection time for
# unimplemented functions. They are tracked separately.
gap_test_notes:
  description: >
    Every format directory in tests/python/ contains gap tests — tests for functions
    that are not yet implemented in the source. These cause ImportError at collection
    time (ERROR, not FAIL). After HEAL-003 adds --continue-on-collection-errors,
    remaining tests in the directory still execute.
  affected_formats:
    - fods  # 32 collection errors (catalogued in known_failures above, 2026-06-21)
    - csv   # 32 collection errors (catalogued in known_failures above, TC-HARD-004d 2026-06-21)
    - dif   # 30 collection errors (catalogued in known_failures above, TC-HARD-004d 2026-06-21)
    - tsv   # ~31 collection errors
    - (all other formats have similar patterns)
  mitigation: "--continue-on-collection-errors flag (now default in test_runner.py after HEAL-003)"
  not_failures: true
