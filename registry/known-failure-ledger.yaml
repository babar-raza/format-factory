    reason: "Requires clean git working tree. Fails on dirty working tree (uncommitted changes)."
    condition: "dirty_working_tree"
    mitigation: "Run pytest with --no-state flag, or commit/stash all changes before running L3."
    layer: 3
    first_documented: "pre-sprint (documented in docs/test-layering.md)"
    category: "environment_dependent"

