- issue_id: FI-017
  stable_semantic_key: "capability_compiler:implicit_syspath_resolution:capability_queue_consumer.py:fragile_not_wrong"
  status: verified
  discovered_at: "2026-07-14T00:00:00Z"
  discovering_task_id: "TC-EXT-002 (yes-my-earlier-answer-humming-waffle plan); root cause REVISED under TC-EXT-002-REMEDIATION-001 (plans/.claude/tc-ext-002-remediation-addendum.md) 2026-07-15"
  issue_type: import_error
  affected_component: capability_compiler
  affected_paths:
    - tools/supervisor/capability_queue_consumer.py
    - tools/supervisor/capability_compiler.py
    - tools/capability_layer/capability_compiler.py
  observed_behavior: >
    CORRECTED 2026-07-15 (see plans/.claude/tc-ext-002-remediation-addendum.md Finding B):
    the ORIGINAL observed_behavior/expected_behavior recorded here (and DEC-036's flagged
    finding) claimed capability_queue_consumer.py's sys.path insertion order caused it to
    load the WRONG module (tools/capability_layer/capability_compiler.py, L03) instead of
    the intended tools/supervisor/capability_compiler.py (L14). Direct re-investigation
    proved this claim FALSE: tools/capability_layer/capability_compiler.py:561-566 contains
    an explicit "Backward-compatible API (TC-CAP-011/TC-C8)" section built specifically for
    this consumer, and tests/capability_layer/test_end_to_end_pipeline.py:14-16 deliberately
    replicates the same sys.path order to get the same resolution — proving the current
    (L03) target is the CORRECT, intended, tested one. The only real defect was that this
    correct resolution depended on implicit sys.path insertion order across two files
    sharing a basename, with no test pinning which module actually loaded — a future
    unrelated reordering could have silently rerouted to L14's incompatible shape with no
    import error.
  expected_behavior: >
    capability_queue_consumer.py should load tools/capability_layer/capability_compiler.py
    (the CONFIRMED correct target) via an explicit importlib.util.spec_from_file_location
    load under a disambiguating module name, instead of relying on sys.path insertion order
    to win a same-basename collision. Implemented 2026-07-15.
  severity: P3
  reproducibility: ALWAYS_REPRODUCIBLE
  root_cause_id: RC-FIO-005
  healing_taskcard_id: "TC-TCEXT002-01 (plans/.claude/tc-ext-002-remediation-addendum.md)"
  verification_verdict: >
    tools/supervisor/capability_queue_consumer.py:41-67 now loads
    tools/capability_layer/capability_compiler.py via importlib.util.spec_from_file_location
    under the synthetic name "capability_layer_compiler", pinning the target regardless of
    sys.path state. Verified via: (1) direct execution confirming
    compile_gap_to_feature_ir.__module__ == "capability_layer_compiler" and __file__ resolves
    to tools/capability_layer/capability_compiler.py; (2) 2 new regression tests in
    tests/supervisor/test_capability_queue_consumer.py pinning the resolved module identity
    and output shape; (3) full regression — 89/89 tests pass across
    tests/capability_layer/test_end_to_end_pipeline.py,
    tests/capability_layer/test_supervisor_invokes_compiler.py,
    tests/supervisor/test_capability_queue_consumer.py,
    tests/supervisor/test_capability_wire_tc_wire_001.py,
    tests/supervisor/test_deterministic_gap_selection.py, tests/supervisor/test_gap_selection.py,
    tests/supervisor/test_taskcard_execution_proof.py,
    tests/supervisor/test_tc_c3_003_action_queue_activation.py,
    tests/supervisor/test_tc_deferred_filter_001.py — zero behavior change, confirmed
    2026-07-15.
  disposition: HEALED_AND_VERIFIED
  closed_at: "2026-07-15T00:00:00Z"
