version: 1
root_causes:

- root_cause_id: RC-FIO-005
  title: "R90 product-code ledger mixes historical schemas with current proof records"
  first_failing_boundary: "validate_product_code_ledger.validate_ledger source_files iteration"
  local_cause: >-
    The validator assumed every entries[].source_files item was a mapping,
    although historical test-coverage and old sprint entries store strings or
    omit current proof fields.
  systemic_cause: >-
    The append-only historical ledger was never separated into a materialized
    current proof projection. Callers scanned the entire mixed-schema history
    as if every record were current and SHA-bound.
  affected_producer: "R90 historical product-code-change-ledger accumulation"
  affected_consumers:
    - tools/supervisor/validate_product_code_ledger.py
    - tools/supervisor/autonomous_cycle.py
    - reports/r90/product-code-change-ledger.json
    - six-format production proof and promotion calculations
  recurrence_path: >-
    Any future legacy append or current proof validation will either crash or
    misclassify historical evidence until a versioned current-entry projection
    and migration path are enforced.
  confidence: HIGH
  issue_ids:
    - FI-033
  repair_skill_id: found-issue-ownership
  status: mitigated

- root_cause_id: RC-FIO-001
  title: "Stale test fixture parametrize lists after analytics separation migration"
  first_failing_boundary: "tests/governance_pilots/test_separation_pilots.py (parametrize lists)"
  local_cause: "test_separation_pilots.py was not updated when domain model files were renamed/deleted during analytics separation (PQLM-GOV-001)"
  systemic_cause: "The analytics separation skill (/extract-analytics-from-monolith) did not include a step to update test fixture parametrize lists when renaming or deleting domain model files"
  affected_producer: "extract-analytics-from-monolith skill"
  affected_consumers:
    - "tests/governance_pilots/test_separation_pilots.py::TestNoDuplicates"
    - "tests/governance_pilots/test_separation_pilots.py::TestSpecQName"
  recurrence_path: "Any future analytics separation that deletes or renames a domain model file without updating test_separation_pilots.py will reproduce this"
  confidence: HIGH
  issue_ids:
    - FI-001
    - FI-002
    - FI-003
    - FI-004
  repair_skill_id: found-issue-ownership
  status: healed

- root_cause_id: RC-FIO-002
  title: "PQLM-GOV-001 and ARC-QNAME-001 added fields/code exceeding frozen LOC caps"
  first_failing_boundary: "registry/source-structure-baseline.json (frozen baseline_loc_cap entries)"
  local_cause: "PQLM-001 added full domain model fields to models.py files and ARC-QNAME-001 added Compat facade fields; total LOC grew beyond frozen caps"
  systemic_cause: "LOC caps were frozen before PQLM-001 and ARC-QNAME-001 work; the sprint executor did not require LOC cap verification before committing expanded files"
  affected_producer: "PQLM-GOV-001 sprint / ARC-QNAME-001 sprint"
  affected_consumers:
    - "tests/test_source_structure.py::test_no_loc_regression"
  recurrence_path: "Any sprint that adds fields to existing Python source files without checking baseline_loc_cap will reproduce this"
  confidence: HIGH
  issue_ids:
    - FI-008
  repair_skill_id: null
  status: open

- root_cause_id: RC-FIO-003
  title: "Governed FODS/CSV .NET split work grew files past their post-split baseline caps"
  first_failing_boundary: "registry/source-structure-baseline.json (frozen baseline_loc_cap for .cs files)"
  local_cause: "FODS XML grounding (FODS-NET-XG-001+002) and PQLM-GOV-001 CSV split created/grew .cs files that were capped at creation size; subsequent feature additions pushed them past those caps"
  systemic_cause: "The V78 reactive scanner only checks changed_files in the declaration; if a file grows between declarations (no sprint declares it changed), V78 misses it. V130 static scan (added in this mission) now surfaces this silent drift."
  affected_producer: "FODS-NET-XG-001 sprint / PQLM-GOV-001 sprint"
  affected_consumers:
    - "V130 (validate_dotnet_loc_cap_static)"
  recurrence_path: "Any .NET sprint that adds methods to existing split files without checking baseline_loc_cap will reproduce this"
  confidence: HIGH
  issue_ids:
    - FI-010
    - FI-011
    - FI-012
    - FI-013
  repair_skill_id: null
  status: open

- root_cause_id: RC-FIO-004
  title: "IPYNB corpus validation conflated normalized model acceptance with immutable source validity"
  first_failing_boundary: "samples/by-format/ipynb/_corpus-manifest.yaml structural_test PASS declarations"
  local_cause: >-
    The synthetic generator emitted nbformat 4.5 cells without the cell IDs
    required since minor version 4.5, while retaining a 4.5 declaration.
  systemic_cause: >-
    Corpus checks exercised legacy probes/loaders and the official reference
    implementation's normalizing validate path, then treated the repaired
    in-memory object as evidence that original bytes were valid. No mandatory
    pre-normalization exact-schema check bound the validity label, manifest,
    oracle case, and fixture digest together.
  affected_producer: "CORPUS-MANIFEST-BACKFILL-2026-07-14 synthetic IPYNB corpus pipeline"
  affected_consumers:
    - samples/by-format/ipynb/_corpus-manifest.yaml
    - samples/by-format/ipynb/_provenance.yaml
    - oracle/formats/ipynb/oracle-package.yaml
    - oracle/formats/ipynb/reports/oracle-run-summary.json
    - tests/python/ipynb/test_ipynb_codec.py
    - tests/python/ipynb/test_ipynb_validation.py
    - tests/python/ipynb/test_ipynb_cell_id.py
    - tests/python/ipynb/test_ipynb_analytics.py
    - tests/python/ipynb/test_ipynb_analytics_coverage.py
    - tests/python/ipynb/test_ipynb_compat_facades.py
    - tests/python/ipynb/test_ipynb_mutation_api.py
    - tests/python/ipynb/test_ipynb_document_mutation.py
    - tests/python/ipynb/test_ipynb_to_csv.py
  recurrence_path: >-
    Any corpus pipeline that parses, upgrades, repairs, or normalizes a fixture
    before evaluating declared-profile validity can repeat the false-positive
    evidence chain, even when every downstream behavioral test passes.
  confidence: HIGH
  issue_ids:
    - FI-032
  repair_skill_id: format-feature-expansion
  supporting_skill_ids:
    - quarantine-invalid-artifact
    - found-issue-ownership
  status: healed
