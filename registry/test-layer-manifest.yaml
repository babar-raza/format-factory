# Test Layer Manifest — Format Factory
# Machine-readable mapping: layers, format families, and change-impact rules.
# Consumed by tools/test_runner.py for auto-detection and layer selection.

# Named validation lanes for autonomous trains (fast/medium/full).
# These are aliases over the layer0-6 system for CI lane selection.
# Consumed by agent policy and tools/test_runner.py --lane <name>.
named_lanes:
  fast:
    description: "Unit tests only — no file I/O, no network, no oracle"
    max_time_seconds: 30
    includes_layers: [0, 1]
    pytest_marks: "not slow and not roundtrip and not oracle"
    use_case: "Per-commit gate; autonomous trains between sprints"
  medium:
    description: "Unit + roundtrip tests on minimal samples"
    max_time_seconds: 120
    includes_layers: [0, 1, 2, 4]
    pytest_marks: "not oracle and not property_based and not security"
    use_case: "Pre-closeout validation; format-specific deepening"
  full:
    description: "Entire test suite including oracle, property-based, security"
    max_time_seconds: null
    includes_layers: [0, 1, 2, 3, 4, 5, 6]
    pytest_marks: ""
    use_case: "Release gates; certification; sprint acceptance"

layers:
  layer0:
    name: structural
    description: "Health check, import smoke, conftest validity"
    max_time_seconds: 5
  layer1:
    name: focused
    description: "Single-format unit tests for the changed format"
    max_time_seconds: 30
  layer2:
    name: family
    description: "All formats in the same family"
    max_time_seconds: 60
  layer3:
    name: integration
    description: "Supervisor, governance, evidence, capability_layer"
    max_time_seconds: 120
  layer4:
    name: golden
    description: "Roundtrip, cross-format, export, dogfood tests"
    max_time_seconds: 180
  layer5:
    name: broad
    description: "All python + supervisor + evidence + packaging + skills + ai"
    max_time_seconds: 600
  layer6:
    name: full
    description: "Entire test suite"
    max_time_seconds: 900

format_families:
  netpbm: [pbm, pgm, ppm]
  opendocument_spreadsheet: [fods, ods]
  opendocument_text: [fodt, odt, abw]
  opendocument_graphics: [fodg]
  tabular: [csv, tsv, sylk, dif, gnumeric]
  image: [pbm, pgm, ppm, qoi, xcf]
  archive: [zst]
  structured: [ndjson, toml]

# Change-impact matrix: file pattern -> minimum required layer.
# Patterns are matched top-to-bottom; first match wins.
# The runner extracts format names from {format} path segments.
change_impact:
  # Documentation only — structural sanity suffices
  - pattern: "docs/**"
    min_layer: 0
  - pattern: "reports/**"
    min_layer: 0
  - pattern: "plans/**"
    min_layer: 0
  - pattern: "*.md"
    min_layer: 0
  - pattern: "CHANGELOG.md"
    min_layer: 0

  # Product source — focused format tests
  - pattern: "src/python/*/[!_]*.py"
    min_layer: 1
    format_from: path_segment_2
  - pattern: "src/python/**"
    min_layer: 1
    format_from: path_segment_2

  # Format-specific tests
  - pattern: "tests/python/*/test_*.py"
    min_layer: 1
    format_from: path_segment_2

  # Supervisor / governance / evidence
  - pattern: "tools/supervisor/**"
    min_layer: 3
  - pattern: "tests/supervisor/**"
    min_layer: 3
  - pattern: "tests/evidence/**"
    min_layer: 3
  - pattern: "tests/capability_layer/**"
    min_layer: 3
  - pattern: "registry/**"
    min_layer: 3
  - pattern: "schemas/**"
    min_layer: 3

  # AI tools — integration level
  - pattern: "tools/ai/**"
    min_layer: 3

  # Broad — shared infrastructure
  - pattern: "tools/*"
    min_layer: 5
  - pattern: "tests/python/conftest.py"
    min_layer: 5
  - pattern: "src/net/**"
    min_layer: 5

  # Full suite — build/CI/config changes
  - pattern: "pyproject.toml"
    min_layer: 6
  - pattern: ".github/**"
    min_layer: 6
  - pattern: "tests/conftest.py"
    min_layer: 6
  - pattern: ".pre-commit-config.yaml"
    min_layer: 6

  # Default: unrecognized paths escalate to full suite (fail-safe)
  - pattern: "_default"
    min_layer: 6

# Shards for Layer 6 execution
shards:
  1:
    path: "tests/python/"
    description: "Format codec tests"
  2:
    path: "tests/supervisor/"
    description: "Supervisor pipeline tests"
  3:
    path: "tests/evidence/"
    description: "Evidence validation tests"
  4:
    path: "tests/"
    ignore:
      - "tests/python"
      - "tests/supervisor"
      - "tests/evidence"
    description: "Everything else (packaging, skills, ai, playbook, etc.)"


# Cross-format test resolution — consumed by tools/test_runner.py --auto
# When a format F is detected in changed files, the runner ALSO includes all
# files listed under format_to_tests[F] in registry/cross-format-test-index.yaml.
# This prevents cross-format deepening tests from being silently skipped when a
# single format's source changes.
cross_format_resolution:
  index_path: "registry/cross-format-test-index.yaml"
  escalation_layer: 4
  # escalation_layer: when cross-format tests exist for a changed format,
  # the effective layer escalates to max(detected_layer, escalation_layer).
  # This ensures cross-format tests are assigned to golden/L4 scope, not just L1.
  note: >
    The index is generated by tools/build_cross_format_index.py.
    Regenerate after adding new deepening or dogfood test files.

# Agent governance rules — machine-readable
# enforcement: advisory_only
# No code in tools/ or tests/ reads this block as of 2026-06-18.
# These rules are enforced by agent self-regulation only. Machine enforcement
# is a planned follow-on work item (see gap-ledger entry GOV-ENFORCE-001).
# Consumed by agent policy enforcement (advisory as of 2026-06-18; schema enforcement planned)
# enforcement: advisory_only  ← TC-H-ENFORCE-001 formal declaration. No code reads this block.
# Machine enforcement gap tracked as GOV-ENFORCE-001 in reports/capability-layer/gap-ledger.json.
agent_governance:
  prohibited_claims:
    - after_layer: 0
      cannot_claim:
        - "format tests pass"
        - "governance tests pass"
        - "family regression tested"
        - "integration verified"
    - after_layer: 1
      cannot_claim:
        - "family regression tested"
        - "cross-format validated"
        - "integration verified"
    - after_layer: 3
      cannot_claim:
        - "golden/roundtrip validated"
        - "full suite pass"
    - after_layer: 5
      cannot_claim:
        - "full suite pass"
    - after_partial_shards: true
      cannot_claim:
        - "full suite pass"
  escalation_triggers:
    - change_in:
        - "src/python/_shared/**"
        - "tools/test_runner.py"
      escalate_to: 5
    - change_in:
        - "pyproject.toml"
        - ".github/**"
        - "tests/conftest.py"
      escalate_to: 6
  schema_enforcement_status: "ADVISORY_ONLY"
  schema_enforcement_note: >
    test_layer, full_suite_required, and full_suite_run fields in
    evidence-declaration.yaml are not validated by autonomous-cycle as of
    2026-06-18. Enforcement is agent self-regulation via this manifest and
    docs/code-quality/test-layering.md.
  ledger_references:
    known_failure_ledger: "registry/known-failure-ledger.yaml"
    slow_test_ledger: "registry/slow-test-ledger.yaml"
