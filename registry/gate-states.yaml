---
# Gate States Registry — Format Factory
# Created: TC-GFB-022 (FF-MR-2026-001, 2026-07-11)
# Authoritative: plans/.claude/golden-foraging-boot.md
# Purpose: Machine-readable per-product, per-language gate state tracking.
# Check 11 in check_continuation.py reads this file to emit BLOCKED_EXTERNAL
# for products with P1-P10 met but P11 (Babar Raza authorization) pending.
schema_version: "1.0"
created_at: "2026-07-11"
implementing_tc: TC-GFB-022

gate_states:
  - state_id: GATE_11_READY
    description: >
      Product meets all Gate 11 criteria (P1-P10 for Python, C1-C6 for .NET) and
      is pending Babar Raza commercial authorization (P11/C20 = TRUE_EXTERNAL_GATE).
    entry_criteria:
      - "Oracle VERIFIED at D1+ depth (P1)"
      - "All governance validators pass exit 0 (P2)"
      - "pyproject.toml present and valid (P3)"
      - "Package installs cleanly via pip install (P4)"
      - "Consumer roundtrip proof exists (P5)"
      - "spec_qname ClassVar in all domain classes (P6)"
      - "py.typed marker present (P7)"
      - "All dogfood exports functional (P8)"
      - "Analytics module LOC <= 800 (P9)"
      - "No known_violations in source-structure-baseline.json at cap (P10)"
    exit_criteria:
      - "Babar Raza grants Gate 11 G11-G authorization (P11)"
    per_product: true
    per_language: true
    blocks_autonomous_continue: true
    allows_other_products_to_continue: true
    stop_reason: GATE_11_READY_PENDING_AUTHORIZATION
    stop_classification: BLOCKED_EXTERNAL
    implementation_note: >
      When a product enters GATE_11_READY state, Check 11 in check_continuation.py
      emits STOP(reason=GATE_11_READY_PENDING_AUTHORIZATION) for that product only.
      Other products without GATE_11_READY status may continue autonomous deepening.

  - state_id: NOT_READY
    description: "Product has not yet met all Gate 11 P1-P10 criteria. Autonomous deepening continues."
    per_product: true
    per_language: true
    blocks_autonomous_continue: false

  - state_id: GATE_11_AUTHORIZED
    description: "Babar Raza has granted Gate 11 G11-G authorization. Product ready for publication."
    per_product: true
    per_language: true
    blocks_autonomous_continue: false
    stop_reason: null

