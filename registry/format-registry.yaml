          rationale: "OASIS ODF 1.3 is published under the OASIS royalty-free patent policy; no licensing fees or patent barriers for implementors."
        spec_availability:
          score: 3
          points: 20
          rationale: "ODF 1.3 specification is comprehensive, covers all XML structures and constraints, actively maintained by OASIS TC, and freely accessible at docs.oasis-open.org in HTML and PDF forms."
        parseable_structure:
          score: 3
          points: 15
          rationale: "FODS is a single flat XML file with no ZIP container or compression layer; standard XML parsers handle it directly, making it structurally simpler than ODS."
        community_demand:
          score: 2
          points: 10
          rationale: "FODS has moderate demand — used primarily by developers requiring human-readable, version-control-friendly spreadsheet files; supported by LibreOffice and Apache OpenOffice, though less common than ODS in production use."
        strategic_track_value:
          score: 3
          points: 10
          rationale: "FODS is the first acquisition in the Cells family and the validated pilot for the entire acquisition pipeline; success validates architecture and opens the ODF family (ODS, FODT, FODP, FODB) for follow-on acquisitions."
        implementation_complexity:
          score: 2
          points: 3
          rationale: "FODS removes the ZIP layer but ODF XML semantics remain complex — styles inheritance, formula syntax (OpenFormula), conditional formatting, and merged cells require meaningful parser work at higher tiers."
        family_overlap:
          score: 3
          points: 5
          rationale: "FODS is the first format in the registry; there is no overlap with any existing format. It is complementary to future ODF family acquisitions."
      total_points: 93
