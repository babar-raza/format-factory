  scoring_notes: 'FODT is the flat-XML variant of the OASIS ODF text document format. Legal Category 1 (OASIS royalty-free).

    Same spec body as FODS (ODF 1.3). Flat XML structure; paragraph/style model is more complex than FODS cells.

    Opens the Words family. Estimated ~40-50% FODS pipeline reuse effort.

    Total score: 88/100 (Accept band). Scored run039, DEC-034 verified run040. See TC-0029 for scoring evidence.

    '
  visibility: internal
  scoring:
    scorer: claude-sonnet-4-6
    scored_date: '2026-05-07'
    model_version: 7-factor-100pt-v1
    automatic_reject_check:
      legal_category_classified: true
