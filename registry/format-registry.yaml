    legal_category: 1
    tier_target: 4
    scoring_notes: |
      FODS is the flat-XML variant of the OASIS ODF spreadsheet format. Legal Category 1 (OASIS royalty-free).
      Comprehensive spec from OASIS TC. Flat XML structure is simpler to parse than ZIP-based ODS.
      Moderate community demand (developer/debug/VCS use case). First acquisition in Cells family — high strategic value.
      Total score: 93/100 (Accept band). See TC-0001 for full scoring sheet.
    visibility: internal
    scoring:
      scorer: claude-sonnet-4-6
