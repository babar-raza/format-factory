        rationale: OASIS ODF 1.3 royalty-free RF — same legal basis as FODS Gate 2 legal-notes.md (passed Babar Raza 2026-05-05).
          No royalties, no patent restrictions.
      spec_availability:
        score: 3
        points: 20
        rationale: ODF 1.3 spec already cached (24.27 MB, sha256:92cfe64..b066), normalized (782 pages, 884 sections). Same
          spec body as FODS.
      parseable_structure:
        score: 2
        points: 10
        rationale: Flat XML (no ZIP), stdlib-parseable, but paragraph/style inheritance adds complexity vs FODS cells. ElementTree
          approach reusable.
      community_demand:
        score: 2
        points: 10
        rationale: Moderate demand — VCS-friendly technical writing, LibreOffice Writer native, CI/CD documentation pipelines.
          Less widespread than ODT zip variant.
      strategic_track_value:
        score: 3
        points: 10
        rationale: Opens Words family. Second ODF flat acquisition validates pipeline reuse pattern. High strategic value.
      implementation_complexity:
        score: 2
        points: 3
        rationale: 'Extends FODS parser patterns (ElementTree, namespace handling). New work: paragraph/heading extraction,
          list handling, basic style resolution.'
      family_overlap:
        score: 3
        points: 5
        rationale: FODS = Cells family. FODT = Words family. Zero functional overlap. Different neutral model, different pipeline
          targets.
    total_points: 88
    band: accept
    recommendation: Accept. Legal Category 1, comprehensive spec already cached and normalized, moderate complexity, opens
