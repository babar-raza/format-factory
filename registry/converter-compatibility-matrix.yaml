schema_version: '1.0'
taskcard: TC-PA-008
validator: V251
mission_id: PORTFOLIO-AUDIT-2026-07-16
authority: 'Information-model compatibility classification for every converter module under src/python/.
  V251 FAILs on any *_to_*.py module with no entry here. This registry is the gate /add-dogfood-export
  never had: it forces the question ''does this conversion carry meaning?'' to be answered before code
  is generated (TC-PA-009 wires it in).'
categories:
  COMPATIBLE: Source and target share an information model. Structure-preserving.
  PROJECTION: Different models, defensible documented mapping, known loss.
  INCOMPATIBLE: "No semantic relationship; the implementation must invent structure absent from the source.\
    \ Should not exist \u2014 TC-PA-015 disposition."
scope_limit: 'V251 gates the DECLARED relationship of a format pair, derived from format domains. It does
  NOT read converter bodies: a faithful PROJECTION and a lazy one are indistinguishable to it. Implementation
  semantics remain ungated (TC-PA-016).'
