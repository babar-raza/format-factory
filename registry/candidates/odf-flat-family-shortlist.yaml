# No acquisition pack may be created for these candidates until:
#   1. This shortlist is independently verified.
#   2. A human explicitly approves beginning Gate 1 scoring for a specific candidate.
#
# Source of evaluation evidence: existing FODS acquisition materials,
# ODF 1.3 spec (cached at .local/spec-cache/fods/1.3/), and public knowledge.
# No new spec downloads were made for this shortlist.
#
# Created: run038 (2026-05-07)
# Authorized by: run038 execution prompt (human-authorized)

shortlist_id: odf-flat-family-run038
created: "2026-05-07"
status: candidate_only
gate_1_approved: false
gate_1_approval_required_before: "any acquisition pack creation or official registry entry"

# Pipeline reuse potential from FODS acquisition:
# - ODF 1.3 spec is already cached and normalized (.local/spec-cache/fods/1.3/)
# - Spec Navigation Layer built: 884 sections, 940 chunks (run026)
# - Oracle provider: LibreOffice approved (same tool for all ODF flat variants)
# - Evidence contract system: reusable run038 contract templates
# - Neutral model patterns: Cells family model at schemas/neutral-model/fods/ can inform siblings
# - Sample/prototype/evidence workflow: fully documented in acquisition-packs/fods/

candidates:
  - candidate_id: fodt
    display_name: "Flat OpenDocument Text"
    family: words
    extensions: [.fodt]
    mime_type: "application/vnd.oasis.opendocument.text-flat-xml"
    spec_body: "OASIS"
    spec_version: "ODF 1.3"
    legal_category: 1
    preliminary_score_estimate:
      legal_safety: "30/30 — OASIS Category 1 RF (same as FODS)"
      spec_availability: "20/20 — same ODF 1.3 spec (Part 2: Packages)"
      parseable_structure: "13-15/15 — flat XML, no ZIP layer, slightly more complex than FODS due to paragraph/style inheritance"
      community_demand: "8-10/10 — FODT is widely used for version-control-friendly documents"
      strategic_track_value: "10/10 — second ODF flat format; validates ODF pipeline reuse"
      implementation_complexity: "2-3/3 — paragraph/style model more complex than spreadsheet cells"
      family_overlap: "4-5/5 — reuses FODS pipeline; extends into Words family"
      estimated_total: "87-93/100"
      band: accept
      confidence: supported_by_existing_project_evidence
    pipeline_reuse:
      spec_cache: "YES — ODF 1.3 spec already cached (FODT uses same Part 2 spec)"
      normalization: "YES — same spec, existing normalized text applies"
      oracle_provider: "YES — LibreOffice supports FODT natively"
      evidence_contracts: "YES — reuse run038 contract templates"
      sample_pattern: "YES — synthetic flat XML samples following FODS pattern"
      neutral_model: "PARTIAL — Words family model needed (separate from Cells)"
    notes: "FODT is the flat XML equivalent of ODT. Same legal/spec basis as FODS. Strong candidate for next acquisition. Main complexity: rich text formatting, paragraph styles, character styles — more complex than spreadsheet cells but structurally similar at the XML level."
    recommendation: "HIGH PRIORITY — recommend as next acquisition after Gate 6 FODS completes"

  - candidate_id: fodp
    display_name: "Flat OpenDocument Presentation"
    family: slides
    extensions: [.fodp]
    mime_type: "application/vnd.oasis.opendocument.presentation-flat-xml"
    spec_body: "OASIS"
    spec_version: "ODF 1.3"
    legal_category: 1
    preliminary_score_estimate:
      legal_safety: "30/30 — OASIS Category 1 RF"
      spec_availability: "20/20 — same ODF 1.3 spec"
      parseable_structure: "12-14/15 — flat XML; slide/frame model more complex than cells"
      community_demand: "6-8/10 — FODP less common than FODT; niche VCS use case"
      strategic_track_value: "8-10/10 — opens Slides family; reuses ODF flat pipeline"
      implementation_complexity: "2/3 — presentation layout/drawing model adds complexity"
      family_overlap: "4-5/5 — reuses FODS/FODT pipeline"
      estimated_total: "82-90/100"
      band: accept
      confidence: plausible_pending_verification
    pipeline_reuse:
      spec_cache: "YES — same ODF 1.3 spec"
      oracle_provider: "YES — LibreOffice supports FODP"
      evidence_contracts: "YES"
      neutral_model: "NEW — Slides family model needed"
    notes: "FODP is the flat XML equivalent of ODP. Slightly lower community demand than FODT. Presentation semantics (slides, frames, drawing objects) add parsing complexity. Still strong candidate."
    recommendation: "MEDIUM PRIORITY — consider after FODT acquisition is underway"

  - candidate_id: fodg
    display_name: "Flat OpenDocument Drawing/Graphics"
    family: diagram
    extensions: [.fodg]
    mime_type: "application/vnd.oasis.opendocument.graphics-flat-xml"
    spec_body: "OASIS"
    spec_version: "ODF 1.3"
    legal_category: 1
    preliminary_score_estimate:
      legal_safety: "30/30 — OASIS Category 1 RF"
      spec_availability: "18-20/20 — same ODF 1.3 spec; drawing sections relevant"
      parseable_structure: "11-13/15 — flat XML; drawing/shape/connector model complex"
      community_demand: "4-6/10 — FODG is niche; LibreOffice Draw users are a smaller segment"
      strategic_track_value: "6-8/10 — opens Diagram/CAD family; reuses ODF pipeline"
      implementation_complexity: "2/3 — drawing/connector model significantly more complex"
      family_overlap: "4/5 — reuses ODF pipeline"
      estimated_total: "75-86/100"
      band: accept_or_borderline
      confidence: plausible_pending_verification
    pipeline_reuse:
      spec_cache: "YES — same ODF 1.3 spec"
      oracle_provider: "YES — LibreOffice supports FODG"
      evidence_contracts: "YES"
      neutral_model: "NEW — Diagram family model needed"
    notes: "FODG is the flat XML equivalent of ODG (LibreOffice Draw). Lower community demand than FODT/FODP. Drawing/shape model (SVG-like) adds parser complexity. Worth evaluating but lower priority than text/presentation formats."
    recommendation: "LOW PRIORITY — evaluate after FODT and FODP"

  - candidate_id: fodb
    display_name: "Flat OpenDocument Database"
    family: archive
    extensions: [.fodb]
    mime_type: "application/vnd.oasis.opendocument.base-flat-xml"
    spec_body: "OASIS"
    spec_version: "ODF 1.3"
    legal_category: 1
    preliminary_score_estimate:
      legal_safety: "30/30 — OASIS Category 1 RF"
      spec_availability: "15-18/20 — ODF 1.3 Part 2; Base/database sections less comprehensive"
      parseable_structure: "8-10/15 — flat XML; database schema/form model is complex"
      community_demand: "2-4/10 — FODB is very niche; LibreOffice Base is rarely used"
      strategic_track_value: "4-6/10 — opens database format path; low current demand"
      implementation_complexity: "1-2/3 — database schema/query model highly complex"
      family_overlap: "3-4/5 — reuses ODF pipeline"
      estimated_total: "62-72/100"
      band: borderline_or_defer
      confidence: plausible_pending_verification
    pipeline_reuse:
      spec_cache: "PARTIAL — ODF 1.3 spec cached; Base-specific sections may need additional review"
      oracle_provider: "UNCERTAIN — LibreOffice Base headless export support needs verification"
      evidence_contracts: "YES"
      neutral_model: "NEW — Database family model needed"
    notes: "FODB is the flat XML equivalent of ODB (LibreOffice Base). Very low community demand. Database schema model is complex. Oracle provider support (LibreOffice Base headless) needs verification. DEFER unless specific demand arises."
    recommendation: "DEFER — not recommended for next acquisition"

shortlist_recommendation:
  next_candidate: fodt
  rationale: >
    FODT is the strongest next-format candidate. It shares the same legal/spec basis
    as FODS (OASIS ODF 1.3 Category 1 RF), the same oracle provider (LibreOffice),
    and can reuse the existing spec cache, normalization artifacts, and evidence
    contract templates. Its estimated score of 87-93/100 places it firmly in the
    Accept band. The main new investment is a Words-family neutral model.
  prerequisite: >
    This recommendation must be independently verified before any Gate 1 scoring
    begins. No acquisition pack may be created until a human explicitly authorizes
    Gate 1 scoring for FODT. No official registry entry may be created.
  independent_verification_required: true
  gate_1_approval_required: true
  gate_1_approval_by: "human (project lead)"
