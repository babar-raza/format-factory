# Full Suite Shard Ledger — Format Factory
# Created: 2026-06-18
# Plan: optimized-sauteeing-hellman (supplemental infrastructure)
#
# When the full test suite (layer 6) is run in CI or locally across multiple
# sessions/shards, this ledger tracks shard boundaries and resume state.
# This allows interrupted full-suite runs to resume from the last completed shard.
#
# Usage:
#   python tools/test_runner.py --layer 6 --shard N --total-shards M
#   Writes shard completion state here after each shard completes.
#
# Policy: Only layer 6 (full suite) uses sharding. Layers 0-5 are always single-shard.

