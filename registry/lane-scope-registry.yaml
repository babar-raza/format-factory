lanes:

  - id: lane-ci-audit
    name: CI Configuration Audit
    description: >
      Repairs defects in CI workflow configuration files.
      All source, test, and governance state files are read-only.
    permitted_reads: ["**"]
    permitted_writes:
      - ".github/workflows/**"
      - ".gitlab-ci.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "registry/known-failure-ledger.yaml"
      - "reports/governance/delegation-ledger.json"
      - ".local/ci-audit/**"
      - ".local/evidences/**"
    forbidden_writes:
      - "src/**"
      - "tests/**"
      - "registry/source-structure-baseline.json"
      - "oracle/**"
      - "plans/master-plan.md"
      - "AGENTS.md"
      - "CLAUDE.md"
    on_out_of_scope_discovery:
      # AGENT-DIRECTIVE FIELD: not consumed by scope_guard.py at runtime.
      # Tells the executing agent what protocol to follow upon a reported violation.
      action: delegate
      never: fix_directly
      protocol: delegation_handoff_v1

  - id: lane-3-analytics-separation
    name: Python Analytics Separation
    description: Extracts analytics functions from monolithic source files.
    permitted_reads: ["**"]
