advisory:
  - note: >
      tests/supervisor/ tests that import litellm may time out if SSL context creation
      is slow (observed: ssl.create_default_context with cafile on Windows takes 10-15s).
      Use --timeout=30 or more for supervisor tests that exercise litellm-dependent code paths.
  - note: >
      The arithmetic deepening test suite (registry/arithmetic-deepening-tests.txt) contains
      ~1,009 test files with no spec backing. Use --skip-arithmetic to exclude from routine validation.
