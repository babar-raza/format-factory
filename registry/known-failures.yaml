version: 1
captured_date: "2026-06-18"
environment: "Windows 11, Python 3.13.2, pytest-8.4.2"

failures:
  - test_id: "tests/test_layer_assignment.py::test_layer0_contains_health_check"
    failure_class: "state_dependent"
    failure_reason: >
      Runs subprocess to collect layer0 tests. Collection spans >20s on large repo
      with 32k+ tests. Times out when pytest collection touches arithmetic deepening
      test files (1,012 files). Fixed by using --skip-arithmetic or --ignore=tests/python/deepening.
    first_observed: "2026-06-18"
    owner_lane: "test-infrastructure"
    suppress_until: null
    workaround: "Run tests/test_layer_assignment.py with --skip-arithmetic flag added to venv pytest"

  - test_id: "tests/evidence/test_auto_proof_bundle.py::test_build_bundle_unchanged_without_auto_proof"
    failure_class: "environment_specific"
    failure_reason: >
      Builds a ZIP archive of large evidence directory. os.stat() call times out at 15-20s
      on OneDrive-backed directories. Environment-specific to OneDrive sync delay.
    first_observed: "2026-06-18"
    owner_lane: "evidence-infrastructure"
    suppress_until: null
    workaround: "Run with --timeout=120 or exclude with --ignore=tests/evidence/test_auto_proof_bundle.py"

  - test_id: "tests/supervisor/test_llm_semantic_verification.py::TestSemanticVerifyItem::test_fallback_never_downgrades"
    failure_class: "flaky_ordering_dependent"
    failure_reason: >
      Pydantic serialization state from LLM mock bleeds between test modules when the full suite
      runs in certain orderings. Passes in isolation. Caused by PydanticSerializationUnexpectedValue
      warnings from shared mock objects. Not a logic failure.
    first_observed: "2026-06-18"
    owner_lane: "supervisor"
    suppress_until: null
    workaround: "Run in isolation: pytest tests/supervisor/test_llm_semantic_verification.py -k test_fallback_never_downgrades"

skipped:
  - test_id: "tests/evidence/test_r46_timeout_portability.py::*"
    skip_reason: "zstandard library not installed in base Python 3.13; installed in venv only"
    skip_class: "optional_dependency"

collection_errors:
  description: >
    Collection errors (ImportError) occur when test files reference functions not yet
    implemented. These are NOT failures — they are gap tests. Known formats with
    collection errors: csv (~32), tsv (~31), abw, dif, sylk (gap tests for unimplemented analytics),
    and fodt-named deepening files (~107, catalogued 2026-06-20 by TC-HARD-008).
    Use --continue-on-collection-errors to run remaining tests despite collection errors.
  not_failures: true

  fodt_deepening_collection_errors:
    catalogued_date: "2026-06-20"
    catalogued_by: "TC-HARD-008 (concurrent-honking-salamander.md)"
    count: 107
    failure_class: "pre_existing_import_error"
    pre_existing: true
    resolution: "delete or skip until FODT/FODS/PBM/ODS deepening rotation resumes with spec backing"
    reason: >
      107 deepening test files with 'fodt', 'fods_fodt', or 'pbm_pgm_fodp_fodt' in their name
      have ImportError on collection. These reference functions from suspended arithmetic
      deepening rotation (e.g. fods_total_text_length, pbm_border_density, fodt_*_mod_*_times_*)
      that were never implemented because the rotation was suspended (keen-dancing-hopper).
      These are NOT regression failures — they pre-date the concurrent-honking-salamander plan.
    affected_file_patterns:
      - "tests/python/deepening/test_r*_pbm_pgm_fodp_fodt_deepening.py"
      - "tests/python/deepening/test_r*_fods_fodt_*.py"
      - "tests/python/deepening/test_r*_fods_fodt_gnumeric_deepening.py"
    sample_files:
      - tests/python/deepening/test_r319_pbm_pgm_fodp_fodt_deepening.py
      - tests/python/deepening/test_r323_pbm_pgm_fodp_fodt_deepening.py
      - tests/python/deepening/test_r327_pbm_pgm_fodp_fodt_deepening.py
      - tests/python/deepening/test_r335_pbm_pgm_fodp_fodt_deepening.py
      - tests/python/deepening/test_r339_pbm_pgm_fodp_fodt_deepening.py
      - tests/python/deepening/test_r420_fods_fodt_gnumeric_deepening.py
      - tests/python/deepening/test_r425_fods_fodt_ods_odt_fodp_deepening.py
      - tests/python/deepening/test_r429_fods_fodt_ods_odt_fodp_deepening.py
      - tests/python/deepening/test_r433_fods_fodt_ods_odt_fodp_deepening.py
      - tests/python/deepening/test_r437_fods_fodt_ods_odt_fodp_deepening.py
    sample_missing_functions:
      - "fods_total_text_length (from src.python.fods.neutral_model)"
      - "pbm_border_density (from src.python.pbm.pbm_parser)"
      - "ods_string_column_count (from src.python.ods.ods_parser)"
    workaround: >
      Run with --continue-on-collection-errors flag or explicitly exclude deepening tests:
      .venv/Scripts/pytest tests/python/fodt/ --continue-on-collection-errors -v   (existing FODT tests pass)
      .venv/Scripts/pytest tests/python/deepening/ --continue-on-collection-errors (skips broken imports)

  fodt_format_dir_collection_errors:
    catalogued_date: "2026-06-20"
    catalogued_by: "TC-HARD-008 (concurrent-honking-salamander.md)"
    count: 30
    failure_class: "pre_existing_import_error"
