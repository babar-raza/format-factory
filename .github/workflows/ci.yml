name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Lint (ruff)
        run: ruff check src/ tests/ tools/ --output-format=github

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: Security scan (bandit)
        run: bandit -r src/ -ll -q --skip B314  # B314: xml.etree usage is intentional (see docs/security.md)

  test-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git diff in auto-detection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run layered tests (L0-L3)
        run: python tools/test_runner.py --layer 3 --known-failures registry/known-failure-ledger.yaml --json-out .local/test-results/ci-fast.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fast
          path: .local/test-results/

  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Governance validators smoke test
        run: python -c "import sys; sys.path.insert(0, 'tools/supervisor'); from governance_validators import run_all_governance_validators; print('Governance validators: OK')"

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore all .NET projects
        run: dotnet restore src/net/*/FormatFactory.*.csproj
      - name: Build established .NET projects (csv, fods, fodt, ndjson, tsv)
        run: |
          for fmt in csv fods fodt ndjson tsv; do
            proj="src/net/${fmt}/FormatFactory.*.csproj"
            echo "Building $proj"
            dotnet build $proj --configuration Release --no-restore
          done
      - name: Build experimental .NET projects (html, markdown, txt, netpbm)
        continue-on-error: true
        run: |
          for fmt in html markdown txt netpbm; do
            proj="src/net/${fmt}/FormatFactory.*.csproj"
            echo "Building $proj (experimental)"
            dotnet build $proj --configuration Release --no-restore
          done
      - name: Run .NET tests (if any)
        run: |
          if [ -d "tests/dotnet" ]; then
            for proj in tests/dotnet/*/FormatFactory.*.Tests.csproj; do
              [ -f "$proj" ] && dotnet test "$proj" --no-build --configuration Release
            done
          fi

  test-full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run full test suite with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing --continue-on-collection-errors
      - name: Coverage threshold
        run: coverage report --fail-under=85
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
