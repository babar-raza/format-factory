name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Lint (ruff)
        run: ruff check src/ tests/ tools/ --output-format=github

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: Security scan (bandit)
        run: bandit -r src/ -ll -q --skip B314  # B314: xml.etree usage is intentional (see docs/governance/security.md)

  test-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git diff in auto-detection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Create output directories
        run: mkdir -p .local/test-results
      - name: Run layered tests (L0-L3)
        run: python tools/test_runner.py --layer 3 --known-failures registry/known-failure-ledger.yaml --json-out .local/test-results/ci-fast.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fast
          path: .local/test-results/

  skill-attribution-check:
    # EP-006: Detect src/ mutations without skill execution transcripts.
    # Policy: docs/governance/skill-only-policy.yaml § enforcement_points.EP-006
    # This check fires AFTER commit (detection, not prevention).
    # Prevention requires pre-commit hooks (SKILL-GAP-008 — in backlog).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50  # enough history to trace skill transcripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create output directories
        run: mkdir -p .local
      - name: Check skill attribution for src/ mutations
        run: |
          python tools/governance/ci_skill_attribution_check.py \
            --base-ref "HEAD~1" \
            --head-ref "HEAD" \
            --allow-pre-policy \
            --output .local/ci-skill-attribution-report.json
        continue-on-error: true  # WARN only until SKILL-GAP-008 (pre-commit hook) is closed
      - name: Upload skill attribution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-attribution-report
          path: .local/ci-skill-attribution-report.json
        continue-on-error: true

  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Source structure validation
        run: python tools/validators/source_structure_validator.py
      - name: Governance validators check
        run: python tools/governance/run_ci_governance_check.py
      - name: Capability parity source registry tests
        run: pytest tests/governance/test_capability_parity.py -v

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"  # .NET 10.0 GA (released 2025-11) — stable LTS
      - name: Restore all .NET projects
        run: |
          for proj in src/net/*/FormatFactory.*.csproj tests/net/*/FormatFactory.*.Tests.csproj; do
            if [ -f "$proj" ]; then
              echo "Restoring $proj"
              dotnet restore "$proj"
            fi
          done
      - name: Build all .NET projects
        run: |
          # Build in dependency order: leaf deps first, then consumers
          for fmt in csv html txt markdown fods fodt ndjson tsv netpbm zst; do
            proj=$(ls src/net/${fmt}/FormatFactory.*.csproj 2>/dev/null || true)
            if [ -n "$proj" ]; then
              echo "Building ${fmt}"
              dotnet build "${proj}" --configuration Release --no-restore
            fi
          done
      - name: Run .NET tests
        run: |
          for proj in tests/net/*/FormatFactory.*.Tests.csproj; do
            echo "Testing ${proj}"
            dotnet test "${proj}" --configuration Release
          done

  test-full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run full test suite with coverage
        run: pytest --cov=src/python --cov-report=xml --cov-report=term-missing
      - name: Coverage threshold
        run: coverage report --fail-under=85
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  oracle-obligations:
    # TC-ORC-005: Validate oracle obligation coverage for all registered formats.
    # Every format in registry/format-registry.yaml must have an entry in
    # oracle/registry/format-oracle-registry.yaml before advancing beyond Gate 4.
    # RULE-ORC-001 — enforced by V82 (validate_oracle_obligations).
    # Mirrors .gitlab-ci.yml oracle-obligations job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate oracle obligations
        run: python tools/oracle/validate_oracle_obligations.py

  capability-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Detect capability registry drift
        continue-on-error: true  # WARN only — drift report is informational
        run: python tools/capability_sync/detect_drift.py --output capability-drift.json
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-drift-report
          path: capability-drift.json
