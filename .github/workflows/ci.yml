name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Lint (ruff)
        run: ruff check src/ tests/ tools/ --output-format=github
        continue-on-error: true  # Remove after baseline established

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: Security scan (bandit)
        run: bandit -r src/ -ll -q --skip B314  # B314: xml.etree usage is intentional (see docs/security.md)

  test-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git diff in auto-detection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run layered tests (L0-L3)
        run: python tools/test_runner.py --layer 3 --json-out .local/test-results/ci-fast.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fast
          path: .local/test-results/

  test-full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run full test suite with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing -x
        continue-on-error: true  # Remove after Linux compatibility verified
      - name: Coverage threshold
        run: coverage report --fail-under=30
        continue-on-error: true  # Remove after baseline established; adjust threshold to actual-5%
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
