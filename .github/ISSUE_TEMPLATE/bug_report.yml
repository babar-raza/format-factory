name: Bug Report
description: Report a bug in a format parser, converter, or tool
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: format
    attributes:
      label: Format
      description: Which format is affected?
      options:
        - FODS
        - FODT
        - ZST
        - TSV
        - ABW
        - Gnumeric
        - FODG
        - ODS
        - ODT
        - SYLK
        - DIF
        - CSV
        - PBM
        - PGM
        - PPM
        - QOI
        - XCF
        - NDJSON
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Load file '...'
        2. Call function '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "3.11.0"
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Windows 11 / Ubuntu 22.04 / macOS 14"
