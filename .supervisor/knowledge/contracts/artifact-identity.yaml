---
# Artifact Identity Contract — TC-FL-010
# Authority: FF-LAYER-FORENSICS-20260625 governance healing
# Version: 1.0

contract_id: artifact-identity
contract_version: "1.0"
created_at: "2026-06-25"
owner: TC-FL-010

purpose: >
  Defines required identity fields for evidence artifacts. Enables detection of competing
  artifacts from different sprints, cross-session conflict resolution, and provenance tracing.
  Without these fields, agents cannot determine if an artifact is current or stale.

# Required fields for all evidence_artifacts entries in declarations
required_fields:
  artifact_id:
    type: string
    pattern: "{mission_id}/{run_id}/{artifact_name}"
    description: >
      Globally unique artifact identifier. Format: {mission_id}/{run_id}/{artifact_name}.
      Example: "FF-LAYER-FORENSICS-20260625/run-001/layer-maturity-grades.yaml"
    enforcement: WARN  # V72 warns when missing (not blocking for existing declarations)

  producer:
    type: string
    pattern: "{skill_id} | {command_id} | manual"
    description: >
      Identity of the process that produced this artifact.
      Examples: "build-evidence-bundle", "autonomous_cycle.py", "manual"
    enforcement: WARN

  produced_at:
    type: string
    format: ISO8601
    description: "ISO8601 timestamp when the artifact was produced"
    enforcement: WARN

  authority:
    type: enum
    values:
      - AUTHORITATIVE       # Primary source of truth; generated by governed pipeline
      - VERIFIED_DERIVATION # Derived from authoritative source with verification
      - AI_DRAFT            # LLM-generated content; requires human or pipeline review
      - UNVERIFIED          # Produced without verification; provisional only
    description: >
      Authority classification. AUTHORITATIVE artifacts are the decision-making source.
      AI_DRAFT artifacts must not be used as sole evidence for RELEASE_GATE items.
    enforcement: WARN

# Optional recommended fields
optional_fields:
  supersedes:
    type: string
    description: "Prior artifact_id that this artifact replaces, or null"

  content_hash:
    type: string
    description: "SHA-256 hex digest of the artifact file content"

  sprint_id:
    type: string
    description: "Sprint or run ID that produced this artifact"

# Enforcement levels by item_type
enforcement_by_item_type:
  RELEASE_GATE:
    required: [artifact_id, authority]
    blocks_on_missing: true
    notes: "FAIL when evidence_artifacts lack artifact_id and authority fields"
  PRODUCT_SOURCE:
    required: [artifact_id]
    blocks_on_missing: false
    notes: "WARN when evidence_artifacts lack identity fields"
  GOVERNANCE_TASKCARD:
    required: []
    blocks_on_missing: false
    notes: "WARN only"

examples:
  - artifact_id: "FF-LAYER-FORENSICS-20260625/run-001/layer-maturity-grades.yaml"
    producer: "build-evidence-bundle"
    produced_at: "2026-06-25T12:00:00Z"
    authority: AUTHORITATIVE
    content_hash: "sha256:abc123..."
    supersedes: null
