allowed_variants:
- description: 'Most formats. __init__(self, data: dict[str, Any]). self._data = data.
    to_dict() returns dict(self._data).'
  examples:
  - csv
  - gnumeric
  - toml
  - abw
  - tsv
  key: dict-based
- description: 'NDJSON only. __init__(self, records: list[Any]). self._records = list(records).
    to_list() instead of to_dict().'
  examples:
  - ndjson
  key: list-based
- description: ZST only. __init__(self, path, data=None). Requires file path for frame-level
    analysis without full decompression.
  examples:
  - zst
  key: path-based
applies_to:
- src/python/*/models.py
authoritative_sources:
