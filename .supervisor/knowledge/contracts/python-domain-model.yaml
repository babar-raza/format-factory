consumers:
- .claude/commands/add-python-object-model-feature.md (Step 0)
- .claude/commands/add-python-api.md (Step 0)
- Any agent creating or modifying src/python/*/models.py
- AGENTS.md B2b (knowledge-first rule)
enforcement: PARTIALLY_ENFORCED
forbidden_patterns:
- "spec_qname: str = '...' (instance field \xE2\u20AC\u201D breaks V53; must be bare\
  \ class attribute)"
- Format-prefixed class as primary implementation outside Compat/ (breaks V45)
- "Properties returning self._data directly (not a copy \xE2\u20AC\u201D breaks defensive-copy\
  \ contract)"
- from .module import function at module level inside from_file (must be inside method
  body)
- Missing from_file classmethod
- Missing __repr__
- Missing to_dict or to_list
knowledge_id: KC-PYTHON-001
last_verified_revision: '2026-06-24'
naming_rules:
- 'Class name: {Format}Document where Format is title-case of the format_id (Csv,
  Ndjson, Gnumeric, etc.)'
- 'File name: models.py (always, no alternatives)'
path_rules:
- 'Source file: src/python/{format_id}/models.py'
- 'Test file: tests/python/{format_id}/test_{format_id}_document_model.py'
- 'QName binding: shared/qname-registry/{format_id}.yaml'
required_fields_or_components:
- description: Bare class attribute (not ClassVar type hint in current code). Must
    match shared/qname-registry/{format}.yaml qname field exactly.
  example: spec_qname = "csv:record"
  name: spec_qname class attribute
- description: FACT-FORMAT-NNN string, references SAL fact
  example: spec_fact_ref = "FACT-CSV-001"
  name: spec_fact_ref class attribute
- example: namespace_uri = "https://www.iana.org/assignments/media-types/text/csv"
  name: namespace_uri class attribute
- example: local_name = "record"
  name: local_name class attribute
- example: facade_names = []
  name: facade_names class attribute
- description: Accepts neutral model (dict or list), stores as self._data or self._records
  name: __init__ constructor
- description: Loads file via relative import of codec inside the method body. Returns
    instance.
  name: from_file classmethod
- description: One property per neutral model key. Return defensive copies (list(),
    dict()). Use .get(key, default). Coerce to correct type.
  name: typed property methods
- description: get_cell(), get_record(), or equivalent. Returns safe default on out-of-bounds.
  name: accessor method
- description: Round-trips the underlying neutral model.
  name: to_dict or to_list export
- description: 'Includes key counts. Format: ClassName(count=N, ...)'
  name: __repr__ method
- description: 'from .models import {Format}Document  # noqa: F401'
  name: __init__.py export
- description: tests/python/{format}/test_{format}_document_model.py
  name: test file
scope: All Python format packages in src/python/*/
