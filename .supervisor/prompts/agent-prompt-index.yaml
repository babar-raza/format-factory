# Agent Prompt Index — Format Factory
# Machine-readable discovery index for all prompt assets
# Updated: 2026-07-03
# Covers: PSL prompts (existing) + ESP operational prompts (Espanso integration)
# Full registry: .supervisor/prompts/prompt-registry.yaml
# Capability registry: .governance/capabilities/registry.yaml
# Routing registry: .supervisor/capability-routing-registry.yaml

version: "1.0"
updated: "2026-07-03"

# HOW TO USE:
# 1. Match the user's intent or current system condition to one of the intents[] lists
# 2. Check prerequisites[] — if not met, satisfy them first
# 3. Use the command or prompt_asset to invoke the capability
# 4. If mutating: check allowed_paths and forbidden_paths before proceeding
# 5. After execution: see evidence_output for where to find proof

agent_prompt_index:

  # === POST-SPRINT LOOP (PSL) PROMPTS ===

  - prompt_id: PSL-PROMPT-1
    intents:
      - post_sprint_audit
      - evidence_review
      - issue_discovery
      - sprint_quality_check
    purpose: "Post-sprint strict evidence audit with L1/L2/L3 issue discovery"
    when_to_use: "After any sprint execution, to audit the evidence before continuing"
    when_not_to_use: "Before sprint execution; during plan-mode planning"
    prerequisites:
      - active evidence declaration at .local/evidences/<run_id>/evidence-declaration.yaml
      - session-resume.md exists at reports/supervisor/
    capabilities: [post-sprint-audit]
    mutating: false
    context_profile: full
    command: null
    skill: post-sprint-audit
    prompt_asset: .supervisor/prompts/prompt1-post-sprint-audit.md
    evidence_output: "stage1-issue-model.json, stage1-sprint-audit-summary.md"
    fallback: "run python tools/supervisor/supervisor_loop.py autonomous-cycle directly"

  - prompt_id: PSL-PROMPT-2
    intents:
      - plan_hardening
      - taskcard_creation
      - issue_to_taskcard_conversion
      - audit_follow_up
    purpose: "Plan hardening from audit output with taskcard generation"
    when_to_use: "After PSL-PROMPT-1 returns SPRINT_REQUIRES_PLAN_HARDENING or SPRINT_REQUIRES_REEXECUTION"
    when_not_to_use: "When audit shows all-green (use PSL-PROMPT-3 directly)"
    prerequisites:
      - stage1-issue-model.json from PSL-PROMPT-1
      - active plan file exists
    capabilities: [plan-hardening]
    mutating: true
    context_profile: full
    command: /plan-hardening
    skill: plan-hardening
    prompt_asset: .supervisor/prompts/prompt2-plan-hardening.md
    evidence_output: "stage2-taskcard-contract.json, stage2-taskcard-index.yaml"
    fallback: null

  - prompt_id: PSL-PROMPT-3
    intents:
      - taskcard_execution
      - controlled_execution
      - sprint_implementation
      - quality_scored_execution
    purpose: "Controlled taskcard execution with 15-dimension quality scoring"
    when_to_use: "When taskcards are ready for execution (plan hardened or audit was all-green)"
    when_not_to_use: "When plan is not hardened; when audit found material issues"
    prerequisites:
      - stage2-taskcard-contract.json OR stage1-verdict == SPRINT_ALL_GREEN_VERIFIED
    capabilities: []
    mutating: true
    context_profile: full
    command: null
    skill: post-sprint-loop
    prompt_asset: .supervisor/prompts/prompt3-controlled-execution.md
    evidence_output: "stage3-quality-scoring-rubric.json, declaration-review-package-<run_id>.zip"
    fallback: null

  - prompt_id: PSL-PROMPT-4
    intents:
      - task_closure
      - sprint_close
      - terminal_state
      - all_green_close
    purpose: "Governed final task closure with all-green validation and terminal state"
    when_to_use: "When all taskcards are complete and evidence is all-green"
    when_not_to_use: "When any material finding remains open"
    prerequisites:
      - all taskcards DONE
      - evidence all-green
      - no CRITICAL contradictions
    capabilities: []
    mutating: true
    context_profile: full
    command: null
    skill: post-sprint-loop
    prompt_asset: .supervisor/prompts/prompt4-close-task.md
    evidence_output: "close-task-result.yaml"
    fallback: null

  # === OPERATIONAL PROMPTS (from Espanso integration) ===

  - prompt_id: ESP-PROMPT-1
    intents:
      - short_context_execution
      - bounded_execution
      - weaker_agent
      - resume_after_compaction
      - one_taskcard_at_a_time
    purpose: "Execute one taskcard at a time for context-limited or resuming agents"
    when_to_use: >
      Agent has a limited context window, context was compacted, or the full
      /autonomous-loop is unavailable. An active plan file must be in the repository.
    when_not_to_use: >
      When full context is available and /autonomous-loop is accessible.
      When no active plan file exists in the repository.
    prerequisites:
      - .local/supervisor/active-plan-lock.json with status=IN_PROGRESS
      - plan file with PENDING taskcards and explicit done-checks
    capabilities: [bounded-execution]
    mutating: true
    allowed_paths:
      - plans/.claude/<active-plan>.md
      - .local/supervisor/bounded-exec-checkpoint.json
      - .local/evidences/<run_id>/
    forbidden_paths:
      - plans/ (bulk modification)
      - registry/
      - .supervisor/
    context_profile: short
    command: null
    skill: autonomous-loop
    route: bounded_execution
    prompt_asset: .supervisor/prompts/bounded-executor.md
    evidence_output: ".local/supervisor/bounded-exec-checkpoint.json"
    fallback: "read plan file directly, find first PENDING taskcard, execute manually"
    espanso_gap_id: GAP-ESP-002

  - prompt_id: ESP-PROMPT-2
    intents:
      - root_readme_update
      - readme_governance
      - readme_accuracy
      - project_documentation
    purpose: "Forensic investigation and preservation-first update of root README.md"
    when_to_use: >
      Root README.md has stale capability counts, outdated commands, or missing features.
      Always verify claims against current repository before editing.
    when_not_to_use: >
      For per-format READMEs (use /sync-readmes instead).
      When no factual inaccuracy has been identified.
    prerequisites:
      - read README.md first
      - gather evidence from registry, format-registry, skill-registry
    capabilities: [readme-root-governance]
    mutating: true
    allowed_paths:
      - README.md
    forbidden_paths:
      - src/python/**/README.md (use /sync-readmes)
      - src/net/**/README.md (use /sync-readmes)
    context_profile: full
    command: null
    skill: sync-readmes
    route: root_readme_governance
    prompt_asset: .supervisor/prompts/readme-governance.md
    evidence_output: "README.md (updated in-place)"
    fallback: "edit README.md manually using verified evidence from registry files"
    espanso_gap_id: GAP-ESP-001

  - prompt_id: ESP-PROMPT-3
    intents:
      - expert_review
      - system_review_plan
      - pre_gate11_review
      - manual_quality_assessment
      - plan_mode_review
    purpose: "Generate an expert review plan for manual execution — READ-ONLY, plan mode only"
    when_to_use: >
      Beginning a major quality improvement cycle. Before Gate 11 readiness assessment.
      When autonomous sprint claims need external verification. Use in plan mode.
    when_not_to_use: >
      When you want to execute fixes (this is plan-only). During an active execution sprint.
    prerequisites:
      - plan mode active (no source mutations allowed)
      - reports/expert-manual-system-review/ directory (will be created)
    capabilities: [expert-review-plan]
    mutating: false
    allowed_paths:
      - reports/expert-manual-system-review/**
    forbidden_paths:
      - src/
      - tests/
      - registry/format-registry.yaml
      - .supervisor/policies.yaml
    context_profile: full
    command: null
    skill: null
    route: null
    prompt_asset: .supervisor/prompts/expert-review-plan.md
    evidence_output: "reports/expert-manual-system-review/review-plan-<sprint_id>.md"
    fallback: null
    espanso_gap_id: GAP-ESP-007

  - prompt_id: ESP-PROMPT-4
    intents:
      - issue_ownership
      - discovered_issue
      - found_bug
      - pre_existing_defect
      - test_failure
      - broken_fixture
    purpose: "Issue ownership enforcement — when you find it, you fix it"
    when_to_use: >
      When any issue is discovered during execution (test failure, broken fixture, schema
      violation, bypassed skill, contradictory evidence). Apply regardless of whether you
      caused the issue.
    when_not_to_use: >
      For LOW-priority issues that are genuinely deferred — capture as taskcard but do not
      block primary sprint. This protocol is always active; it is not a separate invocation.
    prerequisites: []
    capabilities: []
    mutating: true
    allowed_paths:
      - .local/evidences/<run_id>/
      - plans/.claude/<active-plan>.md (taskcard additions)
      - tests/ (regression protection)
    forbidden_paths: []
    context_profile: full
    command: null
    skill: null
    route: null
    prompt_asset: .supervisor/prompts/found-it-own-it.md
    evidence_output: ".local/evidences/<run_id>/ (taskcard + verification)"
    fallback: "write a taskcard in the active plan and mark it for next sprint if non-blocking"
    espanso_gap_id: GAP-ESP-003

  - prompt_id: ESP-PROMPT-5
    intents:
      - machinery_forensics
      - lifecycle_iteration_failure
      - audit_loop_broken
      - continuation_not_iterating
      - plan_executed_once_and_stopped
    purpose: "Diagnose and repair why a machinery plan lifecycle did not iterate"
    when_to_use: >
      A machinery plan executed once but did not trigger AUDIT → PLAN → EXECUTE iterations.
      check_continuation.py returned STOP for a non-terminal reason. The plan lock has
      unexpected status.
    when_not_to_use: >
      For general product deepening sprint issues (use /autonomous-loop or /post-sprint-loop).
      When the stop was intentional (POST_PLAN_TERMINAL, user-authorized).
    prerequisites:
      - .local/supervisor/continuation-signal.json
      - .local/supervisor/active-plan-lock.json
      - access to reports/supervisor/approval-gates.md
    capabilities: [machinery-iteration-forensics]
    mutating: true
    allowed_paths:
      - .local/supervisor/continuation-signal.json
      - .local/supervisor/plan-locks/
      - .local/supervisor/active-plan-lock.json
      - plans/.claude/<machinery-plan>.md
    forbidden_paths:
      - src/
      - registry/
    context_profile: full
    command: null
    skill: null
    route: null
    prompt_asset: .supervisor/prompts/machinery-iteration-forensics.md
    evidence_output: "repaired .local/supervisor/ state files + one additional lifecycle iteration"
    fallback: "manually reset iteration=0 in continuation-signal.json and re-run check_continuation.py"
    espanso_gap_id: GAP-ESP-004

  - prompt_id: ESP-PROMPT-6
    intents:
      - governance_rectification
      - human_free
      - remove_human_gate
      - autonomous_doctrine_propagation
      - scan_governance_files
    purpose: "Scan and fix governance files that unjustifiably require human intervention"
    when_to_use: >
      AGENTS.md or CLAUDE.md contains "human must ..." language that is not a genuine
      external gate. Governance text is blocking autonomous execution without justification.
    when_not_to_use: >
      When the human requirement IS a genuine external gate (Gate 11, credentials, branch
      protection, legally restricted decision). Never remove TRUE_EXTERNAL_GATEs.
    prerequisites:
      - AGENTS.md and CLAUDE.md are readable
      - reports/human-free-audit/ directory (will be created)
    capabilities: [human-free-rectification]
    mutating: true
    allowed_paths:
      - AGENTS.md
      - CLAUDE.md
      - docs/governance/**
      - .supervisor/prompts/**
      - .supervisor/policies.yaml
      - reports/human-free-audit/**
    forbidden_paths:
      - src/
      - tests/
      - registry/format-registry.yaml
    context_profile: full
    command: null
    skill: null
    route: governance_rectification
    prompt_asset: .supervisor/prompts/human-free-rectification.md
    evidence_output: "reports/human-free-audit/scan-results-<date>.yaml + repair-log-<date>.md"
    fallback: "manually scan AGENTS.md for 'human must' patterns and classify each"
    espanso_gap_id: GAP-ESP-008

  - prompt_id: ESP-PROMPT-7
    intents:
      - per_layer_hardening
      - layer_production_readiness
      - layer_gap_audit
      - layer_repair
    purpose: "Reconstruct, audit, gap-analyze, and harden a specific governance/product layer"
    when_to_use: >
      A specific layer needs production-readiness hardening. Specify layer_id (0-7 or 'all').
      Layer 0 = Governance; 1 = SAL/Spec; 2 = Routing; 3 = Product Source;
      4 = Tests; 5 = Evidence; 6 = State; 7 = Supervisor Pipeline.
    when_not_to_use: >
      When all layers are known to be production-ready. When fixing a specific known bug
      (use the appropriate skill instead).
    prerequisites:
      - specify layer_id before starting
      - relevant layer files are readable
    capabilities: []
    mutating: true
    allowed_paths:
      - files belonging to the target layer (see layer index in template)
      - .local/evidences/<run_id>/layer-<layer_id>-gap-ledger.yaml
    forbidden_paths:
      - files in other layers (unless a cross-layer interface is under investigation)
    context_profile: full
    command: null
    skill: null
    route: null
    prompt_asset: .supervisor/prompts/layer-hardening-template.md
    evidence_output: ".local/evidences/<run_id>/layer-<layer_id>-gap-ledger.yaml"
    fallback: "use /identify-primary-layer and /reconcile-layer-index for lighter-weight layer audit"
    espanso_gap_id: GAP-ESP-005
    parameters:
      layer_id: "0|1|2|3|4|5|6|7|all"

  - prompt_id: ESP-PROMPT-8
    intents:
      - production_standards
      - code_quality_enforcement
      - governance_machinery_first
      - master_governance_heal
      - src_quality_checklist
    purpose: "Enforce production code quality standards via governance-first sprint"
    when_to_use: >
      src/ contains non-production-grade code (monoliths, no typing, script-style modules,
      missing spec_qname). Run ONLY after confirming governance machinery (validators, LOC caps)
      is working. Machinery must be proven before product is healed.
    when_not_to_use: >
      When governance machinery is not yet working (fix machinery first).
      When src/ already passes all governance validators.
    prerequisites:
      - docs/code-quality/production-library-standard-v2.md is readable
      - registry/source-structure-baseline.json is current
      - governance validators are installed and runnable
    capabilities: []
    mutating: true
    allowed_paths:
      - src/python/**
      - src/net/**
      - docs/code-quality/
      - tools/ (new validators only)
      - registry/source-structure-baseline.json
    forbidden_paths:
      - increase baseline_loc_cap values (write-once)
      - tests/ (except adding regression tests)
    context_profile: full
    command: null
    skill: null
    route: null
    prompt_asset: .supervisor/prompts/production-standards-enforcement.md
    evidence_output: "new/updated governance validators + src/ files with violations fixed"
    fallback: "run /check-source-loc to identify LOC violations; run governance validators manually"
    espanso_gap_id: GAP-ESP-006

# === QUICK ROUTING DECISION TABLE ===
# For fast agent routing without reading the full index:

routing_decision_table:
  - condition: "agent has short context or is resuming after compaction"
    action: "use ESP-PROMPT-1 (bounded-executor.md)"

  - condition: "root README.md has stale counts or missing features"
    action: "use ESP-PROMPT-2 (readme-governance.md)"

  - condition: "need expert review plan before Gate 11 or major quality cycle"
    action: "use ESP-PROMPT-3 (expert-review-plan.md) in plan mode"

  - condition: "discovered a test failure, broken fixture, or governance defect"
    action: "apply ESP-PROMPT-4 (found-it-own-it.md) protocol immediately"

  - condition: "machinery plan executed once but did not iterate"
    action: "use ESP-PROMPT-5 (machinery-iteration-forensics.md)"

  - condition: "AGENTS.md or CLAUDE.md has unjustified human-gate language"
    action: "use ESP-PROMPT-6 (human-free-rectification.md)"

  - condition: "a specific layer needs production hardening"
    action: "use ESP-PROMPT-7 (layer-hardening-template.md) with layer_id parameter"

  - condition: "src/ code quality needs governance-enforced improvement"
    action: "use ESP-PROMPT-8 (production-standards-enforcement.md)"

  - condition: "post-sprint audit needed"
    action: "use PSL-PROMPT-1 (prompt1-post-sprint-audit.md)"

  - condition: "plan needs hardening from audit findings"
    action: "use PSL-PROMPT-2 (prompt2-plan-hardening.md)"

  - condition: "taskcards are ready for execution"
    action: "use PSL-PROMPT-3 (prompt3-controlled-execution.md)"

  - condition: "format README is stale"
    action: "use /sync-readmes skill (not README governance)"

  - condition: "want to understand what capabilities exist"
    action: "read .governance/capabilities/registry.yaml or run /capability-status"

  - condition: "want to find the route for a specific operation"
    action: "read .supervisor/capability-routing-registry.yaml"
