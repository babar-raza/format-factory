# Prompt Registry — Post-Sprint Autonomy Loop
# Lists all prompt assets with stable IDs, descriptions, inputs, outputs, and successor rules.
# Location: .supervisor/prompts/prompt-registry.yaml

version: "1.0"
created: "2026-06-15"

prompts:
  - id: PSL-PROMPT-1
    name: prompt1-post-sprint-audit
    file: .supervisor/prompts/prompt1-post-sprint-audit.md
    description: "Post-sprint strict evidence audit with L1/L2/L3 issue discovery"
    stage: 1
    mode: audit
    inputs:
      - reports/supervisor/session-resume.md
      - reports/supervisor/work-item-grades.yaml
      - .local/supervisor/continuation-signal.json
      - .local/evidences/<run_id>/evidence-declaration.yaml
    outputs:
      - stage1-issue-model.json
      - stage1-sprint-audit-summary.md
      - stage1-next-stage-recommendation.yaml
    output_schema: .supervisor/schemas/stage1-issue-model.schema.json
    successor_rules:
      - condition: "final_verdict == SPRINT_ALL_GREEN_VERIFIED"
        next: PSL-PROMPT-3
      - condition: "final_verdict in [SPRINT_REQUIRES_PLAN_HARDENING, SPRINT_REQUIRES_REEXECUTION]"
        next: PSL-PROMPT-2
      - condition: "final_verdict == SPRINT_REQUIRES_EVIDENCE_REPAIR"
        next: PSL-PROMPT-3
      - condition: "final_verdict == SPRINT_SUMMARY_INSUFFICIENT"
        next: PSL-PROMPT-1
    validation_rules:
      - "issues must have root_cause field"
      - "achievements must have proof_level field"
      - "claim_classification_matrix must be present"

  - id: PSL-PROMPT-2
    name: prompt2-plan-hardening
    file: .supervisor/prompts/prompt2-plan-hardening.md
    description: "Plan hardening from audit output with taskcard generation"
    stage: 2
    mode: plan
    inputs:
      - stage1-issue-model.json
      - stage1-l1-execution-issues.yaml
      - stage1-l2-integration-issues.yaml
      - stage1-l3-system-weaknesses.yaml
      - plans/master-plan.md
    outputs:
      - stage2-taskcard-contract.json
      - stage2-taskcard-index.yaml
      - stage2-ready-for-execution-verdict.yaml
    output_schema: .supervisor/schemas/stage2-taskcard-contract.schema.json
    successor_rules:
      - condition: "plan_verdict == PLAN_HARDENED_FROM_AUDIT_READY_FOR_EXECUTION"
        next: PSL-PROMPT-3
      - condition: "plan_verdict starts with PLAN_NOT_READY"
        next: PSL-PROMPT-2
      - condition: "plan_verdict == BLOCKED_EXTERNAL"
        next: null
    validation_rules:
      - "every actionable issue must have a taskcard"
      - "plan_delta must have linked issue_ids"
      - "hardening_score >= 18 for execution readiness"

  - id: PSL-PROMPT-3
    name: prompt3-controlled-execution
    file: .supervisor/prompts/prompt3-controlled-execution.md
    description: "Controlled taskcard execution with 15-dimension quality scoring"
    stage: 3
    mode: execution
    inputs:
      - stage2-taskcard-contract.json
      - stage2-taskcard-index.yaml
      - stage2-ready-for-execution-verdict.yaml
    outputs:
      - stage3-quality-scoring-rubric.json
      - stage3-final-sprint-summary.yaml
      - declaration-review-package-<run_id>.zip
    output_schema: .supervisor/schemas/stage3-quality-scoring-rubric.schema.json
    successor_rules:
      - condition: "all_green == true"
        next: null
      - condition: "overall_verdict == EXECUTION_REROUTED_REWORK_REQUIRED"
        next: PSL-PROMPT-2
      - condition: "overall_verdict == PLAN_NOT_READY_HEALED_ONLY"
        next: PSL-PROMPT-3
    validation_rules:
      - "must include self_review section (not prose-only)"
      - "must include quality_scores for every taskcard"
      - "must include evidence_bundle_path"
      - "rerouted items cannot be accepted without rescoring"

  - id: PSL-PROMPT-4
    name: close-task
    file: .supervisor/prompts/close-task.md
    description: "Governed final task closure with all-green validation, commit, state reconciliation, and terminal closure"
    stage: 4
    mode: closure
    inputs:
      - final_all_green_candidate.yaml
      - final clean audit
      - taskcard registry or accepted taskcard list
      - proof-level matrix
      - evidence root
    outputs:
      - close-task-result.yaml
      - closure record
      - terminal state
    output_schema: null
    successor_rules:
      - condition: "verdict == CLOSE_TASK_ACCEPTED"
        next: null
      - condition: "verdict == CLOSE_TASK_REJECTED"
        next: PSL-PROMPT-2
    validation_rules:
      - "must reject closure when material findings remain"
      - "must reject closure when generated outputs are stale"
      - "must verify relevant completed changes are committed"
      - "must write terminal state only after successful closure"

  - id: PSL-LOOP-CTRL
    name: prompt-loop-controller
    file: .supervisor/prompts/prompt-loop-controller.md
    description: "Loop controller decision logic documentation"
    stage: control
    mode: control
    inputs:
      - stage3-quality-scoring-rubric.json
    outputs:
      - loop-decision.yaml
      - loop-summary-classification.yaml
    output_schema: .supervisor/schemas/loop-decision-state-machine.schema.json
    successor_rules: []
    validation_rules:
      - "must never produce NEXT_PROMPT_NEEDED as final state"
      - "must never accept prose-only summaries"
      - "must never accept scores below 4/5"

  - id: PSL-CONTRACTS
    name: prompt-output-contracts
    file: .supervisor/prompts/prompt-output-contracts.md
    description: "Reference document for all stage output formats"
    stage: reference
    mode: documentation
    inputs: []
    outputs: []
    output_schema: null
    successor_rules: []
    validation_rules: []

  - id: PSL-ADAPTER
    name: project-adapter-template
    file: .supervisor/prompts/project-adapter-template.md
    description: "Template for adapting the loop to other projects"
    stage: reference
    mode: documentation
    inputs: []
    outputs: []
    output_schema: .supervisor/schemas/project-adapter-contract.schema.json
    successor_rules: []
    validation_rules: []

# Operational prompts — from Espanso integration (2026-07-03)
# Source: C:\Users\prora\AppData\Roaming\espanso\match\format-factory.yml
# Provenance map: .supervisor/prompts/espanso-provenance-map.yaml
# These prompts address genuine capability gaps not covered by the 103 existing capabilities.
operational_prompts:
  - id: ESP-PROMPT-1
    name: bounded-executor
    file: .supervisor/prompts/bounded-executor.md
    description: "Short-context one-taskcard-at-a-time executor with repository-persisted state"
    stage: execution
    mode: bounded_execution
    inputs:
      - .local/supervisor/active-plan-lock.json
      - plans/.claude/<active-plan>.md
    outputs:
      - .local/supervisor/bounded-exec-checkpoint.json
      - updated plan file (taskcard status)
    output_schema: null
    successor_rules:
      - condition: "taskcard status == DONE and more PENDING taskcards remain"
        next: ESP-PROMPT-1
      - condition: "all taskcards DONE"
        next: null
    validation_rules:
      - "must update taskcard status in plan file before stopping"
      - "must not mark DONE without passing done-check"
      - "must write checkpoint to .local/supervisor/bounded-exec-checkpoint.json"
    espanso_source_trigger: ":ff-execute-short-context-plan"
    espanso_gap_id: GAP-ESP-002

  - id: ESP-PROMPT-2
    name: readme-governance
    file: .supervisor/prompts/readme-governance.md
    description: "Root README forensic investigation and preservation-first enhancement"
    stage: maintenance
    mode: mutation
    inputs:
      - README.md
      - .governance/capabilities/registry.yaml
      - registry/format-registry.yaml
      - .supervisor/skill-registry.yaml
    outputs:
      - README.md (updated in-place)
    output_schema: null
    successor_rules:
      - condition: "all claims verified and updates applied"
        next: null
    validation_rules:
      - "must read README.md before any mutation"
      - "must not replace README from scratch"
      - "must not remove human-authored context without evidence it is false"
      - "must not commit without explicit user approval"
    espanso_source_trigger: ":ffreadme"
    espanso_gap_id: GAP-ESP-001

  - id: ESP-PROMPT-3
    name: expert-review-plan
    file: .supervisor/prompts/expert-review-plan.md
    description: "Plan-mode-only expert manual system review — produces review plan, no source mutations"
    stage: planning
    mode: plan_only
    inputs:
      - src/python/ (read-only)
      - src/net/ (read-only)
      - .supervisor/ (read-only)
      - tools/supervisor/ (read-only)
    outputs:
      - reports/expert-manual-system-review/review-plan-<sprint_id>.md
      - reports/expert-manual-system-review/gap-matrix-<sprint_id>.yaml
    output_schema: null
    successor_rules:
      - condition: "review plan complete"
        next: null
    validation_rules:
      - "MUST NOT edit src/ or tests/"
      - "MUST NOT commit or push"
      - "MUST NOT approve Gate 8 or Gate 11"
      - "output must include gap_type and heal_system_first fields for each gap"
    espanso_source_trigger: ":ff-expert-review-plan"
    espanso_gap_id: GAP-ESP-007

  - id: ESP-PROMPT-4
    name: found-it-own-it
    file: .supervisor/prompts/found-it-own-it.md
    description: "Issue ownership enforcement protocol — when you discover it, you own it"
    stage: cross_cutting
    mode: policy_and_workflow
    inputs:
      - any discovered issue (failed test, broken fixture, schema violation, etc.)
    outputs:
      - taskcard in active plan or .local/evidences/<run_id>/
      - regression test or validator update
    output_schema: null
    successor_rules:
      - condition: "issue healed and verified"
        next: null
      - condition: "issue BLOCKED by external"
        next: null
    validation_rules:
      - "must not skip BLOCKING issues discovered during execution"
      - "must not mark sprint complete with known BLOCKING issues open"
      - "must produce a taskcard, not just a prose note"
    espanso_source_trigger: ":found-it-own-it"
    espanso_gap_id: GAP-ESP-003

  - id: ESP-PROMPT-5
    name: machinery-iteration-forensics
    file: .supervisor/prompts/machinery-iteration-forensics.md
    description: "Diagnose and repair lifecycle iteration failures in machinery plans"
    stage: diagnostics
    mode: repair
    inputs:
      - .local/supervisor/continuation-signal.json
      - .local/supervisor/active-plan-lock.json
      - .local/supervisor/lifecycle-audit-results.json
      - reports/supervisor/approval-gates.md
    outputs:
      - repaired continuation-signal.json or plan-lock
      - evidence of one additional lifecycle iteration
    output_schema: null
    successor_rules:
      - condition: "check_continuation.py returns CONTINUE"
        next: null
    validation_rules:
      - "must classify root cause into named category before applying repair"
      - "must run check_continuation.py after repair to confirm CONTINUE"
      - "must not suppress the underlying machinery failure"
    espanso_source_trigger: ":ff-machinery-iteration-forensics"
    espanso_gap_id: GAP-ESP-004

  - id: ESP-PROMPT-6
    name: human-free-rectification
    file: .supervisor/prompts/human-free-rectification.md
    description: "Scan governance files and remove unjustified human-required language"
    stage: governance_repair
    mode: mutation
    inputs:
      - AGENTS.md
      - CLAUDE.md
      - docs/governance/**
      - .supervisor/prompts/**
    outputs:
      - modified governance files
      - reports/human-free-audit/scan-results-<date>.yaml
      - reports/human-free-audit/repair-log-<date>.md
    output_schema: null
    successor_rules:
      - condition: "all files scanned and defects repaired"
        next: null
    validation_rules:
      - "must not remove genuine external gates (Gate 11, credentials, branch protection)"
      - "must classify each finding as GOVERNANCE_DEFECT or TRUE_EXTERNAL_GATE before editing"
      - "must write repair log to reports/human-free-audit/"
    espanso_source_trigger: ":ff-humanfree"
    espanso_gap_id: GAP-ESP-008

  - id: ESP-PROMPT-7
    name: layer-hardening-template
    file: .supervisor/prompts/layer-hardening-template.md
    description: "Parameterized per-layer production hardening — accepts layer_id 0-7 or 'all'"
    stage: hardening
    mode: mutation
    inputs:
      - layer_id: "0|1|2|3|4|5|6|7|all"
      - relevant layer files (varies by layer_id)
    outputs:
      - .local/evidences/<run_id>/layer-<layer_id>-gap-ledger.yaml
      - repaired layer files
    output_schema: null
    successor_rules:
      - condition: "all BLOCKING gaps resolved"
        next: null
      - condition: "layer_id=all and current layer complete"
        next: ESP-PROMPT-7
    validation_rules:
      - "must build gap ledger before executing repairs"
      - "must run done-check for each taskcard"
      - "must not use destructive git operations"
    espanso_source_triggers:
      - ":ffl0:"
      - ":ffl1:"
      - ":ffl2:"
      - ":ffl3:"
      - ":ffl4:"
      - ":ffl5:"
      - ":ffl6:"
      - ":ffl7:"
      - ":ffla:"
    espanso_gap_id: GAP-ESP-005

  - id: ESP-PROMPT-8
    name: production-standards-enforcement
    file: .supervisor/prompts/production-standards-enforcement.md
    description: "Master governance + production code quality checklist enforcement sprint"
    stage: governance_and_product
    mode: mutation
    inputs:
      - docs/code-quality/production-library-standard-v2.md
      - src/python/ (audit then repair)
      - src/net/ (audit then repair)
      - registry/source-structure-baseline.json
    outputs:
      - new or updated governance validators
      - src/ files with violations fixed
      - evidence of governance machinery detecting violations
    output_schema: null
    successor_rules:
      - condition: "all checklist items covered by governance and all validators pass"
        next: null
    validation_rules:
      - "MUST NOT heal product code before governance machinery is proven"
      - "MUST NOT increase baseline_loc_cap values (write-once)"
      - "must build checklist (Phase 1) before any mutations"
    espanso_source_trigger: ":ffmgh:"
    espanso_gap_id: GAP-ESP-006

