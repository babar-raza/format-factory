---
# Skill Quality Matrix
# Mission: SKILL-FIRST-001 / Plan: cached-growing-snail
# Generated: TC-SF-005
# Grading scale: 0=absent/unsafe 1=one-time/undocumented 2=partial/weakly-repeatable
#                3=usable-with-material-gaps 4=strong-and-governed 5=complete/composable/proven
# Weak threshold: overall_grade < 3 → repair_required: true
# Grade basis: detailed (20 dimensions) for 8 priority skills; summary for all others

grading_rubric:
  0: absent or unsafe
  1: one-time or undocumented
  2: partial and weakly repeatable
  3: usable with material gaps
  4: strong and governed
  5: complete, composable, enforced, and proven

note: |
  All 51 prompt-backed skills score 0 on 'determinism' and 1 on 'idempotency'
  by definition — LLM output is non-deterministic. These scores reflect a
  structural limitation of the current architecture, not individual skill quality.
  Python-backed tools (tools/supervisor/*.py) are excluded from this matrix
  as they are graded separately via run-skill-idempotency.

skills:

  # ============================================================
  # PRIORITY SKILLS — grade_basis: detailed (20 dimensions)
  # ============================================================

  - skill_id: autonomous-loop
    grade_basis: detailed
    dimensions:
      responsibility_cohesion: 4     # clear purpose; sprint loop is cohesive
      contract_clarity: 4            # 299 lines; step-by-step with hard-stop enumeration
      input_validation: 3            # checks continuation signal + plan lock
      output_contract: 3             # produces sprint output + evidence (not schema-validated)
      determinism: 1                 # LLM-backed; output varies per invocation
      idempotency: 2                 # loop restarts from state files; mostly safe
      preservation_safety: 4         # explicit non-overridable STOP conditions (SESSION_MISMATCH etc.)
      downgrade_protection: 4        # V42/V48/V50 validators fire during each cycle
      error_handling: 4             # GOV_BLOCK, exit 3, exit 9 all handled
      recovery_rollback: 3           # resumes from .local/supervisor/ state files
      evidence: 4                    # evidence declaration + review package required
      focused_tests: 2               # no unit tests for the command file itself
      integration_tests: 3           # supervisor test suite covers cycle logic
      discoverability: 4             # registered in skill-registry + command-registry
      documentation: 4              # comprehensive inline documentation
      composition_quality: 3         # orchestrates sub-skills but mixes orchestration + config
      consumer_adoption: 5           # used every sprint
      maintainability: 3             # 299 lines; large but structured
      runtime_enforcement: 3         # governance validators fire; plan lock enforced
    overall_grade: 3
    weak_flag: false
    repair_required: false
    repair_taskcard_id: null
    notes: "Strong orchestration skill. Idempotency limited by LLM non-determinism (structural). Composition quality improvable by extracting config into separate file."

  - skill_id: post-sprint-audit
    grade_basis: detailed
    dimensions:
      responsibility_cohesion: 3     # single clear purpose (stage1 audit)
      contract_clarity: 2            # 62 lines; defers entirely to prompt1-post-sprint-audit.md
      input_validation: 1            # no preconditions checked; assumes files exist
      output_contract: 2             # lists filenames; no schema validation of output
      determinism: 1                 # 100% LLM-backed
      idempotency: 1                 # second run overwrites first with different LLM output
      preservation_safety: 2         # audit-only; can't damage source; overwrites its own outputs
      downgrade_protection: 3        # audit outputs are evidence-only; don't govern source
      error_handling: 1              # no error cases documented
      recovery_rollback: 1           # no recovery path
      evidence: 3                    # produces stage1-issue-model.json + stage1-sprint-audit-summary.md
      focused_tests: 1               # no tests
      integration_tests: 2           # implicitly exercised by sprint suite
      discoverability: 4             # in command-registry + skill-registry
      documentation: 2              # thin; depends entirely on external prompt file
      composition_quality: 3         # correctly composed by post-sprint-loop
      consumer_adoption: 5           # used every sprint
      maintainability: 4             # small file; easy to modify
      runtime_enforcement: 2         # no validators wired to audit outputs
    overall_grade: 2
    weak_flag: true
    repair_required: true
    repair_taskcard_id: TC-SF-REPAIR-post-sprint-audit
    notes: "WEAK. Thin wrapper around prompt1. No contract, no preconditions, no error handling, no idempotency. Repair: inline precondition checks, add output schema validation, add error path documentation."

