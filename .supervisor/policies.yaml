# Local Supervisor Control Plane — Governance Policies
# Format Factory — Dual Orchestration
# These policies enforce Format Factory governance within the supervisor layer.

# ============================================================
# AUTHORITY POLICIES
# ============================================================

authority:
  # Format Factory repo is final authority — supervisor is advisory only
  supervisor_overrides_registry: false
  supervisor_overrides_master_plan: false
  supervisor_overrides_taskcards: false
  supervisor_overrides_evidence: false
  supervisor_may_write_to:
    - reports/supervisor/
    - .supervisor/project-memory.md
    - .supervisor/state/

  # Forbidden writes
  supervisor_must_not_write_to:
    - AGENTS.md
    - GOVERNANCE.md
    - plans/master-plan.md
    - registry/format-registry.yaml
    - tools/evidence/
    - tests/evidence/

# ============================================================
# NO-DRIFT STATE CONTRACT
# ============================================================

no_drift:
  # Task Master "done" status does NOT imply Format Factory gate closed
  task_master_done_implies_gate_closed: false

  # Ruflo lane "complete" does NOT imply evidence accepted
  ruflo_complete_implies_evidence_accepted: false

  # Supervisor verdict is advisory — only validated evidence is accepted
  supervisor_verdict_is_authoritative: false

  # If TM marks task done but evidence fails → TM reverts to evidence-blocked
  tm_done_plus_evidence_fail_action: revert_to_evidence_blocked

  # Ruflo memory contradicting FF registry → marked stale, ignored
  ruflo_memory_contradicts_registry_action: mark_stale_ignore

  # Supervisor next-sprint.md = input to next sprint, NOT authority
  next_sprint_md_is_authority: false
  next_sprint_md_is_sprint_input: true

# ============================================================
# CONTRADICTION DETECTION POLICIES
# ============================================================

contradiction_detection:
  # Severity levels: CRITICAL (stops autonomous loop), WARNING (logged), INFO (advisory)

  critical_conditions:
    - tests_failed_when_contract_requires_pass
    - pending_markers_in_final_state
    - gate_claimed_closed_without_evidence
    - evidence_bundle_sha_mismatch

  warning_conditions:
    - sprint_id_mismatch_between_contract_and_bundle
    - stale_sha_in_verdict
    - missing_taskcard_reference_in_export

  info_conditions:
    - timestamp_only_differences_in_replay

  zero_contradictions_output: "No contradictions detected."
  critical_action: stop_autonomous_loop_report_to_human
  warning_action: log_and_continue

# ============================================================
# APPROVAL GATE CLASSIFICATION
# ============================================================

approval_gate_classifier:
  outcomes:
    autonomous_continue:
      condition: "Tests pass, evidence valid, no CRITICAL contradictions"
      action: "Proceed to next mode without human intervention"
      who_unblocks: null

    local_repair_loop:
      condition: "Minor/WARNING contradictions detected"
      action: "Run repair lanes, then re-evaluate"
      who_unblocks: Claude_Code

    stop_credentials_missing:
      condition: "Required credentials not available"
      action: "Report to user; wait for credential provision"
      who_unblocks: User

    stop_push_approval_required:
      condition: "Push or merge required"
      action: "Report; wait for user authorization"
      who_unblocks: User

    stop_gate_approval_required:
      condition: "Format Factory gate approval needed"
      action: "Report; wait for Babar Raza"
      who_unblocks: Babar_Raza

    stop_governance_conflict:
      condition: "Governance conflict not resolvable locally"
      action: "Report; wait for user"
      who_unblocks: User

    stop_paid_api_not_available:
      condition: "Component requires paid OpenAI API"
      action: "Report; skip component; use local alternative"
      who_unblocks: User

    stop_destructive_action:
      condition: "Destructive operation required"
      action: "Report; wait for explicit user approval"
      who_unblocks: User

# ============================================================
# MEMORY SYNC POLICIES
# ============================================================

memory_sync:
  # Only append to project-memory.md — never overwrite history
  append_only: true

  # Mark entries stale if sprint_id is more than 3 sprints behind
  stale_threshold_sprints: 3

  # Idempotent: same sprint_id + bundle_hash = no duplicate entry
  idempotent: true

  # Forbidden targets
  must_not_write_to:
    - AGENTS.md
    - GOVERNANCE.md
    - plans/master-plan.md
    - registry/format-registry.yaml

# ============================================================
# PRODUCT-FACTORY DIRECTION POLICIES (R85+)
# ============================================================

product_factory:
  # Core direction: evidence is support, product is goal
  product_factory_direction_required: true
  evidence_supports_product_not_finish_line: true

  # POC targets required
  poc_targets_required: true
  commercial_net_products_required: 3
  foss_reduced_products_required: 3
  poc_matrix_file: product-capability-matrix/poc-targets.yaml

  # Product claims must be backed by installed-package proof
  installed_package_proof_required_for_package_claims: true
  same_format_save_required_for_product_claims: true
  editable_object_model_required_for_product_claims: true

  # Export/dogfooding
  dogfood_export_required: true
  dogfood_export_strategy_file: docs/export/dogfood-export-strategy.md

  # Sprint success classification
  sprint_with_evidence_only_no_product_progress: PARTIAL_NOT_SUCCESS

  # Required lanes in supervisor-generated next-sprint.md
  required_next_sprint_lanes:
    - commercial_product_advancement
    - foss_reduced_product_advancement
    - dogfooding_export
    - package_install_proof
    - poc_matrix_update
    - state_memory_sync
    - supervisor_loop_trigger

  # Supervisor loop must be run on final bundle each sprint
  supervisor_loop_required_after_bundle: true
  supervisor_loop_command: "LEGACY_ONLY: python tools/supervisor/supervisor_loop.py run-on-latest --bundle <bundle>"

  # Canonical loop command (declaration-driven, replaces run-on-latest for same-worktree)
  supervisor_canonical_loop_command: "python tools/supervisor/supervisor_loop.py autonomous-cycle --declaration <declaration>"

  # R90 Product Factory Acceleration Layer
  skill_registry_file: .supervisor/skill-registry.yaml
  selected_product_gaps_file: .local/supervisor/selected-product-gaps.json
  product_code_ledger_file: reports/r90/product-code-change-ledger.json
  src_edit_rule: "No direct ad-hoc src edits. Use a governed skill or generated execution handoff."
  src_change_ledger_validation_required: true
  capability_progress_detection_required: true

# ============================================================
# DECLARATION PROTOCOL (added by supervisor-evidence-directory sprint)
# ============================================================

declaration_protocol:
  # Canonical evidence unit is a directory, not a ZIP
  canonical_evidence_unit: directory
  evidence_root_pattern: ".local/evidences/<run_id>/"
  declaration_file: "evidence-declaration.yaml"
  manifest_file: "evidence-manifest.yaml"

  # ZIP is optional — only for export/archive/external transfer
  zip_required: false
  zip_optional_uses:
    - external_upload_or_transfer
    - archival
    - delivery_package_inspection
    - cross_machine_transfer

  # Watcher/discover/latest-ZIP are legacy convenience
  watcher_required: false
  discover_latest_required: false
  run_on_latest_is_legacy: true

  # Declaration must exist before supervisor inspects
  declaration_must_precede_inspection: true

  # Supervisor inspects declared paths in the worktree
  same_worktree_inspection: true

# ============================================================
# AUTONOMOUS CONTINUATION POLICY (added by supervisor-evidence-directory sprint)
# ============================================================

autonomous_continuation:
  # Critical rework blocks autonomous continuation
  critical_grades:
    - OVERCLAIMED
    - REJECTED

  # Non-critical rework does not block
  non_critical_grades:
    - REWORK_REQUIRED
    - ACCEPTED_WITH_WARNINGS

  # Decision rule
  autonomous_continue_rule: "critical_rework_count == 0"

  # Exit codes
  exit_code_success: 0
  exit_code_invalid_declaration: 1
  exit_code_critical_rework: 3
  exit_code_error: 9

  # External gates do not block autonomous continuation
  external_gates_block_autonomous: false

  # R91: rework lanes continue safe lanes; inherited failures don't stop continuation
  rework_continues_safe_lanes: true
  inherited_failure_isolation: true
  stop_conditions:
    - external_gate
    - credentials
    - git_push_or_publication
    - destructive_action
    - test_baseline_failure_blocking_product_truth
    - no_progress_threshold_exceeded
    - max_iterations

  # Continuation signal modes (R91+):
  #   true            — all accepted, pure new-work sprint
  #   true_with_rework — rework items but safe lanes continue
  #   false           — hard stop
  continuation_signal_modes:
    - true
    - true_with_rework
    - false

  # Continuous loop settings (MODE 5+)
  # R98: Raised from 5 to 12 with checkpoint safeguards
  max_iterations: 12

  # Failure exclusion window (TC-HB-FOLLOW-003):
  # Number of sprints a gap_id is suppressed from task selection after escalation.
  # Increase to suppress longer; decrease to retry sooner. Tunable without source edits.
  failure_exclusion_window_sprints: 3
  checkpoint_every: 3
  max_dirty_files_before_checkpoint: 75
  max_src_files_changed_before_checkpoint: 12
  max_consecutive_accept_with_limitations: 2
  max_consecutive_no_product_gap_closure: 2
  no_progress_max_consecutive: 2
  no_progress_dimensions:
    - load
    - edit
    - save
    - export
    - dogfood
    - package_install
    - examples_docs
    - tests
    - capability_matrix_status
  iteration_reset_on_human_intervention: true

  # Hard prohibitions (never autonomous)
  hard_prohibitions:
    - git_push
    - package_publication
    - gate_8_approval
    - gate_11_approval
    - mcp_activation_beyond_mode_3
    - destructive_git_operations

# ============================================================
# PRODUCT-FACTORY APPROVAL GATE ADDITIONS (R85+)
# ============================================================

product_factory_gates:
  stop_commercial_approval_required:
    condition: "Gate 11 G11-G approval required for commercial product release"
    who_unblocks: Babar_Raza

  stop_publication_approval_required:
    condition: "PyPI/NuGet/GitHub release publication required"
    who_unblocks: Babar_Raza

  stop_mcp_activation_required:
    condition: "MCP server activation required (Task Master, Ruflo daemon)"
    who_unblocks: Babar_Raza

  autonomous_product_deepening_continue:
    condition: "Product POC deepening work (load/edit/save/export/dogfood) with no gate approval needed"
    action: "Proceed autonomously"
    who_unblocks: null
