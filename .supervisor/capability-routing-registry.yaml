---
version: "1.0"
created_at: "2026-06-24"
mission_id: SKILL-FIRST-001
plan_id: cached-growing-snail
authority: ".supervisor/skill-first-policy.md Rule 3"
note: >
  Schema-rich routing registry. 30 routes covering all operation types in the
  Format Factory governed execution model. Each route has a stable route_id.
  Machine-readable lookup authority: preferred_skill_ids[0] is the primary skill.
  Agents must query this file before any mutating work (see skill-first-policy.md Rule 3).
  Source of truth for route resolution; work-type-skill-map.yaml is the compact
  machine-readable equivalent for fast lookups.

skill_route_schema:
  route_id: string                   # stable, snake_case, unique
  description: string                # human-readable operation description
  preferred_skill_ids: list[string]  # registered skill IDs, primary first
  fallback_skill_ids: list[string]   # optional fallbacks
  current_status: ROUTE_ACTIVE | MISSING_SKILL_CAPABILITY
  gap_id: string | null              # if MISSING_SKILL_CAPABILITY, references gap-ledger.json
  required_handoff_fields: list[string]  # fields required in skill invocation handoff
  evidence_path_pattern: string      # where outputs land

routes:

  - route_id: status_and_recon
    description: >
      Read current project state — session resume, approval gates, plan lock,
      continuation signal, evidence review. Produces context pack for next decision.
    preferred_skill_ids:
      - reproduce-master-plan
      - build-context-pack
    fallback_skill_ids: []
    current_status: ROUTE_ACTIVE
    gap_id: null
    required_handoff_fields:
      - skill_id
    evidence_path_pattern: "reports/supervisor/"

  - route_id: plan_creation
    description: >
      Create a new plan or taskcard from a problem statement, gap entry, or
      strategic objective. Produces a governed plan file.
    preferred_skill_ids:
      - create-taskcard
      - plan-hardening
    fallback_skill_ids: []
    current_status: ROUTE_ACTIVE
    gap_id: null
    required_handoff_fields:
      - skill_id
      - plan_path
    evidence_path_pattern: "plans/"

  - route_id: plan_hardening
