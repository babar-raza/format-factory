    evidence_path_pattern: ".local/capability-consumer/taskcards/"
    note: >
      Added TC-EXT-009-02 (2026-07-14): closes SKILL-GAP-003, previously tracked as
      an open gap in work-type-skill-map.yaml, skill-system-baseline.yaml, and
      skill-registry.yaml missing_skill_workflow.known_open_gaps (see TC-EXT-009-03).

  - route_id: skills_first_control
    description: >
      Audit and enforce the Skills-First Control system: skill/command cross-registry
      parity, execution-manifest validity, and the fail-closed closeout evidence gate.
      Added 2026-07-16 by the Skills-First Control sprint as the governed resolution of
      a real skill gap (no prior route owned SFC consistency; nearest match
      root_readme_governance -> sync-readmes was rejected by the extend-vs-create rubric).
    preferred_skill_ids:
      - skills-first-audit
    fallback_skill_ids:
