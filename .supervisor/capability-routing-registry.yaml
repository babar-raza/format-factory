      Convert audit findings (partially_done, not_attempted, claimed_unproven,
      risk_not_reduced) into governed taskcards with status tracking.
    preferred_skill_ids:
      - plan-hardening
      - execution-handoff
    fallback_skill_ids: []
    current_status: ROUTE_ACTIVE
    gap_id: null
    required_handoff_fields:
      - skill_id
      - plan_path
      - audit_findings_path
    evidence_path_pattern: "plans/"

  - route_id: taskcard_generation
    description: >
      Generate a taskcard from a gap ledger entry or informal problem statement.
      Produces a YAML taskcard with owned fields, acceptance criteria, and evidence paths.
    preferred_skill_ids:
      - create-taskcard
      - promote-gap-to-taskcard
    fallback_skill_ids: []
    current_status: ROUTE_ACTIVE
    gap_id: null
    required_handoff_fields:
      - skill_id
      - gap_id
    evidence_path_pattern: ".local/taskcards/"

  - route_id: taskcard_execution
    description: >
      Execute a governed taskcard through the autonomous sprint loop.
      Runs closeout, declaration, grading, and continuation check.
    preferred_skill_ids:
      - autonomous-loop
      - execution-handoff
    fallback_skill_ids: []
    current_status: ROUTE_ACTIVE
    gap_id: null
    required_handoff_fields:
      - skill_id
      - taskcard_id
    evidence_path_pattern: ".local/evidences/"

