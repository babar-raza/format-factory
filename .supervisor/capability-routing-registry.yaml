    fallback_skill_ids: []
    current_status: ROUTE_ACTIVE
    gap_id: null
    required_handoff_fields:
      - capability_description
      - operation_type
      - search_results
      - rejection_reasons
    evidence_path_pattern: ".local/taskcards/SKILL-GAP-*.yaml"
    note: >
      Added TC-SGOV-W4-001 (2026-07-11): closes the UNREGISTERED finding from
      validate_plan_skill_routes.py run on imperative-floating-book.md.

  - route_id: capability_compiler
    description: >
      Compile capability gap records into feature IRs, executable taskcards, and
      supporting obligation/graph/gate-readiness artifacts. Resolves SKILL-GAP-003.
      Pipeline tool — invoked automatically every sprint by
      tools/supervisor/capability_queue_consumer.py (autonomous_cycle.py Step 2h),
      not a manually-triggered workflow.
    preferred_skill_ids:
      - capability-compiler
    fallback_skill_ids: []
    current_status: ROUTE_ACTIVE
    gap_id: null
    required_handoff_fields:
      - gap_record
