skill_agent_surface_schema:
  # TC-ACP-002 (FF-AGENTS-PARITY-001, 2026-07-12): agent surface opt-in fields.
  # These are OPTIONAL top-level fields on any skill entry.
  # If absent, the surface defaults to false (opt-in, not opt-out).
  codex_supported:
    type: boolean
    default: false
    description: >
      Set to true only if this skill has been verified to work correctly when invoked
      via a Codex-family agent (e.g., via codex CLI or OpenAI Codex API).
      Default false — most skills are claude-code-only until explicitly verified.
    classification_rule: >
      TC-ACP-008-03: A skill gets codex_supported: true if ALL conditions hold:
      (1) command file does not reference VSCode plan-mode mechanics (EnterPlanMode tool),
      (2) command file does not require the Skill tool to invoke sub-skills,
      (3) skill is not in blocked_capabilities from codex-bundle.yaml (i.e., RC-016/RC-017),
      (4) skill operations can be performed via file-read + script-execution only.
      Per-skill classification is DEFERRED_PENDING_CODEX_INSTANTIATION (2026-07-13).
      Codex has not been instantiated; parity claims are COMPLETE_UNVERIFIED until live run.
  kilo_supported:
    type: boolean
    default: false
    description: >
      Set to true only if this skill has been verified to work correctly when invoked
      via Kilo (or equivalent custom agent platform).
      Default false — Kilo has no KILO.md or skill dispatch mechanism as of 2026-07-12.
