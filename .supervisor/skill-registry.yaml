  pre_execution_requirements:
  - name: qname_authority
    description: 'Identify the ODF/format QName or spec fact that authorizes this
      API. If no QName exists, the API may not be created.

      '
    required: true
  - name: owning_type
    description: 'Confirm the API belongs on the listed type (not root document if
      it is a cell/row/column property).

      '
    required: true
  - name: parser_connection
    description: 'Identify where in the parser/XDocument the value is read. The getter
      must read from XDocument via Attribute()/FodsStyleResolver.

      '
    required: true
  - name: writer_obligation
    description: 'If the API mutates state, identify how the mutation reaches XML.
      Setter must call SetAttributeValue/FodsStyleEditor.

      '
    required: true
  - name: roundtrip_test
    description: 'A Type 4 test (Set -> ToFodsXml -> LoadFromXml -> Get -> Assert)
      must be planned before the setter task closes.

      '
    required: true
  forbidden_patterns:
  - implementing a method that returns a constant (0, false, empty) as sole body
  - creating a private dictionary field to back a persistent document property
  - adding a public API whose only consumer is a test
  - using TODO implement later as sole method body
