      reject_if_missing: true
    canonical_owning_type:
      required: true
      description: Canonical model type from QName hierarchy (e.g. Table.TableCell)
    target_folder:
      required: true
      description: Target folder per qname-code-organization-plan.yaml (e.g. src/net/fods/Model/Table/)
    target_file:
      required: true
      description: Target filename — must NOT be MissingMethods, ExtendedApis, Misc,
