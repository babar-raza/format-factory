# Naming convention (decided PYREL-001, 2026-07-06):
#   PyPI name:   format-factory-{format_id}  (e.g. format-factory-fods)
#   Import name: {format_id}                  (e.g. import fods)
#   Tag format:  {format_id}-v{semver}         (e.g. fods-v0.1.0)
#
# install_proof blocks (GAP-FORENSIC-001 heal, 2026-07-15):
#   Consumed by tools/run_package_install_proof.py, the matrix-driven proof test
#   (tests/python/packaging/test_package_install_proof_all_formats.py), and the
#   package-install-proof coverage governance validator. Every entry MUST have one;
#   the validator blocks on omission. smoke_sample paths are repo-relative.
#   expected: dict | list | bytes | object (object = any non-None instance).
