[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-ods"
version = "0.1.0"
description = "Format Factory ODS (OpenDocument Spreadsheet) FOSS Python parser, writer, and exporter"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

readme = "README.md"
authors = [
    {name = "Format Factory", email = "formatfactory@aspose.com"},
]
keywords = ["format-factory", "ods", "opendocument", "spreadsheet", "odf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/format-factory/format-factory"
Repository = "https://github.com/format-factory/format-factory"
"Bug Tracker" = "https://github.com/format-factory/format-factory/issues"


[project.scripts]
ff-ods = "ods.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["ods*"]
