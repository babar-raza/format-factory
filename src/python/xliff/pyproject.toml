[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-xliff"
version = "0.1.0.dev0"
description = "Format Factory XLIFF FOSS Python parser and writer"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

readme = "README.md"
authors = [
    {name = "Format Factory", email = "formatfactory@aspose.com"},
]
keywords = ["format-factory", "xliff", "localization", "translation", "oasis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/format-factory/format-factory"

[project.scripts]
ff-xliff = "xliff.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["xliff*"]
