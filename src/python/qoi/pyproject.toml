[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-qoi"
version = "0.1.0"
description = "Format Factory QOI (Quite OK Image) FOSS Python parser and encoder"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = [".."]
include = ["qoi*"]
