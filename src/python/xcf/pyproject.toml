[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-xcf"
version = "0.1.0"
description = "Format Factory XCF (GIMP Native Image) FOSS Python parser"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = [".."]
include = ["xcf*"]
