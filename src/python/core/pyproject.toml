# visibility: generated
# generated_by: codex
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-core"
version = "0.1.0.dev0"
description = "Shared diagnostics, limits, errors, and protocols for Format Factory libraries"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Format Factory", email = "formatfactory@aspose.com"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

# core had no optional-dependencies at all, so even pytest was undeclared for
# tests/python/core. Found by the same audit that caught two omissions in ipynb
# and one in safetensors. core stays dependency-free at runtime -- this group is
# test-only and must not grow runtime requirements.
[project.optional-dependencies]
test = ["pytest>=8.3", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://github.com/format-factory/format-factory"
Repository = "https://github.com/format-factory/format-factory"
Security = "https://github.com/format-factory/format-factory/security/policy"

[tool.setuptools.packages.find]
where = ["src"]
include = ["format_factory.core*"]
namespaces = true

[tool.setuptools.package-data]
"format_factory.core" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["../../../tests/python/core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
