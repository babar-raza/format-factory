[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "format-factory-safetensors"
version = "0.2.0.dev0"
description = "Bounded, framework-neutral SafeTensors reader and writer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Format Factory"}]
dependencies = ["format-factory-core==0.1.0.dev0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
torch = ["torch>=2.2"]
# pyyaml is imported by test_safetensors_compat.py and was undeclared. Found by
# the same audit that caught two such omissions in ipynb: the shared dev venv
# happens to provide it, so the gap only appears in a clean install, where the
# import fails at COLLECTION and silently takes the whole test file out of the
# run rather than failing loudly.
test = ["pytest>=8.3", "hypothesis>=6.100", "pyyaml>=6.0"]

[project.scripts]
ff-safetensors = "format_factory.safetensors.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["format_factory.safetensors*"]
namespaces = true

[tool.setuptools.package-data]
"format_factory.safetensors" = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["format_factory.safetensors"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "torch", "torch.*"]
follow_imports = "skip"
ignore_missing_imports = true
