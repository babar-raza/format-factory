[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-pbm"
version = "0.1.0"
description = "Format Factory PBM (Portable Bitmap) FOSS Python parser and writer"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = [".."]
include = ["pbm*"]
