[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-dif"
version = "0.1.0"
description = "Format Factory DIF (Data Interchange Format) FOSS Python parser and writer"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = [".."]
include = ["dif*"]
