[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-zst"
version = "0.1.0.dev0"
description = "Format Factory ZST (Zstandard) FOSS Python codec"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["zstandard>=0.21"]

[tool.setuptools.packages.find]
where = [".."]
include = ["zst*"]
