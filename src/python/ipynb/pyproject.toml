[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "format-factory-ipynb"
version = "0.2.0.dev0"
description = "Bounded Jupyter Notebook parser, model, validator, and writer"
license = "Apache-2.0"
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"

readme = "README.md"
authors = [
    {name = "Format Factory", email = "formatfactory@aspose.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

dependencies = [
    "format-factory-core==0.1.0.dev0",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
reference = ["nbformat==5.10.4"]
# nbformat is the official Jupyter reference implementation and is this format's
# independent oracle. Nine obligation test files import it. It was previously
# undeclared, so a fresh environment lost all nine to collection errors while the
# capability reconciler still counted them as "TESTED" because the files existed.
# It is a test-only dependency: the shipped package must not require it.
# pyyaml is used by test_obligation_corpus_integrity.py and was undeclared for
# the same reason nbformat was: the shared dev venv happens to have it, so the
# omission only surfaces in a clean install. Found by the isolated-wheel proof,
# which is precisely the run these declarations exist to keep green.
test = ["pytest>=8.3", "hypothesis>=6.100", "nbformat>=5.10", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/format-factory/format-factory"
Repository = "https://github.com/format-factory/format-factory"
Security = "https://github.com/format-factory/format-factory/security/policy"

[project.scripts]
ff-ipynb = "format_factory.ipynb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["format_factory.ipynb*"]
namespaces = true

[tool.setuptools.package-data]
"format_factory.ipynb" = ["py.typed"]
"format_factory.ipynb.validation" = ["schemas/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["format_factory.ipynb"]
