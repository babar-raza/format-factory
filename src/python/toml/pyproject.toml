[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-toml"
version = "0.1.0"
description = "Format Factory TOML FOSS Python codec"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "tomli>=1.1.0; python_version < '3.11'",
]

readme = "README.md"
authors = [
    {name = "Format Factory", email = "formatfactory@aspose.com"},
]
keywords = ["format-factory", "toml", "configuration", "config"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/format-factory/format-factory"
Repository = "https://github.com/format-factory/format-factory"
"Bug Tracker" = "https://github.com/format-factory/format-factory/issues"

[project.scripts]
ff-toml = "toml.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["toml*"]
