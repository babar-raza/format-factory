[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-factory-ubl"
version = "0.1.0.dev0"
description = "Format Factory OASIS UBL FOSS Python parser and writer"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

readme = "README.md"
authors = [
    {name = "Format Factory", email = "formatfactory@aspose.com"},
]
keywords = ["format-factory", "ubl", "oasis", "invoice", "e-invoicing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/format-factory/format-factory"

[project.scripts]
ff-ubl = "ubl.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["ubl*"]
