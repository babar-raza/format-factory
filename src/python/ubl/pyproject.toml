[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "format-factory-ubl"
version = "0.2.0.dev0"
description = "Bounded OASIS UBL 2.3 model, reader, validator, and writer"
license = "Apache-2.0"
requires-python = ">=3.11"

readme = "README.md"
authors = [
    {name = "Format Factory", email = "formatfactory@aspose.com"},
]
keywords = ["format-factory", "ubl", "oasis", "invoice", "e-invoicing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = ["format-factory-core==0.1.0.dev0"]

[project.optional-dependencies]
schema = ["xmlschema==4.1.0"]
test = ["pytest>=8.3", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://github.com/format-factory/format-factory"
Repository = "https://github.com/format-factory/format-factory"
Security = "https://github.com/format-factory/format-factory/security/policy"

[project.scripts]
ff-ubl = "format_factory.ubl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["format_factory.ubl*"]
namespaces = true

[tool.setuptools.package-data]
"format_factory.ubl" = ["py.typed", "_generated/root_manifest.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["format_factory.ubl"]
