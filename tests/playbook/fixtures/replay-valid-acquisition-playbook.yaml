        required: true
        description: FODS acquisition pack file (known to exist)
      - path: registry/format-registry.yaml
        required: true
        description: Format registry (known to exist)
    expected_outputs:
      - path: registry/format-registry.yaml
        description: Registry updated with FODS gate status
    validation_commands:
      - command: "python tools/evidence/validate_evidence_bundle.py --help"
